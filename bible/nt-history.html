e":"The Temple Warning Inscription","who":"Posted in Herod's temple","date":"Before AD 70; found in 1871","text":"The inscription warns that no foreigner may enter within the barrier and enclosure around the temple. Anyone caught doing so will have himself to blame for his death, which will follow.","note":"Paraphrased. Acts 21:28-29 describes a riot when people falsely accused Paul of bringing a Gentile past this barrier. The stone is now in a museum in Istanbul."},"vocab":[["Gentile","Any person who is not Jewish"],["Phoenicians","Seafaring traders from the coast north of Israel"],["Murex","Sea snail used to make expensive purple dye"],["Court of the Gentiles","The outer area of the temple open to non-Jews"]],"map":{"view":"local","places":["tyre","sidon","capernaum","caesareaphilippi"],"caption":"Tyre and Sidon lay on the Mediterranean coast, north of Galilee."},"timeline":[{"y":-332,"t":"Alexander the Great captures Tyre"},{"y":1871,"t":"The temple warning inscription is found","d":true}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What were the Phoenicians known for?","options":["Farming","Sailing, trading, and spreading the alphabet","Building pyramids","Chariot racing"],"answer":1,"why":"They were great seafarers."},{"q":"Why was purple cloth so expensive?","options":["It came from Rome","It took thousands of snails to make the dye","It was made of gold","It was illegal"],"answer":1,"why":"Murex snails produced tiny amounts."},{"q":"Who captured Tyre in 332 BC?","options":["Julius Caesar","Alexander the Great","Herod","Nebuchadnezzar"],"answer":1,"why":"After a seven-month siege."},{"q":"What did the temple warning inscription threaten?","options":["A fine","Death to foreigners who crossed the barrier","Banishment","Nothing"],"answer":1,"why":"Gentiles could not pass the barrier."},{"q":"What is a Gentile?","options":["A Roman soldier","Any non-Jewish person","A priest","A Pharisee"],"answer":1,"why":"Gentile means non-Jew."}],"assignment":"Read Ephesians 2:13-16. Write a paragraph connecting it to the temple warning inscription and to Jesus' meeting with the Canaanite woman."},{"id":"hist-16","bible":"mat-16","bibleTitle":"Who Do You Say I Am?","title":"Caesarea Philippi: City of Pan and Caesar","era":"20 BC to AD 30","intro":"Jesus asked 'Who do you say I am?' in one of the most pagan places in the region, a city full of shrines to a Greek god and to the Roman emperor.","sections":[{"h":"A Spring, a Cave, and a Greek God","p":["At the foot of Mount Hermon, a powerful spring flows from the base of a cliff. It is one of the main sources of the Jordan River. Greeks who settled in the region dedicated the cave and spring to Pan, a nature god with goat legs. The place was called Paneas (today, Banias).","Worshipers carved niches into the cliff face for statues and offerings. You can still see them today. Some people in the ancient world believed deep caves like this were openings to the underworld, which may give extra meaning to Jesus' words about 'the gates of Hades.'"]},{"h":"Temples to Caesar","p":["Around 20 BC, Herod the Great built a white marble temple there in honor of Augustus. Later, his son Philip the Tetrarch enlarged the town and renamed it Caesarea, after Caesar. People called it Caesarea Philippi ('Philip's Caesarea') to tell it apart from the Caesarea on the coast.","So in this one spot stood worship of a Greek nature god and worship of the Roman emperor as divine. It was here, surrounded by rival claims to power and worship, that Peter declared, 'You are the Messiah, the Son of the living God.'"]},{"h":"What Kind of Messiah?","p":["Many Jews expected the Messiah to be a mighty king who would defeat Rome and purify Jerusalem. That is why Peter was horrified when Jesus said he would suffer and die. A dying Messiah didn't fit anyone's expectations.","Jesus told the disciples not to tell anyone yet that he was the Messiah (Matthew 16:20). The title could easily stir up a violent revolt. He needed to show them first what kind of King he was."]}],"people":[{"name":"Philip the Tetrarch","role":"Son of Herod the Great; renamed the town Caesarea Philippi"},{"name":"Pan","role":"Greek god of shepherds and wild places, worshiped at the cave"},{"name":"Simon Peter","role":"Apostle who declared Jesus to be the Messiah"}],"source":{"title":"Psalms of Solomon 17","who":"Unknown Jewish writer","date":"About 50 BC","text":"This Jewish prayer, written after Pompey captured Jerusalem, asks God to raise up a king from David's family. It asks that he destroy unrighteous rulers, purge Jerusalem of the Gentiles who trample it, and gather a holy people whom he will lead in righteousness.","note":"Paraphrased. This is not Scripture, but it shows what many Jews in Jesus' time hoped the Messiah would do. Compare it with Jesus' words in Matthew 16:21."},"vocab":[["Paneas / Banias","The site of the cave and spring dedicated to Pan"],["Emperor worship","Honoring the Roman emperor as divine"],["Hades","Greek name for the realm of the dead"],["Confession","A public declaration of what you believe"]],"map":{"view":"local","places":["caesareaphilippi","hermon","bethsaida","capernaum"],"caption":"Caesarea Philippi sat at the foot of Mount Hermon, about 25 miles north of the Sea of Galilee."},"timeline":[{"y":-20,"t":"Herod builds a temple to Augustus at Paneas"},{"y":-2,"t":"Philip renames the town Caesarea Philippi (about 3-2 BC)"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"Which Greek god was worshiped at the cave?","options":["Zeus","Pan","Apollo","Poseidon"],"answer":1,"why":"The site was called Paneas."},{"q":"Who built a temple to Augustus there?","options":["Pontius Pilate","Herod the Great","Caesar himself","Peter"],"answer":1,"why":"Around 20 BC."},{"q":"Why was it called Caesarea 'Philippi'?","options":["Philip the apostle lived there","To tell it apart from the coastal Caesarea","It was in Philippi","It was Philip's birthplace"],"answer":1,"why":"Named after Caesar, and 'Philip's' to distinguish it."},{"q":"What river begins near Caesarea Philippi?","options":["The Nile","The Jordan","The Euphrates","The Tiber"],"answer":1,"why":"The spring is a main source of the Jordan."},{"q":"What did many Jews expect the Messiah to do?","options":["Die on a cross","Defeat Rome and purify Jerusalem","Become a priest","Leave Israel"],"answer":1,"why":"That's why Peter objected to Jesus' prediction."}],"assignment":"Draw a sketch of the cliff at Caesarea Philippi with the cave, niches, and the temple to Augustus. Label it, then write Peter's confession across the top. In a paragraph, explain why the location makes his words so striking."},{"id":"hist-17","bible":"mat-17","bibleTitle":"Glory on the Mountain","title":"Holy Mountains and the Temple Tax","era":"59 BC to AD 71","intro":"Which mountain was the Transfiguration on? And why did Peter find a coin in a fish's mouth? History helps with both.","sections":[{"h":"Tabor or Hermon?","p":["Matthew only says 'a high mountain.' Since the 300s, Christian tradition has pointed to Mount Tabor, a rounded mountain rising alone from the plain southwest of the Sea of Galilee. A church stands on its top today.","Many scholars suggest Mount Hermon instead. It is much higher, over 9,000 feet, often snow-capped, and very close to Caesarea Philippi, where the disciples had been just six days earlier. We can't be certain, and that's okay. The Gospels care more about what happened than exactly where."]},{"h":"The Half-Shekel Temple Tax","p":["Every Jewish man age 20 and older paid a half-shekel each year to support the temple (Exodus 30:13). Jews living all over the Roman world sent this money to Jerusalem. The Roman speaker Cicero complained in 59 BC about how much gold flowed from Italy and the provinces to Jerusalem every year.","The tax had to be paid in Tyrian shekels because of their high silver purity. Ironically, these coins showed the Phoenician god Melqart on one side and an eagle on the other. The coin Peter found in the fish, a stater, was worth four drachmas: exactly enough to pay the tax for two people, Jesus and Peter."]},{"h":"After the Temple Fell","p":["After the Romans destroyed the temple in AD 70, Emperor Vespasian ordered Jews to keep paying the same tax, but now to the temple of Jupiter in Rome. This special tax, called the fiscus Judaicus, was a deliberate humiliation.","Matthew's readers, who may have been paying this tax when his Gospel was written, would remember Jesus' words: God's children are free, yet they pay 'so that we may not cause offense.'"]}],"people":[{"name":"Cicero","role":"Roman statesman and speaker (106-43 BC)"},{"name":"Vespasian","role":"Roman emperor AD 69-79; created the fiscus Judaicus"},{"name":"Moses and Elijah","role":"Great Old Testament figures who appeared at the Transfiguration"}],"source":{"title":"In Defense of Flaccus (Pro Flacco)","who":"Cicero","date":"59 BC","text":"Defending a Roman governor who had seized Jewish temple money, Cicero describes how every year gold was regularly sent to Jerusalem from Italy and all the provinces. He speaks of the Jews scornfully and praises the governor for stopping the shipment.","note":"Paraphrased. This speech shows how widespread and faithful Jewish temple giving was, and how some Romans looked down on it. It also confirms the temple tax practice mentioned in Matthew 17."},"vocab":[["Transfiguration","The event when Jesus' appearance changed to show his glory"],["Half-shekel","The yearly temple tax for every Jewish man"],["Stater","A silver coin worth four drachmas, or two half-shekels"],["Fiscus Judaicus","Roman tax forced on Jews after AD 70"]],"map":{"view":"local","places":["tabor","hermon","caesareaphilippi","capernaum"],"caption":"Two possible sites of the Transfiguration: Mount Tabor and Mount Hermon."},"timeline":[{"y":-59,"t":"Cicero's speech mentions temple gold sent to Jerusalem"},{"y":71,"t":"Vespasian redirects the temple tax to Jupiter's temple in Rome (about AD 70-71)"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"Which mountain has been the traditional site of the Transfiguration since the 300s?","options":["Mount Sinai","Mount Tabor","Mount Carmel","Mount of Olives"],"answer":1,"why":"Tabor, though many suggest Hermon."},{"q":"Who paid the half-shekel tax?","options":["Every Jewish man age 20 and up","Only priests","Only Gentiles","Only the rich"],"answer":0,"why":"Exodus 30:13."},{"q":"Why were Tyrian shekels required?","options":["They were cheapest","Their silver was very pure","They had Moses on them","Rome demanded it"],"answer":1,"why":"High purity, despite their pagan images."},{"q":"How much tax did Peter's coin cover?","options":["One person","Two people","Twelve people","None"],"answer":1,"why":"A stater equals two half-shekels."},{"q":"What was the fiscus Judaicus?","options":["A Jewish festival","A Roman tax forced on Jews after AD 70","A kind of fish","A temple court"],"answer":1,"why":"It paid for Jupiter's temple."}],"assignment":"Look up pictures of a Tyrian shekel. Draw both sides and label them. Then write a paragraph on why it's surprising that the temple required a coin with a pagan god on it."},{"id":"hist-18","bible":"mat-18","bibleTitle":"The Lost Sheep and Forgiving Seventy-Seven Times","title":"Shepherds, Debts, and a King's Treasury","era":"1st century AD","intro":"Jesus' parable of the unforgiving servant uses numbers that would have made his listeners gasp. Some historical math shows why.","sections":[{"h":"The Shepherd's Life","p":["Sheep and goats provided wool, milk, cheese, meat, and leather. A flock of 100 sheep was a respectable size. Shepherds led their flocks to pasture by day and brought them into stone-walled sheepfolds at night, often counting them as they passed through the gate.","Shepherding was hard, lonely, and sometimes dangerous work, with wild animals and thieves. By Jesus' time, many people looked down on shepherds. Yet God called himself Israel's shepherd (Psalm 23), and David, Israel's greatest king, started out as one."]},{"h":"An Impossible Debt","p":["A talent was a huge amount of money, roughly 6,000 denarii, or about 20 years of wages for a laborer. The servant in Jesus' story owed 10,000 talents. In Greek, 10,000 (myrias) was the largest number with its own name, and the talent was the largest unit of money, so Jesus combined the biggest number and the biggest unit.","For comparison, Josephus reports that after Herod the Great died, the yearly tax income of his three sons' territories combined was only about 900 talents. The servant owed more than ten years of income from all of Herod's former kingdom! Meanwhile, his fellow servant owed 100 denarii, about 100 days' wages: a real amount, but tiny by comparison."]},{"h":"Debt and Slavery","p":["In the ancient world, people who couldn't pay their debts could be sold into slavery along with their families, or thrown into prison until relatives paid. 2 Kings 4:1 tells of a widow whose creditor was coming to take her two sons as slaves.","Slavery was a normal part of the Roman economy; some estimates suggest a large share of people in Italy were enslaved. Jesus' listeners understood exactly how desperate the servant was, and how shocking the king's mercy was."]}],"people":[{"name":"Archelaus, Antipas, and Philip","role":"Herod the Great's three sons who divided his kingdom"}],"source":{"title":"Jewish Antiquities, Book 17","who":"Josephus","date":"About AD 93","text":"Josephus lists the yearly revenue from Herod's divided kingdom: about 600 talents from the territory of Archelaus, 200 talents from Galilee and Perea under Antipas, and 100 talents from the lands ruled by Philip.","note":"Paraphrased. Add these up and compare them to the 10,000 talents in Matthew 18:24. Jesus deliberately described a debt no one could ever repay, a picture of our debt of sin to God."},"vocab":[["Talent","A huge unit of money, about 6,000 denarii"],["Myrias","Greek for 10,000, the largest named number"],["Sheepfold","A stone-walled pen for keeping sheep safe at night"],["Creditor","Someone to whom money is owed"]],"map":{"view":"local","places":["bethlehem","jerusalem","herodium","capernaum"],"caption":"The hills around Bethlehem have been sheep country since King David's time."},"timeline":[],"video":[],"quiz":[{"q":"About how many denarii were in a talent?","options":["10","100","6,000","1,000,000"],"answer":2,"why":"About 20 years of wages."},{"q":"Why did Jesus choose 10,000 talents?","options":["It was a normal loan","It combined the largest number and the largest money unit","It was the temple tax","It was Herod's debt"],"answer":1,"why":"It was meant to be unpayable."},{"q":"About how much yearly revenue did Herod's sons' territories bring in, combined?","options":["10,000 talents","About 900 talents","5 talents","1 million talents"],"answer":1,"why":"600 + 200 + 100."},{"q":"What could happen to someone who couldn't pay a debt?","options":["Nothing","They and their family could be sold as slaves","They became king","They were given more money"],"answer":1,"why":"Debt slavery was common."},{"q":"Where did shepherds keep sheep at night?","options":["In houses","In stone-walled sheepfolds","In the temple","Nowhere"],"answer":1,"why":"Sheepfolds protected the flock."}],"assignment":"Math challenge: If a laborer earns 1 denarius a day and works 300 days a year, how many years would it take to earn 10,000 talents (60 million denarii)? How long to earn 100 denarii? Write a sentence about what this shows about God's forgiveness."},{"id":"hist-19","bible":"mat-19","bibleTitle":"Let the Children Come","title":"Growing Up in the First Century","era":"1st century AD","intro":"The disciples thought Jesus was too important for children. To see why his welcome was so striking, we need to know how children were viewed in both the Jewish and the Roman world.","sections":[{"h":"Children in Jewish Families","p":["Jewish families saw children as a blessing from God (Psalm 127:3). Parents were commanded to teach God's words to their children at home, 'when you sit at home and when you walk along the road' (Deuteronomy 6:7). Fathers usually taught sons their trade, and mothers taught daughters to run a household.","Many boys learned to read Scripture at the synagogue. The Talmud later credits a high priest named Joshua ben Gamla (about AD 64) with requiring teachers in every town for boys from age six or seven. Students memorized huge portions of Scripture. Around age 12 or 13, a boy was considered ready to take on adult religious responsibilities, which is why the 12-year-old Jesus' visit to the temple (Luke 2) was a big moment. The bar mitzvah ceremony we know today developed much later."]},{"h":"Children in the Roman World","p":["In Roman society, a father had enormous legal power over his household, and children had very low status until they grew up. Sadly, unwanted newborns, especially girls or babies born with disabilities, were sometimes abandoned outdoors.","Jews were known for refusing to do this. Even the Roman historian Tacitus, who disliked the Jews, noted that they considered it a crime to kill any newborn child. Early Christians took the same stand and sometimes rescued abandoned babies. Jesus' welcome of little children and his words 'the kingdom of heaven belongs to such as these' helped change how the world valued children."]},{"h":"The Great Divorce Debate","p":["Matthew 19 begins with a trick question about divorce. Two schools of Pharisees disagreed about Deuteronomy 24:1. The school of Shammai said a man could divorce his wife only for serious sexual unfaithfulness. The school of Hillel said he could divorce her for almost any reason, even burning a meal.","By asking if divorce was allowed 'for any and every reason,' the Pharisees were asking Jesus to pick a side. Instead, Jesus went back to Genesis and God's original design for marriage."]}],"people":[{"name":"Joshua ben Gamla","role":"High priest (about AD 63-64) remembered for establishing schools for children"},{"name":"Tacitus","role":"Roman historian (about AD 56-120)"},{"name":"Hillel and Shammai","role":"Rival Jewish teachers whose followers debated divorce"}],"source":{"title":"Histories, Book 5","who":"Tacitus","date":"About AD 105","text":"Tacitus lists several Jewish customs that he found strange. Among them, he notes that the Jews take care to increase their numbers, and that they consider it a crime to kill any newborn child.","note":"Paraphrased. Tacitus is generally hostile to the Jews in this passage, which makes his note more striking: even an unfriendly Roman observer recognized that Jews valued every child's life."},"vocab":[["Talmud","Large collection of Jewish teaching and commentary, completed centuries after Jesus"],["Paterfamilias","The Roman father, head of a household with great legal power"],["Bar mitzvah","'Son of the commandment': the later ceremony marking a Jewish boy's religious adulthood"],["School of thought","A group of teachers and students who share an approach"]],"map":{"view":"local","places":["jordanbaptism","jericho","jerusalem","capernaum"],"caption":"In Matthew 19, Jesus left Galilee and went to 'the region of Judea to the other side of the Jordan' on his way to Jerusalem."},"timeline":[{"y":64,"t":"Joshua ben Gamla remembered for establishing schools (about AD 64)"},{"y":105,"t":"Tacitus writes his Histories (about AD 105)"}],"video":[],"quiz":[{"q":"According to Deuteronomy 6:7, where should parents teach God's words?","options":["Only at the temple","At home and along the road","Only on the Sabbath","Only at school"],"answer":1,"why":"Everywhere in daily life."},{"q":"At about what age was a Jewish boy considered ready for adult religious duties?","options":["5","12-13","20","30"],"answer":1,"why":"That's why Luke mentions Jesus at 12."},{"q":"What did Tacitus say Jews considered a crime?","options":["Eating pork","Killing any newborn child","Working on the Sabbath","Paying taxes"],"answer":1,"why":"Even a critic noticed they valued every child."},{"q":"Which school said divorce was allowed for almost any reason?","options":["Shammai's","Hillel's","The Essenes'","The Sadducees'"],"answer":1,"why":"Hillel's school was more lenient."},{"q":"How did Jesus answer the divorce question?","options":["He sided with Hillel","He sided with Shammai","He pointed back to God's design in Genesis","He refused to answer"],"answer":2,"why":"He went back to the beginning."}],"assignment":"Interview a parent or grandparent about their school days. Then write a comparison: how was their education different from yours, and how were both different from a Jewish child's education in Jesus' time?"},{"id":"hist-20","bible":"mat-20","bibleTitle":"Last Will Be First","title":"Work, Wages, and the City of Palms","era":"1st century AD","intro":"Jesus' parable of the vineyard workers uses real hours of the day and real wages. Then the chapter ends in Jericho, one of the oldest cities in the world.","sections":[{"h":"Day Laborers","p":["Many poor men had no land of their own. Each morning they gathered in the marketplace hoping to be hired for the day, especially during busy seasons like the grape harvest, when ripe grapes had to be picked quickly before the rains. God's law said workers must be paid before sunset (Deuteronomy 24:15), because they needed that day's wage to feed their families that night.","A denarius was the standard pay for a day's work. Jewish time was counted from sunrise, about 6 a.m. So the 'third hour' was about 9 a.m., the 'sixth hour' noon, the 'ninth hour' 3 p.m., and the 'eleventh hour' 5 p.m., just one hour before quitting time. Our phrase 'at the eleventh hour' comes from this parable."]},{"h":"Jericho: The City of Palms","p":["Jericho sits in the Jordan Valley about 850 feet below sea level. Thanks to a powerful spring, it is an oasis of palm trees in the desert. Archaeologists have found signs of settlement going back about 10,000 years, making it one of the oldest cities on earth.","In Jesus' day, a newer Jericho stood beside the ancient mound. Herod the Great built lavish winter palaces there with gardens and swimming pools, and it was there that he died in 4 BC. Jericho's groves of balsam, used for expensive perfume and medicine, were so valuable that Mark Antony gave them to Cleopatra as a gift, and Herod had to lease them back from her."]},{"h":"The Road Up to Jerusalem","p":["From Jericho, the road to Jerusalem climbs roughly 3,300 feet in about 15 miles through dry, rocky wilderness. It was known for robbers, and it's the setting of the Good Samaritan parable.","At Passover, crowds of pilgrims traveled this road together, singing the 'Psalms of Ascent' (Psalms 120-134). Blind beggars sat by the roadside at Jericho because they knew large crowds would pass. When two of them heard Jesus was coming, they shouted louder than the crowd."]}],"people":[{"name":"Mark Antony","role":"Roman general who gave Jericho's balsam groves to Cleopatra"},{"name":"Cleopatra VII","role":"Last queen of Egypt, ally of Mark Antony"},{"name":"Bartimaeus","role":"A blind beggar at Jericho healed by Jesus (named in Mark 10)"}],"source":{"title":"The Jewish War, Book 4","who":"Josephus","date":"About AD 75","text":"Josephus describes the region around Jericho as the most fertile in Judea. He says the spring waters a plain full of many kinds of palm trees, and that it produces balsam, the most precious crop in the area. He calls the place almost divine.","note":"Paraphrased. His description helps explain why Herod built palaces there and why Cleopatra wanted it."},"vocab":[["Day laborer","A worker hired and paid one day at a time"],["Eleventh hour","About 5 p.m.; now means 'at the last minute'"],["Oasis","A fertile spot in a desert, watered by a spring"],["Balsam","A valuable plant resin used for perfume and medicine"]],"map":{"view":"local","places":["jericho","jerusalem","bethany","jordanbaptism"],"caption":"The steep road from Jericho climbs through the wilderness to Jerusalem."},"timeline":[{"y":-34,"t":"Mark Antony gives Jericho's balsam groves to Cleopatra (about 34 BC)"}],"video":[],"quiz":[{"q":"When did Jewish time begin counting the hours of the day?","options":["Midnight","Sunrise, about 6 a.m.","Noon","Sunset"],"answer":1,"why":"So the third hour was about 9 a.m."},{"q":"About what time was 'the eleventh hour'?","options":["11 a.m.","5 p.m.","11 p.m.","7 a.m."],"answer":1,"why":"One hour before the workday ended."},{"q":"Why did God's law say to pay workers before sunset?","options":["Banks closed","They needed the money to feed their families","It was Roman law","To end the Sabbath"],"answer":1,"why":"Deuteronomy 24:15."},{"q":"Why is Jericho famous?","options":["It's one of the oldest cities in the world","It's the highest city","It's where Jesus was born","It's Rome's capital"],"answer":0,"why":"Settlement goes back about 10,000 years."},{"q":"Who gave Jericho's balsam groves to Cleopatra?","options":["Herod","Mark Antony","Augustus","Pilate"],"answer":1,"why":"Herod then had to lease them back."}],"assignment":"Make a chart of a 12-hour workday using Jewish hours (first hour through twelfth hour) alongside modern times. Mark when each group of workers in Matthew 20 was hired."},{"id":"hist-21","bible":"mat-21","bibleTitle":"The King Rides Into Jerusalem","title":"Jerusalem and Herod's Temple","era":"20 BC to AD 63","intro":"When Jesus entered Jerusalem, the city was packed with Passover pilgrims, and above it all rose one of the wonders of the ancient world: Herod's temple.","sections":[{"h":"A Wonder of the World","p":["Around 20 BC, Herod the Great began rebuilding the temple on a massive scale. His workers expanded the platform, the Temple Mount, to about 35 acres, supported by enormous retaining walls. Some of the stones weigh hundreds of tons. The Western Wall, where Jews pray today, is part of that retaining wall.","Work went on for decades. In John 2:20, people say the temple had been under construction for 46 years, and it was only fully finished around AD 63, just seven years before the Romans destroyed it. Inside the platform were courts for Gentiles, women, Israelite men, and priests, with the Holy of Holies at the center."]},{"h":"Passover Crowds","p":["Passover drew Jewish pilgrims from all over the Roman world. Josephus claims that at one Passover, 256,500 lambs were sacrificed and nearly 3 million people were present. Modern historians think that's an exaggeration, but even conservative estimates suggest Jerusalem's population may have swelled to several hundred thousand.","With crowds that size and a holiday celebrating freedom from a foreign king (Pharaoh), Roman leaders were nervous. The governor, Pontius Pilate, came up from Caesarea with extra troops, and soldiers watched the temple courts from the Antonia Fortress."]},{"h":"Palms, a Donkey, and Money Changers","p":["Palm branches were a symbol of Jewish national victory. When the Maccabees retook Jerusalem, people celebrated with palm branches (1 Maccabees 13:51), and palms later appeared on Jewish revolt coins. So the crowd was hailing Jesus as a liberating king. Yet by riding a donkey, Jesus fulfilled Zechariah 9:9 and showed he was a king who came in peace.","In the temple's outer court, merchants sold animals for sacrifice, and money changers exchanged coins into Tyrian shekels for the temple tax, often at a profit. The trade filled the only area where Gentiles could pray, which is why Jesus quoted Isaiah: 'My house will be called a house of prayer for all nations.'"]}],"people":[{"name":"Herod the Great","role":"Began rebuilding the temple around 20 BC"},{"name":"Pontius Pilate","role":"Roman governor who came to Jerusalem for Passover"},{"name":"Simon Maccabeus","role":"Maccabee leader welcomed into Jerusalem with palm branches in 141 BC"}],"source":{"title":"The Jewish War, Book 5","who":"Josephus","date":"About AD 75","text":"Josephus says the front of the temple was covered with heavy plates of gold. At sunrise it reflected such a fiery brightness that people looking at it had to turn their eyes away, as if from the sun's rays. To strangers approaching from a distance, it looked like a snow-covered mountain, because the parts not covered in gold were brilliant white.","note":"Paraphrased. Josephus saw this temple with his own eyes before it was destroyed. It helps explain why the disciples were so impressed by its buildings (Matthew 24:1)."},"vocab":[["Temple Mount","The huge platform Herod built to hold the temple and its courts"],["Pilgrim","Someone who travels to a holy place to worship"],["Money changer","Someone who exchanged coins, often for a fee"],["Antonia Fortress","Roman fortress beside the temple"]],"map":{"view":"local","places":["jerusalem","bethany","jericho","caesarea"],"caption":"Jesus came from Jericho, stayed in Bethany, and rode into Jerusalem from the Mount of Olives. Pilate came up from Caesarea."},"timeline":[{"y":-20,"t":"Herod begins rebuilding the temple (about 20/19 BC)"},{"y":63,"t":"Work on Herod's temple is finally completed (about AD 63)"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"About how large was Herod's Temple Mount platform?","options":["1 acre","35 acres","500 acres","The size of Rome"],"answer":1,"why":"Roughly 35 acres."},{"q":"What is the Western Wall?","options":["Part of the temple building","Part of Herod's retaining wall","A Roman fort","A city gate"],"answer":1,"why":"It supported the platform."},{"q":"What did palm branches symbolize?","options":["Sadness","Jewish national victory","Roman power","Farming"],"answer":1,"why":"They recalled the Maccabees' victories."},{"q":"Why did Pilate come to Jerusalem at Passover?","options":["To worship","To keep order among huge crowds","To collect taxes","To see Jesus"],"answer":1,"why":"Rome feared unrest."},{"q":"When was the temple finally completed?","options":["20 BC","AD 30","About AD 63","It was never finished"],"answer":2,"why":"Just seven years before it was destroyed."}],"assignment":"Find a diagram of Herod's temple online or in a book. Draw your own simple version, labeling the Court of the Gentiles, the Court of Women, the Court of Israel, the Court of the Priests, and the Holy of Holies. Mark where the money changers likely were."},{"id":"hist-22","bible":"mat-22","bibleTitle":"The Greatest Commandment","title":"Caesar's Coin and Rival Parties","era":"AD 14-37","intro":"When Jesus asked for a coin and said 'Whose image is this?', the answer was stamped right on it. That coin still exists, and so do thousands like it.","sections":[{"h":"The Tribute Penny","p":["The coin Jesus asked for was a denarius, most likely one minted under Tiberius, emperor from AD 14 to 37. On the front was his portrait with the Latin words TI CAESAR DIVI AVG F AVGVSTVS: 'Tiberius Caesar, son of the divine Augustus, Augustus.' The back read PONTIF MAXIM, 'highest priest.'","To devout Jews, this was deeply offensive. The coin carried a human image (compare the second commandment) and called the emperor the son of a god. Jewish rulers usually avoided putting people's faces on their coins. Even Pilate's coins showed Roman religious objects rather than portraits. By asking for the coin, Jesus also revealed that his questioners were carrying one."]},{"h":"Strange Allies","p":["The question came from Pharisees working together with Herodians. The Herodians supported the Herod family, who ruled with Rome's blessing, so they favored paying taxes. Many Pharisees resented Roman taxes. If Jesus said 'pay,' he'd anger the crowds. If he said 'don't pay,' the Herodians could report him to Rome for rebellion.","Jesus' answer honored both truths. The coin bore Caesar's image, so give it back to him. But people bear God's image (Genesis 1:27), so give yourselves to God."]},{"h":"Sadducees and the Resurrection","p":["Next, the Sadducees tried a riddle about a woman married to seven brothers in turn, a situation based on the law of levirate marriage (Deuteronomy 25:5-6). Since they didn't believe in resurrection, they meant to make the idea look silly.","Jesus answered from the book of Exodus, which the Sadducees accepted: God said 'I am the God of Abraham, Isaac, and Jacob,' not 'I was.' The patriarchs are alive to God. Josephus confirms that the Sadducees denied life after death and argued with other teachers about it."]}],"people":[{"name":"Tiberius","role":"Roman emperor AD 14-37, during Jesus' ministry"},{"name":"The Herodians","role":"Jewish supporters of the Herod family's rule"},{"name":"The Sadducees","role":"Priestly party that denied the resurrection"}],"source":{"title":"The Tiberius Denarius","who":"Minted at Lugdunum (modern Lyon, France)","date":"AD 14-37","text":"Front: a portrait of Tiberius with the inscription TI CAESAR DIVI AVG F AVGVSTVS ('Tiberius Caesar, son of the divine Augustus, Augustus'). Back: a seated woman, often identified as his mother Livia, with the inscription PONTIF MAXIM ('highest priest').","note":"Many thousands of these coins survive, and collectors call them 'tribute pennies.' You can hold history in your hand: this is almost certainly the kind of coin in Matthew 22."},"vocab":[["Denarius","Roman silver coin worth a day's wage"],["Inscription","Words carved or stamped on stone, metal, or coins"],["Herodians","Supporters of the Herod family and its Roman-backed rule"],["Levirate marriage","A law where a man married his dead brother's widow to carry on the family line"]],"map":{"view":"wide","places":["rome","jerusalem_w"],"caption":"Tiberius' coins were minted in Gaul and carried across the empire all the way to Jerusalem."},"timeline":[{"y":14,"t":"Augustus dies; Tiberius becomes emperor"},{"y":37,"t":"Tiberius dies; Caligula becomes emperor"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"Which emperor's face was probably on the coin?","options":["Augustus","Tiberius","Nero","Julius Caesar"],"answer":1,"why":"Tiberius ruled AD 14-37."},{"q":"What does 'DIVI AVG F' mean?","options":["King of Rome","Son of the divine Augustus","Highest priest","Father of the country"],"answer":1,"why":"It called Tiberius the son of a god."},{"q":"Why were the Herodians and Pharisees an odd pair?","options":["They spoke different languages","They disagreed about Roman rule and taxes","They lived in different countries","They were enemies of Rome"],"answer":1,"why":"Herodians supported Rome's clients; many Pharisees resented Rome."},{"q":"What did the Sadducees deny?","options":["The temple","The resurrection","Moses","The Sabbath"],"answer":1,"why":"They didn't believe in life after death."},{"q":"What is a coin's 'inscription'?","options":["Its value","The words stamped on it","Its weight","Its color"],"answer":1,"why":"Tiberius' title was stamped on the denarius."}],"assignment":"Examine a modern coin. Write down its image and inscription. Then write a paragraph comparing it to the Tiberius denarius, and explain what Jesus meant by giving to God 'what is God's.'"},{"id":"hist-23","bible":"mat-23","bibleTitle":"Be Ready: Jesus Will Return","title":"The Fall of Jerusalem, AD 70","era":"AD 66-81","intro":"Jesus predicted that not one stone of the temple would be left on another. About 40 years later, it happened. Understanding AD 70 is key to understanding the world the Gospels were written in.","sections":[{"h":"The Great Revolt","p":["Tensions between Jews and Romans grew for decades. In AD 66, after the Roman governor Florus took money from the temple treasury, riots broke out and Jewish rebels drove the Romans out of Jerusalem. Emperor Nero sent his general Vespasian to crush the revolt, starting in Galilee.","Among the Jewish commanders in Galilee was a young priest named Joseph ben Matthias. He was captured and switched to the Roman side, later taking the name Flavius Josephus. His eyewitness history, The Jewish War, is our main source for these events."]},{"h":"The Siege","p":["In 68, Nero died, and Rome was thrown into chaos. AD 69 is called the Year of the Four Emperors. Vespasian ended up as emperor and left his son Titus to finish the war. In spring AD 70, Titus surrounded Jerusalem with his legions. Inside, rival rebel groups fought each other while famine spread. The suffering was terrible.","In late summer, Roman soldiers broke through, and the temple burned. The Romans tore down the buildings and threw the great stones down. Some can still be seen piled in a street at the foot of the Temple Mount. The last rebel fortress, Masada, fell in AD 73 or 74."]},{"h":"The Christians and the Arch","p":["The church historian Eusebius wrote that Christians in Jerusalem, remembering a warning to flee, left the city before the siege and escaped to Pella, a town across the Jordan. This fits Jesus' command in Matthew 24:16 to flee to the mountains when they saw the signs.","In Rome, the Arch of Titus was built around AD 81 to celebrate the victory. Its carvings show Roman soldiers carrying the temple's golden menorah and other treasures in a victory parade. The arch still stands in Rome today."]}],"people":[{"name":"Vespasian","role":"Roman general who began the war, later emperor AD 69-79"},{"name":"Titus","role":"Vespasian's son; captured Jerusalem in AD 70, later emperor"},{"name":"Flavius Josephus","role":"Jewish commander who became a Roman historian"},{"name":"Eusebius","role":"Church historian (about AD 260-339)"}],"source":{"title":"Church History, Book 3","who":"Eusebius","date":"About AD 325","text":"Eusebius writes that the people of the church in Jerusalem were commanded, by a revelation given to trusted men there before the war, to leave the city and live in a town of Perea called Pella. Those who believed in Christ moved there from Jerusalem.","note":"Paraphrased. Eusebius wrote about 250 years later, using earlier sources. Historians debate details, but the tradition shows early Christians took Jesus' warnings seriously."},"vocab":[["Revolt","An uprising against those in power"],["Siege","Surrounding a city to force it to surrender"],["Year of the Four Emperors","AD 69, when four men ruled Rome one after another"],["Triumphal arch","A monument celebrating a military victory"]],"map":{"view":"local","places":["jerusalem","pella","masada","caesarea"],"caption":"Christians fled to Pella across the Jordan. Masada was the last rebel fortress to fall."},"timeline":[{"y":66,"t":"The Jewish revolt against Rome begins"},{"y":70,"t":"Titus destroys Jerusalem and the temple"},{"y":73,"t":"Masada falls (AD 73 or 74)"},{"y":81,"t":"The Arch of Titus is completed in Rome (about AD 81)"}],"video":[],"quiz":[{"q":"When did the Jewish revolt against Rome begin?","options":["AD 30","AD 66","AD 70","4 BC"],"answer":1,"why":"It began in AD 66."},{"q":"Who captured Jerusalem in AD 70?","options":["Nero","Titus","Pilate","Herod"],"answer":1,"why":"Vespasian's son Titus."},{"q":"Where did Jerusalem's Christians flee, according to Eusebius?","options":["Rome","Pella","Egypt","Antioch"],"answer":1,"why":"A town across the Jordan."},{"q":"What does the Arch of Titus show?","options":["Jesus' crucifixion","Soldiers carrying the temple menorah","Herod's palace","The Sea of Galilee"],"answer":1,"why":"It celebrated Rome's victory."},{"q":"Which fortress was the last to fall?","options":["Herodium","Machaerus","Masada","Antonia"],"answer":2,"why":"Masada fell in AD 73 or 74."}],"assignment":"Make a timeline poster from AD 30 to AD 81 showing Jesus' prediction (Matthew 24:2), the revolt, the siege, the temple's destruction, Masada, and the Arch of Titus. Add one sentence explaining why this event changed Jewish and Christian history."},{"id":"hist-24","bible":"mat-24","bibleTitle":"Lamps, Talents, Sheep and Goats","title":"Weddings, Lamps, and Buried Treasure","era":"1st to 3rd century AD","intro":"Jesus' parables in Matthew 25 are full of everyday details: a wedding procession at night, small oil lamps, and money buried in the ground. Archaeology helps bring them to life.","sections":[{"h":"A Jewish Wedding","p":["A Jewish marriage had two stages. First came the betrothal, a legally binding agreement (that's why Joseph needed a divorce to end his engagement to Mary). Often about a year later came the wedding itself. The groom and his friends went to the bride's home to bring her back to his family's home in a joyful procession, often at night.","Friends waited along the way with lamps or torches to join the procession. Then came a wedding feast that could last up to a week. If the groom was delayed, perhaps by long negotiations with the bride's family, everyone simply had to wait. Being ready when he arrived was the whole point."]},{"h":"Little Lamps","p":["Most lamps were small clay dishes, easy to hold in one hand, with a spout for a wick made of flax or cloth. Archaeologists find thousands of them, including a style called 'Herodian lamps' from Jesus' time. They held only a little olive oil and burned for a few hours.","So on a long night of waiting, you needed extra oil in a separate jar. Some scholars think the 'lamps' in the parable may have been torches, sticks wrapped in oil-soaked rags, which also needed a supply of oil. Either way, running out meant being left in the dark."]},{"h":"Banks and Buried Money","p":["Moneylenders and bankers did exist. They took deposits and lent money out at interest, especially to Gentiles and traders. (The law of Moses forbade Israelites from charging interest to fellow Israelites.) That's why the master said the servant should at least have put his money with the bankers.","Burying money was the most common way to keep it safe from thieves. Later Jewish legal writings say that if someone buried money entrusted to him and it was stolen anyway, he wasn't responsible. So the third servant played it completely safe. His problem wasn't dishonesty; it was fear and refusing to use what he'd been given."]}],"people":[{"name":"Bernard Grenfell and Arthur Hunt","role":"British archaeologists who began digging up the Oxyrhynchus papyri in Egypt in 1896"}],"source":{"title":"A Wedding Invitation (Oxyrhynchus Papyrus 111)","who":"A mother named Herais, in Roman Egypt","date":"About AD 200","text":"The invitation reads: Herais invites you to dinner at the wedding of her children, at her house, tomorrow, which is the fifth, from the ninth hour.","note":"Near-literal translation. This short invitation was found in an ancient garbage dump in Egypt, along with thousands of other letters and documents written in everyday Greek. It shows how ordinary wedding customs were, and it counts hours the same way the Bible does: the ninth hour was about 3 p.m."},"vocab":[["Betrothal","A legally binding engagement before marriage"],["Wick","The strip of cloth or flax that burns in a lamp"],["Papyrus","Paper-like writing material made from reeds in Egypt"],["Interest","Extra money paid for the use of a loan"]],"map":{"view":"wide","places":["alexandria","memphis","jerusalem_w"],"caption":"The Oxyrhynchus papyri came from Roman Egypt, south of Memphis along the Nile."},"timeline":[{"y":200,"t":"Herais sends a wedding invitation in Roman Egypt (about AD 200)"},{"y":1896,"t":"Excavations begin at Oxyrhynchus, Egypt","d":true}],"video":[],"quiz":[{"q":"What was a betrothal?","options":["A wedding feast","A legally binding engagement","A kind of lamp","A dowry"],"answer":1,"why":"Breaking it required a divorce."},{"q":"Why did the wise virgins need extra oil?","options":["Lamps held little oil and burned only a few hours","Oil was a gift","To cook food","The groom asked for it"],"answer":0,"why":"Small clay lamps ran out fast."},{"q":"What were 'Herodian lamps'?","options":["Gold lamps in Herod's palace","A style of small clay lamp from Jesus' time","Temple lampstands","Roman torches"],"answer":1,"why":"Archaeologists find many of them."},{"q":"What was the most common way to keep money safe?","options":["A bank account","Burying it","Giving it to soldiers","Hiding it in a lamp"],"answer":1,"why":"Coin hoards are found today."},{"q":"Where was Herais' wedding invitation found?","options":["Jerusalem","An ancient garbage dump in Egypt","Rome","Qumran"],"answer":1,"why":"At Oxyrhynchus."}],"assignment":"Write your own wedding invitation in the style of Herais' papyrus, using Jewish hours. Then write a paragraph explaining what the Parable of the Ten Virgins teaches about being ready."},{"id":"hist-25","bible":"mat-25","bibleTitle":"The Last Supper and the Garden","title":"Passover, Caiaphas, and the Oil Press","era":"AD 18-36","intro":"Jesus' last night before the cross took place during Passover and ended in an olive grove. The high priest who condemned him has left behind physical evidence: a family bone box found in 1990.","sections":[{"h":"The Passover Meal","p":["Passover remembered God rescuing Israel from slavery in Egypt. On the afternoon of the 14th of the Hebrew month Nisan, thousands of lambs were sacrificed at the temple. After sunset, which began a new day on the Jewish calendar, families ate the roasted lamb with unleavened bread and bitter herbs.","By Jesus' time, diners reclined on cushions around a low table, leaning on their left elbows, a custom borrowed from Greek and Roman banquets that showed they were free people, not slaves. The Mishnah later describes four cups of wine drunk during the meal, each tied to one of God's promises in Exodus 6:6-7."]},{"h":"Caiaphas the High Priest","p":["Joseph Caiaphas was high priest from about AD 18 to 36, far longer than most high priests of that era, which suggests he was skilled at keeping the Roman governors happy. His father-in-law Annas had been high priest before him and remained powerful.","In 1990, workers building a park in Jerusalem accidentally broke into a burial cave. Inside were ossuaries, stone boxes for holding bones. One beautifully decorated box was inscribed 'Yehosef bar Qayafa,' Joseph son of Caiaphas. Many archaeologists believe it held the bones of the very high priest who questioned Jesus, though some scholars debate the identification."]},{"h":"Gethsemane: The Oil Press","p":["Gethsemane comes from Aramaic words meaning 'oil press.' The Mount of Olives was covered with olive groves, and olives were crushed in stone presses to make oil for food, lamps, and medicine. The first gentle pressing produced the finest oil; later the olives were crushed under heavy stone weights.","It was here, in a place named for crushing, that Jesus prayed in anguish. The 30 pieces of silver paid to Judas was the price the law set for compensating the owner of a slave killed by an ox (Exodus 21:32), and it echoes Zechariah 11:12-13."]}],"people":[{"name":"Joseph Caiaphas","role":"High priest AD 18-36 who led the trial of Jesus"},{"name":"Annas","role":"Former high priest and Caiaphas' father-in-law"},{"name":"Judas Iscariot","role":"Apostle who betrayed Jesus for 30 pieces of silver"}],"source":{"title":"The Caiaphas Ossuary","who":"Carved for the Caiaphas family","date":"1st century AD; found in 1990","text":"The inscription, scratched in Aramaic on the side of a decorated limestone bone box, reads: 'Yehosef bar Qayafa' (Joseph, son of Caiaphas).","note":"Josephus tells us the high priest's full name was Joseph Caiaphas. The ossuary is now displayed in the Israel Museum in Jerusalem."},"vocab":[["Nisan","The Hebrew month when Passover falls (March-April)"],["Ossuary","A stone box for storing bones after a body has decayed"],["Gethsemane","Aramaic for 'oil press'"],["Sanhedrin","The Jewish high council in Jerusalem, led by the high priest"]],"map":{"view":"local","places":["jerusalem","bethany","bethlehem"],"caption":"The Mount of Olives with Gethsemane lies just east of Jerusalem, on the road to Bethany."},"timeline":[{"y":18,"t":"Caiaphas becomes high priest (about AD 18)"},{"y":1990,"t":"The Caiaphas ossuary is discovered in Jerusalem","d":true}],"video":[["Drive Thru History: The Last Supper","https://watch.tbn.org/s/Q9aSuuiu?e=QfYSBn17"],["Drive Thru History: The Trial of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=UdAPZEIf"]],"quiz":[{"q":"When did the Jewish day begin?","options":["At sunrise","At sunset","At noon","At midnight"],"answer":1,"why":"So the Passover meal began a new day."},{"q":"Why did diners recline at Passover?","options":["They were tired","To show they were free people, not slaves","There were no chairs","It was a Roman law"],"answer":1,"why":"A banquet custom showing freedom."},{"q":"What is an ossuary?","options":["A cup","A stone box for bones","A scroll","A lamp"],"answer":1,"why":"Used in Jewish burials of the time."},{"q":"What does Gethsemane mean?","options":["Garden of peace","Oil press","Place of prayer","Olive tree"],"answer":1,"why":"From Aramaic."},{"q":"How long was Caiaphas high priest?","options":["One year","About 18 years","His whole life","Three days"],"answer":1,"why":"About AD 18 to 36."}],"assignment":"Read Exodus 12 and Matthew 26:17-30. Make a two-column chart comparing the first Passover with the Last Supper. Then write a paragraph on why Jesus chose Passover to explain his death."},{"id":"hist-26","bible":"mat-26","bibleTitle":"The Cross","title":"Pontius Pilate and Roman Crucifixion","era":"AD 26-36","intro":"For centuries, some skeptics doubted that Pontius Pilate even existed. Then, in 1961, archaeologists found his name carved in stone. Roman writers also confirm that Jesus was executed under him.","sections":[{"h":"Pilate the Governor","p":["Pontius Pilate governed Judea from AD 26 to 36 with the title prefect. He lived mainly at Caesarea on the coast and came to Jerusalem for festivals. Josephus and the Jewish writer Philo describe him as stubborn and harsh. He brought military standards with the emperor's image into Jerusalem, and he took money from the temple treasury to build an aqueduct, sparking protests he put down with force.","In 1961, Italian archaeologists excavating the theater at Caesarea found a limestone block reused in a later stairway. Its Latin inscription includes the words 'Pontius Pilatus, Prefect of Judea.' It is the only inscription from Pilate's own time that names him. In AD 36 Pilate was removed from office after violently attacking a group of Samaritans and was sent to Rome."]},{"h":"The Roman Cross","p":["Crucifixion was Rome's punishment for slaves, rebels, and violent criminals, never normally for Roman citizens. It was meant to be slow, public, and shameful: a warning to anyone who might challenge Rome. The Roman speaker Cicero called it the most cruel and horrible punishment.","Victims were usually flogged first and forced to carry the crossbeam. A sign called a titulus announced the crime. Jesus' sign, 'This is Jesus, the King of the Jews,' named rebellion against Caesar as his crime, written in Aramaic, Latin, and Greek (John 19:20). Crucifixions happened beside busy roads outside the city walls so everyone would see."]},{"h":"Golgotha and the Tomb","p":["Golgotha means 'place of the skull.' The Church of the Holy Sepulchre in Jerusalem marks the traditional site of both the crucifixion and the tomb. It was outside the city walls in Jesus' day, and archaeologists have found rock-cut tombs from that era beneath the church. Another site, the Garden Tomb, is popular with many Protestant visitors, though most archaeologists favor the Holy Sepulchre location.","Wealthy families like Joseph of Arimathea's cut tombs into rock. Most tombs were closed with square blocking stones. Round rolling stones were rarer and usually belonged to the wealthiest families, which fits the Gospels' description of a rich man's new tomb."]}],"people":[{"name":"Pontius Pilate","role":"Roman prefect of Judea AD 26-36 who sentenced Jesus"},{"name":"Tacitus","role":"Roman historian who mentions Jesus' execution under Pilate"},{"name":"Joseph of Arimathea","role":"Wealthy council member who buried Jesus in his own tomb"}],"source":{"title":"Annals, Book 15","who":"Tacitus","date":"About AD 116","text":"Writing about the fire of Rome in AD 64, Tacitus explains that the name 'Christians' came from Christus, who was executed by the governor Pontius Pilate during the reign of Tiberius. He adds that this 'superstition' was checked for a moment but broke out again, not only in Judea but even in Rome.","note":"Paraphrased. Tacitus was one of Rome's greatest historians and had no sympathy for Christians. His brief comment independently confirms the who, when, and how of Jesus' death."},"vocab":[["Prefect","The title of the Roman governor of Judea in Pilate's time"],["Titulus","The sign stating a crucified person's crime"],["Golgotha","Aramaic for 'place of the skull,' where Jesus was crucified"],["Aqueduct","A channel built to carry water to a city"]],"map":{"view":"local","places":["caesarea","jerusalem"],"caption":"Pilate's headquarters were at Caesarea, where the Pilate Stone was found. He came to Jerusalem for Passover."},"timeline":[{"y":26,"t":"Pontius Pilate becomes prefect of Judea"},{"y":30,"t":"Jesus is crucified (about AD 30 or 33)"},{"y":36,"t":"Pilate is removed from office"},{"y":1961,"t":"The Pilate Stone is found at Caesarea","d":true}],"video":[["Drive Thru History: The Trial of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=UdAPZEIf"],["Drive Thru History: The Crucifixion of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=nrnwBXI2"]],"videoNote":"The crucifixion episode explains how Roman crucifixion worked. You may want to preview it.","quiz":[{"q":"What was Pilate's official title?","options":["King","Prefect of Judea","Emperor","High priest"],"answer":1,"why":"Confirmed by the Pilate Stone."},{"q":"Where was the Pilate Stone found?","options":["Jerusalem","Rome","The theater at Caesarea","Galilee"],"answer":2,"why":"Reused in a later stairway."},{"q":"Who was crucifixion normally used for?","options":["Roman citizens","Slaves, rebels, and violent criminals","Priests","Soldiers"],"answer":1,"why":"It was meant to humiliate and warn."},{"q":"What does Golgotha mean?","options":["Hill of olives","Place of the skull","Garden tomb","City gate"],"answer":1,"why":"From Aramaic."},{"q":"Which Roman historian confirms Jesus was executed under Pilate?","options":["Cicero","Tacitus","Julius Caesar","Virgil"],"answer":1,"why":"In his Annals, about AD 116."}],"assignment":"Write a short 'newspaper article' as a Roman reporter in AD 36 explaining why Pilate was removed from office. Then add a paragraph, in your own voice, about why evidence like the Pilate Stone and Tacitus matters for Christians."},{"id":"hist-27","bible":"mat-27","bibleTitle":"He Is Risen!","title":"The Empty Tomb and a Growing Church","era":"AD 30-313","intro":"Matthew says a rumor about the empty tomb was still being spread 'to this very day.' Within a few decades, Roman officials were writing letters about people who worshiped Christ, and the movement kept growing.","sections":[{"h":"A Rumor and a Roman Decree","p":["Matthew 28 records that the chief priests paid the guards to say the disciples had stolen the body. The rumor itself admits an important point: the tomb was empty. Nobody claimed the body was still there.","A marble tablet known as the Nazareth Inscription, which reached a collector from Nazareth in 1878, contains an 'edict of Caesar' ordering that tombs be left undisturbed and threatening death for anyone who moves bodies. Scholars debate its date and purpose, and there's no proof it connects to Jesus. But it shows that Roman authorities took tomb-robbing very seriously in that region."]},{"h":"The Church Spreads","p":["About 120 believers met after Jesus ascended (Acts 1:15). At Pentecost, 3,000 were added in one day. Within 30 years there were churches in Antioch, Ephesus, Corinth, Rome, and many other cities, along the same roads and sea routes Rome had built.","Around AD 49, the Roman writer Suetonius says Emperor Claudius expelled Jews from Rome because of disturbances over 'Chrestus,' probably a garbled reference to Christ (compare Acts 18:2). In AD 64, after a great fire in Rome, Emperor Nero blamed the Christians and had many killed. Christian tradition says Peter and Paul died in Rome during this period."]},{"h":"From Persecution to Freedom","p":["Around AD 112, Pliny the Younger, governor of a province in what is now Turkey, wrote to Emperor Trajan asking what to do about Christians. His letter gives an outsider's description of early Christian worship.","Despite waves of persecution, the church kept growing. Some historians estimate there were several million Christians by AD 300. In AD 313, Emperor Constantine and his co-emperor issued the Edict of Milan, granting Christians freedom to worship. The small group of disciples on a mountain in Galilee had grown into a movement across the whole empire, as Jesus had commissioned."]}],"people":[{"name":"Pliny the Younger","role":"Roman governor who wrote to Trajan about Christians around AD 112"},{"name":"Nero","role":"Roman emperor AD 54-68 who persecuted Christians after the fire of AD 64"},{"name":"Constantine","role":"Roman emperor who legalized Christianity in AD 313"}],"source":{"title":"Letter to Emperor Trajan (Letters 10.96)","who":"Pliny the Younger","date":"About AD 112","text":"Pliny reports what he learned from questioning Christians: they met on a fixed day before dawn and sang a hymn to Christ as to a god. They bound themselves by an oath not to commit crimes, but to avoid theft, robbery, and adultery, never to break their word, and not to refuse to return money entrusted to them. Afterward they would gather again to share an ordinary, harmless meal.","note":"Paraphrased. Pliny wasn't a Christian and was trying to decide whether to punish them. His letter is one of the earliest descriptions of Christian worship from outside the church, and it confirms that Christians worshiped Jesus as God within about 80 years of his resurrection."},"vocab":[["Edict","An official order from a ruler"],["Persecution","Hostility or punishment aimed at people because of their beliefs"],["Great Commission","Jesus' command to make disciples of all nations (Matthew 28:19-20)"],["Edict of Milan","AD 313 agreement giving Christians freedom of worship"]],"map":{"view":"wide","places":["jerusalem_w","antioch","ephesus","corinth","rome","alexandria"],"caption":"Within a generation, churches had spread from Jerusalem across the Roman world."},"timeline":[{"y":49,"t":"Claudius expels Jews from Rome over 'Chrestus' (about AD 49)"},{"y":64,"t":"Great Fire of Rome; Nero persecutes Christians"},{"y":112,"t":"Pliny writes to Trajan about Christians (about AD 112)"},{"y":313,"t":"The Edict of Milan gives Christians freedom to worship"}],"video":[["Drive Thru History: The Resurrection of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=tDaHdjCj"],["Drive Thru History: Who Is Jesus?","https://watch.tbn.org/s/Q9aSuuiu?e=e3cxhttZ"]],"quiz":[{"q":"What does the guards' rumor admit?","options":["Jesus never died","The tomb was empty","There were no guards","Pilate stole the body"],"answer":1,"why":"Nobody claimed the body was still there."},{"q":"Which emperor blamed Christians for the fire of Rome?","options":["Augustus","Nero","Constantine","Trajan"],"answer":1,"why":"In AD 64."},{"q":"What did Pliny say Christians did before dawn?","options":["Fished","Sang a hymn to Christ as to a god","Paid taxes","Offered sacrifices to Caesar"],"answer":1,"why":"From his letter around AD 112."},{"q":"What did the Edict of Milan do?","options":["Banned Christianity","Gave Christians freedom to worship","Destroyed Jerusalem","Built the Colosseum"],"answer":1,"why":"In AD 313."},{"q":"How many were added to the church at Pentecost?","options":["12","120","3,000","1 million"],"answer":2,"why":"Acts 2:41."}],"assignment":"Final project for Matthew: Choose three pieces of evidence you learned about in this course (for example the Pilate Stone, the Caiaphas ossuary, Josephus on John, or Tacitus). For each one, write a paragraph explaining what it is and how it connects to Matthew's Gospel."}]};

const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h14"/></svg>';
