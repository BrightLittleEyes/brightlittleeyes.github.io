<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alto Sax">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Alto Sax Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --ink:#211A12; --muted:#6A5F52; --line:#E3D9C8; --soft:#F0E8DA;
  --accent:#9C520A; --accent-ink:#FFFFFF; --brass:#D9A441;
  --good:#1D7A3A; --good-bg:#E2F3E7; --bad:#B3261E; --bad-bg:#FBE6E4;
  --u1:#C2562D; --u2:#B7860F; --u3:#4F7A25; --u4:#0E7C6B; --u5:#2F6DB5; --u6:#3B4FA3; --u7:#6B3FA0; --u8:#A63A6B; --u9:#9C520A;
  --keyon:#9C520A; --keyoff:#FFFFFF; --keyline:#6A5F52;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16120D; --surface:#211B14; --ink:#F1E9DC; --muted:#B5A792; --line:#3A3127; --soft:#2A231A;
    --accent:#E9A857; --accent-ink:#2A1600; --brass:#E9B85A;
    --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
    --u1:#E57C52; --u2:#E0B23C; --u3:#8DBB57; --u4:#3FBFA8; --u5:#6FA8EC; --u6:#8C9CF0; --u7:#B48AE6; --u8:#E57BAA; --u9:#E9A857;
    --keyon:#E9A857; --keyoff:#211B14; --keyline:#B5A792;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16120D; --surface:#211B14; --ink:#F1E9DC; --muted:#B5A792; --line:#3A3127; --soft:#2A231A;
  --accent:#E9A857; --accent-ink:#2A1600; --brass:#E9B85A;
  --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
  --u1:#E57C52; --u2:#E0B23C; --u3:#8DBB57; --u4:#3FBFA8; --u5:#6FA8EC; --u6:#8C9CF0; --u7:#B48AE6; --u8:#E57BAA; --u9:#E9A857;
  --keyon:#E9A857; --keyoff:#211B14; --keyline:#B5A792;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto;background:none;border:0;padding:0}
.brand .flask{width:30px;height:30px}
.nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who label{color:var(--muted)}
select,input[type=text]{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

/* home */
.hero{padding-block:36px 20px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:18px}
.tile{--c:var(--accent);position:relative;text-align:left;background:var(--surface);border:2px solid var(--c);border-radius:6px;padding:12px 14px 14px;display:grid;gap:2px;transition:transform .15s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px var(--c)}
.tile .num{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--c)}
.tile .sym{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--c);letter-spacing:-.02em;margin-top:2px}
.tile .nm{font-weight:700;font-size:16px;line-height:1.25;min-height:2.5em}
.tile .mass{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.tile .mass b{color:var(--ink);font-weight:700}
.legend{margin-top:14px;font-size:13px;color:var(--muted);font-family:var(--mono)}

/* unit page */
.back{border:0;background:none;color:var(--muted);padding:18px 0 6px;font-size:15px}
.unithead{display:flex;gap:18px;align-items:center;padding-block:6px 20px;flex-wrap:wrap}
.unithead .badge{--c:var(--accent);width:84px;height:84px;border:2px solid var(--c);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--c);background:var(--surface);flex:none}
.unithead h1{font-size:clamp(26px,4vw,38px)}
.unithead p{margin:4px 0 0;color:var(--muted)}
.cols{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.lessonlist{display:grid;gap:6px;position:sticky;top:80px}
@media (max-width:760px){.lessonlist{position:static}}
.lessonlist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.lessonlist button span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lessonlist button[aria-current="true"]{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.lessonlist .sep{height:1px;background:var(--line);margin:8px 0}
.lessonlist .act{font-weight:700}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px clamp(18px,4vw,36px)}
.lesson h2{font-size:28px;margin-bottom:12px}
.lesson p{max-width:66ch;margin:0 0 14px}
.lesson ul{max-width:64ch;padding-left:22px;margin:0 0 14px}
.lesson li{margin-bottom:6px}
.vocab{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.vocab h3{font-size:14px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:500}
.vocab dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.vocab dt{font-weight:700;color:var(--c)}
.vocab dd{margin:0}
@media (max-width:520px){.vocab dl{grid-template-columns:1fr}.vocab dd{margin-bottom:6px}}
.tryit{margin-top:16px;background:var(--soft);border-radius:8px;padding:12px 16px;font-size:16px}
.tryit b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--muted);font-weight:500;margin-bottom:2px}
.lessonnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:8px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

/* quiz */
.quiz{max-width:720px;margin:0 auto;padding-top:20px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qhead .kind{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:22px}
.meter i{display:block;height:100%;background:var(--c);transition:width .25s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,30px)}
.qcard .qtext{font-size:21px;font-weight:700;margin:0 0 18px;line-height:1.35}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:17px}
.choice .l{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none;width:1.4em}
.choice:hover:not([disabled]){border-color:var(--c)}
.choice.picked{border-color:var(--c);background:var(--soft)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice[disabled]{cursor:default}
.explain{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:16px}
.explain.ok{background:var(--good-bg);color:var(--ink)}
.explain.no{background:var(--bad-bg);color:var(--ink)}
.explain strong{display:block}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* results */
.result{text-align:center;padding-block:10px 24px}
.result .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--c)}
.result .sub{font-family:var(--mono);color:var(--muted);margin-top:6px}
.result .msg{font-size:20px;font-weight:700;margin-top:12px}
.review{display:grid;gap:10px;margin-top:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:6px;padding:12px 14px;font-size:15px}
.review .item.miss{border-left-color:var(--bad)}
.review .item p{margin:0 0 4px}
.review .item .q{font-weight:700}
.review .item .muted{color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:28px}
.stat .k{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.m{background:var(--soft);color:var(--ink)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:99px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-top:28px;margin-bottom:10px}
.section-h h2{font-size:22px}
/* pictures and animations */
.fig{margin:6px 0 22px;background:var(--soft);border-radius:10px;padding:14px clamp(10px,3vw,20px) 12px;color:var(--ink)}
.fig .figtag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;display:block;margin-bottom:8px}
.fig svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.fig canvas{display:block;width:100%}
.fig figcaption{font-size:15px;color:var(--muted);margin-top:10px;max-width:66ch}
.fig svg text{font-family:var(--body)}
.fig .lb{font-size:14px;font-weight:700;fill:currentColor}
.fig .sm{font-size:12px;fill:currentColor;opacity:.8}
.fig .in{font-size:20px;font-weight:700;fill:#fff}
.fig .in.dk{fill:#333}
.fig .cloud{fill:#F1F5F8;stroke:#9AA9B2;stroke-width:1.5}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px;font-size:15px}
.ctrl input[type=range]{accent-color:var(--c);flex:1;min-width:120px}
.ctrl input[type=number]{font:inherit;font-size:15px;width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.out{font-family:var(--mono);font-size:14px;font-weight:700;margin:8px 0 0}
.btn.small{padding:6px 14px;font-size:15px}
.wtrows{display:grid;gap:8px;margin-top:14px}
.wtrow{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.wtrow b{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wtbar{height:14px;background:var(--surface);border-radius:7px;overflow:hidden}
.wtbar i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .3s}
.watch{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.watch h3{font-size:14px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.watch ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.watch a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 8px;font-size:15px}
.watch a:hover{border-color:var(--c)}
.watch a svg{width:22px;height:22px;flex:none}
.watch a.vid{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px 10px 10px;max-width:520px}
.watch a.vid:hover{border-color:var(--c)}
.watch .play{width:64px;height:44px;border-radius:8px;background:#E0483C;display:grid;place-items:center;flex:none}
.watch .play svg{width:22px;height:22px}
.watch a.vid b{display:block;font-size:16px;line-height:1.3}
.watch a.vid small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.watch p a{color:var(--c)}
.watch p{font-size:13px;color:var(--muted);margin:8px 0 0}

/* stars, badges, games, parent */
.st,.stars{color:#E0A800}
.stars{letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}
.starchip{font-family:var(--mono);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px}
.starbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;max-width:420px}
.starbar i{display:block;height:100%;background:linear-gradient(90deg,#F2B705,#E0A800);border-radius:5px}
.cont{position:relative;display:grid;gap:2px;text-align:left;width:100%;max-width:560px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px 56px 14px 18px;margin-top:6px}
.cont b{font-size:18px;font-family:var(--display)}
.cont small{color:var(--muted);font-size:14px}
.cont .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--accent)}
.tile .checks{display:flex;align-items:center;gap:5px;margin-top:4px}
.tile .checks i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.tile .checks i.on{background:var(--c)}
.tile .checks small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.tile .mass .stars{font-size:13px}
.lessonlist .ck{min-width:1.6em;display:inline-block}
.lessonlist .ck.on{color:var(--good);font-weight:700;font-size:15px}
.lessonlist .act span{min-width:3.6em}
.finish{margin-top:20px;display:flex;justify-content:center}
.btn.big{font-size:18px;padding:12px 22px}
.btn .st{color:#FFE27A}
.finish .got{font-weight:700;color:var(--good)}
.resumed{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--c);text-decoration:underline;padding:0;font-size:15px}
.streak{font-family:var(--mono);font-weight:700;color:#E0A800;margin:-12px 0 12px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bigstars{font-size:54px;line-height:1;margin:8px 0 4px;display:flex;justify-content:center;gap:6px}
.bigstars span{color:var(--line)}
.bigstars span.on{color:#F2B705;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.newbadge{margin-top:12px;background:var(--soft);display:inline-block;padding:8px 14px;border-radius:8px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.howto{color:var(--muted);margin:0 0 14px}
.board{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.colw{display:grid;gap:10px;align-content:start}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;text-align:left;font-size:16px;min-height:52px}
.tcard.word{font-weight:700}
.tcard.sel{border-color:var(--c);background:var(--soft);box-shadow:0 0 0 3px var(--soft)}
.tcard.done{border-color:var(--good);background:var(--good-bg);opacity:.75}
.tcard.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
@media (max-width:520px){.board{grid-template-columns:1fr 1.2fr;gap:8px}.tcard{font-size:14px;padding:10px}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bdg{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:2px;opacity:.6}
.bdg.got{opacity:1;border:2px solid var(--c)}
.bdg .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:700;margin-bottom:4px}
.bdg.got .medal{background:#F2B705;color:#fff}
.bdg small{color:var(--muted);font-size:13px;line-height:1.35}
.stat .v small{font-size:15px;color:var(--muted)}
.pinbox{max-width:420px;margin:40px auto;display:grid;gap:10px;text-align:center}
.pinbox h1{font-size:28px}.pinbox p{color:var(--muted);margin:0}
.pinbox form{display:flex;gap:10px;justify-content:center}
.pinbox input{font:inherit;font-family:var(--mono);font-size:26px;letter-spacing:.4em;width:150px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.pinerr{color:var(--bad);min-height:1.4em}
.ptabs{display:inline-flex;flex-wrap:wrap;margin:10px 0 18px}
.att{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.att summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;cursor:pointer;font-size:15px}

<script>
/* ============ MUSIC ENGINE: notes, staff, key diagram, sound ============ */
const FIG = {};
let figStops = [];
function stopFigs(){ figStops.forEach(f => { try{ f(); }catch(e){} }); figStops = []; stopAllSound(); }
function cssv(el, name){ return getComputedStyle(el).getPropertyValue(name).trim(); }
function loop(fn){
  let alive = true, last = performance.now();
  const tick = t => { if (!alive) return; const dt = Math.min(64, t - last); last = t; fn(t, dt); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  return () => { alive = false; };
}
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const escH = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- Written notes for alto sax (what the student reads and fingers) ---- */
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}, LETTERS = "CDEFGAB";
const FINGER_LIST = [
  ["Bb3","k1 k2 k3 lbb k4 k5 k6 rc"],["B3","k1 k2 k3 lb k4 k5 k6 rc"],["C4","k1 k2 k3 k4 k5 k6 rc"],["C#4","k1 k2 k3 lcs k4 k5 k6 rc"],
  ["D4","k1 k2 k3 k4 k5 k6"],["Eb4","k1 k2 k3 k4 k5 k6 reb"],["E4","k1 k2 k3 k4 k5"],["F4","k1 k2 k3 k4"],["F#4","k1 k2 k3 k5"],
  ["G4","k1 k2 k3"],["G#4","k1 k2 k3 gs"],["A4","k1 k2"],["Bb4","k1 bis"],["B4","k1"],["C5","k2"],["C#5",""]
];
const NOTES = {};
function parseId(id){
  const m = /^([A-G])(#|b)?(\d)$/.exec(id); const L = m[1], acc = m[2]||"", o = +m[3];
  return { id, L, acc, o, midi: 12*(o+1) + SEMI[L] + (acc==="#"?1:acc==="b"?-1:0), dia: o*7 + LETTERS.indexOf(L) };
}
FINGER_LIST.forEach(([id,k]) => { NOTES[id] = Object.assign(parseId(id), {keys: k ? k.split(" ") : []}); });
FINGER_LIST.slice(4).forEach(([id,k]) => { const up = id.replace(/\d$/, d => +d+1); NOTES[up] = Object.assign(parseId(up), {keys: ["oct"].concat(k ? k.split(" ") : [])}); });
[["D6","oct pD"],["Eb6","oct pD pEb"],["E6","oct pD pEb sE"],["F6","oct pD pEb sE pF"]].forEach(([id,k]) => { NOTES[id] = Object.assign(parseId(id), {keys:k.split(" ")}); });
/* alternate fingerings */
NOTES["Bb4:11"]   = Object.assign(parseId("Bb4"), {id:"Bb4:11", keys:["k1","k4"], alt:"“1 and 1” B♭"});
NOTES["Bb4:side"] = Object.assign(parseId("Bb4"), {id:"Bb4:side", keys:["k1","sBb"], alt:"Side B♭"});
NOTES["Bb4"].alt = "Bis B♭";
NOTES["C5:side"]  = Object.assign(parseId("C5"), {id:"C5:side", keys:["k1","sC"], alt:"Side C"});
const RANGE = Object.keys(NOTES).filter(k => !k.includes(":")).sort((a,b) => NOTES[a].midi - NOTES[b].midi);

const pretty = id => { const n = NOTES[id] || parseId(id); return n.L + (n.acc==="#"?"♯":n.acc==="b"?"♭":""); };
const prettyO = id => pretty(id) + (NOTES[id]||parseId(id)).o;
const CONCERT = ["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const concertName = midiW => CONCERT[((midiW - 9) % 12 + 12) % 12];
const hzWritten = midiW => 440 * Math.pow(2, (midiW - 9 - 69) / 12);

const KEYNAME = { oct:"octave key (left thumb)", bis:"small bis key (left index)", gs:"G♯ key (left pinky)", lcs:"low C♯ key (left pinky)", lb:"low B key (left pinky)",
  lbb:"low B♭ key (left pinky)", reb:"low E♭ key (right pinky)", rc:"low C key (right pinky)", pD:"palm D key", pEb:"palm E♭ key", pF:"palm F key",
  sE:"side high-E key (right hand)", sC:"side C key (right hand)", sBb:"side B♭ key (right hand)", fF:"front F key" };
function fingerText(id){
  const k = NOTES[id].keys;
  if (!k.length) return "No keys pressed at all! Everything is open.";
  const lh = ["k1","k2","k3"].filter(x=>k.includes(x)).map(x=>x[1]), rh = ["k4","k5","k6"].filter(x=>k.includes(x)).map(x=>x[1]);
  const extra = k.filter(x => !/^k\d$/.test(x)).map(x => KEYNAME[x]);
  const parts = [];
  parts.push("Left hand: " + (lh.length ? lh.join(" ") : "none"));
  parts.push("Right hand: " + (rh.length ? rh.join(" ") : "none"));
  if (extra.length) parts.push("Plus: " + extra.join(", "));
  return parts.join(" · ");
}

/* ---- Key diagram (like a fingering chart) ---- */
function keysSVG(id, opts={}){
  const on = new Set(id && NOTES[id] ? NOTES[id].keys : (opts.keys||[]));
  const c = (k,x,y,r,lab) => `<circle data-k="${k}" class="${on.has(k)?"on":""}" cx="${x}" cy="${y}" r="${r}"/>${lab?`<text x="${x+r+4}" y="${y+4}">${lab}</text>`:""}`;
  const e = (k,x,y,rx,ry,lab,lx) => `<ellipse data-k="${k}" class="${on.has(k)?"on":""}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>${lab?`<text x="${lx??x+rx+4}" y="${y+4}">${lab}</text>`:""}`;
  const fl = opts.fingers ? (n)=>`<text x="54" y="0" class="fnum">${n}</text>` : ()=>"";
  return `<svg class="keys" viewBox="0 0 200 460" role="img" aria-label="${id?`Fingering for ${pretty(id)}: ${fingerText(id)}`:"Saxophone keys"}">
  ${e("oct",40,98,11,11,"8va",2)}
  ${e("pD",56,40,10,6,"D",30)}${e("pEb",50,58,10,6,"E♭",22)}${e("pF",64,74,10,6,"F",40)}
  ${e("fF",126,76,8,5,"",0)}
  ${c("k1",100,110,16,"1")}${c("bis",100,137,6,"")}${c("k2",100,164,16,"2")}${c("k3",100,206,16,"3")}
  ${e("gs",138,232,13,7,"G♯",154)}${e("lcs",140,254,11,6,"C♯",154)}${e("lb",130,272,11,6,"B",104)}${e("lbb",152,272,11,6,"B♭",166)}
  <line class="div" x1="50" y1="296" x2="150" y2="296"/>
  ${e("hFs",150,316,8,5,"",0)}${e("sE",150,334,8,5,"",0)}${e("sC",150,352,8,5,"",0)}${e("sBb",150,370,8,5,"",0)}
  <text x="162" y="338">E</text><text x="162" y="356">C</text><text x="162" y="374">B♭</text>
  ${c("k4",100,328,16,"")}${c("k5",100,370,16,"")}${c("k6",100,412,16,"")}
  <text x="70" y="332">4</text><text x="70" y="374">5</text><text x="70" y="416">6</text>
  ${e("reb",136,432,11,6,"E♭",150)}${e("rc",136,450,13,6,"C",154)}
  <text x="6" y="200">LEFT</text><text x="6" y="380">RIGHT</text>
  </svg>`;
}

/* ---- Staff drawing ---- */
const SHARP_POS = [8,5,9,6,3,7,4], FLAT_POS = [4,7,3,6,2,5,1];
function staffSVG(ids, opts={}){
  const gap = 12, bottom = 108, sp = opts.spacing || 58, ks = opts.keysig || 0;
  const x0 = 70 + Math.abs(ks)*12 + (opts.time ? 26 : 0);
  const W = opts.width || Math.max(260, x0 + ids.length*sp + 20), H = opts.height || 160;
  const yOf = p => bottom - p*gap/2;
  let s = `<svg class="staff" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label||"Music staff"}" style="--c:var(${opts.color||"--accent"})">`;
  for (let i=0;i<5;i++) s += `<line class="sl" x1="4" x2="${W-4}" y1="${bottom-i*gap}" y2="${bottom-i*gap}"/>`;
  s += `<text class="clef" x="6" y="${bottom+10}" font-size="72">𝄞</text>`;
  for (let i=0;i<Math.abs(ks);i++){ const p = ks>0 ? SHARP_POS[i] : FLAT_POS[i]; s += `<text x="${56+i*12}" y="${yOf(p)+(ks>0?5:3)}" font-size="22" fill="currentColor">${ks>0?"♯":"♭"}</text>`; }
  if (opts.time){ const tx = 58 + Math.abs(ks)*12; s += `<text x="${tx}" y="${bottom-26}" font-size="26" font-weight="800" fill="currentColor" font-family="var(--display)">${opts.time[0]}</text><text x="${tx}" y="${bottom-2}" font-size="26" font-weight="800" fill="currentColor" font-family="var(--display)">${opts.time[1]}</text>`; }
  ids.forEach((raw,i) => {
    const x = x0 + i*sp + sp/2;
    if (raw==null || raw==="R"){ s += `<g class="ng" data-i="${(opts.start||0)+i}"><text x="${x-6}" y="${bottom-14}" font-size="26" fill="currentColor">𝄽</text></g>`; return; }
    const id = raw.split(":")[0], n = NOTES[id] || parseId(id), p = n.dia - 30, y = yOf(p);
    let g = `<g class="ng ${opts.hi===i?"hi":""} ${opts.click?"notebtn":""}" data-i="${(opts.start||0)+i}" data-id="${id}">`;
    if (opts.click) g += `<rect x="${x-sp/2+2}" y="0" width="${sp-4}" height="${H}" fill="transparent"/>`;
    for (let q=-2; q>=p; q-=2) g += `<line x1="${x-13}" x2="${x+13}" y1="${yOf(q)}" y2="${yOf(q)}" stroke="currentColor" stroke-width="1.4"/>`;
    for (let q=10; q<=p; q+=2) g += `<line x1="${x-13}" x2="${x+13}" y1="${yOf(q)}" y2="${yOf(q)}" stroke="currentColor" stroke-width="1.4"/>`;
    if (n.acc && !opts.noAcc) g += `<text x="${x-26}" y="${y+(n.acc==="#"?6:4)}" font-size="24" fill="currentColor">${n.acc==="#"?"♯":"♭"}</text>`;
    const dur = opts.durs ? opts.durs[i] : 1, open = dur>=2;
    g += `<ellipse class="nh" cx="${x}" cy="${y}" rx="7.6" ry="5.6" transform="rotate(-20 ${x} ${y})" ${open?`style="fill:var(--surface);stroke:currentColor;stroke-width:2.2"`:""}/>`;
    if (dur<4 && opts.stems!==false){ const up = p<4; g += up ? `<line x1="${x+6.8}" x2="${x+6.8}" y1="${y-2}" y2="${y-36}" stroke="currentColor" stroke-width="1.6"/>` : `<line x1="${x-6.8}" x2="${x-6.8}" y1="${y+2}" y2="${y+36}" stroke="currentColor" stroke-width="1.6"/>`;
      if (dur===0.5) g += up ? `<path d="M${x+6.8} ${y-36} q10 10 8 22" fill="none" stroke="currentColor" stroke-width="2"/>` : `<path d="M${x-6.8} ${y+36} q10 -10 8 -22" fill="none" stroke="currentColor" stroke-width="2"/>`; }
    if (opts.names) g += `<text x="${x}" y="${H-6}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor" font-family="var(--mono)">${opts.names===true?pretty(raw):opts.names[i]}</text>`;
    s += g + `</g>`;
  });
  return s + `</svg>`;
}

/* ---- Sound: a simple saxophone-like synth ---- */
let actx = null, master = null, live = [];
function AC(){
  try{
    if (!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination); }
    if (actx.state === "suspended") actx.resume();
  }catch(e){ return null; }
  return actx;
}
function saxNote(hz, when, dur, o={}){
  const ctx = AC(); if (!ctx) return;
  const t0 = Math.max(when||ctx.currentTime, ctx.currentTime), vol = (o.vol ?? 0.6) * 0.32;
  const osc = ctx.createOscillator(), osc2 = ctx.createOscillator(), g2 = ctx.createGain(), filt = ctx.createBiquadFilter(), env = ctx.createGain();
  osc.type = "sawtooth"; osc.frequency.value = hz; osc2.type = "square"; osc2.frequency.value = hz; g2.gain.value = 0.25;
  filt.type = "lowpass"; filt.frequency.value = Math.min(5200, hz*3.2 + 500*(o.vol??0.6)); filt.Q.value = 1.2;
  const atk = o.accent ? 0.008 : o.slur ? 0.004 : 0.03, rel = o.slur ? 0.02 : 0.07;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(vol*(o.accent?1.6:1), t0+atk);
  if (o.accent) env.gain.linearRampToValueAtTime(vol, t0+0.12);
  if (o.cresc) env.gain.linearRampToValueAtTime(o.cresc*0.32, t0+dur*0.95);
  env.gain.setValueAtTime(o.cresc? o.cresc*0.32 : vol, t0+Math.max(atk, dur-rel));
  env.gain.linearRampToValueAtTime(0.0001, t0+dur);
  let lfo = null;
  if (o.vib){ lfo = ctx.createOscillator(); const lg = ctx.createGain(); lfo.frequency.value = 5.2; lg.gain.value = hz*0.011; lfo.connect(lg); lg.connect(osc.frequency); lg.connect(osc2.frequency); lfo.start(t0); lfo.stop(t0+dur+0.05); }
  osc.connect(filt); osc2.connect(g2).connect(filt); filt.connect(env).connect(master);
  osc.start(t0); osc2.start(t0); osc.stop(t0+dur+0.05); osc2.stop(t0+dur+0.05);
  const rec = {osc, osc2, lfo, env}; live.push(rec);
  osc.onended = () => { live = live.filter(r => r!==rec); };

function playWritten(id, dur=0.8, o={}){ const n = NOTES[id.split(":")[0]] || parseId(id); saxNote(hzWritten(n.midi), 0, dur, o); }
function click(when, accent){
  const ctx = AC(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "square"; o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(accent?0.35:0.2, when+0.002); g.gain.exponentialRampToValueAtTime(0.0001, when+0.05);

}
function drum(when, kind){
  const ctx = AC(); if (!ctx) return;
  const len = kind==="hat" ? 0.05 : 0.18, buf = ctx.createBuffer(1, ctx.sampleRate*len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, kind==="hat"?4:2);
  const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = buf; f.type = kind==="hat" ? "highpass" : "lowpass"; f.frequency.value = kind==="hat" ? 7000 : 180; g.gain.value = kind==="hat" ? 0.25 : 0.9;
  src.connect(f).connect(g).connect(master); src.start(when);
  if (kind==="kick"){ const o = ctx.createOscillator(), og = ctx.createGain(); o.frequency.setValueAtTime(120, when); o.frequency.exponentialRampToValueAtTime(45, when+0.15);
    og.gain.setValueAtTime(0.7, when); og.gain.exponentialRampToValueAtTime(0.0001, when+0.2); o.connect(og).connect(master); o.start(when); o.stop(when+0.22); }
}
let seqTimers = [];
function stopAllSound(){
  seqTimers.forEach(clearTimeout); seqTimers = [];
  if (!actx) return;
  const t = actx.currentTime;
  live.forEach(r => { try{ r.env.gain.cancelScheduledValues(t); r.env.gain.setValueAtTime(0.0001, t); r.osc.stop(t+0.02); r.osc2.stop(t+0.02); }catch(e){} });

/* play a list of [id|"R", beats] ; returns total ms */
function playSeq(seq, bpm, o={}){
  stopAllSound();
  const ctx = AC(); if (!ctx) return 0;
  const beat = 60/bpm, start = ctx.currentTime + 0.12;
  let t = 0;
  if (o.countIn){ for (let i=0;i<o.countIn;i++) click(start + i*beat, i===0); t = o.countIn*beat; }
  seq.forEach(([id, beats, style], i) => {
    let dur = beats*beat;
    if (o.swing && beats===0.5){ const pos = Math.round(t/beat*2) % 2; dur = pos===0 ? beat*2/3 : beat/3; }
    const st = style || o.style || "";
    if (id && id!=="R"){
      const len = st==="stacc" ? Math.min(dur*0.4, 0.18) : st==="slur" ? dur : dur*0.9;
      saxNote(hzWritten((NOTES[id.split(":")[0]]||parseId(id)).midi), start+t, len, {vol:o.vol, accent:st==="accent", slur:st==="slur" && i>0, vib:o.vib});
    }
    if (o.clicks) { /* clicks on each beat handled below */ }
    if (o.onStep) seqTimers.push(setTimeout(() => o.onStep(i), (t + 0.12)*1000));
    t += dur;
  });
  if (o.clicks){ for (let b=0; b<Math.round(t/beat); b++) click(start + b*beat, b%(o.clicks)===0); }
  if (o.onEnd) seqTimers.push(setTimeout(o.onEnd, (t + 0.2)*1000));
  return t*1000;
}
const parseSong = s => s.trim().split(/\s+/).map(tok => { const [id, b, st] = tok.split("/"); return [id, +(b||1), st]; });

function songFig(songs, cap, o={}){

    const ids = ["E4","F4","G4","A4","B4","C5","D5","E5","F5"];
    const draw = (hiSet) => { root.querySelector(".st-slot").innerHTML = staffSVG(ids, {click:true, stems:false, spacing:54, color:"--u3"});
      root.querySelectorAll(".ng").forEach(g => { if (hiSet && hiSet.includes(g.dataset.id)) g.classList.add("hi");
        g.onclick = () => { playWritten(g.dataset.id); root.querySelectorAll(".ng").forEach(x=>x.classList.toggle("hi", x===g));
          const p = NOTES[g.dataset.id].dia - 30; root.querySelector(".st-d").innerHTML = `<b>${pretty(g.dataset.id)}</b> is on a ${p%2===0?"line":"space"}.`; }; }); };
    root.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
      const m = b.dataset.m, set = m==="lines" ? ["E4","G4","B4","D5","F5"] : m==="spaces" ? ["F4","A4","C5","E5"] : ids;
      draw(set); root.querySelector(".st-d").innerHTML = m==="lines" ? "Lines, bottom to top: <b>E G B D F</b> — Every Good Bird Does Fly." : m==="spaces" ? "Spaces, bottom to top spell <b>FACE</b>." : "Climbing up the staff one step at a time.";
      playSeq(set.map(id=>[id, .5]), 100, {onStep: i => root.querySelectorAll(".ng").forEach(g=>g.classList.toggle("hi", g.dataset.id===set[i]))});
    });

  }};

FIG["read-1"] = { tag:"Listen", cap:"Each row fills one measure of 4 beats. Tap a row to hear it with a click on every beat.",
  html:`<div class="nv-rows"></div><div class="beats" data-bt>${[1,2,3,4].map(i=>`<i>${i}</i>`).join("")}</div>`,
  init(root){
    const R = [["Whole note","4 beats",[4]],["Half notes","2 beats each",[2,2]],["Quarter notes","1 beat each",[1,1,1,1]],["Eighth notes","½ beat each",[.5,.5,.5,.5,.5,.5,.5,.5]]];
    root.querySelector(".nv-rows").innerHTML = R.map(([n,d,durs],i)=>`<button class="stepcard" data-r="${i}" style="margin-bottom:8px;align-items:center"><span style="min-width:130px"><b>${n}</b><br><small>${d}</small></span><span style="flex:1">${staffSVG(durs.map(()=> "B4"), {durs, spacing: 440/durs.length, width: 70+440+20, height:130, stems:true})}</span></button>`).join("");
    const dots = [...root.querySelectorAll("[data-bt] i")];
    root.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      const durs = R[+b.dataset.r][2]; let t = 0; const starts = durs.map(d => { const s = t; t += d; return s; });
      playSeq(durs.map(d=>["B4",d]), 76, {clicks:4, onStep: i => { const beat = Math.floor(starts[i]); dots.forEach((x,j)=>x.classList.toggle("on", j===beat)); }, onEnd: () => dots.forEach(x=>x.classList.remove("on"))});
      const beatMs = 60000/76; [1,2,3].forEach(k => seqTimers.push(setTimeout(() => dots.forEach((x,j)=>x.classList.toggle("on", j===k)), 120 + k*beatMs)));
    });
    return () => {};
  }};

FIG["read-2"] = { tag:"Play with it", cap:"The top number tells how many beats are in each measure. The bottom 4 means a quarter note gets one beat. Beat 1 is always the strongest.",
  html:`<div class="notechips">${["2/4","3/4","4/4"].map((t,i)=>`<button class="chip" data-t="${t}" aria-pressed="${i===2}">${t}</button>`).join("")}</div>
    <div class="ts-staff"></div><div class="beats" data-bt></div>
    <div class="ctrl" style="justify-content:center"><button class="btn small" data-go>▶ Count it</button><button class="btn small ghost" data-stop>■ Stop</button></div><p class="fnote ts-d"></p>`,
  init(root){
    let ts = "4/4", timer = null;
    const INFO = {"2/4":"Two beats per measure: ONE two, ONE two. Great for marches.","3/4":"Three beats per measure: ONE two three. This is waltz time.","4/4":"Four beats per measure: ONE two three four. So common it's called common time and can be written as a C."};
    const draw = () => { const n = +ts[0];
      root.querySelector(".ts-staff").innerHTML = staffSVG(Array(n).fill("G4").concat(["R"]).slice(0,n), {time:[ts[0],"4"], spacing:70, width:120+n*70});
      root.querySelector("[data-bt]").innerHTML = Array.from({length:n},(_,i)=>`<i class="${i===0?"acc":""}">${i+1}</i>`).join("");
      root.querySelector(".ts-d").textContent = INFO[ts];
      root.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t===ts))); };
    const stop = () => { clearInterval(timer); timer = null; root.querySelectorAll("[data-bt] i").forEach(x=>x.classList.remove("on")); };
    root.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { stop(); ts = b.dataset.t; draw(); });
    root.querySelector("[data-go]").onclick = () => { stop(); const n = +ts[0], ctx = AC(); if (!ctx) return; let b = 0; const ms = 600;
      const tick = () => { click(ctx.currentTime+0.01, b%n===0); if (b%n===0) saxNote(hzWritten(67), ctx.currentTime+0.01, 0.3, {vol:.4});
        root.querySelectorAll("[data-bt] i").forEach((x,j)=>x.classList.toggle("on", j===b%n)); b++; if (b>=n*4) setTimeout(stop, ms); };
      tick(); timer = setInterval(tick, ms); };
    root.querySelector("[data-stop]").onclick = stop;
    draw(); return stop;
  }};

FIG["scales-0"] = { tag:"Play with it", cap:"Every major scale follows the same step pattern: whole, whole, half, whole, whole, whole, half. Pick a scale and listen.",
  html:`<div class="notechips">${Object.keys(SCALES).map((k,i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${k.replace("b","♭")} major</button>`).join("")}</div>
  <div class="sc-staff"></div><div class="demo"><button class="btn small" data-go>▶ Up and down</button></div><p class="fnote sc-d"></p>`,
  init(root){
    let k = "C";
    const draw = () => { const ids = SCALES[k];
      const names = ids.map((id,i)=> i===0 ? "" : (NOTES[id].midi - NOTES[ids[i-1]].midi===2 ? "W" : "H"));
      root.querySelector(".sc-staff").innerHTML = staffSVG(ids, {click:true, stems:false, names:true, height:170, spacing:60, color:"--u6"})
        .replace("</svg>", names.map((w,i)=> i ? `<text x="${70+i*60}" y="20" text-anchor="middle" font-size="15" font-weight="800" font-family="var(--mono)" fill="${w==="H"?"var(--u8)":"currentColor"}">${w}</text>` : "").join("") + "</svg>");
      root.querySelectorAll(".sc-staff .ng").forEach(g => g.onclick = () => playWritten(g.dataset.id));
      root.querySelector(".sc-d").innerHTML = `Written <b>${k.replace("b","♭")} major</b> on alto sounds like concert <b>${concertName(NOTES[ids[0]].midi)} major</b> on a piano.`;
      root.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.k===k))); };
    root.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { stopAllSound(); k = b.dataset.k; draw(); });
    root.querySelector("[data-go]").onclick = () => { const ids = SCALES[k], seq = ids.concat(ids.slice(0,-1).reverse()).map((id,i,a)=>[id, i===a.length-1?2:.5]);
      playSeq(seq, 96, {onStep: i => { const id = seq[i][0]; const idx = i < ids.length ? i : 2*ids.length-2-i; root.querySelectorAll(".sc-staff .ng").forEach(g=>g.classList.toggle("hi", +g.dataset.i===idx)); }}); };

FIG["scales-1"] = { tag:"Play with it", cap:"A key signature at the start of each line tells you which notes are always sharp or flat. Sharps and flats always appear in the same order.",
  html:`<div class="notechips">${[0,1,2,3,4,-1,-2,-3,-4].map(n=>`<button class="chip" data-ks="${n}" aria-pressed="${n===0}">${n===0?"none":Math.abs(n)+(n>0?" ♯":" ♭")}</button>`).join("")}</div><div class="ks-staff"></div><p class="fnote ks-d"></p>`,
  init(root){
    const MAJ = {"0":"C","1":"G","2":"D","3":"A","4":"E","-1":"F","-2":"B♭","-3":"E♭","-4":"A♭"};
    const SH = ["F♯","C♯","G♯","D♯"], FL = ["B♭","E♭","A♭","D♭"];
    const CON = {"C":"E♭","G":"B♭","D":"F","A":"C","E":"G","F":"A♭","B♭":"D♭","E♭":"G♭","A♭":"C♭ (B)"};
    const draw = n => { root.querySelector(".ks-staff").innerHTML = staffSVG([], {keysig:n, width:260});
      const acc = n>0 ? SH.slice(0,n) : n<0 ? FL.slice(0,-n) : [];
      root.querySelector(".ks-d").innerHTML = `Key of <b>${MAJ[n]} major</b>${acc.length?": play every "+acc.join(", ")+" all the way through the song":": no sharps or flats"}. Your band hears it as concert <b>${CON[MAJ[n]]} major</b>.`;
      root.querySelectorAll("[data-ks]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.ks===n))); };
    root.querySelectorAll("[data-ks]").forEach(b => b.onclick = () => draw(+b.dataset.ks)); draw(0); return () => {};
  }};

FIG["scales-2"] = { tag:"Play with it", cap:"Alto sax is an E♭ instrument. When you play a written C, a piano would have to play an E♭ to match. Tap a written note to see and hear its concert pitch.",
  html:`<div class="notechips">${["C4","D4","E4","F4","F#4","G4","A4","B4","C5"].map((id,i)=>`<button class="chip" data-w="${id}" aria-pressed="${i===0}">${pretty(id)}</button>`).join("")}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center"><div><span class="eyebrow">You read</span><div class="bignote tr-w"></div></div><div><span class="eyebrow">Piano plays</span><div class="bignote tr-c" style="color:var(--u8)"></div></div></div>
  <div class="demo" style="justify-content:center"><button class="btn small" data-go>▶ Same sound</button></div><p class="fnote tr-d"></p>`,

FIG["expr-0"] = { tag:"Listen", cap:"Dynamics tell you how loud or soft to play. Slide to pick a dynamic, then play. Crescendo means get louder; decrescendo means get softer.",
  html:`<div class="ctrl"><label for="dyn">Dynamic</label><input type="range" id="dyn" min="0" max="5" value="3"><output class="bignote dyn-o" style="font-size:34px;font-style:italic;min-width:60px"></output></div>
  <p class="fnote dyn-d"></p>
  <div class="demo"><button class="btn small" data-go>▶ Play at this dynamic</button><button class="btn small ghost" data-c="up">Crescendo &lt;</button><button class="btn small ghost" data-c="down">Decrescendo &gt;</button></div>`,
  init(root){
    const D = [["pp","pianissimo: very soft",.12],["p","piano: soft",.22],["mp","mezzo piano: medium soft",.36],["mf","mezzo forte: medium loud",.52],["f","forte: loud",.75],["ff","fortissimo: very loud",1]];
    const sl = root.querySelector("#dyn");
    const upd = () => { const d = D[+sl.value]; root.querySelector(".dyn-o").textContent = d[0]; root.querySelector(".dyn-d").innerHTML = `<b>${d[0]}</b> = ${d[1]}. Even when you play softly, keep your air moving fast and steady.`; };
    sl.oninput = upd; upd();
    root.querySelector("[data-go]").onclick = () => playSeq(parseSong("G4 A4 B4 C5 D5/2"), 100, {vol: D[+sl.value][2]});
    root.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { stopAllSound(); const up = b.dataset.c==="up"; saxNote(hzWritten(69), 0, 3, {vol: up?.1:1, cresc: up?1:.1}); });
    return () => {};
  }};

FIG["expr-1"] = { tag:"Listen", cap:"Articulations are little marks above or below notes that tell you how to start and shape each note. Pick one to see the mark and hear it.",
  html:`<div class="notechips">${[["norm","Regular (tongued)"],["slur","Slur"],["stacc","Staccato"],["accent","Accent"],["ten","Tenuto"]].map(([k,n],i)=>`<button class="chip" data-a="${k}" aria-pressed="${i===0}">${n}</button>`).join("")}</div>
  <div class="ar-staff"></div><p class="fnote ar-d"></p><div class="demo"><button class="btn small" data-go>▶ Play it</button></div>`,
  init(root){
    let a = "norm";
    const INFO = { norm:"Each note starts with a light \"too.\"", slur:"A curved line over different notes. Tongue only the first note and connect the rest smoothly.",
      stacc:"A dot above or below the note. Play it short and separated, like a bouncing ball.", accent:"A > mark. Start the note with extra punch, then back off.", ten:"A short line. Hold the note for its full value, smooth and a little weighty." };
    const draw = () => { const ids = ["G4","A4","B4","C5"], sx = 70, sp = 70;
      let svg = staffSVG(ids, {spacing:sp, width:380});
      const marks = ids.map((id,i) => { const x = sx + i*sp + sp/2, y = 108 - (NOTES[id].dia-30)*6;
        if (a==="stacc") return `<circle cx="${x}" cy="${y+16}" r="3" fill="currentColor"/>`;
        if (a==="accent") return `<path d="M${x-8} ${y+14} L${x+8} ${y+19} L${x-8} ${y+24}" fill="none" stroke="currentColor" stroke-width="2"/>`;
        if (a==="ten") return `<line x1="${x-8}" x2="${x+8}" y1="${y+17}" y2="${y+17}" stroke="currentColor" stroke-width="2.5"/>`;
        return ""; }).join("");
      const slur = a==="slur" ? `<path d="M${sx+sp/2-4} 128 Q${sx+sp*2} 158 ${sx+sp*3.5+4} 118" fill="none" stroke="currentColor" stroke-width="2"/>` : "";
      svg = svg.replace("</svg>", marks + slur + "</svg>");
      root.querySelector(".ar-staff").innerHTML = svg; root.querySelector(".ar-d").textContent = INFO[a];
      root.querySelectorAll("[data-a]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.a===a))); };
    root.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { a = b.dataset.a; draw(); });
    root.querySelector("[data-go]").onclick = () => { const st = a==="ten" ? "" : a==="norm" ? "" : a;
      const seq = ["G4","A4","B4","C5"].map((id,i)=>[id, 1, a==="slur"?(i?"slur":""):st]);
      playSeq(seq, 96, {}); };
    draw(); return () => {};
  }};

FIG["adv-1"] = [fingerFig(["Bb4","Bb4:11","Bb4:side","C5","C5:side"], "Same notes, different fingers. Pick the fingering that makes your fingers move the least between notes.", {tag:"Alternate fingerings"}),
  songFig([SONGS.chrom], "The chromatic scale plays every half step. Watch how each fingering changes.")];
FIG["adv-2"] = { tag:"Jam", cap:"Swing eighths are long-short, long-short (\"doo-bah doo-bah\"). Turn on the groove and tap blues-scale notes to improvise. Every note in this scale sounds good over the beat!",
  html:`<div class="demo"><button class="btn small" data-sw="0">Straight eighths</button><button class="btn small" data-sw="1">Swing eighths</button><button class="btn small ghost" data-groove>▶ Start groove</button></div>
  <div class="pad" style="--c:var(--u8)">${["G4","Bb4","C5","C#5","D5","F5","G5"].map(id=>`<button data-j="${id}">${pretty(id)}</button>`).join("")}</div><p class="fnote jm-d">G blues scale: G, B♭, C, C♯, D, F, G. The C♯ is the spicy \"blue note.\"</p>`,
  init(root){
    let grooveT = null;
    const stopG = () => { clearInterval(grooveT); grooveT = null; root.querySelector("[data-groove]").textContent = "▶ Start groove"; };
    root.querySelectorAll("[data-sw]").forEach(b => b.onclick = () => { stopG(); playSeq(parseSong("G4/.5 A4/.5 B4/.5 D5/.5 E5/.5 D5/.5 B4/.5 A4/.5 G4/2"), 110, {swing: b.dataset.sw==="1"}); });
    root.querySelector("[data-groove]").onclick = () => {
      if (grooveT){ stopG(); return; }
      const ctx = AC(); if (!ctx) return; const beat = 60/112; let next = ctx.currentTime + 0.1, n = 0;
      const sched = () => { while (next < ctx.currentTime + 0.3){ const b = n % 4;
        if (b===0 || b===2) drum(next,"kick"); drum(next,"hat"); drum(next + beat*2/3, "hat"); if (b===1||b===3) click(next, false);
        next += beat; n++; } };
      sched(); grooveT = setInterval(sched, 80); root.querySelector("[data-groove]").textContent = "■ Stop groove";
    };
    root.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { playWritten(b.dataset.j, 0.45, {vol:.7}); b.classList.add("on"); setTimeout(()=>b.classList.remove("on"),200);

  lessons:[
    { t:"Parts of the Saxophone",
      body:`<p>The <b>alto saxophone</b> was invented around 1840 by a Belgian instrument maker named <b>Adolphe Sax</b>. That's how it got its name! It is made of brass, but it belongs to the <b>woodwind family</b> because its sound is made by a <b>reed</b>, a thin, flat piece of cane.</p>
<p>When you blow into the <b>mouthpiece</b>, the reed vibrates very fast against it. Those vibrations travel through the <b>neck</b> and the <b>body</b>, and the sound comes out of the <b>bell</b>. The <b>ligature</b> holds the reed tight against the mouthpiece.</p>
<p>Pressing <b>keys</b> closes pads over holes along the body. Closing more holes makes the air column longer, and a longer column makes a <b>lower</b> note. Opening holes makes it shorter and <b>higher</b>.</p>
<p>There are four common saxophones in a school band: <b>soprano</b> (highest), <b>alto</b>, <b>tenor</b>, and <b>baritone</b> (lowest). The alto is the most popular one to start on because it's a comfortable size.</p>`,

    { t:"Breathing and Air Support",
      body:`<p>The saxophone is powered by <b>your air</b>. A big, steady stream of air makes a big, steady sound. Wind players breathe <b>low and deep</b>, using a muscle under your lungs called the <b>diaphragm</b>.</p>
<p>To take a good breath, keep your shoulders relaxed and down. Breathe in so your <b>belly and sides expand</b>, like filling a balloon around your waist. If your shoulders rise, the breath is too shallow.</p>
<p>When you blow, keep the air <b>fast, warm, and steady</b>, like fogging a window but with more push. Using your core muscles to keep that air steady is called <b>air support</b>. Good support makes your tone stronger and your notes more in tune.</p>
<p>Plan your breaths. Most music has spots to breathe at the end of a phrase or during a rest. Sometimes the music shows a breath mark that looks like a comma: <b>’</b></p>`,

      body:`<p>Your <b>embouchure</b> (say AHM-bah-shur) is the way your mouth forms around the mouthpiece. A good embouchure is the secret to a nice tone. Follow these steps:</p>
<ul><li>Roll your <b>bottom lip</b> slightly over your bottom teeth, like a cushion.</li>
<li>Put the mouthpiece in with the <b>reed facing down</b>, resting on that lip.</li>
<li>Set your <b>top teeth</b> gently on top of the mouthpiece, about a half inch from the tip.</li>
<li>Close your lips around it with <b>firm corners</b>, like a drawstring bag. Keep your chin flat.</li></ul>
<p><b>Don't bite!</b> If the sound is thin or squeaky, you may be pinching too hard. If it sounds low, fuzzy, or honks, you may be too loose or have too little mouthpiece in your mouth.</p>
<p>A first test is to play just the <b>mouthpiece and neck</b>, or the mouthpiece alone. A steady, clear pitch means your embouchure is working.</p>`,

      tryit:"Using only the mouthpiece and neck, play a long, steady note for 4 slow counts. Rest and repeat 5 times. Try not to let the pitch wobble."},
    { t:"Tonguing and Your First Note",
      body:`<p>To start a note clearly, wind players use their <b>tongue</b>. Put the tip of your tongue lightly on the tip of the reed. Build up your air, then pull the tongue away like saying <b>“too”</b> or <b>“dah.”</b> The note starts crisply. This is called <b>tonguing</b> or <b>articulation</b>.</p>
<p>The tongue only starts the note. Your <b>air</b> keeps it going. To play several notes in a row, keep blowing and tap the reed with your tongue for each new note: “too-too-too-too.”</p>
<p>A <b>slur</b> connects notes with only one tongue at the beginning. Your fingers change notes while the air flows without stopping.</p>

{
  id:"read", n:3, lv:0, sym:"♪", color:"--u3", name:"Reading Music",
  blurb:"The staff and treble clef, how long notes and rests last, and counting with time signatures.",
  lessons:[
    { t:"The Staff and Treble Clef",
      body:`<p>Music is written on a <b>staff</b>: <b>5 lines and 4 spaces</b>. Notes placed higher on the staff sound higher. Saxophone music uses the <b>treble clef</b>, also called the <b>G clef</b> because its curl wraps around the G line (the second line from the bottom).</p>
<p>Music uses only 7 letter names: <b>A B C D E F G</b>. After G, it starts over at A.</p>
<ul><li><b>Lines</b> from bottom to top: <b>E G B D F</b> (“Every Good Bird Does Fly”).</li>
<li><b>Spaces</b> from bottom to top spell <b>F A C E</b>.</li></ul>
<p>For notes above or below the staff, we add short lines called <b>ledger lines</b>. For example, the C that sits on one ledger line below the staff is called <b>low C</b> on sax.</p>
<p>The staff is split into <b>measures</b> (also called bars) by <b>bar lines</b>. A <b>double bar line</b> marks the end of a piece.</p>`,
      vocab:[["Staff","Five lines and four spaces where music is written"],["Treble clef","The G clef, used for saxophone music"],["Ledger lines","Short lines for notes above or below the staff"],["Measure","One section of music between two bar lines"],["Bar line","A vertical line that divides measures"]],
      tryit:"Take any page of music. Circle five line notes and five space notes and write their letter names underneath."},
    { t:"Notes and Rests",
      body:`<p>The shape of a note tells you <b>how long</b> to hold it. We count time in <b>beats</b>, a steady pulse like a heartbeat or a clock ticking.</p>
<ul><li><b>Whole note</b> (open circle, no stem): 4 beats</li>
<li><b>Half note</b> (open circle with a stem): 2 beats</li>
<li><b>Quarter note</b> (filled circle with a stem): 1 beat</li>
<li><b>Eighth note</b> (filled with a stem and a flag, or connected by a beam): ½ beat. Two eighth notes fit in one beat. Count them “1 &amp;.”</li></ul>
<p>A <b>dot</b> after a note adds half its value. A dotted half note gets 2 + 1 = <b>3 beats</b>.</p>
<p>Every note has a matching <b>rest</b>, a sign for silence of the same length. A whole rest hangs down from the fourth line; a half rest sits on top of the third line like a hat. During a rest, keep counting and get ready to play!</p>`,
      vocab:[["Beat","The steady pulse of music"],["Whole note","Held for 4 beats"],["Half note","Held for 2 beats"],["Quarter note","Held for 1 beat"],["Eighth note","Held for half a beat"],["Rest","A sign for silence"],["Dotted note","A dot adds half the note's value"]],
      tryit:"Clap and count: quarter, quarter, half. Then half, half. Then four pairs of eighth notes: “1 & 2 & 3 & 4 &.”"},
    { t:"Time Signatures and Counting",
      body:`<p>The <b>time signature</b> is the pair of numbers at the beginning of a piece.</p>
<ul><li>The <b>top number</b> tells how many beats are in each measure.</li>
<li>The <b>bottom number</b> tells which note gets one beat. A <b>4</b> means the quarter note gets one beat.</li></ul>
<p>So <b>4/4</b> has four quarter-note beats in each measure. It is so common that it's called <b>common time</b> and is sometimes written as a big <b>C</b>. <b>3/4</b> has three beats per measure (waltzes), and <b>2/4</b> has two (marches).</p>
<p>The <b>tempo</b> is how fast the beats go, measured in <b>beats per minute (bpm)</b>. A <b>metronome</b> clicks a steady beat to help you practice. Start slow, play it right, then speed up.</p>
<p>Counting tip: say the numbers out loud while you clap, and tap your foot on each beat.</p>`,

{

  blurb:"Fingering B, A, G, C, and C♯ with the left hand, then adding the right hand for F, E, D, and F♯.",
  lessons:[
    { t:"B, A, and G",
      body:`<p>Your first three notes use only your <b>left hand</b>. Your right thumb stays under the thumb rest, and your right fingers rest lightly on their keys without pressing.</p>
<ul><li><b>B</b> (middle line): press key <b>1</b> (left index finger).</li>
<li><b>A</b> (second space): press keys <b>1 and 2</b>.</li>
<li><b>G</b> (second line): press keys <b>1, 2, and 3</b>.</li></ul>
<p>Notice the pattern: each finger you add makes the note one step lower. Press only the big pearl keys; don't touch the small bis key between 1 and 2 by accident.</p>
<p>Your first song, <b>Hot Cross Buns</b>, uses just these three notes. Say the letter names out loud, then finger along without blowing, then play it with your air and tongue.</p>`,
      vocab:[["Fingering","Which keys you press to play a note"],["Key 1","Left index finger key, used for B"],["Step","Moving to the next letter name up or down"]],
      tryit:"Play B, A, G as long tones, 4 counts each. Then play Hot Cross Buns three times in a row with no mistakes."},
    { t:"C and C♯",
      body:`<p>Two more left-hand notes live just above B:</p>
<ul><li><b>C</b> (third space): press only key <b>2</b>, your left middle finger. Your index finger comes off! This one feels strange at first.</li>
<li><b>C♯</b> (C sharp): press <b>no keys at all</b>. Every hole is open. It sounds one half step higher than C.</li></ul>
<p>Going from B to C is tricky because two fingers move at once: index finger up, middle finger down. Practice <b>B–C–B–C</b> slowly until the change is smooth and there's no blip between the notes.</p>
<p>C♯ can sound a little unfocused because the sax is wide open. Keep your air fast and your embouchure steady.</p>`,

<ul><li><b>F</b> (first space): 1-2-3 plus key <b>4</b>.</li>
<li><b>E</b> (first line): 1-2-3 plus keys <b>4 and 5</b>.</li>
<li><b>D</b> (space below the staff): 1-2-3 plus keys <b>4, 5, and 6</b>. All six fingers down!</li>

<p>Low notes need <b>more air</b> and a slightly more relaxed embouchure. Check that every finger fully covers its key; one leaky finger can make low notes gurgle or jump up.</p>
<p>With D, E, F♯, G, A, and B you can play <b>Twinkle, Twinkle, Little Star</b>!</p>`,

{
  id:"low", n:5, lv:1, sym:"8va", color:"--u5", name:"The Full Range",
  blurb:"Low notes with pinky keys, the octave key that unlocks the upper register, and sharps and flats.",
  lessons:[
    { t:"Low Notes and Pinky Keys",
      body:`<p>Below low D are the deepest notes on the alto. They all start with <b>all six fingers down</b> and add <b>pinky keys</b>:</p>
<ul><li><b>Low E♭</b>: all six fingers plus the <b>E♭ key</b> (right pinky, upper key).</li>
<li><b>Low C</b>: all six fingers plus the <b>low C key</b> (right pinky, lower key).</li>
<li><b>Low C♯</b>: low C fingering plus the <b>C♯ key</b> (left pinky).</li>
<li><b>Low B</b>: low C fingering plus the <b>low B key</b> (left pinky).</li>
<li><b>Low B♭</b>: low C fingering plus the <b>low B♭ key</b> (left pinky). This is the lowest note on the alto sax!</li></ul>
<p>Low notes are tricky. Use <b>lots of slow, warm air</b> (like saying “oh”), drop your jaw a tiny bit, and don't bite. Make sure every finger seals completely. Starting the note softly with a gentle “doo” tongue helps it speak.</p>`,
      vocab:[["Pinky keys","Keys pressed by the pinky fingers for low notes and some sharps and flats"],["Low B♭","The lowest note on the alto sax"],["Register","A section of an instrument's range, like low, middle, or high"],["Seal","When every pad closes completely with no leaks"]],
      tryit:"Play long tones walking down: D, C, B, B♭. Hold each for 4 slow counts. Rest between each one."},
    { t:"The Octave Key",
      body:`<p>An <b>octave</b> is the distance from one note to the next note with the <b>same letter name</b>, 8 letter names away. Low D to middle D is an octave.</p>
<p>The <b>octave key</b> is pressed by your <b>left thumb</b>. Keep the same fingering and add the octave key, and the note jumps up an octave. The fingering for middle D is exactly the low D fingering plus the thumb!</p>
<p>This works for notes from D up to C♯. The octave key opens a tiny hole that makes the air column vibrate in a higher pattern. In science terms, the sound wave vibrates <b>twice as fast</b>, so the frequency doubles.</p>
<p>Tips for the octave key:</p>
<ul><li><b>Roll</b> the thumb up to the key; don't lift the whole thumb off.</li>
<li>Keep the air fast and steady. Don't bite or squeeze to go higher.</li>
<li>Practice octave slurs: low D to high D and back without tonguing the second note.</li></ul>`,
      vocab:[["Octave","The distance to the next note with the same letter name"],["Octave key","Left-thumb key that raises a note one octave"],["Frequency","How many times per second a sound wave vibrates"],["Upper register","The notes played with the octave key"]],
      tryit:"Play low G, then add the octave key for high G while keeping your air going (a slur). Repeat with A, B, and C."},
    { t:"Sharps, Flats, and Naturals",
      body:`<p><b>Accidentals</b> are signs that change a note:</p>
<ul><li><b>Sharp (♯)</b> raises a note one <b>half step</b>.</li>
<li><b>Flat (♭)</b> lowers a note one half step.</li>
<li><b>Natural (♮)</b> cancels a sharp or flat.</li></ul>
<p>An accidental lasts for the <b>rest of the measure</b>. The bar line cancels it.</p>
<p>Some notes have two names. F♯ and G♭ are the same sound, just like B♭ and A♯. These are called <b>enharmonic</b> notes.</p>
<p>Key fingerings to know:</p>
<ul><li><b>F♯</b>: 1-2-3 plus key 5.</li>
<li><b>G♯</b>: 1-2-3 plus the <b>G♯ key</b> (left pinky).</li>
<li><b>B♭</b>: key 1 plus the small <b>bis key</b> just below it. Press both with your index finger.</li>
<li><b>E♭</b>: low D fingering plus the <b>E♭ key</b> (right pinky).</li>
<li><b>C♯</b>: no keys (middle C♯) or low C plus the C♯ pinky key (low C♯).</li></ul>`,
      vocab:[["Accidental","A sharp, flat, or natural sign placed before a note"],["Flat (♭)","Lowers a note one half step"],["Natural (♮)","Cancels a sharp or flat"],["Enharmonic","Two names for the same sound, like F♯ and G♭"],["Bis key","Small key between keys 1 and 2, used for B♭"]],
      tryit:"Play G, G♯, A, B♭, B, C slowly. Each note is one half step higher. Say each name as you play."}
  ],
  quiz:[

    ["Low C is fingered…",["all six fingers plus the low C pinky key","key 2 only","1-2-3 plus key 4","no keys"],0,"Low C adds the right-pinky low C key to all six fingers."],
    ["Which finger presses the octave key?",["Right thumb","Left thumb","Left pinky","Right index"],1,"The left thumb rolls up to the octave key."],
    ["Adding the octave key to low D gives…",["low E","middle D","low C","high F"],1,"Same fingering plus octave key = an octave higher."],
    ["A flat (♭) makes a note…",["a half step higher","a half step lower","an octave higher","louder"],1,"Flats lower a note one half step."],
    ["How long does an accidental last?",["One note","The rest of the measure","The whole song","Two measures"],1,"The bar line cancels an accidental."],

{
  id:"scales", n:6, lv:1, sym:"Sc", color:"--u6", name:"Scales, Keys, and Transposing",
  blurb:"Building major scales, reading key signatures, and why your alto sax reads different notes than a piano.",
  lessons:[
    { t:"Major Scales",
      body:`<p>A <b>scale</b> is a set of notes going up or down in order. The <b>major scale</b> has 8 notes, starting and ending on the same letter. The starting note is called the <b>tonic</b>, and it gives the scale its name.</p>
<p>Every major scale follows the same pattern of <b>whole steps (W)</b> and <b>half steps (H)</b>:</p>
<p style="font-family:var(--mono);font-weight:700;letter-spacing:.2em">W – W – H – W – W – W – H</p>
<p>A whole step equals two half steps. In C major (C D E F G A B C), the half steps fall between E–F and B–C, so it needs no sharps or flats. In G major, the pattern needs an <b>F♯</b> to make the last step a half step. In F major, it needs a <b>B♭</b>.</p>
<p>Why practice scales? They train your fingers for the patterns found in real music, build your tone, and help you learn key signatures. Most band auditions ask for scales!</p>`,
      vocab:[["Scale","A series of notes in order going up or down"],["Major scale","A scale with the pattern W-W-H-W-W-W-H"],["Tonic","The first note of a scale; the home note"],["Whole step","Two half steps"]],
      tryit:"Play the written G major scale up and down with the metronome at 70, two beats per note. Remember the F♯!"},
    { t:"Key Signatures",
      body:`<p>Instead of writing a sharp or flat every time, composers put a <b>key signature</b> at the start of each line. It tells you which notes are sharp or flat for the <b>whole piece</b>.</p>
<p>Sharps always appear in this order: <b>F C G D A E B</b> (“Father Charles Goes Down And Ends Battle”). Flats appear in the reverse order: <b>B E A D G C F</b> (“Battle Ends And Down Goes Charles's Father”).</p>
<ul><li>No sharps or flats: C major</li>
<li>1 sharp (F♯): G major · 2 sharps: D major · 3 sharps: A major</li>
<li>1 flat (B♭): F major · 2 flats: B♭ major · 3 flats: E♭ major</li></ul>
<p>Quick tricks: for sharp keys, the key is one half step <b>above the last sharp</b>. For flat keys (with 2 or more flats), the key is the <b>next-to-last flat</b>.</p>`,
      vocab:[["Key signature","Sharps or flats at the start of each line that last the whole piece"],["Key","The scale a piece is built on"],["Order of sharps","F C G D A E B"],["Order of flats","B E A D G C F"]],
      tryit:"Find the key signature on three pieces of your band music. Name the key of each one using the tricks."},
    { t:"Transposing and Tuning",
      body:`<p>Here's a surprise: when you play a written <b>C</b>, it sounds like an <b>E♭</b> on the piano! The alto sax is an <b>E♭ instrument</b>. Its music is written in a different key from the notes that actually sound, which is called being a <b>transposing instrument</b>.</p>
<p>The note you read is called <b>written pitch</b>. The note a piano would play to match you is called <b>concert pitch</b>. For alto sax, concert pitch is a <b>major sixth lower</b> than written (9 half steps down). Why? It lets every saxophone use the same fingerings for the same written notes, so switching from alto to tenor or bari is easy.</p>
<p>Bands often tune to <b>concert B♭</b>. On alto sax, that's your written <b>G</b>. Concert A is your written F♯.</p>
<p><b>Tuning</b> your sax: if you're <b>sharp</b> (too high), pull the mouthpiece out a little. If you're <b>flat</b> (too low), push it in. Use the Tuner on the Practice page to check.</p>`,
      vocab:[["Transposing instrument","An instrument whose written notes differ from the sounding notes"],["Concert pitch","The actual sound, matching the piano"],["Written pitch","The note you read in your part"],["Sharp (out of tune)","Slightly too high in pitch"],["Flat (out of tune)","Slightly too low in pitch"]],
      tryit:"Open the Tuner on the Practice page. Play your written G. Does it say concert B♭? Adjust your mouthpiece until the needle is centered."}
  ],
  quiz:[
    ["The pattern of a major scale is…",["W-W-H-W-W-W-H","H-W-W-H-W-W-W","W-H-W-W-H-W-W","W-W-W-W-W-W-W"],0,"Whole, whole, half, whole, whole, whole, half."],
    ["The first note of a scale is the…",["tonic","octave","accidental","tempo"],0,"The tonic is the home note."],
    ["Which major scale has no sharps or flats?",["G","F","C","D"],2,"C major uses only natural notes."],
    ["G major has one sharp. Which one?",["C♯","F♯","G♯","D♯"],1,"G major needs F♯."],
    ["What is the order of sharps?",["F C G D A E B","B E A D G C F","A B C D E F G","C D E F G A B"],0,"Father Charles Goes Down And Ends Battle."],
    ["A key signature with one flat (B♭) is the key of…",["C major","F major","G major","B♭ major"],1,"One flat means F major."],
    ["When alto sax plays a written C, a piano would play…",["C","A","E♭","G"],2,"Alto is an E♭ instrument."],
    ["If you are sharp (too high), you should…",["push the mouthpiece in","pull the mouthpiece out a little","bite harder","play louder"],1,"Pulling out lowers the pitch."]
  ],
  test:[
    ["A whole step equals…",["one half step","two half steps","three half steps","an octave"],1,"Two half steps make a whole step."],
    ["In C major, the half steps fall between…",["C–D and G–A","E–F and B–C","D–E and A–B","F–G and C–D"],1,"E–F and B–C are natural half steps."],
    ["F major needs which flat?",["E♭","B♭","A♭","D♭"],1,"F major has one flat, B♭."],

    ["What is the order of flats?",["B E A D G C F","F C G D A E B","E B A D G F C","A B C D E F G"],0,"Battle Ends And Down Goes Charles's Father."],
    ["Two sharps (F♯ and C♯) is the key of…",["G major","D major","A major","E major"],1,"One half step above the last sharp (C♯) is D."],
    ["Three flats (B♭, E♭, A♭) is the key of…",["F major","B♭ major","E♭ major","A♭ major"],2,"The next-to-last flat is E♭."],
    ["The alto saxophone is an instrument in…",["C","B♭","E♭","F"],2,"Alto sax is in E♭."],
    ["Concert pitch means…",["the note you read","the actual sounding pitch, matching the piano","the loudest note","the highest note"],1,"Concert pitch is what the audience hears."],
    ["Concert B♭ on alto sax is your written…",["B♭","C","G","F"],2,"Written G sounds concert B♭."],
    ["Why are saxophones transposing instruments?",["To confuse the band","So all saxes use the same fingerings for the same written notes","Because they are brass","So they can play louder"],1,"Same fingerings make switching saxes easy."],

  ]

{
  id:"expr", n:7, lv:2, sym:"mf", color:"--u7", name:"Making Music Expressive",
  blurb:"Dynamics, articulations, tempo words, phrasing, and vibrato: the tools that turn notes into music.",
  lessons:[
    { t:"Dynamics",
      body:`<p><b>Dynamics</b> tell you how loud or soft to play. They use Italian words, abbreviated under the staff:</p>
<ul><li><b><i>pp</i></b> pianissimo: very soft</li><li><b><i>p</i></b> piano: soft</li><li><b><i>mp</i></b> mezzo piano: medium soft</li>
<li><b><i>mf</i></b> mezzo forte: medium loud</li><li><b><i>f</i></b> forte: loud</li><li><b><i>ff</i></b> fortissimo: very loud</li></ul>
<p>A <b>crescendo</b> (<b>&lt;</b> or <i>cresc.</i>) means gradually get louder. A <b>decrescendo</b> or <b>diminuendo</b> (<b>&gt;</b> or <i>dim.</i>) means gradually get softer. The wedge shapes are called <b>hairpins</b>.</p>
<p>The secret: dynamics come from <b>how much air</b> you use, not from squeezing your mouth. Soft playing still needs fast, supported air, just less of it. Loud playing needs a big breath and an open throat, but never a harsh, blasting sound.</p>`,
      vocab:[["Dynamics","How loud or soft to play"],["Piano (p)","Soft"],["Forte (f)","Loud"],["Mezzo","Medium, as in mezzo forte"],["Crescendo","Gradually get louder"],["Decrescendo","Gradually get softer"]],
      tryit:"Play a long tone on G. Start pp, crescendo to f over 4 counts, then decrescendo back to pp over 4 counts. Keep the pitch steady!"},
    { t:"Articulations",
      body:`<p><b>Articulation marks</b> show how to start and shape each note:</p>
<ul><li><b>Slur</b> (curved line over different notes): tongue only the first note, then connect the rest smoothly. If the curve joins two of the <b>same</b> note, it's a <b>tie</b>: hold them together as one long note.</li>
<li><b>Staccato</b> (dot): short and separated. Stop the note by stopping the air or with a light tongue, never by closing your throat.</li>
<li><b>Accent</b> (&gt;): start the note with extra emphasis, then relax.</li>
<li><b>Tenuto</b> (−): hold the note for its full value, smooth and slightly stressed.</li>
<li><b>Legato</b>: smooth and connected, with a very soft “doo” tongue.</li></ul>

/* ============ SCORING, STARS, BADGES ============ */
const unitById = id => UNITS.find(u => u.id === id);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const starsFor = p => p>=90?3:p>=75?2:p>=60?1:0;
const starStr = (n, max=3) => `<span class="stars" aria-label="${n} of ${max} stars">${"★".repeat(n)}<span class="off">${"★".repeat(max-n)}</span></span>`;
function rs(stu, unit, kind){ return results.filter(r => r.student===stu && r.unit===unit && r.kind===kind); }
function best(stu, unit, kind){ const a = rs(stu,unit,kind); return a.length ? Math.max(...a.map(r => r.pct)) : null; }
function bestStars(stu, unit, kind){ const b = best(stu,unit,kind); return b==null ? 0 : starsFor(b); }
function lessonsDone(stu, u){ const d = (prog[stu]||{}).done||{}; return u.lessons.filter((_,i)=>d[u.id+"-"+i]).length; }
function starTotal(stu){
  let t = 0; const d = (prog[stu]||{}).done||{};
  t += Object.keys(d).length;
  UNITS.forEach(u => ["quiz","test","game"].forEach(k => t += bestStars(stu,u.id,k)));
  t += bestStars(stu,"final","final");
  [1,2,3].forEach(l => t += bestStars(stu,"reader"+l,"reader"));
  return t;
}
const STAR_MAX = UNITS.reduce((a,u)=>a+u.lessons.length,0) + UNITS.length*9 + 3 + 9;
const pdays = stu => practice[stu] || {};
const pMinutes = stu => Object.values(pdays(stu)).reduce((a,b)=>a+b,0);
function pStreak(stu){ const d = pdays(stu); let n = 0; const day = new Date(); if (!d[dkey(day)]) day.setDate(day.getDate()-1);
  while (d[dkey(day)]){ n++; day.setDate(day.getDate()-1); } return n; }
function dkey(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function badges(stu){
  const d = (prog[stu]||{}).done||{}, mine = results.filter(r=>r.student===stu), st = starTotal(stu);
  const lvDone = lv => UNITS.filter(u=>u.lv===lv).every(u => lessonsDone(stu,u)===u.lessons.length && (best(stu,u.id,"test")||0)>=80);
  const list = [
    ["First Note","Finish your first lesson", Object.keys(d).length>=1],
    ...UNITS.map(u => [`Unit ${u.n} Master`,`Finish every ${u.name} lesson and score 80%+ on its test`, lessonsDone(stu,u)===u.lessons.length && (best(stu,u.id,"test")||0)>=80, u.color]),
    ["Beginner Graduate","Master Units 1 to 4", lvDone(0), "--u4"],
    ["Intermediate Graduate","Master Units 5 and 6", lvDone(1), "--u6"],
    ["Advanced Graduate","Master Units 7 and 8", lvDone(2), "--u8"],
    ["Perfect Pitch","Get 100% on any quiz or test", mine.some(r=>!["game","reader"].includes(r.kind) && r.pct===100)],
    ["Word Wizard","Get 3 stars in a vocabulary match game", mine.some(r=>r.kind==="game" && r.stars===3)],
    ["Sight Reader","Get 3 stars on all three Note Reader levels", [1,2,3].every(l=>bestStars(stu,"reader"+l,"reader")===3)],
    ["Hot Streak","Answer 5 practice questions in a row correctly", mine.some(r=>(r.bestStreak||0)>=5)],
    ["Practice Habit","Log practice on 5 different days", Object.keys(pdays(stu)).length>=5],
    ["Week Warrior","Practice 7 days in a row", pStreak(stu)>=7],
    ["100 Minute Club","Log 100 minutes of practice", pMinutes(stu)>=100],
    ["Star Collector","Earn 50 stars", st>=50],
    ["Sax Graduate","Score 80%+ on the final exam", (best(stu,"final","final")||0)>=80]
  ];
  return list.map(([name,how,got,color]) => ({name,how,got,color}));
}

/* ============ FUN: SOUND + CONFETTI ============ */
function tone(freqs, dur=0.12){
  if (!soundOn) return;
  try{
    if (!AC()) return;
    freqs.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur*1.6);
      o.connect(g).connect(master); o.start(t0); o.stop(t0+dur*1.8); });
  }catch(e){}
}
const sfx = { right:()=>tone([660,880]), wrong:()=>tone([220,180],.15), star:()=>tone([523,659,784,1047],.1), click:()=>tone([520],.05) };
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols = ["#E57C52","#E0B23C","#8DBB57","#8C9CF0","#3FBFA8","#B48AE6","#F2B705"];
  const bits = Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],s:6+Math.random()*6}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore(); });
    if (t-t0 < 3200) requestAnimationFrame(f); else cv.remove(); })(t0);
}

  return `<button class="tile" style="--c:var(${u.color})" data-unit="${u.id}">
    <span class="num">${u.n} <span class="lvpill">· ${LEVELS[u.lv][0]}</span></span><span class="sym">${u.sym}</span><span class="nm">${esc(u.name)}</span>
    <span class="checks" aria-label="${d} of ${u.lessons.length} lessons done">${u.lessons.map((_,i)=>`<i class="${i<d?"on":""}"></i>`).join("")}<small>${d}/${u.lessons.length} lessons</small></span>
    <span class="mass"><span>Quiz ${starStr(student?bestStars(student,u.id,"quiz"):0)}</span><span>Test ${starStr(student?bestStars(student,u.id,"test"):0)}</span></span>
  </button>`;
}
function continueCard(){
  if (!student) return "";
  const ip = inprog[student], last = P().last;
  if (ip) return `<button class="cont" id="cont"><span class="eyebrow">Pick up where you left off</span><b>${kindLabel(ip.kind)}: ${esc(titleOf(ip.unit))}</b><small>Question ${ip.i+1} of ${ip.qs.length} · your answers so far are saved</small><span class="arrow">→</span></button>`;
  if (last){ const u = unitById(last.unit); return `<button class="cont" id="cont"><span class="eyebrow">Continue</span><b>Lesson ${u.n}.${last.lesson+1}: ${esc(u.lessons[last.lesson].t)}</b><small>${esc(u.name)}</small><span class="arrow">→</span></button>`; }
  return `<button class="cont" id="cont"><span class="eyebrow">Start here</span><b>Lesson 1.1: ${esc(UNITS[0].lessons[0].t)}</b><small>${esc(UNITS[0].name)}</small><span class="arrow">→</span></button>`;
}
