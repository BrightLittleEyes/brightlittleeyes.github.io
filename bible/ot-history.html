<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT History">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Old Testament World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EDEA; --ink:#1B2B2F; --muted:#56696B;
  --line:#D3DEDA; --accent:#2A4F9E; --accent-ink:#FFFFFF; --accent-soft:#E1E8F6;
  --gold:#C98A1A; --gold-soft:#FBEBC8; --good:#2E7D4F; --good-soft:#D9F0E2; --bad:#B4432F; --bad-soft:#F7DDD6;
  --sea:#D5E6EC; --land:#EFEBE0; --land-line:#B9B09A; --river:#5E93B0; --pin:#2A4F9E; --maptext:#3B4A4C; --region:#8A8472;
  --paper:#F7F3E8; --paper-line:#E2D8BF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif:"Lora", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
    --line:#2A4043; --accent:#8FB0F0; --accent-ink:#0E1830; --accent-soft:#1E2B45;
    --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
    --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#8FB0F0; --maptext:#DCE6E4; --region:#8C9690;
    --paper:#22241F; --paper-line:#3A3C33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
  --line:#2A4043; --accent:#8FB0F0; --accent-ink:#0E1830; --accent-soft:#1E2B45;
  --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
  --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#8FB0F0; --maptext:#DCE6E4; --region:#8C9690;
  --paper:#22241F; --paper-line:#3A3C33;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.top .spacer{flex:1}
.stars{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--gold-soft);color:var(--ink);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;color:var(--gold)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h1{font-size:clamp(28px,6vw,40px)}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.next{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:grid;gap:10px;margin-bottom:28px}
.next .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.next h2{font-size:26px}
.next .ref{opacity:.9}
.next button{justify-self:start;background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.group{margin-bottom:26px}
.group h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group h3 .cnt{letter-spacing:0;text-transform:none;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px}
details.group > summary{cursor:pointer;list-style:none;margin-bottom:10px}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary h3::before{content:"▸";margin-right:8px;color:var(--accent)}
details.group[open] > summary h3::before{content:"▾"}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:grid}
.path li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.stone.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.stone.here{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.path li:not(:last-child) .col::after{content:"";display:block;width:2px;height:22px;background:var(--line);margin:4px auto}
.col{display:grid;justify-items:center}
.lessonbtn{background:none;border:0;text-align:left;color:var(--ink);padding:6px 0 18px;display:grid;gap:2px}
.lessonbtn .t{font-weight:700;font-size:18px;line-height:1.3}
.lessonbtn .r{font-size:14px;color:var(--muted)}
.lessonbtn .sc{font-size:13px;color:var(--good);font-weight:700}

.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;margin-bottom:12px}
.lhead{display:grid;gap:6px;margin-bottom:16px}
.lhead .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lhead h1{font-size:clamp(28px,6vw,40px)}
.lhead .era{color:var(--muted);font-weight:700}
.pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pair .lbl{font-size:13px;color:var(--muted);display:block}
.pair .pt{font-weight:700}
.pair > div{flex:1;min-width:180px}
.intro{font-size:19px;line-height:1.55;margin:0 0 18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:10px}
.card h3{font-size:20px;margin:18px 0 6px}
.card h3:first-of-type{margin-top:4px}
.card p{margin:0 0 12px;max-width:65ch}
.card p:last-child{margin-bottom:0}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--good)}

.mapbox{margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.local{max-width:440px}
.mapbox.sinai{max-width:520px}
.mapcap{font-size:15px;color:var(--muted);margin-top:10px;max-width:62ch}
.m-land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2}
.m-water{fill:var(--sea);stroke:var(--river);stroke-width:1.5}
.m-river{fill:none;stroke:var(--river);stroke-width:2.5;stroke-linecap:round}
.m-region{fill:var(--region);font-family:var(--body);font-weight:700;letter-spacing:.12em}
.m-pin{fill:var(--pin);stroke:var(--land);stroke-width:2.5}
.m-lbl{fill:var(--maptext);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.person b{display:block;font-family:var(--display);font-size:17px;line-height:1.2;margin-bottom:2px}
.person span{font-size:14px;color:var(--muted);line-height:1.4;display:block}

.source{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 20px}
.source h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:2px}
.source .meta{font-size:14px;color:var(--muted);margin-bottom:12px}
.source blockquote{margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;max-width:62ch}
.source .note{font-size:15px;margin:0;max-width:62ch}

.vocab{display:grid;gap:10px;margin:0}
.vocab div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px}
.vocab dt{font-weight:700}
.vocab dd{margin:0;color:var(--ink)}
@media (max-width:520px){ .vocab div{grid-template-columns:1fr;gap:0} }

.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.yr{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.disc{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-left:6px}

.q{margin-bottom:18px}
.q:last-child{margin-bottom:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:15px;margin-top:6px;color:var(--muted)}
textarea{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.assign{background:var(--accent-soft);border-color:transparent}
.finish{text-align:center;display:grid;gap:12px;justify-items:center}
.finish .btn{font-size:18px;padding:12px 22px}
.finish .note{color:var(--muted);font-size:15px}
.celebrate{display:grid;justify-items:center;gap:6px;text-align:center}
.celebrate .starbig{width:64px;height:64px;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .celebrate .starbig{animation:pop .6s ease-out} }
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:84px 24px 1fr;gap:6px;align-items:start;padding:6px 0}
.tl .yr{text-align:right;padding-top:1px}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);margin:5px auto 0;position:relative;z-index:1}
.tl li.locked .dot{background:var(--line)}
.tl li.locked .ev{color:var(--muted);font-style:italic}
.tl .ev b{display:block}
.tl .ev .from{font-size:13px;color:var(--muted)}
.tl li.jesus .dot{background:var(--gold)}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tlhead h2{font-size:24px}
.tlhead span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.foot{margin-top:36px;font-size:12px;color:var(--muted);line-height:1.5}
.settings{display:grid;gap:12px}
.settings label{font-weight:700;display:grid;gap:4px}
.settings input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--muted)}
@media (max-width:480px){ .top{position:static} .card{padding:16px} .brand{font-size:18px} .brand svg{display:none} .tl::before{left:78px} .tl li{grid-template-columns:66px 24px 1fr} .mini li{grid-template-columns:78px 1fr} }
</style>
</head>

    <button class="brand" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21v-4h12v4"/><path d="M8 17v-4h8v4"/><path d="M10 13V9h4v4"/></svg>
      Old Testament World

    <button class="iconbtn" id="tlBtn">Timeline</button>

  <main id="app"></main>
  <p class="foot">History lessons written to pair with the Through the Old Testament Bible lessons. Primary sources are paraphrased or closely translated for young readers unless noted. Videos: Drive Thru History: Holy Land (Dave Stotts), streamed free on TBN. Map outlines from Natural Earth.</p>

<script>
const EMBED = {"lessons/exodus.json":[{"id":"exh-01","bible":"exo-01","bibleTitle":"Slaves in Egypt and Two Brave Midwives","title":"Brickmakers of Egypt","era":"About 1500-1250 BC","intro":"The Israelites were forced to make bricks and build store cities for Pharaoh. An Egyptian tomb painting shows foreign workers doing exactly that, and it's one of the most famous pictures from ancient Egypt.","sections":[{"h":"A Land Built of Mud Brick","p":["We often picture Egypt's great stone pyramids and temples. But most buildings in Egypt, including houses, storehouses, city walls, and even palaces, were built of mud brick. Nile mud was mixed with water and straw, packed into wooden molds, and left to dry in the sun.","Brickmaking was hard, hot, repetitive work, and Egypt needed millions of bricks. Much of it was done by prisoners of war, foreign laborers, and people forced to work for the state."]},{"h":"The Tomb of Rekhmire","p":["Rekhmire was vizier, the highest official under Pharaoh, around 1450 BC. The walls of his tomb near Thebes are painted with scenes of daily work. One famous scene shows workers fetching water from a pool, mixing mud, shaping bricks in molds, stacking them to dry, and carrying them to a building site, while an overseer with a stick watches.","Some workers have lighter skin and beards, the way Egyptians painted foreigners from Canaan and Syria. The caption says they were making bricks for the temple of the god Amun. It's not a picture of the Israelites, but it shows exactly the kind of work Exodus 1 describes."]},{"h":"Pithom and Rameses","p":["Exodus 1:11 says the Israelites built 'Pithom and Rameses as store cities for Pharaoh.' Store cities held grain, weapons, and supplies. Rameses is usually identified with Pi-Ramesses, a huge capital built in the eastern Nile Delta by Pharaoh Ramesses II (ruled about 1279-1213 BC), at the site of Qantir, next to the older city of Avaris.","Pithom is often linked with sites in the Wadi Tumilat, a valley leading east from the Delta toward the Sinai. Scholars debate exactly which sites match and how the name 'Rameses' fits with the date of the Exodus. We'll look at that debate in a later lesson."]}],"people":[{"name":"Rekhmire","role":"Vizier of Egypt around 1450 BC whose tomb shows brickmakers"},{"name":"Ramesses II","role":"Powerful pharaoh (about 1279-1213 BC) who built the city Pi-Ramesses"},{"name":"Shiphrah and Puah","role":"Hebrew midwives who refused Pharaoh's order"}],"source":{"title":"Brickmaking scene in the Tomb of Rekhmire","who":"Egyptian tomb painters","date":"About 1450 BC","text":"The painting shows workers drawing water from a pool, mixing clay, shaping bricks in wooden molds, and carrying them on yokes. An overseer holds a stick. The caption says the workers are making bricks to build a workshop for the temple of Amun at Karnak, and mentions captives brought by the king.","note":"Described and paraphrased. Look up 'Rekhmire brickmakers' with a parent to see the painting. It shows the kind of forced labor the Israelites endured."},"vocab":[["Mud brick","A brick made of mud and straw, dried in the sun"],["Vizier","The highest official in Egypt under Pharaoh"],["Store city","A city built to store grain and supplies"],["Overseer","Someone who supervises workers"]],"map":{"view":"sinai","places":["rameses","pithom","memphis_s"],"caption":"Pi-Ramesses (Rameses) and Pithom were in the eastern Nile Delta, near the land of Goshen."},"timeline":[{"y":-1450,"t":"The Tomb of Rekhmire shows foreign brickmakers (about 1450 BC)"},{"y":-1279,"t":"Ramesses II begins his reign and builds Pi-Ramesses (about 1279 BC)"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What were most Egyptian buildings made of?","options":["Stone","Mud brick","Wood","Glass"],"answer":1,"why":"Even palaces and storehouses."},{"q":"What was mixed into the mud for bricks?","options":["Sand only","Straw","Gold","Salt"],"answer":1,"why":"It held bricks together."},{"q":"Who was Rekhmire?","options":["A pharaoh","A vizier, Egypt's top official","A Hebrew slave","A priest of Israel"],"answer":1,"why":"Around 1450 BC."},{"q":"What does the Rekhmire painting show?","options":["A battle","Workers making bricks","A pyramid","The Exodus"],"answer":1,"why":"Including foreign workers."},{"q":"Who built Pi-Ramesses?","options":["Rekhmire","Ramesses II","Joseph","Moses"],"answer":1,"why":"In the eastern Delta."}],"assignment":"Make your own mud bricks! Mix dirt, water, and dry grass or straw, press it into an ice-cube tray or small box, and let it dry in the sun for several days. Make a few without straw too. Test which is stronger and write up your results."},{"id":"exh-02","bible":"exo-02","bibleTitle":"A Baby in a Basket","title":"Moses' Name and a Babylonian Baby Story","era":"About 2300-1250 BC","intro":"Moses was put in a basket on the river and raised in Pharaoh's household. His name fits Egypt, and a Babylonian story about another baby in a basket helps us see what makes Moses' story special.","sections":[{"h":"An Egyptian Name","p":["Exodus 2:10 says Pharaoh's daughter named him Moses, 'saying, \"I drew him out of the water.\"' In Hebrew, Mosheh sounds like the word for 'draw out.' But the name also fits Egyptian: 'mose' or 'mes' means 'born of' or 'son,' and it appears in pharaohs' names like Thutmose ('son of Thoth') and Ramesses ('Ra is the one who bore him').","So Moses had a name that made sense in both languages, which fits a Hebrew boy raised by an Egyptian princess."]},{"h":"Raised in the Palace","p":["Egyptian royal households included a 'nursery' where princes and the children of officials and foreign rulers were raised and educated together. Students learned to read and write hieroglyphs, along with math, law, and religion.","Acts 7:22 says, 'Moses was educated in all the wisdom of the Egyptians.' This education would later help him lead a nation and write down God's laws."]},{"h":"The Legend of Sargon","p":["Sargon of Akkad was a real king who ruled Mesopotamia around 2300 BC. Centuries later, a story was written about his birth. In it, his mother secretly gave birth, put him in a basket of reeds sealed with bitumen, and set him on the river. A man drawing water rescued him and raised him, and the goddess Ishtar loved him, so he became king.","The two stories share details because rivers, reed baskets, and bitumen were part of life in both Egypt and Mesopotamia. But the purpose is different. Sargon's story glorifies a king's rise to power. In Exodus, the baby is saved so God can use him to rescue an enslaved people."]}],"people":[{"name":"Moses","role":"Hebrew baby raised in Pharaoh's household who led Israel out of Egypt"},{"name":"Sargon of Akkad","role":"Mesopotamian king (about 2300 BC) and hero of a later birth legend"},{"name":"Thutmose III","role":"Powerful pharaoh (about 1479-1425 BC) whose name includes 'mose'"}],"source":{"title":"The Sargon Birth Legend","who":"Mesopotamian scribes","date":"Copies from about 700 BC","text":"Sargon says: My mother conceived me and bore me in secret. She set me in a basket of reeds and sealed the lid with bitumen. She cast me into the river, which did not rise over me. The river carried me to Akki, the water-drawer, who lifted me out and raised me as his son.","note":"Paraphrased. The oldest copies we have were written long after Sargon and long after Moses too, so this story didn't borrow from Exodus or the other way around in any simple way."},"vocab":[["Hieroglyphs","Egyptian picture-writing"],["Legend","A traditional story about a real or imagined hero"],["Akkad","An ancient empire in Mesopotamia founded by Sargon"],["Midian","A region east of the Sinai where Moses fled"]],"map":{"view":"sinai","places":["rameses","memphis_s","midian"],"caption":"Moses grew up in Egypt, then fled east across the Sinai to the land of Midian."},"timeline":[{"y":-2300,"t":"Sargon of Akkad rules Mesopotamia (about 2300 BC)"}],"video":[],"quiz":[{"q":"What does 'Moses' sound like in Hebrew?","options":["King","Draw out","River","Son of Ra"],"answer":1,"why":"Exodus 2:10."},{"q":"What does 'mose' mean in Egyptian?","options":["Water","Born of or son","Prince","Basket"],"answer":1,"why":"As in Thutmose."},{"q":"According to Acts 7:22, what was Moses educated in?","options":["Greek philosophy","All the wisdom of the Egyptians","Babylonian astronomy","Nothing"],"answer":1,"why":"Raised in the palace."},{"q":"Who rescued baby Sargon?","options":["A princess","Akki the water-drawer","A priest","A shepherd"],"answer":1,"why":"In the later legend."},{"q":"How is Moses' story different from Sargon's?","options":["No difference","Moses is saved to rescue God's people, not to glorify himself","Sargon had no basket","Moses became king"],"answer":1,"why":"Different purpose."}],"assignment":"Write your name in Egyptian hieroglyphs using an online or library hieroglyph alphabet chart. Then write a paragraph about how Moses' Egyptian education might have prepared him for God's plan."},{"id":"exh-03","bible":"exo-03","bibleTitle":"The Burning Bush","title":"The Sinai, Midian, and the Name of God","era":"About 1400-1200 BC and AD 500s","intro":"Moses met God at a burning bush near Mount Horeb in the Sinai wilderness. An Egyptian inscription from about 1380 BC may mention God's name, and a monastery built 1,500 years ago still guards a traditional site of the bush.","sections":[{"h":"Desert Shepherds","p":["Moses spent years as a shepherd in Midian, a region east of the Gulf of Aqaba in what is now northwest Saudi Arabia, though Midianites also roamed the Sinai and Negev. The Sinai Peninsula is a triangle of desert and rugged granite mountains between Egypt and Canaan, with few springs and little rain.","Shepherds moved their flocks between wells and seasonal pasture. Moses learned the wilderness routes, where to find water, and how to lead animals through harsh country, which were skills he'd need to lead Israel for forty years."]},{"h":"The Shasu of Yhw","p":["Egyptians called desert nomads east of Egypt the 'Shasu.' In a temple at Soleb in Nubia (modern Sudan), built by Pharaoh Amenhotep III around 1380 BC, a list of conquered lands includes 'the land of the Shasu of Yhw.'","Many scholars think 'Yhw' is related to YHWH, the name God revealed to Moses. If so, it's the earliest known mention of that name outside the Bible, connected with nomads in the regions south and east of Canaan, near Midian and Edom. Scholars still debate its exact meaning."]},{"h":"St. Catherine's Monastery","p":["At the foot of Jebel Musa ('Mountain of Moses') in the southern Sinai stands St. Catherine's Monastery. Emperor Justinian had it built around AD 548-565, around an earlier chapel marking the traditional site of the burning bush. It's one of the oldest working Christian monasteries in the world.","The monastery's library holds one of the most important collections of ancient manuscripts anywhere. That's where Codex Sinaiticus was found in the 1800s. A bramble bush still grows in the courtyard, and the monks say it's descended from the original."]}],"people":[{"name":"Jethro","role":"Priest of Midian and Moses' father-in-law"},{"name":"Amenhotep III","role":"Pharaoh (about 1390-1352 BC) who built the temple at Soleb"},{"name":"Emperor Justinian","role":"Byzantine emperor who built St. Catherine's Monastery"}],"source":{"title":"The Soleb Temple Inscription","who":"Egyptian scribes of Amenhotep III","date":"About 1380 BC","text":"Carved on a column base in the temple at Soleb, a list of foreign lands conquered by Pharaoh includes a name ring (drawn as a bound captive) labeled 'land of the Shasu of Yhw.'","note":"Translated and described. 'Shasu' was Egypt's word for desert nomads. Scholars debate whether 'Yhw' is a place, a people, or God's name, but many see it as connected to YHWH."},"vocab":[["Sinai Peninsula","The triangle of desert and mountains between Egypt and Canaan"],["Shasu","Egyptian name for desert nomads east of Egypt"],["YHWH","God's personal name, often written 'the LORD' in English Bibles"],["Monastery","A community where monks live, work, and pray"]],"map":{"view":"sinai","places":["sinai_musa","midian","serabit"],"caption":"The traditional Mount Sinai (Jebel Musa) is in the southern Sinai; Midian lay across the Gulf of Aqaba."},"timeline":[{"y":-1380,"t":"Soleb inscription mentions 'the land of the Shasu of Yhw' (about 1380 BC)"},{"y":548,"t":"Emperor Justinian begins St. Catherine's Monastery (about AD 548)"}],"video":[],"quiz":[{"q":"Where was Midian?","options":["In Egypt","East of the Gulf of Aqaba, in northwest Arabia","In Greece","In Babylon"],"answer":1,"why":"Near the Sinai."},{"q":"What did Egyptians call desert nomads?","options":["Hyksos","Shasu","Hittites","Philistines"],"answer":1,"why":"As in the Soleb inscription."},{"q":"Why is the Soleb inscription important?","options":["It describes the plagues","It may contain the earliest mention of God's name outside the Bible","It shows Moses' face","It's a map"],"answer":1,"why":"'Shasu of Yhw.'"},{"q":"What does Jebel Musa mean?","options":["Holy mountain","Mountain of Moses","Burning bush","Desert rock"],"answer":1,"why":"The traditional Mount Sinai."},{"q":"Which famous manuscript was found at St. Catherine's?","options":["Dead Sea Scrolls","Codex Sinaiticus","The Gilgamesh tablet","The Rosetta Stone"],"answer":1,"why":"In the 1800s."}],"assignment":"Look at satellite images of the Sinai Peninsula with a parent (use a map app). Describe the landscape. Then write a paragraph on how 40 years as a shepherd there prepared Moses for 40 years leading Israel."},{"id":"exh-04","bible":"exo-04","bibleTitle":"Let My People Go","title":"Who Was the Pharaoh of the Exodus?","era":"About 1450 BC or 1260 BC","intro":"The Bible never names the pharaoh who wouldn't let Israel go. Christians and scholars have debated for a long time when the Exodus happened. Learning the two main views is a great lesson in how history works.","sections":[{"h":"The Early Date: About 1446 BC","p":["1 Kings 6:1 says Solomon began building the temple 480 years after Israel came out of Egypt. Since Solomon's temple is dated around 966 BC, adding 480 years gives about 1446 BC. Judges 11:26 also mentions about 300 years between Israel's arrival and the judge Jephthah.","Supporters of this view think the pharaoh of the Exodus was Amenhotep II, son of the great Thutmose III. They take the numbers in these verses as exact."]},{"h":"The Late Date: About 1260 BC","p":["Exodus 1:11 says the Israelites built the city of 'Rameses.' The famous city Pi-Ramesses was built by Ramesses II around 1270 BC. Supporters of this view think the Exodus happened during his reign, and that '480 years' may be a symbolic number (12 generations of 40 years) rather than an exact count.","They also point to the Merneptah Stele, carved around 1208 BC by Ramesses' son, which mentions 'Israel' as a people already living in Canaan. On this view, the pharaoh who refused Moses was Ramesses II himself."]},{"h":"Brick Quotas","p":["Whichever date is right, Egyptian documents show that making bricks by quota was real. A leather scroll from the time of Ramesses II, now in the Louvre, records teams of brickmakers, each with a quota of 2,000 bricks, and notes when they fell short. Another papyrus complains that there were 'no men to make bricks, nor straw in the district.'","When Pharaoh stopped giving straw but kept the same quota (Exodus 5), he was using a familiar Egyptian system to crush the Israelites."]}],"people":[{"name":"Amenhotep II","role":"Pharaoh (about 1427-1401 BC), proposed by the early-date view"},{"name":"Ramesses II","role":"Pharaoh (about 1279-1213 BC), proposed by the late-date view"},{"name":"Merneptah","role":"Son of Ramesses II; his stele mentions Israel around 1208 BC"}],"source":{"title":"The Louvre Leather Roll","who":"Egyptian scribes","date":"Year 5 of Ramesses II (about 1274 BC)","text":"This leather scroll records work at a building site. It lists teams of brickmakers, gives each a target of about 2,000 bricks, and records how many they actually produced, noting shortfalls.","note":"Described. Documents like this show that Egypt carefully tracked brick quotas, just like the quotas in Exodus 5."},"vocab":[["Chronology","The order and dates of events"],["Early date","The view that the Exodus happened about 1446 BC"],["Late date","The view that the Exodus happened about 1260 BC"],["Quota","A fixed amount of work someone must complete"]],"map":{"view":"ane","places":["thebes","memphis","avaris"],"caption":"Egypt's capitals shifted over time. Thebes was the great southern capital; Pi-Ramesses (near Avaris) was Ramesses II's Delta capital."},"timeline":[{"y":-1446,"t":"The Exodus, according to the early-date view (about 1446 BC)"},{"y":-1274,"t":"The Louvre Leather Roll records brick quotas (about 1274 BC)"},{"y":-1260,"t":"The Exodus, according to the late-date view (about 1260 BC)"}],"video":[],"quiz":[{"q":"Which verse gives '480 years' from the Exodus to Solomon's temple?","options":["Genesis 1:1","1 Kings 6:1","Exodus 20:2","Psalm 90:10"],"answer":1,"why":"Used for the early date."},{"q":"About when is the early date?","options":["2000 BC","1446 BC","1260 BC","586 BC"],"answer":1,"why":"966 + 480."},{"q":"Which pharaoh does the late-date view suggest?","options":["Tutankhamun","Ramesses II","Cleopatra","Djoser"],"answer":1,"why":"Builder of Pi-Ramesses."},{"q":"What did the Louvre Leather Roll record?","options":["The plagues","Brick quotas for work teams","Moses' birth","Pharaoh's dreams"],"answer":1,"why":"About 2,000 bricks per team."},{"q":"Does the Bible name the pharaoh of the Exodus?","options":["Yes, Ramesses","Yes, Thutmose","No","Yes, Merneptah"],"answer":2,"why":"That's why dates are debated."}],"assignment":"Make a two-column chart: 'Early Date (1446 BC)' and 'Late Date (1260 BC).' List the evidence for each. Then write a paragraph explaining why Christians who trust the Bible can still disagree about this."},{"id":"exh-05","bible":"exo-05","bibleTitle":"The Plagues","title":"The Gods of Egypt","era":"About 3000-30 BC","intro":"Exodus 12:12 says God brought judgment 'on all the gods of Egypt.' Egyptians worshiped hundreds of gods connected with nature: the Nile, frogs, cattle, the sun, and Pharaoh himself. The plagues struck at the heart of what Egypt trusted.","sections":[{"h":"A World Full of Gods","p":["Egyptians believed gods controlled every part of nature. Hapi was the god of the Nile's yearly flood, pictured as a man with a large belly, a symbol of plenty. Heqet was a frog-headed goddess connected with birth and new life. Hathor, often shown as a cow, was a goddess of love and joy. The Apis bull was worshiped at Memphis as a living god.","Above all was Ra (or Re), the sun god, the most powerful god in Egypt. And Pharaoh was considered a living god on earth, the son of Ra, responsible for keeping order in the universe."]},{"h":"The Plagues and the Gods","p":["The Nile turning to blood struck at the river Egyptians thanked Hapi for. The frogs multiplied beyond control, the opposite of a blessing from Heqet. The death of livestock hit animals connected with sacred bulls and cows. The three days of darkness showed that Ra, the mighty sun, was powerless before the LORD.","The last plague struck Pharaoh's own firstborn son, the future 'god-king.' Egypt's whole system of gods, which promised order and life, was shown to be empty. As God said, 'I will bring judgment on all the gods of Egypt. I am the LORD' (Exodus 12:12)."]},{"h":"A Warning About 'Proof'","p":["You may hear about an Egyptian papyrus called the Admonitions of Ipuwer, which says things like 'the river is blood.' Some people have claimed it describes the plagues. Most scholars, including many Christians, think it's a poem about social chaos written much earlier than the Exodus, not an eyewitness account.","Good historians are careful not to claim more than the evidence shows. The Bible's account doesn't need exaggerated 'proofs' to be trusted."]}],"people":[{"name":"Ra","role":"Egyptian sun god, considered the most powerful"},{"name":"Hapi","role":"Egyptian god of the Nile flood"},{"name":"Heqet","role":"Frog-headed Egyptian goddess of birth"}],"source":{"title":"Hymn to the Nile (Hymn to Hapi)","who":"Egyptian scribes","date":"Copies from about 1200 BC","text":"The hymn praises Hapi: Hail to you, Hapi, who comes forth from the earth to keep Egypt alive! He waters the meadows, makes the barley and wheat grow, and fills the storehouses. When he is slow to come, people suffer and everyone grows poor.","note":"Paraphrased. Egyptians truly believed their lives depended on the Nile god. Imagine how they felt when the river turned to blood."},"vocab":[["Deity","A god or goddess"],["Apis bull","A sacred bull worshiped as a god at Memphis"],["Divine king","A ruler believed to be a god, like Pharaoh"],["Judgment","God's just response to evil"]],"map":{"view":"ane","places":["memphis","thebes","avaris"],"caption":"Egypt's great temples stood along the Nile, from Memphis (home of the Apis bull) to Thebes (the great temple of Amun)."},"timeline":[],"video":[],"quiz":[{"q":"Who was Hapi?","options":["The sun god","The god of the Nile flood","A pharaoh","A frog goddess"],"answer":1,"why":"Pictured with a large belly."},{"q":"Which plague struck at Ra, the sun god?","options":["Frogs","Darkness","Hail","Locusts"],"answer":1,"why":"Three days of darkness."},{"q":"What did Egyptians believe about Pharaoh?","options":["He was a slave","He was a living god","He was a prophet","He was a Hebrew"],"answer":1,"why":"Son of Ra."},{"q":"According to Exodus 12:12, who did God judge?","options":["Only Pharaoh","All the gods of Egypt","Only the magicians","Israel"],"answer":1,"why":"Showing they were empty."},{"q":"Why are scholars careful about the Ipuwer papyrus?","options":["It's fake","It's probably an earlier poem, not an eyewitness account","It's in Hebrew","It was lost"],"answer":1,"why":"Don't claim more than the evidence shows."}],"assignment":"Make a chart matching each of the ten plagues with an Egyptian god or belief it challenged. Then write a paragraph on what Egyptians might have learned about the LORD."},{"id":"exh-06","bible":"exo-06","bibleTitle":"The First Passover","title":"Passover Through 3,000 Years","era":"About 1400 BC to today","intro":"God told Israel to celebrate Passover every year, forever. It has been kept by Jewish families for more than 3,000 years, through exile, persecution, and scattering. It's one of the oldest continuously celebrated holidays in the world.","sections":[{"h":"Passover in the Bible","p":["After the Exodus, Israel celebrated Passover in the wilderness (Numbers 9) and after entering Canaan (Joshua 5). Later kings like Hezekiah and Josiah held great Passover celebrations when they called the nation back to God (2 Chronicles 30 and 35).","By Jesus' time, Passover was a huge festival in Jerusalem. Lambs were sacrificed at the temple, and families ate the meal in homes all over the crowded city, with four cups of wine, unleavened bread, and bitter herbs."]},{"h":"Passover Without a Temple","p":["After the Romans destroyed the temple in AD 70, lambs could no longer be sacrificed there. Jewish teachers developed the Seder, the Passover meal still used today, with a guidebook called the Haggadah ('telling'). A shank bone on the Seder plate remembers the lamb.","During the meal, the youngest child asks, 'Why is this night different from all other nights?' and the family retells the Exodus story, just as Exodus 12:26-27 commanded."]},{"h":"The Samaritan Passover","p":["The Samaritans are a small religious community descended from ancient Israelites of the northern region. They accept only the five books of Moses. Every year, they still sacrifice lambs for Passover on Mount Gerizim, near the ancient city of Shechem, the only group in the world that does.","For Christians, Passover points to Jesus. He died at Passover time, and the Lord's Supper grew out of his last Passover meal. Paul wrote, 'Christ, our Passover lamb, has been sacrificed' (1 Corinthians 5:7)."]}],"people":[{"name":"King Josiah","role":"Held a great Passover when renewing the covenant (2 Kings 23)"},{"name":"The Samaritans","role":"An ancient community that still sacrifices Passover lambs on Mount Gerizim"}],"source":{"title":"The Mishnah, Pesachim 10:4","who":"Jewish rabbis","date":"Written down about AD 200","text":"The Mishnah says that when the second cup is poured, the son asks his father, and if the son has no understanding, the father teaches him: How is this night different from all other nights? On all other nights we eat leavened and unleavened bread; this night only unleavened. Then, according to the son's understanding, the father teaches, beginning with the shame and ending with the praise.","note":"Paraphrased. These questions are still asked at Passover tables today, nearly 2,000 years later."},"vocab":[["Seder","The Passover meal with its set order of readings and foods"],["Haggadah","'Telling': the book used to guide the Seder"],["Unleavened bread","Bread made without yeast (matzah)"],["Samaritans","Descendants of northern Israelites who follow the five books of Moses"]],"map":{"view":"local","places":["shechem","jerusalem"],"caption":"Passover lambs were sacrificed at the temple in Jerusalem. Samaritans still sacrifice them on Mount Gerizim, above Shechem."},"timeline":[{"y":-622,"t":"King Josiah holds a great Passover (about 622 BC)"},{"y":200,"t":"The Mishnah records the Passover questions (about AD 200)"}],"video":[],"quiz":[{"q":"Who held great Passovers to call Israel back to God?","options":["Saul and David","Hezekiah and Josiah","Ahab and Jezebel","Herod and Pilate"],"answer":1,"why":"2 Chronicles 30 and 35."},{"q":"What is the Seder?","options":["A temple","The Passover meal with a set order","A kind of bread","A priest"],"answer":1,"why":"Seder means 'order.'"},{"q":"What does 'Haggadah' mean?","options":["Bread","Telling","Lamb","Freedom"],"answer":1,"why":"The story is retold."},{"q":"Who still sacrifices Passover lambs today?","options":["No one","The Samaritans on Mount Gerizim","The Egyptians","Every church"],"answer":1,"why":"Near ancient Shechem."},{"q":"Who is called 'our Passover lamb'?","options":["Moses","Christ","Aaron","Josiah"],"answer":1,"why":"1 Corinthians 5:7."}],"assignment":"Research the foods on a Passover Seder plate. Draw the plate, label each food, and explain what it represents. Then add a paragraph connecting the Passover lamb to Jesus."},{"id":"exh-07","bible":"exo-07","bibleTitle":"Walking Through the Sea","title":"Chariots, Forts, and the Way to Canaan","era":"About 1450-1250 BC","intro":"God didn't lead Israel along the short coastal road to Canaan. Egyptian carvings show why: that road was lined with Egyptian forts full of soldiers and chariots.","sections":[{"h":"The Way of Horus","p":["The quickest route from Egypt to Canaan ran along the Mediterranean coast across northern Sinai. Egyptians called it the Way of Horus. Exodus calls it 'the road through the Philistine country' (Exodus 13:17).","On a wall of the great temple of Karnak, Pharaoh Seti I (father of Ramesses II) carved a picture of this road around 1290 BC. It shows a chain of forts, each with its own water supply, stretching from Egypt's border fortress at Tjaru toward Canaan. Archaeologists have excavated some of these forts in northern Sinai."]},{"h":"Pharaoh's Chariots","p":["Chariots were the most advanced military weapon of the time. Egyptian chariots were light and fast, made of wood and leather, pulled by two horses, and carried a driver and an archer. Tutankhamun's tomb contained six chariots.","When Pharaoh chased Israel with '600 of the best chariots, along with all the other chariots of Egypt' (Exodus 14:7), he was sending the elite strike force of the most powerful army in the region against a crowd of former slaves on foot."]},{"h":"Where Did They Cross?","p":["The Hebrew name is Yam Suph, which can mean 'Sea of Reeds.' Some scholars place the crossing at one of the lakes or marshes along Egypt's eastern border, such as Lake Timsah or the Bitter Lakes. Others argue for the northern tip of the Gulf of Suez, and some for the Gulf of Aqaba. The Bible gives place names like Pi Hahiroth, Migdol, and Baal Zephon, but their exact locations are unknown today.","What everyone agrees on is how Israel remembered it: God opened a way where there was no way, and the most powerful army in the world could not stop him."]}],"people":[{"name":"Seti I","role":"Pharaoh (about 1290-1279 BC) who carved the Way of Horus relief at Karnak"},{"name":"Tutankhamun","role":"Young pharaoh whose tomb (found in 1922) contained six chariots"}],"source":{"title":"The Karnak Relief of Seti I","who":"Egyptian royal artists","date":"About 1290 BC","text":"On the north wall of the great hall at Karnak, Seti I is shown returning from a military campaign along the Way of Horus. The carving shows a series of forts, each with a name and a pool or well, a canal filled with crocodiles at the border fortress of Tjaru, and captives from Canaan.","note":"Described. The relief works almost like an ancient map, showing why the coastal road was dangerous for runaway slaves."},"vocab":[["Way of Horus","Egypt's fortified coastal road to Canaan"],["Chariot","A two-wheeled, horse-drawn war vehicle"],["Relief","A carving raised from a flat stone surface"],["Yam Suph","Hebrew name for the sea Israel crossed, possibly 'Sea of Reeds'"]],"map":{"view":"sinai","places":["rameses","tjaru","timsah","bitterlakes","suez"],"caption":"The coastal Way of Horus ran past the fortress of Tjaru. Proposed crossing points include Lake Timsah, the Bitter Lakes, and the Gulf of Suez."},"timeline":[{"y":-1290,"t":"Seti I carves the Way of Horus forts at Karnak (about 1290 BC)"},{"y":1922,"t":"Tutankhamun's tomb is found, with six chariots","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What was the Way of Horus?","options":["A river","Egypt's fortified coastal road to Canaan","A temple","A god"],"answer":1,"why":"Lined with forts."},{"q":"Why didn't God lead Israel that way?","options":["It was longer","They might face war and want to go back","It was flooded","It didn't exist"],"answer":1,"why":"Exodus 13:17."},{"q":"How many horses usually pulled an Egyptian chariot?","options":["One","Two","Four","Six"],"answer":1,"why":"Light and fast."},{"q":"How many chariots were in Tutankhamun's tomb?","options":["None","Two","Six","600"],"answer":2,"why":"Found in 1922."},{"q":"Is the exact crossing place known?","options":["Yes, it's marked","No, several locations are proposed","It was in Canaan","It was the Nile"],"answer":1,"why":"The place names aren't identified today."}],"assignment":"Draw a map of the eastern Nile Delta and Sinai. Mark the Way of Horus, Tjaru, Lake Timsah, the Bitter Lakes, and the Gulf of Suez. Draw arrows for two possible routes Israel might have taken."},{"id":"exh-08","bible":"exo-08","bibleTitle":"A Song of Victory and Bitter Water","title":"Victory Songs and the First Mention of 'Israel'","era":"About 1208 BC","intro":"After crossing the sea, Moses and Miriam sang a victory song. Egyptian pharaohs also carved victory hymns in stone. One of them, from about 1208 BC, contains the oldest mention of 'Israel' found outside the Bible.","sections":[{"h":"Ancient Victory Songs","p":["In the ancient world, great victories were celebrated in song and poetry. Pharaohs carved long victory hymns on temple walls and stone slabs, giving credit to their gods and boasting about the enemies they had crushed.","The Song of the Sea (Exodus 15) is different. There's no human hero. It gives all the credit to the LORD: 'The LORD is a warrior; the LORD is his name. Pharaoh's chariots and his army he has hurled into the sea.' Many scholars think it's among the oldest poetry in the Bible."]},{"h":"The Merneptah Stele","p":["In 1896, British archaeologist Flinders Petrie was excavating in Thebes when he found a tall black granite slab carved for Pharaoh Merneptah, son of Ramesses II, around 1208 BC. It's a victory hymn celebrating his military campaigns.","Near the end, it lists defeated places in Canaan and then says: 'Israel is laid waste; its seed is not.' In hieroglyphs, 'Israel' is written with a sign meaning a people, not a city. Petrie reportedly joked that the stele would be better known than anything else he found, and he was right. It proves that a people called Israel lived in Canaan by about 1208 BC."]},{"h":"Drums and Dancing","p":["Miriam led the women with a timbrel, a hand drum. Archaeologists have found many clay figurines of women holding round frame drums from ancient Israel and neighboring lands, suggesting that women playing drums at celebrations was very common.","Victory celebrations with women drumming and dancing appear again when Jephthah returns (Judges 11:34) and when David defeats Goliath (1 Samuel 18:6)."]}],"people":[{"name":"Miriam","role":"Prophet and sister of Moses who led the women in worship"},{"name":"Merneptah","role":"Pharaoh (about 1213-1203 BC) whose stele mentions Israel"},{"name":"Flinders Petrie","role":"British archaeologist who found the Merneptah Stele in 1896"}],"source":{"title":"The Merneptah Stele","who":"Scribes of Pharaoh Merneptah","date":"About 1208 BC","text":"Near the end of the victory hymn: The princes are prostrate, saying 'Peace!' Canaan is plundered with every evil. Ashkelon is carried off, Gezer is captured, Yanoam is made as though it never existed. Israel is laid waste; its seed is not.","note":"Closely translated. Pharaoh's boast that Israel was wiped out turned out to be wrong, but his stele is the earliest mention of Israel outside the Bible. It's now in the Egyptian Museum in Cairo."},"vocab":[["Stele","A tall carved stone slab with writing"],["Victory hymn","A song or poem celebrating a military win"],["Timbrel","A hand drum, like a tambourine"],["Determinative","A hieroglyph sign that shows what kind of word something is"]],"map":{"view":"ane","places":["thebes","hebron_a","memphis"],"caption":"The Merneptah Stele was found at Thebes in Egypt; it describes a campaign in Canaan."},"timeline":[{"y":-1208,"t":"The Merneptah Stele mentions 'Israel' (about 1208 BC)"},{"y":1896,"t":"Flinders Petrie discovers the Merneptah Stele","d":true}],"video":[],"quiz":[{"q":"Who gets the credit in the Song of the Sea?","options":["Moses","The LORD","Miriam","Pharaoh"],"answer":1,"why":"'The LORD is a warrior.'"},{"q":"What is the Merneptah Stele famous for?","options":["Showing the plagues","The oldest mention of 'Israel' outside the Bible","A map of Egypt","Moses' name"],"answer":1,"why":"About 1208 BC."},{"q":"Who found the Merneptah Stele?","options":["Tischendorf","Flinders Petrie","Woolley","Mazar"],"answer":1,"why":"In 1896."},{"q":"What did Merneptah claim about Israel?","options":["It was his ally","It was laid waste; its seed is not","It was in Egypt","It was very rich"],"answer":1,"why":"He was wrong!"},{"q":"What instrument did Miriam play?","options":["Harp","Timbrel (hand drum)","Trumpet","Flute"],"answer":1,"why":"Exodus 15:20."}],"assignment":"Compare Exodus 15:1-18 with the Merneptah Stele passage. Make a chart: who gets credit, who is defeated, and how each ends. Then write a paragraph on what's different about Israel's victory song."},{"id":"exh-09","bible":"exo-09","bibleTitle":"Bread From Heaven","title":"Desert Food: Manna and Quail","era":"About 1400 BC to today","intro":"God fed Israel with manna and quail in the wilderness. Travelers and scientists have described natural things in the Sinai that remind them of these foods, though the Bible describes something far greater.","sections":[{"h":"Quail Over the Sinai","p":["Every spring and fall, huge flocks of quail migrate between Europe and Africa, crossing the Mediterranean and the Sinai. After the long flight over the sea, exhausted birds land on the coast in large numbers, where people have caught them with nets for thousands of years.","Numbers 11:31 says a wind drove quail in from the sea. Egyptian tomb paintings show people catching birds with nets, and quail-netting on the Sinai coast continued into modern times. Travelers' reports of this migration help us picture the event, though the Bible presents it as God's timely provision."]},{"h":"The 'Manna' of the Tamarisk","p":["In parts of the Sinai, tiny insects feed on the sap of tamarisk trees and leave sweet drops that harden into small white grains. Local Bedouin collect it in early summer, and they even call it 'mann.' Monks at St. Catherine's Monastery have sold it to visitors.","But this natural 'manna' appears only in certain places and seasons, in small amounts. The Bible's manna came every day except the Sabbath, for forty years, wherever Israel camped, in amounts large enough to feed the whole nation, and it spoiled if kept overnight except before the Sabbath. Exodus presents it as a miracle, not a natural product."]},{"h":"Remembering the Manna","p":["God told Moses to keep a jar of manna 'for the generations to come' (Exodus 16:32), and Hebrews 9:4 says it was placed in the ark of the covenant.","Josephus, writing in the first century AD, said that in his day a kind of manna still fell in that region. Jesus used the manna to explain who he was: 'Your ancestors ate the manna in the wilderness, yet they died... I am the living bread that came down from heaven' (John 6:49-51)."]}],"people":[{"name":"Josephus","role":"Jewish historian who mentioned manna in his own time"},{"name":"Bedouin","role":"Nomadic Arab peoples of the Sinai and Arabian deserts"}],"source":{"title":"Jewish Antiquities, Book 3","who":"Josephus","date":"About AD 93","text":"Josephus describes the manna as sweet, like honey, and says the Hebrews ate it for forty years. He adds that even in his own day, the whole region is watered by a rain like that which God sent then as food.","note":"Paraphrased. Josephus may be describing the sweet tamarisk secretion. He saw it as a lasting reminder of God's provision."},"vocab":[["Migration","When animals travel long distances with the seasons"],["Tamarisk","A desert tree common in the Sinai and Negev"],["Bedouin","Nomadic Arab peoples of the desert"],["Provision","Supplying what is needed"]],"map":{"view":"sinai","places":["sinai_musa","elim","tjaru"],"caption":"Quail migrate across the Sinai's northern coast each spring and fall. Tamarisk 'manna' is found in parts of the southern Sinai."},"timeline":[],"video":[],"quiz":[{"q":"When do quail migrate over the Sinai?","options":["Only winter","Spring and fall","Never","Only summer"],"answer":1,"why":"Between Europe and Africa."},{"q":"What makes tamarisk 'manna'?","options":["Rain","Insects feeding on tamarisk sap","Birds","Bees"],"answer":1,"why":"Sweet drops that harden."},{"q":"How is the Bible's manna different from tamarisk manna?","options":["It isn't","It came daily for 40 years in huge amounts","It was salty","It came only once"],"answer":1,"why":"A miracle of provision."},{"q":"Where was a jar of manna kept?","options":["In Egypt","In the ark of the covenant","On Mount Sinai","It was eaten"],"answer":1,"why":"Hebrews 9:4."},{"q":"What did Jesus call himself in John 6?","options":["The true vine","The living bread from heaven","The good shepherd","The light"],"answer":1,"why":"John 6:51."}],"assignment":"Look up the migration route of the common quail on a map. Draw it, marking Europe, the Mediterranean, the Sinai, and Africa. Then write a paragraph about how God used his creation to provide for Israel."},{"id":"exh-10","bible":"exo-10","bibleTitle":"Water, a Battle, and Good Advice","title":"Midianites, Copper Mines, and a Bronze Snake","era":"About 1300-1100 BC","intro":"Moses' father-in-law Jethro was a Midianite priest. Archaeologists working at ancient copper mines in southern Israel found a Midianite tent-shrine and a small copper snake, a surprising connection to the wilderness stories.","sections":[{"h":"Who Were the Midianites?","p":["The Midianites were a people of the deserts east and south of Canaan, especially northwest Arabia. Genesis 25:2 traces them to Midian, a son of Abraham and Keturah. They were herders, traders, and skilled metalworkers, and they traveled widely. It was Midianite traders who carried Joseph to Egypt (Genesis 37:28).","Archaeologists recognize Midianite pottery by its distinctive painted designs, often birds and geometric patterns. It has been found at sites in Arabia, the Negev, and southern Jordan."]},{"h":"The Timna Valley","p":["Timna, in the far south of Israel near the Gulf of Aqaba, is one of the oldest copper-mining regions in the world. Egyptians mined copper there during the time of the Ramesside pharaohs, and they built a small shrine to Hathor, their goddess of mining.","In 1969, archaeologist Beno Rothenberg found that after the Egyptians left, Midianites took over the shrine. They removed the Egyptian images, set up standing stones, and covered the shrine with a tent. Inside, they found a small copper snake with a gilded head."]},{"h":"A Tent Shrine and a Bronze Serpent","p":["The discovery reminded many readers of two things in the wilderness story: the tabernacle, which was a tent sanctuary, and the bronze snake Moses made when the Israelites were bitten by snakes (Numbers 21:8-9). Centuries later, King Hezekiah destroyed that bronze snake because people had begun worshiping it (2 Kings 18:4).","The Timna snake doesn't prove any Bible story. But it shows that desert peoples in this region used tent shrines and made copper snake images, fitting the world the Bible describes."]}],"people":[{"name":"Jethro","role":"Priest of Midian and Moses' father-in-law who gave him wise advice"},{"name":"Beno Rothenberg","role":"Archaeologist who excavated the Timna copper mines"},{"name":"Joshua","role":"Led Israel's fighters against the Amalekites"}],"source":{"title":"The Timna Copper Snake","who":"Midianite metalworkers","date":"About 1200-1100 BC; found in 1969","text":"A small copper snake, about 5 inches long, with traces of gold on its head, found in the ruins of a tent-covered shrine at Timna, along with Midianite pottery and standing stones.","note":"Described. The snake is displayed at the Eretz Israel Museum in Tel Aviv. Compare Numbers 21:8-9 and John 3:14-15, where Jesus compares himself to the bronze snake Moses lifted up."},"vocab":[["Midianites","A desert people of northwest Arabia, related to Abraham"],["Copper","A reddish metal, mixed with tin to make bronze"],["Shrine","A small place of worship"],["Amalekites","Desert raiders who attacked Israel at Rephidim"]],"map":{"view":"sinai","places":["timna","midian","kadesh","sinai_musa"],"caption":"Timna's copper mines lie in the south of the Negev, near Midian across the Gulf of Aqaba."},"timeline":[{"y":-1150,"t":"Midianites use a tent shrine at Timna (about 1150 BC)"},{"y":1969,"t":"The Timna copper snake and tent shrine are found","d":true}],"video":[],"quiz":[{"q":"Who was Jethro?","options":["An Egyptian king","A priest of Midian","An Amalekite","A Hebrew slave"],"answer":1,"why":"Moses' father-in-law."},{"q":"What was mined at Timna?","options":["Gold","Copper","Salt","Turquoise"],"answer":1,"why":"One of the oldest copper regions in the world."},{"q":"What did the Midianites put over the shrine?","options":["A stone roof","A tent","Nothing","A pyramid"],"answer":1,"why":"A tent shrine."},{"q":"What small object was found in the shrine?","options":["A golden calf","A copper snake","A crown","A scroll"],"answer":1,"why":"With a gilded head."},{"q":"Who destroyed Moses' bronze snake centuries later?","options":["Pharaoh","King Hezekiah","Joshua","The Philistines"],"answer":1,"why":"People had started worshiping it (2 Kings 18:4)."}],"assignment":"Read Numbers 21:4-9 and John 3:14-15. Write a paragraph explaining how Jesus used the bronze snake to describe what he came to do."},{"id":"exh-11","bible":"exo-11","bibleTitle":"God Comes Down on Mount Sinai","title":"Where Is Mount Sinai?","era":"AD 300s to today","intro":"Israel camped at Mount Sinai for almost a year. But which mountain was it? Christians have honored one peak for 1,600 years, and others have proposed different sites. A pilgrim's diary from the 380s AD shows how early the tradition goes.","sections":[{"h":"Jebel Musa","p":["The traditional Mount Sinai is Jebel Musa ('Mountain of Moses') in the southern Sinai Peninsula, about 7,500 feet high. By the 300s AD, Christian hermits lived in caves nearby, and pilgrims traveled there to worship. A wide plain at its base could have held a large camp.","Today, thousands of visitors climb its 3,750 'Steps of Repentance,' cut by monks, or a longer camel path, often starting at night so they can watch the sunrise from the summit."]},{"h":"Egeria's Diary","p":["Around AD 381-384, a Christian woman named Egeria, probably from Spain or southern France, traveled through the Holy Land and wrote a detailed diary for her friends back home. Part of it was rediscovered in an Italian library in 1884.","Egeria describes climbing Mount Sinai with local monks, reading the Exodus passages at each place they believed events happened, and seeing the site of the burning bush with a church and garden. Her diary is one of the earliest travel accounts by a woman."]},{"h":"Other Proposals","p":["The Bible places Sinai in the wilderness and connects Moses to Midian, and Paul writes of 'Mount Sinai in Arabia' (Galatians 4:25). So some scholars suggest mountains in northwest Saudi Arabia, such as Jebel al-Lawz. Others suggest peaks in the northern Sinai or the Negev, such as Har Karkom.","Each proposal has supporters and critics, and none has been proven. The Israelites didn't build a permanent shrine at Sinai, and later Scripture rarely mentions pilgrims going there. What mattered most was not the mountain, but the God who met them and the covenant he made."]}],"people":[{"name":"Egeria","role":"Christian pilgrim whose diary (about AD 381-384) describes climbing Mount Sinai"},{"name":"Elijah","role":"Prophet who later traveled to 'Horeb, the mountain of God' (1 Kings 19:8)"}],"source":{"title":"The Travels of Egeria","who":"Egeria, a Christian pilgrim","date":"About AD 383","text":"Egeria writes that the mountain is very hard to climb, not winding gradually, but straight up like a wall. At the top is a small church, where the holy men read the passage from the book of Moses and celebrated the offering. From the summit they could see Egypt, Palestine, the Red Sea, and the lands of the Saracens (Arab peoples) below.","note":"Paraphrased. Egeria's excitement and detail show how early Christians connected this mountain with the giving of the law."},"vocab":[["Jebel","Arabic for 'mountain'"],["Hermit","Someone who lives alone for prayer and devotion"],["Diary","A personal daily record of events"],["Covenant","A binding agreement between God and his people"]],"map":{"view":"sinai","places":["sinai_musa","karkom","lawz","serabit"],"caption":"Proposed sites for Mount Sinai: Jebel Musa (traditional), Har Karkom in the Negev, and Jebel al-Lawz in Arabia."},"timeline":[{"y":383,"t":"Egeria climbs Mount Sinai and writes about it (about AD 383)"},{"y":1884,"t":"Egeria's diary is rediscovered in Italy","d":true}],"video":[],"quiz":[{"q":"What does Jebel Musa mean?","options":["Holy mountain","Mountain of Moses","Burning bush","Red mountain"],"answer":1,"why":"The traditional Sinai."},{"q":"Who was Egeria?","options":["An Egyptian queen","A Christian pilgrim who kept a diary","A Roman general","A monk"],"answer":1,"why":"About AD 381-384."},{"q":"When was Egeria's diary rediscovered?","options":["1066","1884","1947","2001"],"answer":1,"why":"In an Italian library."},{"q":"Which verse mentions 'Mount Sinai in Arabia'?","options":["Exodus 19:1","Galatians 4:25","Psalm 68:8","John 1:14"],"answer":1,"why":"Written by Paul."},{"q":"Has the true location of Sinai been proven?","options":["Yes","No, several sites are proposed","It's in Egypt's capital","It's under the sea"],"answer":1,"why":"Scholars still debate it."}],"assignment":"Imagine you're Egeria climbing Mount Sinai. Write a diary entry describing the climb, the view, and which Bible passage you read at the top and why."},{"id":"exh-12","bible":"exo-12","bibleTitle":"The Ten Commandments","title":"Covenants Like Ancient Treaties","era":"About 1400-1200 BC","intro":"When archaeologists translated ancient treaties from the Hittite Empire, they noticed something striking: the treaties followed a pattern very much like God's covenant with Israel in Exodus and Deuteronomy.","sections":[{"h":"The Hittite Empire","p":["The Hittites ruled a powerful empire in what is now Turkey from about 1650 to 1180 BC. Their capital, Hattusa, was excavated beginning in 1906, and archaeologists found thousands of clay tablets, including treaties the Hittite 'great king' made with smaller kingdoms.","These treaties were between a powerful king (a suzerain) and a weaker king (a vassal). The great king promised protection, and the vassal promised loyalty."]},{"h":"The Treaty Pattern","p":["Hittite treaties usually had these parts: a preamble naming the great king; a history of what he had done for the vassal; stipulations (rules) the vassal must obey, starting with loyalty to the great king alone; instructions to keep the treaty in a temple and read it publicly; a list of witnesses; and blessings for obeying and curses for disobeying.","Now look at Exodus 20: 'I am the LORD your God' (preamble), 'who brought you out of Egypt' (history), 'You shall have no other gods before me' (loyalty first), then other commands. The tablets were kept in the ark (Exodus 25:16), and Deuteronomy adds public reading, witnesses, blessings, and curses."]},{"h":"What Makes Israel's Covenant Different","p":["In Hittite treaties, the great king was a human ruler, and the vassal served him mainly by paying tribute and sending soldiers. In Exodus, the Great King is the LORD himself, and his people serve him by loving him and treating one another justly.","The shape of the covenant would have made sense to people of that time. But its content was new: a God who rescues slaves, gives them rest one day in seven, and commands care for the poor and the foreigner."]}],"people":[{"name":"Mursili II","role":"Hittite king (about 1321-1295 BC) whose treaties survive"},{"name":"George Mendenhall","role":"American scholar who in 1954 compared Hittite treaties with the biblical covenant"}],"source":{"title":"Treaty of Mursili II with Duppi-Teshub of Amurru","who":"Hittite royal scribes","date":"About 1300 BC","text":"The treaty begins: These are the words of the Sun, Mursili, the great king, king of the Hittite land. It then recounts how the great king's father helped Duppi-Teshub's family, and requires him to be loyal: he must not turn his eyes to anyone else, must send tribute, and must be a friend to the king's friends and an enemy to his enemies. It ends by calling on the gods as witnesses and listing curses for breaking it.","note":"Paraphrased. Compare the structure with Exodus 20:1-17. The pattern is similar; the Great King is very different."},"vocab":[["Hittites","A powerful empire in ancient Turkey"],["Suzerain","A powerful king who makes a treaty with a weaker ruler"],["Vassal","A weaker ruler who owes loyalty to a suzerain"],["Stipulations","The rules or requirements of an agreement"]],"map":{"view":"ane","places":["hattusa","kadesh_o","memphis","hebron_a"],"caption":"The Hittite Empire was centered at Hattusa in Anatolia (Turkey). Hittites and Egyptians fought for control of Syria at Kadesh."},"timeline":[{"y":-1300,"t":"Hittite treaties like that of Mursili II are written (about 1300 BC)"},{"y":1906,"t":"German excavations at Hattusa uncover Hittite tablets","d":true}],"video":[],"quiz":[{"q":"Where was the Hittite Empire?","options":["Egypt","Modern Turkey","Greece","Arabia"],"answer":1,"why":"Capital at Hattusa."},{"q":"What is a suzerain?","options":["A soldier","A powerful king making a treaty with a weaker one","A priest","A slave"],"answer":1,"why":"The 'great king.'"},{"q":"What usually came after the preamble in a Hittite treaty?","options":["Curses","A history of what the great king had done","Witnesses","Taxes"],"answer":1,"why":"Like 'who brought you out of Egypt.'"},{"q":"What was the first requirement for the vassal?","options":["Pay money","Loyalty to the great king alone","Build a temple","Fight"],"answer":1,"why":"Like 'no other gods before me.'"},{"q":"Where were the commandment tablets kept?","options":["In Pharaoh's palace","In the ark of the covenant","On Mount Sinai","Buried"],"answer":1,"why":"Exodus 25:16."}],"assignment":"Make a chart with six rows (preamble, history, stipulations, deposit and reading, witnesses, blessings and curses). Fill in what a Hittite treaty had and where you find each part in Exodus 20 or Deuteronomy."},{"id":"exh-13","bible":"exo-13","bibleTitle":"Laws for Everyday Life and a Covenant Meal","title":"The Goring Ox: Comparing Ancient Laws","era":"About 1930-1750 BC","intro":"Exodus 21 includes a law about an ox that gores someone. Amazingly, older law codes from Mesopotamia have almost the same law. Comparing them shows both how similar Israel's laws were to its neighbors' and how different.","sections":[{"h":"Laws Before Moses","p":["Several law collections survive from ancient Mesopotamia: the Laws of Ur-Nammu (about 2100 BC), the Laws of Eshnunna (about 1930 BC), and the Code of Hammurabi (about 1754 BC). They deal with ordinary problems: marriage, property, injuries, debts, and animals.","Because people everywhere dealt with similar problems, it's not surprising that some laws look alike. Oxen were used for plowing everywhere, and an ox that gored people was a real danger."]},{"h":"The Goring Ox","p":["Hammurabi's Laws 250-252 say that if an ox gores a man while walking in the street, the owner isn't responsible. But if the ox was known to gore and the owner didn't restrain it, he must pay silver. Exodus 21:28-32 is similar: if an ox gores someone, it must be stoned, but the owner isn't held responsible unless the ox had a habit of goring and he failed to keep it penned up.","There's a difference, though. In Exodus, the ox itself must be killed, because a human life, made in God's image, has been taken. And in Exodus, the law applies to the death of a son or daughter just the same as an adult, while Hammurabi sets different penalties depending on a person's social class."]},{"h":"Protection for the Powerless","p":["In Hammurabi's laws, penalties often depended on whether the victim was a nobleman, a commoner, or a slave. Exodus has some class distinctions too, but it adds protections unusual for its time: a servant who is badly injured by his master goes free (Exodus 21:26-27), foreigners, widows, and orphans must not be oppressed, and servants and animals get Sabbath rest.","The famous 'eye for eye' law (Exodus 21:24) appears in Hammurabi too. It was meant to limit revenge and keep punishments fair, not to encourage people to harm each other. Jesus later taught his followers to go even further, refusing revenge altogether (Matthew 5:38-39)."]}],"people":[{"name":"Hammurabi","role":"King of Babylon (about 1792-1750 BC) whose law code includes the goring ox"},{"name":"Ur-Nammu","role":"King of Ur (about 2100 BC) with one of the oldest known law codes"}],"source":{"title":"The Code of Hammurabi, Laws 250-251","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If an ox gores a man while it is walking along the street and kills him, there is no claim. If a man's ox is a known gorer, and his city council has told him so, but he has not padded its horns or kept it under control, and it gores and kills a man, he shall pay half a mina of silver.","note":"Paraphrased. Compare Exodus 21:28-32. Notice what's similar, and what Exodus adds."},"vocab":[["Law code","A written collection of laws"],["Liability","Legal responsibility for harm"],["Eye for eye (lex talionis)","A principle that punishment should match, not exceed, the harm done"],["Mina","A unit of weight for silver (about 60 shekels)"]],"map":{"view":"ane","places":["babylon","ur","susa"],"caption":"Mesopotamian law codes came from cities like Ur and Babylon. Hammurabi's stele was later carried to Susa."},"timeline":[{"y":-2100,"t":"The Laws of Ur-Nammu are written (about 2100 BC)"},{"y":-1930,"t":"The Laws of Eshnunna are written (about 1930 BC)"}],"video":[],"quiz":[{"q":"Which is one of the oldest known law codes?","options":["Roman law","The Laws of Ur-Nammu","The Magna Carta","The Constitution"],"answer":1,"why":"About 2100 BC."},{"q":"In both codes, when is an ox owner responsible?","options":["Always","When the ox was known to gore and he didn't restrain it","Never","Only on the Sabbath"],"answer":1,"why":"Negligence mattered."},{"q":"What does Exodus require that Hammurabi doesn't?","options":["The owner pays gold","The ox itself must be killed","The ox is sold","Nothing"],"answer":1,"why":"A human life was taken."},{"q":"What happens to a servant badly injured by his master in Exodus?","options":["Nothing","He goes free","He is sold","He pays a fine"],"answer":1,"why":"Exodus 21:26-27."},{"q":"What was 'eye for eye' meant to do?","options":["Encourage revenge","Limit revenge and keep punishment fair","Punish animals","Settle debts"],"answer":1,"why":"Jesus taught to go further still."}],"assignment":"Read Exodus 21:28-32 and the Hammurabi source side by side. Write a paragraph on what's the same, what's different, and what the differences show about how God values people."},{"id":"exh-14","bible":"exo-14","bibleTitle":"A Tent Where God Would Live","title":"Portable Shrines and a Pharaoh's War Camp","era":"About 1330-1270 BC","intro":"The tabernacle was a portable sanctuary: a tent with wooden frames, gold-covered furniture, and carrying poles. Egyptian art and treasures from Tutankhamun's tomb show that portable shrines and royal tents were familiar in that world.","sections":[{"h":"Ramesses' Battle Camp","p":["In 1274 BC, Ramesses II fought the Hittites at the Battle of Kadesh in Syria. He had the battle carved on temple walls at Abu Simbel, the Ramesseum, and other temples. One scene shows his army's camp: a large rectangle surrounded by soldiers' shields, with Pharaoh's tent in the center. Inside the tent is an inner room, and nearby are images of winged figures.","Some scholars have noticed that the camp's layout, a rectangle about twice as long as it is wide with the most important room at one end, resembles the tabernacle courtyard with the Most Holy Place inside. Israel's camp was also arranged around the tabernacle, with the tribes on all four sides (Numbers 2)."]},{"h":"Treasures With Carrying Poles","p":["When Howard Carter opened Tutankhamun's tomb in 1922, he found furniture made of wood covered with gold, including nested shrines around the king's coffin and a chest with long carrying poles, topped by a statue of the jackal-god Anubis.","The ark of the covenant, the lampstand, the table, and the altars were also made of acacia wood covered with gold or bronze, with rings and poles for carrying. The skills and styles God asked Israel to use were real skills people of that time had."]},{"h":"One God, No Image","p":["Egyptian shrines held statues of gods, which priests fed, clothed, and carried in processions. The tabernacle's Most Holy Place held the ark, but no statue at all. Above the ark's cover, between the cherubim, was empty space where God said he would meet with Moses.","This was a powerful message: the God of Israel cannot be captured in a statue. He is present with his people, but he is not an image made by human hands."]}],"people":[{"name":"Ramesses II","role":"Pharaoh who fought the Battle of Kadesh and carved his war camp on temple walls"},{"name":"Howard Carter","role":"British archaeologist who discovered Tutankhamun's tomb in 1922"},{"name":"Bezalel","role":"Craftsman God filled with his Spirit to build the tabernacle"}],"source":{"title":"The Kadesh Camp Relief","who":"Artists of Ramesses II","date":"About 1274 BC","text":"Carved on temple walls, the scene shows Pharaoh's rectangular army camp with a wall of shields. At the center is a large royal tent with an inner room containing Pharaoh's throne name, flanked by images of the falcon god with outstretched wings. Around it, soldiers, horses, and chariots go about camp life.","note":"Described. You can find pictures of the Kadesh reliefs from Abu Simbel and the Ramesseum online. Compare the camp's layout with a drawing of the tabernacle."},"vocab":[["Portable","Able to be carried and moved"],["Acacia","A hard desert wood used for the tabernacle"],["Procession","A group moving forward in a ceremony"],["Relief","A carving raised from a flat surface"]],"map":{"view":"ane","places":["kadesh_o","thebes","hattusa"],"caption":"Ramesses II fought the Hittites at Kadesh in Syria, then carved the battle on temples in Egypt."},"timeline":[{"y":-1274,"t":"Battle of Kadesh between Egypt and the Hittites (1274 BC)"},{"y":1922,"t":"Howard Carter opens Tutankhamun's tomb","d":true}],"video":[],"quiz":[{"q":"Where was the Battle of Kadesh?","options":["Egypt","Syria","Greece","Canaan's coast"],"answer":1,"why":"Against the Hittites in 1274 BC."},{"q":"What was in the center of Ramesses' camp?","options":["A temple","Pharaoh's tent","A well","Chariots"],"answer":1,"why":"With an inner room."},{"q":"What did Tutankhamun's tomb contain?","options":["Nothing","Gold-covered wooden furniture with carrying poles","Only scrolls","Iron tools"],"answer":1,"why":"Found in 1922."},{"q":"What was the tabernacle furniture made of?","options":["Stone","Acacia wood covered with gold or bronze","Iron","Clay"],"answer":1,"why":"With rings and poles."},{"q":"What was missing from the Most Holy Place?","options":["The ark","A statue of God","Cherubim","Gold"],"answer":1,"why":"God can't be captured in an image."}],"assignment":"Build a small model of the tabernacle courtyard (a rectangle twice as long as wide) using a shoebox or cardboard. Place the altar, laver, Holy Place, and Most Holy Place. Then write a paragraph explaining why there was no statue inside."},{"id":"exh-15","bible":"exo-15","bibleTitle":"Priests and Spirit-Filled Artists","title":"The Silver Scrolls of Ketef Hinnom","era":"About 600 BC","intro":"Aaron and his sons were given a special blessing to speak over Israel (Numbers 6:24-26). In 1979, archaeologists found that blessing engraved on two tiny silver scrolls, the oldest known copies of any Bible text.","sections":[{"h":"Priests and Their Blessing","p":["In Exodus 28-29, God set apart Aaron and his sons as priests. One of their jobs was to bless the people. Numbers 6:24-26 gives the words: 'The LORD bless you and keep you; the LORD make his face shine on you and be gracious to you; the LORD turn his face toward you and give you peace.'","This priestly blessing has been spoken in synagogues and churches for thousands of years. Many churches still end their services with it."]},{"h":"A Discovery by a Boy","p":["In 1979, archaeologist Gabriel Barkay was excavating burial caves at Ketef Hinnom, on a hillside above the Valley of Hinnom in Jerusalem. A 13-year-old volunteer named Nathan was helping. In a repository under a burial bench, the team found hundreds of objects, including two tiny rolled-up silver scrolls, one about 1 inch long.","The scrolls were so fragile that it took three years to unroll them safely. When scholars finally read them, they found the priestly blessing from Numbers, written in ancient Hebrew letters, with the name YHWH."]},{"h":"Why They Matter","p":["The scrolls date to around 600 BC, just before the Babylonians destroyed Jerusalem. That's about 400 years older than the oldest Dead Sea Scrolls. They're the oldest known copies of words from the Bible.","The scrolls were probably worn as amulets around the neck, a family's way of carrying God's blessing with them. They show that the priestly blessing was treasured by ordinary families in Jerusalem long ago."]}],"people":[{"name":"Aaron","role":"Israel's first high priest"},{"name":"Gabriel Barkay","role":"Israeli archaeologist who excavated Ketef Hinnom in 1979"}],"source":{"title":"The Ketef Hinnom Silver Scrolls","who":"An unknown engraver in Jerusalem","date":"About 600 BC; found in 1979","text":"The larger scroll contains words very close to Numbers 6:24-26: May YHWH bless you and keep you; may YHWH make his face shine upon you and give you peace. The smaller scroll has a shorter version of the same blessing.","note":"Closely translated. The scrolls are displayed at the Israel Museum in Jerusalem. They show that these Bible words were being copied and treasured centuries before the time of Jesus."},"vocab":[["Priestly blessing","The blessing in Numbers 6:24-26 given to Aaron and his sons"],["Amulet","A small object worn as a sign of protection or blessing"],["Repository","A storage place, here for burial objects"],["Engraved","Carved or scratched into a hard surface"]],"map":{"view":"local","places":["jerusalem","bethlehem"],"caption":"Ketef Hinnom is on a hillside above the Valley of Hinnom, just outside Jerusalem's Old City."},"timeline":[{"y":-600,"t":"The Ketef Hinnom silver scrolls are engraved (about 600 BC)"},{"y":1979,"t":"The silver scrolls are discovered","d":true}],"video":[],"quiz":[{"q":"What is written on the silver scrolls?","options":["The Ten Commandments","The priestly blessing","Psalm 23","Genesis 1"],"answer":1,"why":"Numbers 6:24-26."},{"q":"Who helped
