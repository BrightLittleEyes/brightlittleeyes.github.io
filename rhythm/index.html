<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<meta name="theme-color" content="#2C3E50">

<link rel="icon" href="apple-touch-icon.png">

<title>Daily Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#22303C; --muted:#5F6E7A; --line:#DCE2E7; --soft:#EEF2F5;
  --mech:#2A7FBA; --mech-bg:#EAF4FC; --fun:#8E44AD; --fun-bg:#F5ECF9;
  --flag:#C0392B; --flag-bg:#FDEFD8; --done:#1E8449; --navy:#2C3E50;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;padding:8px 0 4px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(26px,6vw,36px);letter-spacing:.02em;margin:0;color:var(--navy)}
.hello{font-weight:700;color:var(--navy);font-size:18px;margin:2px 0 0}
.tag-line{color:var(--muted);font-style:italic;font-size:15px;line-height:1.45;margin:6px auto 12px;max-width:560px}
.tag-line .ref{display:block;font-style:normal;font-weight:700;font-size:13px;margin-top:3px;letter-spacing:.03em}
.datebar{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 4px}
.datebar button{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;min-width:44px;padding:0 12px;cursor:pointer}
.datebar .day{font-weight:700;font-size:18px;min-width:0;flex:1;max-width:320px;text-align:center}
.datebar .day small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.status{font-size:12px;color:var(--muted);text-align:center;min-height:18px}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9AA5AE;margin-right:5px;vertical-align:1px}
.status.ok i{background:var(--done)} .status.warn i{background:#E67E22}
.progress{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.progress b{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.progress-txt{font-size:13px;color:var(--muted);text-align:right;margin-bottom:12px}

/* change of routine */
.flags{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.flags h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--flag)}
.flags.active{border:2px solid var(--flag);background:#FFF8EE}
.flags .hint{color:var(--muted);font-size:13px;margin:0 0 8px}
.slotbtn.flag{border-color:#E3A99F;background:#FFF9F2;color:#C0786A;min-width:240px}
.slotbtn.flag.filled{border-color:var(--flag);background:var(--flag-bg);color:var(--flag)}
.opt.flag{border-color:var(--flag);background:var(--flag-bg);color:var(--flag)}

/* blocks */
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.block-h{color:#fff;font-weight:700;font-size:18px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.block-h small{font-weight:400;opacity:.9;font-size:14px}
.block-h svg{flex:none}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.check{flex:none;width:30px;height:30px;border:2px solid #8C99A3;border-radius:8px;background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{opacity:0}
.row.done .check{background:var(--done);border-color:var(--done)}
.row.done .check svg{opacity:1}
.row.done .txt b{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.txt{flex:1;min-width:0}
.txt b{font-weight:700}
.txt .d{color:var(--muted);font-size:15px}
.slot{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slotbtn{border:2px dashed #AEB9C2;background:var(--soft);color:var(--muted);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;text-align:left;letter-spacing:.02em}
.slotbtn.filled{border-style:solid;text-transform:uppercase}
.slotbtn.mech.filled{border-color:var(--mech);background:var(--mech-bg);color:var(--mech)}
.slotbtn.fun.filled{border-color:var(--fun);background:var(--fun-bg);color:var(--fun)}
.slotbtn small{display:block;text-transform:none;font-weight:400;font-size:12px;letter-spacing:0}
.snack{display:grid;grid-template-columns:repeat(4,44px);gap:6px;margin-top:8px}
.snack button{height:40px;border:2px solid #C9D2D9;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:var(--muted);font-weight:700}
.snack button.on{background:#F7DC6F;border-color:#D4AC0D;color:#7D6608}
.timer{margin-top:8px;display:flex;gap:8px;align-items:center}
.timer button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;width:96px;cursor:pointer;min-height:44px;font-weight:700;text-align:center}
.timer button.ghost{visibility:hidden}
.timer .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;width:78px;flex:none}
.timer.running .clock{color:#2A7FBA}
.timer.paused .clock{color:#B9770E}
.timer .tbtns{display:flex;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.tools button,.foot button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:15px;min-height:44px}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 32px;padding-top:16px;border-top:1px solid var(--line)}
.foot #editBtn{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}

/* picker sheet */
.scrim{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid;border-radius:12px;padding:14px 10px;text-align:center;font-weight:700;cursor:pointer;text-transform:uppercase;font-size:15px;min-height:64px}
.opt small{display:block;text-transform:none;font-weight:400;font-size:12px;margin-top:2px}
.opt.mech{border-color:var(--mech);background:var(--mech-bg);color:var(--mech)}
.opt.fun{border-color:var(--fun);background:var(--fun-bg);color:var(--fun)}
.opt[disabled]{opacity:.38;cursor:default}
.opt.cur{outline:3px solid var(--ink);outline-offset:2px}
.sheet-foot{display:flex;gap:10px;margin-top:14px}
.sheet-foot button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:12px;min-height:48px;cursor:pointer;font-weight:700}
.alarm{position:fixed;inset:0;background:rgba(20,30,40,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.alarm-box{background:#fff;border-radius:20px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop .25s ease-out}
.alarm-box .bell{font-size:56px;line-height:1;display:block;animation:ring 1s ease-in-out infinite}
.alarm-box h2{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;margin:8px 0 6px;color:var(--navy)}
.alarm-box p{margin:0 0 20px;color:var(--muted);font-size:18px}
.alarm-box button{background:var(--done);color:#fff;border:0;border-radius:14px;min-height:60px;width:100%;font-size:22px;font-weight:700;cursor:pointer}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.alarm-box,.alarm-box .bell{animation:none}}
.ed-test{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer;font-weight:700}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:40;max-width:90vw;text-align:center}

/* login & setup */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#EAF4FC,#F5ECF9 55%,#FDEFD8)}
.gatebox{width:100%;max-width:420px;background:var(--surface);border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(44,62,80,.12);display:flex;flex-direction:column;gap:12px}
.gatebox h1{text-align:center}
.gatebox p{margin:0;color:var(--muted);font-size:15px;text-align:center}
.gatebox label{font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px}
.gatebox label small{font-weight:400;color:var(--muted)}
.gatebox input{padding:12px;border:1px solid #C9D2D9;border-radius:10px;font-size:18px;width:100%}
.gatebox .show{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--muted)}
.gatebox .show input{width:auto}
.gatebox button[type=submit]{background:var(--navy);color:#fff;border:0;border-radius:12px;min-height:52px;font-weight:700;font-size:17px;cursor:pointer;margin-top:4px}
.gerr{color:var(--flag)!important;font-weight:700}

/* editor */
.ed-top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:12px}
.ed-top h2{margin:0;flex:1;font-size:20px;font-family:"Bricolage Grotesque",sans-serif}
.ed-top button{border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.ed-top #edSave{background:var(--done);border-color:var(--done);color:#fff}
.ed-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.ed-sec>h3{margin:0 0 10px;font-size:17px}
.ed-sec>p.help{margin:-4px 0 10px;color:var(--muted);font-size:14px}
.ed-f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;flex:1;min-width:0}
.ed input,.ed select,.ed textarea{padding:9px 10px;border:1px solid #C9D2D9;border-radius:8px;background:#fff;font-size:15px;width:100%;color:var(--ink);font-weight:400}
.ed textarea{resize:vertical}
.ed-grid{display:flex;gap:8px;flex-wrap:wrap}
.ed-block{border:2px solid;border-radius:12px;margin-bottom:14px;overflow:hidden}
.ed-bh{display:flex;gap:8px;align-items:center;padding:8px 10px}
.ed-bh input{font-weight:700;font-size:16px}
.ed-bbody{padding:10px}
.ed-item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#FBFCFD}
.ed-row{display:flex;gap:6px;align-items:center}
.ed-row select{width:auto;flex:none}
.ed-row>input{flex:1;min-width:0;font-weight:700}
.ed-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ed-row2>input{flex:1 1 220px}
.ed-min{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex:none}
.ed-min input{width:70px!important}
.ed-chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex:none}
.ed-chk input{width:auto!important}
.ed-note{font-size:13px;color:var(--muted);margin-top:6px}
.ed-mv{display:flex;gap:4px;flex:none}
.ed-mv button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:0;font-size:15px;line-height:1}
.ed-mv button:disabled{opacity:.3;cursor:default}
.ed-mv button.del{color:var(--flag)}
.ed-add{border:2px dashed #AEB9C2;background:transparent;border-radius:10px;min-height:42px;width:100%;cursor:pointer;font-weight:700;color:var(--muted)}
.ed-tag{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ed-tag>input{flex:1 1 150px;min-width:0}
.ed-reset{border:1px solid var(--flag);color:var(--flag);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:700}
@media (max-width:420px){ .wrap{padding:12px} .row{padding:12px} .opts{grid-template-columns:1fr} .ed-top h2{font-size:17px} }
</style>
</head>

<!-- login / first-time setup -->
<div class="gate" id="gate" hidden><form class="gatebox" id="gateform" autocomplete="off"></form></div>

<!-- the board -->
<div class="wrap" id="app" hidden>
  <header>
    <h1>DAILY RHYTHM</h1>
    <p class="hello" id="hello" hidden></p>
    <p class="tag-line" id="verse"></p>
    <div class="datebar">
      <button id="prev" aria-label="Previous day">‹</button>
      <div class="day" id="dayLabel"></div>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <div class="datebar" id="todayRow"><button id="today">Today</button></div>
    <div class="status" id="status"><i></i>Connecting…</div>
  </header>

  <div class="progress"><b id="bar"></b></div>
  <div class="progress-txt" id="ptxt"></div>

  <section class="flags" id="flags">
    <h3><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z" fill="#F4D03F" stroke="#C0392B" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5M12 17.5v.5" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round"/></svg>Anything different today?</h3>
    <p class="hint">If today won't follow the usual rhythm, put a red tag here and talk it through at breakfast.</p>
    <div id="chgSlot"></div>
  </section>

  <main id="board"></main>

  <div class="tools">
    <button id="copyTags">Use yesterday's tags</button>
    <button id="clearTags">Clear today's tags</button>
  </div>
  <div class="foot">
    <button id="editBtn" hidden>Edit board</button>
    <button id="logout">Log out</button>
  </div>
</div>

<!-- parent editor -->
<div class="wrap ed" id="editor" hidden>
  <div class="ed-top">
    <h2>Edit board</h2>
    <button id="edCancel">Cancel</button>
    <button id="edSave">Save</button>
  </div>
  <div id="edBody"></div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div class="opts" id="opts"></div>
    <div class="sheet-foot">
      <button id="clearSlot">Empty this slot</button>
      <button id="closeSheet">Cancel</button>
    </div>
  </div>
</div>
<div class="alarm" id="alarm" hidden role="alertdialog" aria-modal="true" aria-labelledby="alarmTitle">
  <div class="alarm-box"><span class="bell" aria-hidden="true">⏰</span><h2 id="alarmTitle">Time's up!</h2><p id="alarmMsg"></p><button id="alarmOk">OK</button></div>
</div>
<div class="toast" id="toast" hidden></div>

const COLORS = [['#2A7FBA','Blue'],['#27A55A','Green'],['#8E44AD','Purple'],['#D35400','Orange'],['#C0392B','Red'],['#16A085','Teal'],['#2C3E50','Navy'],['#B7950B','Gold'],['#D63384','Pink']];

let CFG = clone(DEFAULT_CONFIG), BLOCKS = [], TAGS = {fun:[],mech:[],flag:[]}, ALL_ITEMS = [], SLOT_IDS = [];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const shift = (k,n) => { const d=fromKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const blank = () => ({checks:{}, slots:{}, snack:[false,false,false,false,false,false,false,false]});
const findTag = (kind,id) => (TAGS[kind]||[]).find(t=>t.id===id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('rhythm|'+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

const S = { date:keyOf(new Date()), data:blank(), db:null, unsub:null, picking:null, timers:{}, paused:{}, saveT:null,

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true, ms); }
function setStatus(cls, txt){ const s=$('#status'); s.className='status '+cls; s.innerHTML='<i></i>'+txt; }
function cacheLocal(key, data){ try{ localStorage.setItem('rhythm:'+key, JSON.stringify(data)); }catch(e){} }

function getRole(){ try{ return localStorage.getItem('rhythm:role'); }catch(e){ return null; } }

/* ---------- config ---------- */
function normalize(d){
  const c = clone(DEFAULT_CONFIG);
  if(!d) return c;
  if(Array.isArray(d.blocks)) c.blocks = d.blocks;
  if(d.tags) ['fun','mech','flag'].forEach(k=>{ if(Array.isArray(d.tags[k])) c.tags[k]=d.tags[k]; });
  ['verse','verseRef','kidName','pwKid','pwParent','sound'].forEach(k=>{ if(typeof d[k]==='string') c[k]=d[k]; });
  if(typeof d.repeat==='boolean') c.repeat=d.repeat;
  c.blocks.forEach(b=>{ b.items = Array.isArray(b.items)?b.items:[]; });
  c.v = d.v || 1;
  if(c.v < 2){                       // split the long morning at the snack break
    const bi=c.blocks.findIndex(b=>b.id==='morning'), m=c.blocks[bi];
    const at = m ? m.items.findIndex(i=>i.id==='snackprep') : -1;
    if(m && at>0 && !c.blocks.some(b=>b.id==='midmorning')){
      const rest=m.items.splice(at);
      if(m.sub==='Fixed Academic & Prep Rhythm') m.sub='Prep & Fresh-Mind Work';
      c.blocks.splice(bi+1,0,{id:'midmorning', name:'Mid-Morning Block', sub:'Reset & Lighter Work', color:'#16A085', icon:'apple', items:rest});
    }
    c.v = 2;
  }
  if(c.v < 3){                       // adult-led subtitles (only replaces the old wording)
    const NEW = {morning:['Mom’s Launchpad',['Prep & Fresh-Mind Work','Fixed Academic & Prep Rhythm']],
                 midmorning:['Guided by Mom’s Plan',['Reset & Lighter Work']],
                 midday:['Off-Site Responsibilities',['Structured Transitions']],
                 afternoon:['Check-In & Reset',['Choice & Agency Slots']],
                 evening:['Family Basecamp',['Family Anchors']]};
    c.blocks.forEach(b=>{ const n=NEW[b.id]; if(n && (!b.sub || n[1].includes(b.sub))) b.sub=n[0]; });
    c.v = 3;
  }
  if(c.v < 4){                       // Snack Prep is a Helping Hands tag now; Math starts Mid-Morning
    c.blocks.forEach(b=>{ b.items = b.items.filter(i=>i.id!=='snackprep'); });
    const mb=c.blocks.find(b=>b.id==='morning'), mm=c.blocks.find(b=>b.id==='midmorning');
    const at = mb ? mb.items.findIndex(i=>i.id==='math') : -1;
    if(at>=0 && mm){ const m=mb.items.splice(at,1)[0]; mm.items.unshift(m); }
    c.blocks.forEach(b=>b.items.forEach(i=>{ if(i.id==='math' && /Next is Snack Prep/.test(i.endMsg||'')) i.endMsg='Math time is finished. Nice focus! Time for a snack break.'; }));
    c.v = 4;
  }
  if(c.v < 5){                       // Bible-based subtitles (only replaces earlier built-in wording)
    const OLD = ['Mom’s Launchpad','Guided by Mom’s Plan','Off-Site Responsibilities','Check-In & Reset','Family Basecamp',
                 'Prep & Fresh-Mind Work','Fixed Academic & Prep Rhythm','Reset & Lighter Work','Structured Transitions','Choice & Agency Slots','Family Anchors'];
    const NEW = {"morning": "New Every Morning · Lamentations 3:22–23", "midmorning": "Growing in Wisdom · Luke 2:52", "midday": "My Help Comes from the Lord · Psalm 121:2", "afternoon": "He Refreshes My Soul · Psalm 23:3", "evening": "Safe to Rest · Psalm 4:8"};
    c.blocks.forEach(b=>{ if(NEW[b.id] && (!b.sub || OLD.includes(b.sub))) b.sub=NEW[b.id]; });
    c.v = 5;
  }
  return c;
}
function applyConfig(c){
  CFG = c; BLOCKS = c.blocks; TAGS = c.tags;
  ALL_ITEMS = BLOCKS.flatMap(b=>b.items);
  SLOT_IDS = ALL_ITEMS.filter(i=>i.slot).map(i=>i.id);
  $('#verse').innerHTML = c.verse ? `&ldquo;${esc(c.verse)}&rdquo;${c.verseRef?`<span class="ref">${esc(c.verseRef)}</span>`:''}` : '';
  $('#verse').hidden = !c.verse;
  $('#hello').textContent = c.kidName ? `Hi, ${c.kidName}!` : '';
  $('#hello').hidden = !c.kidName;
}
async function writeConfig(c){
  cacheLocal('config', c);
  if(!S.db){ toast('Saved on this device only — can\'t reach the database.'); return false; }
  try{ await S.db.doc(CFG_DOC).set({...c, savedAt:new Date().toISOString()}); return true; }
  catch(err){ console.error(err); toast('Couldn\'t save online. Check your connection and try again.', 4000); return false; }
}

/* ---------- views ---------- */
function show(view){
  S.view=view;
  $('#gate').hidden = view!=='gate';
  $('#app').hidden = view!=='app';
  $('#editor').hidden = view!=='editor';
  window.scrollTo(0,0);
}
function route(){
  if(S.view==='editor') return;
  if(!CFG.pwParent || !CFG.pwKid){ if(S.gateMode!=='setup') showSetup(); return; }
  const r=getRole();
  S.role = r && r===CFG.pwParent ? 'parent' : r && r===CFG.pwKid ? 'kid' : null;
  if(!S.role){ setRole(null); if(S.gateMode!=='login') showLogin(); return; }
  S.gateMode=null;
  $('#editBtn').hidden = S.role!=='parent';
  if(S.view!=='app') show('app');
  if(!S.started){ S.started=true; watchDay(); } else render();
}

function gateErr(m){ const e=$('#gerr'); e.textContent=m; e.hidden=false; }
$('#gateform').addEventListener('change', e=>{
  if(e.target.id==='showPw') $('#gateform').querySelectorAll('input[type=password],input.pw').forEach(i=>{ i.classList.add('pw'); i.type=e.target.checked?'text':'password'; });

$('#gateform').addEventListener('submit', async e=>{
  e.preventDefault();
  if(S.gateMode==='setup'){
    const kid=$('#sKid').value.trim(), par=$('#sParent').value.trim();
    if(kid.length<3) return gateErr('Her password needs at least 3 letters or numbers.');
    if(par.length<4) return gateErr('Your password needs at least 4 letters or numbers.');
    if(kid===par) return gateErr('Her password and yours need to be different.');
    const c = clone(CFG); c.kidName=$('#sName').value.trim(); c.pwKid=await sha256(kid); c.pwParent=await sha256(par);
    const ok = await writeConfig(c);
    if(!ok && S.db) return;
    setRole(c.pwParent); applyConfig(c); S.gateMode=null; route();
    toast('All set! Tap "Edit board" at the bottom any time to make changes.', 4500);
  } else {
    const h=await sha256($('#lPw').value.trim());
    if(h!==CFG.pwKid && h!==CFG.pwParent){ $('#lPw').value=''; return gateErr('That password isn\'t right. Try again.'); }
    setRole(h); S.gateMode=null; route();
  }
});

/* ---------- day data ---------- */
function save(){
  cacheLocal(S.date, S.data);
  if(!S.db) return;
  clearTimeout(S.saveT);
  const key=S.date, data=clone(S.data);
  setStatus('', 'Saving…');
  S.saveT=setTimeout(async()=>{
    try{ await S.db.doc(COL+'/'+key).set({...data, date:key, savedAt:new Date().toISOString()}); setStatus('ok','Saved'); }
    catch(err){ console.error(err); setStatus('warn','Not saved online — kept on this device'); }
  }, 400);
}
function watchDay(){
  if(S.unsub){ S.unsub(); S.unsub=null; }
  S.data = Object.assign(blank(), readLocal(S.date)||{});
  render();
  if(!S.db){ setStatus('warn','Saving on this device only'); return; }
  const key=S.date;
  S.unsub = S.db.doc(COL+'/'+key).onSnapshot(snap=>{
    if(key!==S.date) return;
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){ const v=snap.data(); delete v.date; delete v.savedAt; S.data=Object.assign(blank(), v); cacheLocal(key,S.data); }
    setStatus('ok','Synced');
    render();
  }, err=>{ console.error(err); setStatus('warn','Can\'t reach the database — saving on this device only'); });
}

/* ---------- board ---------- */
function timerInfo(id){
  const item=ALL_ITEMS.find(i=>i.id===id); if(!item) return null;
  if(item.timer) return {secs:item.timer, msg:item.endMsg || `${item.t} time is finished.`};
  const tag=item.slot && S.data.slots[id] && findTag(item.slot, S.data.slots[id]);
  return tag && tag.timer ? {secs:tag.timer, msg:`${tag.name} time is finished. Great job!`} : null;
}
function render(){
  if(S.view!=='app') return;
  const d=fromKey(S.date), todayKey=keyOf(new Date());
  const rel = S.date===todayKey?'Today':S.date===shift(todayKey,-1)?'Yesterday':S.date===shift(todayKey,1)?'Tomorrow':'';
  $('#dayLabel').innerHTML = esc(d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})) + (rel?`<small>${rel}</small>`:'<small>&nbsp;</small>');
  $('#todayRow').style.display = S.date===todayKey?'none':'flex';

  const D=S.data;
  const chg = D.slots.chg && findTag('flag', D.slots.chg);
  $('#chgSlot').innerHTML = `<button class="slotbtn flag ${chg?'filled':''}" data-slot="chg">${chg?esc(chg.name):'+ Put a red tag here'}</button>`;
  $('#flags').classList.toggle('active', !!chg);

  $('#board').innerHTML = BLOCKS.map(b=>`
    <section class="block">
      <div class="block-h" style="background:${esc(b.color||'#2C3E50')}">${ICON[b.icon]||''}<span>${esc(b.name)}${b.sub?` <small>(${esc(b.sub)})</small>`:''}</span></div>
      ${b.items.map(rowHTML).join('')}
    </section>`).join('');

  const done = ALL_ITEMS.filter(i=>D.checks[i.id]).length, total=ALL_ITEMS.length||1;
  $('#bar').style.width = (done/total*100)+'%';
  $('#ptxt').textContent = done===ALL_ITEMS.length && done>0 ? 'Every block done — well done!' : `${done} of ${ALL_ITEMS.length} done`;
  paintTimer();
}
function rowHTML(i){
  const D=S.data, on=!!D.checks[i.id];
  let extra='';
  if(i.slot){
    const tag = D.slots[i.id] && findTag(i.slot, D.slots[i.id]);
    extra = `<div class="slot"><button class="slotbtn ${i.slot} ${tag?'filled':''}" data-slot="${esc(i.id)}">${
      tag ? esc(tag.name)+(tag.sub?`<small>${esc(tag.sub)}</small>`:'') : (i.slot==='fun'?'+ Pick a fun tag':'+ Pick a Helping Hands tag')
    }</button></div>`;
    if(tag && tag.timer) extra += timerBox(i.id);
  } else {
    if(i.snack){
      const n=D.snack.filter(Boolean).length;
      extra += `<div class="snack" aria-label="Snack box compartments, ${n} of 8 filled">${D.snack.map((v,k)=>`<button class="${v?'on':''}" data-snack="${k}" data-sid="${esc(i.id)}" aria-pressed="${v}">${k+1}</button>`).join('')}</div>`;
    }
    if(i.timer) extra += timerBox(i.id);
  }
  const label = i.slot || !i.d ? `<b>${esc(i.t)}</b>` : `<b>${esc(i.t)}:</b> <span class="d">${esc(i.d)}</span>`;
  return `<div class="row ${on?'done':''}">
    <button class="check" data-check="${esc(i.id)}" role="checkbox" aria-checked="${on}" aria-label="${esc(i.t)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <div class="txt">${label}${extra}</div>
  </div>`;
}
const timerBox = id => `<div class="timer" data-timerbox="${esc(id)}"><span class="clock"></span><span class="tbtns"></span></div>`;

/* ---------- timers (this device only) ---------- */
function paintTimer(){
  document.querySelectorAll('[data-timerbox]').forEach(w=>{
    const id=w.dataset.timerbox, info=timerInfo(id), end=S.timers[id], held=S.paused[id]; if(!info) return;
    const state = end ? 'running' : held!=null ? 'paused' : 'idle';
    const left = end ? Math.max(0, Math.round((end-Date.now())/1000)) : held!=null ? Math.round(held/1000) : info.secs;
    w.querySelector('.clock').textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
    if(w.dataset.state!==state){
      w.dataset.state=state;
      const B=(act,label)=>`<button data-tact="${act}" data-tid="${esc(id)}">${label}</button>`;
      w.querySelector('.tbtns').innerHTML = state==='idle' ? B('start','Start') + '<button class="ghost" tabindex="-1" aria-hidden="true">Reset</button>' : (state==='running' ? B('pause','Pause') : B('resume','Resume')) + B('reset','Reset');
    }
    w.classList.toggle('running', state==='running');
    w.classList.toggle('paused', state==='paused');
  });
}
/* Sounds. iPads only allow sound that was switched on by a tap, so the first
   tap on the page (Start, a checkbox, anything) switches it on for later. */
let AC=null;
function unlockAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const b=AC.createBuffer(1,1,22050), src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0);
  }catch(e){}
}
document.addEventListener('pointerdown', unlockAudio, {capture:true});
document.addEventListener('keydown', unlockAudio, {capture:true});
function tone(freq, start, dur, vol, type){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+.02);
  g.gain.setValueAtTime(vol,start+dur-.04); g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g).connect(AC.destination); o.start(start); o.stop(start+dur+.02);
}
function playSound(kind){
  kind = kind || CFG.sound || 'beep';
  if(kind==='off') return;
  try{
    if(!AC) unlockAudio();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime+.05;
    if(kind==='chime') [523.25,659.25,783.99].forEach((f,k)=>tone(f, t+k*.35, 1.1, .22, 'sine'));
    else [0,.25,.5].forEach(d=>tone(1046.5, t+d, .16, .28, 'square'));
  }catch(e){}
}

/* Time's-up card: sounds now, then every 3 seconds until OK (up to 1 minute) */
const ALARM = { queue:[], loop:null, until:0 };
function showAlarm(msg){
  ALARM.queue.push(msg);
  if(!$('#alarm').hidden) return;
  nextAlarm();
}
function nextAlarm(){
  const msg=ALARM.queue.shift();
  if(msg==null){ $('#alarm').hidden=true; return; }
  $('#alarmMsg').textContent=msg; $('#alarm').hidden=false; setTimeout(()=>$('#alarmOk').focus(),0);
  playSound();
  clearInterval(ALARM.loop);
  if(CFG.repeat!==false && CFG.sound!=='off'){
    ALARM.until=Date.now()+60000;
    ALARM.loop=setInterval(()=>{ if($('#alarm').hidden || Date.now()>ALARM.until){ clearInterval(ALARM.loop); return; } playSound(); }, 3000);
  }
}
$('#alarmOk').addEventListener('click', ()=>{ clearInterval(ALARM.loop); $('#alarm').hidden=true; nextAlarm(); });

/* Keep the screen awake while a timer is running */
let WAKE=null;
async function syncWake(){
  const want = Object.keys(S.timers).length>0 && !document.hidden;
  try{
    if(want && !WAKE && navigator.wakeLock){ WAKE=await navigator.wakeLock.request('screen'); WAKE.addEventListener('release',()=>{ WAKE=null; }); }
    if(!want && WAKE){ const w=WAKE; WAKE=null; await w.release(); }
  }catch(e){ WAKE=null; }
}
document.addEventListener('visibilitychange', syncWake);

setInterval(()=>{
  const ids=Object.keys(S.timers); if(!ids.length) return;
  ids.forEach(id=>{ if(Date.now()>=S.timers[id]){ const info=timerInfo(id); delete S.timers[id]; showAlarm(info ? info.msg : 'Time is finished.'); } });
  paintTimer(); syncWake();
}, 500);

/* ---------- tag picker ---------- */
function openPicker(slotId){
  const item=itemById(slotId); if(!item) return;
  const kind=item.slot, D=S.data;
  S.picking=slotId;
  $('#sheetTitle').textContent = item.t;
  $('#opts').innerHTML = (TAGS[kind]||[]).map(t=>{
    const usedIn = SLOT_IDS.find(s=>s!==slotId && D.slots[s]===t.id);
    const cur = D.slots[slotId]===t.id;
    const where = usedIn ? `<small>On ${esc(ALL_ITEMS.find(i=>i.id===usedIn).t.replace(/^Lunch & /,''))}</small>` : (t.sub?`<small>${esc(t.sub)}</small>`:'');
    return `<button class="opt ${kind} ${cur?'cur':''}" data-pick="${esc(t.id)}" ${usedIn?'disabled':''}>${esc(t.name)}${where}</button>`;
  }).join('') || '<p>No tags yet. Add some in Edit board.</p>';
  $('#clearSlot').hidden = !D.slots[slotId];
  $('#scrim').hidden=false;
}
function closePicker(){ $('#scrim').hidden=true; S.picking=null; }

/* ---------- board events ---------- */
$('#app').addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  const D=S.data;
  if(t.dataset.check){ const k=t.dataset.check; if(D.checks[k]) delete D.checks[k]; else D.checks[k]=true; save(); render(); return; }
  if(t.dataset.slot){ openPicker(t.dataset.slot); return; }
  if(t.dataset.tact){ const id=t.dataset.tid, a=t.dataset.tact, info=timerInfo(id); if(!info) return;
    if(a==='start'){ S.timers[id]=Date.now()+info.secs*1000; delete S.paused[id]; }
    if(a==='pause'){ S.paused[id]=Math.max(0,S.timers[id]-Date.now()); delete S.timers[id]; }
    if(a==='resume'){ S.timers[id]=Date.now()+S.paused[id]; delete S.paused[id]; }
    if(a==='reset'){ delete S.timers[id]; delete S.paused[id]; }
    paintTimer(); syncWake(); return; }
  if(t.dataset.snack){ const k=+t.dataset.snack, sid=t.dataset.sid; D.snack[k]=!D.snack[k];
    if(D.snack.every(Boolean) && !D.checks[sid]){ D.checks[sid]=true; toast('All 8 compartments filled!'); }
    save(); render(); return; }
  switch(t.id){
    case 'prev': S.date=shift(S.date,-1); watchDay(); break;
    case 'next': S.date=shift(S.date,1); watchDay(); break;
    case 'today': S.date=keyOf(new Date()); watchDay(); break;
    case 'copyTags': copyYesterday(); break;
    case 'clearTags':
      if(!Object.keys(D.slots).length){ toast('No tags placed yet today.'); break; }
      if(confirm('Take all tags off today\'s board?')){ D.slots={}; S.timers={}; S.paused={}; save(); render(); }
      break;
    case 'editBtn': if(S.role==='parent') openEditor(); break;
    case 'logout': if(confirm('Log out on this device?')){ setRole(null); S.role=null; S.timers={}; S.paused={}; route(); } break;
  }
});
$('#scrim').addEventListener('click', e=>{
  if(e.target.id==='scrim') return closePicker();
  const t=e.target.closest('button'); if(!t) return;
  const D=S.data;
  if(t.dataset.pick){ if(D.slots[S.picking]!==t.dataset.pick){ delete S.timers[S.picking]; delete S.paused[S.picking]; } D.slots[S.picking]=t.dataset.pick; closePicker(); save(); render(); return; }
  if(t.id==='clearSlot'){ delete S.timers[S.picking]; delete S.paused[S.picking]; delete D.slots[S.picking]; closePicker(); save(); render(); }
  if(t.id==='closeSheet') closePicker();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#scrim').hidden) closePicker(); });

async function copyYesterday(){
  const y=shift(S.date,-1);
  let prev=null;
  if(S.db){ try{ const s=await S.db.doc(COL+'/'+y).get(); if(s.exists) prev=s.data(); }catch(e){} }
  if(!prev) prev=readLocal(y);
  if(!prev || !prev.slots || !Object.keys(prev.slots).filter(k=>k!=='chg').length){ toast('No tags were placed yesterday.'); return; }
  const keep=S.data.slots.chg; S.data.slots={...prev.slots}; delete S.data.slots.chg; if(keep) S.data.slots.chg=keep; save(); render(); toast('Yesterday\'s tags are on the board.');
}

/* ---------- editor (parent only) ---------- */
function openEditor(){
  const c=clone(CFG); delete c.pwKid; delete c.pwParent;
  S.edit=c; renderEditor(); show('editor');
}
const getAt = path => path.split('.').reduce((o,k)=>o[k], S.edit);
function setAt(path, val){
  const ks=path.split('.'), k=ks.pop(), o=ks.reduce((o,k)=>o[k], S.edit);
  if(val===undefined) delete o[k]; else o[k]=val;
}
function mv(list, i, len){
  return `<span class="ed-mv">
    <button data-act="up" data-list="${list}" data-i="${i}" ${i===0?'disabled':''} aria-label="Move up">▲</button>
    <button data-act="down" data-list="${list}" data-i="${i}" ${i===len-1?'disabled':''} aria-label="Move down">▼</button>
    <button class="del" data-act="del" data-list="${list}" data-i="${i}" aria-label="Remove">✕</button></span>`;
}
function itemMv(bi, ii, len){
  const nb=S.edit.blocks.length;
  const upOff = bi===0 && ii===0, dnOff = bi===nb-1 && ii===len-1;
  const upT = ii===0 ? 'Move to the block above' : 'Move up', dnT = ii===len-1 ? 'Move to the block below' : 'Move down';
  return `<span class="ed-mv">
    <button data-act="iup" data-b="${bi}" data-i="${ii}" ${upOff?'disabled':''} aria-label="${upT}" title="${upT}">▲</button>
    <button data-act="idown" data-b="${bi}" data-i="${ii}" ${dnOff?'disabled':''} aria-label="${dnT}" title="${dnT}">▼</button>
    <button class="del" data-act="del" data-list="blocks.${bi}.items" data-i="${ii}" aria-label="Remove">✕</button></span>`;
}
function itemEd(it, bi, ii, len){
  const p=`blocks.${bi}.items.${ii}`, kind=it.slot||'task';
  const sel = `<select data-kind="${p}" aria-label="Type">
      <option value="task" ${kind==='task'?'selected':''}>Checklist item</option>
      <option value="mech" ${kind==='mech'?'selected':''}>Helping Hands slot</option>
      <option value="fun" ${kind==='fun'?'selected':''}>Fun Choice slot</option></select>`;
  let more;
  if(kind==='task'){
    more = `<div class="ed-row2">
      <input data-path="${p}.d" value="${esc(it.d)}" placeholder="Short description (optional)">
      <label class="ed-min">Timer <input type="number" min="1" max="300" inputmode="numeric" data-path="${p}.timer" data-type="min" value="${it.timer?Math.round(it.timer/60):''}" placeholder="none"> min</label>
      <label class="ed-chk"><input type="checkbox" data-path="${p}.snack" data-type="bool" ${it.snack?'checked':''}> 8 snack boxes</label>
    </div>${it.timer?`<div class="ed-row2"><input data-path="${p}.endMsg" value="${esc(it.endMsg)}" placeholder="Message when the timer ends, e.g. &quot;${esc(it.t||'Math')} time is finished!&quot;"></div>`:''}`;
  } else {
    more = `<div class="ed-note">She picks a ${kind==='fun'?'Fun Choice':'Helping Hands'} tag here.</div>`;
  }
  return `<div class="ed-item"><div class="ed-row">${sel}<input data-path="${p}.t" value="${esc(it.t)}" placeholder="Title">${itemMv(bi,ii,len)}</div>${more}</div>`;
}
function blockEd(b, bi, len){
  const p=`blocks.${bi}`;
  return `<div class="ed-block" style="border-color:${esc(b.color)}">
    <div class="ed-bh" style="background:${esc(b.color)}"><input data-path="${p}.name" value="${esc(b.name)}" placeholder="Block name">${mv('blocks',bi,len)}</div>
    <div class="ed-bbody">
      <div class="ed-grid">
        <label class="ed-f" style="flex:2 1 200px">Subtitle<input data-path="${p}.sub" value="${esc(b.sub)}" placeholder="optional"></label>
        <label class="ed-f">Color<select data-path="${p}.color" data-re>${COLORS.map(([v,n])=>`<option value="${v}" ${v===b.color?'selected':''}>${n}</option>`).join('')}</select></label>
        <label class="ed-f">Icon<select data-path="${p}.icon" data-re>${Object.keys(ICON_NAMES).map(k=>`<option value="${k}" ${k===(b.icon||'none')?'selected':''}>${ICON_NAMES[k]}</option>`).join('')}</select></label>
      </div>
      ${b.items.map((it,ii)=>itemEd(it,bi,ii,b.items.length)).join('')}
      <button class="ed-add" data-act="additem" data-b="${bi}">+ Add to ${esc(b.name||'this block')}</button>
    </div></div>`;
}
function tagsEd(k, title, help, hasSub, hasTimer){
  const list=S.edit.tags[k];
  return `<div class="ed-sec"><h3>${title}</h3><p class="help">${help}</p>
    ${list.map((t,ti)=>`<div class="ed-tag">
      <input data-path="tags.${k}.${ti}.name" value="${esc(t.name)}" placeholder="Tag name">
      ${hasSub?`<input data-path="tags.${k}.${ti}.sub" value="${esc(t.sub)}" placeholder="Small line under it (optional)">`:''}
      ${hasTimer?`<label class="ed-min">Timer <input type="number" min="1" max="300" inputmode="numeric" data-path="tags.${k}.${ti}.timer" data-type="min" value="${t.timer?Math.round(t.timer/60):''}" placeholder="none"> min</label>`:''}
      ${mv('tags.'+k, ti, list.length)}</div>`).join('')}
    <button class="ed-add" data-act="addtag" data-k="${k}">+ Add a tag</button></div>`;
}
function renderEditor(){
  const E=S.edit, y=window.scrollY;
  $('#edBody').innerHTML = `
    <div class="ed-sec"><h3>Top of the board</h3>
      <label class="ed-f">Verse<textarea data-path="verse" rows="3">${esc(E.verse)}</textarea></label>
      <div class="ed-grid">
        <label class="ed-f">Verse reference<input data-path="verseRef" value="${esc(E.verseRef)}"></label>
        <label class="ed-f">Her name<input data-path="kidName" value="${esc(E.kidName)}" placeholder="optional"></label>
      </div></div>
    <div class="ed-sec"><h3>Blocks</h3><p class="help">Use ▲ ▼ to move things up and down. At the top or bottom of a block, they move it into the block above or below. ✕ removes it. Renaming an item keeps today's checkmarks.</p>
      ${E.blocks.map((b,bi)=>blockEd(b,bi,E.blocks.length)).join('')}
      <button class="ed-add" data-act="addblock">+ Add a block</button></div>
    ${tagsEd('fun','Fun Choice tags','She picks these for the Fun Choice slots. A timer shows under the tag when it\'s placed.',false,true)}
    ${tagsEd('mech','Helping Hands tags','She picks these for the Helping Hands slots.',true,true)}
    ${tagsEd('flag','Change of Routine tags','The red tags for "Anything different today?"',false,false)}
    <div class="ed-sec"><h3>Timer sound</h3><p class="help">What plays when a timer runs out. A "Time's up!" card also pops up until she taps OK.</p>
      <div class="ed-grid" style="align-items:center">
        <label class="ed-f" style="flex:0 1 220px">Sound<select data-path="sound">
          <option value="beep" ${E.sound==='beep'?'selected':''}>Beep</option>
          <option value="chime" ${E.sound==='chime'?'selected':''}>Soft chime</option>
          <option value="off" ${E.sound==='off'?'selected':''}>No sound</option></select></label>
        <button class="ed-test" data-act="testsound">▶ Test sound</button>
      </div>
      <label class="ed-chk"><input type="checkbox" data-path="repeat" data-type="flag" ${E.repeat!==false?'checked':''}> Keep sounding every few seconds until she taps OK (up to 1 minute)</label>
    </div>
    <div class="ed-sec"><h3>Passwords</h3><p class="help">Leave blank to keep the current password.</p>
      <div class="ed-grid">
        <label class="ed-f">New password for her<input type="password" id="newKid" autocomplete="new-password"></label>
        <label class="ed-f">New password for you<input type="password" id="newParent" autocomplete="new-password"></label>
      </div></div>
    <div class="ed-sec"><h3>Start over</h3><p class="help">Puts the blocks, tags and verse back to the original board. Your passwords stay the same.</p>
      <button class="ed-reset" data-act="reset">Reset to the original board</button></div>`;
  window.scrollTo(0,y);
}
function readField(el){
  if(el.dataset.type==='bool') return el.checked || undefined;
  if(el.dataset.type==='flag') return el.checked;
  if(el.dataset.type==='min'){ const n=parseFloat(el.value); return n>0 ? Math.round(n*60) : undefined; }
  return el.value;
}
$('#editor').addEventListener('input', e=>{ const el=e.target; if(el.dataset.path) setAt(el.dataset.path, readField(el)); });
$('#editor').addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.kind){
    const it=getAt(el.dataset.kind), v=el.value;
    if(v==='task'){ delete it.slot; } else { it.slot=v; delete it.d; delete it.timer; delete it.endMsg; delete it.snack; }
    if(v!=='task' && (!it.t || /^(Fun Choice|Helping Hands)/.test(it.t))) it.t = v==='fun' ? 'Fun Choice Slot' : 'Helping Hands Slot';
    renderEditor(); return;
  }
  if(el.dataset.path){ setAt(el.dataset.path, readField(el)); if(el.hasAttribute('data-re') || el.dataset.type) renderEditor(); }
});
$('#editor').addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  const a=t.dataset.act, E=S.edit;
  if(a==='up'||a==='down'||a==='del'){
    const list=getAt(t.dataset.list), i=+t.dataset.i;
    if(a==='del'){
      const what=list[i], label=what.name||what.t||'this';
      const n = what.items ? what.items.length : 0;
      if(!confirm(n ? `Remove "${label}" and the ${n} item${n>1?'s':''} in it?` : `Remove "${label}"?`)) return;
      list.splice(i,1);
    } else { const j=a==='up'?i-1:i+1; [list[i],list[j]]=[list[j],list[i]]; }
    renderEditor(); return;
  }
  if(a==='iup'||a==='idown'){
    const bi=+t.dataset.b, i=+t.dataset.i, items=E.blocks[bi].items;
    if(a==='iup' && i>0){ [items[i-1],items[i]]=[items[i],items[i-1]]; }
    else if(a==='idown' && i<items.length-1){ [items[i+1],items[i]]=[items[i],items[i+1]]; }
    else {
      const to = a==='iup' ? bi-1 : bi+1, it=items.splice(i,1)[0];
      if(a==='iup') E.blocks[to].items.push(it); else E.blocks[to].items.unshift(it);
      toast(`Moved to ${E.blocks[to].name||'the next block'}`);
    }
    renderEditor(); return;
  }
  if(a==='testsound'){ playSound(S.edit.sound); return; }
  if(a==='additem'){ E.blocks[+t.dataset.b].items.push({id:newId('i'), t:''}); renderEditor(); focusLast(`[data-path^="blocks.${t.dataset.b}.items."][data-path$=".t"]`); return; }
  if(a==='addblock'){ const c=COLORS[E.blocks.length % COLORS.length][0]; E.blocks.push({id:newId('b'), name:'', sub:'', color:c, icon:'star', items:[]}); renderEditor(); focusLast('[data-path^="blocks."][data-path$=".name"]'); return; }
  if(a==='addtag'){ E.tags[t.dataset.k].push({id:newId('t'), name:''}); renderEditor(); focusLast(`[data-path^="tags.${t.dataset.k}."][data-path$=".name"]`); return; }
  if(a==='reset'){ if(confirm('Put the board back to the original blocks, tags and verse? Press Save after to keep it.')){ const keep=E.kidName; S.edit=clone(DEFAULT_CONFIG); S.edit.kidName=keep; renderEditor(); toast('Original board restored. Press Save to keep it.'); } return; }
  if(t.id==='edCancel'){ if(confirm('Leave without saving your changes?')){ S.edit=null; show('app'); render(); } return; }
  if(t.id==='edSave') saveEditor();
});
function focusLast(sel){ const els=document.querySelectorAll('#editor '+sel); const el=els[els.length-1]; if(el){ el.focus(); el.scrollIntoView({block:'center'}); } }

async function saveEditor(){
  const E=clone(S.edit);
  const trim = (o,k)=>{ if(typeof o[k]==='string'){ o[k]=o[k].trim(); if(!o[k]) delete o[k]; } };
  for(const b of E.blocks){
    b.name=(b.name||'').trim(); if(!b.name) return toast('Every block needs a name.', 3500);
    trim(b,'sub'); if(!b.sub) b.sub='';
    for(const it of b.items){
      it.t=(it.t||'').trim(); if(!it.t) return toast(`Something in ${b.name} needs a title.`, 3500);
      trim(it,'d'); trim(it,'endMsg');
    }
  }
  for(const k of ['fun','mech','flag']) for(const t of E.tags[k]){
    t.name=(t.name||'').trim(); if(!t.name) return toast('Every tag needs a name.', 3500);
    trim(t,'sub');
  }
  if(!['beep','chime','off'].includes(E.sound)) E.sound='beep'; E.repeat = E.repeat!==false;
  E.verse=(E.verse||'').trim(); E.verseRef=(E.verseRef||'').trim(); E.kidName=(E.kidName||'').trim();
  const nk=$('#newKid').value.trim(), np=$('#newParent').value.trim();
  if(nk && nk.length<3) return toast('Her password needs at least 3 letters or numbers.', 3500);
  if(np && np.length<4) return toast('Your password needs at least 4 letters or numbers.', 3500);
  E.pwKid = nk ? await sha256(nk) : CFG.pwKid;
  E.pwParent = np ? await sha256(np) : CFG.pwParent;
  if(E.pwKid===E.pwParent) return toast('Her password and yours need to be different.', 3500);
  $('#edSave').disabled=true; $('#edSave').textContent='Saving…';
  const ok = await writeConfig(E);
  $('#edSave').disabled=false; $('#edSave').textContent='Save';
  if(!ok && S.db) return;
  setRole(E.pwParent); applyConfig(normalize(E)); S.edit=null; show('app'); render();
  toast(ok ? 'Board saved. Her tablet updates on its own.' : 'Saved on this device.', 3500);
}

/* ---------- start ---------- */
(function boot(){
  const fc=window.FIREBASE_CONFIG;
  if(window.firebase && fc && fc.projectId){
    try{ firebase.initializeApp(fc); S.db=firebase.firestore(); }catch(e){ console.error(e); }
  }
  const cached = readLocal('config');
  applyConfig(normalize(cached));
  let first=true;
  const go = ()=>{ if(first){ first=false; route(); } };
  if(S.db){
    S.db.doc(CFG_DOC).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      const c = normalize(snap.exists ? snap.data() : (cached||null));
      cacheLocal('config', c);
      applyConfig(c);
      if(first) go(); else route();
    }, err=>{ console.error(err); go(); });
    setTimeout(go, 6000);   // if the database is slow, open with what this device already has
  } else go();

  // roll over to the new day if the page is left open overnight
  S._last=keyOf(new Date());
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ const k=keyOf(new Date()); if(S._last!==k && S.date===S._last){ S.date=k; if(S.started) watchDay(); } S._last=k; } });
})();
</script>
