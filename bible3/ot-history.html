 no place to rest and came back. I let a raven go. It saw the water going down, and it did not come back.","note":"Now read Genesis 8:6-12. What is the same? What is different?"},"vocab":[["Ararat","A mountain area north of Mesopotamia"],["Covenant","A serious promise"],["Expedition","A trip to explore"]],"map":{"view":"ane","places":["ararat","nineveh","uruk"],"caption":"The mountains of Ararat are north of Mesopotamia."},"timeline":[{"y":1872,"t":"George Smith reads the Babylonian flood tablet","d":true}],"video":[],"quiz":[{"q":"What did George Smith do when he found the flood story?","options":["Jumped up and ran around","Went to sleep","Threw it away"],"answer":0,"why":"He was super excited!"},{"q":"Why did the gods send the flood in Babylon's story?","options":["People were too noisy","It was a game","People were sinful"],"answer":0,"why":"Very different from Genesis!"},{"q":"Where did the ark land?","options":["Egypt","The ocean","The mountains of Ararat"],"answer":2,"why":"It rested on the mountains of Ararat."},{"q":"What is the sign of God's promise to Noah?","options":["A rainbow","A dove","A star"],"answer":0,"why":"God put his rainbow in the sky."}],"assignment":"Read Genesis 8:6-12 with a parent. Draw Noah sending out the birds."},{"id":"ohist-07","bible":"gen-07","bibleTitle":"The Tower of Babel","title":"Ziggurats and the Gate of the Gods","era":"The ancient Near East","intro":"The Tower of Babel was built with baked bricks and tar. That's just how people built in Mesopotamia, and the tower sounds like a ziggurat!","sections":[{"h":"Bricks Instead of Stone","p":["In Canaan there were lots of rocks. But in Mesopotamia there were almost none! So people made bricks out of mud. They baked them in hot ovens to make them hard, and they used tar to glue them together. Genesis 11 tells us exactly that."]},{"h":"Ziggurats","p":["Mesopotamian cities built ziggurats: giant towers with steps, like a huge staircase, with a temple on top. People thought gods came down from heaven on them.","The builders of Babel wanted a tower that reached heaven. But the Bible says God had to 'come down' to see it. It was tiny to him!"]},{"h":"Digging Up Babylon","p":["About 125 years ago, a team dug up the city of Babylon. They found a beautiful gate made of shiny blue bricks with pictures of dragons and bulls. They also found the bottom of a giant tower."]}],"people":[{"name":"Robert Koldewey","role":"Archaeologist who dug up Babylon"},{"name":"Herodotus","role":"A Greek writer called 'the father of history'"}],"source":{"title":"Histories, Book 1","who":"Herodotus","date":"About 440 BC","text":"In Babylon there is a tall tower, with another tower on top of it, and another, up to eight towers. A path winds around the outside so people can climb to the top.","note":"Herodotus wrote this about 2,500 years ago. His tower sounds like a giant ziggurat."},"vocab":[["Ziggurat","A giant step-shaped tower with a temple on top"],["Kiln","An oven for baking bricks"],["Mortar","Stuff that holds bricks together"]],"map":{"view":"ane","places":["babylon","ur","uruk"],"caption":"Babylon was on the Euphrates River. The ziggurat at Ur still stands today."},"timeline":[{"y":1899,"t":"Archaeologists begin digging up Babylon","d":true}],"video":[],"quiz":[{"q":"Why did people in Mesopotamia build with bricks?","options":["There were almost no rocks","It was a law","Bricks were prettier"],"answer":0,"why":"They used mud from the rivers."},{"q":"What is a ziggurat?","options":["A boat","A giant step tower","A crown"],"answer":1,"why":"Like a huge staircase."},{"q":"What did they use to glue bricks together?","options":["Paste","Honey","Tar"],"answer":2,"why":"Genesis says tar for mortar."},{"q":"What color were the bricks on Babylon's gate?","options":["Blue","Green","Pink"],"answer":0,"why":"Shiny blue with dragons and bulls!"}],"assignment":"Build a ziggurat out of blocks, Legos, or sugar cubes. Then read Genesis 11:4 and Genesis 12:2."},{"id":"ohist-08","bible":"gen-08","bibleTitle":"God Calls Abram","title":"Ur and Harran: Abram's World","era":"About 2000 BC","intro":"Abram grew up in Ur, a big, busy city. When God called him, Abram left his home and the false gods his family worshiped.","sections":[{"h":"The City of Ur","p":["Ur was a rich city by the Euphrates River. It had a giant ziggurat, busy boats, and schools where boys learned to write on clay.","Archaeologists found streets of brick houses there, some two stories tall. Abram grew up in a fancy city!"]},{"h":"The Moon God","p":["The people of Ur worshiped a moon god. Harran, where Abram's family moved next, worshiped the moon god too. The Bible says Abram's father worshiped other gods.","So when God called Abram, Abram had to trust a God he couldn't see, instead of the moon shining over his city."]},{"h":"The Long Trip","p":["From Ur to Harran was about 600 miles. Then Abram traveled hundreds more miles to Canaan. With sheep, goats, and servants, it took months! They followed the Fertile Crescent, where there was water and grass."]}],"people":[{"name":"Terah","role":"Abram's father, who moved the family from Ur to Harran"},{"name":"Abram (Abraham)","role":"Called by God to go to Canaan"}],"source":{"title":"The Lament for Ur","who":"Sumerian poets","date":"Written after Ur's fall, about 2000 BC","text":"A sad poem tells how the city of Ur was attacked. Its goddess cries because her city and temple are ruined.","note":"This poem shows the kind of city and false gods Abram left behind to follow the one true God."},"vocab":[["Nomad","Someone who moves from place to place with animals"],["Moon god","A false god worshiped at Ur and Harran"],["Journey","A long trip"]],"map":{"view":"ane","places":["ur","harran","damascus_a","hebron_a"],"caption":"Abram traveled from Ur up the Euphrates to Harran, then down to Canaan."},"timeline":[{"y":-2004,"t":"The city of Ur is attacked"},{"y":-2000,"t":"Abram leaves Ur to follow God"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What false god was worshiped in Ur?","options":["The moon god","The fish god","The tree god"],"answer":0,"why":"Ur and Harran worshiped the moon."},{"q":"What was Ur like?","options":["A tiny village","A big, rich city","An empty desert"],"answer":1,"why":"It had houses, schools, and a ziggurat."},{"q":"About how far was Ur to Harran?","options":["6 miles","600 miles","6,000 miles"],"answer":1,"why":"It took a long time!"},{"q":"Why did travelers follow the Fertile Crescent?","options":["Water and grass were there","The king said so","It was shorter"],"answer":0,"why":"Animals need water and grass."}],"assignment":"Trace Abram's trip on a map. If you walked 10 miles a day, how many days would 600 miles take?","hope":["The city of Ur is ruins today. But God gave Abram a promise that lasts forever!","God said the whole world would be blessed through Abram's family. That came true when Jesus was born."]},{"id":"ohist-09","bible":"gen-09","bibleTitle":"Abram and Lot Part Ways","title":"Kings, Nomads, and the City of Salem","era":"About 2000-1800 BC","intro":"Genesis 14 tells about a war of kings, a rescue, and a priest-king of Salem. Salem was an old name for Jerusalem!","sections":[{"h":"Living in Tents","p":["Abram and Lot lived in tents and moved their animals from place to place to find grass and water. They counted their riches in sheep, goats, servants, and silver."]},{"h":"The War of the Kings","p":["Four kings from the east attacked the cities near the Dead Sea and took people captive, including Lot! Abram gathered 318 men from his household. They chased the kings all the way north and rescued everyone at night."]},{"h":"Melchizedek, King of Salem","p":["After the battle, Melchizedek, king of Salem and priest of God Most High, brought bread and wine and blessed Abram. Salem is Jerusalem!","Very old Egyptian writings, almost 4,000 years old, mention a city called Rushalimum. That's probably Jerusalem too!"]}],"people":[{"name":"Melchizedek","role":"King of Salem and priest of God Most High"},{"name":"Lot","role":"Abram's nephew, captured and rescued"}],"source":{"title":"The Egyptian Execration Texts","who":"Egyptian priests","date":"About 1900-1800 BC","text":"Egyptian priests wrote the names of their enemies on clay bowls, then smashed the bowls. One name on the list is a city called Rushalimum.","note":"This is one of the oldest mentions of Jerusalem outside the Bible!"},"vocab":[["Nomad","A person who moves around with animals"],["Salem","An old name for Jerusalem; it sounds like 'shalom,' which means peace"],["Captive","A person who is taken and held prisoner"]],"map":{"view":"local","places":["jerusalem","hebron","bethel","dan","damascus"],"caption":"Abram chased the kings from near Hebron all the way north to Dan."},"timeline":[{"y":-1850,"t":"Egyptian writings mention Rushalimum (Jerusalem)"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"Where did Abram and Lot live?","options":["In tents","In caves","In castles"],"answer":0,"why":"They moved around with their animals."},{"q":"How many men went with Abram to rescue Lot?","options":["3,000","3","318"],"answer":2,"why":"Abram took 318 men."},{"q":"What is Salem?","options":["Jerusalem","Egypt","Babylon"],"answer":0,"why":"Salem is an old name for Jerusalem."},{"q":"What did Melchizedek bring Abram?","options":["Bread and wine","A camel","A sword"],"answer":0,"why":"Then he blessed Abram."}],"assignment":"Find Hebron and Dan on a map of Israel. Measure how far Abram traveled to rescue Lot.","hope":["Abram bravely rescued Lot, and he didn't keep any treasure for himself.","Then the king of Salem blessed Abram with bread and wine. The Bible says he points ahead to Jesus!"]},{"id":"ohist-10","bible":"gen-10","bibleTitle":"Count the Stars","title":"How Ancient People Made Covenants","era":"About 2000-1400 BC","intro":"In Genesis 15, God made a promise to Abram in a strange way, with animals cut in half. People long ago used ceremonies like this for very serious promises.","sections":[{"h":"Cutting a Covenant","p":["In Hebrew, people didn't 'make' a promise. They 'cut' one! Long ago, people made serious promises by cutting animals in half and walking between the pieces. It meant: 'If I break my promise, may this happen to me!'","In Genesis 15, only God walked between the pieces, like a smoking pot and a flaming torch. God was saying he would keep the promise all by himself."]},{"h":"Who Gets Everything?","p":["Abram had no children. He worried that his servant Eliezer would get everything when he died. Old clay tablets show that people with no children sometimes adopted a servant to take care of them. But God promised Abram a son of his very own."]},{"h":"Counting the Stars","p":["People in Mesopotamia studied the stars carefully, and many worshiped them. When God told Abram to count the stars, he was saying, 'I made those stars, and I will keep my promise to you!'"]}],"people":[{"name":"Eliezer of Damascus","role":"Abram's servant before Isaac was born"}],"source":{"title":"A Letter From Mari","who":"An official writing to the king of Mari","date":"About 1775-1761 BC","text":"A man writes to his king: I didn't let them use a puppy and a goat. I used a young donkey instead, and that made peace between the two groups.","note":"Thousands of clay letters like this were found in a city called Mari. They show how people made serious promises long ago."},"vocab":[["Covenant","A serious promise"],["Heir","The person who gets someone's things after they die"],["Astronomy","Studying the stars"]],"map":{"view":"ane","places":["mari","nuzi","harran","hebron_a","damascus_a"],"caption":"Clay tablets from Mari and Nuzi help us understand how people lived in Abram's time."},"timeline":[{"y":-1761,"t":"The city of Mari is destroyed, burying its clay letters"},{"y":1933,"t":"Archaeologists begin digging at Mari","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"In Hebrew, what do you do to a covenant?","options":["Sing it","Bake it","Cut it"],"answer":2,"why":"People 'cut' a covenant."},{"q":"Who walked between the pieces in Genesis 15?","options":["Both","Only Abram","Only God"],"answer":2,"why":"God promised to keep it all by himself."},{"q":"Who was Eliezer?","options":["Abram's servant","Abram's son","A king"],"answer":0,"why":"Abram worried Eliezer would get everything."},{"q":"Who made the stars?","options":["God","Abram","The moon god"],"answer":0,"why":"God made them all!"}],"assignment":"Make a promise card with a family member, like 'I will help set the table this month.' Draw a picture as a sign to remember it."},{"id":"ohist-11","bible":"gen-11","bibleTitle":"Hagar and the God Who Sees","title":"Hammurabi's Laws and Family Customs","era":"About 1754 BC","intro":"Sarai's plan to have a baby through Hagar seems strange to us. An old stone carved with laws shows it was a custom back then, and it caused lots of trouble.","sections":[{"h":"Hammurabi's Laws","p":["Hammurabi was a king of Babylon. He had almost 300 laws carved on a tall black stone. At the top is a picture of Hammurabi standing before a false god.","About 125 years ago, explorers found the stone in Iran. Now it is in a famous museum in Paris called the Louvre."]},{"h":"A Servant Mother","p":["Old laws say that if a wife had no children, she could give her servant to her husband to have a baby for the family. Hammurabi's laws even talk about what happens if the servant becomes proud. That's just what happened with Hagar!","But Genesis does not say this was God's plan. It shows the trouble that comes when people try to make God's promises happen their own way."]},{"h":"Hagar from Egypt","p":["Hagar came from Egypt. When she ran away, she was on the road back toward Egypt. She was trying to go home. And there in the desert, God saw her!"]}],"people":[{"name":"Hammurabi","role":"A king of Babylon famous for his laws"},{"name":"Hagar","role":"Sarai's servant from Egypt, mother of Ishmael"}],"source":{"title":"The Code of Hammurabi, Law 146","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a wife gives her servant to her husband and the servant has children, and then the servant acts like she is as important as the wife, the wife cannot sell her, but she can treat her as a servant again.","note":"This law shows the custom behind Genesis 16. Notice that God cared about Hagar, the person with the least power."},"vocab":[["Law code","A written list of laws"],["Stela","A tall stone with writing or pictures carved on it"],["Louvre","A famous museum in Paris"]],"map":{"view":"ane","places":["babylon","susa","memphis","hebron_a"],"caption":"Hammurabi ruled from Babylon. Hagar ran toward her homeland, Egypt."},"timeline":[{"y":-1754,"t":"Hammurabi's laws are carved in stone"},{"y":1901,"t":"Hammurabi's law stone is found","d":true}],"video":[],"quiz":[{"q":"Who was Hammurabi?","options":["A shepherd","An Egyptian servant","A king of Babylon"],"answer":2,"why":"He made a famous list of laws."},{"q":"Where is Hammurabi's law stone today?","options":["In Hagar's tent","A museum in Paris","At the bottom of the sea"],"answer":1,"why":"It's in the Louvre."},{"q":"Where was Hagar from?","options":["Rome","Babylon","Egypt"],"answer":2,"why":"She was an Egyptian servant."},{"q":"Was Sarai's plan God's idea?","options":["No","Yes"],"answer":0,"why":"It caused a lot of trouble."}],"assignment":"Write three good rules for your family. Then read Exodus 20:12-17 and talk about God's good rules.","hope":["Hagar was sad and alone in the desert. But God found her and took care of her.","Hagar called God 'the God who sees me.' God sees you too!"]},{"id":"ohist-12","bible":"gen-12","bibleTitle":"Three Visitors and a City Destroyed","title":"The Dead Sea and the Cities of the Plain","era":"About 2000-1800 BC","intro":"Sodom and Gomorrah were near the Dead Sea, the lowest place on land in the whole world. The water is so salty that nothing can live in it!","sections":[{"h":"The Lowest Place on Earth","p":["The Dead Sea is more than 1,400 feet below sea level. Water flows in from the Jordan River, but it can't flow out. The hot sun dries up the water and leaves salt behind.","The water is about ten times saltier than the ocean! It's so salty that people float like corks, and no fish can live there. The Bible calls it the Salt Sea. Nearby is a mountain made of salt, with salt pillars people call 'Lot's wife.'"]},{"h":"Where Was Sodom?","p":["No one knows for sure! Archaeologists have looked at different places near the Dead Sea. The Bible remembers Sodom as a place where people were proud and cruel and didn't care for the poor."]},{"h":"Welcoming Guests","p":["Abraham ran to welcome visitors, washed their feet, and made them a big meal. The people of Sodom were mean to visitors. In those days, taking care of guests was very important, so Sodom's behavior shocked everyone."]}],"people":[{"name":"Lot","role":"Abraham's nephew, rescued from Sodom"},{"name":"Josephus","role":"A Jewish writer who wrote about the Dead Sea long ago"}],"source":{"title":"The Jewish War, Book 4","who":"Josephus","date":"About AD 75","text":"Josephus wrote that the Dead Sea is so salty that heavy things thrown into it float back up. Even people who couldn't swim floated!","note":"Josephus wrote this almost 2,000 years ago. You can still float in the Dead Sea today."},"vocab":[["Salt Sea","The Bible's name for the Dead Sea"],["Evaporation","When water dries up and leaves salt behind"],["Hospitality","Welcoming and caring for guests"]],"map":{"view":"local","places":["hebron","deadsea","sodom","hammam"],"caption":"Sodom was somewhere near the Dead Sea. Abraham watched the smoke from the hills near Hebron."},"timeline":[{"y":75,"t":"Josephus writes about the Dead Sea"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 2)","https://watch.tbn.org/s/83iA4eRN?e=8Tqdqvqx"]],"quiz":[{"q":"Why can't fish live in the Dead Sea?","options":["It's too salty","It's too cold","It's too small"],"answer":0,"why":"It's about ten times saltier than the ocean."},{"q":"What happens when people get in the Dead Sea?","options":["They sink","They float","They freeze"],"answer":1,"why":"The salt helps them float!"},{"q":"What is the Bible's name for the Dead Sea?","options":["The Big Sea","The Salt Sea","The Red Sea"],"answer":1,"why":"The Salt Sea."},{"q":"How did Abraham treat visitors?","options":["He sent them away","He ignored them","He welcomed them and fed them"],"answer":2,"why":"Abraham showed great hospitality."}],"assignment":"Science time! Fill two cups with water. Stir lots of salt into one. Try to float an egg in each cup. What happened?","hope":["Abraham prayed for the city, and God listened to him.","God sent angels to rescue Lot and his family. God loves to rescue people!"]},{"id":"ohist-13","bible":"gen-13","bibleTitle":"Isaac Is Born","title":"Wells, Water, and Beersheba","era":"About 2000-1800 BC","intro":"In a dry land, a well of water could mean life! Abraham and Isaac argued over wells, and the town of Beersheba is named after one.","sections":[{"h":"Life in a Dry Land","p":["Beersheba is in the Negev, a dry desert area in the south of Israel. It hardly ever rains. So shepherds like Abraham and Isaac dug deep wells to get water. Digging a well was very hard work!","That's why people sometimes fought over wells. Isaac named one well Esek, 'fight.' Finally he dug one where no one fought, and he named it Rehoboth, 'room.'"]},{"h":"The Well of the Promise","p":["Abraham made a promise with a king and gave him seven lambs to show he had dug the well. The place was named Beersheba. Be'er means 'well,' and sheba can mean 'seven' or 'promise.'","Later, 'from Dan to Beersheba' meant 'the whole land,' from top to bottom."]},{"h":"An Egyptian Visitor","p":["An old Egyptian story tells about a man named Sinuhe who lived in Canaan. He said it was a good land full of figs, grapes, olives, honey, and cows."]}],"people":[{"name":"Abimelech","role":"A king who made a promise with Abraham"},{"name":"Sinuhe","role":"An Egyptian man in an old story about Canaan"}],"source":{"title":"The Story of Sinuhe","who":"An Egyptian writer","date":"About 1900 BC","text":"Sinuhe said the land had figs and grapes, lots of honey, olive trees, every kind of fruit, wheat, and many cattle.","note":"The Bible calls Canaan 'a land flowing with milk and honey.' Sinuhe agreed!"},"vocab":[["Negev","The dry southern part of Israel"],["Well","A deep hole dug to reach water"],["Beersheba","'Well of seven' or 'well of the promise'"]],"map":{"view":"local","places":["beersheba","gerar","hebron"],"caption":"Beersheba is in the dry Negev, south of Hebron."},"timeline":[{"y":-1900,"t":"The story of Sinuhe is written in Egypt"},{"y":2005,"t":"Beersheba's ruins are named a special world treasure","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What does 'be'er' mean?","options":["Tree","Sheep","Well"],"answer":2,"why":"Beersheba means well of seven, or well of the promise."},{"q":"What did Abraham give the king?","options":["Seven coins","Seven camels","Seven lambs"],"answer":2,"why":"They showed he dug the well."},{"q":"What does Rehoboth mean?","options":["Water","Fight","Room"],"answer":2,"why":"No one fought over that well."},{"q":"Why were wells so important?","options":["They were pretty","For swimming","The land was very dry"],"answer":2,"why":"Wells meant water for people and animals."}],"assignment":"Count how many glasses of water you drink today. Imagine carrying every drop from a well!"},{"id":"ohist-14","bible":"gen-14","bibleTitle":"Abraham's Hardest Test","title":"Mount Moriah Through History","era":"About 2000 BC to today","intro":"The mountain where Abraham almost offered Isaac became one of the most important places in the world. It's in Jerusalem!","sections":[{"h":"A Very Different God","p":["Long ago, some nations did terrible things for their false gods, even hurting children. God's law said never to do that.","So Genesis 22 was surprising. God stopped Abraham and gave a ram instead. God showed he does not want children hurt. He provides the sacrifice himself."]},{"h":"From Moriah to the Temple","p":["Abraham went to the land of Moriah. Many years later, King Solomon built God's temple on Mount Moriah in Jerusalem. The place of Abraham's offering became the place of Israel's temple!","That temple was destroyed. A second temple was built, and King Herod made it huge. Then the Romans destroyed it too."]},{"h":"The Temple Mount Today","p":["Today there is a building with a big golden dome on the spot, called the Dome of the Rock. Jesus, the Lamb of God, died on a cross not far from Mount Moriah."]}],"people":[{"name":"Solomon","role":"King who built the first temple on Mount Moriah"}],"source":{"title":"Jewish Antiquities, Book 1","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Isaac was a young man, 25 years old, and that he went along willingly because he trusted God and his father.","note":"The Bible doesn't tell us Isaac's age. But Isaac was strong enough to carry the wood up the mountain!"},"vocab":[["Moriah","The place where Abraham offered Isaac; later the Temple Mount"],["Temple","God's special house in Jerusalem"],["Substitute","Someone or something that takes another's place"]],"map":{"view":"local","places":["beersheba","jerusalem","hebron"],"caption":"Abraham traveled about three days from Beersheba to Moriah, which later became Jerusalem."},"timeline":[{"y":-960,"t":"King Solomon builds the temple on Mount Moriah"},{"y":691,"t":"The Dome of the Rock is built"}],"video":[],"quiz":[{"q":"What did God give instead of Isaac?","options":["A ram","A lion","A dove"],"answer":0,"why":"God provided a substitute."},{"q":"Who built the temple on Mount Moriah?","options":["King Solomon","Pharaoh","Noah"],"answer":0,"why":"Solomon built it in Jerusalem."},{"q":"What city is Mount Moriah in?","options":["Jerusalem","Babylon","Cairo"],"answer":0,"why":"Mount Moriah is in Jerusalem."},{"q":"What is a substitute?","options":["A kind of sandwich","A boat","Someone who takes another's place"],"answer":2,"why":"The ram took Isaac's place. Jesus took ours."}],"assignment":"Draw a picture of Mount Moriah: first Abraham and Isaac, then Solomon's temple. Tell a parent how this story points to Jesus.","hope":["God stopped Abraham and gave a ram instead. Abraham called the place 'The LORD Will Provide.'","Many years later, God provided Jesus, the Lamb of God, right near that same mountain!"]},{"id":"ohist-15","bible":"gen-15","bibleTitle":"A Wife for Isaac","title":"Camels, Caravans, and Marriage Gifts","era":"About 2000-1800 BC","intro":"Abraham's servant went on a long trip with ten camels full of gifts to find a wife for Isaac. Let's learn about camels and gifts long ago!","sections":[{"h":"Amazing Camels","p":["Camels can go many days without water and carry heavy loads. That makes them perfect for desert trips!","Archaeologists still have questions about when camels became common in Israel. They may have been rare in Abraham's time. That would make ten camels a sign that Abraham was very rich!"]},{"h":"Gold Gifts","p":["The servant gave Rebekah a gold nose ring and two gold bracelets. Back then there were no coins. People used gold and silver by weight. A shekel was a weight, not a coin. Jewelry was a way to carry riches."]},{"h":"Rebekah's Choice","p":["Back then, families usually planned weddings. The groom's family gave gifts to the bride's family. But Genesis tells us Rebekah's family asked her, 'Will you go?' And she said, 'I will go.' Her choice mattered!"]}],"people":[{"name":"Rebekah","role":"Became Isaac's wife"},{"name":"Laban","role":"Rebekah's brother"}],"source":{"title":"The Code of Hammurabi, Law 159","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a man brings wedding gifts to a girl's family and then says, 'I won't marry your daughter,' her father gets to keep all the gifts.","note":"This old law shows that wedding gifts were a big, serious promise."},"vocab":[["Camel","A desert animal that can go days without water"],["Shekel","A weight used for silver and gold"],["Caravan","A group traveling together with animals"]],"map":{"view":"ane","places":["hebron_a","harran","damascus_a"],"caption":"The servant traveled north from Canaan to the land where Abraham's relatives lived."},"timeline":[{"y":2014,"t":"Scientists study old camel bones and ask new questions","d":true}],"video":[],"quiz":[{"q":"Why are camels great for desert trips?","options":["They can fly","They go days without water","They swim fast"],"answer":1,"why":"And they carry heavy loads!"},{"q":"What did Rebekah get?","options":["A puppy","A gold nose ring and bracelets","A new dress"],"answer":1,"why":"Gifts showed a serious wedding offer."},{"q":"Were there coins in Abraham's time?","options":["No","Yes"],"answer":0,"why":"People weighed gold and silver."},{"q":"What did Rebekah say?","options":["Maybe","No thanks","I will go"],"answer":2,"why":"Her choice mattered!"}],"assignment":"Make a camel fact poster: how much water they drink, how far they walk, and how much they carry."},{"id":"ohist-16","bible":"gen-16","bibleTitle":"Jacob, Esau, and a Stolen Blessing","title":"Birthrights and Blessings in the Ancient World","era":"About 1900-1400 BC","intro":"Could someone really trade something important for a bowl of stew? An old clay tablet tells about a man who traded his family land for three sheep!","sections":[{"h":"The Oldest Son's Share","p":["Long ago, the oldest son usually got twice as much of the family's things. He also became the leader of the family when his dad died. This was called the birthright.","For Abraham's family, the birthright was tied to God's promises. That's why trading it for stew was such a big deal."]},{"h":"Three Sheep","p":["In a town called Nuzi, archaeologists found thousands of clay tablets about families. One tells about a man who traded his share of a family field to his brother for just three sheep! That sounds like Esau and the stew."]},{"h":"A Father's Blessing","p":["People long ago believed a father's last words were very powerful and couldn't be taken back. That's why Isaac couldn't take back the blessing he gave Jacob. Esau's family became a nation called the Edomites."]}],"people":[{"name":"Esau","role":"Isaac's older son, who traded his birthright"},{"name":"Tupkitilla","role":"A man from Nuzi who traded land for three sheep"}],"source":{"title":"A Nuzi Inheritance Tablet","who":"Scribes of Nuzi","date":"About 1450 BC","text":"Tupkitilla gave his share of a field to his brother. His brother gave him three sheep.","note":"That's not a fair trade! It's a lot like Esau trading his birthright for one bowl of stew."},"vocab":[["Birthright","The special rights of the oldest son"],["Inheritance","Things passed down after someone dies"],["Edomites","Esau's family, who became a nation"]],"map":{"view":"ane","places":["nuzi","harran","hebron_a"],"caption":"The town of Nuzi was in northern Mesopotamia."},"timeline":[{"y":-1450,"t":"Nuzi tablets record family trades"},{"y":1925,"t":"Archaeologists start digging at Nuzi","d":true}],"video":[],"quiz":[{"q":"What did the oldest son usually get?","options":["Nothing","Twice as much","A camel"],"answer":1,"why":"A double share."},{"q":"What did Tupkitilla trade for three sheep?","options":["His house","His camel","His share of a field"],"answer":2,"why":"Like Esau's trade!"},{"q":"Why couldn't Isaac take back his blessing?","options":["Jacob ran away","He forgot","A father's blessing couldn't be undone"],"answer":2,"why":"Words like that were very serious."},{"q":"Who came from Esau's family?","options":["The Edomites","The Egyptians","The Romans"],"answer":0,"why":"Esau's family became Edom."}],"assignment":"Write a pretend clay tablet about Esau's trade. Use play dough and a toothpick if you have them!"},{"id":"ohist-17","bible":"gen-17","bibleTitle":"Jacob's Stairway to Heaven","title":"Standing Stones and Sacred Places","era":"About 2000-1000 BC","intro":"After his dream, Jacob stood up a stone and poured oil on it. Archaeologists have found standing stones like this all over Israel!","sections":[{"h":"Standing Stones","p":["A standing stone is a big rock set up on its end to help people remember something important. Jacob set up stones to remember meeting God, to remember a promise, and to mark Rachel's grave.","In a place called Gezer, archaeologists found a row of ten huge standing stones. Some are taller than a basketball hoop!"]},{"h":"Good Stones and Bad Stones","p":["Later, God told Israel to knock down stones that the Canaanites used to worship false gods. But Jacob's stone was good. Why? Jacob's stone helped him remember what God did. The Canaanites thought their stones were homes for gods."]},{"h":"A Stairway from Heaven","p":["At Babel, people tried to build their way up to heaven. At Bethel, God opened the way from above, and angels came down! Bethel means 'house of God.'"]}],"people":[{"name":"Jacob","role":"Set up a stone at Bethel after his dream"}],"source":{"title":"The Gezer Standing Stones","who":"Canaanite builders","date":"Middle Bronze Age, about 1650 BC","text":"A row of ten tall stone pillars stands on a platform. The tallest is over 10 feet high. A big stone bowl is nearby.","note":"These stones help us picture what Jacob's stone at Bethel looked like."},"vocab":[["Standing stone","A big rock set up on its end"],["Memorial","Something that helps us remember"],["Bethel","'House of God'"]],"map":{"view":"local","places":["bethel","gezer","beersheba","jerusalem"],"caption":"Jacob slept at Bethel on his way north. The Gezer stones are to the west."},"timeline":[{"y":-1650,"t":"The standing stones at Gezer are set up"},{"y":1902,"t":"Archaeologists begin digging at Gezer","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"Why did Jacob set up a stone?","options":["To remember meeting God","To play a game","To build a house"],"answer":0,"why":"It was a memorial."},{"q":"How many standing stones are at Gezer?","options":["Two","One hundred","Ten"],"answer":2,"why":"A row of ten!"},{"q":"What does Bethel mean?","options":["Long road","House of God","Big rock"],"answer":1,"why":"Jacob said God was in this place."},{"q":"How was Bethel different from Babel?","options":["It was taller","It was in Egypt","God opened the way from heaven"],"answer":2,"why":"God came down to Jacob."}],"assignment":"Paint a rock and write the date on it. Put it somewhere to remember one way God helped your family."},{"id":"ohist-18","bible":"gen-18","bibleTitle":"The Trickster Gets Tricked","title":"Shepherds' Contracts and Household Gods","era":"About 1900-1400 BC","intro":"Jacob worked 20 years as a shepherd for his uncle Laban. Old laws about shepherds and little idols called household gods help us understand their story.","sections":[{"h":"Working for a Wife","p":["Usually a groom's family gave gifts to the bride's family. Jacob didn't have anything, so he paid with work: seven years of taking care of sheep for Rachel. Then seven more years after Laban tricked him!","Shepherds were often paid with some of the new baby lambs and goats. That's why Jacob asked for the spotted ones."]},{"h":"Who Pays for Lost Sheep?","p":["Hammurabi's laws said that if a lion killed a sheep, the owner lost it, not the shepherd. But Jacob said Laban made him pay for every lost sheep himself! Laban was being unfair."]},{"h":"Rachel Takes the Idols","p":["When Jacob's family left, Rachel secretly took her father's household gods. These were small idols. Archaeologists have found lots of little idols like this in old houses.","Later, Jacob told his whole family to get rid of their idols and worship only the LORD."]}],"people":[{"name":"Laban","role":"Jacob's uncle and father-in-law"},{"name":"Rachel and Leah","role":"Laban's daughters and Jacob's wives"}],"source":{"title":"The Code of Hammurabi, Law 266","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a sickness or a lion kills an animal in the sheep pen, the shepherd is not to blame. The owner takes the loss.","note":"Now read Genesis 31:38-39. Jacob said he paid for every lost animal himself!"},"vocab":[["Shepherd","A person who takes care of sheep"],["Idol","A statue people worship as a false god"],["Flock","A group of sheep or goats"]],"map":{"view":"ane","places":["harran","hebron_a","damascus_a"],"caption":"Jacob worked for Laban near Harran, then headed south toward Canaan."},"timeline":[],"video":[],"quiz":[{"q":"How did Jacob pay for his wife?","options":["With gold","With work","With camels"],"answer":1,"why":"Seven years of shepherding."},{"q":"What did Rachel secretly take?","options":["Some bread","Her father's household gods","A camel"],"answer":1,"why":"Small idols."},{"q":"Who did Hammurabi's law say should lose the sheep a lion killed?","options":["The owner","The lion","The shepherd"],"answer":0,"why":"But Laban made Jacob pay!"},{"q":"What did Jacob later tell his family to do?","options":["Go back to Laban","Build a tower","Get rid of their idols"],"answer":2,"why":"Worship only the LORD."}],"assignment":"Pretend you are Jacob. Write a deal with Laban: how long you'll work and what you'll get paid."},{"id":"ohist-19","bible":"gen-19","bibleTitle":"Jacob Wrestles With God","title":"Bowing Seven Times: Letters of the Ancient Kings","era":"About 1350 BC","intro":"When Jacob met Esau, he bowed to the ground seven times. Hundreds of years later, kings in Canaan wrote letters to Pharaoh saying almost the same words!","sections":[{"h":"Letters Found by Accident","p":["About 140 years ago, a woman in Egypt was digging dirt for her garden. She found a pile of clay tablets! They were letters to Pharaoh from kings all over the land, including kings of cities in Canaan, like Jerusalem."]},{"h":"'Seven Times I Bow'","p":["The kings in Canaan started their letters to Pharaoh like this: 'At the feet of my lord the king, seven times and seven times I bow down.' Bowing seven times showed great respect.","So when Jacob bowed seven times to Esau, he was acting like a servant before a king. Jacob, who had tricked his brother, was now very humble. And Esau ran to hug him!"]},{"h":"Gifts for Peace","p":["Jacob sent Esau lots of animals as gifts. Long ago, people gave gifts when they wanted to make peace with someone important. The letters to Pharaoh talk about gifts too."]}],"people":[{"name":"Abdi-Heba","role":"A ruler of Jerusalem who wrote letters to Pharaoh"}],"source":{"title":"An Amarna Letter From Jerusalem","who":"Abdi-Heba, ruler of Jerusalem","date":"About 1340 BC","text":"Say to the king, my lord: This is Abdi-Heba, your servant. At the feet of my lord the king, seven times and seven times I bow down.","note":"Compare this with Genesis 33:3, where Jacob bows seven times to Esau."},"vocab":[["Humble","Not proud; putting others first"],["Ford","A shallow place to cross a river"],["Respect","Showing someone they are important"]],"map":{"view":"local","places":["penuel","shechem","jerusalem","gezer"],"caption":"Jacob wrestled with God by the Jabbok River. Kings of Jerusalem and other cities later wrote to Pharaoh."},"timeline":[{"y":-1350,"t":"Kings in Canaan write letters to Pharaoh"},{"y":1887,"t":"A woman digging in Egypt finds the letters","d":true}],"video":[],"quiz":[{"q":"How were the letters found?","options":["A dog dug them up","They fell from the sky","A woman digging dirt for her garden"],"answer":2,"why":"What a surprise!"},{"q":"How many times did the kings bow in their letters?","options":["Seven times and seven times","One hundred times","Once"],"answer":0,"why":"It showed great respect."},{"q":"How many times did Jacob bow to Esau?","options":["Seven","Twenty","Two"],"answer":0,"why":"Jacob was very humble."},{"q":"Why did Jacob send gifts?","options":["To get rid of animals","To make peace","To show off"],"answer":1,"why":"He hoped Esau would forgive him."}],"assignment":"Write a peace letter from Jacob to Esau. Start with 'Seven times I bow down!' and list your gifts."},{"id":"ohist-20","bible":"gen-20","bibleTitle":"Joseph's Dreams and Jealous Brothers","title":"Caravans, Colorful Coats, and the Road to Egypt","era":"About 1900-1700 BC","intro":"Joseph was sold to traders carrying spices to Egypt. An old Egyptian painting shows travelers from Canaan in colorful clothes coming into Egypt!","sections":[{"h":"The Spice Road","p":["Joseph's brothers were near a road that went from Canaan down to Egypt. The traders were carrying spices and sweet-smelling tree sap. Egyptians used these for medicine, perfume, and wrapping mummies."]},{"h":"Twenty Pieces of Silver","p":["The brothers sold Joseph for 20 pieces of silver. Old records show that's what people paid for a servant around Joseph's time. Later, the price went up to 30. That's what Judas was paid to betray Jesus."]},{"h":"A Colorful Painting","p":["In an Egyptian tomb there is a wall painting almost 4,000 years old. It shows 37 travelers from Canaan coming into Egypt. They have beards and wear brightly colored clothes with stripes and patterns!","We don't know exactly what Joseph's coat looked like. But this painting shows the kind of colorful clothes people from Canaan wore."]}],"people":[{"name":"Abisha","role":"Leader of the travelers in the Egyptian painting"}],"source":{"title":"The Beni Hasan Tomb Painting","who":"Painters for Khnumhotep II","date":"About 1890 BC","text":"The words above the painting say these are travelers led by a ruler named Abisha. They wear colorful clothes and walk with donkeys and a harp.","note":"This is one of the most famous pictures of people from Canaan going to Egypt."},"vocab":[["Caravan","A group of traders traveling together"],["Spices","Plants used for flavor, perfume, and medicine"],["Tomb","A place where someone is buried"]],"map":{"view":"ane","places":["hebron_a","avaris","memphis","benihasan"],"caption":"Traders traveled from Gilead through Canaan down to Egypt."},"timeline":[{"y":-1890,"t":"Egyptian painters show travelers from Canaan in colorful clothes"}],"video":[],"quiz":[{"q":"What were the traders carrying?","options":["Fish","Toys","Spices"],"answer":2,"why":"Spices and sweet-smelling sap."},{"q":"How much silver did the brothers get for Joseph?","options":["100 pieces","20 pieces","1 piece"],"answer":1,"why":"Twenty pieces of silver."},{"q":"What does the old painting show?","options":["A pyramid","Travelers in colorful clothes","A big boat"],"answer":1,"why":"Colorful clothes like Joseph's coat!"},{"q":"Where were the traders going?","options":["Rome","Egypt","Babylon"],"answer":1,"why":"They took Joseph to Egypt."}],"assignment":"Draw a traveler from the painting in bright colors. Then draw Joseph's coat however you imagine it!"},{"id":"ohist-21","bible":"gen-21","bibleTitle":"Faithful in Potiphar's House and in Prison","title":"Servants, Stewards, and Dreams in Egypt","era":"About 1800-1700 BC","intro":"Joseph went from slave, to manager, to prisoner. An old Egyptian paper lists the servants in a rich family's house, and many came from Canaan, just like Joseph!","sections":[{"h":"Servants from Canaan","p":["An old Egyptian paper made from reeds lists about 95 servants in one house. More than 40 came from Canaan and Syria! One woman was named Shiphrah. That's the same name as a Hebrew woman in Exodus.","Many servants got new Egyptian names, just like Joseph did."]},{"h":"In Charge of the House","p":["Potiphar put Joseph in charge of his whole house. Egyptian records talk about a manager who took care of a rich family's things, servants, and food. It was a big job that needed someone you trust!","The cupbearer served Pharaoh's drinks. He was with the king every day."]},{"h":"Dreams in Egypt","p":["Egyptians took dreams very seriously. They had dream books that said what dreams meant. One said, 'If you dream you're eating crocodile meat, that's good!'","But Joseph didn't use a dream book. He said, 'God knows what dreams mean.'"]}],"people":[{"name":"Potiphar","role":"Captain of Pharaoh's guard who bought Joseph"},{"name":"The cupbearer","role":"Pharaoh's drink server, who forgot Joseph"}],"source":{"title":"The Chester Beatty Dream Book","who":"An Egyptian scribe","date":"About 1275 BC","text":"If a man dreams he is eating crocodile meat: good. He will become an important worker. If a man dreams his teeth fall out: bad.","note":"Egyptians looked up dreams in books like this. Joseph said only God knows what dreams really mean."},"vocab":[["Papyrus","Paper made from river reeds"],["Manager","A person in charge of a house or business"],["Cupbearer","The person who served the king's drinks"]],"map":{"view":"ane","places":["memphis","avaris","thebes"],"caption":"Egypt's important cities were along the Nile River."},"timeline":[{"y":-1740,"t":"An Egyptian list names servants from Canaan"},{"y":-1275,"t":"An Egyptian dream book is written"}],"video":[],"quiz":[{"q":"Where did many servants in the Egyptian list come from?","options":["Canaan and Syria","America","China"],"answer":0,"why":"Just like Joseph!"},{"q":"What job did Potiphar give Joseph?","options":["Cook","In charge of his house","Soldier"],"answer":1,"why":"Joseph was trusted."},{"q":"What did a cupbearer do?","options":["Fixed boats","Served the king's drinks","Made cups"],"answer":1,"why":"He was with the king every day."},{"q":"Who did Joseph say knows what dreams mean?","options":["God","Pharaoh","Dream books"],"answer":0,"why":"Joseph gave God the credit."}],"assignment":"Make a job list for Joseph as Potiphar's manager. What would he need to do each day?","hope":["Joseph had some very hard days. But the Bible says, 'The LORD was with Joseph.'","God was with Joseph even in prison, and God is with you too."]},{"id":"ohist-22","bible":"gen-22","bibleTitle":"From Prison to Palace","title":"The Nile, Famine, and Pharaoh's Court","era":"About 1700 BC","intro":"Egypt needed the Nile River to flood every year. If it didn't, there wasn't enough food. An old carving even tells about a seven-year famine!","sections":[{"h":"The Gift of the Nile","p":["Egypt hardly ever gets rain. But every summer, the Nile River flooded and spread water and rich black mud over the fields. That made the crops grow!","Egyptians measured the flood each year. A good flood meant lots of food. A low flood meant hunger. That's why Pharaoh's dream about cows coming out of the Nile was so scary."]},{"h":"The Famine Stone","p":["On an island in the Nile, there is a big rock with writing about seven years of famine. It isn't about Joseph, but it shows that Egyptians remembered seven hungry years as a real kind of disaster."]},{"h":"Rewards from Pharaoh","p":["Joseph shaved before he met Pharaoh, because Egyptian men didn't wear beards. Pharaoh gave Joseph his special ring for stamping important papers, fancy clothes, and a gold necklace. Egyptian paintings show Pharaoh giving gold necklaces as rewards!"]}],"people":[{"name":"Herodotus","role":"A Greek writer who called Egypt 'the gift of the river'"}],"source":{"title":"The Famine Stela","who":"Egyptian priests","date":"Carved about 200 BC","text":"The king was very worried. The Nile had not flooded for seven years. There wasn't enough grain. Children cried, and everyone was hungry.","note":"This was carved long after Joseph's time. It shows how much Egypt feared long famines."},"vocab":[["Famine","A time when there isn't enough food"],["Flood","When a river overflows onto the land"],["Signet ring","A special ring used to stamp a seal"]],"map":{"view":"ane","places":["memphis","avaris","thebes"],"caption":"The Nile flows north through Egypt. The Famine Stone is far south, near Aswan."},"timeline":[{"y":-200,"t":"Egyptians carve the Famine Stone"},{"y":1889,"t":"An explorer finds the Famine Stone","d":true}],"video":[],"quiz":[{"q":"What made Egypt's crops grow?","options":["Lots of rain","Snow","The Nile's yearly flood"],"answer":2,"why":"The flood brought water and rich mud."},{"q":"Why did Joseph shave?","options":["Egyptian men didn't wear beards","He was hot","Pharaoh had no hair"],"answer":0,"why":"He wanted to look Egyptian."},{"q":"What did Pharaoh give Joseph?","options":["A boat","A ring, fancy clothes, and a gold necklace","A camel"],"answer":1,"why":"Joseph was put in charge of Egypt."},{"q":"What is a famine?","options":["A party","A time without enough food","A big river"],"answer":1,"why":"Joseph helped Egypt get ready."}],"assignment":"Pretend you're Joseph. Tell Pharaoh your plan to save food for the hungry years.","hope":["God told Pharaoh about the famine before it came, and he gave Joseph a smart plan.","Because of Joseph's plan, there was enough food for Egypt and for Joseph's family!"]},{"id":"ohist-23","bible":"gen-23","bibleTitle":"The Brothers Come to Egypt","title":"Grain, Silver, and Strangers in Egypt","era":"About 1700 BC","intro":"Joseph's brothers carried silver in their sacks, ate at a different table, and were accused of stealing a silver cup. Each part of the story fits the world long ago!","sections":[{"h":"Paying with Silver","p":["There were no coins in Joseph's time! Coins weren't invented until more than a thousand years later. People paid by weighing pieces of silver on a scale. That's why the brothers found their silver in their sacks."]},{"h":"Separate Tables","p":["At Joseph's feast, the Egyptians ate at a different table from the Hebrews. Egyptians didn't like eating with people from other countries. Even many years later, a Greek writer said Egyptians wouldn't use a foreigner's cooking pot!"]},{"h":"The Silver Cup","p":["People long ago sometimes poured oil into a cup of water and looked at the shapes to try to tell the future. God's law later said not to do that.","The Bible doesn't say Joseph really did this. He was pretending to be a tough Egyptian ruler to test his brothers. Joseph knew that only God knows the future."]}],"people":[{"name":"Judah","role":"The brother who offered to stay instead of Benjamin"},{"name":"Joseph's steward","role":"The manager who hid the cup in Benjamin's sack"}],"source":{"title":"Histories, Book 2","who":"Herodotus","date":"About 440 BC","text":"Herodotus wrote that Egyptians would not use a Greek person's knife, cooking pot, or fork.","note":"Herodotus lived long after Joseph. But it shows Egyptians kept apart from foreigners, just like Genesis 43:32 says."},"vocab":[["Scale","A tool for weighing things"],["Foreigner","Someone from another country"],["Steward","A person who manages a house"]],"map":{"view":"ane","places":["hebron_a","avaris","memphis"],"caption":"The brothers traveled from Hebron through the desert to Egypt, more than 200 miles."},"timeline":[{"y":-600,"t":"The first coins are made"},{"y":-440,"t":"Herodotus writes about Egyptian customs"}],"video":[],"quiz":[{"q":"How did people pay in Joseph's time?","options":["By weighing silver","With coins","With credit cards"],"answer":0,"why":"Coins hadn't been invented yet."},{"q":"Why did the Egyptians eat at a different table?","options":["There wasn't room","They were sick","They didn't like eating with foreigners"],"answer":2,"why":"Egyptians kept apart from foreigners."},{"q":"What was hidden in Benjamin's sack?","options":["A loaf of bread","A silver cup","A gold ring"],"answer":1,"why":"It was Joseph's test."},{"q":"Who knows the future?","options":["A cup of oil","Pharaoh","Only God"],"answer":2,"why":"Joseph trusted God."}],"assignment":"Make a balance scale with a hanger, string, and two cups. Weigh small things with coins!"},{"id":"ohist-24","bible":"gen-24","bibleTitle":"I Am Joseph!","title":"Goshen and Semitic People in Egypt","era":"About 1800-1550 BC","intro":"Jacob's family moved to Goshen, a green part of Egypt. Archaeologists have found a city there where lots of people from Canaan lived for hundreds of years!","sections":[{"h":"The Land of Goshen","p":["Goshen was in the Nile Delta, where the Nile River splits into branches before it reaches the sea. It had lots of water and grass, perfect for sheep! It was also the part of Egypt closest to Canaan.","Egyptians didn't like shepherds. So Jacob's family got to live by themselves in Goshen. That helped them stay together as God's people."]},{"h":"A City of People from Canaan","p":["Archaeologists dug up an old city in that area called Avaris. They found that many people there came from Canaan. Their houses, pots, and graves looked like ones from Canaan, not Egypt!","Later, some foreign kings even ruled part of Egypt from Avaris. Then Egyptian kings drove them out."]},{"h":"What Came Next","p":["Later, a new Pharaoh who didn't know about Joseph made the Israelites slaves. That's where the story of Moses begins!"]}],"people":[{"name":"Manfred Bietak","role":"Archaeologist who dug up Avaris"},{"name":"Jacob (Israel)","role":"Moved his family of 70 to Goshen"}],"source":{"title":"Manetho's History, quoted by Josephus","who":"Manetho, an Egyptian priest (quoted by Josephus)","date":"Manetho wrote about 280 BC","text":"An Egyptian priest wrote that people from the east came into Egypt and ruled from a city called Avaris. He called their kings 'shepherd kings.'","note":"Egyptians remembered a time when people from outside Egypt lived and ruled in the land near Goshen."},"vocab":[["Delta","Where a river splits into branches before reaching the sea"],["Goshen","The part of Egypt where Jacob's family lived"],["Archaeologist","A person who digs up and studies things from long ago"]],"map":{"view":"ane","places":["avaris","memphis","hebron_a","thebes"],"caption":"Goshen and Avaris were in the eastern Nile Delta, the part of Egypt closest to Canaan."},"timeline":[{"y":-1650,"t":"Foreign kings begin ruling northern Egypt"},{"y":-1550,"t":"Egyptian kings drive the foreign kings out"},{"y":1966,"t":"Archaeologists start digging up Avaris","d":true}],"video":[],"quiz":[{"q":"Where was Goshen?","options":["On a mountain","In Egypt's Nile Delta","In Babylon"],"answer":1,"why":"Near where the Nile meets the sea."},{"q":"Why was Goshen good for Jacob's family?","options":["Lots of water and grass for sheep","It had gold","It was cold"],"answer":0,"why":"Perfect for shepherds!"},{"q":"What did archaeologists find at Avaris?","options":["Dinosaur bones","Many people from Canaan lived there","A giant boat"],"answer":1,"why":"Their homes looked like Canaan's."},{"q":"What happened later in Egypt?","options":["A new Pharaoh made the Israelites slaves","Joseph became king of Babylon","Everyone moved away"],"answer":0,"why":"That's where Moses' story starts."}],"assignment":"Draw the Nile River splitting into branches at the Delta. Label Goshen and the sea."},{"id":"ohist-25","bible":"gen-25","bibleTitle":"God Meant It for Good","title":"Embalming, Mummies, and the Cave of Machpelah","era":"About 1700 BC to today","intro":"Genesis ends with two Egyptian-style burials. Jacob was buried in a family cave you can still visit today. Joseph asked his family to carry his bones home someday.","sections":[{"h":"Making a Mummy","p":["Egyptians wanted to keep bodies from falling apart. They dried the body with a special salt called natron. Then they rubbed it with oils and wrapped it in strips of cloth. That's a mummy! It took about 70 days."]},{"h":"The Family Cave","p":["Jacob was buried in a cave at Hebron that Abraham had bought. Abraham, Sarah, Isaac, Rebekah, and Leah were buried there too.","About 2,000 years ago, King Herod built giant stone walls around the cave. They are still standing today!"]},{"h":"Joseph's Bones","p":["Joseph lived to be 110 years old. He made his family promise to carry his bones to the promised land when God brought them out of Egypt.","They kept that promise! Moses carried Joseph's bones out of Egypt, and they were buried in the promised land. Joseph trusted God's promise."]}],"people":[{"name":"Joseph","role":"His bones were carried back to Canaan"},{"name":"Herod the Great","role":"Built walls around the family cave at Hebron"}],"source":{"title":"Histories, Book 2","who":"Herodotus","date":"About 440 BC","text":"Herodotus wrote that Egyptians dried the body with natron salt for 70 days, then wrapped it in fine cloth and put it in a wooden box shaped like a person.","note":"Scientists who study mummies today find that Herodotus was mostly right."},"vocab":[["Mummy","A body dried and wrapped to keep it from falling apart"],["Natron","A special salt used to dry bodies"],["Machpelah","The cave at Hebron where Abraham's family was buried"]],"map":{"view":"local","places":["hebron","shechem","beersheba"],"caption":"Jacob was buried at Hebron. Joseph's bones were later buried at Shechem."},"timeline":[{"y":-20,"t":"King Herod builds walls around the family cave at Hebron"},{"y":1922,"t":"King Tut's tomb is found in Egypt","d":true}],"video":[],"quiz":[{"q":"What is natron?","options":["A special salt for drying","A river","A kind of cloth"],"answer":0,"why":"It dried out the body."},{"q":"Where was Jacob buried?","options":["In a pyramid","In the sea","In a cave at Hebron"],"answer":2,"why":"With Abraham and Isaac."},{"q":"How old was Joseph when he died?","options":["110","900","50"],"answer":0,"why":"That was a long life!"},{"q":"What did Joseph ask his family to do?","options":["Build him a pyramid","Carry his bones to the promised land","Stay in Egypt forever"],"answer":1,"why":"And they did!"}],"assignment":"You finished Genesis history! Make a poster with Abraham, Isaac, Jacob, and Joseph. Add your favorite thing you learned.","hope":["Joseph said, 'You meant it for bad, but God meant it for good!'","Joseph knew God would keep his promise and bring his family home, and God did!"]}]};

const COURSES = [
  {id:"genesis", name:"Genesis", file:"lessons/genesis.json", prefix:"ohist-"},
  {id:"exodus", name:"Exodus", file:"lessons/exodus.json", prefix:"exh-"},

const cache = {};

/* ---------- state ---------- */
const LS = "otw-g3-progress-v1";
let progress = {name:"", done:{}};
let db = null, pdoc = null, saveTimer = null;
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
progress = Object.assign(progress, lsGet(LS)||{});
function save(){
  lsSet(LS, progress);
  if(pdoc){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ pdoc.set(progress).then(()=>{ dbWriteOk=true; }).catch(()=>{ dbWriteOk=false; }); }, 300); }
}
/* progress is kept on this device only (no Claude account needed) */

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function loadCourse(c){ if(cache[c.id]) return cache[c.id]; cache[c.id] = EMBED[c.file] || await (await fetch(c.file)).json(); return cache[c.id]; }
function fmtYear(y){ if(y<0) return (-y)+" BC"; if(y<1000) return "AD "+y; return String(y); }
function updateStars(){ document.getElementById("starCount").textContent = Object.keys(progress.done).length; }

function mapSVG(spec){
  const m = MAPS[spec.view], big = m.w >= 900;
  const fs = big ? {p:26, r:20, pin:9} : {p:19, r:14, pin:7};
  let s = `<svg viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Map showing ${spec.places.map(p=>MAPS.places[p].n).join(", ")}">`;
  s += `<rect width="${m.w}" height="${m.h}" fill="var(--sea)"/><path class="m-land" d="${m.land}"/>`;
  if(m.water) s += `<path class="m-water" d="${m.water}"/>`;
  if(m.rivers) s += `<path class="m-river" d="${m.rivers}"/>`;
  for(const [n,x,y] of MAPS.regions[spec.view]) s += `<text class="m-region" x="${x}" y="${y}" font-size="${fs.r}" text-anchor="middle">${esc(n)}</text>`;
  for(const id of spec.places){
    const p = MAPS.places[id]; const left = p.a==="l";
    s += `<circle class="m-pin" cx="${p.x}" cy="${p.y}" r="${fs.pin}"/>`;
    s += `<text class="m-lbl" x="${p.x + (left?-1:1)*(fs.pin+5)}" y="${p.y + fs.p*0.35 + (p.dy||0)}" font-size="${fs.p}" text-anchor="${left?"end":"start"}">${esc(p.n)}</text>`;
  }
  return s + `</svg>`;
}

/* ---------- views ---------- */
let view = {name:"home"};
function go(v){ view=v; render(); window.scrollTo({top:0}); }
function setNav(){
  document.getElementById("tlBtn").setAttribute("aria-current", view.name==="timeline"?"page":"false");
  document.getElementById("setBtn").setAttribute("aria-current", view.name==="settings"?"page":"false");
}
async function render(){
  updateStars(); setNav();
  if(view.name==="home") return renderHome();
  if(view.name==="lesson") return renderLesson(view.course, view.idx);
  if(view.name==="timeline") return renderTimeline();
  if(view.name==="settings") return renderSettings();
}

async function renderHome(){
  const all = [];
  for(const c of COURSES){ all.push({c, ls: await loadCourse(c)}); }
  let next = null;
  for(const {c,ls} of all){ const i = ls.findIndex(l=>!progress.done[l.id]); if(i>=0){ next = {c, i, l: ls[i]}; break; } }
  const name = progress.name ? ", "+esc(progress.name) : "";
  let h = `<section class="hello"><h1>Welcome back${name}!</h1><p>History lessons that go with your Old Testament lessons. Do each one after its matching Bible lesson.</p></section>`;
  if(next){
    h += `<section class="next"><span class="eyebrow">Up next · ${next.c.name} lesson ${next.i+1} · ${esc(next.l.era)}</span><h2>${esc(next.l.title)}</h2><span class="ref">Goes with Bible lesson: ${esc(next.l.bibleTitle)}</span><button id="goNext">Start lesson</button></section>`;
  } else {
    h += `<section class="next"><span class="eyebrow">All caught up</span><h2>You've finished every history lesson that's ready.</h2><span class="ref">More are coming as you move through the Old Testament.</span></section>`;
  }
  for(const {c,ls} of all){
    const d = ls.filter(l=>progress.done[l.id]).length;
    const firstOpen = ls.findIndex(l=>!progress.done[l.id]);
    const open = next ? next.c.id===c.id : false;
    h += `<details class="group" ${open?"open":""}><summary><h3 style="display:inline-flex">${c.name} <span class="cnt">${d} of ${ls.length} done</span></h3></summary><div class="bar"><i style="width:${Math.round(d/ls.length*100)}%"></i></div><ol class="path">` + ls.map((l,i)=>{
      const dn = progress.done[l.id];
      const cls = dn ? "done" : (i===firstOpen ? "here" : "");
      return `<li><div class="col"><span class="stone ${cls}">${dn?"✓":i+1}</span></div><button class="lessonbtn" data-c="${c.id}" data-i="${i}"><span class="t">${esc(l.title)}</span><span class="r">${esc(l.era)} · with "${esc(l.bibleTitle)}"</span>${dn?`<span class="sc">Quiz ${dn.score}/${dn.total}</span>`:""}</button></li>`;
    }).join("") + `</ol></details>`;
  }
  h += `<section class="group"><h3>Coming next</h3><div class="soon">${COMING.map(n=>`<span>${n}</span>`).join("")}</div></section>`;
  $app.innerHTML = h;
  document.getElementById("goNext")?.addEventListener("click", ()=>go({name:"lesson", course:next.c.id, idx:next.i}));
  $app.querySelectorAll(".lessonbtn").forEach(b=>b.addEventListener("click", ()=>go({name:"lesson", course:b.dataset.c, idx:+b.dataset.i})));
}

async function renderLesson(cid, idx){
  const c = COURSES.find(x=>x.id===cid); const ls = await loadCourse(c); const l = ls[idx];
  if(!l){ return go({name:"home"}); }
  const done = progress.done[l.id];
  try{ localStorage.setItem("last-lesson-"+APP_KEY, JSON.stringify({id:l.id, title:l.title, book:c.name, n:idx+1, at:Date.now()})); }catch(e){}
  const answers = new Array(l.quiz.length).fill(null);
  let h = `<button class="back" id="back">← All lessons</button>
  <section class="lhead"><span class="eyebrow">${c.name} · History lesson ${idx+1} of ${ls.length}</span><h1>${esc(l.title)}</h1><span class="era">${esc(l.era)}</span></section>
  <div class="pair"><div><span class="lbl">Goes with Bible lesson ${idx+1}</span><span class="pt">${esc(l.bibleTitle)}</span></div><a class="btn ghost" href="${NT_APP}#${l.bible}">${ICON_BOOK}Open Bible lesson</a></div>
  <p class="intro">${esc(l.intro)}</p>

  <section class="card"><span class="kicker">Map</span>
    <div class="mapbox ${l.map.view}">${mapSVG(l.map)}</div>
    <p class="mapcap">${esc(l.map.caption)}</p>
  </section>

  <section class="card"><span class="kicker">Reading</span>
    ${l.sections.map(s=>`<h3>${esc(s.h)}</h3>${s.p.map(p=>`<p>${esc(p)}</p>`).join("")}`).join("")}
    <label class="check"><input type="checkbox" id="readChk" ${done?"checked":""}> I read the whole lesson</label>
  </section>`;
  if(l.hope) h += `<section class="card hope"><span class="kicker">Where God Was at Work</span>${l.hope.map(p=>`<p>${esc(p)}</p>`).join("")}</section>`;
  if(l.people.length) h += `<section class="card"><span class="kicker">Key people</span><div class="people">${l.people.map(p=>`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>`).join("")}</div></section>`;
  h += `<section class="source card"><span class="kicker">Primary source</span><h2>${esc(l.source.title)}</h2><div class="meta">${esc(l.source.who)} · ${esc(l.source.date)}</div><blockquote>${esc(l.source.text)}</blockquote><p class="note">${esc(l.source.note)}</p></section>
  <section class="card"><span class="kicker">Vocabulary</span><dl class="vocab">${l.vocab.map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl></section>`;
  if(l.timeline.length) h += `<section class="card"><span class="kicker">Adds to your timeline</span><ul class="mini">${l.timeline.map(e=>`<li><span class="yr">${fmtYear(e.y)}</span><span>${esc(e.t)}${e.d?'<span class="disc">Discovery</span>':''}</span></li>`).join("")}</ul></section>`;

  h += `<section class="card"><span class="kicker">Quiz</span>${l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><div class="qt">${qi+1}. ${esc(q.q)}</div><div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div><div class="why" hidden></div></div>`).join("")}</section>
  <section class="card assign"><span class="kicker">Assignment</span><p>${esc(l.assignment)}</p><label for="asg" class="status">Your notes or written answer (saved with the lesson)</label><textarea id="asg">${esc((done&&done.assignment)||"")}</textarea></section>
  <section class="card finish" id="finish"></section>`;
  $app.innerHTML = h;
  document.getElementById("back").addEventListener("click", ()=>go({name:"home"}));

  $app.querySelectorAll(".q").forEach(qel=>{
    const qi = +qel.dataset.q, q = l.quiz[qi];
    qel.querySelectorAll(".opt").forEach(ob=>ob.addEventListener("click", ()=>{
      const oi = +ob.dataset.o; answers[qi] = oi===q.answer;
      qel.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.o===q.answer) x.classList.add("right"); });
      if(oi!==q.answer) ob.classList.add("wrong");
      const why = qel.querySelector(".why"); why.hidden=false; why.textContent = (oi===q.answer?"Correct! ":"Not quite. ")+q.why;
      drawFinish();
    }));
  });
  document.getElementById("readChk").addEventListener("change", drawFinish);
  document.getElementById("asg").addEventListener("change", e=>{ const cur = progress.done[l.id]; if(cur){ cur.assignment = e.target.value; save(); } });

  function navBtns(){
    const hasNext = idx+1 < ls.length;
    return `<div class="btnrow" style="justify-content:center">${hasNext?`<button class="btn" id="nextBtn">Next lesson →</button>`:""}<button class="btn ghost" id="toTl">See my timeline</button></div>`;
  }
  function bindNav(){
    document.getElementById("nextBtn")?.addEventListener("click", ()=>go({name:"lesson", course:cid, idx:idx+1}));
    document.getElementById("toTl").addEventListener("click", ()=>go({name:"timeline"}));
  }
  function drawFinish(){
    const f = document.getElementById("finish");
    if(f.dataset.celebrated) return;
    const cur = progress.done[l.id];
    if(cur){ f.innerHTML = `<div class="celebrate">${STAR}<h2>Lesson complete</h2><p class="note">Quiz score: ${cur.score}/${cur.total}. You can retake the quiz any time.</p></div>${navBtns()}`; bindNav(); return; }
    const read = document.getElementById("readChk").checked;
    const answered = answers.filter(a=>a!==null).length;
    const ready = read && answered===answers.length;
    f.innerHTML = `<button class="btn" id="doneBtn" ${ready?"":"disabled"}>Finish lesson and earn a star</button><p class="note">${ready?"Great work! Finishing adds this lesson's events to your timeline.":"Check \"I read the whole lesson\" and answer every quiz question to finish."}</p>`;
    document.getElementById("doneBtn").addEventListener("click", ()=>{
      if(!ready) return;
      progress.done[l.id] = {score: answers.filter(Boolean).length, total: answers.length, at: Date.now(), assignment: document.getElementById("asg").value}; try{ window.rhythmReport && rhythmReport('hist3'); }catch(e){}
      save(); updateStars();
      f.dataset.celebrated = "1";
      f.innerHTML = `<div class="celebrate">${STAR}<h2>Well done!</h2><p class="note">You got ${progress.done[l.id].score} of ${answers.length} right, and ${l.timeline.length} event${l.timeline.length===1?"":"s"} joined your timeline.</p></div>${navBtns()}`;
      bindNav();
    });
  }
  drawFinish();
}

function fromHash(){
  const m = /^#([a-z]+-)(\d+)$/.exec(location.hash||"");
  if(m){ const c = COURSES.find(x=>x.prefix===m[1]); const n = +m[2]; if(c && n>=1){ view = {name:"lesson", course:c.id, idx:n-1}; return true; } }
  return false;
}
const APP_KEY = "OTH3";
/* ---------- backup codes & saving safeguards ---------- */
let dbWriteOk = null;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(()=>{}); }catch(e){}
const storageWorks = (()=>{ try{ localStorage.setItem("__t","1"); const ok = localStorage.getItem("__t")==="1"; localStorage.removeItem("__t"); return ok; }catch(e){ return false; } })();
function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function encodeProgress(){
  const json = JSON.stringify({v:1, app:APP_KEY, p:progress});
  try{
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return APP_KEY+".Z"+b64u(new Uint8Array(buf));
  }catch(e){ return APP_KEY+".J"+b64u(new TextEncoder().encode(json)); }
}
async function decodeProgress(code){
  code = (code||"").replace(/\s+/g,"");
  const dot = code.indexOf(".");
  if(dot<0) throw new Error("format");
  const app = code.slice(0,dot), kind = code[dot+1], data = unb64u(code.slice(dot+2));
  if(app!==APP_KEY) throw new Error("app");
  let json;
  if(kind==="Z") json = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  else if(kind==="J") json = new TextDecoder().decode(data);
  else throw new Error("format");
  const obj = JSON.parse(json);
  if(!obj || !obj.p || typeof obj.p.done!=="object") throw new Error("format");
  return obj.p;
}
function mergeIn(p){
  let added = 0;
  for(const [k,v] of Object.entries(p.done||{})){
    const cur = progress.done[k];
    if(!cur || (v.at||0) > (cur.at||0)){ if(!cur) added++; progress.done[k] = v; }
  }
  if(!progress.name && p.name) progress.name = p.name;
  return added;
}
function addBackupUI(){
  const sec = document.createElement("section");
  sec.className = "card settings";
  sec.innerHTML = `<h2>Backup code</h2>
    <p class="status" style="font-size:15px">A backup code holds all your stars, quiz scores, and written answers. Make a new one after each lesson (or at least once a week) and keep it somewhere safe, like a note or an email to a parent. If your progress ever disappears, or you switch devices, paste it below to get everything back.</p>
    <div class="btnrow"><button class="btn" id="mkCode">Make backup code</button><button class="btn ghost" id="cpCode" hidden>Copy code</button><span class="status" id="mkStatus"></span></div>
    <textarea id="codeOut" readonly hidden style="min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all"></textarea>
    <label for="codeIn" style="margin-top:8px">Restore from a backup code</label>
    <textarea id="codeIn" placeholder="Paste a backup code here" style="min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
    <div class="btnrow"><button class="btn ghost" id="rsCode">Restore progress</button><span class="status" id="rsStatus"></span></div>`;
  $app.appendChild(sec);
  const out = sec.querySelector("#codeOut"), cp = sec.querySelector("#cpCode");
  sec.querySelector("#mkCode").addEventListener("click", async ()=>{
    out.value = await encodeProgress(); out.hidden = false; cp.hidden = false; try{ localStorage.setItem("last-backup-OTH3", String(Date.now())); }catch(e){}
    sec.querySelector("#mkStatus").textContent = Object.keys(progress.done).length+" lessons included";
  });
  cp.addEventListener("click", ()=>{
    const done = ()=>{ sec.querySelector("#mkStatus").textContent = "Copied"; };
    try{ navigator.clipboard.writeText(out.value).then(done).catch(()=>{ out.select(); sec.querySelector("#mkStatus").textContent = "Selected. Press copy on your keyboard."; }); }
    catch(e){ out.select(); }
  });
  sec.querySelector("#rsCode").addEventListener("click", async ()=>{
    const st = sec.querySelector("#rsStatus");
    try{
      const p = await decodeProgress(sec.querySelector("#codeIn").value);
      const added = mergeIn(p); save(); updateStars();
      st.textContent = "Restored. "+added+" new lesson"+(added===1?"":"s")+" added.";
    }catch(e){
      st.textContent = e.message==="app" ? "That code is from a different app. Each app has its own code." : "That code didn't work. Check that you copied the whole thing.";
    }
  });
}
function addBanner(){
  const n = Object.keys(progress.done).length;
  let last = 0; try{ last = +localStorage.getItem("last-backup-OTH3")||0; }catch(e){}
  if(storageWorks && (n===0 || Date.now()-last < 7*864e5)) return;
  const div = document.createElement("div");
  div.className = "card";
  div.style.cssText = "background:var(--gold-soft);border-color:transparent;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap";

  $app.prepend(div);
  div.querySelector("#bnSet").addEventListener("click", ()=>go({name:"settings"}));
}
{

<script>
(function(){
  if(!("speechSynthesis" in window)) return;
  var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  var current=null;
  function stop(){ try{ speechSynthesis.cancel(); }catch(e){} if(current){ current.setAttribute("aria-pressed","false"); current.lastChild.textContent="Read to me"; current=null; } }
  function textOf(card){
    var c=card.cloneNode(true);
    c.querySelectorAll(".readbtn,textarea,input,select,label,svg,.mapbox,.btnrow,.why[hidden],.finish,script,style,.n").forEach(function(x){x.remove();});
    c.querySelectorAll(".opt").forEach(function(o){ o.textContent=" "+o.textContent+". "; });
    c.querySelectorAll("p,h1,h2,h3,dt,dd,li,blockquote,div").forEach(function(x){ x.insertAdjacentText("beforeend",". "); });
    return c.textContent.replace(/\s+/g," ").replace(/(\.\s*){2,}/g,". ").trim();
  }
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); }; }catch(e){}
  /* Shared reading voice for the 3rd grade apps (saved per device as "ble-voice").
     "" = Joelle if this device shares it with web apps, otherwise the device's own voice.
     "system" = always the device's own voice (Settings > Accessibility > Spoken Content).
     anything else = that exact voice. */
  function bleVoice(){ try{ var want=localStorage.getItem("ble-voice")||""; if(want==="system") return null;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)/i.test(v.lang);});
    if(want){ var w=vs.find(function(v){return v.voiceURI===want;})||vs.find(function(v){return v.name===want;}); if(w) return w; }
    return vs.find(function(v){return /joelle/i.test(v.name) && /premium|enhanced/i.test(v.name+v.voiceURI);})||vs.find(function(v){return /joelle/i.test(v.name);})||null;
   }catch(e){ return null; } }
  
  function speak(btn,card){
    if(current===btn){ stop(); return; }
    stop();
    var u=new SpeechSynthesisUtterance(textOf(card));
    u.rate=0.9;
    var all=speechSynthesis.getVoices();
    var vs=all.filter(function(v){return /^en(-|_)/i.test(v.lang);});
    var pick=bleVoice();
    if(pick){ u.voice=pick; u.lang=pick.lang; } else u.lang="en-US";
    u.onend=u.onerror=function(){ if(current===btn) stop(); };
    current=btn; btn.setAttribute("aria-pressed","true"); btn.lastChild.textContent="Stop";
    speechSynthesis.speak(u);
  }
  function add(){
    var app=document.getElementById("app"); if(!app) return;
    app.querySelectorAll(".card, .intro").forEach(function(card){
      if(card.classList.contains("finish")||card.classList.contains("settings")||card.querySelector(".readbtn")) return;
      if(card.closest(".settings")) return;
      if(textOf(card).length<40) return;
      var b=document.createElement("button");
      b.type="button"; b.className="readbtn"; b.setAttribute("aria-pressed","false");
      b.innerHTML=ICON+"<span>Read to me</span>";
      b.addEventListener("click",function(e){ e.preventDefault(); speak(b,card); });
      card.insertBefore(b,card.firstChild);
    });
  }
  var app=document.getElementById("app");
  if(app){ new MutationObserver(function(m){ var real=m.some(function(r){return [].some.call(r.addedNodes,function(n){return !(n.classList&&n.classList.contains("readbtn"));});}); if(real){ stop(); add(); } }).observe(app,{childList:true}); }
  window.addEventListener("pagehide",stop);
  add();
})();
</script>

/* Reading-voice picker for the Settings screen (saved on this device as "ble-voice"). */
function bleVoiceUI(){
  var sel=document.getElementById("bleVSel"); if(!sel) return;
  function esc2(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function fill(){
    var all=[]; try{ all=speechSynthesis.getVoices()||[]; }catch(e){}
    var vs=all.filter(function(v){return /^en(-|_)/i.test(v.lang);}).sort(function(a,b){ return (/joelle/i.test(b.name)-/joelle/i.test(a.name))||(/samantha/i.test(b.name)-/samantha/i.test(a.name))||a.name.localeCompare(b.name); });
    var cur=""; try{ cur=localStorage.getItem("ble-voice")||""; }catch(e){}
    sel.innerHTML='<option value="">Automatic (the device’s voice)</option>'+vs.map(function(v){ return '<option value="'+esc2(v.voiceURI)+'">'+(/samantha/i.test(v.name)?"⭐ ":"")+esc2(v.name)+' · '+esc2(v.lang)+'</option>'; }).join("");
    sel.value=cur; if(sel.value!==cur) sel.value="";
    var n=document.getElementById("bleVNote"); if(n) n.textContent=vs.length?("Pick a voice and tap Test. Samantha (⭐) usually sounds the most natural."):"Voices are still loading. Tap Refresh list.";
  }
  fill(); var tries=0, t=setInterval(function(){ tries++; fill(); if(tries>8) clearInterval(t); },500);
  try{ speechSynthesis.addEventListener("voiceschanged",fill); }catch(e){}
  sel.onchange=function(){ try{ localStorage.setItem("ble-voice",sel.value); }catch(e){} var n=document.getElementById("bleVNote"); if(n) n.textContent="Saved. The Read buttons will use this voice."; };
  document.getElementById("bleVRef").onclick=fill;
  document.getElementById("bleVTest").onclick=function(){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance("Hi! This is the voice that will read your Bible lessons."); u.rate=0.9;
    var want=sel.value, v=null; if(want){ v=speechSynthesis.getVoices().find(function(x){return x.voiceURI===want;}); }
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US"; speechSynthesis.speak(u); }catch(e){} };
}
