s as a mark of great wealth, which fits if they were rare. This is a good example of how archaeology keeps asking questions, and how careful readers weigh the evidence."]},{"h":"Gold Nose Rings and Bracelets","p":["The servant gave Rebekah a gold nose ring weighing half a shekel and two gold bracelets weighing ten shekels. A shekel was a weight, about 0.4 ounces, not a coin; coins hadn't been invented yet. Jewelry was a way to carry and show wealth.","Nose rings and bracelets appear in art and graves across the ancient Near East. Giving them publicly signaled that a serious marriage offer was being made."]},{"h":"Arranging a Marriage","p":["Marriages were usually arranged between families. The groom's family gave gifts or a bride-price to the bride's family, and the families made the agreement. Hammurabi's laws cover what happens to such gifts if an engagement is broken.","Yet Genesis 24 includes a detail that stands out: Rebekah's family asks her, 'Will you go with this man?' and she answers, 'I will go.' Her own choice mattered."]}],"people":[{"name":"Abraham's chief servant","role":"Traveled to Nahor to find a wife for Isaac (often identified with Eliezer)"},{"name":"Rebekah","role":"Granddaughter of Abraham's brother Nahor; became Isaac's wife"},{"name":"Laban","role":"Rebekah's brother, who helped arrange the marriage"}],"source":{"title":"The Code of Hammurabi, Law 159","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a man has brought a betrothal gift to the house of his future father-in-law and has given the bride-price, but then sets his eyes on another woman and tells his father-in-law, 'I will not marry your daughter,' the father of the daughter may keep everything that was brought to him.","note":"Paraphrased. This law shows that marriage gifts were a serious, binding part of an engagement, just like the gifts Abraham's servant gave Rebekah and her family."},"vocab":[["Domesticated","Tamed and raised by people"],["Shekel","A unit of weight (about 0.4 ounces), later also a coin"],["Bride-price","Gifts or payment from the groom's family to the bride's family"],["Caravan","A group traveling together with pack animals"]],"map":{"view":"ane","places":["hebron_a","harran","damascus_a"],"caption":"The servant traveled from Canaan north to the region of Harran (Aram Naharaim) where Abraham's relatives lived."},"timeline":[{"y":2014,"t":"Study of camel bones reignites debate about early camel use","d":true}],"video":[],"quiz":[{"q":"Why were camels valuable?","options":["They were fast racers","They could travel far without water and carry loads","They gave wool","They were holy"],"answer":1,"why":"Perfect for desert travel."},{"q":"What was a shekel in Abraham's time?","options":["A coin","A unit of weight","A kind of camel","A tent"],"answer":1,"why":"Coins hadn't been invented yet."},{"q":"What did Rebekah receive?","options":["A crown","A gold nose ring and bracelets","A camel","A scroll"],"answer":1,"why":"Genesis 24:22."},{"q":"What question did Rebekah's family ask her?","options":["Are you hungry?","Will you go with this man?","Do you like camels?","Where is Isaac?"],"answer":1,"why":"Her consent mattered."},{"q":"What happens to betrothal gifts in Law 159 if the man backs out?","options":["He gets them back","The bride's father keeps them","They go to the king","They are destroyed"],"answer":1,"why":"The gifts were binding."}],"assignment":"Research camels: how much water they drink, how far they travel, and how much they carry. Make a fact poster, then write a paragraph explaining why Abraham sent ten camels on this trip."},{"id":"ohist-16","bible":"gen-16","bibleTitle":"Jacob, Esau, and a Stolen Blessing","title":"Birthrights and Blessings in the Ancient World","era":"About 1900-1400 BC","intro":"Could a man really sell his birthright for a bowl of stew? Tablets from the ancient town of Nuzi record a surprisingly similar deal.","sections":[{"h":"The Firstborn's Share","p":["In many ancient cultures, the oldest son received a larger inheritance, often a double share, and became head of the family when his father died. Deuteronomy 21:17 later made the double portion part of Israel's law.","The birthright was about more than money. It meant leadership and carrying on the family name. For Abraham's family, it was tied to God's covenant promises. That's why Hebrews 12:16 calls Esau 'godless' for trading it away."]},{"h":"Three Sheep for an Inheritance","p":["Nuzi was a town in northern Mesopotamia whose clay tablets, excavated beginning in 1925, record thousands of family and business deals. One famous tablet describes a man named Tupkitilla who traded his share of an inheritance to his brother for three sheep.","Nuzi's tablets date to the 1400s BC, several centuries after the patriarchs, and scholars debate how closely they match Genesis. But the tablet shows that selling inheritance rights, even cheaply, was something that really happened between brothers."]},{"h":"The Power of a Final Blessing","p":["People in the ancient world believed a father's words before death were powerful and binding. A Nuzi court case records a son winning his case because his father had declared, near death, that a certain woman would be his wife. The spoken statement was accepted as legal.","That helps explain why Isaac couldn't take back the blessing he gave Jacob, even after discovering the trick: 'I blessed him, and indeed he will be blessed!' Esau's descendants became the Edomites, who lived southeast of the Dead Sea, and the tension between the brothers continued between their nations for centuries."]}],"people":[{"name":"Tupkitilla","role":"Man from Nuzi who traded his inheritance share for three sheep"},{"name":"Esau","role":"Isaac's older son, ancestor of the Edomites"},{"name":"Edward Chiera","role":"Archaeologist who began excavations at Nuzi in 1925"}],"source":{"title":"A Nuzi Inheritance Tablet","who":"Scribes of Nuzi","date":"About 1450 BC","text":"The tablet records that Tupkitilla gave his inheritance share in a grove to his brother Kurpazah, and in exchange Kurpazah gave Tupkitilla three sheep.","note":"Paraphrased. The deal is lopsided, a valuable inheritance for three animals, much like Esau trading his birthright for one meal."},"vocab":[["Birthright","The special rights of the firstborn son"],["Inheritance","Property passed down after someone dies"],["Double portion","Twice the share given to other sons"],["Edomites","Descendants of Esau, living southeast of the Dead Sea"]],"map":{"view":"ane","places":["nuzi","harran","hebron_a"],"caption":"Nuzi, whose tablets record family customs, lay in northern Mesopotamia east of the Tigris."},"timeline":[{"y":-1450,"t":"Nuzi tablets record family and inheritance deals (about 1450 BC)"},{"y":1925,"t":"Excavations begin at Nuzi","d":true}],"video":[],"quiz":[{"q":"What did the firstborn usually receive?","options":["Nothing extra","A larger (often double) share","Only animals","The youngest's share"],"answer":1,"why":"Deuteronomy 21:17."},{"q":"What did Tupkitilla trade his inheritance for?","options":["A bowl of stew","Three sheep","A camel","Gold"],"answer":1,"why":"A famous Nuzi tablet."},{"q":"Why couldn't Isaac take back his blessing?","options":["He forgot it","A father's spoken blessing was considered binding","Rebekah wouldn't let him","Esau didn't want it"],"answer":1,"why":"Spoken words carried legal weight."},{"q":"Who descended from Esau?","options":["The Egyptians","The Edomites","The Babylonians","The Philistines"],"answer":1,"why":"Edom lay southeast of the Dead Sea."},{"q":"Why does Hebrews call Esau 'godless'?","options":["He was rude","He despised the birthright tied to God's promises","He was a hunter","He lived in Edom"],"answer":1,"why":"Hebrews 12:16."}],"assignment":"Write a mock 'Nuzi tablet' in the style of the source above, recording Esau's trade of his birthright to Jacob. Then write a paragraph about something valuable people today trade for something quick."},{"id":"ohist-17","bible":"gen-17","bibleTitle":"Jacob's Stairway to Heaven","title":"Standing Stones and Sacred Places","era":"About 2000-1000 BC","intro":"After his dream, Jacob set up his stone pillow as a pillar and poured oil on it. Archaeologists have found standing stones like this all over the land of Israel.","sections":[{"h":"Massebot: Standing Stones","p":["A massebah (plural massebot) is a standing stone set upright to mark something important: a meeting with God, a covenant, or a grave. Jacob set up standing stones at Bethel, at his covenant with Laban, and at Rachel's grave.","At Gezer, archaeologists found a row of ten large standing stones, some over 10 feet tall, dating to the Middle Bronze Age, roughly the era of the patriarchs. No one knows exactly what they meant, but they were likely connected with covenants or worship."]},{"h":"Good Pillars and Bad Pillars","p":["Later, God's law told Israel to tear down the sacred pillars of the Canaanites, because they were used in worshiping false gods (Deuteronomy 16:22). Yet Jacob's pillar at Bethel is presented as good. What made the difference?","Jacob's stone was a memorial: a way to remember that the LORD had met him there. Canaanite pillars were treated as dwelling places of gods. The same kind of object can be used to honor God or to replace him."]},{"h":"Stairways to Heaven","p":["The 'stairway' in Jacob's dream may have looked like the stepped ramps on a Mesopotamian ziggurat, which people believed connected earth and heaven. Jacob's grandfather Abraham had come from Ur, where one of the greatest ziggurats stood.","But unlike Babel, where people tried to build their way up to heaven, at Bethel God opened the way from above, and angels came down. Bethel, 'house of God,' later became an important worship center in Israel. Archaeologists have long identified it with the village of Beitin, north of Jerusalem, though some suggest nearby sites."]}],"people":[{"name":"Jacob","role":"Set up a pillar at Bethel after his dream"},{"name":"R. A. S. Macalister","role":"Archaeologist who uncovered Gezer's standing stones (1902-1909)"}],"source":{"title":"The Gezer Standing Stones","who":"Canaanite builders","date":"Middle Bronze Age, about 1650 BC","text":"A north-south row of ten tall limestone pillars stands on a raised platform, with a large stone basin nearby. The tallest is over 10 feet high. They were first excavated in the early 1900s and later restudied by other teams.","note":"Described. Like the Tiberius coin or the Pilate Stone, a physical object can be a primary source. These stones help us picture what Jacob's pillar, and the pillars God later told Israel to tear down, looked like."},"vocab":[["Massebah","Hebrew for a standing stone (plural: massebot)"],["Memorial","Something set up to help people remember"],["Bethel","'House of God'"],["Middle Bronze Age","An archaeological period roughly 2000-1550 BC"]],"map":{"view":"local","places":["bethel","gezer","beersheba","jerusalem"],"caption":"Jacob traveled north from Beersheba and spent the night at Bethel. Gezer's standing stones lie to the west."},"timeline":[{"y":-1650,"t":"Gezer's standing stones are set up (about 1650 BC)"},{"y":1902,"t":"Macalister begins excavating Gezer","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What is a massebah?","options":["A tent","A standing stone","A ziggurat","A well"],"answer":1,"why":"Set up to mark an important event."},{"q":"How many standing stones are in the row at Gezer?","options":["Two","Seven","Ten","Twelve"],"answer":2,"why":"Some are over 10 feet tall."},{"q":"Why were Canaanite pillars forbidden later?","options":["They were too tall","They were used to worship false gods","They blocked roads","They were Egyptian"],"answer":1,"why":"Deuteronomy 16:22."},{"q":"What does Bethel mean?","options":["House of bread","House of God","Stairway","Stone pillow"],"answer":1,"why":"Beth-El."},{"q":"How is Bethel different from Babel?","options":["God opened the way from above","It was taller","It was in Egypt","There's no difference"],"answer":0,"why":"At Babel people tried to climb up; at Bethel God came down."}],"assignment":"Set up a small 'memorial stone' at home (a painted rock with a date). Write on it or beside it one way God has helped your family. Then write a paragraph about the difference between a memorial and an idol."},{"id":"ohist-18","bible":"gen-18","bibleTitle":"The Trickster Gets Tricked","title":"Shepherds' Contracts and Household Gods","era":"About 1900-1400 BC","intro":"Jacob worked 20 years for Laban as a shepherd. Ancient laws about shepherds, and small idols called household gods, help explain the tense relationship between them.","sections":[{"h":"Working for a Bride","p":["Normally a groom's family paid a bride-price. Jacob arrived with nothing, so he paid with his work instead: seven years of shepherding for Rachel. When Laban swapped Leah for Rachel, Jacob had to work seven more.","Shepherding contracts were common in the ancient Near East. The shepherd took care of the owner's flock and was paid in part of the new lambs and kids. That's the kind of deal Jacob later made for the speckled and spotted animals (Genesis 30)."]},{"h":"Who Pays for Lost Sheep?","p":["Hammurabi's laws say that if a lion kills an animal in the fold, or a plague strikes, the shepherd can clear himself by swearing an oath before God, and the owner bears the loss. But if the shepherd is careless, he must pay for it.","Compare Jacob's complaint to Laban in Genesis 31:38-39: 'I did not bring you animals torn by wild beasts; I bore the loss myself. And you demanded payment from me for whatever was stolen by day or night.' Jacob was saying Laban had demanded more than even the normal customs required."]},{"h":"Rachel and the Household Gods","p":["When Jacob's family left, Rachel secretly stole her father's household gods (in Hebrew, teraphim). These were small figurines, and archaeologists have found many small clay and metal idols in homes across the region. Laban chased Jacob for days to get them back.","Why did they matter so much? Some scholars once pointed to Nuzi tablets that seemed to connect household gods with the right to inherit family property. Others now doubt that link. What's clear is that Laban valued them, and that Jacob's household still had to learn to worship only the LORD. Later, at Bethel, Jacob told his family to get rid of their foreign gods (Genesis 35:2)."]}],"people":[{"name":"Laban","role":"Jacob's uncle and father-in-law in Harran"},{"name":"Rachel and Leah","role":"Laban's daughters and Jacob's wives"}],"source":{"title":"The Code of Hammurabi, Law 266","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If in the sheepfold a disease strikes by the hand of a god, or a lion kills an animal, the shepherd shall clear himself before the god, and the owner of the fold shall bear the loss.","note":"Paraphrased. The following law says a careless shepherd must pay for losses. Compare with Genesis 31:38-42, where Jacob says he paid for every lost animal himself."},"vocab":[["Teraphim","Hebrew word for household gods or idols"],["Figurine","A small statue"],["Flock","A group of sheep or goats"],["Contract","A formal agreement between people"]],"map":{"view":"ane","places":["harran","hebron_a","damascus_a"],"caption":"Jacob worked for Laban near Harran, then fled south toward Canaan."},"timeline":[],"video":[],"quiz":[{"q":"How did Jacob pay the bride-price for Rachel?","options":["With gold","With seven years of work","With camels","He didn't"],"answer":1,"why":"He had no money, so he worked."},{"q":"According to Hammurabi, who bears the loss if a lion kills a sheep?","options":["The shepherd","The owner","The king","No one"],"answer":1,"why":"If the shepherd swears he wasn't careless."},{"q":"What did Jacob say about animals torn by wild beasts?","options":["Laban paid for them","He bore the loss himself","They never happened","He sold them"],"answer":1,"why":"Genesis 31:39."},{"q":"What are teraphim?","options":["Tents","Household gods","Wells","Coins"],"answer":1,"why":"Small idols kept in homes."},{"q":"What did Jacob later tell his family at Bethel?","options":["Build a tower","Get rid of foreign gods","Go to Egypt","Sell the flocks"],"answer":1,"why":"Genesis 35:2."}],"assignment":"Write a shepherd's contract between Jacob and Laban based on Genesis 30:31-34. Include the length of work, the pay (which animals), and what happens to lost animals. Then add a paragraph on how Jacob's 20 years with Laban may have changed him."},{"id":"ohist-19","bible":"gen-19","bibleTitle":"Jacob Wrestles With God","title":"Bowing Seven Times: Letters of the Ancient Kings","era":"About 1350 BC","intro":"When Jacob met Esau, he bowed to the ground seven times. Hundreds of years later, rulers in Canaan wrote to Pharaoh using almost the same words, in letters found by accident in 1887.","sections":[{"h":"The Amarna Letters","p":["In 1887, a local woman digging for soil to use as fertilizer near Tell el-Amarna in Egypt found a collection of clay tablets. They turned out to be letters to the pharaohs, mostly from around 1360-1330 BC, sent by kings and local rulers across the ancient Near East. More than 380 are known today.","The letters were written in cuneiform in Akkadian, the international language of diplomacy, even though they were sent to Egypt. Many come from rulers of cities in Canaan, including Jerusalem, Shechem, and Gezer."]},{"h":"'Seven Times and Seven Times'","p":["Canaanite rulers began their letters to Pharaoh with humble greetings like: 'At the feet of my lord, the king, seven times and seven times I fall.' Bowing seven times showed complete respect and submission to a powerful superior.","So when Jacob 'bowed down to the ground seven times as he approached his brother' (Genesis 33:3), he was using the language of a servant approaching a king. The one who had grabbed his brother's heel and stolen his blessing now humbled himself completely, and Esau ran to embrace him."]},{"h":"Fords and Gifts","p":["Jacob wrestled with God at the ford of the Jabbok, a river that flows west into the Jordan through the hills of Gilead. A ford is a shallow spot where people and animals could cross. Travelers often camped at fords before crossing.","Jacob's huge gift of livestock (Genesis 32:13-15) also fit ancient custom. Gifts were a normal part of approaching a powerful person and seeking peace. The Amarna letters are full of kings exchanging gifts to keep relationships friendly."]}],"people":[{"name":"Akhenaten","role":"Pharaoh who built the city at Amarna, where many of the letters were sent"},{"name":"Abdi-Heba","role":"Ruler of Jerusalem who wrote several of the Amarna letters"}],"source":{"title":"An Amarna Letter From Jerusalem","who":"Abdi-Heba, ruler of Jerusalem","date":"About 1340 BC","text":"Abdi-Heba begins: 'Say to the king, my lord: Message of Abdi-Heba, your servant. At the feet of my lord, the king, seven times and seven times I fall.' He then begs Pharaoh to send soldiers because enemies are attacking the king's lands.","note":"Closely translated. Letters like this show how a servant addressed a king. Compare Genesis 33:3, where Jacob bows seven times before Esau."},"vocab":[["Diplomacy","Managing relationships between nations or rulers"],["Akkadian","A Mesopotamian language used internationally, like English is today"],["Ford","A shallow place to cross a river"],["Submission","Humbly yielding to someone else's authority"]],"map":{"view":"local","places":["penuel","shechem","jerusalem","gezer"],"caption":"Jacob wrestled at Penuel by the Jabbok River, then crossed toward Shechem. Rulers of Jerusalem, Shechem, and Gezer later wrote Amarna letters."},"timeline":[{"y":-1350,"t":"Canaanite rulers write the Amarna letters to Pharaoh (about 1360-1330 BC)"},{"y":1887,"t":"The Amarna letters are discovered in Egypt","d":true}],"video":[],"quiz":[{"q":"How were the Amarna letters discovered?","options":["By a museum team","A local woman digging for fertilizer","In a shipwreck","Under the pyramids"],"answer":1,"why":"In 1887 near Tell el-Amarna."},{"q":"What language were the letters written in?","options":["Hebrew","Egyptian","Akkadian cuneiform","Greek"],"answer":2,"why":"The international language of diplomacy."},{"q":"What did bowing seven times show?","options":["Exercise","Complete respect and submission","Anger","A game"],"answer":1,"why":"How a servant approached a king."},{"q":"What is a ford?","options":["A bridge","A shallow crossing place in a river","A boat","A city gate"],"answer":1,"why":"Jacob wrestled at the ford of the Jabbok."},{"q":"Which city's ruler, Abdi-Heba, wrote Amarna letters?","options":["Babylon","Jerusalem","Ur","Rome"],"answer":1,"why":"Jerusalem was already a city-state."}],"assignment":"Write a letter from Jacob to Esau in the style of an Amarna letter, including the 'seven times I fall' greeting, a list of gifts, and a request for peace. Then write a paragraph about what humility looks like when making peace."},{"id":"ohist-20","bible":"gen-20","bibleTitle":"Joseph's Dreams and Jealous Brothers","title":"Caravans, Colorful Coats, and the Road to Egypt","era":"About 1900-1700 BC","intro":"Joseph was sold to a caravan carrying spices to Egypt. An Egyptian tomb painting from around that time shows a group of colorfully dressed Semitic travelers arriving in Egypt.","sections":[{"h":"The Spice Road to Egypt","p":["Joseph's brothers were near Dothan, on a route that ran from Gilead across Canaan and down the coast to Egypt. The Ishmaelite traders were carrying 'spices, balm and myrrh' (Genesis 37:25). These plant resins were used for medicine, perfume, incense, and Egyptian embalming, and Egypt imported huge amounts.","Gilead's balm was so famous that Jeremiah later asked, 'Is there no balm in Gilead?' (Jeremiah 8:22). Caravans also carried slaves, and the brothers saw a chance to get rid of Joseph and make money."]},{"h":"Twenty Shekels of Silver","p":["The brothers sold Joseph for 20 shekels of silver. Egyptologist Kenneth Kitchen noted that the price of slaves in ancient documents rose over time: roughly 20 shekels in the early 1700s BC, around 30 shekels centuries later, and higher still after that.","The 20-shekel price in Genesis matches the earlier period, the general era when many scholars place Joseph. Later, the law of Moses set 30 shekels as a slave's value (Exodus 21:32), the same amount paid to Judas."]},{"h":"The Beni Hasan Painting","p":["In the tomb of an Egyptian official named Khnumhotep II at Beni Hasan, painted around 1890 BC, a wall scene shows a group of 37 'Asiatics,' Semitic people from the region of Canaan, arriving in Egypt. Their leader is named Abisha.","The men wear beards and brightly patterned tunics, and the women wear colorful dresses and leather shoes. They bring donkeys, a lyre, and a mineral used for eye paint. We can't know what Joseph's special robe looked like, but this painting shows the kind of colorful clothing Semitic people wore when they entered Egypt."]}],"people":[{"name":"Khnumhotep II","role":"Egyptian official whose tomb at Beni Hasan shows Semitic visitors"},{"name":"Abisha","role":"Leader of the Semitic group painted in the Beni Hasan tomb"},{"name":"Kenneth Kitchen","role":"British Egyptologist who studied slave prices across ancient history"}],"source":{"title":"The Beni Hasan Tomb Painting","who":"Painters for Khnumhotep II","date":"About 1890 BC","text":"The caption above the painting names the group as 'Asiatics' led by 'the ruler of a foreign land, Abisha,' bringing black eye paint. The travelers wear multicolored clothing and walk with donkeys, weapons, and a musical instrument.","note":"Described and paraphrased. This is one of the most famous ancient pictures of Semitic people entering Egypt, from the general period of the patriarchs."},"vocab":[["Balm","A healing ointment made from plant resin"],["Myrrh","A fragrant resin used for perfume and embalming"],["Asiatics","Egyptian term for people from Canaan and Syria"],["Egyptologist","A scholar who studies ancient Egypt"]],"map":{"view":"ane","places":["hebron_a","avaris","memphis","benihasan"],"caption":"Caravans traveled from Gilead through Canaan down to Egypt. The Beni Hasan tombs lie along the Nile south of Memphis."},"timeline":[{"y":-1890,"t":"The Beni Hasan tomb painting shows Semitic travelers entering Egypt"}],"video":[],"quiz":[{"q":"What were the Ishmaelite traders carrying?","options":["Gold and weapons","Spices, balm, and myrrh","Grain","Wool"],"answer":1,"why":"Genesis 37:25."},{"q":"Why is the price of 20 shekels interesting?","options":["It's a random number","It matches slave prices from the early 1700s BC","It was the price of a camel","It was the temple tax"],"answer":1,"why":"Slave prices rose over time."},{"q":"What does the Beni Hasan painting show?","options":["Pharaoh's army","Semitic travelers in colorful clothes entering Egypt","The pyramids being built","A flood"],"answer":1,"why":"Led by a man named Abisha."},{"q":"Which region was famous for balm?","options":["Egypt","Gilead","Babylon","Ur"],"answer":1,"why":"'Is there no balm in Gilead?'"},{"q":"How much was paid to Judas, matching the later law's price for a slave?","options":["20 shekels","30 pieces of silver","50 shekels","100 denarii"],"answer":1,"why":"Exodus 21:32 set 30 shekels."}],"assignment":"Find a picture of the Beni Hasan painting with a parent. Draw one of the travelers in color and label their clothing, tools, and animals. Then write a paragraph imagining Joseph's feelings on the road to Egypt."},{"id":"ohist-21","bible":"gen-21","bibleTitle":"Faithful in Potiphar's House and in Prison","title":"Servants, Stewards, and Dreams in Egypt","era":"About 1800-1700 BC","intro":"Joseph went from slave to household manager to prisoner. An Egyptian papyrus from around that time lists the servants in a wealthy household, and many of them had Semitic names like Joseph's.","sections":[{"h":"A Semitic Servant in an Egyptian House","p":["Papyrus Brooklyn 35.1446, dated to around 1740 BC, includes a list of about 95 servants in an Egyptian household. More than 40 of them are described as 'Asiatics,' Semitic people from Canaan and Syria. Some have names related to Hebrew names, including a woman named Shiphrah, the same name as one of the Hebrew midwives in Exodus 1.","Many of these servants were given new Egyptian names, just as Pharaoh later gave Joseph the Egyptian name Zaphenath-Paneah. The papyrus shows that Semitic servants working in Egyptian homes was a common sight in this era."]},{"h":"Overseer of the House","p":["Potiphar made Joseph 'in charge of his household.' Egyptian records often mention an 'overseer of the house,' a steward who managed a wealthy family's property, servants, food stores, and accounts. It was a position of great trust.","The cupbearer and the chief baker in prison were also real Egyptian court positions. The cupbearer served the king's drinks and was often a trusted adviser, since he was in the king's presence daily. Nehemiah later held the same job for the king of Persia."]},{"h":"Egyptians and Dreams","p":["Egyptians took dreams very seriously. A papyrus known as the Chester Beatty Dream Book, from around 1275 BC, lists more than a hundred dreams with their meanings, like 'If a man sees himself in a dream eating crocodile meat, good: he will become an official.'","Professional dream interpreters used books like this. Joseph did something different: he said interpretations belong to God. That's why the cupbearer and baker were 'dejected' in prison. Without access to Pharaoh's experts, they had no one to explain their dreams, until Joseph offered God's answer."]}],"people":[{"name":"Potiphar","role":"Captain of Pharaoh's guard who bought Joseph"},{"name":"Pharaoh's cupbearer","role":"Royal official who served the king's drinks, and who forgot Joseph"}],"source":{"title":"The Chester Beatty Dream Book","who":"An Egyptian scribe","date":"About 1275 BC","text":"The dream book is arranged in columns: 'If a man sees himself in a dream...' followed by the dream and whether it is good or bad. For example, seeing yourself eating crocodile meat is called good, meaning you will become an official. Seeing your teeth fall out is called bad, meaning a relative will die.","note":"Paraphrased. The book shows how Egyptian experts decoded dreams by looking them up. Joseph pointed instead to God as the one who reveals the meaning."},"vocab":[["Papyrus","Paper-like writing material made from Nile reeds"],["Steward / overseer","A manager of someone else's household or property"],["Cupbearer","Royal official who served the king's drinks"],["Interpretation","An explanation of meaning"]],"map":{"view":"ane","places":["memphis","avaris","thebes"],"caption":"Egypt's government centers lay along the Nile, from the Delta and Memphis in the north to Thebes in the south."},"timeline":[{"y":-1740,"t":"Papyrus Brooklyn lists Semitic servants in an Egyptian household (about 1740 BC)"},{"y":-1275,"t":"The Chester Beatty Dream Book is written (about 1275 BC)"}],"video":[],"quiz":[{"q":"What does Papyrus Brooklyn 35.1446 list?","options":["Pharaoh's gold","Servants in an Egyptian household","Dream meanings","Grain harvests"],"answer":1,"why":"Many of them were Semitic."},{"q":"Which name from Exodus appears on the papyrus?","options":["Moses","Shiphrah","Aaron","Miriam"],"answer":1,"why":"Shiphrah was a Hebrew midwife in Exodus 1."},{"q":"What did an 'overseer of the house' do?","options":["Built houses","Managed a household's property and servants","Guarded prisons","Baked bread"],"answer":1,"why":"Joseph's role in Potiphar's house."},{"q":"Which later Bible hero was also a cupbearer?","options":["Daniel","Nehemiah","David","Elijah"],"answer":1,"why":"Nehemiah served the Persian king."},{"q":"How did Egyptian experts interpret dreams?","options":["By praying to God","By looking them up in dream books","By asking children","They didn't"],"answer":1,"why":"Joseph pointed to God instead."}],"assignment":"Make a 'job description' for Joseph as overseer of Potiphar's house: duties, skills needed, and character qualities. Then write a paragraph about how Joseph showed faithfulness even in prison."},{"id":"ohist-22","bible":"gen-22","bibleTitle":"From Prison to Palace","title":"The Nile, Famine, and Pharaoh's Court","era":"About 1700 BC","intro":"Egypt's life depended on the yearly flood of the Nile. When it failed, famine followed. An ancient carving even tells of a seven-year famine.","sections":[{"h":"The Gift of the Nile","p":["Egypt gets almost no rain. Every summer, rains far to the south made the Nile flood, spreading water and rich black mud over the fields. Egyptians called their land Kemet, 'the black land,' because of that fertile soil. The Greek historian Herodotus called Egypt 'the gift of the river.'","Egyptians measured the flood each year with nilometers, staircases or markers cut into the riverbank. A good flood meant plenty of food. A low flood meant hunger. That's why Pharaoh's dream of cows coming up out of the Nile was so alarming: the Nile itself was the source of Egypt's food."]},{"h":"The Famine Stela","p":["On Sehel Island near Aswan, a large inscription carved on a granite boulder tells of seven years of famine in the time of King Djoser, the builder of the first pyramid. The Nile did not flood properly, grain was scarce, and people suffered until the king sought help from the god of the Nile's source.","The Famine Stela was carved much later, around 200 BC, and it isn't about Joseph. But it shows that Egyptians remembered a seven-year famine as a real kind of disaster, and it's a striking parallel to Genesis 41."]},{"h":"Honors at Pharaoh's Court","p":["Joseph shaved before meeting Pharaoh. Hebrews and Canaanites wore beards, but Egyptian men were usually clean-shaven. Pharaoh then gave Joseph his signet ring, which was used to stamp official documents, robes of fine linen, and a gold chain around his neck.","Egyptian tomb paintings show officials receiving 'the gold of honor,' heavy gold collars given by Pharaoh as rewards. Joseph also rode in a chariot and received an Egyptian name and an Egyptian wife, the daughter of a priest of On (Heliopolis), one of Egypt's great religious centers."]}],"people":[{"name":"Djoser","role":"Early pharaoh named in the Famine Stela; built Egypt's first pyramid"},{"name":"Charles Edwin Wilbour","role":"American Egyptologist who found the Famine Stela in 1889"},{"name":"Herodotus","role":"Greek historian who called Egypt 'the gift of the river'"}],"source":{"title":"The Famine Stela","who":"Egyptian priests","date":"Carved about 200 BC","text":"Written as if spoken by King Djoser, the inscription says the king was in great distress because the Nile had not come in its time for seven years. Grain was scarce, kernels were dried up, and everything people had to eat was short. Children cried, young people were weak, and the old were sad.","note":"Paraphrased. The stela was written long after the events it describes, possibly by priests promoting their temple. It isn't evidence for Joseph, but it shows how Egypt feared and remembered long famines."},"vocab":[["Nilometer","A structure used to measure the height of the Nile flood"],["Kemet","Ancient Egyptian name for Egypt: 'the black land'"],["Signet ring","A ring used to stamp an official seal"],["Famine","A severe shortage of food"]],"map":{"view":"ane","places":["memphis","avaris","thebes"],"caption":"The Nile flows north through Egypt. The Famine Stela is on Sehel Island far to the south near Aswan."},"timeline":[{"y":-200,"t":"The Famine Stela is carved near Aswan (about 200 BC)"},{"y":1889,"t":"Charles Wilbour finds the Famine Stela","d":true}],"video":[],"quiz":[{"q":"What made Egypt's farmland fertile?","options":["Heavy rain","The Nile's yearly flood","Snow","Irrigation from the sea"],"answer":1,"why":"It spread water and rich mud."},{"q":"What is a nilometer?","options":["A boat","A structure for measuring the Nile flood","A map","A calendar"],"answer":1,"why":"It predicted good or bad harvests."},{"q":"Why did Joseph shave before meeting Pharaoh?","options":["It was hot","Egyptian men were usually clean-shaven","He was sick","It was a law in Canaan"],"answer":1,"why":"He adapted to Egyptian custom."},{"q":"What does the Famine Stela describe?","options":["Joseph's story","Seven years of famine under King Djoser","The flood","The pyramids"],"answer":1,"why":"A striking parallel, though not about Joseph."},{"q":"What did Pharaoh give Joseph?","options":["A crown and army","A signet ring, linen robes, and a gold chain","Land in Canaan","A pyramid"],"answer":1,"why":"Genesis 41:42."}],"assignment":"Make a chart of Egypt's three seasons (flood, growing, harvest) and when each happened. Then write a paragraph explaining Joseph's plan in Genesis 41:33-36 as if you were advising Pharaoh."},{"id":"ohist-23","bible":"gen-23","bibleTitle":"The Brothers Come to Egypt","title":"Grain, Silver, and Strangers in Egypt","era":"About 1700 BC","intro":"Joseph's brothers carried silver in their sacks, ate at a separate table, and were accused of stealing a divination cup. Each detail fits the ancient world.","sections":[{"h":"Buying Grain With Silver","p":["There were no coins in Joseph's day. The first coins were made in Lydia (modern Turkey) around 600 BC, more than a thousand years later. Instead, people paid by weighing out pieces of silver on scales. That's why Joseph's brothers found their silver 'in the mouth of their sacks' and had to bring 'double the silver' on their next trip.","Archaeologists find hoards of silver pieces, rings, and scrap from this era, along with the stone weights used to measure them."]},{"h":"Separate Tables","p":["At Joseph's feast, the Egyptians ate separately from the Hebrews, 'for Egyptians could not eat with Hebrews, for that is detestable to Egyptians' (Genesis 43:32). Egyptians had strong customs about food and purity, and they were often suspicious of foreigners.","Over a thousand years later, Herodotus reported that no Egyptian would kiss a Greek on the mouth, or use a Greek's knife, cooking pot, or serving fork. Egyptian attitudes toward outsiders stayed strong for centuries."]},{"h":"A Divination Cup","p":["Joseph's steward said the silver cup was the one his master used for divination (Genesis 44:5). In the ancient Near East, people practiced lecanomancy: pouring oil onto water in a cup and reading the shapes it made to predict the future. Babylonian texts describe it in detail.","The Bible doesn't say Joseph actually used the cup this way. He was playing the role of a powerful Egyptian lord to test his brothers. God's law later forbade divination (Deuteronomy 18:10). Joseph's real understanding came from God."]}],"people":[{"name":"Joseph's steward","role":"Managed Joseph's house and carried out his test"},{"name":"Judah","role":"Brother who offered himself in Benjamin's place"},{"name":"Herodotus","role":"Greek historian who described Egyptian customs around 440 BC"}],"source":{"title":"Histories, Book 2","who":"Herodotus","date":"About 440 BC","text":"Herodotus reports that no Egyptian man or woman would kiss a Greek on the mouth, or use the knife, spit, or cooking pot of a Greek, or even taste the meat of a clean animal if it had been cut with a Greek's knife.","note":"Paraphrased. Herodotus lived long after Joseph, but his report shows how strongly Egyptians kept themselves separate from foreigners, just as Genesis 43:32 describes."},"vocab":[["Hoard","A hidden collection of valuables"],["Divination","Trying to learn hidden knowledge or the future by signs"],["Lecanomancy","Reading oil patterns on water in a cup"],["Steward","A manager of someone's household"]],"map":{"view":"ane","places":["hebron_a","avaris","memphis"],"caption":"The brothers traveled from Hebron down through the desert to Egypt, a trip of well over 200 miles."},"timeline":[{"y":-600,"t":"The first coins are made in Lydia (about 600 BC)"},{"y":-440,"t":"Herodotus writes about Egyptian customs (about 440 BC)"}],"video":[],"quiz":[{"q":"How did people pay in Joseph's time?","options":["With coins","By weighing silver","With paper money","Only by trading animals"],"answer":1,"why":"Coins came much later."},{"q":"Where were the first coins made?","options":["Egypt","Lydia","Babylon","Canaan"],"answer":1,"why":"Around 600 BC in modern Turkey."},{"q":"Why did the Egyptians eat separately from the Hebrews?","options":["There wasn't room","Egyptians found eating with Hebrews detestable","The Hebrews asked","It was a fast day"],"answer":1,"why":"Genesis 43:32."},{"q":"What is lecanomancy?","options":["Making pottery","Reading oil on water to predict the future","Weighing silver","Baking bread"],"answer":1,"why":"A form of divination."},{"q":"Who offered himself as a slave instead of Benjamin?","options":["Reuben","Judah","Simeon","Joseph"],"answer":1,"why":"Genesis 44:33."}],"assignment":"Make a balance scale with a hanger, string, and two cups. Use coins or washers as 'weights' to measure small objects. Write about how buying things with weighed silver would be different from using money today."},{"id":"ohist-24","bible":"gen-24","bibleTitle":"I Am Joseph!","title":"Goshen and Semitic People in Egypt","era":"About 1800-1550 BC","intro":"Jacob's family settled in Goshen, in Egypt's eastern Nile Delta. Archaeologists digging there have found a city where large numbers of Semitic people lived for centuries.","sections":[{"h":"The Land of Goshen","p":["Goshen was in the eastern part of the Nile Delta, the fan-shaped area where the Nile splits into branches before reaching the sea. It was well watered and good for grazing, ideal for shepherds, and it was the first part of Egypt that travelers from Canaan reached.","Joseph told his brothers to say they were shepherds, 'for all shepherds are detestable to the Egyptians' (Genesis 46:34). That meant they'd be allowed to live apart in Goshen, which helped them stay a distinct people."]},{"h":"Avaris: A City of Asiatics","p":["Beginning in 1966, Austrian archaeologist Manfred Bietak excavated Tell el-Dab'a in the eastern Delta, the site of the ancient city of Avaris. He found that from around 1800 BC, many of the people living there were Semitic, from Canaan and Syria. Their houses, pottery, weapons, and burial customs looked more like Canaan's than Egypt's.","Over time, Semitic people grew so powerful in the Delta that some of them ruled northern Egypt as kings. Egyptians called these rulers the Hyksos, 'rulers of foreign lands,' and they reigned from Avaris from about 1650 to 1550 BC, until Egyptian kings from the south drove them out."]},{"h":"Connecting to the Bible","p":["Scholars debate how Joseph and the Israelites fit into this history, and when exactly Joseph lived. Some place Joseph before the Hyksos, some during their time, and some in other periods. Avaris doesn't prove the Genesis story, but it shows that a large, settled Semitic population in the eastern Delta was a real part of Egypt's history.","Later, a new pharaoh 'who did not know about Joseph' would turn the Israelites into slaves (Exodus 1:8). Many scholars connect that change to Egypt's anger at foreigners after the Hyksos were driven out."]}],"people":[{"name":"Manfred Bietak","role":"Austrian archaeologist who excavated Avaris from 1966"},{"name":"The Hyksos","role":"Foreign rulers of northern Egypt, about 1650-1550 BC"},{"name":"Jacob (Israel)","role":"Moved his family of 70 to Goshen"}],"source":{"title":"Manetho's History, quoted by Josephus","who":"Manetho, an Egyptian priest (quoted by Josephus)","date":"Manetho wrote about 280 BC","text":"Manetho wrote that people of unknown origin from the east invaded Egypt, took power without a battle, and ruled from a city called Avaris. Their kings were called Hyksos, which he says means 'shepherd kings.'","note":"Paraphrased. Manetho's original book is lost; we know it through quotations in Josephus' Against Apion. Modern scholars think 'Hyksos' actually meant 'rulers of foreign lands,' and that they rose to power gradually, but Manetho's account shows Egyptians remembered this era of foreign rule."},"vocab":[["Delta","The fan-shaped area where a river splits before reaching the sea"],["Goshen","The area of the eastern Nile Delta where Jacob's family settled"],["Hyksos","'Rulers of foreign lands': Semitic kings of northern Egypt"],["Tell","A mound built up from layers of an ancient city"]],"map":{"view":"ane","places":["avaris","memphis","hebron_a","thebes"],"caption":"Goshen and Avaris lay in the eastern Nile Delta, the part of Egypt nearest Canaan."},"timeline":[{"y":-1650,"t":"Hyksos rulers take power in northern Egypt (about 1650 BC)"},{"y":-1550,"t":"Egyptian kings drive out the Hyksos (about 1550 BC)"},{"y":1966,"t":"Manfred Bietak begins excavating Avaris","d":true}],"video":[],"quiz":[{"q":"Where was Goshen?","options":["Southern Egypt","The eastern Nile Delta","Canaan","Babylon"],"answer":1,"why":"Closest to Canaan, good for grazing."},{"q":"Why did Joseph want his brothers to say they were shepherds?","options":["So they'd get jobs","So they'd be settled apart in Goshen","So Pharaoh would like them","They weren't shepherds"],"answer":1,"why":"Shepherds were detestable to Egyptians."},{"q":"What did Bietak find at Avaris?","options":["A pyramid","A city with many Semitic residents","The ark","Joseph's tomb"],"answer":1,"why":"Canaanite-style houses, pottery, and burials."},{"q":"Who were the Hyksos?","options":["Egyptian priests","Foreign rulers of northern Egypt","Babylonian kings","Greek traders"],"answer":1,"why":"About 1650-1550 BC."},{"q":"Does Avaris prove the Joseph story?","options":["Yes, completely","No, but it shows Semitic people lived in the Delta","It disproves it","It's unrelated"],"answer":1,"why":"It illuminates the setting."}],"assignment":"Draw the Nile Delta, showing the river branches, the Mediterranean, Goshen, Avaris, and Memphis. Then write a paragraph explaining how living in Goshen could have helped Israel become a nation."},{"id":"ohist-25","bible":"gen-25","bibleTitle":"God Meant It for Good","title":"Embalming, Mummies, and the Cave of Machpelah","era":"About 1700 BC to today","intro":"Genesis ends with two Egyptian-style burials. Jacob was embalmed and carried home to a family tomb that you can still visit today. Joseph was embalmed and placed in a coffin in Egypt.","sections":[{"h":"How Egyptians Embalmed","p":["Egyptians believed the body needed to be preserved for the afterlife. Embalmers removed the internal organs, dried the body with natron (a natural salt), then treated it with oils and resins and wrapped it in linen. Herodotus says the full process took 70 days.","Genesis 50:3 says Jacob's embalming took 40 days and the Egyptians mourned him for 70 days. That was a funeral fit for a high official. Joseph used Egyptian customs to honor his father, while holding on to Israel's hope: he took Jacob's body back to the land God had promised."]},{"h":"The Cave of Machpelah","p":["Jacob was buried in the cave of Machpelah at Hebron, the tomb Abraham had bought (Genesis 23). Abraham, Sarah, Isaac, Rebekah, and Leah were already buried there.","Around 2,000 years ago, Herod the Great built a massive stone enclosure over the traditional site, with walls made of huge blocks like those of his Jerusalem temple. It still stands today, one of the only Herodian buildings still largely intact. It is holy to Jews, Christians, and Muslims."]},{"h":"Joseph's Bones","p":["Joseph died at 110. Interestingly, 110 years was considered the ideal lifespan in ancient Egyptian writings, a sign of a blessed life. He was embalmed and placed in a coffin in Egypt, but he made his family promise to carry his bones to Canaan when God brought them out (Genesis 50:25).","They kept that promise. Moses took Joseph's bones during the Exodus (Exodus 13:19), and they were buried at Shechem (Joshua 24:32). Mummies and burials tell us what ancient people hoped for. Joseph's request tells us where his hope rested: in God's promise."]}],"people":[{"name":"Joseph","role":"Embalmed in Egypt; his bones were later carried to Canaan"},{"name":"Herod the Great","role":"Built the enclosure over the Cave of Machpelah"},{"name":"Howard Carter","role":"Discovered King Tutankhamun's tomb in 1922"}],"source":{"title":"Histories, Book 2","who":"Herodotus","date":"About 440 BC","text":"Herodotus describes the most expensive kind of Egyptian embalming. He says embalmers remove the brain and internal organs, clean the body with palm wine and spices, and cover it with natron for 70 days. Then they wash it and wrap it in strips of fine linen coated with gum, and give it to the family, who place it in a wooden case shaped like a person.","note":"Paraphrased. Herodotus visited Egypt long after Joseph, but mummification had been practiced for thousands of years. His description matches what scientists find when they study mummies today."},"vocab":[["Embalming","Preserving a dead body from decay"],["Natron","A natural salt used to dry bodies"],["Machpelah","The cave tomb of Abraham's family at Hebron"],["Afterlife","Life after death"]],"map":{"view":"local","places":["hebron","shechem","beersheba"],"caption":"Jacob was buried at Hebron; Joseph's bones were later buried at Shechem."},"timeline":[{"y":-20,"t":"Herod builds the enclosure over the Cave of Machpelah (about 20 BC)"},{"y":1922,"t":"Howard Carter finds Tutankhamun's tomb","d":true}],"video":[],"quiz":[{"q":"What is natron?","options":["A perfume","A natural salt used to dry bodies","A kind of linen","An Egyptian god"],"answer":1,"why":"It removed moisture."},{"q":"How long did Egypt mourn Jacob?","options":["7 days","40 days","70 days","One year"],"answer":2,"why":"Genesis 50:3."},{"q":"Who is buried in the Cave of Machpelah?","options":["Joseph and Moses","Abraham, Sarah, Isaac, Rebekah, Leah, and Jacob","Pharaohs","David and Solomon"],"answer":1,"why":"The patriarchs' family tomb."},{"q":"Why was 110 years special in Egypt?","options":["It was a king's age","It was the ideal lifespan","It was unlucky","It was a law"],"answer":1,"why":"A sign of a blessed life."},{"q":"Where were Joseph's bones finally buried?","options":["Egypt","Hebron","Shechem","Jerusalem"],"answer":2,"why":"Joshua 24:32."}],"assignment":"Final project for Genesis: create a timeline poster of the patriarchs (Abraham, Isaac, Jacob, Joseph) alongside three pieces of ancient evidence from this course. Add a paragraph on how Genesis 50:20 sums up the whole book."}]};

/* ---------- state ---------- */
const LS = "otw-progress-v1";
let progress = {name:"", done:{}};
let db = null, pdoc = null, saveTimer = null;
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
progress = Object.assign(progress, lsGet(LS)||{});
function save(){
  lsSet(LS, progress);
  if(pdoc){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ pdoc.set(progress).then(()=>{ dbWriteOk=true; }).catch(()=>{ dbWriteOk=false; }); }, 300); }
}
/* progress is kept on this device only (no Claude account needed) */

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function loadCourse(c){ if(cache[c.id]) return cache[c.id]; cache[c.id] = EMBED[c.file] || await (await fetch(c.file)).json(); return cache[c.id]; }
function fmtYear(y){ if(y<0) return (-y)+" BC"; if(y<1000) return "AD "+y; return String(y); }
function updateStars(){ document.getElementById("starCount").textContent = Object.keys(progress.done).length; }

function mapSVG(spec){
  const m = MAPS[spec.view], big = m.w >= 900;
  const fs = big ? {p:26, r:20, pin:9} : {p:19, r:14, pin:7};
  let s = `<svg viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Map showing ${spec.places.map(p=>MAPS.places[p].n).join(", ")}">`;
  s += `<rect width="${m.w}" height="${m.h}" fill="var(--sea)"/><path class="m-land" d="${m.land}"/>`;
  if(m.water) s += `<path class="m-water" d="${m.water}"/>`;
  if(m.rivers) s += `<path class="m-river" d="${m.rivers}"/>`;
  for(const [n,x,y] of MAPS.regions[spec.view]) s += `<text class="m-region" x="${x}" y="${y}" font-size="${fs.r}" text-anchor="middle">${esc(n)}</text>`;
  for(const id of spec.places){
    const p = MAPS.places[id]; const left = p.a==="l";
    s += `<circle class="m-pin" cx="${p.x}" cy="${p.y}" r="${fs.pin}"/>`;
    s += `<text class="m-lbl" x="${p.x + (left?-1:1)*(fs.pin+5)}" y="${p.y + fs.p*0.35 + (p.dy||0)}" font-size="${fs.p}" text-anchor="${left?"end":"start"}">${esc(p.n)}</text>`;
  }
  return s + `</svg>`;
}

let view = {name:"home"};
function go(v){ view=v; render(); window.scrollTo({top:0}); }
function setNav(){
  document.getElementById("tlBtn").setAttribute("aria-current", view.name==="timeline"?"page":"false");
  document.getElementById("setBtn").setAttribute("aria-current", view.name==="settings"?"page":"false");
}
async function render(){
  updateStars(); setNav();
  if(view.name==="home") return renderHome();
  if(view.name==="lesson") return renderLesson(view.course, view.idx);
  if(view.name==="timeline") return renderTimeline();
  if(view.name==="settings") return renderSettings();
}

async function renderHome(){
  const all = [];
  for(const c of COURSES){ all.push({c, ls: await loadCourse(c)}); }
  let next = null;
  for(const {c,ls} of all){ const i = ls.findIndex(l=>!progress.done[l.id]); if(i>=0){ next = {c, i, l: ls[i]}; break; } }
  const name = progress.name ? ", "+esc(progress.name) : "";
  let h = `<section class="hello"><h1>Welcome back${name}!</h1><p>History lessons that go with your Old Testament lessons. Do each one after its matching Bible lesson.</p></section>`;
  if(next){
    h += `<section class="next"><span class="eyebrow">Up next · ${next.c.name} lesson ${next.i+1} · ${esc(next.l.era)}</span><h2>${esc(next.l.title)}</h2><span class="ref">Goes with Bible lesson: ${esc(next.l.bibleTitle)}</span><button id="goNext">Start lesson</button></section>`;
  } else {
    h += `<section class="next"><span class="eyebrow">All caught up</span><h2>You've finished every history lesson that's ready.</h2><span class="ref">More are coming as you move through the Old Testament.</span></section>`;
  }
  for(const {c,ls} of all){
    const d = ls.filter(l=>progress.done[l.id]).length;
    const firstOpen = ls.findIndex(l=>!progress.done[l.id]);
    const open = next ? next.c.id===c.id : false;
    h += `<details class="group" ${open?"open":""}><summary><h3 style="display:inline-flex">${c.name} <span class="cnt">${d} of ${ls.length} done</span></h3></summary><div class="bar"><i style="width:${Math.round(d/ls.length*100)}%"></i></div><ol class="path">` + ls.map((l,i)=>{
      const dn = progress.done[l.id];
      const cls = dn ? "done" : (i===firstOpen ? "here" : "");
      return `<li><div class="col"><span class="stone ${cls}">${dn?"✓":i+1}</span></div><button class="lessonbtn" data-c="${c.id}" data-i="${i}"><span class="t">${esc(l.title)}</span><span class="r">${esc(l.era)} · with "${esc(l.bibleTitle)}"</span>${dn?`<span class="sc">Quiz ${dn.score}/${dn.total}</span>`:""}</button></li>`;
    }).join("") + `</ol></details>`;
  }
  h += `<section class="group"><h3>Coming next</h3><div class="soon">${COMING.map(n=>`<span>${n}</span>`).join("")}</div></section>`;
  $app.innerHTML = h;
  document.getElementById("goNext")?.addEventListener("click", ()=>go({name:"lesson", course:next.c.id, idx:next.i}));
  $app.querySelectorAll(".lessonbtn").forEach(b=>b.addEventListener("click", ()=>go({name:"lesson", course:b.dataset.c, idx:+b.dataset.i})));
}

async function renderLesson(cid, idx){
  const c = COURSES.find(x=>x.id===cid); const ls = await loadCourse(c); const l = ls[idx];
  if(!l){ return go({name:"home"}); }
  const done = progress.done[l.id];
  const answers = new Array(l.quiz.length).fill(null);
  let h = `<button class="back" id="back">← All lessons</button>
  <section class="lhead"><span class="eyebrow">${c.name} · History lesson ${idx+1} of ${ls.length}</span><h1>${esc(l.title)}</h1><span class="era">${esc(l.era)}</span></section>
  <div class="pair"><div><span class="lbl">Goes with Bible lesson ${idx+1}</span><span class="pt">${esc(l.bibleTitle)}</span></div><a class="btn ghost" href="${NT_APP}#${l.bible}">${ICON_BOOK}Open Bible lesson</a></div>
  <p class="intro">${esc(l.intro)}</p>

  <section class="card"><span class="kicker">Map</span>
    <div class="mapbox ${l.map.view}">${mapSVG(l.map)}</div>
    <p class="mapcap">${esc(l.map.caption)}</p>
  </section>

  <section class="card"><span class="kicker">Reading</span>
    ${l.sections.map(s=>`<h3>${esc(s.h)}</h3>${s.p.map(p=>`<p>${esc(p)}</p>`).join("")}`).join("")}
    <label class="check"><input type="checkbox" id="readChk" ${done?"checked":""}> I read the whole lesson</label>
  </section>`;
  if(l.people.length) h += `<section class="card"><span class="kicker">Key people</span><div class="people">${l.people.map(p=>`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>`).join("")}</div></section>`;
  h += `<section class="source card"><span class="kicker">Primary source</span><h2>${esc(l.source.title)}</h2><div class="meta">${esc(l.source.who)} · ${esc(l.source.date)}</div><blockquote>${esc(l.source.text)}</blockquote><p class="note">${esc(l.source.note)}</p></section>
  <section class="card"><span class="kicker">Vocabulary</span><dl class="vocab">${l.vocab.map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl></section>`;
  if(l.timeline.length) h += `<section class="card"><span class="kicker">Adds to your timeline</span><ul class="mini">${l.timeline.map(e=>`<li><span class="yr">${fmtYear(e.y)}</span><span>${esc(e.t)}${e.d?'<span class="disc">Discovery</span>':''}</span></li>`).join("")}</ul></section>`;
  if(l.video.length) h += `<section class="card"><span class="kicker">Watch</span><p>This Drive Thru History episode visits places from this part of the Bible's story, filmed on location. It streams free on TBN.</p><div class="btnrow">${l.video.map(([t,u])=>`<a class="btn ghost" href="${u}" target="_blank" rel="noopener">${ICON_PLAY}${esc(t.replace("Drive Thru History: ",""))}</a>`).join("")}</div>${l.videoNote?`<p class="why" style="margin-top:10px"><b>For parents:</b> ${esc(l.videoNote)}</p>`:""}</section>`;
  h += `<section class="card"><span class="kicker">Quiz</span>${l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><div class="qt">${qi+1}. ${esc(q.q)}</div><div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div><div class="why" hidden></div></div>`).join("")}</section>
  <section class="card assign"><span class="kicker">Assignment</span><p>${esc(l.assignment)}</p><label for="asg" class="status">Your notes or written answer (saved with the lesson)</label><textarea id="asg">${esc((done&&done.assignment)||"")}</textarea></section>
  <section class="card finish" id="finish"></section>`;
  $app.innerHTML = h;
  document.getElementById("back").addEventListener("click", ()=>go({name:"home"}));

  $app.querySelectorAll(".q").forEach(qel=>{
    const qi = +qel.dataset.q, q = l.quiz[qi];
    qel.querySelectorAll(".opt").forEach(ob=>ob.addEventListener("click", ()=>{
      const oi = +ob.dataset.o; answers[qi] = oi===q.answer;
      qel.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.o===q.answer) x.classList.add("right"); });
      if(oi!==q.answer) ob.classList.add("wrong");
      const why = qel.querySelector(".why"); why.hidden=false; why.textContent = (oi===q.answer?"Correct! ":"Not quite. ")+q.why;
      drawFinish();
    }));
  });
  document.getElementById("readChk").addEventListener("change", drawFinish);
  document.getElementById("asg").addEventListener("change", e=>{ const cur = progress.done[l.id]; if(cur){ cur.assignment = e.target.value; save(); } });

  function navBtns(){
    const hasNext = idx+1 < ls.length;
    return `<div class="btnrow" style="justify-content:center">${hasNext?`<button class="btn" id="nextBtn">Next lesson →</button>`:""}<button class="btn ghost" id="toTl">See my timeline</button></div>`;
  }
  function bindNav(){
    document.getElementById("nextBtn")?.addEventListener("click", ()=>go({name:"lesson", course:cid, idx:idx+1}));
    document.getElementById("toTl").addEventListener("click", ()=>go({name:"timeline"}));
  }
  function drawFinish(){
    const f = document.getElementById("finish");
    if(f.dataset.celebrated) return;
    const cur = progress.done[l.id];
    if(cur){ f.innerHTML = `<div class="celebrate">${STAR}<h2>Lesson complete</h2><p class="note">Quiz score: ${cur.score}/${cur.total}. You can retake the quiz any time.</p></div>${navBtns()}`; bindNav(); return; }
    const read = document.getElementById("readChk").checked;
    const answered = answers.filter(a=>a!==null).length;
    const ready = read && answered===answers.length;
    f.innerHTML = `<button class="btn" id="doneBtn" ${ready?"":"disabled"}>Finish lesson and earn a star</button><p class="note">${ready?"Great work! Finishing adds this lesson's events to your timeline.":"Check \"I read the whole lesson\" and answer every quiz question to finish."}</p>`;
    document.getElementById("doneBtn").addEventListener("click", ()=>{
      if(!ready) return;
      progress.done[l.id] = {score: answers.filter(Boolean).length, total: answers.length, at: Date.now(), assignment: document.getElementById("asg").value};
      save(); updateStars();
      f.dataset.celebrated = "1";
      f.innerHTML = `<div class="celebrate">${STAR}<h2>Well done!</h2><p class="note">You got ${progress.done[l.id].score} of ${answers.length} right, and ${l.timeline.length} event${l.timeline.length===1?"":"s"} joined your timeline.</p></div>${navBtns()}`;
      bindNav();
    });
  }
  drawFinish();
}

async function renderTimeline(){
  const all = [];
  for(const c of COURSES){ const ls = await loadCourse(c); ls.forEach((l,i)=>l.timeline.forEach(e=>all.push({...e, lesson:l, n:i+1, open: !!progress.done[l.id]}))); }
  all.sort((a,b)=>a.y-b.y);
  const ancient = all.filter(e=>!e.d), found = all.filter(e=>e.d);
  const row = e => `<li class="${e.open?"":"locked"} ${/Abram/.test(e.t)?"jesus":""}"><span class="yr">${fmtYear(e.y)}</span><span class="dot"></span><span class="ev">${e.open?`<b>${esc(e.t)}</b><span class="from">From lesson ${e.n}: ${esc(e.lesson.title)}</span>`:`Finish lesson ${e.n} to unlock`}</span></li>`;
  const oc = arr => arr.filter(e=>e.open).length;
  $app.innerHTML = `<section class="hello"><h1>My Timeline</h1><p>Every lesson you finish adds its events here. Gold dots mark the patriarchs. Genesis 1-11 isn't placed on the timeline; dates begin with Abraham.</p></section>
  <section class="card"><div class="tlhead"><h2>Ancient history</h2><span>${oc(ancient)} of ${ancient.length} unlocked</span></div><ul class="tl">${ancient.map(row).join("")}</ul></section>
  <section class="card"><div class="tlhead"><h2>Discoveries</h2><span>${oc(found)} of ${found.length} unlocked</span></div><p class="status" style="margin-top:-4px;margin-bottom:10px">When archaeologists and scientists found the evidence.</p><ul class="tl">${found.map(row).join("")}</ul></section>`;
}

function renderSettings(){
  $app.innerHTML = `<section class="card settings"><h2>Settings</h2>
    <label>Student's name<input id="nameIn" value="${esc(progress.name||"")}" placeholder="First name"></label>
    <div class="btnrow"><button class="btn" id="saveSet">Save</button><span class="status" id="setStatus"></span></div>
    <p class="status">Progress is saved on this device. Always open the app the same way (for example, its home-screen icon), and make a backup code below now and then to keep it safe.</p>
  </section>`;
  document.getElementById("saveSet").addEventListener("click", ()=>{ progress.name = document.getElementById("nameIn").value.trim(); save(); document.getElementById("setStatus").textContent = "Saved"; });
}

function fromHash(){
  const m = /^#([a-z]+-)(\d+)$/.exec(location.hash||"");
  if(m){ const c = COURSES.find(x=>x.prefix===m[1]); const n = +m[2]; if(c && n>=1){ view = {name:"lesson", course:c.id, idx:n-1}; return true; } }
  return false;
}
const APP_KEY = "OTH";
/* ---------- backup codes & saving safeguards ---------- */
let dbWriteOk = null;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(()=>{}); }catch(e){}
const storageWorks = (()=>{ try{ localStorage.setItem("__t","1"); const ok = localStorage.getItem("__t")==="1"; localStorage.removeItem("__t"); return ok; }catch(e){ return false; } })();
function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function encodeProgress(){
  const json = JSON.stringify({v:1, app:APP_KEY, p:progress});
  try{
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return APP_KEY+".Z"+b64u(new Uint8Array(buf));
  }catch(e){ return APP_KEY+".J"+b64u(new TextEncoder().encode(json)); }
}
async function decodeProgress(code){
  code = (code||"").replace(/\s+/g,"");
  const dot = code.indexOf(".");
  if(dot<0) throw new Error("format");
  const app = code.slice(0,dot), kind = code[dot+1], data = unb64u(code.slice(dot+2));
  if(app!==APP_KEY) throw new Error("app");
  let json;
  if(kind==="Z") json = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  else if(kind==="J") json = new TextDecoder().decode(data);
  else throw new Error("format");
  const obj = JSON.parse(json);
  if(!obj || !obj.p || typeof obj.p.done!=="object") throw new Error("format");
  return obj.p;
}
function mergeIn(p){
  let added = 0;
  for(const [k,v] of Object.entries(p.done||{})){
    const cur = progress.done[k];
    if(!cur || (v.at||0) > (cur.at||0)){ if(!cur) added++; progress.done[k] = v; }
  }
  if(!progress.name && p.name) progress.name = p.name;
  return added;
}
function addBackupUI(){
  const sec = document.createElement("section");
  sec.className = "card settings";
  sec.innerHTML = `<h2>Backup code</h2>
    <p class="status" style="font-size:15px">A backup code holds all your stars, quiz scores, and written answers. Make a new one after each lesson (or at least once a week) and keep it somewhere safe, like a note or an email to a parent. If your progress ever disappears, or you switch devices, paste it below to get everything back.</p>
    <div class="btnrow"><button class="btn" id="mkCode">Make backup code</button><button class="btn ghost" id="cpCode" hidden>Copy code</button><span class="status" id="mkStatus"></span></div>
    <textarea id="codeOut" readonly hidden style="min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all"></textarea>
    <label for="codeIn" style="margin-top:8px">Restore from a backup code</label>
    <textarea id="codeIn" placeholder="Paste a backup code here" style="min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
    <div class="btnrow"><button class="btn ghost" id="rsCode">Restore progress</button><span class="status" id="rsStatus"></span></div>`;
  $app.appendChild(sec);
  const out = sec.querySelector("#codeOut"), cp = sec.querySelector("#cpCode");
  sec.querySelector("#mkCode").addEventListener("click", async ()=>{
    out.value = await encodeProgress(); out.hidden = false; cp.hidden = false; try{ localStorage.setItem("last-backup-OTH", String(Date.now())); }catch(e){}
    sec.querySelector("#mkStatus").textContent = Object.keys(progress.done).length+" lessons included";
  });
  cp.addEventListener("click", ()=>{
    const done = ()=>{ sec.querySelector("#mkStatus").textContent = "Copied"; };
    try{ navigator.clipboard.writeText(out.value).then(done).catch(()=>{ out.select(); sec.querySelector("#mkStatus").textContent = "Selected. Press copy on your keyboard."; }); }
    catch(e){ out.select(); }
  });
  sec.querySelector("#rsCode").addEventListener("click", async ()=>{
    const st = sec.querySelector("#rsStatus");
    try{
      const p = await decodeProgress(sec.querySelector("#codeIn").value);
      const added = mergeIn(p); save(); updateStars();
      st.textContent = "Restored. "+added+" new lesson"+(added===1?"":"s")+" added.";
    }catch(e){
      st.textContent = e.message==="app" ? "That code is from a different app. Each app has its own code." : "That code didn't work. Check that you copied the whole thing.";
    }
  });
}
function addBanner(){
  const n = Object.keys(progress.done).length;
  let last = 0; try{ last = +localStorage.getItem("last-backup-OTH")||0; }catch(e){}
  if(storageWorks && (n===0 || Date.now()-last < 7*864e5)) return;
  const div = document.createElement("div");
  div.className = "card";
  div.style.cssText = "background:var(--gold-soft);border-color:transparent;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap";
  div.innerHTML = `<span style="flex:1;min-width:220px">${storageWorks ? "It's been a while since your last backup." : "This browser isn't able to save your progress. Try opening the app from Safari or its home-screen icon."} Make a backup code in Settings so you never lose your work.</span><button class="btn ghost" id="bnSet">Go to Settings</button>`;
  $app.prepend(div);
  div.querySelector("#bnSet").addEventListener("click", ()=>go({name:"settings"}));
}
{
  const _rs = renderSettings; renderSettings = function(){ _rs(); addBackupUI(); };
  const _rh = renderHome; renderHome = async function(){ await _rh(); addBanner(); };
}

document.getElementById("homeBtn").addEventListener("click", ()=>go({name:"home"}));
document.getElementById("tlBtn").addEventListener("click", ()=>go({name:"timeline"}));
document.getElementById("setBtn").addEventListener("click", ()=>go({name:"settings"}));
window.addEventListener("hashchange", ()=>{ if(fromHash()) { render(); window.scrollTo({top:0}); } });
fromHash();
render();
