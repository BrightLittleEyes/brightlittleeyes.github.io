const UNITS = [
{
  id:"matter", n:1, sym:"Mt", color:"--u1", name:"Matter and Its Changes",
  blurb:"What everything is made of, how it changes state, and how to tell a physical change from a chemical one.",
  lessons:[
    { t:"Atoms, Elements, and Molecules",
      body:`<p>Everything that has mass and takes up space is <b>matter</b>. Your desk, the air, and your body are all matter. All matter is built from tiny particles called <b>atoms</b>. Atoms are so small that about a million of them lined up would be as wide as a human hair.</p>
<p>An <b>element</b> is a substance made of only one kind of atom. Gold, oxygen, and carbon are elements. Scientists have found about 118 elements, and they organize them in the <b>periodic table</b>. Each element has a one- or two-letter symbol, like O for oxygen and Fe for iron.</p>
<p>When two or more atoms bond together, they form a <b>molecule</b>. If the atoms are from different elements, the substance is a <b>compound</b>. Water (H₂O) is a compound: each molecule has two hydrogen atoms and one oxygen atom. A compound can act very differently from its elements. Sodium is a metal that reacts with water, and chlorine is a poisonous gas, but together they make table salt.</p>`,
      vocab:[["Matter","Anything that has mass and takes up space"],["Atom","The smallest unit of an element"],["Element","A pure substance made of one kind of atom"],["Molecule","Two or more atoms bonded together"],["Compound","A substance made of two or more different elements bonded together"]],
      tryit:"Look at a food label. Find sodium chloride (salt) or H₂O (water). Is each one an element or a compound?"},
    { t:"States of Matter",
      body:`<p>Matter is usually found in three states: <b>solid</b>, <b>liquid</b>, and <b>gas</b>. The state depends on how the particles move and how close together they are.</p>
<ul><li><b>Solid:</b> particles are packed tightly and vibrate in place. A solid keeps its own shape and volume.</li>
<li><b>Liquid:</b> particles are close but can slide past each other. A liquid has a fixed volume but takes the shape of its container.</li>
<li><b>Gas:</b> particles are far apart and move fast in all directions. A gas has no fixed shape or volume and spreads to fill its container.</li></ul>
<p>Adding thermal energy (heat) makes particles move faster. That is why ice <b>melts</b> into water and water <b>evaporates</b> or <b>boils</b> into water vapor. Removing heat slows particles down, so water vapor <b>condenses</b> into liquid and liquid water <b>freezes</b>. At sea level, pure water freezes at 0 °C (32 °F) and boils at 100 °C (212 °F).</p>`,
      vocab:[["Solid","Definite shape and definite volume"],["Liquid","Definite volume, no definite shape"],["Gas","No definite shape or volume"],["Melting","Solid to liquid"],["Condensation","Gas to liquid"],["Evaporation","Liquid to gas"]],
      tryit:"Put a cold glass of water on the counter. Where do the drops on the outside come from? (Hint: condensation.)"},
    { t:"Physical and Chemical Changes",
      body:`<p>A <b>physical change</b> changes the size, shape, or state of matter, but it is still the same substance. Cutting paper, melting butter, and dissolving sugar in water are physical changes. Often you can undo them.</p>
<p>A <b>chemical change</b> makes one or more <b>new substances</b>. Burning wood, baking a cake, and iron rusting are chemical changes. They are usually hard or impossible to reverse.</p>
<p>Clues that a chemical change happened:</p>
<ul><li>Gas bubbles form (not from boiling)</li><li>The color changes</li><li>Heat or light is given off, or the material gets cold</li><li>A solid (called a <b>precipitate</b>) forms when two liquids are mixed</li><li>A new smell appears</li></ul>
<p>In both kinds of change, the <b>law of conservation of mass</b> holds: atoms are rearranged, not created or destroyed, so the total mass stays the same.</p>`,
      vocab:[["Physical change","A change in form that does not make a new substance"],["Chemical change","A change that produces a new substance"],["Precipitate","A solid that forms from mixing liquids"],["Conservation of mass","Mass is not created or destroyed in a change"]],
      tryit:"Mix a spoonful of baking soda into vinegar. List the clues you see. Physical or chemical?"}
  ],
  quiz:[
    ["Which of these is NOT matter?",["Air","Light","Water","A rock"],1,"Light has no mass and takes up no space, so it is energy, not matter."],
    ["A substance made of only one kind of atom is called a(n)…",["compound","mixture","element","molecule"],2,"An element contains only one kind of atom, like pure gold or oxygen."],
    ["In which state of matter do particles vibrate in place?",["Solid","Liquid","Gas","All of them equally"],0,"Solid particles are packed tightly and can only vibrate in place."],
    ["Water vapor turning into droplets on a cold window is called…",["evaporation","melting","freezing","condensation"],3,"Gas turning into liquid is condensation."],
    ["Which is a chemical change?",["Ice melting","Paper being torn","Wood burning","Sugar dissolving"],2,"Burning makes new substances like ash, smoke, and carbon dioxide."],
    ["Water (H₂O) is a compound because it…",["is a liquid","contains two different elements bonded together","has no mass","is found in the ocean"],1,"H₂O has hydrogen and oxygen atoms bonded together."],
    ["What does adding heat do to particles?",["Makes them move faster","Makes them stop","Makes them smaller","Removes them"],0,"More thermal energy means faster-moving particles."],
    ["At sea level, pure water boils at…",["0 °C","50 °C","100 °C","212 °C"],2,"Water boils at 100 °C, which equals 212 °F."]
  ],
  test:[
    ["Scientists organize the elements in the…",["food chain","periodic table","rock cycle","water cycle"],1,"The periodic table lists every known element."],
    ["Which statement about gases is true?",["They have a fixed shape","They have a fixed volume","They spread out to fill their container","Their particles do not move"],2,"Gas particles move freely and fill any container."],
    ["A liquid has…",["definite shape and definite volume","definite volume but no definite shape","no definite volume but definite shape","no definite shape or volume"],1,"A liquid keeps its volume but takes the shape of its container."],
    ["Which is a sign of a chemical change?",["A change in shape","A change in size","Bubbles of a new gas forming","Water freezing"],2,"A new gas being made is evidence of a new substance."],
    ["An iron nail rusts. This is a…",["physical change, because it's still iron","chemical change, because rust is a new substance","change of state","mixture"],1,"Rust (iron oxide) is a new substance made from iron and oxygen."],
    ["Two atoms of oxygen bonded together (O₂) form a…",["molecule","compound made of two elements","mixture","state of matter"],0,"O₂ is a molecule. It is not a compound because both atoms are the same element."],
    ["When water freezes, its particles…",["speed up","slow down and lock into place","disappear","turn into new atoms"],1,"Removing heat slows the particles until they lock into a solid."],
    ["A 50 g ice cube melts completely. What is the mass of the water?",["More than 50 g","Less than 50 g","Exactly 50 g","0 g"],2,"Mass is conserved. Only the state changed."],
    ["Mixing two clear liquids makes a cloudy solid appear. The solid is called a…",["precipitate","vapor","compound","solution"],0,"A solid that forms when liquids are mixed is a precipitate, a clue of chemical change."],
    ["Dissolving salt in water is a physical change because…",["it produces a gas","a new substance forms","the salt is still salt and can be recovered by evaporating the water","it gives off light"],2,"No new substance forms. Evaporate the water and the salt is left."],
    ["Which change of state happens when a puddle dries up on a sunny day?",["Condensation","Evaporation","Freezing","Melting"],1,"Liquid water turns into water vapor: evaporation."],
    ["Table salt is made from sodium and chlorine. This shows that a compound…",["always acts like its elements","can have very different properties from its elements","is only one element","cannot be eaten"],1,"Salt is safe to eat, even though sodium and chlorine alone are dangerous."]
  ]
},
{
  id:"motion", n:2, sym:"Fm", color:"--u2", name:"Energy, Forces, and Motion",
  blurb:"Kinds of energy, how heat moves, and how pushes and pulls change the way objects move.",
  lessons:[
    { t:"Forms of Energy",
      body:`<p><b>Energy</b> is the ability to do work or cause change. Energy comes in two main types:</p>
<ul><li><b>Kinetic energy</b> is energy of motion. A rolling ball and a flowing river have kinetic energy. The faster and heavier an object is, the more kinetic energy it has.</li>
<li><b>Potential energy</b> is stored energy. A book on a high shelf has gravitational potential energy. A stretched rubber band and a battery store energy too.</li></ul>
<p>Energy also has forms: thermal, electrical, light, sound, chemical, and mechanical. Energy can <b>transform</b> from one form to another. A flashlight changes chemical energy in batteries into electrical energy, then into light and heat. The <b>law of conservation of energy</b> says energy cannot be created or destroyed, only changed.</p>
<p>Thermal energy (heat) moves in three ways:</p>
<ul><li><b>Conduction:</b> through direct touch, like a metal spoon getting hot in soup</li>
<li><b>Convection:</b> through moving liquids or gases, like warm air rising in a room</li>
<li><b>Radiation:</b> through waves, like sunlight warming your face</li></ul>`,
      vocab:[["Kinetic energy","Energy of motion"],["Potential energy","Stored energy"],["Conduction","Heat moving by direct contact"],["Convection","Heat moving through currents in a liquid or gas"],["Radiation","Energy moving as waves, even through space"]],
      tryit:"Hold a ball high, then drop it. Where does it have the most potential energy? The most kinetic energy?"},
    { t:"Forces",
      body:`<p>A <b>force</b> is a push or a pull. Forces are measured in <b>newtons</b> (N). Every force has a size (strength) and a direction.</p>
<p>When forces on an object are <b>balanced</b>, they cancel out and the object's motion does not change. In a tug-of-war where both teams pull equally, the rope does not move. When forces are <b>unbalanced</b>, the object speeds up, slows down, or changes direction.</p>
<p>Two forces are everywhere:</p>
<ul><li><b>Gravity</b> pulls objects with mass toward each other. Earth's gravity pulls you down, and that pull is your <b>weight</b>.</li>
<li><b>Friction</b> acts between surfaces that touch, and it works against motion. Rough surfaces create more friction than smooth ones. Friction also creates heat, which is why rubbing your hands warms them.</li></ul>
<p><b>Mass</b> is the amount of matter in an object, and it stays the same everywhere. <b>Weight</b> depends on gravity, so you would weigh less on the Moon even though your mass is the same.</p>`,
      vocab:[["Force","A push or pull"],["Newton (N)","The unit used to measure force"],["Balanced forces","Forces that cancel; motion doesn't change"],["Friction","A force that resists motion between surfaces"],["Weight","The pull of gravity on an object's mass"]],
      tryit:"Slide a book across a carpet and across a smooth table. Where does it go farther? Why?"},
    { t:"Motion and Newton's Laws",
      body:`<p><b>Speed</b> tells how far something travels in a certain amount of time:</p>
<p style="font-family:var(--mono);font-size:18px;background:var(--soft);padding:10px 14px;border-radius:8px;display:inline-block">speed = distance ÷ time</p>
<p>A car that travels 120 km in 2 hours has a speed of 60 km/h. <b>Velocity</b> is speed in a given direction, and <b>acceleration</b> is any change in velocity: speeding up, slowing down, or turning.</p>
<p>Isaac Newton described three laws of motion:</p>
<ul><li><b>First law (inertia):</b> An object at rest stays at rest, and an object in motion keeps moving the same way, unless an unbalanced force acts on it. That's why you lurch forward when a car stops suddenly.</li>
<li><b>Second law:</b> The more force you apply, the more an object accelerates. A heavier object needs more force to accelerate the same amount (force = mass × acceleration).</li>
<li><b>Third law:</b> For every action there is an equal and opposite reaction. A rocket pushes gas down, and the gas pushes the rocket up.</li></ul>`,
      vocab:[["Speed","Distance divided by time"],["Velocity","Speed in a specific direction"],["Acceleration","A change in velocity"],["Inertia","An object's tendency to resist changes in motion"]],
      tryit:"Walk 20 meters and time yourself. Divide distance by time to find your speed in m/s."}
  ],
  quiz:[
    ["A rock sitting at the top of a hill has mostly…",["kinetic energy","potential energy","sound energy","no energy"],1,"It is not moving, but its height stores gravitational potential energy."],
    ["Force is measured in…",["meters","grams","newtons","degrees"],2,"The newton (N) is the unit of force."],
    ["A metal pan handle gets hot on the stove. This heat transfer is…",["conduction","convection","radiation","insulation"],0,"Heat moves through the metal by direct contact."],
    ["A bike travels 30 km in 2 hours. What is its speed?",["60 km/h","15 km/h","32 km/h","28 km/h"],1,"30 km ÷ 2 h = 15 km/h."],
    ["Which force slows a sliding hockey puck?",["Magnetism","Friction","Inertia","Radiation"],1,"Friction between the puck and the ice works against its motion."],
    ["When forces on an object are balanced, the object's motion…",["speeds up","slows down","does not change","changes direction"],2,"Balanced forces cancel out."],
    ["A rocket pushes gases down and moves up. This is Newton's…",["first law","second law","third law","law of gravity"],2,"Equal and opposite reaction: the third law."],
    ["The Sun warms Earth through…",["conduction","convection","radiation","friction"],2,"Energy travels through space as waves: radiation."]
  ],
  test:[
    ["Which has the most kinetic energy?",["A parked truck","A truck driving fast","A bowling ball on a shelf","A stretched rubber band"],1,"Kinetic energy depends on motion. The moving truck has mass and speed."],
    ["A flashlight changes chemical energy into…",["only sound","electrical energy, then light and heat","mass","potential energy only"],1,"Batteries (chemical) power a circuit (electrical), which makes light and some heat."],
    ["The law of conservation of energy says energy…",["can be created from nothing","is destroyed when used","cannot be created or destroyed, only changed","only exists as heat"],2,"Energy changes form, but the total stays the same."],
    ["Warm air rising and cool air sinking in a room is an example of…",["conduction","convection","radiation","friction"],1,"Heat is carried by moving currents of air: convection."],
    ["An astronaut's mass on the Moon compared to Earth is…",["less","more","the same","zero"],2,"Mass is the amount of matter and does not change. Weight changes."],
    ["Why do you lurch forward when a car brakes suddenly?",["Gravity","Inertia","Convection","Radiation"],1,"Your body keeps moving forward because of inertia (Newton's first law)."],
    ["Pushing an empty cart vs. a full cart with the same force: which accelerates more?",["The full cart","The empty cart","They accelerate the same","Neither moves"],1,"Less mass means more acceleration for the same force (Newton's second law)."],
    ["A runner goes 400 m in 80 seconds. What is her speed?",["5 m/s","320 m/s","480 m/s","0.2 m/s"],0,"400 m ÷ 80 s = 5 m/s."],
    ["Which of these is an acceleration?",["A car parked in a lot","A car moving at a steady 50 km/h in a straight line","A car turning a corner","A book resting on a table"],2,"Changing direction is a change in velocity, which is acceleration."],
    ["Rubbing your hands together makes them warm because…",["friction changes motion energy into heat","gravity increases","radiation from the Sun","your hands lose mass"],0,"Friction turns kinetic energy into thermal energy."],
    ["Two teams pull a rope with 500 N each in opposite directions. The rope…",["moves toward team 1","moves toward team 2","does not move because the forces are balanced","breaks immediately"],2,"Equal and opposite forces are balanced, so there is no change in motion."],
    ["Which object has potential energy stored in it?",["A charged battery","A rolling marble","A song playing","Sunlight"],0,"A battery stores chemical potential energy."]
  ]
},
{
  id:"earth", n:3, sym:"Es", color:"--u3", name:"Earth's Systems",
  blurb:"Rocks and how they change, the moving plates under our feet, and how water and weather cycle around the planet.",
  lessons:[
    { t:"Rocks and the Rock Cycle",
      body:`<p>Earth's rocks come in three main types, based on how they form:</p>
<ul><li><b>Igneous rock</b> forms when melted rock cools and hardens. Melted rock underground is <b>magma</b>; on the surface it's called <b>lava</b>. Granite and basalt are igneous. Obsidian cools so fast it looks like glass.</li>
<li><b>Sedimentary rock</b> forms when bits of rock, sand, shells, and mud (<b>sediment</b>) are pressed and cemented together in layers over a long time. Sandstone and limestone are sedimentary. Most <b>fossils</b> are found in sedimentary rock.</li>
<li><b>Metamorphic rock</b> forms when heat and pressure deep underground change an existing rock without melting it. Limestone can become marble, and shale can become slate.</li></ul>
<p>The <b>rock cycle</b> is the slow process that changes rocks from one type to another. <b>Weathering</b> breaks rock into pieces, <b>erosion</b> carries the pieces away by water, wind, or ice, and <b>deposition</b> drops them in new places. Any rock type can become any other type given enough time.</p>`,
      vocab:[["Igneous","Rock formed from cooled magma or lava"],["Sedimentary","Rock formed from pressed and cemented sediment"],["Metamorphic","Rock changed by heat and pressure"],["Weathering","Breaking rock into smaller pieces"],["Erosion","Moving sediment from one place to another"]],
      tryit:"Find a rock outside. Does it have layers (sedimentary), crystals (maybe igneous), or bands (maybe metamorphic)?"},
    { t:"Plate Tectonics",
      body:`<p>Earth has layers: a thin, rocky <b>crust</b>, a thick hot <b>mantle</b>, and a metal <b>core</b>. The crust and upper mantle are broken into giant pieces called <b>tectonic plates</b>. The plates float on softer mantle rock and move a few centimeters each year, about as fast as your fingernails grow.</p>
<p>The continents were once joined in one supercontinent, often called <b>Pangaea</b>. Evidence includes continents that fit like puzzle pieces (South America and Africa), matching fossils on different continents, and matching rock layers. Creation scientists say the continents split apart quickly during Noah's Flood, when "the fountains of the great deep burst open" (Genesis 7:11). Today the plates move only a few centimeters a year.</p>
<p>Plates meet at three kinds of <b>boundaries</b>:</p>
<ul><li><b>Convergent:</b> plates push together, forming mountains (like the Himalayas) or making one plate sink under another.</li>
<li><b>Divergent:</b> plates pull apart, and magma rises to make new crust, like the Mid-Atlantic Ridge.</li>
<li><b>Transform:</b> plates slide past each other, like the San Andreas Fault in California.</li></ul>
<p>Most <b>earthquakes</b> and <b>volcanoes</b> happen near plate boundaries.</p>`,
      vocab:[["Crust","Earth's thin, outer rocky layer"],["Mantle","The thick, hot layer below the crust"],["Tectonic plate","A giant moving piece of Earth's surface"],["Pangaea","The supercontinent formed when all continents were joined"],["Fault","A crack in the crust where rocks move"]],
      tryit:"Look at a world map. Can you see how South America's east coast fits Africa's west coast?"},
    { t:"The Water Cycle and Weather",
      body:`<p>Earth's water moves in a never-ending loop called the <b>water cycle</b>. The <b>Sun</b> provides the energy that drives it.</p>
<ul><li><b>Evaporation:</b> the Sun heats water in oceans, lakes, and rivers, turning it into water vapor.</li>
<li><b>Transpiration:</b> plants release water vapor through their leaves.</li>
<li><b>Condensation:</b> water vapor cools high in the air and forms tiny droplets, which make clouds.</li>
<li><b>Precipitation:</b> droplets join, get heavy, and fall as rain, snow, sleet, or hail.</li>
<li><b>Collection (runoff):</b> water gathers in oceans, lakes, rivers, and underground as groundwater.</li></ul>
<p>About 97% of Earth's water is salt water in the oceans. Only a small part is fresh water we can use.</p>
<p><b>Weather</b> is what the atmosphere is like at a certain place and time: temperature, wind, clouds, and precipitation today. <b>Climate</b> is the average weather of a place over many years (usually 30 or more). "It's snowing today" is weather; "Indiana has cold winters" is climate. Weather is measured with tools like a thermometer (temperature), barometer (air pressure), and rain gauge (precipitation).</p>`,
      vocab:[["Evaporation","Liquid water turning into water vapor"],["Condensation","Water vapor cooling into droplets"],["Precipitation","Water falling from clouds"],["Weather","Atmosphere conditions at a place and time"],["Climate","Average weather over many years"]],
      tryit:"Check the forecast for 5 days and write down the high temperatures. That's weather. How would you find the climate?"}

{
  id:"space", n:4, sym:"Sp", color:"--u4", name:"Earth in Space",
  blurb:"Our solar system, why we have day and night, seasons, and Moon phases, and how gravity holds it all together.",
  lessons:[
    { t:"The Solar System",
      body:`<p>Our <b>solar system</b> is the Sun and everything that orbits it: 8 planets, their moons, dwarf planets like Pluto, asteroids, and comets.</p>
<p>The <b>Sun</b> is a star, a giant ball of hot gas that makes its own light and heat. It holds more than 99% of the solar system's mass. It looks bigger and brighter than other stars only because it is much closer.</p>
<p>In order from the Sun, the planets are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. (Memory trick: "My Very Educated Mother Just Served Us Nachos.")</p>
<ul><li>The four <b>inner planets</b> (Mercury to Mars) are small and rocky.</li>
<li>The four <b>outer planets</b> are giants. Jupiter and Saturn are <b>gas giants</b>; Uranus and Neptune are <b>ice giants</b>. All four have rings.</li></ul>
<p>An <b>asteroid belt</b> lies between Mars and Jupiter. Jupiter is the largest planet. Venus is the hottest, because its thick atmosphere traps heat.</p>`,
      vocab:[["Star","A ball of hot gas that makes its own light"],["Planet","A large body that orbits a star"],["Orbit","The curved path of one object around another"],["Asteroid","A rocky object orbiting the Sun, smaller than a planet"],["Comet","An icy object that grows a glowing tail near the Sun"]],
      tryit:"Say the planets in order using the memory trick, then try it without looking."},
    { t:"Earth, Moon, and Sun",
      body:`<p>Earth spins on its <b>axis</b>, an imaginary line through the North and South Poles. One full spin, a <b>rotation</b>, takes about 24 hours and causes <b>day and night</b>. The side facing the Sun has day.</p>
<p>Earth also travels around the Sun. One full trip, a <b>revolution</b>, takes about 365¼ days, or one year.</p>
<p><b>Seasons</b> happen because Earth's axis is <b>tilted</b> about 23.5°. When the Northern Hemisphere tilts toward the Sun, it gets more direct sunlight and longer days, so it has summer. When it tilts away, it has winter. Seasons are <i>not</i> caused by Earth being closer to the Sun; Earth is actually closest to the Sun in early January.</p>
<p>The Moon orbits Earth about every 29.5 days. It doesn't make its own light; it reflects sunlight. As it orbits, we see different amounts of its lit half. These are the <b>phases</b>: new moon, waxing crescent, first quarter, waxing gibbous, full moon, waning gibbous, third quarter, waning crescent.</p>
<p>An <b>eclipse</b> happens when one body blocks sunlight from another. In a <b>solar eclipse</b>, the Moon passes between the Sun and Earth. In a <b>lunar eclipse</b>, Earth passes between the Sun and Moon.</p>`,
      vocab:[["Rotation","One spin on an axis (about 24 hours for Earth)"],["Revolution","One trip around the Sun (about 365 days)"],["Axis","Imaginary line an object spins around"],["Phase","The shape of the Moon's lit part we see from Earth"],["Eclipse","When one object blocks light from reaching another"]],
      tryit:"Look at the Moon each night for a week and sketch its shape. Is it waxing (growing) or waning (shrinking)?"},
    { t:"Gravity and Scale",
      body:`<p><b>Gravity</b> is the force of attraction between objects with mass. Two things change how strong it is:</p>
<ul><li><b>Mass:</b> more mass means stronger gravity. The Sun's huge mass holds all the planets in orbit.</li>
<li><b>Distance:</b> the farther apart objects are, the weaker the pull.</li></ul>
<p>Gravity keeps the Moon orbiting Earth and Earth orbiting the Sun. The Moon's gravity also pulls on Earth's oceans, causing <b>tides</b>.</p>
<p>Space is enormous. Distances inside the solar system are often measured in <b>astronomical units</b> (AU); 1 AU is the average distance from Earth to the Sun, about 150 million km. Distances to stars are measured in <b>light-years</b>, the distance light travels in one year (about 9.5 trillion km). The nearest star after the Sun, Proxima Centauri, is about 4.2 light-years away.</p>
<p>Our Sun is one of hundreds of billions of stars in the <b>Milky Way galaxy</b>, and the Milky Way is one of billions of galaxies in the universe.</p>`,
      vocab:[["Gravity","Force of attraction between objects with mass"],["Tide","Rise and fall of ocean water caused mostly by the Moon"],["Astronomical unit","Average Earth–Sun distance, about 150 million km"],["Light-year","Distance light travels in one year"],["Galaxy","A huge system of billions of stars"]],
      tryit:"If the Sun were a basketball, Earth would be a peppercorn about 26 meters away. Pace that out!"}
  ],
  quiz:[
    ["What causes day and night?",["Earth's revolution around the Sun","Earth's rotation on its axis","The Moon blocking the Sun","Clouds"],1,"Earth spins once about every 24 hours, so each side faces the Sun, then away."],
    ["How long does it take Earth to revolve around the Sun?",["24 hours","29.5 days","About 365 days","10 years"],2,"One revolution is one year."],
    ["The Sun is a…",["planet","star","moon","comet"],1,"The Sun is a star, the closest one to Earth."],
    ["Which planet is the largest?",["Earth","Saturn","Jupiter","Neptune"],2,"Jupiter is the biggest planet in the solar system."],
    ["The Moon shines because it…",["makes its own light","reflects sunlight","is on fire","reflects Earth's light only"],1,"The Moon reflects light from the Sun."],
    ["What causes Earth's seasons?",["Distance from the Sun","The tilt of Earth's axis","The Moon's phases","Ocean currents"],1,"The 23.5° tilt changes how directly sunlight hits each hemisphere."],
    ["Which are the inner, rocky planets?",["Jupiter, Saturn, Uranus, Neptune","Mercury, Venus, Earth, Mars","Earth, Moon, Sun, Mars","Mars, Jupiter, Saturn, Pluto"],1,"The four planets closest to the Sun are small and rocky."],
    ["What force keeps the planets in orbit around the Sun?",["Friction","Magnetism","Gravity","Wind"],2,"The Sun's gravity pulls on the planets and holds them in orbit."]

  test:[

    ["It is summer in Indiana when…",["Earth is closest to the Sun","the Northern Hemisphere is tilted toward the Sun","the Moon is full","Earth stops rotating"],1,"Tilting toward the Sun means more direct light and longer days."],
    ["About how long does the Moon take to go through all its phases?",["1 day","7 days","29.5 days","365 days"],2,"A full cycle of phases takes about 29.5 days."],
    ["Gravity between two objects gets weaker when…",["they get closer","their mass increases","they move farther apart","they start spinning"],2,"More distance means weaker gravity."],
    ["The Moon's gravity is the main cause of…",["seasons","ocean tides","day and night","earthquakes"],1,"The Moon pulls on Earth's oceans, creating tides."],

    ["Where is the asteroid belt?",["Between Earth and Mars","Between Mars and Jupiter","Beyond Neptune","Around the Moon"],1,"Most asteroids orbit between Mars and Jupiter."],
    ["Why does the Sun look bigger and brighter than other stars?",["It is the biggest star in the universe","It is much closer to us","It is the only star that makes light","Other stars are turned off in the day"],1,"The Sun is an average-sized star; it looks big because it's close."],
    ["Our solar system is part of which galaxy?",["Andromeda","The Milky Way","Proxima","Orion"],1,"The Sun is one of hundreds of billions of stars in the Milky Way."],
    ["Which planet is hottest?",["Mercury","Venus","Mars","Jupiter"],1,"Venus's thick atmosphere traps heat, making it hotter than Mercury."],
    ["During a lunar eclipse…",["the Moon blocks the Sun","Earth's shadow falls on the Moon","the Sun passes between Earth and Moon","the Moon makes its own light"],1,"Earth sits between the Sun and Moon, casting its shadow on the Moon."],
    ["Jupiter and Saturn are called…",["rocky planets","ice giants","gas giants","dwarf planets"],2,"They are made mostly of hydrogen and helium gas."]

},
{
  id:"life", n:5, sym:"Lf", color:"--u5", name:"Cells to Ecosystems",
  blurb:"Cells as the building blocks of life, how bodies are organized, and how energy flows through ecosystems.",
  lessons:[
    { t:"Cells: Building Blocks of Life",
      body:`<p>Every living thing is made of one or more <b>cells</b>. Some organisms, like bacteria, are just one cell. You are made of trillions. Most cells are too small to see without a <b>microscope</b>.</p>
<p>The <b>cell theory</b> says:</p>
<ul><li>All living things are made of cells.</li><li>The cell is the basic unit of life.</li><li>All cells come from other cells.</li></ul>
<p>Parts inside a cell are called <b>organelles</b>. Each has a job:</p>
<ul><li><b>Cell membrane:</b> a thin layer that controls what enters and leaves the cell</li>
<li><b>Nucleus:</b> the control center; holds DNA, the cell's instructions</li>
<li><b>Cytoplasm:</b> the jelly-like fluid that holds the organelles</li>
<li><b>Mitochondria:</b> the "powerhouses" that release energy from food</li></ul>
<p><b>Plant cells</b> have two extra parts: a stiff <b>cell wall</b> for support, and <b>chloroplasts</b>, which capture sunlight to make food by photosynthesis. Plant cells also have a large <b>vacuole</b> that stores water.</p>`,
      vocab:[["Cell","The basic unit of all living things"],["Nucleus","Control center of the cell; holds DNA"],["Cell membrane","Controls what goes in and out of the cell"],["Mitochondria","Release energy from food"],["Chloroplast","Captures sunlight to make food (plants only)"]],
      tryit:"Draw a plant cell and an animal cell side by side. Label the two parts only the plant cell has."},
    { t:"Levels of Organization",
      body:`<p>In many-celled organisms, cells are organized into levels, from smallest to largest:</p>
<p style="font-family:var(--mono);font-size:16px;background:var(--soft);padding:10px 14px;border-radius:8px">cells → tissues → organs → organ systems → organism</p>
<ul><li>A <b>tissue</b> is a group of similar cells doing the same job, like muscle tissue.</li>
<li>An <b>organ</b> is made of different tissues working together, like the heart or stomach.</li>
<li>An <b>organ system</b> is a group of organs that work together, like the digestive system.</li></ul>
<p>Some important human body systems:</p>
<ul><li><b>Circulatory:</b> the heart pumps blood through blood vessels, carrying oxygen and nutrients.</li>
<li><b>Respiratory:</b> the lungs take in oxygen and release carbon dioxide.</li>
<li><b>Digestive:</b> breaks food into nutrients the body can use.</li>
<li><b>Skeletal and muscular:</b> support the body and let it move.</li>
<li><b>Nervous:</b> the brain, spinal cord, and nerves send signals and control the body.</li></ul>
<p>Body systems work together. When you exercise, your respiratory system takes in more oxygen and your circulatory system pumps it faster to your muscles.</p>`,
      vocab:[["Tissue","A group of similar cells doing one job"],["Organ","Different tissues working together"],["Organ system","Organs working together for a major function"],["Organism","A whole living thing"]],
      tryit:"Count your pulse for 15 seconds, then multiply by 4. Do 20 jumping jacks and count again. Which systems changed?"},
    { t:"Ecosystems and Energy Flow",
      body:`<p>An <b>ecosystem</b> is all the living things in an area plus the nonliving things around them, like water, soil, sunlight, and air.</p>
<p>Living things play different roles:</p>
<ul><li><b>Producers</b> (plants, algae) make their own food by <b>photosynthesis</b>, using sunlight, water, and carbon dioxide to make sugar and release oxygen.</li>
<li><b>Consumers</b> eat other living things. <b>Herbivores</b> eat plants, <b>carnivores</b> eat animals, and <b>omnivores</b> eat both.</li>
<li><b>Decomposers</b> (fungi, bacteria) break down dead matter and return nutrients to the soil.</li></ul>
<p>A <b>food chain</b> shows one path of energy: grass → grasshopper → frog → snake → hawk. Arrows point in the direction energy flows. A <b>food web</b> is many connected food chains.</p>
<p>Almost all energy in an ecosystem starts with the <b>Sun</b>. Only about <b>10%</b> of the energy at one level passes to the next; the rest is used for living or lost as heat. That's why there are fewer top predators than plants.</p>`,
      vocab:[["Ecosystem","Living and nonliving things interacting in an area"],["Producer","Makes its own food from sunlight"],["Consumer","Gets energy by eating other organisms"],["Decomposer","Breaks down dead matter"],["Photosynthesis","Plants use sunlight, water, and CO₂ to make sugar and oxygen"]],
      tryit:"Build a food chain from your backyard or a park, starting with a producer and ending with a top predator."}
  ],
  quiz:[
    ["What is the basic unit of all living things?",["Atom","Cell","Organ","Tissue"],1,"The cell is the basic unit of life."],
    ["Which organelle is the cell's control center?",["Cell membrane","Nucleus","Mitochondria","Vacuole"],1,"The nucleus holds DNA and directs the cell."],
    ["Which part is found in plant cells but NOT animal cells?",["Nucleus","Cell membrane","Chloroplast","Mitochondria"],2,"Chloroplasts (and cell walls) are only in plant cells."],
    ["Which order is correct, from smallest to largest?",["Organ → tissue → cell","Cell → tissue → organ → organ system","Tissue → cell → organ","Organism → organ → cell"],1,"Cells form tissues, tissues form organs, organs form systems."],
    ["The heart is part of which system?",["Digestive","Respiratory","Circulatory","Nervous"],2,"The heart pumps blood through the circulatory system."],
    ["Organisms that make their own food from sunlight are…",["consumers","decomposers","producers","carnivores"],2,"Producers like plants use photosynthesis."],
    ["Mushrooms breaking down a fallen log are…",["producers","decomposers","herbivores","carnivores"],1,"Fungi are decomposers that recycle nutrients."],
    ["In a food chain, arrows point…",["from the eater to the eaten","in the direction energy flows","toward the Sun","randomly"],1,"Arrows show energy moving from food to the organism that eats it."]
  ],
  test:[
    ["Which is part of the cell theory?",["All cells come from other cells","Cells are only found in animals","Cells can form from nonliving matter","All cells are the same size"],0,"Cells come only from existing cells."],
    ["Which organelle releases energy from food?",["Nucleus","Mitochondria","Chloroplast","Cell wall"],1,"Mitochondria are the cell's powerhouses."],
    ["What does the cell membrane do?",["Makes food","Stores DNA","Controls what enters and leaves the cell","Gives plants their green color"],2,"The membrane is the cell's gatekeeper."],
    ["A group of similar cells that work together is a(n)…",["organ","tissue","organ system","organism"],1,"Similar cells doing one job form a tissue."],
    ["Which system takes in oxygen and releases carbon dioxide?",["Respiratory","Digestive","Skeletal","Circulatory"],0,"The lungs are the main organs of the respiratory system."],
    ["When you exercise, your heart beats faster to…",["digest food faster","deliver more oxygen to muscles","grow more bones","make you sleepy"],1,"The circulatory and respiratory systems work together to supply oxygen."],
    ["What are the ingredients of photosynthesis?",["Oxygen and sugar","Sunlight, water, and carbon dioxide","Soil and oxygen","Meat and water"],1,"Plants use sunlight, water, and CO₂ to make sugar and release oxygen."],
    ["A bear eats berries and fish. It is a(n)…",["herbivore","carnivore","omnivore","producer"],2,"Eating both plants and animals makes it an omnivore."],
    ["In grass → rabbit → fox, the rabbit is a…",["producer","herbivore (primary consumer)","decomposer","top predator"],1,"The rabbit eats the producer, so it's a primary consumer."],
    ["About how much energy passes from one level of a food chain to the next?",["100%","50%","10%","0%"],2,"About 10% passes on; the rest is used or lost as heat."],
    ["Which is a NONLIVING part of an ecosystem?",["Bacteria","Sunlight","Grass","Deer"],1,"Sunlight, water, soil, and air are nonliving parts."],
    ["Where does almost all energy in an ecosystem come from?",["The soil","The Sun","Decomposers","Water"],1,"Producers capture the Sun's energy, which then flows through the food web."]
  ]
}

UNITS.push(
{
  id:"weather", n:6, sym:"Wx", color:"--u7", name:"Weather and Climate", set:2,
  blurb:"The layers of air above us, why weather changes when air masses collide, and what controls the climate of a place.",
  lessons:[
    { t:"The Atmosphere and Air Pressure",
      body:`<p>The <b>atmosphere</b> is the blanket of gases around Earth. It is about 78% nitrogen, 21% oxygen, and 1% other gases, including argon, carbon dioxide, and water vapor. Gravity holds it in place. Without it, there would be no air to breathe, no weather, and no protection from the Sun's harmful ultraviolet (UV) rays.</p>
<p>Scientists divide the atmosphere into layers based on how temperature changes with height:</p>
<ul><li><b>Troposphere</b> (ground to about 12 km): where we live and where almost all weather happens. Temperature <i>drops</i> as you go up, which is why mountaintops are cold.</li>
<li><b>Stratosphere</b> (about 12–50 km): contains the <b>ozone layer</b>, which absorbs most UV radiation. Because ozone absorbs energy, temperature <i>rises</i> with height here. Jets often fly near its bottom to avoid storms.</li>
<li><b>Mesosphere</b> (about 50–85 km): the coldest layer, below −90 °C at the top. Most meteors burn up here.</li>
<li><b>Thermosphere</b> (about 85–600 km): very thin air that can reach over 1,000 °C. Auroras glow here, and the International Space Station orbits in it.</li></ul>
<p><b>Air pressure</b> is the weight of the air pushing down on a surface. At sea level, a column of air presses with about 101 kilopascals (14.7 pounds on every square inch). As you climb higher, there is less air above you, so air pressure <i>decreases</i>. That's why your ears pop in an airplane. Air pressure is measured with a <b>barometer</b>. Falling pressure usually means clouds and storms are coming; rising pressure usually means clear, calm weather.</p>`,
      vocab:[["Atmosphere","The layer of gases surrounding Earth"],["Troposphere","Lowest layer, where weather happens"],["Stratosphere","Layer containing the ozone layer"],["Ozone layer","Gas layer that absorbs harmful UV rays"],["Air pressure","The force of air pressing down on a surface"],["Barometer","Instrument that measures air pressure"]],
      tryit:"Seal an empty plastic bottle at the top of a tall hill or on a plane, then open it at the bottom. Why is it crushed?"},
    { t:"Air Masses, Fronts, and Storms",
      body:`<p>An <b>air mass</b> is a huge body of air, sometimes thousands of kilometers wide, with about the same temperature and humidity throughout. Air masses take on the traits of where they form:</p>
<ul><li><b>Maritime</b> (over oceans): moist. <b>Continental</b> (over land): dry.</li>
<li><b>Tropical</b> (near the equator): warm. <b>Polar</b> (near the poles): cold.</li></ul>
<p>So a <i>maritime tropical</i> air mass from the Gulf of Mexico is warm and humid, while a <i>continental polar</i> air mass from Canada is cold and dry.</p>
<p>When two air masses meet, they don't mix easily. The boundary between them is called a <b>front</b>, and that is where weather changes:</p>
<ul><li><b>Cold front:</b> cold, dense air pushes under warm air and shoves it up fast. Expect tall clouds, heavy rain or thunderstorms, then cooler, clearer weather. Shown on maps as a blue line with triangles.</li>
<li><b>Warm front:</b> warm air slides up and over cold air gently. Expect layered clouds and long, steady rain or drizzle, then warmer weather. Shown as a red line with half circles.</li>
<li><b>Stationary front:</b> neither air mass moves much, so the same cloudy, wet weather can last for days.</li></ul>
<p>Severe storms form when warm, moist air rises quickly. <b>Thunderstorms</b> bring lightning and heavy rain. <b>Tornadoes</b> are spinning columns of air reaching from a storm cloud to the ground; Indiana is in an area that sees many of them in spring. <b>Hurricanes</b> are giant spinning storms that form over warm ocean water (at least about 26 °C) and lose strength over land.</p>`,
      vocab:[["Air mass","Large body of air with similar temperature and humidity"],["Front","Boundary where two air masses meet"],["Cold front","Cold air pushes under warm air; quick storms"],["Warm front","Warm air rises over cold air; steady rain"],["Humidity","Amount of water vapor in the air"],["Hurricane","Huge spinning storm that forms over warm ocean water"]],
      tryit:"Find today's weather map online. Can you spot a front? What weather is happening near it?"},
    { t:"What Controls Climate",
      body:`<p>Remember: <b>weather</b> is what's happening now; <b>climate</b> is the average pattern over 30 years or more. Several factors control a place's climate:</p>
<ul><li><b>Latitude</b> (distance from the equator): Near the equator, sunlight hits the ground almost straight on, concentrating energy, so it's warm all year. Near the poles, sunlight arrives at a low slant and spreads over more area, so it stays cold. This creates three broad zones: <b>tropical</b>, <b>temperate</b> (where Indiana is), and <b>polar</b>.</li>
<li><b>Elevation:</b> Temperature drops about 6.5 °C for every 1,000 m you climb. That's why Mount Kilimanjaro, near the equator, has snow on top.</li>
<li><b>Nearness to water:</b> Water heats and cools slowly. Coastal places have milder summers and winters than places in the middle of a continent.</li>
<li><b>Ocean currents:</b> Currents carry heat around the globe. The warm Gulf Stream helps keep Western Europe milder than other places at the same latitude.</li>
<li><b>Mountains:</b> When moist air rises over a mountain, it cools and drops rain on that side. The far side, called the <b>rain shadow</b>, is often a desert.</li></ul>
<p><b>Prevailing winds</b>, winds that usually blow from one direction, also matter. In the United States, weather mostly moves from west to east, so a storm in Illinois today might reach Indiana tomorrow.</p>`,
      vocab:[["Climate","Average weather of a place over many years"],["Latitude","Distance north or south of the equator"],["Elevation","Height above sea level"],["Ocean current","A steady flow of ocean water that moves heat"],["Rain shadow","Dry area on the far side of a mountain"],["Prevailing winds","Winds that usually blow from one direction"]],
      tryit:"Compare today's temperature in Indianapolis, Miami, and Anchorage. Which climate factors explain the difference?"}
  ],

{
  id:"elec", n:7, sym:"Em", color:"--u8", name:"Electricity and Magnetism", set:2,
  blurb:"Charges and circuits, invisible magnetic fields, and how electricity and magnetism work together in motors and generators.",
  lessons:[
    { t:"Charges and Circuits",
      body:`<p>Atoms contain tiny particles with <b>electric charge</b>: positive <b>protons</b> and negative <b>electrons</b>. Like charges repel (push apart) and opposite charges attract. When you rub a balloon on your hair, electrons move from your hair to the balloon. The balloon becomes negative, your hair becomes positive, and they attract. This build-up of charge is <b>static electricity</b>. A lightning bolt is a giant static discharge.</p>
<p><b>Current electricity</b> is a steady flow of electrons through a path called a <b>circuit</b>. Every circuit needs:</p>
<ul><li>an <b>energy source</b>, like a battery, that pushes the electrons (this push is <b>voltage</b>, measured in volts)</li>
<li>a <b>conductor</b>, like copper wire, for the electrons to flow through</li>
<li>a <b>load</b>, something that uses the energy, like a bulb or motor</li>
<li>usually a <b>switch</b> to open or close the path</li></ul>
<p>A <b>closed circuit</b> is a complete loop, so current flows. An <b>open circuit</b> has a gap, so nothing flows. <b>Conductors</b> (most metals, salt water) let charges flow easily. <b>Insulators</b> (rubber, plastic, glass, dry wood) resist the flow, which is why wires are coated in plastic.</p>
<p>There are two ways to connect parts:</p>
<ul><li><b>Series circuit:</b> one single path. If one bulb burns out, the path is broken and <i>all</i> bulbs go dark. Adding bulbs makes each one dimmer.</li>
<li><b>Parallel circuit:</b> several separate paths. If one bulb burns out, the others stay lit. Your home is wired in parallel, so turning off the kitchen light doesn't turn off the TV.</li></ul>`,
      vocab:[["Static electricity","A build-up of electric charge on an object"],["Circuit","A closed path that electric current flows through"],["Conductor","Material that lets electricity flow easily"],["Insulator","Material that resists the flow of electricity"],["Series circuit","Circuit with only one path for current"],["Parallel circuit","Circuit with more than one path for current"]],
      tryit:"Rub a balloon on your hair, then hold it near small bits of paper or a thin stream of tap water. What happens?"},
    { t:"Magnets and Magnetic Fields",
      body:`<p>Every magnet has two ends called <b>poles</b>: a north pole and a south pole. Like poles repel and opposite poles attract, just like electric charges. If you cut a magnet in half, you don't get a separate north and south piece. You get two smaller magnets, each with both poles.</p>
<p>The area around a magnet where its force acts is its <b>magnetic field</b>. You can't see it, but iron filings sprinkled near a magnet line up along curved <b>field lines</b>. The lines run from the north pole around to the south pole and are closest together near the poles, where the force is strongest.</p>
<p>Only some materials are attracted to magnets. Iron, nickel, and cobalt are <b>magnetic</b>. Most other metals, like aluminum, copper, and gold, are not. That's why a magnet can pull steel cans (which contain iron) out of recycling but not aluminum soda cans.</p>
<p>Earth itself acts like a giant magnet because of moving liquid iron in its outer core. A <b>compass</b> needle is a small magnet that lines up with Earth's magnetic field, so it points north. Earth's magnetic field also protects us by steering harmful charged particles from the Sun toward the poles, where they create the glowing <b>auroras</b> (northern and southern lights).</p>`,
      vocab:[["Magnetic pole","An end of a magnet where its force is strongest"],["Magnetic field","The area around a magnet where its force acts"],["Repel","To push apart"],["Attract","To pull together"],["Compass","A tool with a magnetic needle that points north"]],
      tryit:"Test 10 objects around the house with a fridge magnet. Sort them into magnetic and not magnetic. Were any metals not magnetic?"},
    { t:"Electromagnets, Motors, and Generators",
      body:`<p>In 1820, Hans Christian Ørsted noticed that a wire carrying electric current made a nearby compass needle move. This showed that <b>electric current creates a magnetic field</b>. This connection between electricity and magnetism is called <b>electromagnetism</b>.</p>
<p>An <b>electromagnet</b> is made by wrapping a coil of wire around an iron core and running current through it. Unlike a regular magnet, it can be turned on and off. You can make it stronger by:</p>
<ul><li>adding more <b>coils</b> (turns) of wire</li>
<li>increasing the <b>current</b> (for example, adding another battery)</li>
<li>using an <b>iron core</b> inside the coil</li></ul>
<p>Junkyard cranes use giant electromagnets to lift cars, then drop them by switching off the current. Doorbells, speakers, and MRI machines all use electromagnets.</p>
<p>An <b>electric motor</b> uses electromagnets to turn electrical energy into motion (mechanical energy). Motors run fans, blenders, and electric cars.</p>
<p>A <b>generator</b> does the reverse: moving a magnet near a coil of wire (or spinning a coil near a magnet) <i>creates</i> an electric current. This turns mechanical energy into electrical energy. Almost all of the electricity in your home comes from generators spun by steam, wind, or falling water.</p>`,
      vocab:[["Electromagnetism","The relationship between electricity and magnetism"],["Electromagnet","A coil of wire that becomes a magnet when current flows"],["Electric motor","Device that changes electrical energy into motion"],["Generator","Device that changes motion into electrical energy"],["Coil","Wire wrapped in loops"]],
      tryit:"Ask a grown-up to help you wrap insulated wire around a steel nail and connect it to a D battery for a few seconds. How many paper clips can it lift?"}
  ],

{
  id:"waves", n:8, sym:"Wv", color:"--u9", name:"Waves: Sound and Light", set:2,
  blurb:"How waves carry energy, why some sounds are high and others loud, and how light reflects, bends, and makes color.",
  lessons:[
    { t:"Wave Properties",
      body:`<p>A <b>wave</b> is a disturbance that carries <b>energy</b> from one place to another without carrying matter along with it. When a wave passes through a pond, the water mostly bobs up and down in place while the energy moves outward.</p>
<p>There are two main kinds of waves:</p>
<ul><li><b>Transverse waves:</b> the material moves at right angles (up and down) to the direction the wave travels, like shaking a rope. Light behaves like a transverse wave.</li>
<li><b>Longitudinal waves</b> (compression waves): the material moves back and forth in the <i>same</i> direction the wave travels, like pushing a Slinky. Sound is a longitudinal wave.</li></ul>
<p>All waves can be described with these properties:</p>
<ul><li><b>Crest</b> and <b>trough</b>: the highest and lowest points of a transverse wave.</li>
<li><b>Amplitude</b>: how far the wave rises from its resting position. Bigger amplitude means <b>more energy</b>.</li>
<li><b>Wavelength</b>: the distance from one crest to the next.</li>
<li><b>Frequency</b>: how many waves pass a point each second, measured in <b>hertz (Hz)</b>. 5 waves per second = 5 Hz.</li></ul>
<p>For a wave moving at a steady speed, frequency and wavelength are linked: when frequency goes <b>up</b>, wavelength gets <b>shorter</b>. Waves that need a material to travel through, like sound and water waves, are called <b>mechanical waves</b>. That material is called a <b>medium</b>.</p>`,
      vocab:[["Wave","A disturbance that carries energy"],["Amplitude","Height of a wave from rest; shows energy"],["Wavelength","Distance from one crest to the next"],["Frequency","Number of waves per second, in hertz"],["Transverse wave","Matter moves at right angles to the wave's direction"],["Longitudinal wave","Matter moves back and forth along the wave's direction"]],
      tryit:"Tie one end of a jump rope to a chair and shake the other end slowly, then quickly. What happens to the wavelength?"},
    { t:"Sound",
      body:`<p><b>Sound</b> is a longitudinal wave made by <b>vibrations</b>. When a guitar string vibrates, it pushes air molecules together (<b>compressions</b>) and lets them spread apart (<b>rarefactions</b>). These pulses travel to your ear, where your eardrum vibrates and your brain hears sound.</p>
<p>Sound needs a <b>medium</b>. It cannot travel through empty space, so space is silent. Sound also travels at different speeds in different materials:</p>
<ul><li>Air: about 343 meters per second</li><li>Water: about 1,480 m/s</li><li>Steel: about 5,900 m/s</li></ul>
<p>Sound moves fastest in solids because the particles are packed close together.</p>
<p>Two properties describe what we hear:</p>
<ul><li><b>Pitch</b> is how high or low a sound is. It depends on <b>frequency</b>. A fast vibration (high frequency) makes a high pitch, like a whistle. A slow vibration makes a low pitch, like a tuba. Humans can hear from about 20 Hz to 20,000 Hz. Dogs can hear higher frequencies than we can.</li>
<li><b>Loudness</b> depends on <b>amplitude</b>. Bigger vibrations carry more energy and sound louder. Loudness is measured in <b>decibels (dB)</b>. A whisper is about 30 dB, a conversation about 60 dB, and sounds above about 85 dB can damage hearing over time.</li></ul>
<p>An <b>echo</b> is sound that reflects off a surface and comes back. Bats and dolphins use echoes to find food, which is called <b>echolocation</b>.</p>`,
      vocab:[["Vibration","A quick back-and-forth motion"],["Medium","The material a wave travels through"],["Pitch","How high or low a sound is"],["Decibel (dB)","Unit for measuring loudness"],["Echo","A reflected sound"],["Echolocation","Using echoes to locate objects"]],
      tryit:"Stretch a rubber band over an open box and pluck it. Then stretch it tighter. What happens to the pitch?"},
    { t:"Light and Color",
      body:`<p>Light is a kind of <b>electromagnetic wave</b>. Unlike sound, it does <b>not</b> need a medium, so it can cross empty space. That's how sunlight reaches us. Light is also the fastest thing in the universe: about 300,000 kilometers per second.</p>
<p>The light we see is only a small part of the <b>electromagnetic spectrum</b>. From longest wavelength (lowest energy) to shortest (highest energy): radio waves, microwaves, infrared, <b>visible light</b>, ultraviolet, X-rays, and gamma rays.</p>
<p>When light hits an object, three things can happen:</p>
<ul><li><b>Reflection:</b> light bounces off. Mirrors reflect light so well that you see an image.</li>
<li><b>Refraction:</b> light bends when it passes from one material into another, because it changes speed. A straw in a glass of water looks broken because of refraction. Lenses in glasses and cameras use refraction to focus light.</li>
<li><b>Absorption:</b> the material takes in the light's energy, often warming up.</li></ul>
<p>Materials can be <b>transparent</b> (light passes through, like clear glass), <b>translucent</b> (some light passes through but scatters, like wax paper), or <b>opaque</b> (no light passes through, like wood).</p>
<p>White light is a mix of all colors. A <b>prism</b> refracts each color a different amount and spreads them into a rainbow: red, orange, yellow, green, blue, indigo, violet. An object's color is the color it <b>reflects</b>. A red apple absorbs the other colors and reflects red. Black objects absorb almost all colors, which is why they get hot in the sun.</p>`,
      vocab:[["Electromagnetic spectrum","The full range of light waves, from radio to gamma"],["Reflection","Light bouncing off a surface"],["Refraction","Light bending as it passes into a new material"],["Transparent","Lets light pass straight through"],["Opaque","Blocks all light"],["Prism","A clear object that splits white light into colors"]],
      tryit:"Put a pencil in a clear glass of water and look from the side. Draw what you see and explain it using refraction."}
  ],

    ["10 waves pass a buoy in 2 seconds. What is the frequency?",["2 Hz","5 Hz","10 Hz","20 Hz"],1,"10 waves ÷ 2 seconds = 5 waves per second = 5 Hz."],
    ["If a wave's frequency increases (same speed), its wavelength…",["gets longer","gets shorter","stays the same","disappears"],1,"Higher frequency means shorter wavelength."],

    ["You tighten a guitar string. The pitch gets higher because…",["the string vibrates faster","the string vibrates slower","the amplitude gets smaller","the sound gets quieter"],0,"Faster vibration = higher frequency = higher pitch."],
    ["Which sound is most likely to damage hearing over time?",["A whisper at 30 dB","A conversation at 60 dB","A loud concert at 110 dB","Leaves rustling at 20 dB"],2,"Sounds above about 85 dB can damage hearing."],
    ["Bats find insects in the dark using…",["refraction","echolocation","static electricity","infrared vision only"],1,"They listen for echoes of their own calls."],
    ["Why can we see the Sun's light but not hear explosions on the Sun?",["Sound is too slow","Light needs no medium; sound needs one and space is empty","The Sun is silent","Light is louder"],1,"Light crosses the vacuum of space; sound can't."],
    ["Which list is in order from lowest to highest energy?",["Gamma, X-ray, visible, radio","Radio, visible light, ultraviolet, X-ray","Visible, radio, gamma, microwave","X-ray, radio, ultraviolet, infrared"],1,"Energy increases from radio waves to gamma rays."],
    ["Wax paper lets some light through but you can't see clearly through it. It is…",["transparent","translucent","opaque","reflective"],1,"Translucent materials scatter the light that passes through."],
    ["Eyeglass lenses help people see by…",["reflecting light","refracting light to focus it","absorbing light","making light"],1,"Lenses bend light so it focuses on the retina."],
    ["A prism splits white light into colors because…",["each color refracts a different amount","the prism paints the light","it reflects only red","colors are made inside the prism"],0,"Different wavelengths bend different amounts."],
    ["Why does a black T-shirt feel hotter in the sun than a white one?",["Black reflects more light","Black absorbs more light energy","White absorbs more light","Color doesn't matter"],1,"Absorbed light energy turns into heat."]

},
{
  id:"body", n:9, sym:"Bd", color:"--u10", name:"Human Body Systems", set:2,
  blurb:"How your body breaks down food, moves oxygen to every cell, and sends signals faster than you can blink.",
  lessons:[
    { t:"Digestive and Excretory Systems",
      body:`<p>Your body needs <b>nutrients</b> (carbohydrates, proteins, fats, vitamins, minerals) and water. The <b>digestive system</b> breaks food into molecules small enough to enter your blood. It does this two ways: <b>mechanical digestion</b> (physically breaking food into smaller pieces, like chewing) and <b>chemical digestion</b> (using chemicals called <b>enzymes</b> and acids to break molecules apart).</p>
<p>Food's path through the body:</p>
<ul><li><b>Mouth:</b> teeth chew (mechanical) and saliva starts breaking down starches (chemical).</li>
<li><b>Esophagus:</b> a muscular tube that squeezes food down to the stomach in waves called <b>peristalsis</b>.</li>
<li><b>Stomach:</b> churns food and mixes it with acid and enzymes that start breaking down proteins.</li>
<li><b>Small intestine:</b> about 6 meters long! Most chemical digestion finishes here, with help from the <b>liver</b> (makes bile to break up fats) and <b>pancreas</b> (makes enzymes). Tiny finger-like <b>villi</b> line the walls and absorb nutrients into the blood.</li>
<li><b>Large intestine:</b> absorbs water and forms solid waste.</li></ul>
<p>The <b>excretory system</b> removes wastes. Your two <b>kidneys</b> filter your blood, removing extra water, salts, and a waste called urea. These form urine, which is stored in the <b>bladder</b>. Your lungs (removing carbon dioxide) and skin (sweat) also help get rid of wastes.</p>`,
      vocab:[["Nutrient","A substance the body needs to grow and work"],["Enzyme","A chemical that speeds up breaking down food"],["Peristalsis","Muscle waves that push food along"],["Villi","Tiny folds in the small intestine that absorb nutrients"],["Kidney","Organ that filters wastes from the blood"],["Mechanical digestion","Physically breaking food into smaller pieces"]],
      tryit:"Chew a plain cracker for a full minute without swallowing. Does it start to taste sweet? That's saliva breaking starch into sugar."},
    { t:"Circulatory and Respiratory Systems",
      body:`<p>Every cell needs oxygen to release energy from food. The <b>respiratory system</b> brings oxygen in and takes carbon dioxide out. Air goes through your nose or mouth, down the <b>trachea</b> (windpipe), into two <b>bronchi</b>, and then into your <b>lungs</b>. The lungs end in millions of tiny air sacs called <b>alveoli</b>. Oxygen passes from the alveoli into tiny blood vessels, and carbon dioxide passes out to be exhaled. A dome-shaped muscle called the <b>diaphragm</b> pulls down to help you breathe in.</p>
<p>The <b>circulatory system</b> delivers that oxygen. Your <b>heart</b>, a muscle about the size of your fist, has four chambers and beats about 60–100 times per minute at rest. Blood travels in two loops:</p>
<ul><li>The <b>lung loop</b>: the right side of the heart pumps oxygen-poor blood to the lungs to pick up oxygen.</li>
<li>The <b>body loop</b>: the left side pumps oxygen-rich blood out to the whole body.</li></ul>
<p>Three kinds of blood vessels:</p>
<ul><li><b>Arteries</b> carry blood <i>away</i> from the heart. They have thick, stretchy walls.</li>
<li><b>Veins</b> carry blood <i>back</i> to the heart. They have valves to stop backflow.</li>
<li><b>Capillaries</b> are tiny vessels, one cell thick, where oxygen and nutrients pass into cells and wastes pass out.</li></ul>
<p>Blood contains <b>red blood cells</b> (carry oxygen), <b>white blood cells</b> (fight germs), <b>platelets</b> (help clotting), and liquid <b>plasma</b>. These two systems work as a team: when you exercise, you breathe faster <i>and</i> your heart beats faster to deliver more oxygen.</p>`,

    { t:"Nervous, Skeletal, and Muscular Systems",
      body:`<p>The <b>nervous system</b> is your body's control and message center. It has two parts:</p>
<ul><li>The <b>central nervous system</b>: the <b>brain</b> and <b>spinal cord</b>.</li>
<li>The <b>peripheral nervous system</b>: all the nerves branching out to the rest of the body.</li></ul>
<p>Messages travel along nerve cells called <b>neurons</b> as electrical signals, some at over 100 meters per second. <b>Sensory neurons</b> carry information from your senses to the brain. <b>Motor neurons</b> carry commands from the brain to muscles. A <b>reflex</b> is an automatic response that skips the brain to save time. If you touch a hot stove, your spinal cord sends a "pull back!" signal before your brain even feels the pain.</p>
<p>The <b>skeletal system</b> has 206 bones in an adult. Bones support your body, protect organs (your skull protects your brain, your ribs protect your heart and lungs), store minerals like calcium, and make blood cells in the soft <b>marrow</b> inside. Bones meet at <b>joints</b>: hinge joints (knee, elbow), ball-and-socket joints (shoulder, hip), and others.</p>
<p>The <b>muscular system</b> moves you. There are three types of muscle:</p>
<ul><li><b>Skeletal muscle:</b> attached to bones by <b>tendons</b>; you control it (voluntary).</li>
<li><b>Smooth muscle:</b> in organs like the stomach and blood vessels; works automatically (involuntary).</li>
<li><b>Cardiac muscle:</b> found only in the heart; involuntary and never tires.</li></ul>
<p>Muscles can only <b>pull</b>, never push, so they work in pairs. To bend your elbow, your biceps contracts; to straighten it, your triceps contracts.</p>`,
      vocab:[["Neuron","A nerve cell that carries signals"],["Reflex","An automatic, quick response that doesn't wait for the brain"],["Central nervous system","The brain and spinal cord"],["Joint","Place where two bones meet"],["Tendon","Tissue that connects muscle to bone"],["Voluntary muscle","Muscle you control on purpose"]],
      tryit:"Try the reaction-time game above five times. Does your time improve with practice? That's your brain learning!"}

{
  id:"genes", n:10, sym:"Gn", color:"--u11", name:"Genetics and Heredity", set:2,
  blurb:"Why you look like your family, what DNA really is, and how to predict traits with a Punnett square.",
  lessons:[
    { t:"Traits: Inherited and Acquired",
      body:`<p>A <b>trait</b> is a characteristic of a living thing, like eye color, height, or the ability to ride a bike. <b>Heredity</b> is the passing of traits from parents to offspring.</p>
<p>There are two kinds of traits:</p>
<ul><li><b>Inherited traits</b> are passed down from parents through genes. Examples: eye color, natural hair color, blood type, freckles, the shape of your earlobes, and a dog's breed features.</li>
<li><b>Acquired traits</b> are developed during a lifetime through experience, learning, or the environment. Examples: a scar, speaking Spanish, playing piano, strong muscles from training, or a dog that knows how to sit. Acquired traits are <b>not</b> passed to offspring. A champion swimmer's baby still has to learn to swim.</li></ul>
<p>Behaviors can also be inherited or learned. <b>Instincts</b> are inherited behaviors that animals are born knowing, like a spider spinning a web, a baby sea turtle crawling toward the ocean, or birds migrating. <b>Learned behaviors</b>, like a chimpanzee using a stick to fish for termites by watching its mother, come from experience.</p>
<p>Some traits are influenced by both genes and environment. Your genes set a range for your height, but nutrition and sleep affect how tall you actually grow. Hydrangea flowers have genes for color, but soil acidity decides whether they bloom blue or pink.</p>
<p>The study of heredity is called <b>genetics</b>. It began in the 1860s with Gregor Mendel, a monk who carefully bred pea plants and discovered patterns in how traits are passed down.</p>`,
      vocab:[["Trait","A characteristic of a living thing"],["Heredity","The passing of traits from parents to offspring"],["Inherited trait","A trait passed down through genes"],["Acquired trait","A trait developed during a lifetime"],["Instinct","An inherited behavior an animal is born knowing"],["Genetics","The study of heredity"]],
      tryit:"Make a chart of 5 traits for yourself and your family (earlobes attached or free, tongue rolling, eye color, dimples, hair color). Which do you share?"},
    { t:"DNA, Genes, and Chromosomes",
      body:`<p>The instructions for every inherited trait are stored in <b>DNA</b> (deoxyribonucleic acid). DNA is shaped like a twisted ladder called a <b>double helix</b>. The "rungs" are made of four chemical bases, abbreviated A, T, C, and G. The <i>order</i> of these bases is a code, like letters spelling words.</p>
<p>Here's how DNA is organized, from big to small:</p>
<ul><li>Your body is made of trillions of <b>cells</b>.</li>
<li>Most cells have a <b>nucleus</b>, the control center.</li>
<li>Inside the nucleus, DNA is tightly coiled into structures called <b>chromosomes</b>. Humans have <b>46 chromosomes</b>, in 23 pairs.</li>
<li>A <b>gene</b> is a section of DNA on a chromosome that holds the code for one protein, which helps build a trait. Humans have about 20,000 genes.</li></ul>
<p>You get one chromosome of each pair from each parent: 23 from your mother's egg cell and 23 from your father's sperm cell. That's why you have a mix of both parents' traits. Sex cells (egg and sperm) have only half the usual number of chromosomes, so when they join, the offspring has the full 46.</p>
<p>A gene can come in different versions called <b>alleles</b>. For example, the gene for earlobe shape has an allele for free earlobes and an allele for attached earlobes. Since you get one allele from each parent, you have two alleles for every gene.</p>
<p>Sometimes DNA changes. A change in a gene is a <b>mutation</b>. Many mutations have no effect, some are harmful, and a few are helpful.</p>`,
      vocab:[["DNA","The molecule that carries genetic instructions"],["Double helix","DNA's twisted-ladder shape"],["Chromosome","A coiled strand of DNA in the nucleus"],["Gene","A section of DNA that codes for a trait"],["Allele","One version of a gene"],["Mutation","A change in DNA"]],
      tryit:"Use a twisted strip of paper, or two licorice ropes with toothpick rungs, to build a model of the double helix."},
    { t:"Dominant, Recessive, and Punnett Squares",
      body:`<p>When you have two different alleles for a gene, often only one shows. A <b>dominant</b> allele shows its trait even if you have just one copy. A <b>recessive</b> allele only shows if you have two copies. Scientists use a capital letter for the dominant allele and the lowercase letter for the recessive one.</p>
<p>Example with Mendel's peas: <b>T</b> = tall (dominant), <b>t</b> = short (recessive).</p>
<ul><li><b>TT</b>: two dominant alleles → tall. This is called <b>homozygous</b> dominant (same alleles).</li>
<li><b>Tt</b>: one of each → still tall, because T is dominant. This is <b>heterozygous</b> (different alleles), sometimes called a "hybrid" or "carrier."</li>
<li><b>tt</b>: two recessive alleles → short.</li></ul>
<p>The letters (like Tt) are the <b>genotype</b>, the genes. The trait you actually see (tall) is the <b>phenotype</b>.</p>
<p>A <b>Punnett square</b> predicts the chances of offspring traits. Write one parent's alleles across the top and the other's down the side, then fill in each box with one letter from the top and one from the side. Each box is a 25% chance.</p>
<p>If two <b>Tt</b> plants are crossed, the four boxes are TT, Tt, Tt, tt. So there is a 75% chance (3 out of 4) of a tall plant and a 25% chance (1 out of 4) of a short one. That's why two tall parents can sometimes have a short offspring!</p>
<p>Remember: a Punnett square shows <b>probability</b>, not a guarantee, just like flipping a coin twice won't always give one heads and one tails.</p>`,
      vocab:[["Dominant allele","An allele that shows even with one copy"],["Recessive allele","An allele that shows only with two copies"],["Genotype","The alleles an organism has, like Tt"],["Phenotype","The trait you can observe, like tall"],["Homozygous","Having two of the same allele"],["Punnett square","A chart that predicts possible offspring"]],
      tryit:"Use the Punnett square tool above. Can you find parents who will always have short offspring? What about always tall?"}
  ],

    ["The allele that shows even with just one copy is…",["recessive","dominant","acquired","mutated"],1,"A dominant allele masks a recessive one."],
    ["In a Punnett square, each box represents a…",["10% chance","25% chance","50% chance","100% chance"],1,"There are four boxes, so each is 1 out of 4."],
    ["Who is called the father of genetics?",["Charles Darwin","Gregor Mendel","Isaac Newton","Louis Pasteur"],1,"Mendel discovered inheritance patterns with pea plants."]

    ["How many chromosomes are in a human egg or sperm cell?",["46","23","92","12"],1,"Sex cells have half, so the offspring gets 46 total."],
    ["Why do children have traits from both parents?",["They get half their chromosomes from each parent","They copy their parents","Traits are learned at home","Only the mother passes traits"],0,"23 chromosomes come from each parent."],
    ["DNA's code is made from the order of four bases. Which letters stand for them?",["A, B, C, D","A, T, C, G","X, Y, Z, W","T, U, V, W"],1,"Adenine, thymine, cytosine, and guanine."],
    ["A change in a gene's DNA is called a…",["trait","mutation","phenotype","helix"],1,"Mutations can be harmful, helpful, or have no effect."],
    ["A plant has the genotype Tt (T = tall). What is its phenotype?",["Short","Tall","Medium","Can't tell"],1,"T is dominant, so the plant is tall."],
    ["Which genotype is homozygous recessive?",["TT","Tt","tt","T"],2,"Two lowercase (recessive) alleles."],
    ["Two Tt plants are crossed. What fraction of offspring are expected to be short (tt)?",["0","1/4","1/2","3/4"],1,"The boxes are TT, Tt, Tt, tt, so 1 out of 4."],
    ["A TT plant is crossed with a tt plant. What percent of offspring will be tall?",["0%","25%","50%","100%"],3,"Every box is Tt, and T is dominant."],
    ["A Tt plant is crossed with a tt plant. What is the chance of a short offspring?",["0%","25%","50%","75%"],2,"The boxes are Tt, Tt, tt, tt: 2 out of 4."],
    ["Two brown-eyed parents have a blue-eyed child (blue is recessive). What must be true?",["Both parents carry a recessive blue allele","Neither parent has a blue allele","The child learned blue eyes","Brown is recessive"],0,"The child needed one recessive allele from each parent."],
    ["A Punnett square predicts 50% tall. A family of 4 offspring has 3 tall. This is…",["impossible","possible, because Punnett squares show probability, not guarantees","proof the square is wrong","a mutation"],1,"Like coin flips, real results can vary from predictions."]
