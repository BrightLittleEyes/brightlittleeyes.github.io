<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4E8A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Language Arts">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wildflower Language Arts 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7EF; --card:#FFFFFF; --ink:#2E2A25; --soft:#6F675D; --line:#E8DFD0; --cream:#F5EEDF;
  --read:#6E9A64; --spell:#C9785D; --gram:#4F86A6; --write:#9A6A9E; --poem:#C99A2E; --art:#B5677A; --geo:#3E8E8A; --book:#8A7458;
  --ok:#5E9A5A; --okbg:#E5F1E1; --no:#C0614E; --nobg:#F8E3DD; --gold:#E3B04B;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Andika","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:19px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(circle at 8% 0%,#F3E6D3 0,transparent 32%),radial-gradient(circle at 100% 30%,#E9F0E2 0,transparent 30%);}
h1,h2,h3{font-family:"Lora",Georgia,serif;font-weight:600;margin:0;text-wrap:balance}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gram);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 18px 70px}
.screen{display:none}.screen.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* top bar */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Lora",serif;font-size:clamp(20px,3.6vw,27px);font-weight:600}
.logo small{display:block;font-family:"Andika",sans-serif;font-size:13px;color:var(--soft);font-weight:400;letter-spacing:.4px}
.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:16px;font-weight:700}
button.pill:hover{background:var(--cream)}

/* generic */
.lead{color:var(--soft);font-size:clamp(17px,2.4vw,20px);margin:6px 0 18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:0 3px 0 #EDE4D4}
.btn{background:var(--read);color:#fff;font-size:18px;font-weight:700;border-radius:14px;padding:11px 20px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{font-size:15px;padding:7px 14px}
.btn.danger{background:#fff;color:var(--no);border:1.5px solid #EBC4BA;box-shadow:0 3px 0 #EBC4BA}
.link{background:none;color:var(--soft);text-decoration:underline;font-size:16px;padding:4px}
.note{color:var(--soft);font-size:15px}
.err{color:var(--no);min-height:24px;margin:6px 0 0;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* pick */
.names{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 20px}
.name-btn{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 22px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line);min-width:150px;text-align:left}
.name-btn small{display:block;font-size:15px;color:var(--soft);font-weight:400}
input[type=text],input[type=password],input[type=number],textarea{font-family:inherit;font-size:19px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:22px 24px;margin-bottom:22px;background:linear-gradient(120deg,#FFFDF8,#F6EEDD)}
.hero h1{font-size:clamp(26px,4.4vw,36px)}
.hero .go{font-size:20px;padding:14px 24px}
.starbar{height:14px;background:var(--cream);border-radius:999px;overflow:hidden;margin-top:10px;max-width:440px;border:1.5px solid var(--line)}
.starbar i{display:block;height:100%;background:linear-gradient(90deg,#F2CF6B,var(--gold));border-radius:999px;transition:width .4s}
@media(max-width:600px){.hero{grid-template-columns:1fr}}
.unit{margin:0 0 22px}
.unit-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.unit-head .badge-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff}
.unit-head h2{font-size:23px}
.unit-head span{color:var(--soft);font-size:15px;display:block}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ltile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;box-shadow:0 3px 0 var(--line);position:relative;min-height:92px}
.ltile b{display:block;font-size:13px;color:var(--soft);letter-spacing:.6px;text-transform:uppercase}
.ltile span{display:block;font-family:"Lora",serif;font-size:17px;line-height:1.25;margin-top:3px}
.ltile.done{background:#F3F8F0;border-color:#BFD8B6}
.ltile.done::after{content:"✓";position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.ltile.next{border-color:var(--gold);box-shadow:0 3px 0 var(--gold)}
.ltile.rev span::before{content:"⭐ "}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.badge{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-size:14px;color:var(--soft)}
.badge b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.badge .bi{font-size:32px}
.badge.locked{opacity:.38;filter:grayscale(1)}

/* lesson */
.lhead{margin-bottom:14px}
.kicker{font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft);font-weight:700}
.lhead h1{font-size:clamp(28px,4.6vw,40px);margin-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.dot{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:700}
.dot i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.dot.done i::before{content:"✓"}
.sec{margin:18px 0;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#fff}
.sec-h .ic{font-size:24px}
.sec-h h2{font-size:22px;color:#fff;flex:1}
.sec-h .chk:empty{display:none}
.sec-h .chk{background:rgba(255,255,255,.25);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.sec-b{padding:18px 22px 22px}
.sec-b p{margin:0 0 12px}
.story{font-size:21px;line-height:1.7;max-width:66ch}
.story p{text-indent:1.4em;margin:0 0 10px}
.story h3{font-size:28px;margin:4px 0 12px;text-align:center}
.drop::first-letter{float:left;font-family:"Lora",serif;font-size:3.1em;line-height:.9;padding:4px 8px 0 0;color:var(--read)}
.vocab{display:grid;gap:6px;background:var(--cream);border-radius:14px;padding:12px 16px;margin:14px 0}
.vocab div{font-size:17px}
.vocab b{font-family:"Lora",serif}
.verse{border-left:5px solid var(--poem);background:#FBF4E1;border-radius:0 14px 14px 0;padding:12px 18px;margin:16px 0 4px;font-family:"Lora",serif;font-style:italic;font-size:19px}
.verse small{display:block;font-family:"Andika",sans-serif;font-style:normal;font-size:14px;color:var(--soft);margin-top:4px}
.virtue{display:inline-block;background:#FBF4E1;color:#8A6A15;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.rule{background:var(--cream);border-radius:14px;padding:14px 16px;margin:0 0 12px;font-size:18px}
.rule .ex{display:block;margin-top:8px;font-family:"Lora",serif;font-size:18px;color:#4A443C}
.listen{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.word{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;font-size:20px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.word::after{content:" 🔈";font-size:14px}
.q{margin:16px 0 0;padding-top:12px;border-top:1.5px dashed var(--line)}
.q:first-of-type{border-top:none}
.q p.ask{font-weight:700;font-size:19px;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px}
.opt:hover:not(:disabled){background:var(--cream)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;border-radius:12px;padding:8px 12px;font-size:17px}
.fb.ok{background:var(--okbg)} .fb.no{background:#FBF1DC}
.tapline{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tapw{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:20px}
.tapw.sel{background:#E6EEF4;border-color:var(--gram)}
.tapw.right{background:var(--okbg);border-color:var(--ok)}
.tapw.wrong{background:var(--nobg);border-color:var(--no)}
.tapw.miss{border-style:dashed;border-color:var(--ok)}
.task{display:flex;gap:12px;align-items:flex-start;background:#F4F7FA;border-radius:14px;padding:12px 16px;margin:12px 0}
.task .ti{font-size:24px}
.done-row{display:flex;justify-content:flex-end;margin-top:14px;gap:10px;flex-wrap:wrap;align-items:center}
.complete-badge{color:var(--ok);font-weight:700}
.poem{font-family:"Lora",serif;font-size:21px;line-height:1.6;white-space:pre-line;background:#FFFCF4;border:1.5px solid #F0E3C2;border-radius:16px;padding:18px 24px;max-width:520px}
.poem h3{font-size:24px;margin:0 0 2px}
.poem .by{font-family:"Andika",sans-serif;font-size:15px;color:var(--soft);margin-bottom:12px;display:block}
.artcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:#FBF0F2;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.frame{width:86px;height:86px;border:7px solid #C9A86A;outline:2px solid #9F7F45;background:linear-gradient(135deg,#F6D9A8,#B5677A 60%,#5D4A6E);border-radius:4px}
.artcard h3{font-size:22px}
.artcard a{color:var(--art);font-weight:700}
ul.look{margin:6px 0 12px;padding-left:22px}
.mapbox{background:#EEF6F6;border-radius:16px;padding:10px;margin:10px 0}
.mapbox svg{display:block;width:100%;height:auto;max-height:300px}
textarea.writebox{width:100%;min-height:150px;font-size:20px;line-height:1.7;background:#fff repeating-linear-gradient(transparent 0 33px,#DCE6EE 33px 34px);background-attachment:local;padding:6px 14px}

/* tiles */
.tilebox{background:#F3EEE4;border-radius:18px;padding:14px;margin-top:10px}
.tb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tb-count{font-weight:700;color:var(--soft)}
.slot{min-height:66px;background:#fff;border:2.5px dashed #D6CAB4;border-radius:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin-bottom:12px}
.slot.ok{border-color:var(--ok);border-style:solid;background:var(--okbg)}
.slot.no{border-color:var(--no);border-style:solid;background:var(--nobg)}
.slot .ph{color:#B8AC97;font-size:16px;padding-left:6px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{min-width:46px;height:50px;padding:0 10px;border-radius:10px;background:#FFFDF7;border:1.5px solid #D9CCB3;box-shadow:0 3px 0 #D9CCB3;font-size:24px;font-weight:700;font-family:"Andika",sans-serif}
.tile.v{background:#FBE3DC;border-color:#E3B3A5;box-shadow:0 3px 0 #E3B3A5;color:#8A3B2A}
.tile.ph{background:#FBF0CF;border-color:#E3CB86;box-shadow:0 3px 0 #E3CB86}
.tile:active{transform:translateY(2px);box-shadow:none}
.slot .tile{height:46px}
.tb-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.peek{font-family:"Lora",serif;font-size:30px;text-align:center;min-height:40px;letter-spacing:2px;color:var(--spell)}

/* finish */
.finish{text-align:center;padding:30px 20px}
.stamp{display:inline-block;border:3px solid var(--ok);color:var(--ok);border-radius:10px;padding:6px 14px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;transform:rotate(-3deg);font-size:15px}
.finish h2{font-size:30px;margin:12px 0 6px}
.big{font-size:70px}

/* parent */
.pinbox{max-width:380px;margin:20px auto;text-align:center;padding:26px}
.pinbox input{width:170px;text-align:center;letter-spacing:10px;font-size:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:15px;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.punit{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.punit h3{font-size:18px;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:5px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;border-top:none}
.sq{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--cream);border:1.5px solid var(--line);vertical-align:middle;margin-right:2px}
.sq.on{background:var(--ok);border-color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.stat .v{font-family:"Lora",serif;font-size:28px;font-weight:600}
.stat .k{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.8px}
.wsample{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap;font-size:17px}
.wsample b{display:block;font-size:14px;color:var(--soft);white-space:normal}
.booklist{columns:2 260px;padding-left:20px}
.booklist li{margin-bottom:6px;break-inside:avoid}
.proj{border:2px dashed #E3B9C3;border-radius:18px;padding:16px 18px;margin:14px 0;background:#FFF9FA}
.proj h3{font-size:22px;color:#8E4157;margin-bottom:8px}
.proj .ptag{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--art);font-weight:700}
.supplies{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin:6px 0 12px;padding:0;list-style:none}
.supplies label{display:flex;gap:8px;align-items:flex-start;font-size:17px;cursor:pointer}
.supplies input{width:20px;height:20px;margin-top:3px;accent-color:var(--art)}
ol.steps{margin:6px 0 12px;padding:0;list-style:none;counter-reset:st;display:grid;gap:8px}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:18px}
ol.steps li::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--art);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.photo{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}
.photo img{max-width:220px;max-height:180px;border-radius:10px;border:6px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.filebtn{display:inline-block;background:var(--art);color:#fff;font-weight:700;border-radius:12px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.filebtn input{display:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:10px}
.gallery figure{margin:0;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:8px;border:5px solid #FBF7EF;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.gallery figcaption{font-size:14px;margin-top:6px;line-height:1.3}
.gallery figcaption b{display:block;font-family:"Lora",serif;font-size:15px}
.bookcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.cover{width:78px;height:106px;border-radius:4px 8px 8px 4px;color:#fff;display:flex;align-items:flex-end;padding:8px;font-family:"Lora",serif;font-size:11px;line-height:1.2;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 3px 6px rgba(0,0,0,.2)}
.bookcard h3{font-size:22px}
.chap{display:inline-block;background:#F3ECE2;border-radius:999px;padding:4px 14px;font-weight:700;font-size:18px;margin-top:6px}
.bkbar{height:10px;background:var(--cream);border-radius:999px;overflow:hidden;margin-top:8px;max-width:260px;border:1px solid var(--line)}
.bkbar i{display:block;height:100%;background:var(--book)}
.unit-book{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--soft)}
.confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.9s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media(max-width:560px){.sec-b{padding:14px}.story{font-size:19px}.artcard{grid-template-columns:1fr}.frame{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span style="font-size:1.3em">🌼</span><div>Wildflower Language Arts<small>LEVEL 3 · READING · SPELLING · GRAMMAR · WRITING</small></div></div>
    <div class="pills">
      <button class="pill" id="homeBtn" style="display:none" onclick="go('home')">🏡 Lessons</button>
      <button class="pill" id="whoBtn" style="display:none" onclick="go('pick')"></button>
      <span class="pill" id="starPill" style="display:none">⭐ <span id="starCount">0</span></span>
    </div>
  </header>

  <section class="screen" id="pick">
    <h1 style="font-size:clamp(28px,5vw,40px)">Who is learning today? 📖</h1>
    <p class="lead">Tap your name. New here? Add your name below.</p>
    <div class="names" id="names"></div>
    <form class="row" id="addForm">
      <input type="text" id="newName" maxlength="20" placeholder="Your first name" autocomplete="off" aria-label="Your first name">
      <button class="btn" type="submit">➕ Add me</button>
    </form>
    <p class="err" id="addErr"></p>
    <div style="text-align:center;margin-top:30px"><button class="link" onclick="go('parent')">👪 Parent area</button></div>
  </section>

  <section class="screen" id="home"></section>
  <section class="screen" id="lesson"></section>
  <section class="screen" id="parent"><div class="card" style="padding:22px" id="parentBox"></div></section>
</div>

<script>
/* Units 1–2. Every story is original; poems are public-domain classics; verses are KJV. */
const UNITS = [
 {n:1, title:"Home and Family", icon:"🏡", color:"#C9785D",
  poem:{title:"The Swing", by:"Robert Louis Stevenson", lines:[
   "How do you like to go up in a swing,","Up in the air so blue?","Oh, I do think it the pleasantest thing","Ever a child can do!","",
   "Up in the air and over the wall,","Till I can see so wide,","Rivers and trees and cattle and all","Over the countryside—","",
   "Till I look down on the garden green,","Down on the roof so brown—","Up in the air I go flying again,","Up in the air and down!"]}},
 {n:2, title:"Woods and Meadows", icon:"🌿", color:"#6E9A64",
  poem:{title:"Who Has Seen the Wind?", by:"Christina Rossetti", lines:[
   "Who has seen the wind?","Neither I nor you:","But when the leaves hang trembling,","The wind is passing through.","",

L({u:1, story:{title:"The Quilt Square", virtue:"Patience",
 text:[
 "Grandma kept a basket of cloth scraps by her rocking chair. There were blue checks, red stripes, and a soft green with tiny white flowers. Every winter she sewed the scraps into a quilt.",
 "“May I help this year?” asked Ruth.",
 "Grandma smiled and handed her a needle, a thimble, and two small squares. “Sew them together with little stitches,” she said. “Little stitches hold tight.”",
 "Ruth wanted to be swift. She made big, quick stitches. In a few minutes, she held up her square. But when she tugged it, the two pieces pulled apart.",
 "Ruth felt her face get hot. She wanted to toss the square back in the basket. Grandma did not scold. She just took out the loose thread and gave the square back.",
 "“Try again, slow and steady,” she said. “A quilt is made one stitch at a time.”",
 "So Ruth tried again. In, out. In, out. Her fingers got tired, but she kept going. This time, when she tugged, the square held fast.",
 "That night, the new quilt was spread on Ruth’s bed. In one corner was a square of blue checks and green flowers. It was not perfect, but it was strong, and Ruth had made it herself."],
 vocab:[["scraps","small leftover pieces"],["thimble","a little metal cap that keeps your finger safe when you sew"]],
 verse:{ref:"Colossians 3:23", text:"And whatsoever ye do, do it heartily, as to the Lord, and not unto men."},
 q:[["Why did Ruth’s first square pull apart?",["Her stitches were too big and quick","The cloth was torn","Grandma cut it"],0,"Big, quick stitches don’t hold tight."],
    ["What did Grandma do when the square fell apart?",["She scolded Ruth","She took out the thread and let Ruth try again","She finished it for Ruth"],1,"Grandma was patient and gave Ruth another chance."],

L({u:1, story:{title:"Pancakes for Papa", virtue:"Service",
 text:[
 "Papa had a bad cold. He sat by the window with a quilt on his lap and a cup of tea in his hands.",
 "“He works so hard for us,” whispered Sam to his sister June. “Let’s make him breakfast.”",
 "June was nine and could read the recipe. Sam was seven and could crack the eggs. Mama said they could use the stove if she stood close by.",
 "June measured the flour and the milk. Sam cracked two eggs, and only one tiny bit of shell fell in. He fished it out with a spoon. They stirred until the batter was smooth.",
 "Mama poured the first pancake. It came out lumpy and brown on one side. The second was round and golden. Soon there was a tall stack on the plate.",
 "Sam picked a few red berries from the bowl and made a smile on the top pancake. June set a napkin and a fork on a tray. Then they carried it to Papa, slowly, so nothing would spill.",
 "Papa’s eyes got shiny. “What a fine gift,” he said in his scratchy voice. “Will you stay and eat with me?”",
 "So they did. It was a gray, rainy day, but the room felt bright and warm."],

 verse:{ref:"Galatians 6:2", text:"Bear ye one another's burdens, and so fulfil the law of Christ."},

    ["How did the room feel at the end?",["Cold and gray","Bright and warm","Noisy"],1,"Serving others fills a home with warmth."]]},

 extra:{kind:"geo", title:"Maps and the Compass Rose",
  text:["A <b>map</b> is a drawing of a place as if you were a bird looking down. Maps help us find our way.","Most maps have a <b>compass rose</b>. It shows the four <b>cardinal directions</b>: <b>North</b>, <b>East</b>, <b>South</b>, and <b>West</b>. North is usually at the top of the map.","A good way to remember them going around clockwise: <b>N</b>ever <b>E</b>at <b>S</b>oggy <b>W</b>affles!"],

L({u:1, story:{title:"The Broken Jar", virtue:"Honesty",
 text:[
 "On Mama’s windowsill sat a blue glass jar. It had belonged to Great-Grandma, and the morning sun made it glow like the sea.",
 "Eli was tossing his ball in the kitchen. He knew he was not supposed to. Toss, catch. Toss, catch. Then the ball bounced off his fingers and hit the windowsill.",
 "<i>Crash!</i> The blue jar lay on the floor in three pieces.",
 "Eli’s heart pounded like rain on a tin roof. The cat was sitting nearby. <i>Mama might think the cat did it,</i> he thought. He could slip outside and say nothing.",
 "But Eli knew that would be a lie, even without words. He took a deep breath and walked to the garden where Mama was pulling weeds.",
 "“Mama,” he said, and his voice shook. “I was playing ball in the kitchen. I broke Great-Grandma’s jar. I’m sorry.”",
 "Mama was quiet for a long moment. Then she knelt and held his hands. “I am sad about the jar,” she said. “But I am glad that you told me the truth. A jar can be glued. Trust is harder to fix.”",
 "That evening they glued the pieces together. You can still see the cracks. Whenever Eli looks at the jar, he remembers that telling the truth made his heart feel light again."],
 vocab:[["windowsill","the flat shelf at the bottom of a window"],["trust","believing someone will be honest and true"]],

L({u:1, story:{title:"The Garden Gate", virtue:"Gentleness",
 text:[
 "Lily and her brother Ben both wanted to paint the garden gate.",
 "“I asked first!” said Lily, grabbing the brush.",
 "“But Papa said I could!” Ben shouted, and he grabbed it too. Green paint dripped on the grass. Their voices got louder and louder, like two crows in a tree.",
 "Lily felt angry words climbing up her throat. She wanted to say something sharp. Then she remembered what Mama said: <i>A soft answer turns away anger.</i>",
 "Lily let go of the brush. She took a slow breath. “Ben,” she said quietly, “we both want to paint. What if you paint the top and I paint the bottom?”",
 "Ben blinked. He had been ready to argue some more. But it is hard to yell at someone who is speaking softly.",
 "“Okay,” he said. “And we can switch halfway.”",
 "So they painted together. Ben painted the top boards, and Lily painted the bottom boards, and they met in the middle. By supper time, the gate was a fresh, clean green.",
 "Papa came out to look. “This is the finest gate in the whole county,” he said. “And I can tell it was painted by two people who worked as a team.”"],

L({u:1, story:{title:"Grandpa’s Rowboat", virtue:"Gratitude",
 text:[
 "Early on Saturday, Grandpa knocked on Owen’s window. “The lake is like glass,” he whispered. “Shall we row?”",
 "Owen pulled on his coat and boots. Mist rose off the water like steam from a teapot. The old wooden rowboat was tied to the dock, and it bumped softly against the post.",
 "Grandpa rowed slowly. The oars dipped in and out with a quiet <i>splash, drip, splash</i>. A heron stood in the reeds on one long leg. A fish jumped and made rings that grew wider and wider.",
 "“Grandpa,” said Owen, “we didn’t catch any fish. We didn’t go anywhere special. Why do you love rowing so much?”",
 "Grandpa rested the oars across his knees. The sun was coming up over the trees, turning the water gold.",
 "“Look around,” he said. “God made this whole morning, and He gave it to us. Some people rush right past mornings like this. I don’t want to miss one.”",
 "Owen looked. He saw the gold water, the gray heron, and Grandpa’s kind, wrinkled face. He felt full inside, like after Thanksgiving dinner.",
 "As they rowed back to the dock, Owen said, “Thank you, God, for this day.” Grandpa smiled and rowed a little slower, so the morning would last."],

L({u:2, story:{title:"Fireflies at Night", virtue:"Wonder",
 text:[
 "On a warm night in June, Clara and her little brother Teddy sat on the back steps in their pajamas. The sky turned from blue to purple to deep, dark night.",
 "Then, down in the meadow, a tiny light blinked on. Then another, and another, until the whole field twinkled.",
 "“Fireflies!” said Teddy.",
 "Papa came out with an empty jar. “You may catch a few to look at,” he said, “but you must let them go before bed. They have work to do tonight.”",
 "Clara cupped her hands and caught one gently. It crawled on her palm. Its tail glowed yellow-green, on and off, on and off. It did not feel hot at all.",
 "“How does it make light without a fire?” she asked.",
 "“God made fireflies to glow from the inside,” said Papa. “Scientists still study how it works. They blink to call to each other in the dark.”",
 "Teddy caught three, and they watched them glow in the jar. Then, as Papa had said, they lifted the lid. The fireflies floated up, up, up, blinking like tiny lanterns, until Clara couldn’t tell them apart from the stars."],

L({u:2, story:{title:"The Barn Owl", virtue:"Trust in God’s Care",
 text:[
 "High in the barn, above the hay loft, lived a barn owl. Her face was white and shaped like a heart. Her feathers were the color of toast and cream.",
 "Every evening, Marcus climbed to the loft to feed the horses. He would look up at the dark corner of the roof. Sometimes he saw two black eyes looking down at him.",
 "One morning in March, Marcus heard tiny hissing sounds. He climbed the ladder very quietly. In the corner sat four fuzzy white owlets.",
 "“Papa, how will she feed them all?” he asked at supper. “It’s still cold, and the corn hasn’t even been planted.”",

L({u:2, story:{title:"The First Robin", virtue:"Patience",
 text:[
 "All winter, Hazel had waited for spring. She marked each day on the calendar. She asked Mama a hundred times, “When will the birds come back?”",
 "One morning, she heard a cheery song outside: <i>cheerily, cheer-up, cheerily!</i> On the fence sat a bird with a gray back and a rusty orange chest.",
 "“The first robin!” Hazel cried.",
 "For days she watched from the window. The robin and her mate carried twigs, grass, and mud to the fork of the apple tree. They worked and worked until they had built a round, firm nest.",
 "Then one day Hazel climbed onto the stool and peeked. Inside were three eggs, as blue as the sky. She wanted to touch them, but Mama said, “Only look. If you wait, you will see something wonderful.”",
 "Waiting was hard. For twelve days, the mother robin sat on her eggs, through wind and rain. Hazel waited too.",
 "At last she heard tiny peeping. Three fuzzy babies with wide yellow mouths stretched up to be fed.",
 "Hazel laughed. “Mama, you were right. Waiting made it even better.”"],
 vocab:[["mate","an animal’s partner"],["fork","the place where a branch splits in two"]],
 verse:{ref:"Ecclesiastes 3:1", text:"To every thing there is a season, and a time to every purpose under the heaven."},
 q:[["What color were the robin’s eggs?",["White","Sky blue","Speckled brown"],1,"Robin eggs are blue as the sky."],["How long did the mother sit on her eggs?",["Two days","Twelve days","Twenty days"],1,"She sat for twelve days."],["What did Hazel learn?",["Waiting made it better","Birds are noisy","Nests are easy to build"],0,"Good things are worth waiting for."]]},
 spell:{title:"r-controlled er, ir, ur", rule:"<b>er</b>, <b>ir</b>, and <b>ur</b> all say /er/ as in <i>her</i>, <i>bird</i>, and <i>turn</i>. Learn each word’s spelling by heart.",
  words:["fern","her","bird","first","girl","church","turn","purple"], tiles:["er","ir","ur","ch","pl"]},
 gram:{title:"Verb Tenses", rule:"Verbs tell <b>when</b>. <b>Past</b>: it already happened (<i>walked</i>). <b>Present</b>: it is happening now (<i>walks</i>). <b>Future</b>: it will happen (<i>will walk</i>).",

  text:["John James Audubon spent years walking through forests and fields to study birds. He painted every kind of bird he could find in America, life-size and in great detail.","He drew birds the way they really move, perching on branches, flying, and eating berries."],

L({u:2, story:{title:"Lessons from the Ant Hill", virtue:"Diligence",
 text:[
 "Noah was lying in the grass with nothing to do. His chores were waiting, but the sun was warm, and he felt too lazy to move.",
 "Then he noticed a line of ants marching past his nose. Each ant carried something: a crumb, a seed, a bit of leaf. Some carried things much bigger than themselves.",
 "Noah followed the line to a little hill of sand by the path. The ants went in through a tiny hole and came back out with empty jaws, then marched off to fetch more.",
 "One ant dropped her seed in a crack. She tugged and tugged until it came loose. Then she went right on her way.",
 "Noah laughed. “Nobody is making you work,” he told the ant. “Why don’t you rest?”",
 "Grandma was sitting on the porch. “Proverbs says, ‘Go to the ant, thou sluggard; consider her ways, and be wise,’” she said. “The ant works hard in summer so she will have food when it’s cold. Nobody has to tell her twice.”",
 "Noah looked at the ants. Then he looked at the pile of wood he was supposed to stack. He jumped up.",
 "By noon, the wood was stacked in a neat row, and Noah felt strong and proud. He brought Grandma a glass of cool water, then went back to watch his tiny teachers."],
 vocab:[["sluggard","a lazy person"],["diligent","working hard and carefully"]],
 verse:{ref:"Proverbs 6:6", text:"Go to the ant, thou sluggard; consider her ways, and be wise."},
 q:[["What were the ants carrying?",["Crumbs, seeds, and bits of leaf","Sticks and stones","Nothing"],0,"Each ant carried food."],["Why do ants work hard in summer?",["Someone makes them","So they will have food when it’s cold","They like the sun"],1,"They store food for winter."],["What did Noah do after watching the ants?",["Took a nap","Stacked the wood","Went fishing"],1,"He learned diligence from the ants."]]},
 spell:{title:"oo, ew, ue", rule:"The sound /oo/ as in <i>moon</i> can be spelled <b>oo</b> (<i>spoon</i>), <b>ew</b> (<i>grew</i>), or <b>ue</b> (<i>blue</i>). <b>ew</b> and <b>ue</b> often come at the end.",

 gram:{title:"Adjectives", rule:"An <b>adjective</b> describes a noun. It tells <i>what kind</i>, <i>how many</i>, or <i>which one</i>: <i>tiny</i> ants, <i>three</i> seeds, <i>that</i> hill.",

   {type:"mc", q:"Which adjective tells <i>how many</i>?", o:["tiny","five","brown"], a:1, why:"Five tells how many."}]},

 extra:{kind:"geo", title:"North America and the United States",
  text:["We live on the continent of <b>North America</b>. The three biggest countries in North America are <b>Canada</b> (north), the <b>United States</b> (middle), and <b>Mexico</b> (south).","The United States has <b>50 states</b>. Our capital city is <b>Washington, D.C.</b>, where the President lives and works.","Alaska and Hawaii are states too, but they are not connected to the other 48."],

L({u:2, story:{title:"The Mouse in the Pantry", virtue:"Kindness to Creatures",
 text:[
 "Someone had been nibbling the crackers in the pantry. There were tiny crumbs on the shelf and a little hole in the corner of the box.",
 "“A mouse!” said Mama, and she frowned. “We can’t have a mouse in the house.”",
 "Papa set a box trap that would not hurt it. In the morning, Abby and Papa found a small brown mouse inside, with round ears and bright black eyes. It was shivering.",
 "“Poor thing,” said Abby. “It was only hungry. Do we have to hurt it?”",
 "“No,” said Papa. “The Bible says a good man takes care of his animals. The mouse doesn’t belong in our pantry, but it can live in the field, where God made it to live.”",
 "So they walked down the path, past the town road, to the edge of the meadow. The ground was soft, and there were seeds everywhere. Papa set the trap down and opened the door.",
 "For a moment the mouse sat still. Then it twitched its whiskers and scampered into the tall grass.",
 "“Goodbye, little mouse!” Abby called. “Find a cozy home!”",
 "Walking back, she held Papa’s hand. “I’m glad we were kind,” she said. “Even to a mouse.”"],
 vocab:[["pantry","a small room where food is kept"],["scamper","to run quickly with light steps"]],
 verse:{ref:"Proverbs 12:10", text:"A righteous man regardeth the life of his beast."},
 q:[["How did they know there was a mouse?",["They heard it squeak","There were crumbs and a hole in the cracker box","The cat found it"],1,"The crumbs and hole were clues."],["What did Papa do with the mouse?",["Let it go in the meadow","Kept it as a pet","Gave it to a neighbor"],0,"He set it free where it belonged."],["What did Abby learn?",["To be kind, even to small creatures","Mice are bad","To lock the pantry"],0,"God wants us to care for His creatures."]]},
 spell:{title:"ou and ow (as in cow)", rule:"<b>ou</b> and <b>ow</b> can both say /ow/ as in <i>ouch</i>. <b>ou</b> is usually in the middle (<i>cloud</i>). <b>ow</b> is often at the end or before n or l (<i>cow, town, owl</i>).",

 gram:{title:"Articles: a, an, the", rule:"<b>A</b>, <b>an</b>, and <b>the</b> are special adjectives called <b>articles</b>. Use <b>a</b> before a consonant sound (<i>a mouse</i>). Use <b>an</b> before a vowel sound (<i>an owl</i>).",

L({u:3, story:{title:"The New Boy", virtue:"Including Others",
 text:[
 "On the first day of church camp, a new boy named Tomás stood alone by the fence. He held his lunch sack with both hands and looked at his shoes.",
 "The other boys were already choosing teams for kickball. Daniel saw Tomás and remembered his own first day last year. Nobody had talked to him for hours. He still remembered how lonely that felt.",
 "Daniel walked over. “Hi! I’m Daniel. Do you want to play on my team?”",
 "Tomás looked up. “I don’t know the rules very well,” he said in a quiet voice. “In my old town, we played soccer.”",
 "“That’s okay,” said Daniel. “It’s a lot like soccer, but you kick a big red ball and run the bases. I’ll show you.”",
 "Tomás learned fast. On his second turn, he kicked the ball so far that it rolled into the bushes, and he ran all the way home. The whole team cheered and shouted his name.",
 "At lunch, Tomás sat next to Daniel. He shared his sweet bread, and Daniel shared his apple slices.",
 "That night, Daniel’s mother asked about his day. “I made a new friend,” he said. “And I think he made one too.”"],
 vocab:[["lonely","sad because you feel alone"],["include","to let someone join in"]],
 verse:{ref:"Luke 6:31", text:"And as ye would that men should do to you, do ye also to them likewise."},
 q:[["Why did Daniel walk over to Tomás?",["The coach told him to","He remembered how lonely his own first day felt","He needed one more player"],1,"He treated Tomás the way he would want to be treated."],["What game did Tomás play in his old town?",["Baseball","Soccer","Tag"],1,"He played soccer."],["What did the boys share at lunch?",["Sweet bread and apple slices","Sandwiches","Cookies"],0,"They shared their food."]]},

L({u:3, story:{title:"Dawn at the Lake", virtue:"Courage",
 text:[
 "Every summer the cousins swam out to the wooden raft in the middle of the lake. Every summer, Molly stayed on the shore. The water was deep and dark, and she was afraid.",
 "This year, Aunt Grace said, “Let’s practice together, early, before anyone else is awake.”",
 "So at dawn, while mist hung over the lawn, Molly and Aunt Grace waded in. The water was cool. First Molly practiced floating on her back. Then she practiced kicking. Then she swam a little way, and back, and a little farther, and back.",
 "Each morning she went a bit farther. Her heart still pounded, but each morning it pounded a little less.",
 "“Being brave doesn’t mean you aren’t scared,” Aunt Grace told her. “It means you trust God and do the right thing anyway.”",
 "On the last day of August, Molly stood at the edge of the dock. The cousins were on the raft, waving. She whispered, “Be strong and of a good courage,” and she jumped.",
 "She kicked and pulled, kicked and pulled, with Aunt Grace swimming beside her. And then her hand touched the wet wood of the raft.",
 "The cousins pulled her up, cheering. Molly lay on her back in the warm sun, laughing so hard she couldn’t stop."],
 vocab:[["dawn","the very first light of morning"],["courage","doing what is right even when you are afraid"]],

 spell:{title:"aw and au", rule:"<b>aw</b> and <b>au</b> both say /aw/ as in <i>saw</i>. <b>aw</b> often comes at the end or before n (<i>draw, lawn</i>). <b>au</b> is usually in the middle (<i>haul</i>).",

L({u:3, story:{title:"Mrs. Page’s Groceries", virtue:"Thinking of Others",
 text:[
 "Mrs. Page lived across the street. She was eighty-four years old and walked with a cane. Every Tuesday, she rode the city bus to the grocery store.",
 "One icy Tuesday, Grace watched from her window as Mrs. Page stepped off the bus with two heavy bags. Her cane slid on the sidewalk. She stopped and held onto the fence.",
 "Grace grabbed her coat. “Mama, may I help Mrs. Page?”",
 "Mama was already reaching for her own coat. Together they hurried across the street. Grace took one bag and Mama took the other, and Mama held Mrs. Page’s arm.",
 "Step by careful step, they walked her to her door. Inside, her little house smelled like peppermint. Grace put the cans in the cupboard and the milk in the fridge.",
 "“You are a gentle girl,” said Mrs. Page, and she gave Grace a peppermint from a glass dish. “Thank you for looking out for an old lady.”",
 "That night, Grace had an idea. She made a card that said: <i>Every Tuesday, I will carry your bags. Love, Grace.</i>",
 "From then on, every Tuesday, Grace waited by the window for the city bus. And Mrs. Page always had a peppermint waiting."],
 vocab:[["cane","a stick that helps someone walk"],["cupboard","a cabinet with shelves for food or dishes"]],
 verse:{ref:"Philippians 2:4", text:"Look not every man on his own things, but every man also on the things of others."},
 q:[["Why did Mrs. Page need help?",["Her bags were heavy and the sidewalk was icy","She lost her keys","She missed the bus"],0,"It was icy and her bags were heavy."],["What did Mrs. Page give Grace?",["A dollar","A peppermint","A cookie"],1,"She gave her a peppermint."],["What promise did Grace make?",["To visit on Sundays","To carry Mrs. Page’s bags every Tuesday","To shovel snow"],1,"She promised to help every Tuesday."]]},
 spell:{title:"Soft c and soft g", rule:"When <b>c</b> comes before <b>e</b>, <b>i</b>, or <b>y</b>, it usually says /s/ (<i>city</i>). When <b>g</b> comes before <b>e</b>, <b>i</b>, or <b>y</b>, it often says /j/ (<i>giant</i>). <b>dge</b> says /j/ after a short vowel (<i>bridge</i>).",

 gram:{title:"Subjects and Predicates", rule:"Every sentence has two parts. The <b>subject</b> tells <i>who or what</i> the sentence is about. The <b>predicate</b> tells <i>what the subject does or is</i>.",

L({u:3, story:{title:"The Lost Lamb", virtue:"Being a Good Neighbor",
 text:[
 "<i>Knock, knock, knock!</i> Someone was at the door before breakfast. It was Mr. Wright from the farm next door, and his face was worried.",
 "“One of my lambs got through the fence last night,” he said. “Have you seen her? She has a black spot on one knee.”",
 "Caleb and his big sister Joy pulled on their boots. “We’ll help you look!”",
 "They searched the barn, the garden, and the ditch by the road. They called and called. Caleb’s thumbs got cold, and his boots got muddy, but he did not want to quit.",
 "Then Joy held up her hand. “Listen!” From the thick brush by the creek came a thin, wobbly <i>baaa</i>.",
 "The lamb was caught in a wild rose bush. Her wool was snagged on the thorns. Joy held the branches back while Caleb gently worked the wool free. The lamb trembled, but she let them carry her.",
 "When they walked into Mr. Wright’s yard, the old farmer laughed out loud. “You found her! You two are the best neighbors a man could ask for.”",
 "He wrapped the lamb in a blanket. Then he invited them in for hot cocoa, and Caleb’s cold thumbs got warm again."],

 verse:{ref:"Proverbs 17:17", text:"A friend loveth at all times, and a brother is born for adversity."},

  text:["Five giant lakes sit between the United States and Canada. They are called the <b>Great Lakes</b>: <b>Superior</b>, <b>Michigan</b>, <b>Huron</b>, <b>Erie</b>, and <b>Ontario</b>. Remember them with the word <b>HOMES</b>!","The <b>Mississippi River</b> is one of the longest rivers in North America. It flows south through the middle of the country all the way to the <b>Gulf of Mexico</b>.","The Ohio River, on Indiana’s southern border, flows into the Mississippi."],

L({u:3, story:{title:"The Pocket Watch", virtue:"Honesty",
 text:[
 "After the town picnic, Jack stayed to help fold the chairs. Under the last table, something shiny caught his eye. It was a gold pocket watch on a chain.",
 "Jack picked it up. It ticked softly in his hand. On the back were tiny letters: <i>To Walter, with love, 1952</i>.",
 "“Wow,” said his friend Nate. “Finders keepers! You could sell that.”",
 "Jack thought about it. A watch like this could buy a new baseball mitt, maybe even a bike. But it wasn’t his.",
 "“It belongs to somebody named Walter,” he said. “He must be missing it.”",
 "The boys asked the pastor, who knew everyone in town. “Walter Fitch!” said the pastor. “That’s his father’s watch. He was looking for it all afternoon.”",
 "They walked to Mr. Fitch’s house. When Jack held out the watch, the old man’s hands began to shake. “My father gave me this when I was your age,” he said. “I thought it was gone forever.”",
 "He tried to give Jack a reward, but Jack shook his head. “I just wanted you to have it back, sir.”",
 "On the way home, Nate was quiet. Then he said, “You did the right thing.” Jack smiled. A good name, he decided, was worth more than any bike."],
 vocab:[["reward","something given to thank someone for a good deed"],["pastor","a minister who leads a church"]],
 verse:{ref:"Proverbs 22:1", text:"A good name is rather to be chosen than great riches."},
 q:[["Where did Jack find the watch?",["In the grass","Under the last table","In his pocket"],1,"It was under the last table."],["How did they find out who owned it?",["They asked the pastor","They put up signs","They asked the police"],0,"The pastor knew everyone in town."],["Why did Jack say no to the reward?",["He wanted more money","He just wanted Mr. Fitch to have his watch back","He was in a hurry"],1,"He did right because it was right."]]},
 spell:{title:"-tch and -ck", rule:"After a short vowel, the sound /ch/ is usually spelled <b>tch</b> (<i>catch</i>), and the sound /k/ is usually spelled <b>ck</b> (<i>duck</i>).",

 gram:{title:"Commas in Dates and Places", rule:"Put a <b>comma</b> between the day and the year: <i>July 4, 1776</i>. Put a comma between a city and its state: <i>Indianapolis, Indiana</i>.",

L({u:4, story:{title:"Llamas in the Andes", virtue:"Hard Work",
 text:[
 "High in the Andes Mountains of Peru, the air is thin and cold. That is where Mateo lives with his family and their twelve llamas.",
 "Every morning, Mateo’s job is to lead the llamas up the mountain to find grass. He wears a bright woven hat with flaps over his ears, made by his grandmother.",
 "The llamas walk in a line, with bells on their necks. Their wool is thick, so they never mind the cold. Sometimes one gets stubborn and sits down on the path. Then Mateo has to coax it with a soft voice and a pat on the neck.",
 "In the afternoon, he brings them home. His mother spins their wool into yarn and dyes it red, yellow, and deep blue, with colors made from plants. Then she weaves beautiful blankets to sell at the market in town.",
 "Mateo’s legs are strong from all the climbing, and his heart is glad. “Our llamas give us wool,” he says, “and we give them good care. Everyone works together.”",
 "At night, the family eats potato soup by the fire. Through the window, the stars look close enough to touch."],
 vocab:[["coax","to gently talk someone into doing something"],["weave","to make cloth by crossing threads over and under"]],
 verse:{ref:"Acts 17:26", text:"And hath made of one blood all nations of men for to dwell on all the face of the earth."},
 q:[["In what country does Mateo live?",["Mexico","Peru","Spain"],1,"He lives in the Andes Mountains of Peru."],["What is Mateo’s job?",["Leading the llamas to find grass","Weaving blankets","Selling yarn"],0,"He takes the llamas up the mountain."],["What does Mateo’s mother make from the wool?",["Hats only","Blankets to sell","Soup"],1,"She weaves blankets for the market."]]},

L({u:4, story:{title:"The Alpine Cowbell", virtue:"Trusting God for Help",
 text:[
 "In the Swiss Alps, the mountains are so tall that snow stays on their tops all summer. Down below are green meadows full of flowers, where cows graze with big bells around their necks.",
 "Anna and her brother Lukas helped their father herd the cows up to the high pasture. All summer, the family would live in a small wooden hut and make cheese from the milk.",
 "One afternoon, a thick fog rolled in. It was so thick that Anna couldn’t see her own hand. Then she noticed that Bella, the youngest cow, was missing.",
 "Anna stopped and listened. Far off, she heard a faint <i>clang, clang</i>. “That’s Bella’s bell!” she said.",
 "Lukas was worried. “We could get lost in this fog.”",
 "Anna prayed. “Lord, help us find her, and help us find our way home.” Then she looked up. The fog thinned just enough to show a row of stones along the trail. They followed the stones and the sound of the bell.",
 "They found Bella nibbling grass beside a stream. They led her back, step by careful step, until they saw the warm glow of the hut’s window.",
 "That night, Father hugged them both. “I will lift up mine eyes unto the hills,” he said, “from whence cometh my help.”"],
 vocab:[["pasture","a grassy field where animals eat"],["graze","to eat grass in a field"]],
 verse:{ref:"Psalm 121:1–2", text:"I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth."},

 spell:{title:"Doubling before -ed and -ing", rule:"If a short word ends in one vowel and one consonant, <b>double the last consonant</b> before adding -ed or -ing: <i>hop → hopped, hopping</i>.",

L({u:4, story:{title:"Kites over the Rice Fields", virtue:"Patient Love",
 text:[
 "In a small village in Japan, every family flies kites in the spring. The kites are shaped like fish, birds, and dragons, painted in bright colors.",

 "Hana felt like snapping at him. Instead she took a breath and handed him a brush. “You can paint the bubbles,” she said, smiling. Kenji’s bubbles were lopsided, but he was so proud.",
 "On the windy day, the whole village gathered by the rice fields. Hana ran, and the kite rose, wobbling. Then it caught the wind and soared high, the carp’s tail waving.",
 "She put the string in Kenji’s hands and held his hands in hers. “Hold tight,” she said. “Let it fly.”",
 "Kenji’s eyes shone. “My bubbles are in the sky!”",
 "Hana laughed. Making the kite had taken longer with Kenji’s help. But it was much happier this way."],

 spell:{title:"Drop the e before -ing", rule:"When a word ends in silent <b>e</b>, <b>drop the e</b> before adding -ing: <i>bake → baking</i>, <i>smile → smiling</i>.",

 "Amani’s family had only enough water for one day. But she whispered to her mother, “May I help Mama Zawadi?”",

L({u:4, story:{title:"Tulip Time", virtue:"Caring for God’s Earth",
 text:[
 "In the Netherlands, the land is very flat. Long ago, people built walls called dikes to hold back the sea, and they used windmills to pump the water away. Now the land is green and full of farms.",
 "In April, the fields turn into stripes of color: red, yellow, pink, purple, and white. These are the tulip fields, and they stretch as far as you can see.",
 "Pieter’s grandfather grew tulips. In the fall, Pieter helped him plant the bulbs in neat rows. “Each bulb is like a little packed lunch,” Grandfather said. “It holds everything the flower needs to wait through the cold winter.”",
 "All winter, the fields were brown and bare. Pieter wondered if anything was happening under the ground.",
 "Then one spring morning, he biked to the farm with his sister on the back seat. Green shoots had pushed up everywhere. A week later, the whole field burst into bloom.",
 "Grandfather knelt and touched a red tulip. “The earth is the Lord’s,” he said. “We only take care of it for Him. We plant, we wait, and God makes it grow.”",
 "Pieter picked a bunch of yellow tulips for his mother’s birthday. The windmill turned slowly above them, like a giant waving hello."],

L({u:5, story:{title:"The Harvest Table", virtue:"Thankfulness",
 text:[
 "It was the day before Thanksgiving, and Grandma’s kitchen smelled like cinnamon and baking bread.",
 "“I can’t wait!” said Lucy. She and her cousins were making place cards for the long table. On each card they wrote a name and drew a little leaf.",
 "Grandma handed each child a small slip of paper. “Before we eat tomorrow,” she said, “I’d like everyone to write one thing they’re thankful for. We’ll read them aloud.”",
 "Lucy chewed her pencil. She was thankful for so many things. Her family. Her warm bed. Her dog, Biscuit. The red maple leaves outside. It was hard to choose just one.",
 "So she wrote small and squeezed in as many as she could. When she turned the paper over, she kept going on the back.",
 "The next day, twenty people crowded around the table. Grandpa prayed. Then each person read their slip. Uncle Ray was thankful for his new job. Baby Rose’s mother was thankful for Baby Rose. When it was Lucy’s turn, she read for so long that everyone started laughing.",
 "“Lucy,” said Grandpa, with a twinkle in his eye, “I think you’ve discovered a secret. The more you count your blessings, the more you find.”"],
 vocab:[["blessing","a good gift from God"],["harvest","the time when crops are gathered"]],
 verse:{ref:"1 Thessalonians 5:18", text:"In every thing give thanks: for this is the will of God in Christ Jesus concerning you."},
 q:[["What did Grandma ask everyone to write?",["Their name","One thing they were thankful for","A recipe"],1,"She asked for something they were thankful for."],["Why did everyone laugh when Lucy read?",["She read for so long","She made a mistake","Her dog barked"],0,"She had so many blessings to read."],["What secret did Lucy discover?",["Pie is the best food","The more you count your blessings, the more you find","Grandpa likes jokes"],1,"Gratitude grows when you practice it."]]},

L({u:5, story:{title:"Raking Leaves for Mr. Ortiz", virtue:"Perseverance",
 text:[
 "Mr. Ortiz had hurt his back, and his yard was buried under a blanket of leaves. Red, gold, and brown, they were piled up past the children’s ankles.",
 "“Let’s rake them for him,” said Isaac. His sisters, Ada and Ruth, grabbed rakes from the shed.",
 "At first it was fun. They raked a big pile and jumped in it. But then the wind blew, and half the leaves scattered back across the lawn.",
 "“This is hopeless,” groaned Ada. “We’ll never finish.”",
 "Isaac felt like quitting too. Then he remembered a verse they had learned: <i>Let us not be weary in well doing.</i>",
 "“Let’s redo it, but smarter,” he said. “We’ll rake small piles and put them in bags right away. Then the wind can’t undo our work.”",
 "So they did. One small pile, one bag. Another small pile, another bag. Their arms ached, but the bags lined up along the curb like soldiers: five, ten, fifteen.",
 "By sunset the lawn was clean. Mr. Ortiz came out on his cane and looked around. “I was unable to do this myself,” he said. “You have given me a gift.” He brought out mugs of hot apple cider, and they drank it on his porch while the sky turned pink."],
 vocab:[["persevere","to keep going even when it is hard"],["scatter","to spread out in every direction"]],
 verse:{ref:"Galatians 6:9", text:"And let us not be weary in well doing: for in due season we shall reap, if we faint not."},
 q:[["Why did the children rake Mr. Ortiz’s leaves?",["He paid them","He had hurt his back","Their parents made them"],1,"He couldn’t do it himself."],["What undid their first pile?",["A dog","The wind","Rain"],1,"The wind scattered the leaves."],["How did they solve the problem?",["They quit","They raked small piles and bagged them right away","They used a leaf blower"],1,"They worked smarter and kept going."]]},

L({u:5, story:{title:"The Thankful Jar", virtue:"Joyful Gratitude",
 text:[
 "On the first day of November, Mama set an empty glass jar on the kitchen counter. Next to it she put a stack of paper strips and a pencil.",
 "“Every day,” she said, “write down one thing you’re thankful for and put it in the jar. On New Year’s Day, we’ll read them all.”",
 "At first, Peter thought it was a silly idea. Then on a cold, gloomy day, he got a sore throat and couldn’t go to his friend’s house. He felt hopeless and grumpy.",
 "Mama made him honey tea and sat with him. She read aloud from a funny book until he laughed so hard he coughed. That night, Peter wrote: <i>Thankful for Mama reading to me when I was sick.</i>",
 "After that, Peter noticed things he had never noticed before. The way the cat curled up on his feet. The smell of pine trees. His sister helping him find his lost mitten.",
 "Some days were hard, but there was always something to write. The jar filled slowly, then quickly, until the papers were pressed against the lid.",
 "On New Year’s Day, the family sat in a circle and read every strip. Some were silly and some were sweet. When they finished, Peter said, “It’s like the jar was full of sunshine.”",
 "Papa smiled. “It was there all along,” he said. “We just learned to see it.”"],

L({u:5, story:{title:"Snow Day Visit", virtue:"Love for Others",
 text:[
 "It snowed all night. In the morning, the whole town was white and quiet. School was closed, and the twins, Will and Kate, cheered.",
 "“Let’s build a snow fort!” said Will.",
 "But Kate was looking out the window at the gray house down the road. “Mrs. Hale is all alone,” she said. “Her son lives too far away to come. I bet she’s lonely.”",
 "Will thought about the snow fort. Then he said, “We can build the fort later. Let’s go visit her.”",
 "Their mother helped them pack a basket with cinnamon rolls and a jar of soup. They waded through snow up to their knees. Their breath made little clouds in the air.",
 "Mrs. Hale opened the door with a surprised smile. “Well, look who’s here! Come in, come in!” Her house was warm, and there was a puzzle half finished on her table.",
 "They helped her finish the puzzle. She told them stories about sledding on the same hill when she was a girl, almost seventy years ago. Will shoveled her front steps, and Kate brought in wood for the stove.",
 "When it was time to go, Mrs. Hale hugged them both. “You two have warmed my heart more than this stove,” she said.",
 "They built their snow fort that afternoon. It was the best one they had ever made."],
 vocab:[["wade","to walk through something deep, like water or snow"],["lonely","sad from being alone"]],
 verse:{ref:"Psalm 147:16", text:"He giveth snow like wool: he scattereth the hoarfrost like ashes."},
 q:[["Why did Kate want to visit Mrs. Hale?",["She was lonely","She had cookies","She needed a doctor"],0,"Kate thought she might be lonely."],["What did Will do to help?",["Cooked soup","Shoveled her steps","Built a fort for her"],1,"He shoveled her front steps."],["What did the twins do in the afternoon?",["Went to school","Built their snow fort","Visited Grandma"],1,"They still built their fort."]]},
 spell:{title:"Homophones", rule:"<b>Homophones</b> sound the same but have different spellings and meanings. Listen to the sentence to know which word to spell!",
  words:["their","there","they're","to","too","two","hear","here"], tiles:["th","ei","er","'","oo"],
  say:{"their":"Their house is warm. Spell their.","there":"Put it over there. Spell there.","they're":"They're going sledding. Spell they're.","to":"We walked to the door. Spell to.","too":"I want to come too. Spell too.","two":"I have two mittens. Spell two.","hear":"I can hear the wind. Spell hear.","here":"Come here, please. Spell here."}},
 gram:{title:"Using Homophones", rule:"<b>their</b> = belongs to them · <b>there</b> = a place · <b>they're</b> = they are. <b>to</b> = toward · <b>too</b> = also or very · <b>two</b> = 2.",

  text:["<b>Australia</b> is both a country and a continent. It is called “the land down under” because it is south of the equator. Kangaroos and koalas live there.","<b>Antarctica</b> is at the very bottom of the earth, around the South Pole. It is the coldest place on earth. Penguins live along its icy coasts, but no one lives there all year.","<b>South America</b> is south of North America. It has the long <b>Andes Mountains</b>, where Mateo’s llamas live, and the huge <b>Amazon</b> rainforest."],

L({u:5, story:{title:"The Candle in the Window", virtue:"Letting Your Light Shine",
 text:[
 "Long ago, before there were streetlights, families on the prairie would put a candle in the window on winter nights. It helped travelers find their way through the dark and the snow.",
 "Great-Grandpa told this story to Annie every December. Then he would take out a little brass candle holder and set a white candle in it.",
 "“Your great-great-grandmother kept this candle burning the night of the big blizzard,” he said. “A man was lost in the storm with his horse. He saw this little light and followed it to the door. She gave him supper and a warm place by the fire. He said that tiny candle saved his life.”",
 "Annie looked at the small, simple flame. “But it’s just a little candle,” she said.",
 "Great-Grandpa smiled. “A little light can do a big job in the dark,” he said. “Jesus said we are to be lights in the world. Every kind word and helpful deed is a little candle. You never know who might be lost and looking for it.”",
 "That night, Annie set the candle in the front window. Then she thought about who might need some light. She wrote a cheerful note to her friend who was sick. She set the table without being asked. She helped her little brother with his puzzle.",
 "Before bed, she looked at the candle glowing on the windowsill. It was little. But it was bright, and it was shining."],
 vocab:[["prairie","a wide, flat land covered with grass"],["blizzard","a big snowstorm with strong winds"]],
 verse:{ref:"Matthew 5:16", text:"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."},
 q:[["Why did prairie families put candles in the window?",["To help travelers find their way","To keep warm","To decorate"],0,"The light guided travelers in the dark."],["What happened the night of the big blizzard?",["The candle went out","A lost man followed the light to safety","The horse ran away"],1,"The candle saved the traveler."],["What did Great-Grandpa say a little candle is like?",["A kind word or helpful deed","A star","A lamp"],0,"Good deeds are lights in the world."]]},
 spell:{title:"-le endings", rule:"Many words end in a consonant + <b>le</b>. The <b>le</b> says /ul/: <i>ap-ple</i>, <i>can-dle</i>, <i>lit-tle</i>. Clap the syllables, then spell each part.",
  words:["apple","candle","gentle","little","table","puzzle","turtle","simple"], tiles:["le","pp","tt","zz","nd"]},

<script>
/* ================= helpers & saving (same approach as Science Explorers) ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const IDB = {
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("wildflower-la3",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); },
  async put(v){ try{ const db=await IDB.open(); await new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,"state"); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} },
  async get(){ try{ const db=await IDB.open(); return await new Promise((res,rej)=>{ const r=db.transaction("kv").objectStore("kv").get("state"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ return null; } }
};
function snapshot(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("la3-")) o[k]=localStorage.getItem(k);} }catch(e){} return o; }
let _mt=null; const _set=LS.set;
LS.set=(k,v)=>{ const ok=_set(k,v); clearTimeout(_mt); _mt=setTimeout(()=>IDB.put(snapshot()),250); return ok; };
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

/* artwork photos live in their own IndexedDB store (too big for the backup code) */
const ART={
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("wildflower-la3-art",1); r.onupgradeneeded=()=>r.result.createObjectStore("pics"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); },
  async put(k,v){ const db=await ART.open(); return new Promise((res,rej)=>{ const tx=db.transaction("pics","readwrite"); v===null?tx.objectStore("pics").delete(k):tx.objectStore("pics").put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); },
  async get(k){ try{ const db=await ART.open(); return await new Promise(res=>{ const r=db.transaction("pics").objectStore("pics").get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } },
  async all(who){ try{ const db=await ART.open(); return await new Promise(res=>{ const out=[]; const r=db.transaction("pics").objectStore("pics").openCursor();
    r.onsuccess=()=>{ const c=r.result; if(!c){ res(out); return; } if(String(c.key).startsWith(who+"|")) out.push(Object.assign({key:c.key},c.value)); c.continue(); }; r.onerror=()=>res(out); }); }catch(e){ return []; } }
};
function shrinkImage(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=1000, s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }

let roster=LS.get("la3-roster",[]), student=LS.get("la3-student",""), prog=LS.get("la3-prog",{}), pin=LS.get("la3-pin","");
let parentOK=false;
const saveAll=()=>{ LS.set("la3-roster",roster); LS.set("la3-student",student); LS.set("la3-prog",prog); };
const P=(s=student)=>{ if(!prog[s]) prog[s]={lessons:{},stars:{},minutes:0,last:null,writing:{},reads:[]}; const p=prog[s]; p.lessons=p.lessons||{}; p.stars=p.stars||{}; p.writing=p.writing||{}; p.reads=p.reads||[]; return p; };
const LP=(i,s=student)=>{ const p=P(s); if(!p.lessons[i]) p.lessons[i]={sec:{},done:false}; return p.lessons[i]; };

/* ================= read aloud ================= */
let voice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  voice=v.find(x=>/natural|neural/i.test(x.name))||v.find(x=>/samantha|aria|jenny|google us/i.test(x.name))||v[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function say(text,rate=.9){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(strip(text).replace(/[“”]/g,'"')); if(voice)u.voice=voice; u.rate=rate; u.lang="en-US"; speechSynthesis.speak(u); return true; }catch(e){ return false; } }
function hush(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ================= course structure ================= */
const SEC = {
  read:{n:"Reading",ic:"📖",c:"var(--read)"}, spell:{n:"Spelling & Phonics",ic:"🔤",c:"var(--spell)"},

  poem:{n:"Poetry",ic:"🎵",c:"var(--poem)"}, art:{n:"Art Appreciation",ic:"🎨",c:"var(--art)"},
  geo:{n:"Geography",ic:"🌍",c:"var(--geo)"}, book:{n:"Book Time",ic:"📕",c:"var(--book)"},
  test:{n:"Spelling Check",ic:"🔤",c:"var(--spell)"}
};
const secsOf=L=> L.review ? ["read","test","gram","poem","book"] : ["read","spell","gram",L.extra.kind,"write","book"];
const TOTAL_STARS = LESSONS.reduce((a,L)=>a+secsOf(L).length+2,0);
function starCount(s=student){ return Object.keys(P(s).stars).reduce((a,k)=>a+(k.endsWith("-done")?2:1),0); }
function addStar(key){ if(!student||P().stars[key]) return false; P().stars[key]=Date.now(); P().last=Date.now(); saveAll(); updateStars(); return true; }
function updateStars(){ $("starCount").textContent=starCount(); }
const lessonDone=(i,s=student)=>!!(P(s).lessons[i]&&P(s).lessons[i].done);
const nextLesson=(s=student)=>{ for(let i=0;i<LESSONS.length;i++) if(!lessonDone(i,s)) return i; return LESSONS.length-1; };
const lessonNo=i=>i+1;
const unitLessons=u=>LESSONS.map((L,i)=>[L,i]).filter(([L])=>L.u===u);

const BADGES=[
  {i:"🌱",n:"First Lesson",d:"Finish Lesson 1",ok:s=>lessonDone(0,s)},

function markSec(k,data={}){

/* ---- question block (multiple choice) ---- */
function mcHTML(id,q,opts,ans,why){ const order=shuffle(opts.map((t,j)=>j));
  return `<div class="q" data-qid="${id}" data-ans="${ans}"><p class="ask">${q}</p><div class="opts">${order.map(j=>`<button class="opt" data-j="${j}">${opts[j]}</button>`).join("")}</div><div class="fbx"></div><input type="hidden" value="${esc(why||"")}"></div>`; }
function tapHTML(id,it){ const words=it.s.split(" ");
  return `<div class="q" data-qid="${id}" data-tap="1"><p class="ask">${it.q}</p><div class="tapline">${words.map(w=>`<button class="tapw" data-w="${esc(w.replace(/[.,!?]/g,""))}">${esc(w)}</button>`).join("")}</div><button class="btn small" data-check>Check</button><div class="fbx"></div></div>`; }
/* wires a group of questions; onAll(score,total) when all answered */
function wireQs(root,items,onAll){
  const res={};
  const finish=()=>{ if(Object.keys(res).length===items.length){ const sc=Object.values(res).filter(Boolean).length; onAll(sc,items.length); } };
  root.querySelectorAll(".q").forEach((qel,idx)=>{
    const it=items[idx];
    if(qel.dataset.tap){
      qel.querySelectorAll(".tapw").forEach(b=>b.onclick=()=>{ if(qel.dataset.locked)return; b.classList.toggle("sel"); });
      qel.querySelector("[data-check]").onclick=()=>{
        if(qel.dataset.locked) return;
        const sel=[...qel.querySelectorAll(".tapw.sel")].map(b=>b.dataset.w);
        if(!sel.length){ qel.querySelector(".fbx").innerHTML=`<div class="fb no">Tap a word first.</div>`; return; }
        const okSet=it.ans.concat(it.extra||[]);
        const right=it.ans.every(a=>sel.includes(a))&&sel.every(w=>okSet.includes(w));
        qel.dataset.locked=1; qel.querySelector("[data-check]").style.display="none";
        qel.querySelectorAll(".tapw").forEach(b=>{ const w=b.dataset.w;
          if(b.classList.contains("sel")) b.classList.add(okSet.includes(w)?"right":"wrong"); else if(it.ans.includes(w)) b.classList.add("miss"); b.classList.remove("sel"); b.disabled=true; });
        qel.querySelector(".fbx").innerHTML=`<div class="fb ${right?"ok":"no"}">${right?"✅ <b>Yes!</b> ":"💡 <b>Good try.</b> "}${it.why}</div>`;
        res[idx]=right; finish();
      };
    } else {
      const ans=+qel.dataset.ans, why=qel.querySelector("input").value;
      qel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const j=+b.dataset.j; qel.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.j===ans) x.classList.add("right"); });
        if(j!==ans) b.classList.add("wrong");
        qel.querySelector(".fbx").innerHTML=`<div class="fb ${j===ans?"ok":"no"}">${j===ans?"✅ <b>Yes!</b> ":"💡 <b>Good try.</b> "}${why}</div>`;
        res[idx]=(j===ans); finish();
      });
    }
  });
}
const doneNote=(i,k)=>{ const s=LP(i).sec[k]; return s&&s.done&&s.total?`<p class="note">Last time: ${s.score} of ${s.total} correct. You can try again any time.</p>`:""; };

/* ---- review spelling check ---- */
BUILD.test=(L,i)=> secShell("test","Spelling Check",`<p>Here are 8 words from this unit. Listen to each word and build it with the letter tiles. No peeking this time. Do your best!</p><div id="tb-test"></div>${doneNote(i,"test")}`);
WIRE.test=(L,i)=>{ const pool=[]; unitLessons(L.u).forEach(([X])=>{ if(X.spell) X.spell.words.forEach(w=>pool.push([w,X.spell])); });
  const pick=shuffle(pool).slice(0,8); const tiles=[...new Set(pick.flatMap(([,S])=>S.tiles))].slice(0,10);
  const S={tiles,say:Object.fromEntries(pick.map(([w,X])=>[w,sayFor(X,w)]))};
  tileBox($("tb-test"),pick.map(p=>p[0]),S,false,(sc,t)=>markSec("test",{score:sc,total:t,words:pick.map(p=>p[0])})); };

function tileBox(root,words,S,allowPeek,onDone){
  let k=0, built=[], first=0, tries=0, peeked=false;
  const needCaps=[...new Set(words.join("").replace(/[^A-Z]/g,"").split(""))].filter(Boolean);
  const needApos=words.some(w=>w.includes("'"));
  const letters="abcdefghijklmnopqrstuvwxyz".split("");
  const ph=(S.tiles||[]).filter(t=>t!=="'"&&t.length>1);
  const vowels="aeiou";
  const tileHTML=(t,cls)=>`<button class="tile ${cls}" data-t="${esc(t)}" aria-label="${t==="'"?"apostrophe":esc(t)}">${esc(t)}</button>`;
  function draw(){
    if(k>=words.length){ root.innerHTML=`<div class="tilebox" style="text-align:center"><div class="big" style="font-size:54px">🎉</div><p style="font-size:20px"><b>All done!</b> You spelled ${first} of ${words.length} on the first try.</p><button class="btn ghost small" id="tbAgain">Practice again</button></div>`; root.querySelector("#tbAgain").onclick=()=>tileBox(root,shuffle(words),S,allowPeek,()=>{}); return; }
    const w=words[k];
    root.innerHTML=`<div class="tilebox">
      <div class="tb-top"><span class="tb-count">Word ${k+1} of ${words.length}</span><div class="row"><button class="listen" data-a="hear">🔈 Hear the word</button>${allowPeek?`<button class="listen" data-a="peek">👀 Peek</button>`:""}</div></div>
      <div class="peek" id="peek"></div>
      <div class="slot" id="slot">${built.length?built.map((t,j)=>`<button class="tile ${t.length>1?"ph":vowels.includes(t)?"v":""}" data-rm="${j}">${esc(t)}</button>`).join(""):'<span class="ph">Tap tiles to build the word…</span>'}</div>
      <div class="tiles">${letters.map(l=>tileHTML(l,vowels.includes(l)?"v":"")).join("")}${needCaps.map(l=>tileHTML(l,"v")).join("")}${needApos?tileHTML("'",""):""}</div>
      ${ph.length?`<div class="tiles" style="margin-top:8px">${ph.map(t=>tileHTML(t,"ph")).join("")}</div>`:""}
      <div class="tb-actions"><button class="btn ghost small" data-a="back">⌫ Back</button><button class="btn ghost small" data-a="clear">Clear</button><button class="btn small" data-a="check" style="background:var(--spell)">Check ✓</button></div>
      <div id="tbfb"></div></div>`;
    root.querySelectorAll(".tiles .tile").forEach(b=>b.onclick=()=>{ built.push(b.dataset.t); draw(); });
    root.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ built.splice(+b.dataset.rm,1); draw(); });
    root.querySelector('[data-a="hear"]').onclick=()=>say(sayFor(S,w),.8);
    const pk=root.querySelector('[data-a="peek"]'); if(pk) pk.onclick=()=>{ peeked=true; const el=root.querySelector("#peek"); el.textContent=w; setTimeout(()=>{ if(el.isConnected) el.textContent=""; },1600); };
    root.querySelector('[data-a="back"]').onclick=()=>{ built.pop(); draw(); };
    root.querySelector('[data-a="clear"]').onclick=()=>{ built=[]; draw(); };
    root.querySelector('[data-a="check"]').onclick=()=>{
      const guess=built.join(""); if(!guess){ root.querySelector("#tbfb").innerHTML=`<div class="fb no">Build the word first. Tap 🔈 to hear it.</div>`; return; }
      tries++;
      const slot=root.querySelector("#slot");
      if(guess===w){ if(tries===1&&!peeked) first++; slot.classList.add("ok");
        root.querySelector("#tbfb").innerHTML=`<div class="fb ok">✅ <b>${esc(w)}</b> is right!</div>`;
        setTimeout(()=>{ k++; built=[]; tries=0; peeked=false; if(k>=words.length) onDone(first,words.length); draw(); if(k<words.length) setTimeout(()=>say(sayFor(S,words[k]),.8),250); },900);
      } else { slot.classList.add("no");
        root.querySelector("#tbfb").innerHTML= tries>=2
          ? `<div class="fb no">This word is spelled <b style="font-size:22px;letter-spacing:1px">${esc(w)}</b>. Build it once more, looking at the letters.</div>`
          : `<div class="fb no">Not quite. Say the word slowly and listen to each sound. Try again!</div>`;
        setTimeout(()=>slot.classList.remove("no"),700);
      }
    };
  }
  draw();
}

async function wireProj(i){ const p=PROJECTS[i]; if(!p||!$("artFile")) return;
  const key=student+"|"+i, who=student;
  const show=async()=>{ const v=await ART.get(key); const box=$("artImg"); if(!box||who!==student) return;

    if(v) $("artDel").onclick=async()=>{ await ART.put(key,null); show(); }; };
  $("artFile").onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; $("artMsg").textContent="Saving…";

    catch(err){ $("artMsg").textContent="That photo couldn't be saved. Try a different one."; } e.target.value=""; };
