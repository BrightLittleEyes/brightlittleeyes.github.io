<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Writing">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Grade 6 Writing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --ink:#15252A; --muted:#566A70; --line:#D3DEDC; --soft:#E6EEEC;
  --accent:#0E7C6B; --accent-ink:#FFFFFF;
  --good:#1D7A3A; --good-bg:#E2F3E7; --bad:#B3261E; --bad-bg:#FBE6E4;
  --t1:#C2562D; --t2:#3B4FA3; --t3:#0E7C6B; --tip:#FFF3C4; --tip-ink:#3D3410;
  --rule:#D9E4EC; --margin:#E8A8A0;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1618; --surface:#162226; --ink:#E4EEEC; --muted:#9AB0B3; --line:#2A3A3E; --soft:#1D2B2F;
    --accent:#3FBFA8; --accent-ink:#06201B;
    --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
    --t1:#E57C52; --t2:#8C9CF0; --t3:#3FBFA8; --tip:#3D3517; --tip-ink:#F7E7A8;
    --rule:#223238; --margin:#6B3B38;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1618; --surface:#162226; --ink:#E4EEEC; --muted:#9AB0B3; --line:#2A3A3E; --soft:#1D2B2F;
  --accent:#3FBFA8; --accent-ink:#06201B;
  --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
  --t1:#E57C52; --t2:#8C9CF0; --t3:#3FBFA8; --tip:#3D3517; --tip-ink:#F7E7A8;
  --rule:#223238; --margin:#6B3B38;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto;background:none;border:0;padding:0}
.brand svg{width:30px;height:30px}
.nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who label{color:var(--muted)}
select,input[type=text]{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

/* home */
.hero{padding-block:36px 20px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.termh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.termh h2{font-size:24px;color:var(--c)}
.termh span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.tile{--c:var(--accent);position:relative;text-align:left;background:var(--surface);border:2px solid var(--c);border-radius:6px;padding:10px 12px 12px;display:grid;gap:2px;transition:transform .15s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px var(--c)}
.tile .num{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--c)}
.tile .sym{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--c);letter-spacing:-.02em}
.tile .nm{font-weight:700;font-size:15px;line-height:1.25;min-height:2.5em}
.tile .checks{display:flex;align-items:center;gap:5px;margin-top:4px}
.tile .checks i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.tile .checks i.on{background:var(--c)}
.tile .mass{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.tile .mass .stars{font-size:13px}
.tile.now{box-shadow:0 0 0 3px var(--soft),0 0 0 5px var(--c)}
.legend{margin-top:14px;font-size:13px;color:var(--muted);font-family:var(--mono)}
.cont{position:relative;display:grid;gap:2px;text-align:left;width:100%;max-width:560px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px 56px 14px 18px;margin-top:6px}
.cont b{font-size:18px;font-family:var(--display)}
.cont small{color:var(--muted);font-size:14px}
.cont .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--accent)}

/* week page */
.back{border:0;background:none;color:var(--muted);padding:18px 0 6px;font-size:15px}
.unithead{display:flex;gap:18px;align-items:center;padding-block:6px 20px;flex-wrap:wrap}
.unithead .badge{--c:var(--accent);width:84px;height:84px;border:2px solid var(--c);border-radius:6px;display:grid;place-items:center;align-content:center;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:var(--c);background:var(--surface);flex:none}
.unithead .badge small{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em}
.unithead h1{font-size:clamp(26px,4vw,38px)}
.unithead p{margin:4px 0 0;color:var(--muted)}
.unithead .wknav{margin-left:auto;display:flex;gap:8px}
.cols{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.lessonlist{display:grid;gap:6px;position:sticky;top:80px}
@media (max-width:760px){.lessonlist{position:static;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.lessonlist .sep{display:none}}
.lessonlist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.lessonlist button span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lessonlist button[aria-current="true"]{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.lessonlist .sep{height:1px;background:var(--line);margin:8px 0}
.lessonlist .act{font-weight:700}
.lessonlist .ck{min-width:1.6em;display:inline-block}
.lessonlist .ck.on{color:var(--good);font-weight:700;font-size:15px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lesson .inner{padding:24px clamp(18px,4vw,36px)}
.lesson h2{font-size:28px;margin-bottom:6px}
.lesson p{max-width:66ch;margin:0 0 12px}
.lesson ul,.lesson ol{max-width:64ch;padding-left:22px;margin:0 0 12px}
.lesson li{margin-bottom:4px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dayhead .kind{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.stepdots{display:flex;gap:6px;flex-wrap:wrap}
.stepdots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);padding:0}
.stepdots button.on{background:var(--c);border-color:var(--c);color:#fff}
.stepdots button[aria-current="true"]{border-color:var(--c);color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.stepdots button.on[aria-current="true"]{color:#fff}
.page{position:relative;margin-top:14px;padding:16px 16px 16px 50px;border-radius:8px;
  background-color:var(--surface);
  background-image:linear-gradient(to right,transparent 34px,var(--margin) 34px,var(--margin) 35.5px,transparent 35.5px),
                   repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  border:1px solid var(--line)}
.page .stepkind{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}
.page h3{font-size:24px;margin:2px 0 10px}
.tipbox{background:var(--tip);color:var(--tip-ink);border-radius:8px;padding:12px 16px;font-size:16px;max-width:66ch;margin-bottom:12px}
.tipbox b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;font-weight:700;margin-bottom:2px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.timer .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;min-width:3.4em}
.timer.over .clock{color:var(--good)}
.lessonnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.finish{margin-top:6px;text-align:center;display:grid;gap:8px;justify-items:center;padding:12px 0}
.finish .got{font-weight:700;color:var(--good)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:15px}
.piecebox{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:15px;color:var(--muted)}
.piecebox b{color:var(--ink)}

.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:8px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{padding:6px 14px;font-size:15px}
.btn.big{font-size:18px;padding:12px 22px}
.btn .st{color:#FFE27A}

/* quiz */
.quiz{max-width:720px;margin:0 auto;padding-top:20px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qhead .kind{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:22px}
.meter i{display:block;height:100%;background:var(--c);transition:width .25s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,30px)}
.qcard .qtext{font-size:21px;font-weight:700;margin:0 0 18px;line-height:1.35}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:17px;white-space:pre-line}
.choice .l{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none;width:1.4em}
.choice:hover:not([disabled]){border-color:var(--c)}
.choice.picked{border-color:var(--c);background:var(--soft)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice[disabled]{cursor:default}
.explain{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:16px}
.explain.ok{background:var(--good-bg);color:var(--ink)}
.explain.no{background:var(--bad-bg);color:var(--ink)}
.explain strong{display:block}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.streak{font-family:var(--mono);font-weight:700;color:#E0A800;margin:-12px 0 12px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result{text-align:center;padding-block:10px 24px}
.result .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--c)}
.result .sub{font-family:var(--mono);color:var(--muted);margin-top:6px}
.result .msg{font-size:20px;font-weight:700;margin-top:12px}
.bigstars{font-size:54px;line-height:1;margin:8px 0 4px;display:flex;justify-content:center;gap:6px}
.bigstars span{color:var(--line)}
.bigstars span.on{color:#F2B705;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.newbadge{margin-top:12px;background:var(--soft);display:inline-block;padding:8px 14px;border-radius:8px}
.review{display:grid;gap:10px;margin-top:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:6px;padding:12px 14px;font-size:15px}
.review .item.miss{border-left-color:var(--bad)}
.review .item p{margin:0 0 4px}
.review .item .q{font-weight:700}
.review .item .muted{color:var(--muted)}
.startcard{text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:28px}
.stat .v small{font-size:15px;color:var(--muted)}
.stat .k{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.m{background:var(--soft);color:var(--ink)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:99px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-top:28px;margin-bottom:10px}
.section-h h2{font-size:22px}
.st,.stars{color:#E0A800}
.stars{letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}
.starchip{font-family:var(--mono);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.bdg{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:2px;opacity:.6}
.bdg.got{opacity:1;border:2px solid var(--c)}
.bdg .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:700;margin-bottom:4px}
.bdg.got .medal{background:#F2B705;color:#fff}
.bdg small{color:var(--muted);font-size:13px;line-height:1.35}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px;font-size:15px}
.out{font-family:var(--mono);font-size:14px;font-weight:700;margin:8px 0 0}

/* parent */
.pinbox{max-width:420px;margin:40px auto;display:grid;gap:10px;text-align:center}
.pinbox h1{font-size:28px}.pinbox p{color:var(--muted);margin:0}
.pinbox form{display:flex;gap:10px;justify-content:center}
.pinbox input{font:inherit;font-family:var(--mono);font-size:26px;letter-spacing:.4em;width:150px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.pinerr{color:var(--bad);min-height:1.4em}
.ptabs{display:inline-flex;flex-wrap:wrap;margin:10px 0 18px}
.att{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.att summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;cursor:pointer;font-size:15px}
.att summary .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ans{margin:0;padding:4px 18px 12px 40px;display:grid;gap:8px;font-size:15px}
.ans li{display:grid;gap:2px}
.ans li.ok span{color:var(--good)}.ans li.no span:first-of-type{color:var(--bad)}
.keyh{font-size:18px;margin:20px 0 8px}
.key{padding-left:24px;display:grid;gap:12px;margin:0}
.key ul{list-style:none;padding:0;margin:4px 0;display:grid;gap:2px;font-size:15px}
.key li.right{color:var(--good);font-weight:700}
.key small{color:var(--muted);font-size:13px}
.pbody textarea{width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
.rub{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.rub summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;cursor:pointer}
.rub summary .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rub .rb{padding:0 14px 14px;display:grid;gap:12px}
.trait{display:grid;gap:6px}
.trait > b{font-size:15px}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lv button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;text-align:left;font-size:13px;line-height:1.3;display:grid;gap:2px}
.lv button b{font-family:var(--mono);font-size:14px}
.lv button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
@media (max-width:560px){.lv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rub textarea{width:100%;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.bigstars span.on,.shake{animation:none!important}}

.lesson .muted{color:var(--muted);font-size:15px}
.page p:last-child{margin-bottom:0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" aria-label="Home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="4" width="18" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 10h10M9 14h10M9 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M27.5 9.5l-9 13-3.2 1.4.4-3.4 9-13z" fill="var(--accent)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Grade 6 Writing Workshop
    </button>
    <nav class="nav" aria-label="Sections">
      <button id="nav-units" aria-current="true">Lessons</button>
      <button id="nav-progress" aria-current="false">Progress</button>

const W=[
{f:`Oral to written narration`,g:`Nouns & verbs`,gt:`A noun names a person, place, thing, or idea (Almanzo, barn, courage). A verb shows action or being (ran, is, wondered).`,s:`A good narration tells what happened in order and uses the author's important words. Start with who and where, then tell the events in order using first, next, then, and finally.`,tue:`Tell Monday's narration again, aloud, using first, next, then, and finally.`,wed:`Write a second narration of a different section of the book: 5–7 sentences.`,thu:`Reread your two narrations. Circle 5 strong nouns and 5 strong verbs. Copy your best narration neatly.`,fw:`Describe your morning routine as if it were an adventure.`},
{f:`The complete sentence`,g:`Subjects & predicates; fragments`,gt:`Every sentence needs a subject (who or what) and a predicate (what they do or are). "Ran to the barn." is a fragment. Who ran? "Almanzo ran to the barn." is complete.`,s:`A complete sentence holds one whole thought. Read each sentence by itself. If it leaves you asking "who?" or "did what?", it's a fragment.`,tue:`Find and fix 3 fragments in your narrations. If you can't find any, write 3 fragments and then fix them.`,wed:`Write 10 sentences of your own about an animal you know. Underline each subject once and each predicate twice.`,thu:`Choose your 5 best sentences from Wednesday and shape them into one short paragraph.`,fw:`If you could spend a day as any animal, which would you choose and why?`},
{f:`Sentence variety`,g:`Compound sentences (FANBOYS); run-ons`,gt:`Join two complete sentences with a comma plus for, and, nor, but, or, yet, or so: "The storm came, so we ran inside." Two sentences jammed together with no comma and joining word make a run-on.`,s:`Good writing mixes short and long sentences. Too many short ones sound choppy. Too many long ones get tiring.`,tue:`Take 6 short sentences from one of your narrations and combine them into 3 compound sentences.`,wed:`Find one long, beautiful sentence in this week's book. Copy it, then write your own sentence that follows the same pattern on a new topic.`,thu:`Write a paragraph about a favorite place, using at least 2 short sentences and 2 compound sentences.`,fw:`Write about the best meal you have ever eaten.`},
{f:`Topic sentence & support`,g:`Complex sentences (because, although, when)`,gt:`A complex sentence joins a full sentence with a part that can't stand alone: "When the bell rang, we ran outside." Put a comma after the starting part.`,s:`A paragraph is about one main idea. The topic sentence states it. Support sentences give details. A closing sentence wraps it up.`,tue:`Read a paragraph from your book. Find its topic sentence and list 3 supporting details.`,wed:`Choose a familiar object (a favorite mug, a bike, a quilt). Write a topic sentence, then list 5 details: how it looks, feels, sounds, and why it matters.`,thu:`Draft your descriptive paragraph: topic sentence, 4–6 detail sentences, and a closing sentence. Use at least one complex sentence.`,fw:`Write about something you own that has a story behind it.`},
{f:`Explaining with order`,g:`Pronouns & antecedents`,gt:`A pronoun (he, she, it, they) stands in for a noun. Make sure it's clear who it means. "Mom told Sarah she was late." Who was late?`,s:`Explaining a process means giving the steps in the right order with clear signal words: first, next, after that, finally. Tell the reader what they need before they start.`,tue:`Pick something you know how to do. List every step, cross out any extra ones, and number the rest.`,wed:`Draft a how-to paragraph from your list. Begin with a topic sentence that tells what the reader will learn.`,thu:`Have someone follow your instructions exactly as written. Fix any step that confused them, then write a neat final copy.`,fw:`Teach a younger child how to do something you're good at.`},
{f:`Opinion with reasons`,g:`Transitions; comma after introductory words`,gt:`Transitions link ideas: first, also, for example, however, finally. Put a comma after an introductory word or phrase: "However, the plan failed."`,s:`An opinion paragraph says what you think, then gives reasons with examples. Strong reasons are specific and would make sense even to someone who disagrees.`,tue:`Choose an opinion (best season? best pet? should kids have chores?). Write 3 reasons and one example for each.`,wed:`Draft your opinion paragraph: a clear opinion, 3 reasons with transitions, and a closing sentence.`,thu:`Revise and polish all three paragraphs from this unit (describe, explain, persuade). Read each aloud and fix anything that sounds wrong.`,fw:`What is one rule you would add to your family, and why?`},
{f:`Narrative: choosing a moment`,g:`Dialogue punctuation`,gt:`Put spoken words inside quotation marks, with commas and periods inside: "Wait for me," she called. Start a new paragraph each time the speaker changes.`,s:`The best true stories zoom in on one small moment, like one afternoon or even one minute, not a whole summer. A small moment lets you slow down and show details.`,tue:`List 5 memories. For each one, circle the single most important minute.`,wed:`Pick one moment. Sketch it as 4–6 boxes like a comic strip: what happened first, next, and last.`,thu:`Tell your story aloud to someone. Notice which parts made them lean in, and jot notes on what to include.`,fw:`Write about a time you were surprised.`},
{f:`Narrative: beginning with a hook`,g:`Consistent verb tense`,gt:`Choose past or present tense and stick with it. "I opened the door and see a dog" mixes tenses. Fix: "I opened the door and saw a dog."`,s:`A hook pulls the reader in. Try starting with action, dialogue, a sound, or a question instead of "One day I…"`,tue:`Write 3 different opening sentences for your story: one with action, one with dialogue, and one with a sound.`,wed:`Choose your best hook and draft the beginning and middle of your story.`,thu:`Finish drafting the whole story. Don't worry about making it perfect. Get it all down.`,fw:`Write about a sound you remember from when you were little.`},
{f:`Narrative: showing, not telling`,g:`Adjectives & adverbs`,gt:`Adjectives describe nouns (the cold, gray barn). Adverbs describe verbs (ran quickly). Use them sparingly. A strong verb often beats a verb plus adverb: "sprinted" instead of "ran fast."`,s:`"Telling" says "I was scared." "Showing" lets the reader see it: "My hands shook and I couldn't swallow." Use actions and the five senses.`,tue:`Find 3 "telling" sentences in your draft. Rewrite each one to show instead.`,wed:`Add sensory details (sight, sound, smell, touch, taste) to the most important part of your story.`,thu:`Add at least 3 lines of dialogue to your story, punctuated correctly.`,fw:`Describe someone who is very excited without using the word "excited."`},
{f:`Narrative: endings & reflection`,g:`Homophones`,gt:`Homophones sound alike but mean different things: their (belongs to them), there (a place), they're (they are); its (belongs to it), it's (it is); your / you're; to / too / two.`,s:`A strong ending shows how the moment changed you or what you learned, without preaching. You might end with a final action, a thought, or a line of dialogue.`,tue:`Write 2 possible endings for your story. Pick the one that feels most true.`,wed:`Finish the draft with your ending. Read the whole story aloud to yourself.`,thu:`Read the full story to your parent. Together, make a revision plan with 2–3 changes.`,fw:`What is something you understand now that you didn't a year ago?`},
{f:`Revise & edit`,g:`Capitalization`,gt:`Capitalize the first word of a sentence, names of people and places, days, months, titles, and the word I. Don't capitalize seasons or ordinary nouns.`,s:`Revising changes the ideas and words: add, cut, move, replace. Editing fixes spelling, punctuation, and capitals. Revise first, edit last.`,tue:`Make the revisions from last week's plan. Cut one sentence that doesn't help the story.`,wed:`Edit with your Editing Checklist. Read one sentence at a time, starting from the end, to catch errors.`,thu:`Write or type the final copy of your personal narrative. Give it a title.`,fw:`Write a letter to yourself at the start of this school year.`},
{f:`Review & portfolio`,g:`Review of weeks 1–11`,gt:`Look over your Editing Checklist. Pick the 2 skills that are hardest for you and write one correct example of each.`,s:`A portfolio shows your growth. Choose pieces that show your best work and pieces that show how far you've come.`,tue:`Reread everything you wrote this term. Put a star on your 3 best pieces.`,wed:`Make final fixes to your 3 starred pieces and put them in your portfolio binder.`,thu:`Write a one-paragraph reflection: What did you learn this term? What are you proudest of? What do you want to work on next?`,fw:`Free choice: write about anything you like.`},
{f:`Precise word choice`,g:`Strong verbs & specific nouns`,gt:`"The dog went down the road" is vague. "The beagle trotted down the lane" paints a picture. Swap weak verbs (went, got, said) and general nouns (thing, stuff) for exact ones.`,s:`Writers choose the exact word. Kenneth Grahame doesn't just say the Mole "went"; he scrapes, scratches, and scrambles.`,tue:`Start a word bank in your writer's notebook: collect 20 strong verbs from this week's book.`,wed:`Rewrite this bland paragraph with strong verbs and specific nouns: "The animal went into the place. It got some food. It was good. Then it went home."`,thu:`Choose one piece from your portfolio and upgrade 5 weak words using your word bank.`,fw:`Describe a storm using strong verbs and no adjectives.`},
{f:`Describing a place`,g:`Prepositional phrases`,gt:`A preposition shows position or time: in, under, beside, across, before. A prepositional phrase: "under the old bridge," "beside the river." They help readers see where things are.`,s:`Describe a place with all five senses and a clear order: near to far, left to right, or top to bottom. Decide on one feeling you want the reader to have.`,tue:`Choose a real place. List details for each of the five senses.`,wed:`Draft your place description (1–2 paragraphs) in a clear spatial order.`,thu:`Revise: add 3 prepositional phrases and replace 3 weak words with words from your word bank. Write the final copy.`,fw:`Describe your favorite hiding spot.`},
{f:`Describing a person`,g:`Appositives`,gt:`An appositive renames a noun and is set off by commas: "Mr. Toad, a wealthy and boastful animal, loved motorcars." It packs extra information into one sentence.`,s:`A character sketch shows how a person looks, acts, talks, and what they care about. Actions and words reveal more than a list of traits.`,tue:`Pick a real or invented person. Make four lists: looks, actions, words, and what they care about.`,wed:`Draft a character sketch (1–2 paragraphs). Include one thing the person says.`,thu:`Revise: add 2 appositives. Write the final copy.`,fw:`Describe a grandparent or older friend doing something they love.`},
{f:`Poetry: imagery`,g:`Similes & metaphors`,gt:`A simile compares using like or as: "The moon was like a silver coin." A metaphor says one thing is another: "The moon was a silver coin."`,s:`Poems are built from images, pictures made of words. Read a poem slowly, twice. What do you see, hear, or feel?`,tue:`Read 3 poems aloud. Find 2 similes or metaphors and copy them into your notebook.`,wed:`Brainstorm 10 similes or metaphors about one thing in nature (a tree, rain, the sun).`,thu:`Write an image poem (8–12 lines) using your best comparisons. It doesn't need to rhyme.`,fw:`Write about the view from your window as if you'd never seen it before.`},
{f:`Poetry: form`,g:`Line breaks & punctuation in poetry`,gt:`Where a line ends tells the reader to pause. Poems can use regular punctuation or very little. Choose on purpose, and read your poem aloud to hear the breaks.`,s:`Haiku: 3 lines of 5-7-5 syllables about one moment in nature. Cinquain: 5 lines of 2-4-6-8-2 syllables. Quatrain: 4 lines, often rhyming ABAB or AABB.`,tue:`Write 3 haiku about things you can see outdoors today.`,wed:`Write a cinquain about an animal.`,thu:`Write a rhyming quatrain (or two) about a season. Copy your best three poems neatly.`,fw:`Write a list poem: "10 things in my pockets (real or imaginary)."`},
{f:`Poetry: sound`,g:`Personification & alliteration`,gt:`Personification gives human actions to things: "The wind whispered." Alliteration repeats first sounds: "silver sliding stream."`,s:`Poems are made to be heard. Rhythm, rhyme, and repeated sounds make them musical. Choose a classic poem to memorize this week, such as Frost's "Stopping by Woods on a Snowy Evening."`,tue:`Learn the first stanza of your memory poem. Find any personification or alliteration in it.`,wed:`Write a nature poem that uses personification and alliteration.`,thu:`Recite your memorized poem to the family. Add your best poems to your portfolio.`,fw:`Give an ordinary object a voice. What would it say?`},
{f:`Story: character & conflict`,g:`Paragraphing dialogue`,gt:`Each time a new person speaks, start a new paragraph. It keeps readers from getting lost in a conversation.`,s:`Every story needs a character who wants something and an obstacle in the way. The struggle between them is the conflict.`,tue:`Think about this week's chapters: What does Jim want? What stands in his way? Tell your parent.`,wed:`Plan your own story: main character (name, age, one trait), what they want, what stops them, and the setting.`,thu:`Write a short conversation between your character and someone who stands in their way. Paragraph it correctly.`,fw:`Write about a character who finds something they shouldn't have.`},
{f:`Story: plot & pacing`,g:`Participial phrases`,gt:`A participial phrase starts with an -ing or -ed verb and describes a noun: "Clutching the map, Jim crept forward." Put a comma after it, and make sure it describes the right person.`,s:`A plot climbs from the beginning through rising action to the climax (the biggest moment), then comes down to the ending. Slow down at the climax; move quickly through small moments.`,tue:`Draw a plot mountain for your story and label 5 events on it.`,wed:`Draft the beginning and the rising action.`,thu:`Draft the climax and ending. Slow down the climax with detail and dialogue.`,fw:`Write the moment right before something big happens.`},
{f:`Story: revise & publish`,g:`Semicolons`,gt:`A semicolon joins two closely related complete sentences without "and" or "but": "The ship rocked; the sailors held on." Both sides must be complete sentences.`,s:`Revise with questions: Is the conflict clear? Does the climax feel exciting? Does the ending settle the conflict? Then edit with your checklist.`,tue:`Read your story aloud to your parent. Together, pick 2–3 revisions.`,wed:`Revise and edit. Try using one semicolon correctly.`,thu:`Write the final copy with a title and read it aloud to the family.`,fw:`Write a new ending for a story you know well.`},
{f:`Informative essay: thesis & outline`,g:`Colons & lists`,gt:`Use a colon after a complete sentence to introduce a list: "A garden needs three things: sun, water, and good soil." Don't use one right after "are" or "include."`,s:`An informative essay explains how or why something works. The thesis is one sentence that gives the main point and 3 subtopics. Each body paragraph covers one subtopic.`,tue:`Choose a topic you know well (how bread rises, why leaves change color, how a bike works). List everything you know about it.`,wed:`Write a thesis with 3 subtopics. Outline each one: a topic sentence plus 3 details.`,thu:`Draft the introduction: a hook, some background, and your thesis.`,fw:`Explain something you know that most adults don't.`},
{f:`Informative essay: draft & revise`,g:`Active vs. passive voice`,gt:`Active: "The cat chased the mouse." Passive: "The mouse was chased by the cat." Active is usually clearer and stronger. Watch for "was ___ by."`,s:`Each body paragraph opens with a topic sentence and gives facts, examples, or steps. The conclusion restates the main idea in new words and leaves a final thought.`,tue:`Draft body paragraphs 1 and 2.`,wed:`Draft body paragraph 3 and the conclusion.`,thu:`Revise: change passive sentences to active and check your transitions. Edit, then write the final copy.`,fw:`Why do you think people like to collect things?`},
{f:`Review & portfolio`,g:`Review of weeks 13–23`,gt:`Look over your Editing Checklist. Pick the 2 skills that are hardest for you and write one correct example of each.`,s:`Compare your Term 2 writing with Term 1. Look for stronger words, more varied sentences, and cleaner editing.`,tue:`Reread everything you wrote this term. Put a star on your 3 best pieces.`,wed:`Make final fixes to your 3 starred pieces and add them to your portfolio.`,thu:`Write a one-paragraph reflection on how your writing has grown since Term 1.`,fw:`Free choice: write about anything you like.`},
{f:`Choosing a research question`,g:`Capitalizing & punctuating titles`,gt:`Capitalize the important words in titles. Italicize or underline book titles (Treasure Island). Put short works like poems and articles in quotation marks ("The Road Not Taken").`,s:`Good research starts with a question you're curious about. Pick a topic from history, science, or nature study, then narrow it: not "oceans" but "How do tides work?"`,tue:`Brainstorm 5 topics you're curious about. Narrow each one to a question.`,wed:`Choose one topic and write 3 guiding questions you want to answer.`,thu:`Make a two-column chart: what I already know, and what I want to find out.`,fw:`What invention would you like to know more about?`},
{f:`Finding & judging sources`,g:`Quotation marks for exact words`,gt:`When you use an author's exact words, put them in quotation marks and name the source. Everything else must be in your own words.`,s:`Find 3–4 sources: books, an encyclopedia, and a reliable website (a museum, university, government, or established organization). Ask: Who wrote this? Is it up to date? Does it agree with other sources?`,tue:`Visit the library, or search with your parent, and gather 3–4 sources.`,wed:`Make a source card for each one: title, author, publisher or website, and date.`,thu:`Rate each source as trustworthy, maybe, or not. Write one sentence explaining each rating.`,fw:`Tell about a time you found out something you believed was wrong.`},
{f:`Note-taking & paraphrase`,g:`Paraphrase vs. quotation`,gt:`A paraphrase restates an idea in your own words and your own sentence pattern. Read, close the book, then write. A quotation uses the exact words, inside quotation marks.`,s:`Take notes on index cards: one fact per card, in your own words, with the source and page number at the bottom.`,tue:`Take 10 note cards from your first source.`,wed:`Take 10 more note cards from your other sources.`,thu:`Choose one paragraph from a source and paraphrase it. Compare it to the original. Is it really in your own words?`,fw:`Explain your research topic to someone who has never heard of it.`},
{f:`Organizing research`,g:`Parallel structure in outlines`,gt:`Keep items in a list in the same form: "swimming, hiking, and biking," not "swimming, to hike, and biking." Outline headings should match each other too.`,s:`Sort your cards into 3–4 piles by subtopic. Each pile becomes one section of your report. Set aside cards that don't fit.`,tue:`Sort your note cards into piles and label each pile.`,wed:`Write an outline: I. Introduction, II–IV. body sections with details, V. Conclusion.`,thu:`Look for gaps in your outline and take extra notes where a section is thin.`,fw:`Write about how you like to organize your things.`},
{f:`Drafting with sources`,g:`Citing sources in the text`,gt:`When you use a fact from a source, name it: "According to the encyclopedia, …" or put the author and page in parentheses at the end: (Latham 45).`,s:`Draft one section at a time, following your outline and cards. Turn notes into sentences and connect them with transitions.`,tue:`Draft your introduction: a hook, background, and a thesis that tells what the report covers.`,wed:`Draft your body sections.`,thu:`Draft your conclusion: sum up what you learned and why it matters.`,fw:`What surprised you most in your research?`},
{f:`Revising & source list`,g:`Using your Editing Checklist`,gt:`Use your whole Editing Checklist this week. You've built it all year. Check for one skill at a time as you read.`,s:`A works-cited list names every source, in alphabetical order by the author's last name: Author. Title. Publisher, Year.`,tue:`Revise: read the report aloud. Is every section clear? Is every borrowed fact cited?`,wed:`Edit with your checklist and write your works-cited list.`,thu:`Write the final copy with a title page and works-cited list. Share it with your family.`,fw:`What would you research next if you could?`},
{f:`Argument: claim & reasons`,g:`Pronoun case (I/me, who/whom)`,gt:`Use I, he, she, we, they, who as subjects and me, him, her, us, them, whom as objects. Trick: drop the other person. "Mom and me went" becomes "me went"? No: "Mom and I went."`,s:`An argument takes a side on a question people disagree about and backs it up with reasons. The claim is one clear sentence: "Every family should keep a garden."`,tue:`Read a short speech or letter to the editor. Find the claim and the reasons.`,wed:`Choose a debatable question. Write your claim and 3 reasons.`,thu:`For each reason, write why it would convince someone who disagrees with you.`,fw:`What is something people argue about that you think is silly?`},
{f:`Argument: evidence`,g:`Subject–verb agreement`,gt:`Singular subjects take singular verbs: "The box of apples is heavy" (the box is). Don't be fooled by the words in between.`,s:`Evidence makes reasons believable: facts, numbers, examples, and quotes from experts. After each piece of evidence, explain how it supports your reason.`,tue:`Find 2 pieces of evidence for each of your reasons.`,wed:`Draft your introduction and first body paragraph.`,thu:`Draft body paragraphs 2 and 3.`,fw:`Convince your family to try your favorite food.`},
{f:`Argument: counterargument`,g:`Commas with nonessential clauses`,gt:`If a clause adds extra information that could be removed, set it off with commas: "My brother, who is ten, loves chess." If it's needed to tell which one, use no commas: "The boy who won is my brother."`,s:`Strong arguments are fair. State the best point the other side would make, then answer it: "Some people say ___. However, ___."`,tue:`Write down the strongest reason someone might disagree with you.`,wed:`Draft your counterargument paragraph: state the other side fairly, then answer it.`,thu:`Draft your conclusion: restate your claim and end with a call to action.`,fw:`Argue the opposite of something you believe.`},
{f:`Argument: revise & deliver`,g:`Dashes & parentheses`,gt:`A dash adds emphasis or a sudden break: "We had one choice — run." Parentheses add quieter extra information: "The trip (our first) was long."`,s:`Speeches work best with short sentences, repeated key phrases, and pauses. Practice looking up at your listeners.`,tue:`Revise your essay with your parent. Check that every reason has evidence.`,wed:`Edit and write the final copy.`,thu:`Deliver your essay as a speech to your family.`,fw:`Write about a time someone changed your mind.`},
{f:`Capstone: choice piece`,g:`Editing on your own`,gt:`You are your own editor now. Use your Editing Checklist without help.`,s:`Choose any form you learned this year: a story, a poem collection, a report, an essay, or a letter. Plan it the way you learned for that form.`,tue:`Choose your form and topic. Make a plan (an outline, a plot mountain, or a list).`,wed:`Draft your piece.`,thu:`Revise, edit, and write the final copy.`,fw:`Free choice.`},
{f:`Celebration & portfolio`,g:`Year in review`,gt:`Look at your whole Editing Checklist. Put a star next to every skill you now use without thinking about it.`,s:`Look back at the whole year. Compare your first narration from Week 1 with your writing now.`,tue:`Choose pieces to read at read-aloud night and practice reading them aloud.`,wed:`Assemble your final portfolio: your best pieces from each term, with their rubrics.`,thu:`Write your year-end reflection, then hold read-aloud night.`,fw:`What kind of writer are you now?`}
];
function unitOf(w){
  if(w<=3)return"Narration & the complete sentence"; if(w<=6)return"The strong paragraph"; if(w<=11)return"Personal narrative";
  if(w===12)return"Term 1 review & portfolio"; if(w<=15)return"Descriptive writing & word choice"; if(w<=18)return"Poetry";
  if(w<=21)return"Short story"; if(w<=23)return"Informative essay"; if(w===24)return"Term 2 review & portfolio";
  if(w<=30)return"Research report"; if(w<=34)return"Persuasive essay"; if(w===35)return"Capstone"; return"Year-end celebration";
}
function bookOf(w){
  if(w<=6)return"<i>Farmer Boy</i> (Laura Ingalls Wilder)"; if(w<=12)return"<i>Little Britches</i> (Ralph Moody)";
  if(w<=15)return"<i>The Wind in the Willows</i> (Kenneth Grahame)"; if(w<=18)return"<i>A Child's Garden of Verses</i> and your poetry anthology";
  if(w<=24)return"<i>Treasure Island</i> (Robert Louis Stevenson)"; if(w<=30)return"<i>Carry On, Mr. Bowditch</i> (Jean Lee Latham)";
  if(w<=34)return"<i>My First Summer in the Sierra</i> (John Muir) and famous short speeches"; return"a favorite book from this year";
}
const termOf=w=>w<=12?1:w<=24?2:3;
const poetry=w=>w>=16&&w<=18;

function stepsFor(w,d){
  const x=W[w-1], book=bookOf(w);
  const S=[];
  if(d===0){
    S.push({k:"Copywork",t:"Copy a passage slowly and exactly",min:10,body:`<p>Open your copywork notebook. Copy the passage your parent marked from ${book}.</p><ul><li>Look at a whole phrase, then write it without peeking.</li><li>Copy every comma, capital, and quotation mark.</li><li>When you finish, check each word against the book.</li></ul>`});
    if(poetry(w)){
      S.push({k:"Read",t:"Read two or three poems aloud",body:`<p>Read 2–3 poems from ${book}. Read each one slowly, twice, out loud.</p>`});
      S.push({k:"Narrate",t:"Tell back one poem",body:`<p>Close the book. Tell your parent what one poem was about and what picture it made in your mind.</p>`});
      S.push({k:"Written narration",t:"Write about the poem",min:15,body:`<p>Write a few sentences about the poem: what happens in it and how it made you feel. Then copy your favorite line.</p><p class="muted">This week's focus: ${x.f}.</p>`});
    }else{
      S.push({k:"Read",t:"Read the next section",body:`<p>Read the next chapter or section of ${book}, or listen while your parent reads it aloud.</p>`});
      S.push({k:"Narrate",t:"Tell it back aloud",body:`<p>Close the book. Tell back everything you remember, in order and in your own words. Use names and important words from the story.</p>`});
      S.push({k:"Written narration",t:w===1?"Write 5–7 sentences":"Write one narration paragraph",min:15,body:`<p>${w===1?"Write your narration in 5–7 sentences.":"Write a one-paragraph narration (5–8 sentences) of what you read."} Start with who and where, then tell what happened in order.</p><p class="muted">This week's focus: ${x.f}.</p>`});
    }
  }
  if(d===1){
    S.push({k:"Grammar spotlight",t:x.g,tip:x.gt,body:`<p>Read the tip below with your parent. Say an example of your own out loud.</p>`});
    S.push({k:"Grammar hunt",t:"Find it in your copywork",body:`<p>Look at Monday's copywork passage. Find an example of <b>${x.g.toLowerCase()}</b> and underline it. If there isn't one, find one in ${book}.</p>`});
    S.push({k:"Grammar practice",t:"Write three sentences",min:8,body:`<p>Write 3 sentences of your own that use <b>${x.g.toLowerCase()}</b> correctly.</p>`});
    S.push({k:"Skill lesson",t:x.f,tip:x.s,tipLabel:"Mini-lesson",body:`<p>Read the mini-lesson with your parent. Talk about how the author of ${book} does this.</p>`});
    S.push({k:"Try it",t:"Practice the skill",min:15,body:`<p>${x.tue}</p>`});
  }
  if(d===2){
    S.push({k:"Dictation · study",t:"Study the passage",min:5,body:`<p>Your parent will choose a short passage (it can be Monday's copywork). Read it and notice:</p><ul><li>Tricky spellings</li><li>Commas, capitals, and quotation marks</li><li>Where each sentence starts and ends</li></ul>`});
    S.push({k:"Dictation · write",t:"Write it from dictation",body:`<p>Close the book. Your parent reads the passage aloud <b>one phrase at a time, only once</b>. Write each phrase carefully.</p>`});
    S.push({k:"Dictation · check",t:"Check and correct",body:`<p>Open the book and compare your copy word by word. Circle each mistake and write the word correctly above it.</p>`});
    S.push({k:"Composition",t:"Main writing work",min:20,body:`<p>${x.wed}</p><p class="muted">Unit: ${unitOf(w)}.</p>`});
  }
  if(d===3){
    S.push({k:"Free write",t:"Ten minutes, no stopping",min:10,body:`<p>Prompt: <b>${x.fw}</b></p><p>Keep your pencil moving the whole time. This one is never graded, and spelling doesn't count.</p>`});

function weekDone(stu,w){ return [0,1,2,3].filter(d=>isDone(stu,w,d)).length; }

function nextLesson(stu){ for (let w=1;w<=36;w++) for (let d=0;d<4;d++) if (!isDone(stu,w,d)) return {w,d}; return null; }

/* ============ GRAMMAR CHECKS ============ */
const REVIEW = {12:[1,11,10], 24:[13,23,10], 30:[25,29,10], 35:[31,34,10], 36:[1,34,20]};
function quizKind(w){ return w===36 ? "final" : REVIEW[w] ? "review" : "check"; }
function kindLabel(k){ return k==="final" ? "Final grammar exam" : k==="review" ? "Grammar review" : "Grammar check"; }
function quizPool(w){
  if (GQ[w]) return GQ[w];
  const [a,b] = REVIEW[w]; let pool = [];
  for (let x=a;x<=b;x++) if (GQ[x]) pool = pool.concat(GQ[x]);
  return pool;
}
function quizLen(w){ return GQ[w] ? GQ[w].length : REVIEW[w][2]; }
function quizTopic(w){ if (GQ[w]) return W[w-1].g; const [a,b] = REVIEW[w]; return `Mixed questions from weeks ${a}–${b}`; }

/* ============ SCORING, STARS, BADGES ============ */
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const starsFor = p => p>=90?3:p>=75?2:p>=60?1:0;
const starStr = (n, max=3) => `<span class="stars" aria-label="${n} of ${max} stars">${"★".repeat(n)}<span class="off">${"★".repeat(max-n)}</span></span>`;
function rs(stu, w){ return results.filter(r => r.student===stu && r.week===w); }
function best(stu, w){ const a = rs(stu,w); return a.length ? Math.max(...a.map(r => r.pct)) : null; }
function bestStars(stu, w){ const b = best(stu,w); return b==null ? 0 : starsFor(b); }
function rubricOf(stu, pid){ return ((rubrics[stu]||{})[pid]) || null; }
function rubricTotal(r){ return r && r.s && r.s.every(v=>v>0) ? r.s.reduce((a,b)=>a+b,0) : null; }
function rubricPct(r){ const t = rubricTotal(r); return t==null ? null : pct(t,20); }
function starTotal(stu){
  let t = lessonsDoneCount(stu);
  for (let w=1;w<=36;w++) t += bestStars(stu,w);
  PIECES.forEach(p => { const q = rubricPct(rubricOf(stu,p.id)); if (q!=null) t += starsFor(q); });
  return t;
}
const STAR_MAX = TOTAL + 36*3 + PIECES.length*3;
function termLessons(stu,t){ let n=0; for (let w=(t-1)*12+1; w<=t*12; w++) n += weekDone(stu,w); return n; }
function badges(stu){
  const mine = results.filter(r=>r.student===stu), st = starTotal(stu);
  const pieceAt = (pid,min) => { const t = rubricTotal(rubricOf(stu,pid)); return t!=null && t>=min; };
  const list = [
    ["First Steps","Finish your first lesson", lessonsDoneCount(stu)>=1],
    ["Term 1 Complete","Finish all 48 lessons in Term 1", termLessons(stu,1)===48, "--t1"],
    ["Term 2 Complete","Finish all 48 lessons in Term 2", termLessons(stu,2)===48, "--t2"],
    ["Term 3 Complete","Finish all 48 lessons in Term 3", termLessons(stu,3)===48, "--t3"],
    ["Grammar Guru","Get 100% on any grammar check", mine.some(r=>r.pct===100)],
    ["Hot Streak","Answer 5 grammar questions in a row correctly", mine.some(r=>(r.bestStreak||0)>=5)],
    ["Poet","Finish every lesson in the poetry weeks (16–18)", [16,17,18].every(w=>weekDone(stu,w)===4), "--t2"],
    ["Published Author","Score 15 or more out of 20 on your short story", pieceAt("p6",15), "--t2"],
    ["Researcher","Score 15 or more out of 20 on your research report", pieceAt("p8",15), "--t3"],
    ["Star Collector","Earn 50 stars", st>=50],
    ["Graduate","Score 80%+ on the final grammar exam", (best(stu,36)||0)>=80]
  ];
  return list.map(([name,how,got,color]) => ({name,how,got,color}));
}

/* ============ FUN: SOUND + CONFETTI ============ */
let actx = null;
function tone(freqs, dur=0.12){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur*1.6);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur*1.8); });
  }catch(e){}
}
const sfx = { right:()=>tone([660,880]), wrong:()=>tone([220,180],.15), star:()=>tone([523,659,784,1047],.1), click:()=>tone([520],.05), done:()=>tone([392,523],.08) };
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1, Wd = innerWidth, H = innerHeight; cv.width = Wd*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols = ["#E57C52","#E0B23C","#8DBB57","#8C9CF0","#3FBFA8","#B48AE6","#F2B705"];
  const bits = Array.from({length:140},()=>({x:Math.random()*Wd,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],s:6+Math.random()*6}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,Wd,H);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore(); });
    if (t-t0 < 3200) requestAnimationFrame(f); else cv.remove(); })(t0);
}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ TIMER ============ */
let timer = {left:0,total:0,run:false,h:null};
function stopTimer(){ clearInterval(timer.h); timer.h = null; timer.run = false; }
function resetTimer(min){ stopTimer(); timer.total = (min||0)*60; timer.left = timer.total; }
const fmtClock = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function paintTimer(){
  const el = document.querySelector(".timer"); if (!el) return;
  el.querySelector(".clock").textContent = timer.left>0 ? fmtClock(timer.left) : "Time!";
  el.classList.toggle("over", timer.left<=0);
  el.querySelector("[data-t=go]").textContent = timer.run ? "Pause" : (timer.left<timer.total && timer.left>0 ? "Resume" : "Start timer");
}
function toggleTimer(){
  if (timer.run) stopTimer();
  else { if (timer.left<=0) timer.left = timer.total; timer.run = true;
    timer.h = setInterval(()=>{ timer.left--; if (timer.left<=0){ timer.left=0; stopTimer(); sfx.done(); } paintTimer(); },1000); }
  paintTimer();
}

function openWeek(w, d){
  if (d===undefined){ d = 0; if (student){ const nd = [0,1,2,3].find(i=>!isDone(student,w,i)); d = nd===undefined ? 0 : nd; } }
  const step = d==="g" ? 0 : (student ? firstOpenStep(student,w,d) : 0);
  go({page:"week", week:w, day:d, step});
  if (d!=="g") { resetTimer(stepsFor(w,d)[step].min); paintTimer(); }
}
function setStep(i){ view.step = i; view.finished = false; resetTimer(stepsFor(view.week,view.day)[i].min); render(); }

function dayPanel(w, d){
  const steps = stepsFor(w,d), chk = student ? stepsChecked(student,w,d) : steps.map(()=>false);
  const done = student && isDone(student,w,d);
  const dots = steps.map((s,i)=>`<button data-step="${i}" class="${chk[i]?"on":""}" aria-current="${i===view.step&&!view.finished}" aria-label="Step ${i+1}: ${esc(s.t)}${chk[i]?" (done)":""}">${chk[i]?"✓":i+1}</button>`).join("");
  const head = `<div class="dayhead"><span class="kind">${DAYS[d]} · Lesson ${d+1} of 4</span><div class="stepdots">${dots}</div></div>`;
  if (view.finished){
    const at = ((prog[student]||{}).done||{})[lessonId(w,d)];
    const nx = nextLesson(student);
    return `<div class="inner">${head}<div class="finish">
      <div class="bigstars"><span class="on">★</span></div>
      <h2>${DAYS[d]}'s lesson is done!</h2>
      <p class="got">You earned a star${at?" on "+esc(fmtDay(at)):""}.</p>
      <p class="note" style="margin:0">Put today's pages in your writer's notebook folder.</p>
      <div class="ctrl" style="justify-content:center">${nx?`<button class="btn big" id="nextl">Next: Week ${nx.w}, ${DAYS[nx.d]} →</button>`:""}<button class="btn ghost" id="revl">Look back at the steps</button></div>
    </div></div>`;
  }
  const s = steps[view.step], isChk = chk[view.step], last = view.step===steps.length-1;
  const nextLabel = done ? (last ? "Back to summary" : "Next step") : (last ? (isChk ? "Finish lesson" : "Done — finish lesson") : (isChk ? "Next step" : "Done, next step"));
  return `<div class="inner">${head}
    <div class="page">
      <span class="stepkind">Step ${view.step+1} of ${steps.length} · ${esc(s.k)}${s.min?` · about ${s.min} min`:""}</span>
      <h3>${esc(s.t)}</h3>
      ${s.tip?`<div class="tipbox"><b>${s.tipLabel||"Grammar tip"}</b>${esc(s.tip)}</div>`:""}
      ${s.body}
      ${s.min?`<div class="timer"><span class="clock">${fmtClock(timer.left)}</span><button class="btn ghost small" data-t="go">Start timer</button><button class="btn ghost small" data-t="reset">Reset</button></div>`:""}
    </div>
    <div class="lessonnav">
      <button class="btn ghost" id="sback" ${view.step===0?"disabled":""}>Back</button>
      ${isChk&&!done?`<button class="linkbtn" id="uncheck">Uncheck this step</button>`:""}
      ${done?`<button class="linkbtn" id="redo">Redo this lesson</button>`:""}
      <button class="btn" id="snext">${nextLabel}</button>
    </div></div>`;
}
function wireDay(w, d){
  app.querySelectorAll("[data-step]").forEach(b => b.onclick = () => setStep(+b.dataset.step));
  const q = id => document.getElementById(id);
  if (q("nextl")) q("nextl").onclick = () => { const nx = nextLesson(student); openWeek(nx.w, nx.d); };
  if (q("revl")) q("revl").onclick = () => setStep(0);
  if (q("sback")) q("sback").onclick = () => setStep(view.step-1);
  const tg = app.querySelector("[data-t=go]"); if (tg) tg.onclick = toggleTimer;
  const tr = app.querySelector("[data-t=reset]"); if (tr) tr.onclick = () => { resetTimer(stepsFor(w,d)[view.step].min); paintTimer(); };
  if (q("uncheck")) q("uncheck").onclick = () => { const p = P(); const id = lessonId(w,d); const a = stepsChecked(student,w,d); a[view.step] = false; p.steps[id] = a; saveAll(); render(); };
  if (q("redo")){ let armed = false; q("redo").onclick = e => {
    if (!armed){ armed = true; e.currentTarget.textContent = "Yes, clear this lesson's checkmarks"; return; }
    const p = P(), id = lessonId(w,d); delete p.done[id]; delete p.steps[id]; saveAll(); renderStarChip(); setStep(0); }; }
  if (q("snext")) q("snext").onclick = () => {
    if (needStudent()) return;
    const n = stepsFor(w,d).length, id = lessonId(w,d), p = P();
    if (isDone(student,w,d)){ if (view.step===n-1){ view.finished = true; stopTimer(); render(); } else setStep(view.step+1); return; }
    const a = stepsChecked(student,w,d); a[view.step] = true; p.steps[id] = a;
    if (a.every(Boolean)){
      const before = badges(student).filter(b=>b.got).map(b=>b.name);
      p.done[id] = new Date().toISOString(); delete p.steps[id]; saveAll(); renderStarChip();
      view.finished = true; stopTimer(); sfx.star(); confetti(); render();
      const nb = badges(student).filter(b=>b.got && !before.includes(b.name));
      if (nb.length){ const f = app.querySelector(".finish"); if (f) f.insertAdjacentHTML("beforeend", `<div class="newbadge">New badge: <b>${nb.map(b=>esc(b.name)).join(", ")}</b></div>`); }
      return;
    }
    saveAll(); sfx.click();
    let nx = a.findIndex((v,i)=>!v && i>view.step); if (nx<0) nx = a.indexOf(false);
    setStep(nx);
  };
}

/* ---------- quiz ---------- */
function startQuiz(w){
  if (needStudent()) return;
  const pool = quizPool(w), n = quizLen(w);
  const qs = (GQ[w] ? shuffle(pool) : shuffle(pool).slice(0,n)).map(prepQ);
  go({page:"quiz", week:w, qs, i:0, picks:Array(qs.length).fill(null), checked:false, streak:0, bestStreak:0});
}
function renderQuiz(){
  const v = view, Q = v.qs[v.i], c = termColor(v.week), picked = v.picks[v.i];
  app.innerHTML = `<div class="quiz" style="--c:${c}">
    <div class="qhead"><span class="kind">${esc(kindLabel(quizKind(v.week)))} · Week ${v.week}</span><span class="eyebrow">Question ${v.i+1} of ${v.qs.length}</span></div>
    <div class="meter"><i style="width:${pct(v.i+(v.checked?1:0), v.qs.length)}%"></i></div>
    ${v.streak>=3?`<div class="streak">${v.streak} in a row!</div>`:""}
    <div class="qcard" id="qcard">
      <p class="qtext">${esc(Q.q)}</p>
      <div class="choices">${Q.choices.map((ch,i)=>{
        let cls = "choice"; if (v.checked){ if (i===Q.answer) cls += " right"; else if (i===picked) cls += " wrong"; } else if (i===picked) cls += " picked";
        return `<button class="${cls}" data-c="${i}" ${v.checked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(ch)}</span></button>`; }).join("")}</div>
      ${v.checked?`<div class="explain ${picked===Q.answer?"ok":"no"}"><strong>${picked===Q.answer?"Correct!":"Not quite. The answer is "+"ABCD"[Q.answer]+"."}</strong>${esc(Q.why)}</div>`:""}
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Stop</button>
      ${v.checked?`<button class="btn" id="qnext">${v.i===v.qs.length-1?"See my score":"Next question"}</button>`:`<button class="btn" id="qcheck" ${picked==null?"disabled":""}>Check answer</button>`}</div>
  </div>`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { v.picks[v.i] = +b.dataset.c; sfx.click(); renderQuiz(); });
  $("#quit").onclick = () => openWeek(v.week, "g");
  if ($("#qcheck")) $("#qcheck").onclick = () => {
    v.checked = true;
    if (v.picks[v.i]===Q.answer){ v.streak++; v.bestStreak = Math.max(v.bestStreak, v.streak); sfx.right(); }
    else { v.streak = 0; sfx.wrong(); }
    renderQuiz();
    if (v.picks[v.i]!==Q.answer){ const qc = $("#qcard"); qc.classList.add("shake"); }
  };
  if ($("#qnext")) $("#qnext").onclick = () => { if (v.i===v.qs.length-1) finishQuiz(); else { v.i++; v.checked = false; renderQuiz(); window.scrollTo({top:0}); } };
}
function finishQuiz(){
  const v = view, before = badges(student).filter(b=>b.got).map(b=>b.name);
  const score = v.qs.reduce((a,Q,i)=>a+(v.picks[i]===Q.answer?1:0),0), p = pct(score, v.qs.length);
  const prevBest = best(student, v.week);
  const r = { id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), student, week:v.week, kind:quizKind(v.week), score, total:v.qs.length, pct:p, stars:starsFor(p), bestStreak:v.bestStreak, at:new Date().toISOString(),
    items: v.qs.map((Q,i)=>({q:Q.q, choices:Q.choices, answer:Q.answer, picked:v.picks[i]})) };
  results.push(r); saveAll(); renderStarChip();
  const newBadges = badges(student).filter(b=>b.got && !before.includes(b.name));
  go({page:"done", r, newBadges, improved: prevBest==null || p>prevBest });
  if (r.stars) { sfx.star(); if (r.stars===3) confetti(); }
}
function renderDone(){
  const {r,newBadges} = view, c = termColor(r.week);
  const msg = r.pct>=90 ? "Outstanding!" : r.pct>=75 ? "Great work!" : r.pct>=60 ? "Good job. Keep practicing!" : "Let's review and try again.";
  app.innerHTML = `<div class="quiz" style="--c:${c}">
    <div class="result"><span class="eyebrow">${esc(kindLabel(r.kind))} · Week ${r.week}</span>
      <div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=r.stars?"on":""}" style="animation-delay:${i*.18}s">★</span>`).join("")}</div>
      <div class="big">${r.pct}%</div><div class="sub">${r.score} of ${r.total} correct · grade ${grade(r.pct)}</div>

    </div>
    <div class="ctrl" style="justify-content:center;margin-bottom:18px"><button class="btn" id="again">Try again</button><button class="btn ghost" id="toweek">Back to week ${r.week}</button></div>
    <div class="section-h"><h2>Review</h2></div>
    <div class="review">${r.items.map(Q=>{ const ok = Q.picked===Q.answer; return `<div class="item ${ok?"":"miss"}"><p class="q">${esc(Q.q)}</p>
      <p>${ok?"✓":"✗"} You picked: ${esc(Q.choices[Q.picked]??"(no answer)")}</p>${ok?"":`<p class="muted">Correct answer: <b>${esc(Q.choices[Q.answer])}</b></p>`}</div>`; }).join("")}</div>

  $("#again").onclick = () => startQuiz(r.week);

    app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
      const r = ensure(b.dataset.p); r.s[+b.dataset.t] = +b.dataset.l; r.at = new Date().toISOString(); saveAll(); renderStarChip();
      const y = window.scrollY; view = {page:"parent", tab:"rubrics", who, open:b.dataset.p}; render(); window.scrollTo({top:y});
    });
    app.querySelectorAll("[data-note]").forEach(t => t.onchange = () => { const r = ensure(t.dataset.note); r.note = t.value.slice(0,500); saveAll(); });
  }
  if (tab==="manage"){
    const data = {v:1, app:"g6writing", roster, results, prog, rubrics};
    let code = ""; try{ code = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }catch(e){}
    $("#bk").value = code;
    $("#bkcopy").onclick = () => { const ta = $("#bk");
      const fallback = () => { ta.select(); $("#bkmsg").textContent = "Selected. Press copy."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>{ $("#bkmsg").textContent = "Copied."; }, fallback); else fallback(); };
    let armed = false;
    $("#rsgo").onclick = () => {
      let d; try{ d = JSON.parse(decodeURIComponent(escape(atob($("#rsin").value.trim())))); }catch(e){ $("#rsmsg").textContent = "That code isn't a valid backup."; return; }
      if (!d || !Array.isArray(d.results) || d.app!=="g6writing"){ $("#rsmsg").textContent = "That code isn't a writing backup."; return; }
      if (!armed){ armed = true; $("#rsgo").textContent = "Yes, replace everything"; $("#rsmsg").textContent = "This replaces all writing progress on this device."; return; }
      roster = d.roster||[]; results = d.results; prog = d.prog||{}; rubrics = d.rubrics||{}; saveAll(); renderRoster();
      $("#rsmsg").textContent = "Restored."; armed = false; $("#rsgo").textContent = "Restore";
    };
    $("#pinsave").onclick = () => { const v = $("#newpin").value.trim(); if (!/^\d{4}$/.test(v)){ $("#pinmsg").textContent = "Use exactly 4 digits."; return; } pin = v; LS.set("g6-pin", pin); $("#pinmsg").textContent = "PIN changed."; $("#newpin").value=""; };
    app.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
      const n = b.dataset.reset;
      if (b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = `Yes, erase ${n}'s writing progress`; $("#resetmsg").textContent = `This erases all of ${n}'s lessons, grammar scores, and writing scores in this app.`; return; }
      results = results.filter(r=>r.student!==n); delete prog[n]; delete rubrics[n]; saveAll(); renderStarChip();
      $("#resetmsg").textContent = `${n}'s writing progress was reset.`; b.textContent = `Reset ${n}`; b.dataset.armed = "";
    });
  }
}

renderRoster();
if (student) LS.set("g6w-student", student);
if (!localStorage.getItem("g6w-roster")) saveAll();
render();
(async () => {
  const saved = await IDB.get();
  if (!saved) { IDB.put(snapshot()); return; }
  const g = (k,d) => { try{ return saved[k] ? JSON.parse(saved[k]) : d; }catch(e){ return d; } };
  const cnt = p => Object.values(p||{}).reduce((a,x)=>a+Object.keys((x&&x.done)||{}).length,0);
  const savedRes = g("g6w-results",[]), savedProg = g("g6w-prog",{});
  if (savedRes.length > results.length || cnt(savedProg) > cnt(prog) || (!roster.length && saved["g6w-roster"])){
    try{ Object.entries(saved).forEach(([k,v]) => localStorage.setItem(k,v)); }catch(e){}
    roster = g("g6w-roster",[]); results = savedRes; prog = savedProg; rubrics = g("g6w-rubrics",{});
    student = g("g6w-student",""); soundOn = g("g6w-sound",true);
    renderRoster(); if (view.page !== "quiz") render();
  } else IDB.put(snapshot());
})();

</script>
