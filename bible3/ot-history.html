<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OT History">

<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Old Testament World – 3rd Grade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EDEA; --ink:#1B2B2F; --muted:#56696B;
  --line:#D3DEDA; --accent:#2A4F9E; --accent-ink:#FFFFFF; --accent-soft:#E1E8F6;
  --gold:#C98A1A; --gold-soft:#FBEBC8; --good:#2E7D4F; --good-soft:#D9F0E2; --bad:#B4432F; --bad-soft:#F7DDD6;
  --sea:#D5E6EC; --land:#EFEBE0; --land-line:#B9B09A; --river:#5E93B0; --pin:#2A4F9E; --maptext:#3B4A4C; --region:#8A8472;
  --paper:#F7F3E8; --paper-line:#E2D8BF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif:"Lora", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
    --line:#2A4043; --accent:#8FB0F0; --accent-ink:#0E1830; --accent-soft:#1E2B45;
    --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
    --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#8FB0F0; --maptext:#DCE6E4; --region:#8C9690;
    --paper:#22241F; --paper-line:#3A3C33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
  --line:#2A4043; --accent:#8FB0F0; --accent-ink:#0E1830; --accent-soft:#1E2B45;
  --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
  --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#8FB0F0; --maptext:#DCE6E4; --region:#8C9690;
  --paper:#22241F; --paper-line:#3A3C33;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.7;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.top .spacer{flex:1}
.stars{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--gold-soft);color:var(--ink);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;color:var(--gold)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h1{font-size:clamp(28px,6vw,40px)}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.next{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:grid;gap:10px;margin-bottom:28px}
.next .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.next h2{font-size:26px}
.next .ref{opacity:.9}
.next button{justify-self:start;background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.group{margin-bottom:26px}
.group h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group h3 .cnt{letter-spacing:0;text-transform:none;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px}
details.group > summary{cursor:pointer;list-style:none;margin-bottom:10px}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary h3::before{content:"▸";margin-right:8px;color:var(--accent)}
details.group[open] > summary h3::before{content:"▾"}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:grid}
.path li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.stone.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.stone.here{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.path li:not(:last-child) .col::after{content:"";display:block;width:2px;height:22px;background:var(--line);margin:4px auto}
.col{display:grid;justify-items:center}
.lessonbtn{background:none;border:0;text-align:left;color:var(--ink);padding:6px 0 18px;display:grid;gap:2px}
.lessonbtn .t{font-weight:700;font-size:18px;line-height:1.3}
.lessonbtn .r{font-size:14px;color:var(--muted)}
.lessonbtn .sc{font-size:13px;color:var(--good);font-weight:700}

.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;margin-bottom:12px}
.lhead{display:grid;gap:6px;margin-bottom:16px}
.lhead .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lhead h1{font-size:clamp(28px,6vw,40px)}
.lhead .era{color:var(--muted);font-weight:700}
.pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pair .lbl{font-size:13px;color:var(--muted);display:block}
.pair .pt{font-weight:700}
.pair > div{flex:1;min-width:180px}
.intro{font-size:19px;line-height:1.55;margin:0 0 18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:10px}
.card h3{font-size:20px;margin:18px 0 6px}
.card h3:first-of-type{margin-top:4px}
.card p{margin:0 0 12px;max-width:65ch}
.card p:last-child{margin-bottom:0}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--good)}

.mapbox{margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.local{max-width:440px}
.mapbox.sinai{max-width:520px}
.mapcap{font-size:15px;color:var(--muted);margin-top:10px;max-width:62ch}
.m-land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2}
.m-water{fill:var(--sea);stroke:var(--river);stroke-width:1.5}
.m-river{fill:none;stroke:var(--river);stroke-width:2.5;stroke-linecap:round}
.m-region{fill:var(--region);font-family:var(--body);font-weight:700;letter-spacing:.12em}
.m-pin{fill:var(--pin);stroke:var(--land);stroke-width:2.5}
.m-lbl{fill:var(--maptext);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.person b{display:block;font-family:var(--display);font-size:17px;line-height:1.2;margin-bottom:2px}
.person span{font-size:14px;color:var(--muted);line-height:1.4;display:block}

.source{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 20px}
.source h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:2px}
.source .meta{font-size:14px;color:var(--muted);margin-bottom:12px}
.source blockquote{margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;max-width:62ch}
.source .note{font-size:15px;margin:0;max-width:62ch}

.vocab{display:grid;gap:10px;margin:0}
.vocab div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px}
.vocab dt{font-weight:700}
.vocab dd{margin:0;color:var(--ink)}
@media (max-width:520px){ .vocab div{grid-template-columns:1fr;gap:0} }

.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.yr{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.disc{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-left:6px}

.q{margin-bottom:18px}
.q:last-child{margin-bottom:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:15px;margin-top:6px;color:var(--muted)}
textarea{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.assign{background:var(--accent-soft);border-color:transparent}
.finish{text-align:center;display:grid;gap:12px;justify-items:center}
.finish .btn{font-size:18px;padding:12px 22px}
.finish .note{color:var(--muted);font-size:15px}
.celebrate{display:grid;justify-items:center;gap:6px;text-align:center}
.celebrate .starbig{width:64px;height:64px;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .celebrate .starbig{animation:pop .6s ease-out} }
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:84px 24px 1fr;gap:6px;align-items:start;padding:6px 0}
.tl .yr{text-align:right;padding-top:1px}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);margin:5px auto 0;position:relative;z-index:1}
.tl li.locked .dot{background:var(--line)}
.tl li.locked .ev{color:var(--muted);font-style:italic}
.tl .ev b{display:block}
.tl .ev .from{font-size:13px;color:var(--muted)}
.tl li.jesus .dot{background:var(--gold)}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tlhead h2{font-size:24px}
.tlhead span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.foot{margin-top:36px;font-size:12px;color:var(--muted);line-height:1.5}
.settings{display:grid;gap:12px}
.settings label{font-weight:700;display:grid;gap:4px}
.settings input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--muted)}
@media (max-width:480px){ .top{position:static} .card{padding:16px} .brand{font-size:18px} .brand svg{display:none} .tl::before{left:78px} .tl li{grid-template-columns:66px 24px 1fr} .mini li{grid-template-columns:78px 1fr} }
</style>
</head>

  <p class="foot">History lessons written to pair with the Through the Old Testament Bible lessons. Primary sources are paraphrased or closely translated for young readers unless noted. Videos: Drive Thru History: Holy Land (Dave Stotts), streamed free on TBN. Map outlines from Natural Earth.</p>

<script>
const EMBED = {"lessons/exodus.json":[{"id":"exh-01","bible":"exo-01","bibleTitle":"Slaves in Egypt and Two Brave Midwives","title":"Brickmakers of Egypt","era":"About 1500-1250 BC","intro":"The Israelites had to make bricks for Pharaoh. An old Egyptian painting shows workers doing exactly that!","sections":[{"h":"Made of Mud","p":["We think of Egypt's stone pyramids. But most buildings in Egypt, like houses and city walls, were made of mud bricks. Workers mixed mud from the Nile with water and straw, pressed it into wooden molds, and let the bricks dry in the hot sun.","It was hard, hot work, and Egypt needed millions of bricks!"]},{"h":"A Famous Painting","p":["A man named Rekhmire was Pharaoh's top helper. On the walls of his tomb are paintings of people working. One shows workers getting water, mixing mud, shaping bricks, and carrying them, while a boss watches.","Some of the workers look like people from Canaan. It's not a picture of the Israelites, but it shows the same kind of work Exodus talks about."]},{"h":"Store Cities","p":["The Bible says the Israelites built two store cities called Pithom and Rameses. Store cities held grain and supplies. Rameses was a big city in the part of Egypt near Goshen, where the Israelites lived."]}],"people":[{"name":"Rekhmire","role":"Pharaoh's top helper, whose tomb shows brickmakers"},{"name":"Shiphrah and Puah","role":"Brave Hebrew women who protected babies"}],"source":{"title":"Brickmaking scene in the Tomb of Rekhmire","who":"Egyptian tomb painters","date":"About 1450 BC","text":"The painting shows workers getting water from a pool, mixing clay, shaping bricks in wooden molds, and carrying them. A boss holds a stick and watches.","note":"This is what hard work making bricks in Egypt looked like."},"vocab":[["Mud brick","A brick made of mud and straw dried in the sun"],["Store city","A city for keeping grain and supplies"],["Overseer","A boss who watches workers"]],"map":{"view":"sinai","places":["rameses","pithom","memphis_s"],"caption":"Rameses and Pithom were in the part of Egypt near Goshen."},"timeline":[{"y":-1450,"t":"Rekhmire's tomb shows brickmakers"},{"y":-1279,"t":"Pharaoh Ramesses II builds a big city called Pi-Ramesses"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What were most Egyptian buildings made of?","options":["Mud bricks","Wood","Glass"],"answer":0,"why":"Mud, water, and straw!"},{"q":"What did workers mix into the mud?","options":["Sugar","Sand only","Straw"],"answer":2,"why":"Straw made bricks stronger."},{"q":"What does Rekhmire's painting show?","options":["Pharaoh's dog","A big boat","Workers making bricks"],"answer":2,"why":"Hard work in the sun."},{"q":"What cities did the Israelites build?","options":["Pithom and Rameses","Babel and Ur","Rome and Athens"],"answer":0,"why":"Store cities for Pharaoh."}],"assignment":"Make mud bricks! Mix dirt, water, and grass in an ice cube tray. Make some without grass too. Let them dry for a few days. Which ones are stronger?","hope":["The Israelites had to work very hard for Pharaoh. But God saw them and heard them.","Two brave women named Shiphrah and Puah protected babies, and God blessed them. God was getting ready to rescue his people!"]},{"id":"exh-02","bible":"exo-02","bibleTitle":"A Baby in a Basket","title":"Moses' Name and a Babylonian Baby Story","era":"About 2300-1250 BC","intro":"Moses was put in a basket on the river and grew up in Pharaoh's palace. His name makes sense in two languages!","sections":[{"h":"A Two-Language Name","p":["The princess named him Moses because she 'drew him out of the water.' In Hebrew, Moses sounds like 'draw out.' In Egyptian, 'mose' means 'son.' It's even part of some Pharaohs' names, like Thutmose and Ramesses!"]},{"h":"School in the Palace","p":["Kids in the palace went to school. They learned to read and write hieroglyphs, Egypt's picture writing. They also learned math and laws.","The Bible says Moses learned all the wisdom of Egypt. God used that later when Moses led Israel and wrote down God's laws."]},{"h":"Another Basket Story","p":["Long ago, people in Mesopotamia told a story about a king named Sargon. In the story, baby Sargon was put in a basket on a river too, and he grew up to be king.","But Sargon's story is about a man becoming powerful. Moses' story is about God saving a baby so he could rescue God's people!"]}],"people":[{"name":"Moses","role":"Hebrew baby raised in Pharaoh's palace"},{"name":"Sargon","role":"A king from Mesopotamia with a basket story"}],"source":{"title":"The Sargon Birth Legend","who":"Mesopotamian scribes","date":"Copies from about 700 BC","text":"In the story, Sargon says his mother put him in a basket made of reeds, sealed it with tar, and set it on the river. A man getting water found him and raised him.","note":"Baskets, rivers, and tar were common in both Egypt and Mesopotamia."},"vocab":[["Hieroglyphs","Egyptian picture writing"],["Legend","An old story that may not be true"],["Midian","The land where Moses ran away to"]],"map":{"view":"sinai","places":["rameses","memphis_s","midian"],"caption":"Moses grew up in Egypt, then ran east across the desert to Midian."},"timeline":[{"y":-2300,"t":"Sargon rules in Mesopotamia"}],"video":[],"quiz":[{"q":"What does 'Moses' sound like in Hebrew?","options":["River","Draw out","Baby"],"answer":1,"why":"He was drawn out of the water!"},{"q":"What does 'mose' mean in Egyptian?","options":["Water","Son","King"],"answer":1,"why":"It's in Pharaohs' names too."},{"q":"What did kids learn in the palace school?","options":["Cooking","Hieroglyphs","Video games"],"answer":1,"why":"Egyptian picture writing."},{"q":"Why did God save baby Moses?","options":["To be Pharaoh","To rescue God's people","To make him rich"],"answer":1,"why":"God had a plan for him."}],"assignment":"Use a hieroglyph alphabet chart to write your name in Egyptian picture writing!"},{"id":"exh-03","bible":"exo-03","bibleTitle":"The Burning Bush","title":"The Sinai, Midian, and the Name of God","era":"About 1400-1200 BC and AD 500s","intro":"Moses met God at a burning bush in the Sinai desert. Today there's a very old monastery at the traditional spot.","sections":[{"h":"Shepherd in the Desert","p":["Moses was a shepherd in Midian for forty years. The Sinai desert is dry and rocky, with tall mountains and very little water.","Moses learned where to find water and how to lead animals through the desert. Those were exactly the skills he needed later to lead Israel through the desert for forty years!"]},{"h":"God's Name in Egypt?","p":["In an old Egyptian temple, there's a list of lands Pharaoh said he conquered. One says 'the land of the Shasu of Yhw.' Shasu were desert travelers.","Many people think 'Yhw' might be connected to God's name that he told Moses. If so, it might be the oldest time God's name was written outside the Bible!"]},{"h":"An Ancient Monastery","p":["At the bottom of a mountain called Jebel Musa, which means 'Mountain of Moses,' there's a monastery that's about 1,500 years old. It was built where people remembered the burning bush.","A bush still grows there today! The monastery also has a library of very old Bibles."]}],"people":[{"name":"Jethro","role":"Moses' father-in-law, a priest in Midian"},{"name":"Emperor Justinian","role":"Built the monastery at Mount Sinai"}],"source":{"title":"The Soleb Temple Inscription","who":"Egyptian scribes of Amenhotep III","date":"About 1380 BC","text":"Carved on a temple column in Africa is a list of conquered lands. One name says 'land of the Shasu of Yhw.'","note":"This might be a very old mention of God's name."},"vocab":[["Sinai","A desert land between Egypt and Canaan"],["Monastery","A place where monks live and pray"],["Shepherd","A person who takes care of sheep"]],"map":{"view":"sinai","places":["sinai_musa","midian","serabit"],"caption":"The traditional Mount Sinai is in the southern Sinai desert. Midian was across the water to the east."},"timeline":[{"y":-1380,"t":"An Egyptian temple may mention God's name"},{"y":548,"t":"St. Catherine's Monastery is built at Mount Sinai"}],"video":[],"quiz":[{"q":"How long was Moses a shepherd?","options":["4 days","400 years","40 years"],"answer":2,"why":"Then he led Israel for 40 years!"},{"q":"What is the Sinai like?","options":["A jungle","Dry and rocky","Snowy"],"answer":1,"why":"A desert with mountains."},{"q":"What does Jebel Musa mean?","options":["Mountain of Moses","Burning bush","Big rock"],"answer":0,"why":"The traditional Mount Sinai."},{"q":"What still grows at the monastery?","options":["A palm tree","A bush","Corn"],"answer":1,"why":"Monks say it's from the burning bush!"}],"assignment":"Look at pictures of the Sinai desert with a parent. Draw Moses with his sheep there."},{"id":"exh-04","bible":"exo-04","bibleTitle":"Let My People Go","title":"Who Was the Pharaoh of the Exodus?","era":"About 1450 BC or 1260 BC","intro":"The Bible never tells us the name of the Pharaoh who wouldn't let Israel go! People who love the Bible have different ideas about when the Exodus happened.","sections":[{"h":"Two Ideas","p":["Some people use numbers in the Bible to count back and think the Exodus happened about 3,450 years ago.","Others think it happened about 3,280 years ago, when a famous Pharaoh named Ramesses II was king. One reason is that the Bible says the Israelites built a city called Rameses.","Christians who trust the Bible can still have different ideas about dates. What matters most is that God rescued his people!"]},{"h":"Brick Counting","p":["Egyptians kept careful records. One leather scroll lists teams of brickmakers. Each team had to make 2,000 bricks! The scroll writes down when teams didn't make enough.","So when Pharaoh took away the straw but said 'Make just as many bricks,' he was using Egypt's real counting system to be mean."]}],"people":[{"name":"Ramesses II","role":"A famous Pharaoh some think was the Pharaoh of the Exodus"},{"name":"Merneptah","role":"Ramesses II's son"}],"source":{"title":"The Louvre Leather Roll","who":"Egyptian scribes","date":"Year 5 of Ramesses II (about 1274 BC)","text":"This leather scroll lists teams of brickmakers. Each team had to make about 2,000 bricks, and the scroll writes down how many they really made.","note":"Brick quotas were real in Egypt!"},"vocab":[["Quota","A number of things you must make"],["Pharaoh","The king of Egypt"],["Date","When something happened"]],"map":{"view":"ane","places":["thebes","memphis","avaris"],"caption":"Thebes was a big city in southern Egypt. Ramesses II built a city in the north near Goshen."},"timeline":[{"y":-1446,"t":"The Exodus, according to one idea"},{"y":-1274,"t":"A leather scroll records brick quotas"},{"y":-1260,"t":"The Exodus, according to another idea"}],"video":[],"quiz":[{"q":"Does the Bible tell us the Pharaoh's name?","options":["No","Yes"],"answer":0,"why":"It never names him."},{"q":"How many bricks did each team have to make?","options":["10","1 million","About 2,000"],"answer":2,"why":"That's a lot of bricks!"},{"q":"Which famous Pharaoh do some people think it was?","options":["Ramesses II","King Tut","Herod"],"answer":0,"why":"That's one idea."},{"q":"What matters most in the story?","options":["Pharaoh's name","The exact date","God rescued his people"],"answer":2,"why":"God is the hero!"}],"assignment":"Count how many building blocks you can stack in five minutes. Imagine making 2,000 bricks!"},{"id":"exh-05","bible":"exo-05","bibleTitle":"The Plagues","title":"The Gods of Egypt","era":"About 3000-30 BC","intro":"The Egyptians worshiped lots of false gods: gods of the river, frogs, cows, and the sun. The plagues showed that the LORD is stronger than all of them!","sections":[{"h":"Lots of Gods","p":["Egyptians believed in hundreds of gods. Hapi was the god of the Nile River. Heqet was a goddess with a frog head. Hathor was a cow goddess. They even worshiped a special bull.","The most important was Ra, the sun god. And they believed Pharaoh was a god too!"]},{"h":"The Plagues and the Gods","p":["When the Nile turned to blood, it showed the river god couldn't help. When frogs were everywhere, the frog goddess couldn't stop them. When the sky went dark for three days, it showed the sun god was powerless!","God said, 'I will judge all the gods of Egypt. I am the LORD.'"]}],"people":[{"name":"Ra","role":"Egypt's false sun god"},{"name":"Hapi","role":"Egypt's false god of the Nile"}],"source":{"title":"Hymn to the Nile (Hymn to Hapi)","who":"Egyptian scribes","date":"Copies from about 1200 BC","text":"An old Egyptian song praises Hapi, the Nile god, for watering the fields, growing barley and wheat, and filling storehouses.","note":"Egyptians thanked a false god for the Nile. The plagues showed the LORD is the real God."},"vocab":[["False god","Something people worship that isn't the true God"],["Plague","A terrible disaster"],["Judgment","When God shows what is right and wrong"]],"map":{"view":"ane","places":["memphis","thebes","avaris"],"caption":"Egypt's big temples were along the Nile River."},"timeline":[],"video":[],"quiz":[{"q":"Who was Hapi?","options":["A frog","The false god of the Nile","A Pharaoh"],"answer":1,"why":"Egyptians thought he controlled the river."},{"q":"Which plague showed the sun god was powerless?","options":["Flies","Frogs","Darkness"],"answer":2,"why":"Three days of darkness!"},{"q":"What did Egyptians believe about Pharaoh?","options":["He was a shepherd","He was Hebrew","He was a god"],"answer":2,"why":"But only the LORD is God."},{"q":"Who is stronger than all the gods of Egypt?","options":["The LORD","Ra","Pharaoh"],"answer":0,"why":"There is only one true God."}],"assignment":"Draw the ten plagues in ten boxes. Under some of them, write which false god it showed was powerless.","hope":["The plagues showed that the LORD is the one true God, stronger than all of Egypt's false gods.","God wanted everyone to know him, and some Egyptians even left with Israel!"]},{"id":"exh-06","bible":"exo-06","bibleTitle":"The First Passover","title":"Passover Through 3,000 Years","era":"About 1400 BC to today","intro":"God told Israel to celebrate Passover every year. Jewish families have been doing it for more than 3,000 years!","sections":[{"h":"Passover in the Bible","p":["Israel kept Passover in the desert and in the promised land. Later, good kings like Hezekiah and Josiah held big Passover celebrations to help people turn back to God.","In Jesus' time, Jerusalem was packed with people celebrating Passover."]},{"h":"The Passover Meal Today","p":["Jewish families still eat a special Passover meal called a Seder. There's a special plate with foods that remind them of the story.","During the meal, the youngest child asks, 'Why is this night different from all other nights?' Then the family tells the Exodus story, just as God said to do."]},{"h":"Jesus, Our Passover Lamb","p":["Jesus died at Passover time. The Lord's Supper started at his last Passover meal. The Bible says, 'Christ, our Passover lamb, has been sacrificed.'"]}],"people":[{"name":"King Josiah","role":"Held a great Passover celebration"},{"name":"The youngest child","role":"Asks the special question at the Passover meal"}],"source":{"title":"The Mishnah, Pesachim 10:4","who":"Jewish rabbis","date":"Written down about AD 200","text":"An old Jewish book says the son asks his father: Why is this night different from all other nights? On other nights we eat bread with yeast. Tonight we eat only flat bread.","note":"Kids have been asking this question for a very long time!"},"vocab":[["Seder","The special Passover meal"],["Flat bread","Bread made without yeast"],["Celebrate","To have a special time to remember something good"]],"map":{"view":"local","places":["shechem","jerusalem"],"caption":"Passover lambs were offered at the temple in Jerusalem."},"timeline":[{"y":-622,"t":"King Josiah holds a great Passover"},{"y":200,"t":"The Passover questions are written down"}],"video":[],"quiz":[{"q":"What is the Passover meal called?","options":["Supper","Seder","Feast of Fish"],"answer":1,"why":"It has foods that tell the story."},{"q":"Who asks the special question?","options":["The grandpa","The youngest child","The rabbi"],"answer":1,"why":"Why is this night different?"},{"q":"How long has Passover been celebrated?","options":["More than 3,000 years","10 years","100 years"],"answer":0,"why":"A very long time!"},{"q":"Who is our Passover Lamb?","options":["Moses","Jesus","Aaron"],"answer":1,"why":"Jesus saves us."}],"assignment":"Draw a Passover plate with flat bread and bitter herbs. Ask a parent to help you find out what the other foods mean.","hope":["Passover remembers the night God kept his people safe and set them free!","Jesus is our Passover Lamb. He rescues us too."]},{"id":"exh-07","bible":"exo-07","bibleTitle":"Walking Through the Sea","title":"Chariots, Forts, and the Way to Canaan","era":"About 1450-1250 BC","intro":"God didn't lead Israel on the short road to Canaan. Old Egyptian carvings show why: that road was full of Egyptian forts and soldiers!","sections":[{"h":"The Road of Forts","p":["The fastest way from Egypt to Canaan was along the seashore. Egyptians called it the Way of Horus.","A Pharaoh named Seti carved a picture of this road on a temple wall. It shows a line of forts, each with soldiers and water. God knew his people might get scared and want to go back to Egypt, so he led them a different way."]},{"h":"Pharaoh's Chariots","p":["Chariots were the best weapons of the time. Egyptian chariots were fast and light, pulled by two horses, with a driver and an archer. King Tut's tomb had six chariots in it!","When Pharaoh chased Israel with 600 of his best chariots, it was the strongest army around against people walking on foot. But God fought for Israel!"]},{"h":"Where Did They Cross?","p":["The Bible calls it Yam Suph, which can mean 'Sea of Reeds.' People have different ideas about exactly where Israel crossed. But everyone agrees God made a way where there was no way!"]}],"people":[{"name":"Seti I","role":"A Pharaoh who carved a picture of the road of forts"},{"name":"King Tut","role":"A young Pharaoh buried with six chariots"}],"source":{"title":"The Karnak Relief of Seti I","who":"Egyptian royal artists","date":"About 1290 BC","text":"The carving shows Pharaoh's army on the road, with a row of forts, each with its own pool or well, and a canal full of crocodiles at the border.","note":"Crocodiles guarded the border! God led Israel a different way."},"vocab":[["Chariot","A fast cart pulled by horses, used in battle"],["Fort","A strong building for soldiers"],["Yam Suph","'Sea of Reeds,' the sea Israel crossed"]],"map":{"view":"sinai","places":["rameses","tjaru","timsah","bitterlakes","suez"],"caption":"The road of forts ran along the coast. Israel went a different way toward the sea."},"timeline":[{"y":-1290,"t":"Pharaoh Seti carves the road of forts"},{"y":1922,"t":"King Tut's tomb is found with six chariots","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"Why didn't God take Israel the short way?","options":["It was full of Egyptian forts and soldiers","It was too long","It was flooded"],"answer":0,"why":"They might get scared and go back."},{"q":"How many horses pulled an Egyptian chariot?","options":["Ten","Two","One hundred"],"answer":1,"why":"Fast and light!"},{"q":"How many chariots were in King Tut's tomb?","options":["Six","Zero","1,000"],"answer":0,"why":"Six chariots!"},{"q":"What does Yam Suph mean?","options":["Sea of Reeds","Salty Lake","Big Ocean"],"answer":0,"why":"The sea God parted."}],"assignment":"Draw a map with Egypt, the sea, and the desert. Draw the road of forts and the way God led Israel.","hope":["God knew his people were scared, so he led them a safer way. He went with them in a cloud and a fire!","Then God opened a path right through the sea. His people walked across on dry ground!"]},{"id":"exh-08","bible":"exo-08","bibleTitle":"A Song of Victory and Bitter Water","title":"Victory Songs and the First Mention of 'Israel'","era":"About 1208 BC","intro":"After crossing the sea, Moses and Miriam sang a victory song. An old Egyptian stone has the first time the name 'Israel' was ever written outside the Bible!","sections":[{"h":"Victory Songs","p":["Pharaohs carved victory songs on stone, bragging about how great they were and thanking their false gods.","Moses' song is different. It gives all the credit to God: 'The LORD is a warrior; the LORD is his name!'"]},{"h":"The Israel Stone","p":["About 130 years ago, an explorer named Flinders Petrie found a tall black stone in Egypt. It was carved for Pharaoh Merneptah. Near the end, it says the name 'Israel'!","It's the oldest time the name Israel was written outside the Bible. It shows Israel was already living in Canaan more than 3,000 years ago."]},{"h":"Drums and Dancing","p":["Miriam played a hand drum called a timbrel. Archaeologists have found lots of little clay statues of women holding round drums. Drumming and dancing to celebrate was very common!"]}],"people":[{"name":"Miriam","role":"Moses' sister, who led the women in dancing"},{"name":"Flinders Petrie","role":"Explorer who found the stone that says 'Israel'"}],"source":{"title":"The Merneptah Stele","who":"Scribes of Pharaoh Merneptah","date":"About 1208 BC","text":"Near the end, Pharaoh Merneptah's stone brags about beating cities in Canaan. Then it says: 'Israel is laid waste.'","note":"Pharaoh bragged. But Israel was still there, and God's people are still here today!"},"vocab":[["Stele","A tall carved stone"],["Timbrel","A hand drum, like a tambourine"],["Victory","Winning a battle"]],"map":{"view":"ane","places":["thebes","hebron_a","memphis"],"caption":"The Israel stone was found in Egypt. It talks about places in Canaan."},"timeline":[{"y":-1208,"t":"Pharaoh Merneptah's stone mentions Israel"},{"y":1896,"t":"Flinders Petrie finds the stone","d":true}],"video":[],"quiz":[{"q":"Who gets the credit in Moses' song?","options":["The LORD","Pharaoh","Moses"],"answer":0,"why":"God won the victory!"},{"q":"Why is Merneptah's stone famous?","options":["It's gold","It talks","It's the oldest time 'Israel' was written outside the Bible"],"answer":2,"why":"An amazing find!"},{"q":"Who found the stone?","options":["King Tut","Moses","Flinders Petrie"],"answer":2,"why":"An explorer in Egypt."},{"q":"What did Miriam play?","options":["A flute","A guitar","A timbrel, or hand drum"],"answer":2,"why":"She danced and sang!"}],"assignment":"Make a drum from an oatmeal box or a pot. Play it and sing praise to God like Miriam did!"},{"id":"exh-09","bible":"exo-09","bibleTitle":"Bread From Heaven","title":"Desert Food: Manna and Quail","era":"About 1400 BC to today","intro":"God fed Israel with manna and quail in the desert. Scientists have noticed things in the Sinai that remind them of these foods, but the Bible tells of something much greater.","sections":[{"h":"Quail","p":["Every spring and fall, huge flocks of quail fly over the Sinai. After a long flight over the sea, the tired birds land in big groups. People have caught them with nets for thousands of years.","God used his creation to send quail right to Israel's camp!"]},{"h":"Tree Sugar","p":["In parts of the Sinai, tiny bugs eat the sap of a tree called a tamarisk. They leave sweet drops that turn into little white grains. Local people even call it 'mann'!","But this tree sugar only shows up a little bit, in a few places. God's manna came every day for forty years, enough for the whole nation! That was a miracle."]},{"h":"Bread From Heaven","p":["God told Moses to save a jar of manna to remember. Jesus said, 'I am the living bread that came down from heaven.'"]}],"people":[{"name":"Josephus","role":"A Jewish writer who wrote about manna"},{"name":"Bedouin","role":"Desert people who live in the Sinai"}],"source":{"title":"Jewish Antiquities, Book 3","who":"Josephus","date":"About AD 93","text":"Josephus wrote that the manna was sweet like honey, and the Israelites ate it for forty years.","note":"Josephus wrote this almost 2,000 years ago."},"vocab":[["Migration","When animals travel far every year"],["Quail","A small, plump bird"],["Miracle","Something amazing only God can do"]],"map":{"view":"sinai","places":["sinai_musa","elim","tjaru"],"caption":"Quail fly over the northern coast of the Sinai every spring and fall."},"timeline":[],"video":[],"quiz":[{"q":"When do quail fly over the Sinai?","options":["Spring and fall","Only at Christmas","Never"],"answer":0,"why":"They migrate twice a year."},{"q":"What makes tree sugar in the Sinai?","options":["Bees","Bugs eating tamarisk sap","Rain"],"answer":1,"why":"Little sweet drops!"},{"q":"How is God's manna different?","options":["It was salty","It was blue","It came every day for 40 years"],"answer":2,"why":"It was a miracle!"},{"q":"What did Jesus call himself?","options":["The quail","The tree","The living bread from heaven"],"answer":2,"why":"Jesus gives us life."}],"assignment":"Look at a map of where quail fly. Draw their path from Europe, over the sea, to Africa."},{"id":"exh-10","bible":"exo-10","bibleTitle":"Water, a Battle, and Good Advice","title":"Midianites, Copper Mines, and a Bronze Snake","era":"About 1300-1100 BC","intro":"Moses' father-in-law Jethro was from Midian. Archaeologists found a Midianite tent-shrine and a little copper snake in a place where people mined copper long ago!","sections":[{"h":"The Midianites","p":["The Midianites lived in the deserts south and east of Canaan. They took care of animals, traded, and worked with metal. Midianite traders even took Joseph to Egypt long before!","Their pottery had fun painted designs, like birds and shapes."]},{"h":"Copper Mines","p":["Timna, in the south of Israel, is one of the oldest copper mines in the world. Egyptians mined copper there, and later the Midianites did too.","Archaeologists found a small shrine there with a tent over it. Inside was a little copper snake with a gold head!"]},{"h":"A Bronze Snake","p":["This reminds us of the bronze snake Moses made when the Israelites were bitten by snakes (Numbers 21). Jesus said that just like Moses lifted up the snake, he would be lifted up on the cross to save people."]}],"people":[{"name":"Jethro","role":"Moses' father-in-law, a priest of Midian"},{"name":"Joshua","role":"Led Israel's fighters"}],"source":{"title":"The Timna Copper Snake","who":"Midianite metalworkers","date":"About 1200-1100 BC; found in 1969","text":"A small copper snake, about 5 inches long, with a little gold on its head, was found in a tent-covered shrine at Timna.","note":"It's about as long as your hand!"},"vocab":[["Copper","A reddish-brown metal"],["Mine","A place where people dig for metal or stone"],["Shrine","A small place of worship"]],"map":{"view":"sinai","places":["timna","midian","kadesh","sinai_musa"],"caption":"Timna's copper mines are in the far south of Israel, near Midian."},"timeline":[{"y":-1150,"t":"Midianites use a tent shrine at Timna"},{"y":1969,"t":"The copper snake is found","d":true}],"video":[],"quiz":[{"q":"Who was Jethro?","options":["A Pharaoh","A priest of Midian","A soldier"],"answer":1,"why":"Moses' father-in-law."},{"q":"What was mined at Timna?","options":["Diamonds","Gold","Copper"],"answer":2,"why":"One of the oldest copper mines!"},{"q":"What was found in the shrine?","options":["A sword","A little copper snake","A crown"],"answer":1,"why":"With a gold head!"},{"q":"What did Jesus compare to Moses' bronze snake?","options":["A fish","A boat","Being lifted up on the cross"],"answer":2,"why":"Jesus saves us."}],"assignment":"Read John 3:14-15 with a parent. Draw Moses' bronze snake and the cross side by side."},{"id":"exh-11","bible":"exo-11","bibleTitle":"God Comes Down on Mount Sinai","title":"Where Is Mount Sinai?","era":"AD 300s to today","intro":"Israel camped at Mount Sinai for almost a year. But which mountain was it? People have climbed one mountain for over 1,600 years to remember!","sections":[{"h":"Mountain of Moses","p":["The traditional Mount Sinai is called Jebel Musa, 'Mountain of Moses.' It's very tall and rocky.","Today, visitors climb 3,750 stone steps cut by monks, often starting at night so they can watch the sunrise from the top!"]},{"h":"Egeria's Diary","p":["About 1,600 years ago, a Christian woman named Egeria traveled to the Holy Land and wrote a diary for her friends. She climbed Mount Sinai with monks. At each spot, they read the Bible story that happened there!"]},{"h":"Other Ideas","p":["Some people think Mount Sinai might be a different mountain, maybe in Arabia. No one knows for sure. What matters most is the God who met his people there."]}],"people":[{"name":"Egeria","role":"A Christian traveler who wrote a diary about Mount Sinai"},{"name":"Elijah","role":"A prophet who also went to Mount Sinai"}],"source":{"title":"The Travels of Egeria","who":"Egeria, a Christian pilgrim","date":"About AD 383","text":"Egeria wrote that the mountain was very hard to climb, going straight up like a wall. At the top was a little church, and they read from the book of Moses.","note":"Egeria's diary is one of the oldest travel stories written by a woman."},"vocab":[["Diary","A book where you write about your day"],["Pilgrim","A person who travels to a holy place"],["Summit","The top of a mountain"]],"map":{"view":"sinai","places":["sinai_musa","karkom","lawz","serabit"],"caption":"The traditional Mount Sinai is in the southern Sinai. Some people think it might be somewhere else."},"timeline":[{"y":383,"t":"Egeria climbs Mount Sinai"},{"y":1884,"t":"Egeria's diary is found again in Italy","d":true}],"video":[],"quiz":[{"q":"What does Jebel Musa mean?","options":["Mountain of Moses","Snowy peak","Big hill"],"answer":0,"why":"The traditional Mount Sinai."},{"q":"How many steps go up the mountain?","options":["10","100","3,750"],"answer":2,"why":"That's a lot of steps!"},{"q":"Who was Egeria?","options":["A traveler who kept a diary","A Pharaoh","A queen"],"answer":0,"why":"She climbed Mount Sinai."},{"q":"Do we know for sure which mountain it was?","options":["No","Yes"],"answer":0,"why":"What matters most is God."}],"assignment":"Pretend you're Egeria. Write or tell a diary entry about climbing Mount Sinai and what you saw at the top."},{"id":"exh-12","bible":"exo-12","bibleTitle":"The Ten Commandments","title":"Covenants Like Ancient Treaties","era":"About 1400-1200 BC","intro":"Long ago, powerful kings made promise agreements with smaller kings. God's covenant with Israel follows a very similar pattern!","sections":[{"h":"Great Kings and Small Kings","p":["The Hittites had a big empire in what is now Turkey. Their great king made agreements with smaller kings. The great king promised to protect them, and the small kings promised to be loyal only to him."]},{"h":"The Same Pattern","p":["These agreements started with the great king's name. Then they told what he had done for the smaller king. Then came the rules, and the first rule was: be loyal only to me!","Look at the Ten Commandments: 'I am the LORD your God' (God's name), 'who brought you out of Egypt' (what God did), 'You shall have no other gods' (be loyal only to me). The same pattern!"]},{"h":"What's Different","p":["The Hittite king was just a man who wanted soldiers and money. Israel's Great King is the LORD, who rescued slaves, gave them rest, and told them to care for poor people."]}],"people":[{"name":"Mursili II","role":"A Hittite great king"},{"name":"The Hittites","role":"A powerful people from long ago"}],"source":{"title":"Treaty of Mursili II with Duppi-Teshub of Amurru","who":"Hittite royal scribes","date":"About 1300 BC","text":"The agreement starts: These are the words of Mursili, the great king. Then it tells how the great king's father helped the small king, and says the small king must be loyal only to him.","note":"Compare this with Exodus 20:2-3!"},"vocab":[["Covenant","A serious promise agreement"],["Loyal","Faithful to someone"],["Hittites","A people with a big empire in Turkey"]],"map":{"view":"ane","places":["hattusa","kadesh_o","memphis","hebron_a"],"caption":"The Hittite Empire was in what is now Turkey."},"timeline":[{"y":-1300,"t":"Hittite kings write promise agreements"},{"y":1906,"t":"Hittite clay tablets are dug up","d":true}],"video":[],"quiz":[{"q":"Where was the Hittite Empire?","options":["In Egypt","In what is now Turkey","In America"],"answer":1,"why":"Far north of Israel."},{"q":"What was the first rule in a Hittite agreement?","options":["Go to sleep","Be loyal only to the great king","Pay taxes"],"answer":1,"why":"Just like 'no other gods'!"},{"q":"What does God tell Israel before the commandments?","options":["Nothing","His favorite color","What he did for them"],"answer":2,"why":"He brought them out of Egypt."},{"q":"Who is Israel's Great King?","options":["Mursili","Pharaoh","The LORD"],"answer":2,"why":"God is the Great King!"}],"assignment":"Read Exodus 20:1-3 with a parent. Draw God as the Great King who rescued his people."},{"id":"exh-13","bible":"exo-13","bibleTitle":"Laws for Everyday Life and a Covenant Meal","title":"The Goring Ox: Comparing Ancient Laws","era":"About 1930-1750 BC","intro":"God gave Israel a law about an ox that hurts someone. Older law lists from other countries have a very similar law. Comparing them shows how much God values people!","sections":[{"h":"Laws Before Moses","p":["Other countries had law lists too, like Hammurabi's laws from Babylon. They had rules about families, money, and animals.","Oxen were used for farming everywhere. An ox that pokes people with its horns was dangerous everywhere too!"]},{"h":"The Ox Law","p":["Both Hammurabi's laws and God's law say: if an ox is known to hurt people and the owner doesn't keep it in a pen, the owner is responsible.","But God's law cares more about people. In God's law, kids are protected the same as grown-ups. In Hammurabi's laws, punishments were different for rich people and poor people."]},{"h":"Protecting the Weak","p":["God's law gave special protection to servants, people from other countries, widows, and orphans. Even servants and animals got a day of rest!"]}],"people":[{"name":"Hammurabi","role":"A king of Babylon who wrote a famous list of laws"}],"source":{"title":"The Code of Hammurabi, Laws 250-251","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a man's ox is known to poke people with its horns, and he doesn't control it, and it hurts someone, he must pay silver.","note":"God's law in Exodus 21 is similar, but it shows that every person is made in God's image."},"vocab":[["Ox","A big, strong animal used for farming"],["Law","A rule for a whole country"],["Responsible","When something is your job to take care of"]],"map":{"view":"ane","places":["babylon","ur","susa"],"caption":"Other law lists came from cities like Ur and Babylon."},"timeline":[{"y":-2100,"t":"A very old law list is written in Ur"},{"y":-1930,"t":"Another law list is written in Mesopotamia"}],"video":[],"quiz":[{"q":"What was an ox used for?","options":["Racing","Farming","Swimming"],"answer":1,"why":"Oxen pulled plows."},{"q":"When was an ox owner responsible?","options":["When he knew the ox was dangerous and didn't pen it","Never","Always"],"answer":0,"why":"Both laws say this."},{"q":"How does God's law treat kids?","options":["Less important","It doesn't mention them","The same as grown-ups"],"answer":2,"why":"Every person matters to God."},{"q":"Who got a day of rest in God's law?","options":["Nobody","Only kings","Everyone, even servants and animals"],"answer":2,"why":"God cares for everyone."}],"assignment":"Write three fair rules for taking care of a family pet. How do your rules protect the pet and the people?","hope":["God's laws showed that every person is special to him.","God's laws also protected people who needed help, like orphans and the poor. God cares about everyone!"]},{"id":"exh-14","bible":"exo-14","bibleTitle":"A Tent Where God Would Live","title":"Portable Shrines and a Pharaoh's War Camp","era":"About 1330-1270 BC","intro":"The tabernacle was a tent that could be carried. Egyptian art and King Tut's treasures show that carrying special furniture with poles was common long ago!","sections":[{"h":"Pharaoh's War Camp","p":["Pharaoh Ramesses II carved pictures of his army camp on temple walls. The camp was a big rectangle with Pharaoh's tent in the middle. It's kind of like how Israel's tribes camped around the tabernacle!"]},{"h":"King Tut's Treasures","p":["When explorers opened King Tut's tomb about 100 years ago, they found wooden furniture covered in gold. One chest had long carrying poles!","The ark of the covenant was also made of wood covered in gold, with poles for carrying. God asked Israel to use skills that real people had back then."]},{"h":"No Statue","p":["Egyptian temples had statues of their false gods. But the tabernacle's most special room had no statue at all! God can't be made into a statue. He is real, and he lives with his people."]}],"people":[{"name":"Howard Carter","role":"Opened King Tut's tomb"},{"name":"Bezalel","role":"The artist who made the tabernacle furniture"}],"source":{"title":"The Kadesh Camp Relief","who":"Artists of Ramesses II","date":"About 1274 BC","text":"The carving shows Pharaoh's camp as a rectangle with a wall of shields. In the center is a big royal tent with an inner room.","note":"A big tent in the middle of a camp, like the tabernacle!"},"vocab":[["Portable","Able to be carried"],["Acacia","A desert tree with strong wood"],["Statue","A carved figure of a person or animal"]],"map":{"view":"ane","places":["kadesh_o","thebes","hattusa"],"caption":"Ramesses II fought a big battle in Syria and carved it on temples in Egypt."},"timeline":[{"y":-1274,"t":"Ramesses II fights a big battle"},{"y":1922,"t":"Howard Carter opens King Tut's tomb","d":true}],"video":[],"quiz":[{"q":"What was in the middle of Pharaoh's camp?","options":["Pharaoh's tent","A pyramid","A pool"],"answer":0,"why":"Like the tabernacle in Israel's camp!"},{"q":"What did King Tut's tomb have?","options":["Toys only","Cars","Gold furniture with carrying poles"],"answer":2,"why":"Like the ark!"},{"q":"What was the ark made of?","options":["Plastic","Wood covered in gold","Stone"],"answer":1,"why":"Acacia wood and gold."},{"q":"What was NOT in the tabernacle's special room?","options":["Anything gold","The ark","A statue of God"],"answer":2,"why":"God can't be made into a statue."}],"assignment":"Make a model of the tabernacle with a shoebox. Add the ark, the lampstand, and the table."},{"id":"exh-15","bible":"exo-15","bibleTitle":"Priests and Spirit-Filled Artists","title":"The Silver Scrolls of Ketef Hinnom","era":"About 600 BC","intro":"God gave Aaron a special blessing to say over the people. Archaeologists found that blessing written on two tiny silver scrolls! They're the oldest pieces of Bible writing ever found.","sections":[{"h":"The Priestly Blessing","p":["God told Aaron and his sons to bless the people with these words: 'The LORD bless you and keep you; the LORD make his face shine on you and be gracious to you; the LORD turn his face toward you and give you peace.'","Many churches still say this blessing today!"]},{"h":"Found With a Kid's Help","p":["About 45 years ago, archaeologists were digging in old caves in Jerusalem. A 13-year-old boy was helping! They found two tiny rolled-up silver scrolls, one only about an inch long.","They were so fragile it took three years to unroll them. Inside was the priestly blessing!"]},{"h":"Very Old","p":["The scrolls are about 2,600 years old. Families probably wore them like necklaces, carrying God's blessing with them."]}],"people":[{"name":"Aaron","role":"The first high priest"},{"name":"Gabriel Barkay","role":"Archaeologist who found the silver scrolls"}],"source":{"title":"The Ketef Hinnom Silver Scrolls","who":"An unknown engraver in Jerusalem","date":"About 600 BC; found in 1979","text":"The bigger scroll says: May the LORD bless you and keep you; may the LORD make his face shine on you and give you peace.","note":"This is the same blessing from Numbers 6!"},"vocab":[["Blessing","Asking God to do good for someone"],["Scroll","A rolled-up piece of writing"],["Fragile","Easy to break"]],"map":{"view":"local","places":["jerusalem","bethlehem"],"caption":"The silver scrolls were found in a cave just outside Jerusalem."},"timeline":[{"y":-600,"t":"The silver scrolls are made"},{"y":1979,"t":"The silver scrolls are found","d":true}],"video":[],"quiz":[{"q":"What is written on the silver scrolls?","options":["A grocery list","A song","The priestly blessing"],"answer":2,"why":"The LORD bless you and keep you!"},{"q":"Who helped find them?","options":["A dog","A king","A 13-year-old boy"],"answer":2,"why":"Kids can help archaeologists!"},{"q":"How long did it take to unroll them?","options":["Three days","Three years","Three minutes"],"answer":1,"why":"They were very fragile."},{"q":"How did families probably use them?","options":["Buried them","Wore them like necklaces","Ate them"],"answer":1,"why":"Carrying God's blessing."}],"assignment":"Memorize the priestly blessing. Write it on a little paper scroll and give it to someone you love."},{"id":"exh-16","bible":"exo-16","bibleTitle":"The Golden Calf","title":"Bull Gods and a Silver Calf","era":"About 1600-900 BC","intro":"Why did the Israelites make a calf? In the world back then, people used bulls and calves to stand for their false gods. Archaeologists even found a little silver calf!","sections":[{"h":"Bulls and False Gods","p":["Egyptians worshiped a bull and a cow goddess. People in Canaan showed their false gods with bulls too.","So when the Israelites wanted a god they could see, they made a calf, just like the nations around them. But God's command said not to make idols."]},{"h":"The Silver Calf","p":["About 35 years ago, archaeologists digging in an old city called Ashkelon found a little clay shrine shaped like a beehive. Inside was a small calf, about 4 inches long, once covered in silver!","It shows us the kind of idol people around Israel worshiped."]},{"h":"More Golden Calves","p":["Many years after Sinai, a king named Jeroboam made two golden calves for people to worship. He even said the same words as at Sinai! God's prophets warned that this was wrong."]}],"people":[{"name":"Aaron","role":"Made the golden calf at Sinai"},{"name":"Jeroboam","role":"A king who made two golden calves later"}],"source":{"title":"The Silver Calf of Ashkelon","who":"Canaanite metalworkers","date":"About 1600 BC; found in 1990","text":"A small calf about 4 inches long, once covered in silver, was found inside a beehive-shaped clay shrine near the city gate of Ashkelon.","note":"This is what Israel's neighbors made. God warned his people not to copy them."},"vocab":[["Idol","A statue people worship instead of God"],["Calf","A young cow or bull"],["Shrine","A small place of worship"]],"map":{"view":"local","places":["ashkelon","bethel","dan"],"caption":"The silver calf was found at Ashkelon by the sea. Later, Jeroboam put golden calves at Bethel and Dan."},"timeline":[{"y":-1600,"t":"The silver calf of Ashkelon is made"},{"y":-930,"t":"Jeroboam makes two golden calves"},{"y":1990,"t":"The silver calf is found","d":true}],"video":[],"quiz":[{"q":"Why did the Israelites make a calf?","options":["God told them to","They copied the nations around them","Moses asked"],"answer":1,"why":"Calves stood for false gods."},{"q":"Where was the silver calf found?","options":["Ashkelon","Rome","Egypt"],"answer":0,"why":"In a little clay shrine."},{"q":"How big is the silver calf?","options":["As big as a house","About 4 inches","As big as a horse"],"answer":1,"why":"Small enough to hold!"},{"q":"Who made golden calves later?","options":["King Jeroboam","King David","Moses"],"answer":0,"why":"People kept making the same mistake."}],"assignment":"Talk with a parent: What things can people love more than God today? Draw one and put a big X on it."},{"id":"exh-17","bible":"exo-17","bibleTitle":"Show Me Your Glory","title":"Moses' Shining Face and the Horns Mistake","era":"About AD 400 to 1515","intro":"When Moses came down from Sinai, his face was shining. But for a long time, many artists drew Moses with horns! Here's why.","sections":[{"h":"A Tricky Word","p":["The Bible says Moses' face 'shone.' The Hebrew word for 'shone' is a lot like the Hebrew word for 'horn.' Rays of light can look a little like horns!"]},{"h":"A Latin Bible","p":["About 1,600 years ago, a man named Jerome translated the Bible into Latin. He wrote that Moses' face was 'horned.' He might have meant shining with glory, but lots of people took it literally."]},{"h":"Moses With Horns","p":["So for hundreds of years, artists made Moses with little horns! The most famous is a giant marble statue by Michelangelo in Rome. Moses is sitting, holding the stone tablets, with two little horns on his head.","Today our Bibles say Moses' face was 'radiant' or 'shining.' This shows why it's important to translate carefully!"]}],"people":[{"name":"Jerome","role":"Translated the Bible into Latin"},{"name":"Michelangelo","role":"An artist who carved a famous statue of Moses"}],"source":{"title":"The Latin Vulgate, Exodus 34:29","who":"Jerome","date":"About AD 400","text":"Jerome's Latin Bible says that when Moses came down from Mount Sinai, he did not know that his face was 'horned' from talking with the Lord.","note":"Our Bibles today say his face was shining."},"vocab":[["Translate","To change words into another language"],["Radiant","Shining with light"],["Statue","A carved figure"]],"map":{"view":"ane","places":["alexandria_a","jerusalem_a"],"caption":"Jerome translated the Bible in Bethlehem. Michelangelo's statue of Moses is in Rome."},"timeline":[{"y":-250,"t":"The Old Testament is translated into Greek"},{"y":400,"t":"Jerome finishes his Latin Bible"},{"y":1515,"t":"Michelangelo carves Moses with horns"}],"video":[],"quiz":[{"q":"What happened to Moses' face?","options":["It turned green","It shone","Nothing"],"answer":1,"why":"He had been with God!"},{"q":"Who translated the Bible into Latin?","options":["Pharaoh","Jerome","Moses"],"answer":1,"why":"About 1,600 years ago."},{"q":"What did Jerome say Moses' face was?","options":["Purple","Sad","Horned"],"answer":2,"why":"A translation mix-up!"},{"q":"Who carved Moses with horns?","options":["Egeria","King Tut","Michelangelo"],"answer":2,"why":"A famous statue in Rome."}],"assignment":"Draw Moses coming down the mountain with his face shining. Draw rays of light instead of horns!"},{"id":"exh-18","bible":"exo-18","bibleTitle":"The Glory Fills the Tabernacle","title":"From Tabernacle to Temple: Shiloh and Arad","era":"About 1400-700 BC","intro":"After Israel came into the promised land, the tabernacle stood at a town called Shiloh for a long time. Archaeologists have found clues there and at a small temple called Arad.","sections":[{"h":"The Tabernacle at Shiloh","p":["The Bible says Israel set up the tabernacle at Shiloh. It stayed there for many years. Young Samuel served God there with the priest Eli!","Archaeologists at Shiloh have found big storage buildings and signs that the town was destroyed around the time the ark was captured."]},{"h":"A Little Temple at Arad","p":["At a desert fort called Arad, archaeologists found a small temple. It had a courtyard with an altar and a small special room, a lot like the tabernacle.","Scientists even found traces of burned frankincense on its little altars!"]},{"h":"God Lives With His People","p":["From the tabernacle to Solomon's temple to Jesus, God kept his promise to live with his people. The Bible says Jesus 'made his dwelling among us.' And someday God will live with his people forever!"]}],"people":[{"name":"Eli and Samuel","role":"A priest and a boy who served God at Shiloh"},{"name":"King Hezekiah","role":"A king who helped people worship God the right way"}],"source":{"title":"An Arad Ostracon (inscribed pottery shard)","who":"An officer writing to the commander Eliashib at Arad","date":"About 600 BC","text":"A letter written in ink on a piece of broken pottery, sent to the leader of Arad's fort, talks about someone staying in 'the house of the LORD.'","note":"People wrote letters on broken pots long ago!"},"vocab":[["Shiloh","The town where the tabernacle stood for many years"],["Ostracon","A piece of broken pottery used for writing"],["Frankincense","A sweet-smelling tree sap burned in worship"]],"map":{"view":"local","places":["shiloh","jerusalem","arad"],"caption":"The tabernacle stood at Shiloh. Arad's little temple was in the southern desert."},"timeline":[{"y":-1050,"t":"Shiloh is destroyed"},{"y":-700,"t":"The Arad temple is closed"},{"y":1962,"t":"Archaeologists start digging at Arad","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 2)","https://watch.tbn.org/s/83iA4eRN?e=8Tqdqvqx"]],"quiz":[{"q":"Where did the tabernacle stand for many years?","options":["Shiloh","Babylon","Egypt"],"answer":0,"why":"In the promised land."},{"q":"Which boy served God at Shiloh?","options":["Joseph","David","Samuel"],"answer":2,"why":"Samuel served with Eli."},{"q":"What was found on Arad's little altars?","options":["Burned frankincense","Toys","Gold"],"answer":0,"why":"Sweet-smelling worship!"},{"q":"Who 'made his dwelling among us'?","options":["Jesus","Pharaoh","Moses"],"answer":0,"why":"God came to live with us!"}],"assignment":"You finished Exodus history! Make a poster of places where God lived with his people: Eden, the tabernacle, the temple, Jesus, and heaven someday."}],"lessons/genesis.json":[{"id":"ohist-01","bible":"gen-01","bibleTitle":"In the Beginning","title":"How the Ancient World Told the Creation Story","era":"The ancient Near East","intro":"Long ago, other nations had their own stories about how the world began. When we compare them to Genesis, we see how special the Bible's story is.","sections":[{"h":"Stories on Clay Tablets","p":["About 175 years ago, explorers dug up an old library in a city called Nineveh. It was full of clay tablets with wedge-shaped writing called cuneiform. One tablet told a creation story from Babylon.","In that story, there were lots of gods who fought a big war. Then the gods made people to do all the hard work, so the gods could rest."]},{"h":"Egypt's Stories","p":["Egypt had creation stories too. Egyptians thought the sun, the moon, the Nile River, and even their king were gods."]},{"h":"What Makes Genesis Different","p":["In Genesis, there is only one God. He doesn't have to fight anyone. He just speaks, and things happen! Genesis doesn't even call the sun and moon by name. It calls them 'the greater light' and 'the lesser light.' They are lamps God made, not gods.","Best of all, in Babylon's story people were made to be servants. In Genesis, every person is made in God's image and given the job of caring for his world."]}],"people":[{"name":"Ashurbanipal","role":"A king who collected a giant library of clay tablets"},{"name":"George Smith","role":"A museum worker who learned to read the old tablets"}],"source":{"title":"Enuma Elish, Tablet 6","who":"Babylonian scribes","date":"Copies found in Ashurbanipal's library","text":"The god Marduk says he will make a human being, and that humans will serve the gods so the gods can rest.","note":"Now read Genesis 1:27. In Babylon's story, people are servants. In the Bible, people are made in God's image!"},"vocab":[["Cuneiform","Wedge-shaped writing pressed into clay"],["Tablet","A flat piece of clay used for writing"],["Monotheism","Believing in one God"]],"map":{"view":"ane","places":["nineveh","babylon","memphis"],"caption":"People told creation stories in Babylon, Nineveh, and Memphis in Egypt."},"timeline":[{"y":1849,"t":"Explorers begin digging up a giant library of clay tablets at Nineveh","d":true}],"video":[],"quiz":[{"q":"What is cuneiform?","options":["Egyptian food","A kind of boat","Wedge-shaped writing on clay"],"answer":2,"why":"People pressed it into clay with a reed."},{"q":"In Babylon's story, why were people made?","options":["To be God's image","To build boats","To do the gods' hard work"],"answer":2,"why":"People were made to be servants."},{"q":"What does Genesis call the sun and moon?","options":["The greater light and the lesser light","Gods","Big stars"],"answer":0,"why":"They are lights God made, not gods."},{"q":"How many Gods are in Genesis?","options":["Two","Lots","One"],"answer":2,"why":"There is only one true God."}],"assignment":"Draw two pictures side by side: one for Babylon's story and one for Genesis 1. Tell a parent one way they are different.","hope":["Other nations said people were made to be the gods' workers.","But Genesis says the one true God made people in his own image and loves them. God made you on purpose!"]},{"id":"ohist-02","bible":"gen-02","bibleTitle":"The Garden of Eden","title":"Rivers, Gardens, and the Fertile Crescent","era":"The ancient Near East","intro":"Genesis 2 names four rivers that flowed out of Eden. Two of them, the Tigris and the Euphrates, still flow today!","sections":[{"h":"The Land Between the Rivers","p":["The Tigris and Euphrates Rivers flow through the country we now call Iraq. The land between them is called Mesopotamia, which means 'between the rivers.'","It doesn't rain much there. So people dug ditches to bring river water to their fields. This is called irrigation. With lots of food, villages grew into cities."]},{"h":"The Fertile Crescent","p":["On a map, the good farmland in this part of the world makes a curve, like a crescent moon. People call it the Fertile Crescent. Much of Genesis happens along this curve, from Eden to Egypt."]},{"h":"Where 'Paradise' Comes From","p":["Long ago, kings planted beautiful gardens with trees, water, and animals. The Persians had a word for a walled garden that became our word 'paradise.' Eden was like the great King's garden, where God walked with the people he made."]}],"people":[{"name":"James Henry Breasted","role":"A history teacher who named the Fertile Crescent"}],"source":{"title":"Enki and Ninhursag","who":"Sumerian poets","date":"Copies on ancient clay tablets","text":"An old poem describes a perfect land where lions don't hunt, wolves don't snatch lambs, no one gets sick, and no one grows old.","note":"Many people long ago dreamed of a perfect place. The Bible tells us about Eden, and it promises God will make everything new again someday."},"vocab":[["Mesopotamia","'Between the rivers,' the land of the Tigris and Euphrates"],["Irrigation","Bringing water to fields with ditches"],["Fertile Crescent","A curve of good farmland from Mesopotamia to Egypt"]],"map":{"view":"ane","places":["ur","babylon","nineveh","harran","memphis"],"caption":"The Tigris and Euphrates flow through Mesopotamia. The Fertile Crescent curves from there down to Egypt."},"timeline":[{"y":1916,"t":"The name 'Fertile Crescent' is first used","d":true}],"video":[],"quiz":[{"q":"Which two rivers from Eden still flow today?","options":["Nile and Jordan","Mississippi and Ohio","Tigris and Euphrates"],"answer":2,"why":"They flow through Iraq."},{"q":"What does Mesopotamia mean?","options":["Big desert","Land of kings","Between the rivers"],"answer":2,"why":"It's the land between two rivers."},{"q":"What is irrigation?","options":["Bringing water to fields","A type of boat","A kind of tree"],"answer":0,"why":"Ditches carried river water to crops."},{"q":"What shape is the Fertile Crescent?","options":["A square","A circle","A curve like a crescent moon"],"answer":2,"why":"It curves like a crescent moon."}],"assignment":"Draw a map with the Tigris, Euphrates, and Nile rivers. Color the Fertile Crescent green."},{"id":"ohist-03","bible":"gen-03","bibleTitle":"The First Sin","title":"Serpents and Guardians in the Ancient World","era":"The ancient Near East","intro":"Genesis 3 tells about a sneaky serpent and about cherubim guarding Eden. People long ago saw snakes and winged guardians in lots of their art.","sections":[{"h":"Snakes in Old Stories","p":["In Egypt, Pharaoh wore a crown with a cobra on the front. It stood for power. Egyptians also told a story about a giant evil snake.","In Genesis, the serpent is sneaky, but it is not a god. It is just a creature God made. Later, the Bible tells us Satan was behind it."]},{"h":"Gilgamesh and the Lost Plant","p":["One of the oldest stories in the world is about a king named Gilgamesh. He wanted to live forever. He found a plant that could make him young, but a snake stole it! Gilgamesh sat down and cried.","Genesis has a different answer for why people die: because people disobeyed God. But God gave hope. He promised someone would crush the serpent."]},{"h":"Winged Guardians","p":["God put cherubim to guard the way back into Eden. Kings long ago put giant stone statues at their palace doors. Some had wings, an animal's body, and a human head!","Cherubim in the Bible are not chubby baby angels. They are powerful heavenly beings who guard God's holy places."]}],"people":[{"name":"Gilgamesh","role":"A king from an old story who wanted to live forever"},{"name":"Austen Henry Layard","role":"An explorer who dug up giant winged statues"}],"source":{"title":"The Epic of Gilgamesh, Tablet 11","who":"Mesopotamian scribes","date":"Copies on ancient clay tablets","text":"Gilgamesh goes into a pool to take a bath. A snake smells the special plant and takes it away. Gilgamesh sits down and cries.","note":"This story tries to explain why people die. Genesis says death came because people sinned."},"vocab":[["Epic","A long story-poem about a hero"],["Lamassu","A giant winged statue that guarded palace doors"],["Cherubim","Powerful heavenly beings who guard God's holy places"]],"map":{"view":"ane","places":["nineveh","uruk","memphis","thebes"],"caption":"Giant guardian statues stood at palaces near Nineveh. Gilgamesh was a king of Uruk."},"timeline":[{"y":1845,"t":"An explorer starts digging up giant winged guardian statues","d":true}],"video":[],"quiz":[{"q":"What was on the front of Pharaoh's crown?","options":["A lion","A cobra","A bird"],"answer":1,"why":"It stood for power."},{"q":"What did the snake take from Gilgamesh?","options":["A plant that could make him young","His crown","His sword"],"answer":0,"why":"Gilgamesh lost the plant and cried."},{"q":"According to Genesis, why do people die?","options":["Bad luck","A snake stole a plant","Because people sinned"],"answer":2,"why":"Sin brought death into the world."},{"q":"What do cherubim do in the Bible?","options":["Guard God's holy places","Play harps","Carry babies"],"answer":0,"why":"They are powerful guardians."}],"assignment":"Draw a guardian creature at a palace door. Then tell a parent what cherubim did in Genesis 3."},{"id":"ohist-04","bible":"gen-04","bibleTitle":"Cain and Abel","title":"The First Farmers, Herders, and Cities","era":"The ancient Near East","intro":"Genesis 4 tells about a farmer, a shepherd, the first city, and the first musicians and metalworkers. Archaeologists have dug up clues about all of these!","sections":[{"h":"Farmers and Shepherds","p":["Cain was a farmer, and Abel was a shepherd. Long ago, farmers grew wheat and lived in villages. Shepherds moved around with their sheep and goats to find grass and water.","They traded with each other: grain for wool, milk, and meat."]},{"h":"The First Cities","p":["Genesis says Cain built a city. Some of the oldest cities in the world were in Mesopotamia. One city, Uruk, had giant walls. People there wrote some of the earliest writing, to keep track of grain and sheep."]},{"h":"Music and Metal","p":["Genesis names Jubal, the first musician, and Tubal-Cain, who made tools out of metal.","About 100 years ago, an archaeologist dug in the city of Ur. He found beautiful harps called lyres, decorated with gold and blue stone. One has a golden bull's head! They are some of the oldest instruments ever found."]}],"people":[{"name":"Leonard Woolley","role":"Archaeologist who dug up the city of Ur"},{"name":"Jubal and Tubal-Cain","role":"The first musician and the first metalworker in Genesis 4"}],"source":{"title":"The Lyres of Ur","who":"Craftsmen of Ur","date":"Excavated 1922-1934","text":"Woolley's team found harps in the old tombs of Ur. The wood had rotted away, so they poured plaster into the holes left in the dirt to save their shapes. One harp has a golden bull's head with a blue beard.","note":"You can see these harps in museums today. They show that people long ago were very creative, just like Genesis says."},"vocab":[["Lyre","A small harp with strings"],["Bronze","A metal made by mixing copper and tin"],["Archaeologist","A person who digs up and studies things from long ago"]],"map":{"view":"ane","places":["ur","uruk","eridu"],"caption":"Eridu, Uruk, and Ur were some of the first cities in the world."},"timeline":[{"y":1922,"t":"Leonard Woolley starts digging at Ur","d":true}],"video":[],"quiz":[{"q":"What was Cain's job?","options":["Shepherd","Farmer","King"],"answer":1,"why":"Cain worked the soil."},{"q":"Which city had giant walls?","options":["Uruk","Paris","Bethlehem"],"answer":0,"why":"Uruk was famous for its walls."},{"q":"What did Woolley find at Ur?","options":["Harps decorated with gold","Pizza","Cars"],"answer":0,"why":"Beautiful lyres!"},{"q":"Who was the first musician in Genesis?","options":["Adam","Noah","Jubal"],"answer":2,"why":"Jubal played strings and pipes."}],"assignment":"Make a rubber-band harp with a box. Play it for your family! People are creative because God made us in his image."},{"id":"ohist-05","bible":"gen-05","bibleTitle":"Noah Builds the Ark","title":"Cubits, Pitch, and Ancient Boats","era":"The ancient Near East","intro":"God told Noah exactly how to build the ark. Let's learn what a cubit is, what pitch is, and about a clay tablet that describes a round boat!","sections":[{"h":"Measuring in Cubits","p":["Long ago, people measured with their bodies. A cubit was the length from your elbow to the tip of your middle finger, about 18 inches.","The ark was 300 cubits long. That's about 450 feet, or one and a half football fields! It was shaped like a long box so it would float steady."]},{"h":"Pitch","p":["God told Noah to cover the ark with pitch inside and out. Pitch is a sticky black tar that comes up out of the ground. It kept water out. Baby Moses' basket was covered with it too!"]},{"h":"The Round Boat Tablet","p":["A few years ago, a museum expert read a small clay tablet about the size of a phone. It told a Babylonian flood story about a giant round boat.","Many people long ago remembered a big flood. But Genesis tells it best: the one true God saved Noah's family in a long, strong ark."]}],"people":[{"name":"Irving Finkel","role":"A museum expert who read the round-boat tablet"}],"source":{"title":"The Ark Tablet","who":"A Babylonian scribe","date":"Published in 2014","text":"A god tells a man to build a boat. The boat is round, made of woven rope, and covered in tar inside and out.","note":"Some people built a small copy of this round boat to see if it would float, and it did!"},"vocab":[["Cubit","Elbow to fingertip, about 18 inches"],["Pitch","Sticky black tar that keeps water out"],["Ark","A large boat"]],"map":{"view":"ane","places":["babylon","ur","mari"],"caption":"Pitch (tar) comes up out of the ground in Mesopotamia."},"timeline":[{"y":2014,"t":"A museum expert reads the round-boat flood tablet","d":true}],"video":[],"quiz":[{"q":"What is a cubit?","options":["Elbow to fingertip","A kind of fish","A type of wood"],"answer":0,"why":"About 18 inches."},{"q":"About how long was the ark?","options":["10 feet","450 feet","1 mile"],"answer":1,"why":"About one and a half football fields!"},{"q":"What did pitch do?","options":["Kept water out","Made it go fast","Made it pretty"],"answer":0,"why":"Pitch is waterproof tar."},{"q":"What else in the Bible was covered with pitch?","options":["Jonah's whale","Baby Moses' basket","Goliath's sword"],"answer":1,"why":"His basket floated safely."}],"assignment":"Measure your arm from elbow to fingertip. That's your cubit! Measure your bed or a table in cubits."},{"id":"ohist-06","bible":"gen-06","bibleTitle":"The Rainbow Promise","title":"Flood Stories From Around the World","era":"The ancient Near East","intro":"About 150 years ago, a young man reading an old clay tablet found a flood story with birds sent out from a boat. People everywhere were amazed!","sections":[{"h":"George Smith's Discovery","p":["George Smith taught himself to read cuneiform. He worked at a big museum in London. One day he read a tablet about a boat landing on a mountain and a bird being sent out.","He was so excited he jumped up and ran around the room! A newspaper paid for him to travel far away to look for more pieces."]},{"h":"Alike but Different","p":["In the Babylonian story, a man builds a boat and sends out a dove, a swallow, and a raven. That sounds a little like Noah!","But it's very different. In that story, the gods sent the flood partly because people were too noisy! In Genesis, the one true God judges real sin, remembers Noah, and makes a rainbow promise."]},{"h":"The Mountains of Ararat","p":["Genesis says the ark landed on 'the mountains of Ararat.' That's a mountain area in what is now Turkey. People have searched for the ark, but no one has found it. What matters most is that God kept Noah's family safe."]}],"people":[{"name":"George Smith","role":"Found the Babylonian flood tablet"}],"source":{"title":"The Epic of Gilgamesh, Tablet 11","who":"Mesopotamian scribes","date":"Found by George Smith in 1872","text":"On the seventh day, I let a dove go. It found
