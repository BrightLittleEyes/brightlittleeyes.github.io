/* ============ SCORING, STARS, BADGES ============ */
const unitById = id => UNITS.find(u => u.id === id);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const starsFor = p => p>=90?3:p>=75?2:p>=60?1:0;
const starStr = (n, max=3) => `<span class="stars" aria-label="${n} of ${max} stars">${"★".repeat(n)}<span class="off">${"★".repeat(max-n)}</span></span>`;
function rs(stu, unit, kind){ return results.filter(r => r.student===stu && r.unit===unit && r.kind===kind); }
function best(stu, unit, kind){ const a = rs(stu,unit,kind); return a.length ? Math.max(...a.map(r => r.pct)) : null; }
function bestStars(stu, unit, kind){ const b = best(stu,unit,kind); return b==null ? 0 : starsFor(b); }
function lessonsDone(stu, u){ const d = (prog[stu]||{}).done||{}; return u.lessons.filter((_,i)=>d[u.id+"-"+i]).length; }
function starTotal(stu){
  let t = 0; const d = (prog[stu]||{}).done||{};
  t += Object.keys(d).length;
  UNITS.forEach(u => ["quiz","test","game"].forEach(k => t += bestStars(stu,u.id,k)));
  t += bestStars(stu,"final","final");
  [1,2,3].forEach(l => t += bestStars(stu,"reader"+l,"reader"));
  return t;
}
const STAR_MAX = UNITS.reduce((a,u)=>a+u.lessons.length,0) + UNITS.length*9 + 3 + 9;
const pdays = stu => practice[stu] || {};
const pMinutes = stu => Object.values(pdays(stu)).reduce((a,b)=>a+b,0);
function pStreak(stu){ const d = pdays(stu); let n = 0; const day = new Date(); if (!d[dkey(day)]) day.setDate(day.getDate()-1);
  while (d[dkey(day)]){ n++; day.setDate(day.getDate()-1); } return n; }
function dkey(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function badges(stu){
  const d = (prog[stu]||{}).done||{}, mine = results.filter(r=>r.student===stu), st = starTotal(stu);
  const lvDone = lv => UNITS.filter(u=>u.lv===lv).every(u => lessonsDone(stu,u)===u.lessons.length && (best(stu,u.id,"test")||0)>=80);
  const list = [
    ["First Note","Finish your first lesson", Object.keys(d).length>=1],
    ...UNITS.map(u => [`Unit ${u.n} Master`,`Finish every ${u.name} lesson and score 80%+ on its test`, lessonsDone(stu,u)===u.lessons.length && (best(stu,u.id,"test")||0)>=80, u.color]),
    ["Beginner Graduate","Master Units 1 to 4", lvDone(0), "--u4"],
    ["Intermediate Graduate","Master Units 5 and 6", lvDone(1), "--u6"],
    ["Advanced Graduate","Master Units 7 and 8", lvDone(2), "--u8"],
    ["Perfect Pitch","Get 100% on any quiz or test", mine.some(r=>!["game","reader"].includes(r.kind) && r.pct===100)],
    ["Word Wizard","Get 3 stars in a vocabulary match game", mine.some(r=>r.kind==="game" && r.stars===3)],
    ["Fretboard Master","Get 3 stars on all three Guitar Challenge levels", [1,2,3].every(l=>bestStars(stu,"reader"+l,"reader")===3)],
    ["Hot Streak","Answer 5 practice questions in a row correctly", mine.some(r=>(r.bestStreak||0)>=5)],
    ["Practice Habit","Log practice on 5 different days", Object.keys(pdays(stu)).length>=5],
    ["Week Warrior","Practice 7 days in a row", pStreak(stu)>=7],
    ["100 Minute Club","Log 100 minutes of practice", pMinutes(stu)>=100],
    ["Star Collector","Earn 50 stars", st>=50],
    ["Guitar Graduate","Score 80%+ on the final exam", (best(stu,"final","final")||0)>=80]
  ];
  return list.map(([name,how,got,color]) => ({name,how,got,color}));
}

/* ============ FUN: SOUND + CONFETTI ============ */
function tone(freqs, dur=0.12){
  if (!soundOn) return;
  try{
    if (!AC()) return;
    freqs.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur*1.6);
      o.connect(g).connect(master); o.start(t0); o.stop(t0+dur*1.8); });
  }catch(e){}
}
const sfx = { right:()=>tone([660,880]), wrong:()=>tone([220,180],.15), star:()=>tone([523,659,784,1047],.1), click:()=>tone([520],.05) };
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols = ["#E57C52","#E0B23C","#8DBB57","#8C9CF0","#3FBFA8","#B48AE6","#F2B705"];
  const bits = Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],s:6+Math.random()*6}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore(); });
    if (t-t0 < 3200) requestAnimationFrame(f); else cv.remove(); })(t0);
}

/* ============ HELPERS ============ */
function grade(p){ return p>=90?"A":p>=80?"B":p>=70?"C":p>=60?"D":"F"; }
function pillClass(p){ return p>=80?"g":p>=60?"m":"b"; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepQ(q){ const order = shuffle(q[1].map((_,i)=>i)); return { q:q[0], choices: order.map(i=>q[1][i]), answer: order.indexOf(q[2]), why:q[3] }; }
function go(v){ view = v; render(); window.scrollTo({top:0}); }
function kindLabel(k){ return k==="quiz"?"Practice quiz":k==="test"?"Unit test":k==="game"?"Vocab match":k==="reader"?"Guitar Challenge":"Final exam"; }
function colorOf(unitId){ return unitId==="final" ? "--u9" : unitId.startsWith("reader") ? "--u5" : unitById(unitId).color; }
function titleOf(unitId){ return unitId==="final" ? "All units" : unitId.startsWith("reader") ? "Level "+unitId.slice(6) : `Unit ${unitById(unitId).n}: ${unitById(unitId).name}`; }
const unitShort = id => id==="final" ? "All units" : id.startsWith("reader") ? "Level "+id.slice(6) : "Unit "+unitById(id).n;
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
function needStudent(){

/* ---------- quizzes & tests ---------- */
function startQuiz(unitId, kind, fresh){
  if (needStudent()) return;
  const saved = inprog[student];
  if (!fresh && saved && saved.unit===unitId && saved.kind===kind){ view = Object.assign({page:"quiz", resumed:true}, saved); render(); window.scrollTo({top:0}); return; }
  let qs = kind==="final" ? shuffle(UNITS.flatMap(u => shuffle(u.quiz.concat(u.test)).slice(0,3))) : shuffle(unitById(unitId)[kind]);
  go({page:"quiz", unit:unitId, kind, qs:qs.map(prepQ), i:0, picks:[], checked:false, streak:0, bestStreak:0});
}
function saveQuiz(){ const v = view; inprog[student] = {unit:v.unit, kind:v.kind, qs:v.qs, i:v.i, picks:v.picks, checked:v.checked, streak:v.streak||0, bestStreak:v.bestStreak||0}; saveAll(); }

function renderQuiz(){
  const v = view, Q = v.qs[v.i], picked = v.picks[v.i];
  const practice = v.kind==="quiz", locked = practice && v.checked;
  app.innerHTML = `
  <div class="quiz" style="--c:var(${colorOf(v.unit)})">
    ${v.resumed ? `<p class="resumed">Welcome back! Your answers were saved. <button class="linkbtn" id="restart">Start over instead</button></p>` : ""}
    <div class="qhead"><span class="kind">${kindLabel(v.kind)} · ${esc(titleOf(v.unit))}</span><span class="eyebrow">Question ${v.i+1} of ${v.qs.length}</span></div>
    <div class="meter"><i style="width:${pct(v.i+(locked||(!practice&&picked!=null)?1:0), v.qs.length)}%"></i></div>
    ${practice && (v.streak||0)>=2 ? `<p class="streak">${v.streak} in a row!</p>` : ""}
    <div class="qcard">
      <p class="qtext">${esc(Q.q)}</p>
      <div class="choices" role="radiogroup">
        ${Q.choices.map((c,i)=>{
          let cls = "choice";
          if (locked){ if (i===Q.answer) cls+=" right"; else if (i===picked) cls+=" wrong shake"; }
          else if (i===picked) cls+=" picked";
          return `<button class="${cls}" data-c="${i}" role="radio" aria-checked="${i===picked}" ${locked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`;
        }).join("")}
      </div>
      ${locked ? `<div class="explain ${picked===Q.answer?"ok":"no"}"><strong>${picked===Q.answer?"Correct!":"Not quite. The answer is "+"ABCD"[Q.answer]+"."}</strong>${esc(Q.why)}</div>` : ""}
    </div>
    <div class="qfoot">
      <button class="btn ghost" id="quit">Save and exit</button>
      ${practice
        ? (locked ? `<button class="btn" id="next">${v.i<v.qs.length-1?"Next question →":"See my stars"}</button>`
                  : `<button class="btn" id="check" ${picked==null?"disabled":""}>Check answer</button>`)
        : `<div style="display:flex;gap:10px"><button class="btn ghost" id="prevq" ${v.i===0?"disabled":""}>← Back</button><button class="btn" id="next" ${picked==null?"disabled":""}>${v.i<v.qs.length-1?"Next →":"Finish"}</button></div>`}
    </div>
  </div>`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { v.picks[v.i] = +b.dataset.c; v.resumed = false; saveQuiz(); renderQuiz(); });
  $("#quit").onclick = () => { saveQuiz(); go(v.unit==="final" ? {page:"home"} : {page:"unit", unit:v.unit, lesson:0}); };
  const rsb=$("#restart"); if(rsb) rsb.onclick = () => { delete inprog[student]; saveAll(); startQuiz(v.unit, v.kind, true); };
  const ch=$("#check"); if(ch) ch.onclick = () => {
    v.checked = true;
    if (v.picks[v.i]===Q.answer){ v.streak=(v.streak||0)+1; v.bestStreak=Math.max(v.bestStreak||0,v.streak); sfx.right(); } else { v.streak=0; sfx.wrong(); }
    saveQuiz(); renderQuiz();
  };
  const pv=$("#prevq"); if(pv) pv.onclick = () => { v.i--; saveQuiz(); renderQuiz(); };
  const nx=$("#next"); if(nx) nx.onclick = () => {
    if (v.i < v.qs.length-1){ v.i++; v.checked=false; v.resumed=false; saveQuiz(); renderQuiz(); window.scrollTo({top:0}); }
    else finishQuiz();
  };
}

function recordResult(r){
  const before = badges(student).filter(b=>b.got).map(b=>b.name);
  results = results.concat([r]); saveAll();
  const after = badges(student).filter(b=>b.got && !before.includes(b.name));
  return after;
}
function finishQuiz(){
  const v = view;
  const score = v.qs.reduce((a,Q,i)=>a+(v.picks[i]===Q.answer?1:0),0), p = pct(score, v.qs.length);
  const r = { id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), student, unit:v.unit, kind:v.kind, score, total:v.qs.length, pct:p, stars:starsFor(p), bestStreak:v.bestStreak||0, at:new Date().toISOString(),
    items: v.qs.map((Q,i)=>({q:Q.q, choices:Q.choices, answer:Q.answer, picked:v.picks[i]??null, why:Q.why})) };
  delete inprog[student];
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges };
  render(); window.scrollTo({top:0});
  if (r.stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}

/* ---------- vocab match game ---------- */
function startGame(unitId){
  if (needStudent()) return;
  const u = unitById(unitId), pairs = shuffle(u.lessons.flatMap(l => l.vocab)).slice(0,6);
  go({page:"game", unit:unitId, pairs, left:shuffle(pairs.map((p,i)=>i)), right:shuffle(pairs.map((p,i)=>i)), sel:null, matched:[], mistakes:0, t0:Date.now(), flash:null});
}
function renderGame(){
  const v = view, u = unitById(v.unit);
  const secs = Math.round((Date.now()-v.t0)/1000);
  app.innerHTML = `
  <div class="quiz game" style="--c:var(${u.color})">
    <div class="qhead"><span class="kind">Vocab match · ${esc(titleOf(v.unit))}</span><span class="eyebrow" id="gclock">${v.matched.length}/${v.pairs.length} matched · ${secs}s</span></div>
    <p class="howto">Tap a word, then tap its meaning. Fewer mistakes means more stars.</p>
    <div class="board">
      <div class="colw">${v.left.map(i=>`<button class="tcard word ${v.matched.includes(i)?"done":""} ${v.sel===i?"sel":""} ${v.flash&&v.flash.w===i?"bad":""}" data-w="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][0])}</button>`).join("")}</div>
      <div class="colw">${v.right.map(i=>`<button class="tcard def ${v.matched.includes(i)?"done":""} ${v.flash&&v.flash.d===i?"bad":""}" data-d="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][1])}</button>`).join("")}</div>
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Quit game</button><span class="eyebrow">Mistakes: ${v.mistakes}</span></div>
  </div>`;
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { v.sel = +b.dataset.w; v.flash = null; sfx.click(); renderGame(); });
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    if (v.sel==null){ v.flash = null; renderGame(); return; }
    const d = +b.dataset.d;
    if (d===v.sel){ v.matched.push(d); v.sel = null; v.flash = null; sfx.right(); }
    else { v.mistakes++; v.flash = {w:v.sel, d}; v.sel = null; sfx.wrong(); }
    if (v.matched.length===v.pairs.length) return finishGame();
    renderGame();
  });
  $("#quit").onclick = () => go({page:"unit", unit:v.unit, lesson:0});
  clearInterval(window._gtick);
  window._gtick = setInterval(() => { const el = $("#gclock"); if (!el || view!==v){ clearInterval(window._gtick); return; } el.textContent = `${v.matched.length}/${v.pairs.length} matched · ${Math.round((Date.now()-v.t0)/1000)}s`; }, 1000);
}
function finishGame(){
  const v = view, n = v.pairs.length, p = pct(n, n+v.mistakes);
  const stars = v.mistakes===0?3:v.mistakes<=2?2:1;
  const r = { id:"g"+Date.now().toString(36), student, unit:v.unit, kind:"game", score:n, total:n, pct:p, stars, mistakes:v.mistakes, secs:Math.round((Date.now()-v.t0)/1000), at:new Date().toISOString() };
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges }; render(); window.scrollTo({top:0});
  if (stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}

    back(); figStops.push(F.init($("#tf"))); return;
  }
  if (t==="fret"){
    const F = FIG["first-0"];
    app.innerHTML = head("Fretboard Explorer","--u4") + `<figure class="fig" id="tf" style="--c:var(--u4)"><span class="figtag">${F.tag}</span>${F.html}<figcaption>${esc(F.cap)}</figcaption></figure>`;
    back(); figStops.push(F.init($("#tf"))); return;
  }
  if (t==="songs"){
    const A = chordSongFig(Object.values(CSONG), "Strum along with chord songs. Slow the speed down until the changes feel easy.", {capo:true, tag:"Chord songs"});
    const B = tabSongFig(Object.values(TAB), "Melodies and riffs in tab.", {tag:"Melodies & riffs", frets:10});
    app.innerHTML = head("Songbook","--u7") + `<figure class="fig" id="tf" style="--c:var(--u7)"><span class="figtag">${A.tag}</span>${A.html}<figcaption>${esc(A.cap)}</figcaption></figure><figure class="fig" id="tf2" style="--c:var(--u7)"><span class="figtag">${B.tag}</span>${B.html}<figcaption>${esc(B.cap)}</figcaption></figure>`;
    back(); figStops.push(A.init($("#tf"))); figStops.push(B.init($("#tf2"))); return;
  }
  if (t==="readerpick"){
    app.innerHTML = head("Guitar Challenge","--u5") + `<p class="howto">Answer 10 questions. 9 or 10 right = ★★★, 8 = ★★, 6 or 7 = ★.</p>
    <div class="tools">${[["1","Staff notes","Read first-position notes on the staff, low E to high G"],["2","Fretboard notes","See a dot on the fretboard, name the note (with sharps)"],["3","Chord shapes","See a chord diagram, name the chord"]].map(([l,n,d])=>`<button class="tool" style="--c:var(--u5)" data-lv="${l}"><span class="ic">L${l}</span><b>${n}</b><small>${d}</small>${student?starStr(bestStars(student,"reader"+l,"reader")):""}</button>`).join("")}</div>`;
    back(); app.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => startReader(+b.dataset.lv)); return;
  }
  if (t==="metro") return renderMetro(head, back);
  if (t==="tuner") return renderTuner(head, back);
  if (t==="log") return renderLog(head, back);
}

/* ---- metronome ---- */
function renderMetro(head, back){
  let bpm = LS.get("gtr-bpm", 80), per = 4, on = false, timer = null, next = 0, n = 0, taps = [];
  app.innerHTML = head("Metronome","--u3") + `<div class="panel" style="--c:var(--u3)">
    <div class="bpm" id="bpm">${bpm}<small>beats per minute · <span id="tname"></span></small></div>
    <div class="ctrl"><button class="btn small ghost" data-d="-5">−5</button><button class="btn small ghost" data-d="-1">−1</button><input type="range" id="bpmr" min="40" max="208" value="${bpm}"><button class="btn small ghost" data-d="1">+1</button><button class="btn small ghost" data-d="5">+5</button></div>
    <div class="ctrl"><span>Beats per measure</span><div class="chips">${[2,3,4,6].map(b=>`<button class="chip" data-per="${b}" aria-pressed="${b===4}">${b}</button>`).join("")}</div></div>
    <div class="beats" id="mbeats"></div>
    <div class="ctrl" style="justify-content:center"><button class="btn big" id="mgo">▶ Start</button><button class="btn ghost" id="tap">Tap tempo</button></div></div>`;
  back();
  const name = b => b<60?"Largo":b<76?"Adagio":b<108?"Andante":b<120?"Moderato":b<168?"Allegro":"Presto";
  const drawBeats = () => { $("#mbeats").innerHTML = Array.from({length:per},(_,i)=>`<i class="${i===0?"acc":""}">${i+1}</i>`).join(""); };
  const setB = v => { bpm = Math.max(40, Math.min(208, Math.round(v))); $("#bpm").firstChild.textContent = bpm; $("#bpmr").value = bpm; $("#tname").textContent = name(bpm); LS.set("gtr-bpm", bpm); };
  const sched = () => { const ctx = actx; while (next < ctx.currentTime + 0.12){ const b = n % per, when = next; click(when, b===0);
      setTimeout(() => { document.querySelectorAll("#mbeats i").forEach((x,j)=>x.classList.toggle("on", j===b)); }, Math.max(0,(when-ctx.currentTime)*1000));
      next += 60/bpm; n++; } };
  const stop = () => { on = false; clearInterval(timer); const g = $("#mgo"); if (g) g.textContent = "▶ Start"; document.querySelectorAll("#mbeats i").forEach(x=>x.classList.remove("on")); };
  $("#mgo").onclick = () => { if (on) return stop(); const ctx = AC(); if (!ctx) return; on = true; n = 0; next = ctx.currentTime + 0.08; sched(); timer = setInterval(sched, 25); $("#mgo").textContent = "■ Stop"; };
  $("#bpmr").oninput = e => setB(+e.target.value);
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => setB(bpm + +b.dataset.d));
  app.querySelectorAll("[data-per]").forEach(b => b.onclick = () => { per = +b.dataset.per; n = 0; app.querySelectorAll("[data-per]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); drawBeats(); });
  $("#tap").onclick = () => { const t = performance.now(); taps = taps.filter(x => t-x < 2500).concat([t]); if (taps.length>=2){ const d = (taps[taps.length-1]-taps[0])/(taps.length-1); setB(60000/d); } };
  drawBeats(); setB(bpm); figStops.push(stop);
}

/* ---- tuner ---- */
function renderTuner(head, back){
  app.innerHTML = head("Tuner","--u6") + `<div class="panel tuner" style="--c:var(--u6)">
    <span class="eyebrow">Note you're playing</span><div class="tn" id="tn">–</div>
    <div id="tconc" class="fnote">Pluck one string at a time.</div>
    <svg class="gauge" viewBox="0 0 400 90" aria-hidden="true"><line x1="20" y1="60" x2="380" y2="60" stroke="var(--line)" stroke-width="4"/>
      ${[-50,-25,0,25,50].map(c=>`<line x1="${200+c*3.4}" y1="${c===0?30:44}" x2="${200+c*3.4}" y2="60" stroke="currentColor" stroke-width="${c===0?3:1.5}" opacity=".6"/><text x="${200+c*3.4}" y="82" text-anchor="middle" font-size="12" fill="currentColor" font-family="var(--mono)">${c>0?"+"+c:c}</text>`).join("")}
      <circle id="needle" cx="200" cy="52" r="10" fill="var(--muted)"/></svg>
    <div id="tmsg" class="out">Press Start and allow the microphone.</div>
    <div class="demo" style="justify-content:center"><button class="btn" id="tgo">Start tuner</button></div>
    <div class="section-h" style="width:100%"><h2>Hear each string</h2></div>
    <div class="demo" style="justify-content:center">${[0,1,2,3,4,5].map(i=>`<button class="btn small ghost" data-ref="${i}">${6-i} · ${SNAME[i]}</button>`).join("")}</div>
    <p class="note">Too high (needle right)? Loosen the string a little. Too low (needle left)? Tighten it. Tune up to the note. The tuner works best in a quiet room.</p></div>`;
  back();
  let stream = null, raf = null, an = null, buf = null;
  const stopT = () => { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t=>t.stop()); stream = null; const g=$("#tgo"); if (g) g.textContent = "Start tuner"; };
  app.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => { stopAllSound(); pluck(OPEN[+b.dataset.ref], 0, {vol:.7}); });
  $("#tgo").onclick = async () => {
    if (stream) return stopT();
    const ctx = AC(); if (!ctx || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $("#tmsg").textContent = "This browser can't use the microphone here."; return; }
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}); }
    catch(e){ $("#tmsg").textContent = "Microphone not allowed. In Safari, tap aA → Website Settings → Microphone → Allow."; return; }
    const src = ctx.createMediaStreamSource(stream); an = ctx.createAnalyser(); an.fftSize = 4096; src.connect(an); buf = new Float32Array(an.fftSize);
    $("#tgo").textContent = "Stop tuner"; $("#tmsg").textContent = "Pluck one open string and let it ring.";
    let smooth = null;
    const tick = () => { raf = requestAnimationFrame(tick); an.getFloatTimeDomainData(buf); const f = autoCorr(buf, ctx.sampleRate); if (!$("#tn")) return stopT();
      if (f < 0){ $("#needle").setAttribute("fill","var(--muted)"); return; }
      const m = 69 + 12*Math.log2(f/440); smooth = smooth==null || Math.abs(smooth-m)>0.7 ? m : smooth*0.8 + m*0.2;
      let si = 0; OPEN.forEach((o,i) => { if (Math.abs(o-smooth) < Math.abs(OPEN[si]-smooth)) si = i; });
      const target = OPEN[si], cents = Math.round((smooth-target)*100), near = Math.round(smooth);
      $("#tn").textContent = noteName(near); $("#tconc").textContent = `Closest string: ${6-si} (${SNAME[si]}) · ${f.toFixed(1)} Hz`;
      const ok = Math.abs(cents) <= 6;
      $("#needle").setAttribute("cx", 200 + Math.max(-50,Math.min(50,cents))*3.4); $("#needle").setAttribute("fill", ok ? "var(--good)" : "var(--bad)");
      $("#tmsg").textContent = Math.abs(cents) > 150 ? `Far from ${SNAME[si]}. Turn the peg slowly.` : ok ? `String ${6-si} is in tune!` : cents > 0 ? `${cents} cents sharp: loosen a little` : `${-cents} cents flat: tighten a little`; };
    tick();
  };
  figStops.push(stopT);
}
function autoCorr(b, sr){
  let rms = 0; for (let i=0;i<b.length;i++) rms += b[i]*b[i]; rms = Math.sqrt(rms/b.length); if (rms < 0.012) return -1;
  let r1 = 0, r2 = b.length-1; const th = 0.2;
  for (let i=0;i<b.length/2;i++) if (Math.abs(b[i])<th){ r1 = i; break; }
  for (let i=1;i<b.length/2;i++) if (Math.abs(b[b.length-i])<th){ r2 = b.length-i; break; }
  const x = b.slice(r1, r2), N = x.length, c = new Array(N).fill(0);
  for (let i=0;i<N;i++) for (let j=0;j<N-i;j++) c[i] += x[j]*x[j+i];
  let d = 0; while (d < N-1 && c[d] > c[d+1]) d++;
  let mx = -1, mp = -1; for (let i=d;i<N;i++) if (c[i] > mx){ mx = c[i]; mp = i; }
  if (mp <= 0) return -1;
  const a = c[mp-1]||0, bb = c[mp], cc = c[mp+1]||0, A = (a+cc-2*bb)/2, B = (cc-a)/2; const T0 = A ? mp - B/(2*A) : mp;
  const fq = sr/T0; return fq > 60 && fq < 1500 ? fq : -1;
}

/* ---- practice log ---- */
let pTimer = null, pStart = null;
function renderLog(head, back){
  if (!student){ app.innerHTML = head("Practice Log","--u9") + `<div class="empty">Add your name first so your minutes are saved.</div>`; back(); return; }
  const d = pdays(student), days = Array.from({length:7},(_,i)=>{ const x = new Date(); x.setDate(x.getDate()-6+i); return x; });
  const mx = Math.max(20, ...days.map(x => d[dkey(x)]||0));
  app.innerHTML = head("Practice Log","--u9") + `<div class="panel" style="--c:var(--u9)">
    <div class="timer" id="clock">00:00</div>
    <div class="ctrl" style="justify-content:center"><button class="btn big" id="pgo">▶ Start practice timer</button></div>
    <p class="note" style="text-align:center">Stop the timer when you finish, and your minutes are added to today. Or add minutes yourself:</p>
    <div class="ctrl" style="justify-content:center">${[5,10,15,20,30].map(m=>`<button class="btn small ghost" data-add="${m}">+${m} min</button>`).join("")}</div></div>
  <div class="stats"><div class="stat"><div class="v">${d[dkey(new Date())]||0}</div><div class="k">Minutes today</div></div>
    <div class="stat"><div class="v">${pStreak(student)}</div><div class="k">Day streak</div></div>
    <div class="stat"><div class="v">${pMinutes(student)}</div><div class="k">Total minutes</div></div>
    <div class="stat"><div class="v">${Object.keys(d).length}</div><div class="k">Days practiced</div></div></div>
  <div class="section-h"><h2>This week</h2></div>
  <div class="panel"><div class="bars">${days.map(x=>{ const m = d[dkey(x)]||0; return `<div><span>${m||""}</span><i style="height:${Math.round(m/mx*110)}px"></i><span>${x.toLocaleDateString(undefined,{weekday:"short"})}</span></div>`; }).join("")}</div></div>
  <p class="howto" id="pmsg" style="margin-top:12px"></p>`;
  back();
  const fmt = ms => { const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
  const addMin = m => { const before = badges(student).filter(b=>b.got).map(b=>b.name); const k = dkey(new Date()); practice[student] = Object.assign({}, pdays(student)); practice[student][k] = (practice[student][k]||0) + m; saveAll();
    const nb = badges(student).filter(b=>b.got && !before.includes(b.name)); renderLog(head, back);
    $("#pmsg").innerHTML = `Added ${m} minute${m===1?"":"s"}.` + (nb.length ? ` New badge: <b>${nb.map(b=>esc(b.name)).join(", ")}</b>!` : ""); if (nb.length){ confetti(); sfx.star(); } else sfx.right(); };
  const tick = () => { const c = $("#clock"); if (c && pStart) c.textContent = fmt(Date.now()-pStart); };
  if (pStart){ $("#pgo").textContent = "■ Stop and save"; tick(); clearInterval(pTimer); pTimer = setInterval(tick, 500); }
  $("#pgo").onclick = () => {
    if (!pStart){ pStart = Date.now(); LS.set("gtr-pstart", pStart); $("#pgo").textContent = "■ Stop and save"; pTimer = setInterval(tick, 500); return; }
    const m = Math.round((Date.now()-pStart)/60000); clearInterval(pTimer); pStart = null; LS.set("gtr-pstart", null);
    if (m >= 1) addMin(Math.min(m, 180)); else { $("#pgo").textContent = "▶ Start practice timer"; $("#clock").textContent = "00:00"; $("#pmsg").textContent = "Less than a minute, so nothing was added."; }
  };
  app.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addMin(+b.dataset.add));
  figStops.push(() => clearInterval(pTimer));
}
pStart = LS.get("gtr-pstart", null);

/* ---- note reader game ---- */
function startReader(lv){
  if (needStudent()) return;
  const STAFF = ["E3","F3","G3","A3","B3","C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5"];
  const CHS = ["Em","E","Am","A","C","G","D","Dm","E7","A7","D7","G7","Fmaj7","F","Bm"];
  const qs = []; let last = null;
  while (qs.length < 10){
    let q = lv===1 ? STAFF[Math.floor(Math.random()*STAFF.length)] : lv===2 ? [Math.floor(Math.random()*6), Math.floor(Math.random()*6)].join(",") : CHS[Math.floor(Math.random()*CHS.length)];
    if (q!==last){ qs.push(q); last = q; } }
  go({page:"reader", lv, qs, i:0, score:0, streak:0, bestStreak:0, picked:null});
}
function readerAnswer(v, q){ if (v.lv===1) return pretty(q); if (v.lv===2){ const [s,f] = q.split(",").map(Number); return noteName(OPEN[s]+f); } return q; }
function readerSound(v, q){ if (v.lv===1){ const ps = posOf(parseId(q).midi); if (ps) pluck(OPEN[ps[0]]+ps[1]); } else if (v.lv===2){ const [s,f] = q.split(",").map(Number); pluck(OPEN[s]+f); } else strum(q); }
function renderReader(){
  const v = view, q = v.qs[v.i], ans = readerAnswer(v, q);
  const CHS = ["Em","E","Am","A","C","G","D","Dm","E7","A7","D7","G7","Fmaj7","F","Bm"];
  const opts = v.lv===1 ? "CDEFGAB".split("") : (v.opts = v.opts && v.opts.q===v.i ? v.opts : {q:v.i, list: shuffle([ans].concat(shuffle((v.lv===2?NN:CHS).filter(x=>x!==ans)).slice(0,3)))}).list;
  let pic = "", ques = "";
  if (v.lv===1){ ques = "What is this note's name?"; pic = staffSVG([q], {spacing:80, width:200, height:192}); }
  else if (v.lv===2){ const [s,f] = q.split(",").map(Number); ques = `What note is this? (${6-s}${["th","th","th","rd","nd","st"][s]} string, ${f===0?"open":"fret "+f})`; pic = fretboardSVG({frets:5, dots:[{s,f,t:"?",cls:"on"}]}); }
  else { ques = "Which chord is this?"; pic = chordSVG(q, {title:false}); }
  app.innerHTML = `<div class="quiz" style="--c:var(--u5)">
    <div class="qhead"><span class="kind">Guitar Challenge · Level ${v.lv}</span><span class="eyebrow">Question ${v.i+1} of 10 · score ${v.score}</span></div>
    <div class="meter"><i style="width:${v.i*10}%"></i></div>
    ${v.streak>=2 ? `<p class="streak">${v.streak} in a row!</p>` : ""}
    <div class="qcard"><p class="qtext">${ques}</p>
      <div style="max-width:${v.lv===2?"420px":v.lv===3?"180px":"320px"};margin:0 auto">${pic}</div>
      <div class="answers">${opts.map(o=>`<button data-o="${escH(o)}" class="${v.picked==null?"":o===ans?"right":o===v.picked?"wrong":""}" ${v.picked!=null?"disabled":""}>${o}</button>`).join("")}</div>
      ${v.picked!=null ? `<div class="explain ${v.picked===ans?"ok":"no"}"><strong>${v.picked===ans?"Correct!":"It's "+ans+"."}</strong>${v.lv===3?esc(chordText(q)):v.lv===1?(()=>{const ps=posOf(parseId(q).midi); return ps?`Play it on the ${6-ps[0]}${["th","th","th","rd","nd","st"][ps[0]]} string, ${ps[1]===0?"open":"fret "+ps[1]}.`:"";})():""}</div>` : ""}
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Quit</button>${v.picked!=null ? `<button class="btn" id="next">${v.i<9?"Next →":"See my stars"}</button>` : ""}</div></div>`;
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    v.picked = b.dataset.o; readerSound(v, q);
    if (v.picked===ans){ v.score++; v.streak++; v.bestStreak = Math.max(v.bestStreak, v.streak); sfx.right(); } else { v.streak = 0; sfx.wrong(); }
    renderReader();
  });
  $("#quit").onclick = () => go({page:"tool", tool:"readerpick"});
  const nx = $("#next"); if (nx) nx.onclick = () => {
    if (v.i < 9){ v.i++; v.picked = null; renderReader(); return; }
    const p = v.score*10, stars = starsFor(p);
    const r = { id:"n"+Date.now().toString(36), student, unit:"reader"+v.lv, kind:"reader", score:v.score, total:10, pct:p, stars, bestStreak:v.bestStreak, at:new Date().toISOString() };
    const nb = recordResult(r); view = {page:"done", r, newBadges:nb}; render(); window.scrollTo({top:0});
    if (stars>=2 || nb.length){ confetti(); sfx.star(); }
  };
}
