  else if(pview.tab==="reading"&&who){ const r=P(who).reads.slice().reverse();
    body=kids+`<h3 style="font-size:20px">The course books, in order</h3><p class="note">Have each one on hand before its unit starts. The library usually has them all.</p>
      <table class="t"><tr><th>Lessons</th><th>Book</th><th>Progress</th></tr>${BOOK_ORDER.map(k=>{ const B=BOOKDB[k], up=bookPct(k,who), ls=LESSONS.map((_,j)=>j).filter(j=>planOf(j).b===k); return `<tr><td style="white-space:nowrap">${ls[0]+1}–${ls[ls.length-1]+1}</td><td><i>${B.title}</i>, ${B.author}<div class="note" style="font-size:13px">${B.note}</div></td><td style="white-space:nowrap">${up>=B.total?"✓ Finished":up?(B.unit==="half"?"first half read":`through ch. ${up} of ${B.total}`):"not started"}</td></tr>`; }).join("")}</table>
      <p style="margin-top:18px"><b>${P(who).minutes||0} minutes</b> of reading so far.</p>`+(r.length?`<table class="t"><tr><th>Date</th><th>Book</th><th>Read</th><th>Minutes</th></tr>${r.map(x=>`<tr><td>${fmtDate(x.at)}</td><td>${esc(x.title||"—")}</td><td>${esc(x.ch||"")}</td><td>${x.min}</td></tr>`).join("")}</table>`:`<p class="note">No reading logged yet.</p>`)
      +`<h3 style="margin-top:22px;font-size:20px">More Boxcar Children</h3><p class="note">For extra reading after Unit 1. These are the next books Gertrude Chandler Warner wrote, in order:</p><ol>${MORE_BOXCAR.map(t=>`<li><i>${esc(t)}</i></li>`).join("")}</ol>
      <h3 style="margin-top:22px;font-size:20px">More good books for free reading</h3><p class="note">Wholesome, well-written books at about a 3rd grade level. Please preview any book yourself, since editions differ.</p><ul class="booklist">${BOOKS.map(([t,a])=>`<li><i>${esc(t)}</i>, ${esc(a)}</li>`).join("")}</ul>`; }
  else if(pview.tab==="art"&&who){ body=kids+`<p class="note">Photos of finished art projects. They're saved on this device only and aren't in the backup code.</p><div id="pGallery">Loading…</div>`; }
  else if(pview.tab==="guide"){
    body=`<h3 style="font-size:20px">How the course works</h3>
      <p>The course has <b>5 units</b> with <b>6 lessons</b> each. Lessons 1–5 of each unit teach. Lesson 6 is a review with a reading check, a spelling check, a grammar check, and a poem recitation. Plan on one lesson every day or two, about 40–60 minutes each.</p>
      <p>Each teaching lesson has six parts, like a course book page:</p>
      <ul><li><b>📖 Reading:</b> an original story, written for this course, with a virtue and a Bible verse (KJV). Have your child read it aloud to you when you can.</li>
      <li><b>🔤 Spelling & Phonics:</b> a spelling pattern, 8 words, and digital letter tiles. The app reads each word aloud.</li>
      <li><b>✏️ Grammar & Usage:</b> a short rule with practice.</li>
      <li><b>🎵 Poetry, 🎨 Art, or 🌍 Geography:</b> these take turns. Poems are classics to memorize. Art lessons link to famous paintings on Wikimedia Commons. Please open those with your child, since the app can't show the pictures itself.</li>
      <li><b>🖌️ Art projects:</b> 15 hands-on projects, one in every art lesson and every poetry lesson. Each has a supply list and step-by-step directions. Your child can save a photo of the finished piece to their art gallery.</li>
      <li><b>📝 Writing:</b> a prompt to do in a notebook or type into the app.</li>
      <li><b>📕 Book Time:</b> every lesson assigns the next chapters of a good chapter book. Your child reads from a real copy, tells it back, and talks about one question with you. The books are <i>Cam Jansen and the Mystery at the Monkey House</i>, <i>The Boxcar Children</i>, <i>Little House in the Big Woods</i>, <i>The Courage of Sarah Noble</i>, <i>Mr. Popper’s Penguins</i>, and <i>Charlotte’s Web</i>. The full list is under 📚 Reading log.</li></ul>
      <p>Children earn a star for each part and two bonus stars for finishing a lesson. “Read it to me” and the spelling words use your device's built-in voice.</p>`; }
  else if(pview.tab==="settings"){ let code=""; try{ code=btoa(unescape(encodeURIComponent(JSON.stringify({app:"wildflower-la3",roster,prog})))); }catch(e){}
    body=`<h3 style="font-size:20px">Back up all progress</h3><p class="note">Progress is saved in this browser on this device. If the browser's data is cleared, it's lost. Copy this code somewhere safe so you can restore it later or move it to another device.</p>
      <textarea id="bk" readonly rows="4" style="width:100%;font-size:13px;font-family:ui-monospace,monospace">${code}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn small" id="bkcopy">Copy backup code</button><span class="note" id="bkmsg"></span></div>
      <h3 style="font-size:20px;margin-top:20px">Restore from a backup code</h3><textarea id="rs" rows="3" style="width:100%;font-size:13px" placeholder="Paste a backup code here"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn ghost small" id="rsgo">Restore</button><span class="note" id="rsmsg"></span></div>
      <h3 style="font-size:20px;margin-top:20px">Change PIN</h3><div class="row"><input id="newpin" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN" style="width:150px"><button class="btn ghost small" id="pinsave">Save</button><span class="note" id="pinmsg"></span></div>
      <h3 style="font-size:20px;margin-top:20px">Students</h3>${roster.length?roster.map(n=>`<div class="row" style="margin:6px 0"><span style="min-width:130px"><b>${esc(n)}</b> · ⭐ ${starCount(n)}</span><button class="btn small danger" data-reset="${esc(n)}">Reset progress</button><button class="btn small danger" data-remove="${esc(n)}">Remove</button></div>`).join(""):`<p class="note">No students yet.</p>`}<p class="note" id="stumsg"></p>`; }
  else body=kids;
  box.innerHTML=`<h1 style="font-size:30px">Parent area 👪</h1><div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${pview.tab===k}">${l}</button>`).join("")}</div>${body}
    <div class="row" style="margin-top:24px"><button class="btn ghost small" id="lockBtn">🔒 Lock</button></div>`;
  box.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ pview.tab=b.dataset.tab; renderParent(); });
  box.querySelectorAll("[data-who]").forEach(b=>b.onclick=()=>{ pview.who=b.dataset.who; renderParent(); });
  $("lockBtn").onclick=()=>{ parentOK=false; go(student?"home":"pick"); };
  if(pview.tab==="art"&&who) galleryHTML(who).then(g=>{ const el=$("pGallery"); if(el) el.innerHTML=g; });
  if(pview.tab==="settings"){
    $("bkcopy").onclick=()=>{ const ta=$("bk"); try{ navigator.clipboard.writeText(ta.value).then(()=>{$("bkmsg").textContent="Copied.";},()=>{ta.select();$("bkmsg").textContent="Selected. Press copy.";}); }catch(e){ ta.select(); $("bkmsg").textContent="Selected. Press copy."; } };
    let armed=false;
    $("rsgo").onclick=()=>{ let d; try{ d=JSON.parse(decodeURIComponent(escape(atob($("rs").value.trim())))); }catch(e){ $("rsmsg").textContent="That code isn't a valid backup."; return; }
      if(!d||d.app!=="wildflower-la3"||!Array.isArray(d.roster)){ $("rsmsg").textContent="That code isn't a backup for this app."; return; }
      if(!armed){ armed=true; $("rsgo").textContent="Yes, replace everything"; $("rsmsg").textContent="This replaces all progress on this device."; return; }
      roster=d.roster; prog=d.prog||{}; if(!roster.includes(student)) student=""; saveAll(); renderParent(); };
    $("pinsave").onclick=()=>{ const v=$("newpin").value.trim(); if(!/^\d{4}$/.test(v)){ $("pinmsg").textContent="Use exactly 4 numbers."; return; } pin=v; LS.set("la3-pin",pin); $("pinmsg").textContent="PIN changed."; $("newpin").value=""; };
    const twoTap=(b,label,act)=>b.onclick=()=>{ if(b.dataset.armed){ act(); return; } const orig=b.textContent; b.dataset.armed="1"; b.textContent=label; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=orig; } },4000); };
    box.querySelectorAll("[data-reset]").forEach(b=>twoTap(b,"Tap again to reset",()=>{ const n=b.dataset.reset; delete prog[n]; P(n); saveAll(); renderParent(); $("stumsg").textContent=`${n}'s progress was reset.`; }));
    box.querySelectorAll("[data-remove]").forEach(b=>twoTap(b,"Tap again to remove",()=>{ const n=b.dataset.remove; roster=roster.filter(x=>x!==n); delete prog[n]; if(student===n) student=""; saveAll(); renderParent(); $("stumsg").textContent=`${n} was removed.`; }));
  }
}

/* ================= start ================= */
if('serviceWorker' in navigator && /github\.io$/.test(location.hostname)){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
if(!roster.includes(student)) student="";
go(student?"home":"pick");
(async()=>{ const saved=await IDB.get(); if(!saved){ IDB.put(snapshot()); return; }
  const g=(k,d)=>{ try{ return saved[k]?JSON.parse(saved[k]):d; }catch(e){ return d; } };
  const count=p=>Object.values(p||{}).reduce((a,x)=>a+Object.keys((x&&x.stars)||{}).length,0);
  if(count(g("la3-prog",{}))>count(prog)||(!roster.length&&g("la3-roster",[]).length)){
    try{ Object.entries(saved).forEach(([k,v])=>localStorage.setItem(k,v)); }catch(e){}
    roster=g("la3-roster",[]); prog=g("la3-prog",{}); pin=g("la3-pin",""); student=g("la3-student",""); if(!roster.includes(student)) student="";
    const cur=document.querySelector(".screen.on"); if(cur&&(cur.id==="pick"||cur.id==="home")) go(student?"home":"pick");
  } else IDB.put(snapshot()); })();
</script>
<script src="../rhythm/report.js"></script>
<script>setTimeout(()=>{ try{ const p=JSON.parse(localStorage.getItem('la3-prog')||'{}'); rhythmCatchUp('la3', Object.values(p).flatMap(s=>Object.values((s&&s.lessons)||{}).filter(l=>l&&l.done).map(l=>l.doneAt))); }catch(e){} }, 1500);</script>
</body>
</html>
