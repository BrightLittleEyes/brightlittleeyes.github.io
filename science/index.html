<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Science">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Grade 6 Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --ink:#15252A; --muted:#566A70; --line:#D3DEDC; --soft:#E6EEEC;
  --accent:#0E7C6B; --accent-ink:#FFFFFF;
  --good:#1D7A3A; --good-bg:#E2F3E7; --bad:#B3261E; --bad-bg:#FBE6E4;
  --u1:#C2562D; --u2:#B7860F; --u3:#4F7A25; --u4:#3B4FA3; --u5:#0E7C6B; --u6:#6B3FA0;
  --u7:#2F7FB8; --u8:#C0392B; --u9:#7B4FC9; --u10:#C2446E; --u11:#2E8B57; --u12:#8A6D1E; --u13:#3C7D3C; --u14:#B5560F; --u15:#6D5B45; --u16:#4A5FA8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1618; --surface:#162226; --ink:#E4EEEC; --muted:#9AB0B3; --line:#2A3A3E; --soft:#1D2B2F;
    --accent:#3FBFA8; --accent-ink:#06201B;
    --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
    --u1:#E57C52; --u2:#E0B23C; --u3:#8DBB57; --u4:#8C9CF0; --u5:#3FBFA8; --u6:#B48AE6;
    --u7:#6CB4E8; --u8:#F07A6A; --u9:#B394F0; --u10:#F08AAE; --u11:#6FCF97; --u12:#D9B54A; --u13:#8FCB7A; --u14:#F0A05A; --u15:#C2AE92; --u16:#95A6EE;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1618; --surface:#162226; --ink:#E4EEEC; --muted:#9AB0B3; --line:#2A3A3E; --soft:#1D2B2F;
  --accent:#3FBFA8; --accent-ink:#06201B;
  --good:#6BD08A; --good-bg:#15301E; --bad:#FF8A80; --bad-bg:#3A1A18;
  --u1:#E57C52; --u2:#E0B23C; --u3:#8DBB57; --u4:#8C9CF0; --u5:#3FBFA8; --u6:#B48AE6;
    --u7:#6CB4E8; --u8:#F07A6A; --u9:#B394F0; --u10:#F08AAE; --u11:#6FCF97; --u12:#D9B54A; --u13:#8FCB7A; --u14:#F0A05A; --u15:#C2AE92; --u16:#95A6EE;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto;background:none;border:0;padding:0}
.brand .flask{width:30px;height:30px}
.nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.nav button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who label{color:var(--muted)}
select,input[type=text]{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

/* home */
.hero{padding-block:36px 20px;display:grid;gap:10px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:18px}
.tile{--c:var(--accent);position:relative;text-align:left;background:var(--surface);border:2px solid var(--c);border-radius:6px;padding:12px 14px 14px;display:grid;gap:2px;transition:transform .15s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px var(--c)}
.tile .num{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--c)}
.tile .sym{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--c);letter-spacing:-.02em;margin-top:2px}
.tile .nm{font-weight:700;font-size:16px;line-height:1.25;min-height:2.5em}
.tile .mass{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.tile .mass b{color:var(--ink);font-weight:700}
.legend{margin-top:14px;font-size:13px;color:var(--muted);font-family:var(--mono)}

/* unit page */
.back{border:0;background:none;color:var(--muted);padding:18px 0 6px;font-size:15px}
.unithead{display:flex;gap:18px;align-items:center;padding-block:6px 20px;flex-wrap:wrap}
.unithead .badge{--c:var(--accent);width:84px;height:84px;border:2px solid var(--c);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--c);background:var(--surface);flex:none}
.unithead h1{font-size:clamp(26px,4vw,38px)}
.unithead p{margin:4px 0 0;color:var(--muted)}
.cols{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.lessonlist{display:grid;gap:6px;position:sticky;top:80px}
@media (max-width:760px){.lessonlist{position:static}}
.lessonlist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.lessonlist button span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lessonlist button[aria-current="true"]{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.lessonlist .sep{height:1px;background:var(--line);margin:8px 0}
.lessonlist .act{font-weight:700}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px clamp(18px,4vw,36px)}
.lesson h2{font-size:28px;margin-bottom:12px}
.lesson p{max-width:66ch;margin:0 0 14px}
.lesson ul{max-width:64ch;padding-left:22px;margin:0 0 14px}
.lesson li{margin-bottom:6px}
.vocab{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.vocab h3{font-size:14px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:500}
.vocab dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.vocab dt{font-weight:700;color:var(--c)}
.vocab dd{margin:0}
@media (max-width:520px){.vocab dl{grid-template-columns:1fr}.vocab dd{margin-bottom:6px}}
.tryit{margin-top:16px;background:var(--soft);border-radius:8px;padding:12px 16px;font-size:16px}
.tryit b{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--muted);font-weight:500;margin-bottom:2px}
.lessonnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}

.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:8px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

/* quiz */
.quiz{max-width:720px;margin:0 auto;padding-top:20px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qhead .kind{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:22px}
.meter i{display:block;height:100%;background:var(--c);transition:width .25s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,30px)}
.qcard .qtext{font-size:21px;font-weight:700;margin:0 0 18px;line-height:1.35}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:17px}
.choice .l{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none;width:1.4em}
.choice:hover:not([disabled]){border-color:var(--c)}
.choice.picked{border-color:var(--c);background:var(--soft)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice[disabled]{cursor:default}
.explain{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:16px}
.explain.ok{background:var(--good-bg);color:var(--ink)}
.explain.no{background:var(--bad-bg);color:var(--ink)}
.explain strong{display:block}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* results */
.result{text-align:center;padding-block:10px 24px}
.result .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--c)}
.result .sub{font-family:var(--mono);color:var(--muted);margin-top:6px}
.result .msg{font-size:20px;font-weight:700;margin-top:12px}
.review{display:grid;gap:10px;margin-top:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:6px;padding:12px 14px;font-size:15px}
.review .item.miss{border-left-color:var(--bad)}
.review .item p{margin:0 0 4px}
.review .item .q{font-weight:700}
.review .item .muted{color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .v{font-family:var(--mono);font-weight:700;font-size:28px}
.stat .k{font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.m{background:var(--soft);color:var(--ink)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:99px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.section-h{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin-top:28px;margin-bottom:10px}
.section-h h2{font-size:22px}
/* pictures and animations */
.fig{margin:6px 0 22px;background:var(--soft);border-radius:10px;padding:14px clamp(10px,3vw,20px) 12px;color:var(--ink)}
.fig .figtag{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;display:block;margin-bottom:8px}
.fig svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.fig canvas{display:block;width:100%}
.fig figcaption{font-size:15px;color:var(--muted);margin-top:10px;max-width:66ch}
.fig svg text{font-family:var(--body)}
.fig .lb{font-size:14px;font-weight:700;fill:currentColor}
.fig .sm{font-size:12px;fill:currentColor;opacity:.8}
.fig .in{font-size:20px;font-weight:700;fill:#fff}
.fig .in.dk{fill:#333}
.fig .cloud{fill:#F1F5F8;stroke:#9AA9B2;stroke-width:1.5}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:12px;font-size:15px}
.ctrl input[type=range]{accent-color:var(--c);flex:1;min-width:120px}
.ctrl input[type=number]{font:inherit;font-size:15px;width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.out{font-family:var(--mono);font-size:14px;font-weight:700;margin:8px 0 0}
.btn.small{padding:6px 14px;font-size:15px}
.wtrows{display:grid;gap:8px;margin-top:14px}
.wtrow{display:grid;grid-template-columns:70px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.wtrow b{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.wtbar{height:14px;background:var(--surface);border-radius:7px;overflow:hidden}
.wtbar i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .3s}
.watch{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.watch h3{font-size:14px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.watch ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.watch a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px 6px 8px;font-size:15px}
.watch a:hover{border-color:var(--c)}
.watch a svg{width:22px;height:22px;flex:none}
.watch a.vid{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px 10px 10px;max-width:520px}
.watch a.vid:hover{border-color:var(--c)}
.watch .play{width:64px;height:44px;border-radius:8px;background:#E0483C;display:grid;place-items:center;flex:none}
.watch .play svg{width:22px;height:22px}
.watch a.vid b{display:block;font-size:16px;line-height:1.3}
.watch a.vid small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.watch p a{color:var(--c)}
.watch p{font-size:13px;color:var(--muted);margin:8px 0 0}
.fig [class*="bob"],.fig .melt-ice,.fig .melt-pool,.fig .bub,.fig .vap,.fig .rain,.fig [class^="p-"]{transform-box:fill-box}
.bob{animation:bob 3s ease-in-out infinite}.bob.d1{animation-delay:-1s}.bob.d2{animation-delay:-2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.melt-ice{transform-origin:center bottom;animation:melt 6s ease-in-out infinite}
@keyframes melt{0%,15%{transform:scale(1)}80%,100%{transform:scale(.25);opacity:.4}}
.melt-pool{transform-origin:center;animation:pool 6s ease-in-out infinite}
@keyframes pool{0%,15%{transform:scaleX(.3)}80%,100%{transform:scaleX(1)}}
.bub{animation:bub 2.4s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-78px);opacity:0}}
.vap{animation:vap 3s ease-out infinite;opacity:0}
@keyframes vap{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.rain{animation:rain 1.2s linear infinite;opacity:0}
@keyframes rain{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(50px);opacity:0}}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.p-r{animation:pr 2.5s ease-in-out infinite alternate}.p-l{animation:pl 2.5s ease-in-out infinite alternate}
@keyframes pr{from{transform:translateX(0)}to{transform:translateX(10px)}}
@keyframes pl{from{transform:translateX(0)}to{transform:translateX(-10px)}}
.p-grow{transform-origin:center bottom;animation:pg 2.5s ease-in-out infinite alternate}
@keyframes pg{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.p-widen{transform-origin:center;animation:pw 2.5s ease-in-out infinite alternate}
@keyframes pw{from{transform:scaleX(.3)}to{transform:scaleX(2.6)}}

/* stars, badges, games, parent */
.st,.stars{color:#E0A800}
.stars{letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}
.starchip{font-family:var(--mono);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px}
.starbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;max-width:420px}
.starbar i{display:block;height:100%;background:linear-gradient(90deg,#F2B705,#E0A800);border-radius:5px}
.cont{position:relative;display:grid;gap:2px;text-align:left;width:100%;max-width:560px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px 56px 14px 18px;margin-top:6px}
.cont b{font-size:18px;font-family:var(--display)}
.cont small{color:var(--muted);font-size:14px}
.cont .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--accent)}
.tile .checks{display:flex;align-items:center;gap:5px;margin-top:4px}
.tile .checks i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c)}
.tile .checks i.on{background:var(--c)}
.tile .checks small{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.tile .mass .stars{font-size:13px}
.lessonlist .ck{min-width:1.6em;display:inline-block}
.lessonlist .ck.on{color:var(--good);font-weight:700;font-size:15px}
.lessonlist .act span{min-width:3.6em}
.finish{margin-top:20px;display:flex;justify-content:center}
.btn.big{font-size:18px;padding:12px 22px}
.btn .st{color:#FFE27A}
.finish .got{font-weight:700;color:var(--good)}
.resumed{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:15px}
.linkbtn{border:0;background:none;color:var(--c);text-decoration:underline;padding:0;font-size:15px}
.streak{font-family:var(--mono);font-weight:700;color:#E0A800;margin:-12px 0 12px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bigstars{font-size:54px;line-height:1;margin:8px 0 4px;display:flex;justify-content:center;gap:6px}
.bigstars span{color:var(--line)}
.bigstars span.on{color:#F2B705;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.newbadge{margin-top:12px;background:var(--soft);display:inline-block;padding:8px 14px;border-radius:8px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.howto{color:var(--muted);margin:0 0 14px}
.board{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.colw{display:grid;gap:10px;align-content:start}
.tcard{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;text-align:left;font-size:16px;min-height:52px}
.tcard.word{font-weight:700}
.tcard.sel{border-color:var(--c);background:var(--soft);box-shadow:0 0 0 3px var(--soft)}

<script>
/* ============ PICTURES, ANIMATIONS, VIDEOS ============ */
const FIG = {};
let figStops = [];
function stopFigs(){ figStops.forEach(f => { try{ f(); }catch(e){} }); figStops = []; }
function cssv(el, name){ return getComputedStyle(el).getPropertyValue(name).trim(); }
function loop(fn){
  let alive = true, last = performance.now();
  const tick = t => { if (!alive) return; const dt = Math.min(64, t - last); last = t; fn(t, dt); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  return () => { alive = false; };
}
function canvasCtx(cv, h){
  const w = Math.max(280, cv.clientWidth || 600), dpr = window.devicePixelRatio || 1;
  if (cv._w !== w){ cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+"px"; cv._w = w; }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w, h };
}
const ARROW = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>`;
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

/* ---------- Unit 1 ---------- */
FIG["matter-0"] = { tag:"See it", cap:"Balls stand for atoms. Water is a compound (two different elements). Oxygen gas is a molecule of one element. Carbon dioxide is another compound.",
  html:`<svg viewBox="0 0 600 210" role="img" aria-label="Models of a water molecule, an oxygen molecule, and a carbon dioxide molecule">
  <g class="bob"><circle cx="62" cy="128" r="20" fill="#F4F4F4" stroke="#8A9599" stroke-width="2"/><circle cx="138" cy="128" r="20" fill="#F4F4F4" stroke="#8A9599" stroke-width="2"/>
  <circle cx="100" cy="92" r="34" fill="#E0483C"/><text x="100" y="98" text-anchor="middle" class="in">O</text><text x="62" y="133" text-anchor="middle" class="in dk">H</text><text x="138" y="133" text-anchor="middle" class="in dk">H</text></g>
  <g class="bob d1"><circle cx="272" cy="100" r="34" fill="#E0483C"/><circle cx="328" cy="100" r="34" fill="#E0483C"/><text x="272" y="106" text-anchor="middle" class="in">O</text><text x="328" y="106" text-anchor="middle" class="in">O</text></g>
  <g class="bob d2"><circle cx="444" cy="100" r="30" fill="#E0483C"/><circle cx="556" cy="100" r="30" fill="#E0483C"/><circle cx="500" cy="100" r="28" fill="#3D4347"/>
  <text x="444" y="106" text-anchor="middle" class="in">O</text><text x="500" y="106" text-anchor="middle" class="in">C</text><text x="556" y="106" text-anchor="middle" class="in">O</text></g>
  <text x="100" y="180" text-anchor="middle" class="lb">Water · H₂O</text><text x="100" y="198" text-anchor="middle" class="sm">compound</text>
  <text x="300" y="180" text-anchor="middle" class="lb">Oxygen gas · O₂</text><text x="300" y="198" text-anchor="middle" class="sm">molecule of one element</text>
  <text x="500" y="180" text-anchor="middle" class="lb">Carbon dioxide · CO₂</text><text x="500" y="198" text-anchor="middle" class="sm">compound</text></svg>` };

FIG["matter-1"] = { tag:"Play with it", cap:"Slide the temperature. Watch the particles vibrate in a solid, slide around in a liquid, and zoom apart in a gas.",
  html:`<canvas class="cv" aria-label="Particles in a box that change state as temperature changes"></canvas>
  <div class="ctrl"><label for="f-temp">Temperature</label><input type="range" id="f-temp" min="-30" max="140" value="-15"><output id="f-tempo" class="out"></output></div>`,
  init(root){
    const cv = root.querySelector("canvas"), sl = root.querySelector("#f-temp"), out = root.querySelector("#f-tempo");
    const N = 40, H = 250, S = 18;
    let P = [];
    for (let i=0;i<N;i++) P.push({x:0,y:0,vx:Math.random()-.5,vy:Math.random()-.5,c:i%8,r:Math.floor(i/8),init:false});
    return loop(() => {
      const {ctx,w,h} = canvasCtx(cv,H), T = +sl.value;
      const bx=20, by=14, bw=w-40, bh=h-28, cx=bx+bw/2, bottom=by+bh;
      const state = T<0?"Solid":T<100?"Liquid":"Gas";
      out.textContent = `${T} °C · ${state==="Solid"?"Solid (ice)":state==="Liquid"?"Liquid (water)":"Gas (water vapor)"}`;
      const color = cssv(root,"--u1"), ink = cssv(root,"--muted");
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.strokeRect(bx,by,bw,bh);
      const top = state==="Liquid" ? bottom - bh*0.5 : by;
      if (state==="Liquid"){ ctx.strokeStyle = color; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.moveTo(bx,top); ctx.lineTo(bx+bw,top); ctx.stroke(); ctx.setLineDash([]); }
      for (const p of P){
        if (!p.init){ p.x = cx+(p.c-3.5)*S; p.y = bottom-12-p.r*S; p.init = true; }
        if (state==="Solid"){
          const tx = cx+(p.c-3.5)*S, ty = bottom-12-p.r*S, amp = 0.6+(T+30)/30*1.4;
          p.x += (tx-p.x)*0.12 + (Math.random()-.5)*amp; p.y += (ty-p.y)*0.12 + (Math.random()-.5)*amp;
        } else {
          const v = state==="Liquid" ? 0.7 + T/100*1.1 : 3 + (T-100)/40*2.5;
          p.vx += (Math.random()-.5)*0.5; p.vy += (Math.random()-.5)*0.5 + (state==="Liquid"?0.05:0);
          const m = Math.hypot(p.vx,p.vy)||1; p.vx = p.vx/m*v; p.vy = p.vy/m*v;
          p.x += p.vx; p.y += p.vy;
          if (p.x<bx+8){p.x=bx+8;p.vx=Math.abs(p.vx);} if (p.x>bx+bw-8){p.x=bx+bw-8;p.vx=-Math.abs(p.vx);}
          if (p.y<top+8){p.y=Math.min(p.y+2,top+8);p.vy=Math.abs(p.vy);} if (p.y>bottom-8){p.y=bottom-8;p.vy=-Math.abs(p.vy);}
        }
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,Math.PI*2); ctx.fill();
      }
    });
  }};

FIG["matter-2"] = { tag:"See it", cap:"Left: melting changes only the state, so it's a physical change. Right: bubbles of a brand-new gas mean a chemical change.",
  html:`<svg viewBox="0 0 600 230" role="img" aria-label="An ice cube melting next to a beaker of vinegar and baking soda bubbling">
  <ellipse class="melt-pool" cx="150" cy="150" rx="70" ry="9" fill="#8EC3E6"/>
  <rect class="melt-ice" x="122" y="92" width="56" height="56" rx="6" fill="#D6EEFB" stroke="#3B82C4" stroke-width="2"/>
  <path d="M400 55 L400 172 Q400 182 410 182 L490 182 Q500 182 500 172 L500 55" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="403" y="100" width="94" height="79" fill="#F2D7A6"/><ellipse cx="450" cy="100" rx="47" ry="6" fill="#FFF6E3"/>
  ${[[418,0],[432,.6],[447,1.2],[461,.3],[476,.9],[488,1.5],[425,1.8],[468,2.1]].map(([x,d])=>`<circle class="bub" style="animation-delay:${d}s" cx="${x}" cy="172" r="${4+(x%3)}" fill="none" stroke="#B7860F" stroke-width="2"/>`).join("")}
  <text x="150" y="202" text-anchor="middle" class="lb">Physical change</text><text x="150" y="220" text-anchor="middle" class="sm">ice melts, still H₂O</text>
  <text x="450" y="202" text-anchor="middle" class="lb">Chemical change</text><text x="450" y="220" text-anchor="middle" class="sm">baking soda + vinegar make CO₂ gas</text></svg>` };

/* ---------- Unit 2 ---------- */
FIG["motion-0"] = { tag:"See it", cap:"At the top of each swing the ball stops, so it's all potential energy. At the bottom it's fastest: all kinetic. The total never changes.",
  html:`<canvas class="cv" aria-label="A swinging pendulum with bars showing potential and kinetic energy trading places"></canvas>`,
  init(root){
    const cv = root.querySelector("canvas"), th0 = 0.85;
    return loop(t => {
      const {ctx,w,h} = canvasCtx(cv,250);
      const ink = cssv(root,"--ink"), mut = cssv(root,"--muted"), c1 = cssv(root,"--u2"), c2 = cssv(root,"--u1");
      const L = Math.min(165, w*0.3/Math.sin(th0)), px = w*0.32, py = 22;
      const th = th0*Math.cos(t/2400*2*Math.PI);
      const bx = px+L*Math.sin(th), by = py+L*Math.cos(th);
      const pe = (1-Math.cos(th))/(1-Math.cos(th0)), ke = 1-pe;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = mut; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(px,py,L,Math.PI/2-th0,Math.PI/2+th0); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ink; ctx.fillRect(px-30,py-4,60,4);
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(bx,by); ctx.stroke();
      ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(bx,by,15,0,Math.PI*2); ctx.fill();
      const x0 = w*0.68, bw = Math.min(46,w*0.1), base = 205, max = 160;
      [[pe,"Potential",c1],[ke,"Kinetic",c2]].forEach(([v,lab,col],i)=>{
        const x = x0 + i*(bw+22);
        ctx.strokeStyle = mut; ctx.lineWidth = 1; ctx.strokeRect(x,base-max,bw,max);
        ctx.fillStyle = col; ctx.fillRect(x,base-max*v,bw,max*v);
        ctx.fillStyle = ink; ctx.font = "13px "+cssv(root,"--body"); ctx.textAlign = "center"; ctx.fillText(lab,x+bw/2,base+20);
        ctx.fillText(Math.round(v*100)+"%",x+bw/2,base+37);
      });
    });
  }};

FIG["motion-1"] = { tag:"Play with it", cap:"Set how hard each team pulls. Equal pulls are balanced forces, so the rope doesn't move. Unequal pulls are unbalanced, so the rope moves toward the stronger team.",
  html:`<svg viewBox="0 0 600 190" role="img" aria-label="Tug of war with adjustable forces"><defs>${["l","r"].map(k=>`<marker id="tw-h${k}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(${k==="l"?"--u4":"--u1"})"/></marker>`).join("")}</defs>
  <line x1="300" y1="20" x2="300" y2="165" stroke="currentColor" stroke-dasharray="4 5" opacity=".5"/>
  <line x1="0" y1="165" x2="600" y2="165" stroke="currentColor" opacity=".4"/>
  <g id="tw-rope">
    <line x1="80" y1="118" x2="520" y2="118" stroke="#A67C52" stroke-width="5"/>
    <rect x="296" y="112" width="8" height="26" fill="#E0483C"/>
    ${[70,105].map(x=>`<circle cx="${x}" cy="92" r="11" fill="currentColor"/><line x1="${x}" y1="103" x2="${x+10}" y2="140" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line x1="${x+10}" y1="140" x2="${x-4}" y2="163" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`).join("")}
    ${[495,530].map(x=>`<circle cx="${x}" cy="92" r="11" fill="currentColor"/><line x1="${x}" y1="103" x2="${x-10}" y2="140" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><line x1="${x-10}" y1="140" x2="${x+4}" y2="163" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`).join("")}
  </g>
  <line id="tw-la" x1="290" y1="40" x2="200" y2="40" stroke-width="5" marker-end="url(#tw-hl)" style="stroke:var(--u4)"/>
  <line id="tw-ra" x1="310" y1="40" x2="400" y2="40" stroke-width="5" marker-end="url(#tw-hr)" style="stroke:var(--u1)"/>
  <text id="tw-lt" x="200" y="26" text-anchor="middle" class="lb"></text><text id="tw-rt" x="400" y="26" text-anchor="middle" class="lb"></text></svg>
  <div class="ctrl"><label for="tw-l">Left team</label><input type="range" id="tw-l" min="0" max="600" step="50" value="300"><output id="tw-lv" class="out" style="margin:0;min-width:52px"></output>
  <label for="tw-r">Right team</label><input type="range" id="tw-r" min="0" max="600" step="50" value="450"><output id="tw-rv" class="out" style="margin:0;min-width:52px"></output>
  <button class="btn ghost small" id="tw-reset">Reset</button></div><p class="out" id="tw-msg"></p>`,
  init(root){
    const g = root.querySelector("#tw-rope"), L = root.querySelector("#tw-l"), R = root.querySelector("#tw-r"), msg = root.querySelector("#tw-msg");
    let pos = 0;
    root.querySelector("#tw-reset").onclick = () => { pos = 0; };
    return loop(() => {
      const l = +L.value, r = +R.value, net = r - l;
      root.querySelector("#tw-lv").textContent = l+" N"; root.querySelector("#tw-rv").textContent = r+" N";
      root.querySelector("#tw-la").setAttribute("x2", 290 - Math.max(l,1)/600*170);
      root.querySelector("#tw-ra").setAttribute("x2", 310 + Math.max(r,1)/600*170);
      root.querySelector("#tw-lt").textContent = l+" N"; root.querySelector("#tw-rt").textContent = r+" N";
      pos = Math.max(-190, Math.min(190, pos + net*0.012));
      g.setAttribute("transform", `translate(${pos} 0)`);
      msg.textContent = net===0 ? "Balanced: the forces cancel, so the rope's motion doesn't change."
        : Math.abs(pos)>=190 ? `${net>0?"Right":"Left"} team wins! Net force was ${Math.abs(net)} N.`
        : `Unbalanced: net force of ${Math.abs(net)} N to the ${net>0?"right":"left"}.`;
    });
  }};

FIG["motion-2"] = { tag:"Play with it", cap:"Pick a speed for each car and race 150 meters. Speed = distance ÷ time, so the faster car finishes in less time.",
  html:`<svg viewBox="0 0 620 170" role="img" aria-label="Two cars racing along a 150 meter track">
  ${[0,25,50,75,100,125,150].map(m=>{const x=40+m*3.6;return `<line x1="${x}" y1="20" x2="${x}" y2="130" stroke="currentColor" opacity="${m===150?.9:.2}" stroke-width="${m===150?3:1}"/><text x="${x}" y="150" text-anchor="middle" class="sm">${m} m</text>`;}).join("")}
  <line x1="40" y1="75" x2="580" y2="75" stroke="currentColor" opacity=".3" stroke-dasharray="10 8"/>
  ${["a","b"].map((k,i)=>`<g id="car-${k}"><rect x="6" y="${36+i*55}" width="34" height="16" rx="5" style="fill:var(${i?"--u4":"--u1"})"/><rect x="14" y="${30+i*55}" width="16" height="9" rx="3" style="fill:var(${i?"--u4":"--u1"})" opacity=".7"/><circle cx="14" cy="${53+i*55}" r="5" fill="currentColor"/><circle cx="32" cy="${53+i*55}" r="5" fill="currentColor"/></g>`).join("")}
  <text id="clock" x="610" y="165" text-anchor="end" class="lb">t = 0.0 s</text></svg>
  <div class="ctrl"><label for="sp-a" style="color:var(--u1);font-weight:700">Car A</label><input type="number" id="sp-a" min="1" max="40" value="10"> m/s
  <label for="sp-b" style="color:var(--u4);font-weight:700">Car B</label><input type="number" id="sp-b" min="1" max="40" value="15"> m/s
  <button class="btn small" id="go">Start race</button></div><p class="out" id="race-msg">Press Start race.</p>`,
  init(root){
    const A = root.querySelector("#car-a"), B = root.querySelector("#car-b"), clk = root.querySelector("#clock"), msg = root.querySelector("#race-msg");
    let t = 0, running = false, va = 10, vb = 15;
    const place = () => {
      const da = Math.min(150, va*t), db = Math.min(150, vb*t);
      A.setAttribute("transform",`translate(${da*3.6} 0)`); B.setAttribute("transform",`translate(${db*3.6} 0)`);
      clk.textContent = `t = ${t.toFixed(1)} s`;
      return [da,db];
    };
    root.querySelector("#go").onclick = () => {
      va = Math.max(1,Math.min(40,+root.querySelector("#sp-a").value||10)); vb = Math.max(1,Math.min(40,+root.querySelector("#sp-b").value||15));
      t = 0; running = true; msg.textContent = "Racing…";
    };
    place();
    return loop((_,dt) => {
      if (!running) return;
      t += dt/1000*3;
      const [da,db] = place();
      if (da>=150 && db>=150){
        running = false; t = 150/Math.min(va,vb); place();
        const ta = 150/va, tb = 150/vb;
        msg.textContent = ta===tb ? `Tie! Both took ${ta.toFixed(1)} s.` :
          `Car ${ta<tb?"A":"B"} wins. Car A: 150 m ÷ ${ta.toFixed(1)} s = ${va} m/s. Car B: 150 m ÷ ${tb.toFixed(1)} s = ${vb} m/s.`;
      }
    });
  }};

FIG["space-0"] = { tag:"Play with it", cap:"Each planet orbits at its real speed compared to Earth. Distances and sizes are not to scale. Speed it up to see Neptune move: it takes 165 Earth years to go around once.",
  html:`<canvas class="cv" aria-label="Animated solar system with the eight planets orbiting the Sun"></canvas>
  <div class="ctrl"><span>Speed</span><div class="chips" id="ss-speed">${[1,5,25].map((s,i)=>`<button class="chip" data-s="${s}" aria-pressed="${i===0}">${s}×</button>`).join("")}</div><output class="out" id="ss-yr"></output></div>`,
  init(root){
    const cv = root.querySelector("canvas"), yr = root.querySelector("#ss-yr");
    const PL = [["Mercury",.241,"#A8A29E",3],["Venus",.615,"#E3B869",5],["Earth",1,"#3B82C4",5],["Mars",1.88,"#C1440E",4],["Jupiter",11.86,"#D4A373",10],["Saturn",29.46,"#E6C87A",8],["Uranus",84.0,"#7FD1D8",7],["Neptune",164.8,"#4062BB",7]];
    const start = PL.map((_,i)=>i*1.3), belt = Array.from({length:140},()=>[Math.random()*Math.PI*2,Math.random()]);
    let years = 0, speed = 1;
    root.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { speed = +b.dataset.s; root.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
    return loop((_,dt) => {
      const W = cv.clientWidth || 600, {ctx,w,h} = canvasCtx(cv, Math.min(420, Math.max(300, W*0.62)));
      years += dt/1000/4*speed;
      yr.textContent = `Earth years passed: ${years.toFixed(1)}`;
      const cx=w/2, cy=h/2, rmax=Math.min(w/2,h/2)-12, ink=cssv(root,"--muted"), txt=cssv(root,"--ink");
      ctx.clearRect(0,0,w,h);
      const rad = i => rmax*(0.16 + i*0.12);
      ctx.fillStyle = ink; belt.forEach(([a,f]) => { const r = rad(3)+(rad(4)-rad(3))*(0.3+f*0.4); ctx.fillRect(cx+r*Math.cos(a+years*0.05),cy+r*Math.sin(a+years*0.05),1.5,1.5); });
      ctx.fillStyle = "#F2B705"; ctx.beginPath(); ctx.arc(cx,cy,rmax*0.08,0,Math.PI*2); ctx.fill();
      ctx.font = "11px "+cssv(root,"--body"); ctx.textAlign = "center";
      PL.forEach(([n,p,c,s],i) => {
        const r = rad(i), a = start[i] - years/p*Math.PI*2, x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
        ctx.strokeStyle = ink; ctx.globalAlpha = .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
        if (n==="Saturn"){ ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x,y,s*1.9,s*.7,-.4,0,Math.PI*2); ctx.stroke(); }
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x,y,s*(w<500?.8:1),0,Math.PI*2); ctx.fill();
        ctx.fillStyle = txt; ctx.fillText(n,x,y-s-5);
      });
    });
  }};

FIG["space-1"] = { tag:"Play with it", cap:"Left: looking down on Earth from above the North Pole, with sunlight coming from the left. Right: what the Moon looks like from Earth that night. The Moon is always half lit; we just see different amounts of the lit half.",
  html:`<canvas class="cv" aria-label="Moon phase simulator"></canvas>
  <div class="ctrl"><label for="mp-d">Day of the cycle</label><input type="range" id="mp-d" min="0" max="29.5" step="0.25" value="4"><button class="btn ghost small" id="mp-play">Play</button></div>`,
  init(root){
    const cv = root.querySelector("canvas"), sl = root.querySelector("#mp-d"), pb = root.querySelector("#mp-play");
    let playing = false;
    pb.onclick = () => { playing = !playing; pb.textContent = playing ? "Pause" : "Play"; };
    const NAMES = ["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Third quarter","Waning crescent"];
    const LIT = "#EFEAD6", DARK = "#3A4448";
    const litDisc = (ctx,x,y,r,leftLit) => { ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = LIT; ctx.beginPath(); ctx.arc(x,y,r,leftLit?Math.PI/2:-Math.PI/2,leftLit?Math.PI*1.5:Math.PI/2); ctx.fill(); };
    return loop((_,dt) => {
      if (playing){ let d = +sl.value + dt/1000*2.5; if (d>29.5) d -= 29.5; sl.value = d; }
      const {ctx,w,h} = canvasCtx(cv,270), day = +sl.value, p = day/29.5;
      const ink = cssv(root,"--ink"), mut = cssv(root,"--muted"), font = cssv(root,"--body");
      ctx.clearRect(0,0,w,h);
      const lw = w*0.56, ex = lw/2+10, ey = h/2, R = Math.min(lw/2-34, h/2-30);
      ctx.strokeStyle = "#F2B705"; ctx.lineWidth = 2;
      for (let i=-2;i<=2;i++){ const y = ey+i*38; ctx.beginPath(); ctx.moveTo(6,y); ctx.lineTo(28,y); ctx.lineTo(23,y-4); ctx.moveTo(28,y); ctx.lineTo(23,y+4); ctx.stroke(); }
      ctx.strokeStyle = mut; ctx.setLineDash([3,5]); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(ex,ey,R,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#3B82C4"; ctx.beginPath(); ctx.arc(ex,ey,15,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.arc(ex,ey,15,-Math.PI/2,Math.PI/2); ctx.fill();
      const a = Math.PI + p*Math.PI*2, mx = ex+R*Math.cos(a), my = ey-R*Math.sin(a);
      litDisc(ctx,mx,my,10,true);
      ctx.fillStyle = ink; ctx.font = "12px "+font; ctx.textAlign = "center";
      ctx.fillText("Earth",ex,ey+32); ctx.fillText("Moon",mx,my-15); ctx.fillStyle = mut; ctx.textAlign = "left"; ctx.fillText("sunlight",4,ey+100); ctx.textAlign = "center";
      const vx = lw + (w-lw)/2, vy = h/2-14, r = Math.min((w-lw)/2-16, 72);
      const right = p < 0.5, c = Math.cos(p*Math.PI*2), rx = r*Math.abs(c), crescent = c > 0;
      litDisc(ctx,vx,vy,r,!right);
      ctx.fillStyle = crescent ? DARK : LIT; ctx.beginPath(); ctx.ellipse(vx,vy,Math.max(rx,.01),r,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = mut; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(vx,vy,r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = ink; ctx.font = "700 15px "+font; ctx.fillText(NAMES[Math.round(p*8)%8],vx,vy+r+26);
      ctx.fillStyle = mut; ctx.font = "12px "+font; ctx.fillText(`Day ${day.toFixed(1)} of 29.5`,vx,vy+r+44);
    });
  }};

FIG["space-2"] = { tag:"Play with it", cap:"Your mass is the same everywhere, but your weight depends on each world's gravity. Type a weight to see what a scale would read there.",
  html:`<div class="ctrl" style="margin-top:0"><label for="wt">Weight on Earth</label><input type="number" id="wt" min="1" max="500" value="90"> pounds</div><div id="wt-rows" class="wtrows"></div>`,

    inp.addEventListener("input", draw); draw();
    return () => {};

function sorter(items, bins){
  return {
    html:`<div class="sorter"><div class="srt-card" aria-live="polite"></div><div class="srt-bins">${bins.map((b,i)=>`<button class="btn" data-bin="${i}">${b}</button>`).join("")}</div><p class="out srt-msg"></p><p class="srt-prog sm-note"></p></div>`,
    init(root){
      let order, i, score, done;
      const card = root.querySelector(".srt-card"), msg = root.querySelector(".srt-msg"), prog = root.querySelector(".srt-prog");
      const start = () => { order = shuffle(items); i = 0; score = 0; done = false; show(); };
      const show = () => {
        if (i >= order.length){ done = true; card.innerHTML = `<b>Done! ${score} of ${order.length} correct.</b>`; prog.innerHTML = `<button class="btn ghost small srt-again">Play again</button>`; prog.querySelector(".srt-again").onclick = start; if (score===order.length){ try{ sfx.star(); }catch(e){} } return; }
        card.innerHTML = `<span class="srt-q">${esc(order[i][0])}</span>`; prog.textContent = `${i+1} of ${order.length} · ${score} correct`;
      };
      root.querySelectorAll("[data-bin]").forEach(b => b.onclick = () => {
        if (done) return;
        const it = order[i], ok = +b.dataset.bin === it[1];
        if (ok){ score++; try{ sfx.right(); }catch(e){} } else { try{ sfx.wrong(); }catch(e){} }
        msg.innerHTML = `${ok?"✓ Right!":"✗ Not quite: it's "+esc(bins[it[1]])+"."} ${esc(it[2])}`;
        msg.className = "out srt-msg " + (ok?"ok":"no");
        i++; show();
      });
      start(); return () => {};
    }
  };
}

FIG["elec-0"] = { tag:"Play with it", cap:"Tap the switch to open or close the circuit. Tap a bulb to unscrew it. In a series circuit, one missing bulb breaks the only path. In a parallel circuit, the other bulb keeps its own path.",
  html:`<div class="chips" id="ckt-mode" style="margin-bottom:8px"><button class="chip" data-m="s" aria-pressed="true">Series</button><button class="chip" data-m="p" aria-pressed="false">Parallel</button></div><div id="ckt"></div><p class="out" id="ckt-msg"></p>`,
  init(root){
    const st = { m:"s", sw:true, b:[true,true] };
    const bulb = (x,y,i,lit) => `<g data-bulb="${i}" style="cursor:pointer">${lit?`<circle cx="${x}" cy="${y}" r="34" fill="#FFE27A" opacity=".55"/>`:""}
      ${st.b[i] ? `<circle cx="${x}" cy="${y}" r="20" fill="${lit?"#FFD43B":"var(--surface)"}" stroke="currentColor" stroke-width="2.5"/><path d="M${x-8} ${y+4} q4 -10 8 0 q4 -10 8 0" fill="none" stroke="currentColor" stroke-width="2"/>`
      : `<circle cx="${x}" cy="${y}" r="20" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/><text x="${x}" y="${y+4}" text-anchor="middle" class="sm">empty</text>`}</g>`;
    const draw = () => {
      const on = st.sw, s = st.m==="s";
      const lit = s ? [on && st.b[0] && st.b[1], on && st.b[0] && st.b[1]] : [on && st.b[0], on && st.b[1]];
      const any = lit[0] || lit[1];
      const w = (d,flow) => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="3"/>${flow?`<path class="flow" d="${d}" fill="none" stroke="#F2B705" stroke-width="3" stroke-dasharray="6 10"/>`:""}`;
      const sw = (x,y) => `<g data-sw="1" style="cursor:pointer"><rect x="${x-10}" y="${y-30}" width="80" height="50" fill="transparent"/><circle cx="${x}" cy="${y}" r="4" fill="currentColor"/><circle cx="${x+60}" cy="${y}" r="4" fill="currentColor"/>
        <line x1="${x}" y1="${y}" x2="${on?x+60:x+50}" y2="${on?y:y-28}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><text x="${x+30}" y="${y+22}" text-anchor="middle" class="sm">switch ${on?"closed":"open"}</text></g>`;
      const batt = `<line x1="45" y1="118" x2="75" y2="118" stroke="currentColor" stroke-width="4"/><line x1="52" y1="132" x2="68" y2="132" stroke="currentColor" stroke-width="4"/><line x1="45" y1="146" x2="75" y2="146" stroke="currentColor" stroke-width="4"/><line x1="52" y1="160" x2="68" y2="160" stroke="currentColor" stroke-width="4"/><text x="84" y="145" class="sm">battery</text>`;
      let svg;
      if (s){
        svg = w("M60 118 L60 50 L180 50",any)+w("M240 50 L460 50 L460 210 L352 210",any)+w("M308 210 L232 210",any)+w("M188 210 L60 210 L60 160",any)+sw(180,50)+bulb(210,210,0,lit[0])+bulb(330,210,1,lit[1]);
      } else {
        svg = w("M60 118 L60 50 L130 50",any)+w("M190 50 L420 50",any)+w("M60 160 L60 210 L420 210",any)
          +w("M280 50 L280 108",lit[0])+w("M280 152 L280 210",lit[0])+w("M420 50 L420 108",lit[1])+w("M420 152 L420 210",lit[1])+sw(130,50)+bulb(280,130,0,lit[0])+bulb(420,130,1,lit[1]);
      }
      root.querySelector("#ckt").innerHTML = `<svg viewBox="0 0 520 250" role="img" aria-label="${s?"Series":"Parallel"} circuit with two bulbs">${batt}${svg}</svg>`;
      root.querySelector("#ckt-msg").textContent = !on ? "The switch is open: there's a gap, so no current flows." :
        s ? (lit[0] ? "Closed series circuit: current flows through both bulbs on one path." : "A bulb is missing, so the only path is broken. Every bulb goes dark.")
          : (lit[0]&&lit[1] ? "Closed parallel circuit: each bulb has its own path." : any ? "One bulb is out, but the other still has its own complete path." : "Both bulbs are out.");
      root.querySelectorAll("[data-bulb]").forEach(g => g.onclick = () => { st.b[+g.dataset.bulb] = !st.b[+g.dataset.bulb]; draw(); });
      root.querySelector("[data-sw]").onclick = () => { st.sw = !st.sw; draw(); };
    };
    root.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { st.m = b.dataset.m; st.b = [true,true]; root.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); draw(); });
    draw(); return () => {};
  }};

FIG["elec-2"] = { tag:"Play with it", cap:"Change the electromagnet and watch how many paper clips it can lift. More coils, more current, and an iron core all make it stronger.",
  html:`<div id="em"></div><div class="ctrl"><label for="em-c">Coils</label><input type="range" id="em-c" min="5" max="50" step="5" value="15">
  <label for="em-b">Batteries</label><input type="range" id="em-b" min="0" max="3" value="1"></div>
  <div class="ctrl"><label><input type="checkbox" id="em-i" checked> Iron nail core</label></div><p class="out" id="em-msg"></p>`,
  init(root){
    const draw = () => {
      const c = +root.querySelector("#em-c").value, b = +root.querySelector("#em-b").value, iron = root.querySelector("#em-i").checked;
      const strength = c * b * (iron ? 1 : 0.15), clips = Math.min(12, Math.floor(strength / 8));
      const turns = Math.round(c/5);
      let coil = ""; for (let k=0;k<turns;k++){ const x = 170 + k*(240/turns); coil += `<ellipse cx="${x+10}" cy="90" rx="7" ry="22" fill="none" stroke="#C67B2E" stroke-width="3"/>`; }
      let cl = ""; for (let k=0;k<clips;k++){ const x = 180 + (k%6)*40, y = 132 + Math.floor(k/6)*44; cl += `<rect x="${x}" y="${y}" width="14" height="34" rx="7" fill="none" stroke="currentColor" stroke-width="2.5"/>`; }
      root.querySelector("#em").innerHTML = `<svg viewBox="0 0 520 230" role="img" aria-label="Electromagnet lifting ${clips} paper clips">

        ${coil}<path d="M170 112 L170 200 L60 200 L60 150" fill="none" stroke="#C67B2E" stroke-width="3"/><path d="M410 68 L410 30 L60 30 L60 110" fill="none" stroke="#C67B2E" stroke-width="3"/>
        ${b?`<rect x="40" y="110" width="40" height="40" rx="4" fill="#2D3A3E"/><text x="60" y="135" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">${b}×</text>`:`<rect x="40" y="110" width="40" height="40" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 4"/>`}
        ${cl}</svg>`;

FIG["waves-0"] = { tag:"Play with it", cap:"Change the amplitude and frequency. At the same speed, a higher frequency squeezes the waves closer together, so the wavelength gets shorter.",
  html:`<canvas class="cv" aria-label="Animated transverse wave"></canvas>
  <div class="ctrl"><label for="wv-a">Amplitude</label><input type="range" id="wv-a" min="10" max="90" value="50"><label for="wv-f">Frequency</label><input type="range" id="wv-f" min="1" max="6" step="0.5" value="2"></div><p class="out" id="wv-o"></p>`,
  init(root){
    const cv = root.querySelector("canvas"), A = root.querySelector("#wv-a"), F = root.querySelector("#wv-f"), out = root.querySelector("#wv-o");
    return loop(t => {
      const {ctx,w,h} = canvasCtx(cv,230), amp = +A.value, f = +F.value, speed = 240, lam = speed / f, mid = h/2, col = cssv(root,"--u9"), ink = cssv(root,"--ink"), mut = cssv(root,"--muted");
      out.textContent = `Frequency ${f} Hz · Wavelength ${Math.round(lam)} px · Amplitude ${amp} px`;
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = mut; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke(); ctx.setLineDash([]);
      const ph = t/1000*2*Math.PI*f;
      ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
      for (let x=0;x<=w;x+=3){ const y = mid - amp*Math.sin(2*Math.PI*x/lam - ph); x?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
      let x0 = ((ph/(2*Math.PI))*lam + lam/4) % lam; if (x0 < 20) x0 += lam;
      if (x0 + lam < w-10){
        ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, mid-amp-14); ctx.lineTo(x0+lam, mid-amp-14); ctx.stroke();
        ctx.fillStyle = ink; ctx.font = "12px "+cssv(root,"--body"); ctx.textAlign = "center"; ctx.fillText("wavelength", x0+lam/2, mid-amp-20);
        ctx.beginPath(); ctx.moveTo(x0, mid); ctx.lineTo(x0, mid-amp); ctx.stroke(); ctx.textAlign = "left"; ctx.fillText("amplitude", x0+6, mid-amp/2);
      }
    });
  }};

FIG["waves-1"] = { tag:"Play with it", cap:"Press Play to hear the tone (turn your volume down first). Higher frequency means higher pitch. The dots show air particles bunching into compressions and spreading into rarefactions.",
  html:`<canvas class="cv" aria-label="Sound wave particles"></canvas>
  <div class="ctrl"><label for="sd-f">Pitch</label><input type="range" id="sd-f" min="110" max="1760" step="10" value="440"><label for="sd-v">Loudness</label><input type="range" id="sd-v" min="1" max="10" value="4"><button class="btn small" id="sd-p">Play</button></div><p class="out" id="sd-o"></p>`,
  init(root){
    const cv = root.querySelector("canvas"), Fr = root.querySelector("#sd-f"), V = root.querySelector("#sd-v"), pb = root.querySelector("#sd-p"), out = root.querySelector("#sd-o");
    let ac = null, osc = null, gain = null;
    const stop = () => { try{ osc && osc.stop(); }catch(e){} osc = null; pb.textContent = "Play"; };
    pb.onclick = () => {
      if (osc) return stop();
      try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); osc = ac.createOscillator(); gain = ac.createGain(); osc.type = "sine"; osc.frequency.value = +Fr.value; gain.gain.value = +V.value/60; osc.connect(gain).connect(ac.destination); osc.start(); pb.textContent = "Stop"; }catch(e){ out.textContent = "Sound isn't available on this device."; }
    };
    const halt = loop(t => {
      const f = +Fr.value, v = +V.value; if (osc){ osc.frequency.value = f; gain.gain.value = v/60; }
      const note = f<200?"low":f<600?"medium":f<1100?"high":"very high";
      out.textContent = `${f} Hz · ${note} pitch · loudness ${v}/10`;
      const {ctx,w,h} = canvasCtx(cv,170), col = cssv(root,"--u9"), vis = f/220, lam = 260/vis, amp = 2 + v*1.4;
      ctx.clearRect(0,0,w,h); ctx.fillStyle = col;
      for (let r=0;r<7;r++) for (let x0=6;x0<w;x0+=9){ const x = x0 + amp*Math.sin(2*Math.PI*x0/lam - t/1000*4*vis); ctx.beginPath(); ctx.arc(x, 20+r*22, 3, 0, Math.PI*2); ctx.fill(); }
    });
    return () => { halt(); stop(); };
  }};

FIG["body-2"] = { tag:"Play with it", cap:"Reaction-time game. Your eyes see the change, a signal races along neurons to your brain, your brain decides, and motor neurons tell your finger muscles to tap. Most people take about 200–300 milliseconds.",
  html:`<button class="rt-box" id="rt" type="button">Tap here to start</button><p class="out" id="rt-o">Best: none yet</p>`,
  init(root){
    const box = root.querySelector("#rt"), out = root.querySelector("#rt-o"); let state = "idle", t0 = 0, timer = null, best = null, tries = [];
    const set = (cls, txt) => { box.className = "rt-box " + cls; box.textContent = txt; };
    box.onclick = () => {
      if (state==="idle" || state==="done"){ state = "wait"; set("wait","Wait for green…"); timer = setTimeout(()=>{ state = "go"; t0 = performance.now(); set("go","TAP NOW!"); }, 1500 + Math.random()*2500); }
      else if (state==="wait"){ clearTimeout(timer); state = "done"; set("early","Too soon! Tap to try again."); }
      else if (state==="go"){ const ms = Math.round(performance.now()-t0); tries.push(ms); best = best==null?ms:Math.min(best,ms); state = "done";
        set("done", `${ms} ms. Tap to go again.`); const avg = Math.round(tries.reduce((a,b)=>a+b,0)/tries.length); out.textContent = `Best: ${best} ms · Average of ${tries.length}: ${avg} ms`; }
    };
    return () => clearTimeout(timer);
  }};

FIG["genes-2"] = { tag:"Play with it", cap:"Pick each parent's genes for pea plant height. T (tall) is dominant and t (short) is recessive. Each box is a 25% chance.",
  html:`<div class="ctrl" style="margin-top:0"><label>Parent 1</label><div class="chips" id="pq1">${["TT","Tt","tt"].map((g,i)=>`<button class="chip" data-g="${g}" aria-pressed="${i===1}">${g}</button>`).join("")}</div></div>

  <div class="punnett" id="pq"></div><p class="out" id="pq-o"></p>`,
  init(root){
    let p1 = "Tt", p2 = "Tt";

      const boxes = []; for (const a of p2) for (const b of p1) boxes.push([b,a].sort((x,y)=> x===x.toUpperCase()?-1:1).join(""));
      const tall = boxes.filter(g=>g.includes("T")).length;

FIG["adapt-1"] = { tag:"Play with it", cap:"A population of peppered moths on tree bark. Each generation, birds catch the moths that stand out most, and the survivors have offspring. Switch the bark and watch the population change over generations.",
  html:`<canvas class="cv" aria-label="Moths on tree bark"></canvas>
  <div class="ctrl"><div class="chips" id="mo-bark"><button class="chip" data-b="light" aria-pressed="true">Clean, light bark</button><button class="chip" data-b="dark" aria-pressed="false">Sooty, dark bark</button></div></div>
  <div class="ctrl"><button class="btn small" id="mo-1">Next generation</button><button class="btn small ghost" id="mo-10">Run 10 generations</button><button class="btn small ghost" id="mo-r">Reset</button></div>
  <p class="out" id="mo-o"></p><div class="mo-hist" id="mo-h"></div>`,
  init(root){
    const cv = root.querySelector("canvas"), N = 60; let bark = "light", moths, gen, hist, run = 0;
    const spawn = darkFrac => Array.from({length:N},()=>({d:Math.random()<darkFrac, x:Math.random(), y:Math.random(), r:Math.random()*6.28}));
    const reset = () => { moths = spawn(0.1); gen = 0; hist = [0.1]; };
    const step = () => {
      const survive = moths.filter(m => { const hidden = (m.d && bark==="dark") || (!m.d && bark==="light"); return Math.random() < (hidden ? 0.9 : 0.45); });
      const df = survive.length ? survive.filter(m=>m.d).length/survive.length : 0.5;
      moths = Array.from({length:N},()=>({ d: Math.random() < Math.min(0.995,Math.max(0.005, df + (Math.random()-.5)*0.04)), x:Math.random(), y:Math.random(), r:Math.random()*6.28 }));
      gen++; hist.push(moths.filter(m=>m.d).length/N); if (hist.length>30) hist.shift();
    };
    reset();
    root.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { bark = b.dataset.b; root.querySelectorAll("[data-b]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
    root.querySelector("#mo-1").onclick = step; root.querySelector("#mo-10").onclick = () => { run = 10; }; root.querySelector("#mo-r").onclick = reset;
    let acc = 0;
    return loop((t,dt) => {
      if (run>0){ acc += dt; if (acc>350){ acc = 0; step(); run--; } }
      const {ctx,w,h} = canvasCtx(cv,200);
      ctx.fillStyle = bark==="light" ? "#CFC8B8" : "#3A3632"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = bark==="light" ? "#B5AD9B" : "#2A2622"; ctx.lineWidth = 3;
      for (let i=0;i<14;i++){ ctx.beginPath(); ctx.moveTo((i*73)%w, 0); ctx.bezierCurveTo((i*73)%w+20, h*0.3, (i*73)%w-20, h*0.7, (i*73)%w+10, h); ctx.stroke(); }
      moths.forEach(m => { ctx.save(); ctx.translate(10+m.x*(w-20), 10+m.y*(h-20)); ctx.rotate(m.r); ctx.fillStyle = m.d ? "#2B2724" : "#DCD6C8";
        ctx.beginPath(); ctx.ellipse(-6,0,7,4.5,0.4,0,Math.PI*2); ctx.ellipse(6,0,7,4.5,-0.4,0,Math.PI*2); ctx.fill(); ctx.restore(); });
      const df = Math.round(moths.filter(m=>m.d).length/N*100);
      root.querySelector("#mo-o").textContent = `Generation ${gen} · Dark moths: ${df}% · Light moths: ${100-df}%`;
      root.querySelector("#mo-h").innerHTML = hist.map(f=>`<i style="height:${Math.max(2,f*100)}%" title="${Math.round(f*100)}% dark"></i>`).join("");
    });
  }};

FIG["earthres-1"] = { tag:"Play with it", cap:"A standard shower uses about 2.5 gallons of water each minute; a water-saving showerhead uses about 2. See how small changes add up over a year.",

        <p class="note" style="margin:4px 0 0">That's about ${bath.toLocaleString()} bathtubs full. One minute shorter for everyone saves about <b>${less.toLocaleString()} gallons</b> a year.</p>`;

FIG["earthres-2"] = { tag:"Play with it", cap:"Sunlight (yellow) warms the ground, which gives off heat (red). Greenhouse gas molecules absorb some heat and send it back down. Slide to add more greenhouse gas and watch more heat get trapped.",
  html:`<div id="gh"></div><div class="ctrl"><label for="gh-c">Greenhouse gas</label><input type="range" id="gh-c" min="1" max="10" value="3"></div><p class="out" id="gh-o"></p>`,
  init(root){
    const draw = () => {
      const g = +root.querySelector("#gh-c").value; let mol = "";
      for (let k=0;k<g*5;k++){ const x = 30 + ((k*137)%560), y = 70 + ((k*53)%50); mol += `<circle cx="${x}" cy="${y}" r="4" fill="#8E7CC3"/>`; }
      const trapped = Math.min(5, Math.round(g/2)), escaped = 5 - trapped;
      let arrows = "";
      for (let k=0;k<5;k++){ const x = 120 + k*90; const t = k < trapped;
        arrows += `<path d="M${x} 228 q8 -10 0 -20 q-8 -10 0 -20 q8 -10 0 -20 q-8 -10 0 -20 ${t?"":"q8 -10 0 -20 q-8 -10 0 -20 q8 -10 0 -20"}" fill="none" stroke="#E53935" stroke-width="3"/>
        ${t?`<path d="M${x+6} 148 q10 20 4 60" fill="none" stroke="#E53935" stroke-width="3" stroke-dasharray="5 4"/><polygon points="${x+4},208 ${x+16},206 ${x+9},218" fill="#E53935"/>`:`<polygon points="${x-6},92 ${x+6},92 ${x},80" fill="#E53935"/>`}`; }
      const temp = 60 + g*10;
      root.querySelector("#gh").innerHTML = `<svg viewBox="0 0 640 270" role="img" aria-label="Greenhouse effect with adjustable gas">
        <rect x="0" y="60" width="640" height="70" fill="#9CC7EE" opacity=".35"/><text x="630" y="78" text-anchor="end" class="sm">atmosphere</text>${mol}
        <circle cx="40" cy="30" r="20" fill="#F2B705"/>${[0,1,2].map(k=>`<line x1="${70+k*30}" y1="${30+k*4}" x2="${80+k*60}" y2="226" stroke="#F2B705" stroke-width="4"/>`).join("")}
        ${arrows}<rect x="0" y="228" width="640" height="42" fill="#6A994E"/>
        <rect x="596" y="140" width="16" height="84" rx="8" fill="var(--surface)" stroke="currentColor"/><rect x="600" y="${224-temp*0.6}" width="8" height="${temp*0.6}" rx="4" fill="#E53935"/><circle cx="604" cy="230" r="11" fill="#E53935"/></svg>`;
      root.querySelector("#gh-o").textContent = `${trapped} of 5 heat rays trapped · ${escaped} escape to space · Earth gets ${g<=3?"comfortably warm":g<=6?"warmer":"much warmer"}`;
    };
    root.querySelector("#gh-c").addEventListener("input", draw); draw(); return () => {};
  }};
