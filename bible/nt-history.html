 known to Mark's readers"},{"name":"Eleazar Sukenik","role":"Archaeologist who studied the Kidron Valley tomb (and also the Dead Sea Scrolls)"}],"source":{"title":"Ossuary from the Kidron Valley Tomb","who":"A Cyrenian Jewish family in Jerusalem","date":"1st century AD; found in 1941","text":"One bone box from the family tomb is inscribed in Greek: 'Alexander (son) of Simon.' Other ossuaries in the same cave carry names common among Jews from Cyrene.","note":"Closely translated. We can't prove this is the family in Mark 15:21, but it shows exactly the kind of family Mark describes, and it's a good example of how archaeology can illuminate a small detail in the Bible."},"vocab":[["Cyrene","A Greek city in North Africa (modern Libya) with a Jewish community"],["Crossbeam","The horizontal beam of a cross, often carried by the condemned person"],["Ossuary","A stone box for bones"],["Kidron Valley","The valley on Jerusalem's east side, full of ancient tombs"]],"map":{"view":"wide","places":["cyrene","jerusalem_w","rome"],"caption":"Simon came from Cyrene in North Africa. His son Rufus may later have lived in Rome."},"timeline":[{"y":57,"t":"Paul greets Rufus in his letter to the Romans (about AD 57)"},{"y":1941,"t":"An ossuary inscribed 'Alexander son of Simon' is found","d":true}],"video":[["Drive Thru History: The Crucifixion of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=nrnwBXI2"]],"videoNote":"This episode explains how Roman crucifixion worked. You may want to preview it.","quiz":[{"q":"Where was Cyrene?","options":["Greece","North Africa (Libya)","Syria","Italy"],"answer":1,"why":"It had a large Jewish community."},{"q":"Which Gospel names Simon's sons?","options":["Matthew","Mark","Luke","John"],"answer":1,"why":"Mark 15:21."},{"q":"Why might Mark name the sons?","options":["They were famous Romans","His readers probably knew them","They were apostles","They wrote Gospels"],"answer":1,"why":"Likely members of the church."},{"q":"Which letter greets a man named Rufus?","options":["Galatians","Romans","Hebrews","James"],"answer":1,"why":"Romans 16:13."},{"q":"What was inscribed on the 1941 ossuary?","options":["Simon of Cyrene","Alexander son of Simon","Rufus","Jesus"],"answer":1,"why":"In a Cyrenian family tomb."}],"assignment":"Write a short story imagining the day Simon carried the cross, told from the point of view of his son Alexander or Rufus years later, sharing it with their church."},{"id":"mkh-16","bible":"mrk-16","bibleTitle":"He Has Risen! Go and Tell","title":"How We Got the Gospels: Ancient Manuscripts","era":"2nd century AD to today","intro":"Most Bibles have a note at Mark 16:9 saying the earliest manuscripts end at verse 8. What are these manuscripts, and how were the Gospels copied for 1,400 years before the printing press?","sections":[{"h":"Copied by Hand","p":["The original writings of the New Testament, called autographs, don't survive. They were written on papyrus, which wears out. But believers copied them again and again by hand. Early copies were made on papyrus in book form (codices) rather than scrolls, which made it easier to find passages.","Today scholars have more than 5,000 ancient Greek manuscripts of the New Testament, whole or in fragments, far more than for any other ancient book. Some papyrus fragments come from the 100s and 200s AD."]},{"h":"Two Great Codices","p":["Two of the oldest complete Bibles are Codex Sinaiticus and Codex Vaticanus, both from the 300s AD. Codex Vaticanus has been in the Vatican Library in Rome since at least the 1400s. Codex Sinaiticus was found at St. Catherine's Monastery at the foot of Mount Sinai by a German scholar, Constantin von Tischendorf, who first saw parts of it in 1844 and brought most of it to Europe in 1859.","Both of these codices end the Gospel of Mark at 16:8. Many later manuscripts include verses 9-20. Scholars compare thousands of manuscripts to work out the most likely original wording. This careful work is called textual criticism."]},{"h":"What About Mark's Ending?","p":["Christians hold different views about Mark 16:9-20. Some think Mark ended at verse 8 on purpose, leaving readers to respond. Some think his original ending was lost. Others think verses 9-20 were added early by someone else, summarizing appearances also found in the other Gospels. That's why most Bibles include the verses with a note.","Importantly, no key Christian belief depends on those verses alone. The resurrection, the appearances of Jesus, and the command to spread the gospel are all taught clearly in Matthew, Luke, John, Acts, and Paul's letters."]}],"people":[{"name":"Constantin von Tischendorf","role":"German scholar who brought Codex Sinaiticus to Europe (1844-1859)"},{"name":"Scribes","role":"People who copied manuscripts by hand, often in monasteries"}],"source":{"title":"Codex Sinaiticus","who":"Scribes in the 300s AD","date":"About AD 330-360","text":"This handwritten Bible has the text in four narrow columns on each page, written in Greek capital letters on parchment (animal skin). In the Gospel of Mark, the text ends at 16:8 with the words 'for they were afraid,' followed by a decorative line and the title 'Gospel according to Mark.'","note":"Described. You can view every page of Codex Sinaiticus for free online at codexsinaiticus.org. Most of it is in the British Library, with other parts in Leipzig, St. Petersburg, and at St. Catherine's Monastery."},"vocab":[["Manuscript","A handwritten copy of a text"],["Codex (plural codices)","An ancient book with pages, instead of a scroll"],["Parchment","Writing material made from animal skin"],["Textual criticism","Comparing manuscripts to work out the original wording"]],"map":{"view":"wide","places":["jerusalem_w","alexandria","rome"],"caption":"Codex Sinaiticus was found at St. Catherine's Monastery in the Sinai, between Egypt and Judea. Codex Vaticanus has been kept in Rome."},"timeline":[{"y":340,"t":"Codex Sinaiticus and Codex Vaticanus are copied (300s AD)"},{"y":1859,"t":"Tischendorf brings Codex Sinaiticus to Europe","d":true}],"video":[["Drive Thru History: The Resurrection of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=tDaHdjCj"]],"quiz":[{"q":"About how many ancient Greek New Testament manuscripts exist?","options":["About 50","About 500","More than 5,000","Only one"],"answer":2,"why":"More than any other ancient book."},{"q":"What is a codex?","options":["A scroll","An ancient book with pages","A coin","A law"],"answer":1,"why":"Easier to find passages."},{"q":"Where was Codex Sinaiticus found?","options":["Rome","St. Catherine's Monastery near Mount Sinai","Jerusalem","Qumran"],"answer":1,"why":"By Tischendorf."},{"q":"Where do Sinaiticus and Vaticanus end Mark?","options":["16:20","16:8","15:47","14:72"],"answer":1,"why":"'For they were afraid.'"},{"q":"What is textual criticism?","options":["Criticizing the Bible","Comparing manuscripts to find the original wording","Writing reviews","Translating into English"],"answer":1,"why":"Careful scholarly work."}],"assignment":"Visit codexsinaiticus.org with a parent and find the end of Mark's Gospel. Write a paragraph describing what the page looks like and what it shows about how carefully the Bible has been preserved. Final project: make a timeline of Mark's Gospel from Jesus' ministry to your own Bible."}],"lessons/matthew.json":[{"id":"hist-01","bible":"mat-01","bibleTitle":"A Family Tree and a Surprise Baby","title":"The World Jesus Was Born Into","era":"About 63 BC to 4 BC","intro":"When Jesus was born, the Jewish people lived in a small land ruled by the most powerful empire the world had ever seen. To understand the Gospels, we need to understand that world: Rome, its first emperor, and a Jewish people waiting for God to keep his promises.","sections":[{"h":"Rome Rules the World","p":["For hundreds of years Rome had been a republic, governed by elected leaders and a Senate. But in the first century BC, powerful generals fought one civil war after another. Julius Caesar seized power and was assassinated in 44 BC. His adopted son Octavian defeated his last rivals, Mark Antony and Cleopatra of Egypt, at the Battle of Actium in 31 BC.","In 27 BC the Senate gave Octavian the title Augustus ('the revered one'). Historians call him Rome's first emperor. His rule began the Pax Romana, or 'Roman Peace,' about two hundred years with no major wars inside the empire. Roman roads, a common currency, and the Greek language, which most educated people in the eastern Mediterranean spoke, made travel and trade easier than ever. Later, all of this helped the good news about Jesus spread quickly."]},{"h":"Judea Under Rome","p":["About 150 years before Jesus, a Jewish family called the Maccabees led a revolt against a Greek king who had tried to stamp out Jewish worship. They won, rededicated the temple (the event Hanukkah remembers), and their descendants, the Hasmoneans, ruled an independent Jewish kingdom for about 80 years.","That independence ended in 63 BC, when the Roman general Pompey captured Jerusalem and even walked into the temple's Most Holy Place, which shocked the Jewish people. From then on, Rome was in charge. In 40 BC the Roman Senate named a man called Herod 'King of the Jews,' and by 37 BC he ruled Jerusalem with Roman backing. When Jesus was born, Herod was still king, and everyone knew who his real boss was."]},{"h":"Waiting for the Messiah","p":["Under foreign rulers, many Jews longed for the Messiah ('anointed one'), the king God had promised would come from King David's family. Some expected a warrior who would drive out Rome. Others expected a teacher, a priest, or a heavenly figure.","That's why genealogies mattered so much. Families kept careful track of their ancestors, and descent from David was important for anyone claiming to be the Messiah. When Matthew opens his Gospel with Jesus' family tree, he is making a historical claim his Jewish readers would immediately notice: this child belongs to David's royal line."]}],"people":[{"name":"Augustus (Octavian)","role":"First Roman emperor, ruled 27 BC to AD 14. He was emperor when Jesus was born."},{"name":"Pompey","role":"Roman general who captured Jerusalem in 63 BC"},{"name":"Herod the Great","role":"King of Judea under Rome, 37 to 4 BC"}],"source":{"title":"The Deeds of the Divine Augustus (Res Gestae)","who":"Augustus himself","date":"Written by AD 14","text":"Near the end of his life, Augustus wrote a list of his own achievements, which was carved in bronze outside his tomb and copied onto buildings around the empire. In it he boasts that he brought peace to the Roman world, and he mentions taking a census of Roman citizens three times, counting millions of people.","note":"Paraphrased. Luke 2:1 says a decree from Augustus sent Joseph and Mary to Bethlehem to be registered. Historians still discuss exactly how and when that particular registration happened, which is a good example of how history and the Bible are studied carefully together."},"vocab":[["Empire","A group of lands and peoples ruled by one powerful government or ruler"],["Pax Romana","'Roman Peace': about 200 years of relative peace inside the Roman Empire"],["Messiah","Hebrew for 'anointed one'; the promised king from David's family (in Greek, 'Christ')"],["Hasmoneans","The Jewish family of rulers descended from the Maccabees"]],"map":{"view":"wide","places":["rome","jerusalem_w","alexandria","antioch","athens"],"caption":"The Roman world. Judea was a small land on the eastern edge of the Mediterranean, far from Rome."},"timeline":[{"y":-63,"t":"Pompey captures Jerusalem; Rome takes control"},{"y":-27,"t":"Augustus becomes Rome's first emperor"},{"y":-5,"t":"Jesus is born (about 6-4 BC)"}],"video":[["Drive Thru History: The Historical Landscape","https://watch.tbn.org/s/Q9aSuuiu?e=2LGRQ7EL"],["Drive Thru History: The Announcements","https://watch.tbn.org/s/Q9aSuuiu?e=A2LJ87jP"]],"quiz":[{"q":"Who was Rome's first emperor?","options":["Julius Caesar","Augustus","Nero","Pompey"],"answer":1,"why":"Octavian received the title Augustus in 27 BC."},{"q":"What was the Pax Romana?","options":["A Roman army unit","About 200 years of peace inside the empire","A tax","A Roman temple"],"answer":1,"why":"It means 'Roman Peace.'"},{"q":"In what year did Pompey capture Jerusalem?","options":["63 BC","4 BC","AD 30","167 BC"],"answer":0,"why":"63 BC ended Jewish independence."},{"q":"What holiday remembers the Maccabees rededicating the temple?","options":["Passover","Hanukkah","Purim","Pentecost"],"answer":1,"why":"Hanukkah celebrates the temple's rededication."},{"q":"Why did genealogies matter for the Messiah?","options":["They proved you were rich","The Messiah had to come from David's family","Romans required them","They showed where you lived"],"answer":1,"why":"God promised a king from David's line."}],"assignment":"Imagine you are a Jewish kid living in Judea around 5 BC. Write a journal entry (one or two paragraphs) about what you see around you: Roman soldiers, King Herod's buildings, and what your family hopes the Messiah will do."},{"id":"hist-02","bible":"mat-02","bibleTitle":"Wise Men and a Jealous King","title":"Herod the Great and the Magi","era":"37 BC to 4 BC","intro":"King Herod appears in Matthew 2 as a jealous, violent ruler. History outside the Bible paints exactly the same picture. He was one of the most brilliant builders of the ancient world, and one of its most paranoid kings.","sections":[{"h":"Herod's Rise to Power","p":["Herod came from Idumea, the land south of Judea. His family had converted to Judaism, but many Jews never fully accepted him as one of their own. His father was a close ally of Rome, and Herod learned early that Rome's friendship was the key to power.","In 40 BC the Roman Senate declared him 'King of the Jews.' It took him three years and a Roman army to actually capture Jerusalem. Through all of Rome's civil wars he switched sides skillfully, first backing Mark Antony, then convincing Octavian (Augustus) that he'd be just as loyal to him."]},{"h":"The Master Builder","p":["Herod built on a scale that still amazes archaeologists. He rebuilt the Jerusalem temple into one of the most magnificent buildings in the Roman world. He built the port city of Caesarea on the Mediterranean with a huge artificial harbor. He built fortress-palaces like Masada, perched on a cliff above the Dead Sea, and Herodium, a cone-shaped hill near Bethlehem that he partly built up by hand.","In 2007, archaeologist Ehud Netzer announced that he had found what he believed was Herod's tomb on the side of Herodium, after searching for over 35 years. From Bethlehem, the young Jesus' family could have seen Herodium on the horizon."]},{"h":"A Paranoid King and Visitors From the East","p":["Herod was terrified of losing his throne. He had his favorite wife, Mariamne, executed, and later three of his own sons. So when foreign visitors arrived asking about a newborn 'king of the Jews,' his violent reaction in Matthew 2 fits what we know of him. Bethlehem was a small village, so the number of baby boys killed may have been small by Herod's standards. That may be why other historians of the time don't mention it, but it was a real horror for those families.","The Magi were probably scholars and priestly advisers from Persia or Babylon, in the Parthian Empire east of Rome. They studied the stars and ancient writings, and Jews had lived in Babylon since the exile, so they may have known Jewish hopes for a coming king. Herod died in 4 BC, which is why most historians date Jesus' birth to about 6-4 BC. The monk who later worked out our BC/AD calendar (in AD 525) made a small miscalculation."]}],"people":[{"name":"Herod the Great","role":"King of Judea 37-4 BC; builder of the temple, Caesarea, Masada, and Herodium"},{"name":"Mariamne","role":"Herod's Hasmonean wife, whom he had executed"},{"name":"Ehud Netzer","role":"Israeli archaeologist who found what he identified as Herod's tomb in 2007"}],"source":{"title":"Saturnalia","who":"Macrobius, a Roman writer","date":"About AD 400","text":"Macrobius records a joke said to have been made by Emperor Augustus. When he heard that Herod had killed his own son, Augustus remarked that it was better to be Herod's pig than Herod's son.","note":"Paraphrased. The joke is a pun in Greek: 'pig' (hus) and 'son' (huios) sound alike. Because Herod kept Jewish food laws, his pigs were safe, but his sons were not. It shows how Herod's cruelty was famous even in Rome."},"vocab":[["Idumea","Region south of Judea (the Old Testament Edom), Herod's family homeland"],["Magi","Wise men or scholars from the East who studied the stars"],["Parthian Empire","Rome's great rival empire to the east, in the region of modern Iran and Iraq"],["Fortress-palace","A royal residence that was also built to withstand attack"]],"map":{"view":"local","places":["jerusalem","bethlehem","herodium","masada","caesarea","nazareth"],"caption":"Herod's building projects surrounded Bethlehem, where Jesus was born, and Nazareth, where he grew up."},"timeline":[{"y":-37,"t":"Herod captures Jerusalem and begins his reign"},{"y":-4,"t":"Herod the Great dies"},{"y":2007,"t":"Herod's probable tomb found at Herodium","d":true}],"video":[["Drive Thru History: Jesus Is Born","https://watch.tbn.org/s/Q9aSuuiu?e=RDOb7PY9"],["Drive Thru History: Jesus Grows Up","https://watch.tbn.org/s/Q9aSuuiu?e=Ee6Zsm9X"]],"quiz":[{"q":"Where was Herod's family from?","options":["Rome","Idumea","Egypt","Galilee"],"answer":1,"why":"Idumea, south of Judea."},{"q":"Which of these did Herod NOT build?","options":["Masada","Herodium","The harbor at Caesarea","The pyramids"],"answer":3,"why":"The pyramids were built about 2,500 years earlier."},{"q":"When did Herod die?","options":["AD 30","4 BC","63 BC","AD 70"],"answer":1,"why":"That's why Jesus was likely born around 6-4 BC."},{"q":"Where did the Magi probably come from?","options":["Greece","Persia or Babylon","Italy","Africa"],"answer":1,"why":"The Parthian Empire, east of Rome."},{"q":"What does Augustus' pun about Herod's pig tell us?","options":["Herod loved animals","Herod's cruelty to his own family was famous","Herod ate pork","Augustus disliked pigs"],"answer":1,"why":"Even the emperor joked about it."}],"assignment":"Make a two-column chart: 'Herod the Builder' and 'Herod the Tyrant.' List at least three facts in each column. Then write two sentences about how Matthew 2 fits with what history tells us about Herod."},{"id":"hist-03","bible":"mat-03","bibleTitle":"John the Baptist and Jesus' Baptism","title":"Pharisees, Sadducees, and the Dead Sea Scrolls","era":"About AD 28","intro":"When John the Baptist preached by the Jordan River, several Jewish groups with very different ideas were watching. One of those groups left behind a hidden library that was discovered by a shepherd in 1947.","sections":[{"h":"The Jewish Groups of Jesus' Day","p":["The Pharisees were popular teachers of the law who tried to apply God's commands to every part of daily life. They followed a large body of 'oral tradition,' teachings passed down alongside the written Scriptures, and they believed in angels and the resurrection of the dead.","The Sadducees were mostly wealthy priestly families who controlled the temple. They accepted only the five books of Moses as authoritative and did not believe in resurrection. They cooperated with Rome to keep their power.","The Essenes were a stricter group who separated themselves from what they saw as a corrupt temple. Some lived in communities in the wilderness. Later, Zealots would push for armed revolt against Rome."]},{"h":"The Hidden Library of Qumran","p":["In 1947, a young Bedouin shepherd searching for a lost goat threw a rock into a cave near the Dead Sea and heard pottery break. Inside were clay jars holding ancient scrolls. Over the next years, searchers found fragments of around 900 scrolls in eleven caves near a site called Qumran.","The Dead Sea Scrolls include copies of every book of the Old Testament except Esther. The Great Isaiah Scroll is about 1,000 years older than the oldest Hebrew copy of Isaiah known before 1947, and it is remarkably close to later copies. Many scholars believe the scrolls belonged to an Essene-like community that lived at Qumran, only a few miles from where John baptized."]},{"h":"John in the Wilderness","p":["Ritual washing was already part of Jewish life. Archaeologists have found hundreds of mikva'ot (ritual immersion pools) from this period. But John's baptism was different: a one-time act of repentance in preparation for God's coming kingdom.","Luke 3:1 dates John's ministry to 'the fifteenth year of the reign of Tiberius Caesar,' about AD 28 or 29, one of the most precise dates in the Bible. The Jewish historian Josephus, writing around AD 93, also describes John as a good man who called people to live justly and be baptized."]}],"people":[{"name":"John the Baptist","role":"Prophet who preached repentance and baptized in the Jordan"},{"name":"Flavius Josephus","role":"Jewish historian (about AD 37-100) whose books are our main source for this period"},{"name":"Muhammad edh-Dhib","role":"The young Bedouin shepherd credited with finding the first Dead Sea Scrolls cave"}],"source":{"title":"The Community Rule (one of the Dead Sea Scrolls)","who":"The Qumran community","date":"About 100 BC","text":"The Qumran community's rulebook explains why they moved into the desert. They quote Isaiah 40:3, about preparing the way of the LORD in the wilderness, and say they went out to the wilderness to study God's law and prepare his way.","note":"Paraphrased. Matthew 3:3 quotes the very same verse, Isaiah 40:3, about John the Baptist. Both the Qumran group and John believed God was about to act, but John announced that the one they were waiting for was about to arrive."},"vocab":[["Oral tradition","Teachings passed down by word of mouth alongside the written Scriptures"],["Mikveh (plural mikva'ot)","A pool for Jewish ritual washing"],["Scroll","A long roll of leather or papyrus used for writing before books with pages"],["Sect","A smaller group within a larger religion with its own distinct beliefs"]],"map":{"view":"local","places":["jordanbaptism","qumran","jericho","jerusalem"],"caption":"John baptized near the Jordan River, a few miles from the Qumran caves where the Dead Sea Scrolls were found."},"timeline":[{"y":28,"t":"John the Baptist begins preaching (15th year of Tiberius)"},{"y":1947,"t":"The first Dead Sea Scrolls are discovered","d":true}],"video":[["Drive Thru History: Jesus Starts His Ministry","https://watch.tbn.org/s/Q9aSuuiu?e=mdExyFzO"]],"quiz":[{"q":"Which group did NOT believe in the resurrection?","options":["Pharisees","Sadducees","Essenes","Disciples"],"answer":1,"why":"The Sadducees rejected the resurrection."},{"q":"How were the first Dead Sea Scrolls found?","options":["By a museum team","A shepherd threw a rock into a cave","During a war","Under the temple"],"answer":1,"why":"A Bedouin shepherd heard pottery break."},{"q":"Which Old Testament book is missing from the Dead Sea Scrolls?","options":["Isaiah","Genesis","Esther","Psalms"],"answer":2,"why":"Every book except Esther has been found."},{"q":"What is a mikveh?","options":["A scroll","A ritual washing pool","A synagogue","A coin"],"answer":1,"why":"Used for Jewish ritual purity."},{"q":"Which verse do both the Community Rule and Matthew 3 quote?","options":["Genesis 1:1","Isaiah 40:3","Psalm 23:1","Micah 5:2"],"answer":1,"why":"'Prepare the way of the LORD in the wilderness.'"}],"assignment":"Create a chart comparing Pharisees, Sadducees, and Essenes: who they were, what they believed, and how they felt about Rome. Then write a paragraph: which group do you think John the Baptist was most like, and which was he most different from?"},{"id":"hist-04","bible":"mat-04","bibleTitle":"Tested in the Desert, Calling Fishermen","title":"Fishing on the Sea of Galilee","era":"About AD 28-30","intro":"Jesus called fishermen to be his first disciples. In 1986, a drought on the Sea of Galilee uncovered an actual fishing boat from their time.","sections":[{"h":"A Lake With Many Names","p":["The 'Sea' of Galilee is really a freshwater lake, about 13 miles long and 8 miles wide. It sits about 700 feet below sea level, making it one of the lowest freshwater lakes on earth. The Old Testament calls it Kinnereth, possibly because its shape resembles a harp (kinnor). Luke calls it the Lake of Gennesaret, and John calls it the Sea of Tiberias.","Around the lake were busy towns: Capernaum, Jesus' home base; Bethsaida, hometown of Peter, Andrew, and Philip; and Magdala, known for salting and exporting fish. Its Greek name, Taricheae, comes from a word for salted fish."]},{"h":"The Fishing Business","p":["Fishermen used several kinds of nets: a round cast net thrown by one person from shore or shallow water, a long dragnet pulled by teams, and layered trammel nets set at night. The disciples often fished at night, when fish came closer to the surface.","Fishing families were not the poorest people in Galilee. Zebedee, James and John's father, had hired workers (Mark 1:20), and Luke 5 describes Peter and the Zebedee brothers as business partners. When they 'left their nets,' they were leaving a real family business. Herod Antipas, who ruled Galilee, taxed the fishing industry. He even built a new capital, Tiberias, on the lake's shore around AD 20 and named it after Emperor Tiberius."]},{"h":"The 'Jesus Boat'","p":["In 1986 a severe drought lowered the lake's water level. Two brothers from a nearby kibbutz, Moshe and Yuval Lufan, spotted the outline of an ancient boat in the mud. Archaeologists dated it to between about 100 BC and AD 70, the era of Jesus.","The boat is about 27 feet long and 7.5 feet wide, big enough for a crew of around a dozen people. It had been repaired many times with different kinds of wood, which suggests it belonged to people who couldn't afford a new one. No one knows who owned it, but it's the kind of boat the disciples would have used. After years of careful preservation, it is displayed in a museum near the lake."]}],"people":[{"name":"Herod Antipas","role":"Son of Herod the Great; ruler of Galilee 4 BC to AD 39"},{"name":"Zebedee","role":"Fisherman, father of the apostles James and John"},{"name":"Moshe and Yuval Lufan","role":"Brothers who discovered the ancient Galilee boat in 1986"}],"source":{"title":"The Jewish War, Book 3","who":"Josephus","date":"About AD 75","text":"Josephus, who commanded Jewish forces in Galilee, describes the lake as having sweet water that is good to drink, clear and pure. He praises the plain beside it, saying the soil is so rich that almost every kind of tree grows there and fruit is available nearly all year round. He also mentions many kinds of fish in the lake.","note":"Paraphrased. Josephus knew this area personally. His description helps us picture the fertile, busy region where Jesus spent most of his ministry."},"vocab":[["Kinnereth","Old Testament name for the Sea of Galilee"],["Cast net","A round, weighted net thrown by hand"],["Tetrarch","'Ruler of a quarter': a lower title than king, used for Herod's sons"],["Kibbutz","A modern Israeli farming community"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala","tiberias","nazareth"],"caption":"The towns around the Sea of Galilee, where Jesus called his first disciples."},"timeline":[{"y":20,"t":"Herod Antipas founds Tiberias (about AD 20)"},{"y":1986,"t":"The ancient Galilee boat is discovered","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"Why is the Sea of Galilee unusual?","options":["It's saltwater","It's about 700 feet below sea level","It's the largest lake in the world","It freezes in winter"],"answer":1,"why":"It's one of the lowest freshwater lakes on earth."},{"q":"What was Magdala known for?","options":["Pottery","Salted fish","Purple dye","Wine"],"answer":1,"why":"Its Greek name means salted fish."},{"q":"What shows Zebedee's family wasn't very poor?","options":["They lived in a palace","They had hired workers","They owned camels","They were priests"],"answer":1,"why":"Mark 1:20 mentions hired men."},{"q":"What revealed the ancient Galilee boat in 1986?","options":["An earthquake","A drought","A storm","Divers"],"answer":1,"why":"Low water levels exposed it."},{"q":"Who founded the city of Tiberias?","options":["Herod the Great","Herod Antipas","Pontius Pilate","Augustus"],"answer":1,"why":"Antipas built it around AD 20."}],"assignment":"Draw the Galilee boat (27 ft long, 7.5 ft wide) to scale on graph paper, using one square for each foot. Mark where a crew of fishermen might sit and where nets would be stored. Write a caption explaining what the boat teaches us about the disciples."},{"id":"hist-05","bible":"mat-05","bibleTitle":"Blessed Are... (The Beatitudes)","title":"Synagogues, Rabbis, and Disciples","era":"1st century AD","intro":"Jesus 'sat down' to teach, just like other Jewish teachers of his day. Knowing how synagogues and rabbis worked helps us see why the crowds were so amazed by him.","sections":[{"h":"The Synagogue","p":["The temple in Jerusalem was the only place for sacrifices, but most Jews lived far from it. So towns built synagogues ('gathering places') for prayer, reading Scripture, and teaching. On the Sabbath, someone would read from the Law and the Prophets, and then a teacher might explain the passage, just as Jesus did in Nazareth (Luke 4).","In 2009, archaeologists digging at Magdala found a synagogue from Jesus' time, one of only a handful from that period. Inside was a carved stone decorated with a seven-branched menorah. Since the Gospels say Jesus taught in synagogues throughout Galilee, it's quite possible he taught in this very building."]},{"h":"Rabbis and Their Disciples","p":["'Rabbi' means 'my master' or 'my teacher.' A disciple didn't just attend classes. He followed his teacher everywhere, listened, memorized his words, and tried to live like him. Teachers usually sat to teach while students stood or sat around them.","Two famous teachers lived just before Jesus: Hillel and Shammai. Their students debated how to apply the law. Hillel was famous for summing up the law in one sentence: 'What is hateful to you, do not do to your neighbor. That is the whole law; the rest is commentary.' Jesus' Golden Rule goes further. Instead of just avoiding harm, it tells us to actively do good (Matthew 7:12)."]},{"h":"Teaching 'With Authority'","p":["Rabbis usually quoted earlier teachers to support their points: 'Rabbi so-and-so said...' That's why Matthew 7:29 says the crowds were amazed that Jesus taught 'as one who had authority, and not as their teachers of the law.' He said, 'You have heard that it was said... But I tell you.'","The traditional Mount of Beatitudes rises above the northwest shore of the Sea of Galilee near Capernaum. Its gentle slopes form a natural amphitheater where a speaker's voice carries well. Visitors today can test this for themselves."]}],"people":[{"name":"Hillel the Elder","role":"Famous Jewish teacher active around 30 BC to AD 10"},{"name":"Shammai","role":"Hillel's rival, known for stricter interpretations of the law"},{"name":"Theodotus","role":"Priest and synagogue leader in Jerusalem, known from an ancient inscription"}],"source":{"title":"The Theodotus Inscription","who":"Carved for a Jerusalem synagogue","date":"Before AD 70; found in 1913","text":"This Greek inscription says that Theodotus, a priest and synagogue leader, built the synagogue for the reading of the law and the teaching of the commandments. He also built a guesthouse with rooms and water facilities for travelers from abroad.","note":"Paraphrased. This is one of the oldest synagogue inscriptions ever found, and it describes exactly what the Gospels show synagogues being used for: reading and teaching Scripture."},"vocab":[["Synagogue","A Jewish gathering place for prayer, Scripture reading, and teaching"],["Rabbi","'My master/teacher': a title for a Jewish teacher"],["Disciple","A student who follows and imitates a teacher"],["Menorah","A seven-branched lampstand, a symbol of the temple"]],"map":{"view":"local","places":["capernaum","magdala","nazareth","jerusalem"],"caption":"Synagogues from Jesus' era have been found at Magdala and in Jerusalem. Capernaum's visible synagogue was built later on older foundations."},"timeline":[{"y":-20,"t":"Hillel the Elder teaches (about 30 BC-AD 10)"},{"y":1913,"t":"The Theodotus synagogue inscription is found in Jerusalem","d":true},{"y":2009,"t":"A synagogue from Jesus' time is found at Magdala","d":true}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"What does 'rabbi' mean?","options":["Priest","My master or teacher","King","Prophet"],"answer":1,"why":"It was a respectful title for a teacher."},{"q":"What was found at Magdala in 2009?","options":["A fishing boat","A synagogue from Jesus' time","Herod's tomb","A scroll"],"answer":1,"why":"Including a stone carved with a menorah."},{"q":"How did most rabbis support their teaching?","options":["By quoting earlier teachers","By doing miracles","By writing books","By voting"],"answer":0,"why":"That's why Jesus' 'But I tell you' stood out."},{"q":"How is Jesus' Golden Rule different from Hillel's saying?","options":["It's the same","Jesus says to actively do good, not just avoid harm","Hillel's was longer","Jesus said it in Greek"],"answer":1,"why":"Jesus put it in positive terms."},{"q":"What did a disciple do?","options":["Paid for classes","Followed and imitated his teacher","Wrote the teacher's books","Collected taxes"],"answer":1,"why":"Disciples lived alongside their teacher."}],"assignment":"Hillel said, 'What is hateful to you, do not do to your neighbor.' Jesus said, 'Do to others what you would have them do to you.' Write a paragraph explaining the difference, and give one real-life example where the two would lead to different actions."},{"id":"hist-06","bible":"mat-06","bibleTitle":"Love Your Enemies","title":"Living Under Roman Occupation","era":"4 BC to AD 30","intro":"When Jesus said 'love your enemies' and 'go the extra mile,' his listeners immediately thought of the Roman soldiers who occupied their land. Some of their neighbors had died fighting those soldiers.","sections":[{"h":"The Roman Army in Judea","p":["A Roman legion had roughly 5,000 soldiers, divided into centuries of about 80 men, each led by a centurion. Judea didn't have a full legion stationed in it. Instead, the governor commanded auxiliary troops, mostly recruited from non-Jewish towns in the region, based at Caesarea on the coast, with a garrison in the Antonia Fortress overlooking the Jerusalem temple.","Behind them stood the legions in Syria, ready to march south if trouble broke out. Everyone knew that rebellion could bring overwhelming force."]},{"h":"The Extra Mile","p":["Roman law allowed soldiers and officials to force civilians to carry equipment or provide animals. This practice was called angaria. A soldier could order a Jewish man to carry his heavy pack for one Roman mile, about 1,000 paces (roughly 4,860 feet). Stone milestones marked distances along Roman roads.","This was humiliating, and people resented it. So Jesus' command to go a second mile willingly was shocking. It turned a moment of forced submission into a free act of kindness. The Gospels even record Roman soldiers forcing Simon of Cyrene to carry Jesus' cross."]},{"h":"Four Ways to Respond to Rome","p":["Jews responded to Roman rule in different ways. Some cooperated to protect their position, like the Sadducee priests and the Herodians. Some withdrew, like the Essenes at Qumran. Some waited and prayed for God to act. And some fought.","When Herod the Great died in 4 BC, revolts broke out, and the Roman general Varus crushed them brutally. In AD 6, when Rome took direct control of Judea and ordered a census for taxation, a man named Judas the Galilean led another revolt (Acts 5:37 mentions him). Jesus grew up in the shadow of these failed uprisings. His call to love enemies was a completely different way from both cooperation and violence."]}],"people":[{"name":"Judas the Galilean","role":"Led a revolt against Roman taxation in AD 6"},{"name":"Quirinius","role":"Roman governor of Syria who carried out the census of AD 6"},{"name":"Varus","role":"Roman governor of Syria who crushed revolts after Herod's death"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus writes that Judas the Galilean urged his countrymen to revolt, telling them they would be cowards if they agreed to pay taxes to the Romans and accepted human masters when God alone was their Lord.","note":"Paraphrased. Josephus blamed this movement for eventually leading to the disastrous war with Rome in AD 66. Compare Judas' message with Jesus' teaching in Matthew 5:38-48."},"vocab":[["Legion","A large Roman army unit of roughly 5,000 soldiers"],["Centurion","A Roman officer commanding about 80 soldiers"],["Auxiliaries","Soldiers recruited from Rome's provinces rather than Roman citizens"],["Angaria","The Roman right to force civilians into temporary service"]],"map":{"view":"local","places":["caesarea","jerusalem","sepphoris","samaria"],"caption":"Roman troops were based at Caesarea and Jerusalem. Sepphoris, near Nazareth, was burned by the Romans after a revolt in 4 BC."},"timeline":[{"y":-4,"t":"Revolts after Herod's death are crushed by Rome"},{"y":6,"t":"Judea comes under direct Roman rule; Judas the Galilean revolts"}],"video":[],"quiz":[{"q":"About how many men did a centurion command?","options":["10","80","1,000","5,000"],"answer":1,"why":"A century had about 80 soldiers."},{"q":"What was angaria?","options":["A Roman coin","Forced service for soldiers or officials","A type of legion","A temple tax"],"answer":1,"why":"Soldiers could compel civilians to carry loads."},{"q":"Where were Roman troops in Judea mainly based?","options":["Jericho","Caesarea","Bethlehem","Nazareth"],"answer":1,"why":"The governor's headquarters was at Caesarea."},{"q":"What did Judas the Galilean oppose?","options":["The temple","Paying taxes to Rome","The Pharisees","The synagogue"],"answer":1,"why":"He revolted over the census and taxes in AD 6."},{"q":"How was Jesus' teaching different from Judas the Galilean's?","options":["Jesus called for revolt too","Jesus taught love for enemies instead of violence","Jesus supported the Sadducees","There was no difference"],"answer":1,"why":"Jesus rejected both violent revolt and simply seeking power."}],"assignment":"Measure out one Roman mile (about 0.92 of a regular mile) on a walk or map. Then write a paragraph: how would it feel to be forced to carry a soldier's pack that far? What would it mean to choose to go a second mile?"},{"id":"hist-07","bible":"mat-07","bibleTitle":"How to Pray and Why Not to Worry","title":"Prayer, Fasting, and Money","era":"1st century AD","intro":"Jesus talked about giving, praying, fasting, and storing up treasure: four things every Jewish family practiced. Here's what those practices looked like in real life.","sections":[{"h":"Jewish Prayer","p":["Faithful Jews recited the Shema twice a day, morning and evening. It begins, 'Hear, O Israel: The LORD our God, the LORD is one' (Deuteronomy 6:4). Many also prayed at fixed times that matched the temple's daily sacrifices. Acts 3:1 mentions Peter and John going to the temple 'at the time of prayer, at three in the afternoon.'","Some men wore tefillin (phylacteries): small leather boxes containing Scripture verses, tied to the forehead and arm. Tefillin have been found among the Dead Sea Scrolls. Jesus criticized people who made theirs extra large to look holy (Matthew 23:5), not the practice itself."]},{"h":"Giving and Fasting","p":["Giving to the poor (almsgiving) was considered a central part of righteousness. Collections for the poor were organized in towns and at the temple. Fasting was also common. The Pharisee in Jesus' parable boasts of fasting twice a week (Luke 18:12), and later sources say Mondays and Thursdays were popular fasting days.","Early Christians kept these practices but changed some details. A Christian handbook called the Didache, written around AD 100, tells believers to fast on Wednesdays and Fridays and to pray the Lord's Prayer three times a day."]},{"h":"Moths, Rust, and Thieves","p":["In a world without banks for ordinary people, wealth was stored as fine clothing, which moths could ruin, or as coins and metal objects, which could corrode. Thieves could literally 'dig through' the mud-brick or rough stone walls of houses to steal them.","Many people buried their savings. Archaeologists regularly find coin hoards that someone hid and never came back for. Common coins included the Roman silver denarius (a day's wage), the Tyrian silver shekel, and the tiny bronze lepton, the 'widow's mite.' Jesus' words about treasure were practical as well as spiritual: earthly wealth really was fragile."]}],"people":[{"name":"The authors of the Didache","role":"Unknown early Christian leaders who wrote a handbook for churches around AD 100"}],"source":{"title":"The Didache (The Teaching of the Twelve Apostles), chapter 8","who":"Early Christian writers","date":"About AD 100","text":"The Didache tells Christians not to fast on the same days as the hypocrites, who fast on Mondays and Thursdays, but to fast on Wednesdays and Fridays instead. It also says not to pray like the hypocrites, but to pray the Lord's Prayer as Jesus commanded in his Gospel, three times each day.","note":"Paraphrased. This is one of the earliest Christian writings outside the New Testament. It shows how quickly Christians began praying the Lord's Prayer from Matthew 6."},"vocab":[["Shema","The central Jewish confession of faith from Deuteronomy 6:4-9"],["Tefillin / phylacteries","Small boxes containing Scripture worn during prayer"],["Almsgiving","Giving money or help to the poor"],["Denarius","A Roman silver coin worth about a day's wage"]],"map":{"view":"local","places":["jerusalem","capernaum","qumran"],"caption":"Tefillin from this era were found at Qumran. Prayer times matched the temple sacrifices in Jerusalem."},"timeline":[{"y":100,"t":"The Didache is written (about AD 100)"}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"How often did faithful Jews recite the Shema?","options":["Once a year","Twice a day","Once a week","Only at Passover"],"answer":1,"why":"Morning and evening."},{"q":"What are tefillin?","options":["Coins","Small boxes with Scripture worn during prayer","Oil lamps","Temple guards"],"answer":1,"why":"Also called phylacteries."},{"q":"According to the Didache, how often should Christians pray the Lord's Prayer?","options":["Once a day","Three times a day","Only on Sundays","Seven times a day"],"answer":1,"why":"Three times each day."},{"q":"Why did thieves 'dig through' walls?","options":["Doors were locked with magic","Many walls were mud-brick or rough stone","They were building tunnels","It was a Roman law"],"answer":1,"why":"Walls could be broken through."},{"q":"What was a denarius worth?","options":["A year's wage","About a day's wage","Nothing","A house"],"answer":1,"why":"It was a standard day's pay."}],"assignment":"Try praying the Lord's Prayer three times a day for three days, like the early Christians in the Didache. Then write a paragraph about what you noticed."},{"id":"hist-08","bible":"mat-08","bibleTitle":"Ask, Seek, Knock, and Build on the Rock","title":"Houses and Builders in Galilee","era":"4 BC to AD 30","intro":"Jesus' story of two builders came from someone who knew building firsthand. The Gospels call both Jesus and Joseph a tekton, a builder.","sections":[{"h":"Jesus the Tekton","p":["Mark 6:3 calls Jesus 'the carpenter,' and Matthew 13:55 calls him 'the carpenter's son.' The Greek word tekton means more than woodworker. It describes a craftsman who built with wood, and often stone as well: doors, roofs, tools, furniture, and houses.","Nazareth was a tiny village, perhaps a few hundred people. In 2009 archaeologists uncovered the first house from Jesus' time ever found in Nazareth: a simple dwelling with a courtyard and a cistern for collecting rainwater."]},{"h":"The City Next Door","p":["About four miles from Nazareth stood Sepphoris. After Herod the Great died in 4 BC, rebels seized its armory, and the Romans burned the city in response. Herod Antipas then rebuilt it as his capital, and Josephus called it 'the ornament of all Galilee.'","This massive building project was happening during Jesus' childhood, a short walk from his home. Some historians wonder whether Joseph and Jesus found work there. The Bible doesn't say, but it's an interesting possibility."]},{"h":"Houses on Rock","p":["Most Galilean houses were built of local stone, dark basalt around the Sea of Galilee and limestone in the hills, and arranged around shared courtyards where extended families lived together. Roofs were made of wooden beams covered with branches and packed mud, which is why friends could dig through a roof to lower a paralyzed man to Jesus (Mark 2:4).","The land of Israel is full of wadis, dry valleys that can become raging rivers within minutes during winter storms. Luke 6:48 says the wise builder 'dug down deep and laid the foundation on rock.' A house built on the sandy floor of a wadi could look fine all summer and then be swept away in a single storm."]}],"people":[{"name":"Joseph","role":"Jesus' earthly father, a tekton (builder) from Nazareth"},{"name":"Herod Antipas","role":"Rebuilt Sepphoris as his capital"},{"name":"Yardenna Alexandre","role":"Archaeologist who excavated the first house from Jesus' time found in Nazareth (2009)"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus writes that Herod Antipas built up and fortified Sepphoris to be the ornament of all Galilee and made it his capital city.","note":"Paraphrased. Archaeologists have uncovered Sepphoris' streets, homes, and a theater (though some date the theater later). It was a large, partly Greek-style city close to Jesus' small hometown."},"vocab":[["Tekton","Greek word for a builder or craftsman in wood and stone"],["Cistern","An underground tank for storing rainwater"],["Basalt","A dark volcanic stone common around the Sea of Galilee"],["Wadi","A dry valley that floods during heavy rain"]],"map":{"view":"local","places":["nazareth","sepphoris","cana","capernaum"],"caption":"Sepphoris, rebuilt by Herod Antipas, was only about four miles from Nazareth."},"timeline":[{"y":-3,"t":"Herod Antipas begins rebuilding Sepphoris (after 4 BC)"},{"y":2009,"t":"The first house from Jesus' time is found in Nazareth","d":true}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"What does the Greek word tekton mean?","options":["Fisherman","Builder or craftsman","Teacher","Tax collector"],"answer":1,"why":"A craftsman in wood and often stone."},{"q":"How far was Sepphoris from Nazareth?","options":["About 4 miles","About 40 miles","About 100 miles","Next door"],"answer":0,"why":"An easy walk."},{"q":"What were roofs usually made of?","options":["Clay tiles","Beams, branches, and packed mud","Stone slabs","Metal"],"answer":1,"why":"Which is why friends could dig through one."},{"q":"What is a wadi?","options":["A well","A dry valley that floods in storms","A kind of house","A mountain"],"answer":1,"why":"Wadis can flood in minutes."},{"q":"What was found in Nazareth in 2009?","options":["A synagogue","A house from Jesus' time","Joseph's tools","A boat"],"answer":1,"why":"A simple house with a courtyard and cistern."}],"assignment":"Build a small model house (with blocks, cardboard, or clay) with a flat roof and courtyard like a Galilean home. Then pour water near two model 'foundations,' one on sand and one on a rock, and write up what happened."},{"id":"hist-09","bible":"mat-09","bibleTitle":"Jesus Heals and Calms the Storm","title":"Sickness, Medicine, and the Decapolis","era":"1st century AD","intro":"Before anyone knew germs existed, sickness was frightening and often isolating. Knowing what medicine was like in the first century helps us see why Jesus' healings stunned people.","sections":[{"h":"Ancient Medicine","p":["Greek physicians like Hippocrates (about 460-370 BC) tried to explain disease by natural causes rather than curses. Many believed health depended on balancing four 'humors' in the body. Doctors used herbs, olive oil, wine (to clean wounds), bandages, and surgery with bronze tools.","Treatment was often expensive and painful, and it frequently failed. Mark 5:26 describes a woman who 'had suffered a great deal under the care of many doctors and had spent all she had, yet instead of getting better she grew worse.' No one understood germs until the 1860s, when scientists like Louis Pasteur showed that tiny organisms cause many diseases."]},{"h":"Unclean: Living With Leprosy","p":["The Bible's word often translated 'leprosy' covered a range of skin diseases. Leviticus 13-14 told priests how to examine them. A person with such a disease had to live outside the community, wear torn clothes, and call out 'Unclean!' to warn others.","This meant losing your home, your work, your synagogue, and every human touch. That's why it matters so much that Jesus touched the man with leprosy in Matthew 8. Jesus wasn't made unclean; instead, the man was made clean."]},{"h":"The Decapolis: Greek Cities Across the Lake","p":["East of the Sea of Galilee lay the Decapolis ('ten cities'), a group of cities with Greek language, temples, theaters, and culture. Most people there were Gentiles. That's why a large herd of pigs could be feeding near Gadara: Jews didn't eat pork, but Greeks and Romans did.","Gadara was famous for its hot springs and for producing poets and philosophers. When Jesus crossed the lake into this region, he was stepping into Gentile territory, a hint that his kingdom would reach beyond Israel."]}],"people":[{"name":"Hippocrates","role":"Greek physician (about 460-370 BC), often called the father of medicine"},{"name":"Luke","role":"Gospel writer, called 'the doctor' by Paul (Colossians 4:14)"},{"name":"Louis Pasteur","role":"French scientist whose work in the 1860s helped prove germ theory"}],"source":{"title":"The Hippocratic Oath","who":"Greek physicians in the tradition of Hippocrates","date":"About 400 BC","text":"In this oath, a doctor swears by the gods to use treatment to help the sick according to his ability and judgment, and never to use it to injure or wrong anyone. He promises to enter homes only for the benefit of the sick and to keep private whatever he learns about patients.","note":"Paraphrased. Versions of this oath are still used by doctors today. Notice it is sworn by Greek gods, showing the pagan world Luke and others lived in, yet many of its ideals match Christian care for the sick."},"vocab":[["Physician","A doctor"],["Four humors","Ancient belief that health depends on balancing four body fluids"],["Decapolis","'Ten cities': a group of Greek cities east of the Jordan"],["Unclean","Ritually impure, unable to take part in worship or community life"]],"map":{"view":"local","places":["capernaum","gadara","gerasa","magdala"],"caption":"Jesus crossed from Jewish Galilee to the Gentile Decapolis, where cities like Gadara and Gerasa stood."},"timeline":[{"y":-400,"t":"Hippocratic writings shape Greek medicine (about 400 BC)"},{"y":1862,"t":"Pasteur's experiments support germ theory (1860s)","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What did many ancient doctors believe caused illness?","options":["Germs","An imbalance of four humors","Bad dreams","The moon"],"answer":1,"why":"Germ theory didn't come until the 1800s."},{"q":"What did a person with leprosy have to call out?","options":["Help!","Unclean!","Hosanna!","Mercy!"],"answer":1,"why":"To warn others to keep away."},{"q":"What does Decapolis mean?","options":["Ten cities","Holy land","Greek coast","Twelve tribes"],"answer":0,"why":"Deka = ten, polis = city."},{"q":"Why were there pigs near Gadara?","options":["Jews raised them for sacrifices","It was Gentile territory where people ate pork","They were wild","Romans banned them elsewhere"],"answer":1,"why":"The Decapolis was mostly Gentile."},{"q":"Which Gospel writer was a doctor?","options":["Matthew","Mark","Luke","John"],"answer":2,"why":"Paul calls Luke 'the doctor.'"}],"assignment":"Research one ancient medical treatment (such as using olive oil, wine, or honey on wounds). Write a paragraph about how it worked and whether modern science says it helps."},{"id":"hist-10","bible":"mat-10","bibleTitle":"Matthew Is Called and a Girl Lives Again","title":"Taxes and Tax Collectors","era":"1st century AD","intro":"Why did everyone hate tax collectors so much? The answer lies in how Rome and the Herod family collected money, and in where Matthew's tax booth stood.","sections":[{"h":"Many Kinds of Taxes","p":["People in Judea and Galilee paid several kinds of taxes. There was tribute paid to Rome, including taxes on land and crops and a 'head tax' on each person. There were tolls and customs charged on goods moving along roads and across borders. And every Jewish man also paid a half-shekel temple tax each year.","Historians debate the exact total, but for an ordinary farming family, taxes, tithes, and rents together could take a large share of what they produced, perhaps a third or more. For families living close to the edge, that could mean the difference between eating and going hungry."]},{"h":"Tax Farming","p":["Rome didn't have a big government office to collect taxes. Instead, it often 'farmed out' collection: wealthy contractors bid for the right to collect taxes in a region, paid the government up front, and then collected as much as they could. Local collectors worked under them, and anything above the required amount was their profit.","This system invited cheating. That's why Zacchaeus, a chief tax collector, promised to pay back four times anything he had taken unfairly (Luke 19:8). Jewish tax collectors were seen as traitors who worked for foreign rulers and got rich off their own people. Later Jewish writings group tax collectors with robbers."]},{"h":"Matthew's Booth at Capernaum","p":["When Herod the Great died in 4 BC, his kingdom was split among three sons. Herod Antipas got Galilee, and Philip got the lands north and east of the Sea of Galilee. Capernaum sat near the border between them, on a trade route. So Matthew's booth was probably a customs post, taxing goods like fish, grain, and cloth as they passed through, most likely on behalf of Herod Antipas.","That makes Jesus' choice even more surprising. He called a man everyone despised, and Matthew's first act as a disciple was to throw a party so his fellow tax collectors could meet Jesus."]}],"people":[{"name":"Matthew (Levi)","role":"Tax collector at Capernaum who became an apostle and wrote the first Gospel"},{"name":"Zacchaeus","role":"Chief tax collector in Jericho who repaid those he cheated (Luke 19)"},{"name":"Philip the Tetrarch","role":"Son of Herod the Great; ruled lands north and east of Galilee, 4 BC to AD 34"}],"source":{"title":"The Mishnah, Ketubot 4:4","who":"Jewish rabbis (collected later)","date":"Written down about AD 200","text":"This section of the Mishnah says that even the poorest man in Israel should hire at least two flute players and one wailing woman when his wife dies.","note":"Paraphrased. This helps explain Matthew 9:23, where Jesus arrives at Jairus' house and finds flute players and a noisy crowd already mourning. Professional mourners were an expected part of Jewish funerals."},"vocab":[["Tribute","Tax paid by a conquered people to their rulers"],["Customs / tolls","Taxes on goods moved across borders or along roads"],["Tax farming","System where private collectors bid for the right to collect taxes"],["Mishnah","Collection of Jewish oral law written down around AD 200"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala","tiberias"],"caption":"Capernaum was in Antipas' Galilee; Bethsaida, just across the Jordan, was in Philip's territory. Goods crossing between them were taxed."},"timeline":[{"y":-4,"t":"Herod's kingdom split: Archelaus gets Judea, Antipas gets Galilee, Philip gets the north and east"},{"y":200,"t":"The Mishnah is written down (about AD 200)"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What was 'tax farming'?","options":["Taxing farmers only","Private collectors bidding for the right to collect taxes","Paying taxes in crops","A Jewish tithe"],"answer":1,"why":"Collectors kept anything above the required amount."},{"q":"Why were Jewish tax collectors hated?","options":["They were Roman","They worked for foreign rulers and often cheated","They were priests","They didn't pay taxes themselves"],"answer":1,"why":"They were seen as traitors and thieves."},{"q":"What kind of tax did Matthew probably collect?","options":["Temple tax","Customs on goods passing through","Head tax","Land tax"],"answer":1,"why":"Capernaum was near a border on a trade route."},{"q":"Who ruled Galilee after 4 BC?","options":["Pontius Pilate","Herod Antipas","Philip","Caesar"],"answer":1,"why":"Antipas ruled Galilee."},{"q":"What does the Mishnah say about funerals?","options":["They should be silent","Even the poor should hire flute players and a wailing woman","They should last 40 days","Only priests may attend"],"answer":1,"why":"Professional mourners were expected."}],"assignment":"Set up a pretend market with a parent or sibling. Give yourself 30 'coins' of produce, then take away taxes: 10% tithe, 12% for Rome, a 3-coin toll, and 1 coin for the temple. Write down how much you have left and how it would feel as a farming family."},{"id":"hist-11","bible":"mat-11","bibleTitle":"The Twelve Are Sent Out","title":"Travel in the Roman World","era":"1st century AD","intro":"Jesus sent the Twelve out with almost nothing. Later, the apostles would carry the gospel across the Roman Empire. How did people travel in their world?","sections":[{"h":"All Roads Lead to Rome","p":["Romans were master road-builders. Their first great highway, the Appian Way, was begun in 312 BC. Eventually tens of thousands of miles of roads connected the empire. Engineers built them in layers of stone and gravel, with a curved surface so rain would drain off, and milestones marked the distances.","Roads were built mainly for moving soldiers, but merchants, messengers, and missionaries used them too. Most travelers walked, covering roughly 15 to 20 miles a day. Wealthier people rode donkeys or horses or traveled in carts. Travel by sea was faster but only safe in certain seasons."]},{"h":"Hospitality and Danger","p":["Inns existed but often had a bad reputation. Travelers relied heavily on hospitality, meaning being welcomed into people's homes. Jewish culture treated welcoming strangers as a sacred duty, going back to Abraham welcoming three visitors (Genesis 18).","That's why Jesus told the Twelve to find a worthy person in each town and stay there (Matthew 10:11). Travel was also dangerous. Robbers lurked on lonely roads, which is the setting of the Good Samaritan story. Jesus' warning about going out 'like sheep among wolves' reflected real risks."]},{"h":"Where the Apostles Went","p":["The New Testament tells us about some of the apostles' later travels, especially Peter and John. For others, we rely on early church traditions, which are harder to confirm. Traditions say Peter was martyred in Rome, John lived in Ephesus, Andrew preached in Greece, and Thomas traveled as far as India, where some Christians still trace their churches to him.","The Twelve came from different backgrounds. Matthew had worked for the Herod family's tax system, while Simon was called 'the Zealot,' a name linked with passionate devotion to God's law and, for some, a willingness to fight Rome. Jesus' band of disciples included people who might otherwise have been enemies."]}],"people":[{"name":"Simon the Zealot","role":"Apostle, possibly once part of a movement opposed to Rome"},{"name":"Thomas","role":"Apostle; early tradition says he preached in India"},{"name":"Appius Claudius","role":"Roman official who began the Appian Way in 312 BC"}],"source":{"title":"Oration to Rome","who":"Aelius Aristides, a Greek speaker","date":"About AD 155","text":"In a speech praising Rome, Aristides says the Romans have measured out the whole world, bridged rivers, cut roads through mountains, and filled deserts with rest stops, so that a traveler can go anywhere as if moving from one homeland to another.","note":"Paraphrased. This is flattery aimed at Rome, but it shows how people felt about the empire's network of roads. God used that network to spread the gospel."},"vocab":[["Appian Way","Rome's first great paved road, begun in 312 BC"],["Milestone","A stone marker showing distance along a road"],["Hospitality","Welcoming and caring for guests and strangers"],["Apostle","'Sent one': one of the twelve Jesus sent out"]],"map":{"view":"wide","places":["rome","jerusalem_w","antioch","ephesus","athens","alexandria"],"caption":"Roman roads and sea routes connected the cities where the apostles would later carry the gospel."},"timeline":[{"y":-312,"t":"The Appian Way is begun"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"About how far could a traveler walk in a day?","options":["2-3 miles","15-20 miles","60 miles","100 miles"],"answer":1,"why":"A good day's walk."},{"q":"When was the Appian Way begun?","options":["312 BC","AD 30","4 BC","AD 312"],"answer":0,"why":"It was Rome's first great road."},{"q":"Why were Roman roads built curved on top?","options":["For decoration","So rain would drain off","To slow horses","To mark borders"],"answer":1,"why":"Good drainage kept roads usable."},{"q":"Where does tradition say Thomas preached?","options":["Spain","India","Britain","Egypt"],"answer":1,"why":"Churches in India trace their roots to him."},{"q":"Why did travelers depend on hospitality?","options":["Inns were often unsafe or unpleasant","It was illegal to stay in inns","There were no towns","Romans required it"],"answer":0,"why":"Being welcomed into homes was safer."}],"assignment":"Using a map, measure the distance from Jerusalem to Rome by road. At 18 miles a day, how many days would it take to walk? Write a short travel plan listing three cities you'd pass through."},{"id":"hist-12","bible":"mat-12","bibleTitle":"Come to Me, All Who Are Tired","title":"The Sabbath and a Prison Fortress","era":"About AD 28-29","intro":"The Sabbath was one of the clearest marks of Jewish identity, so clear that enemies once used it against them. That history explains why Sabbath debates were so heated.","sections":[{"h":"A Day That Set Israel Apart","p":["The Sabbath ran from sunset Friday to sunset Saturday. Resting on the seventh day was part of the Ten Commandments, and in a world where most people worked every day they could, it made Jews stand out. Greek and Roman writers sometimes mocked it as laziness.","The Sabbath was taken so seriously that during the Maccabean revolt, a group of Jews refused to fight on the Sabbath and were killed without defending themselves (1 Maccabees 2). Afterward, Jewish leaders decided they could defend themselves if attacked. Josephus says that when Pompey besieged Jerusalem in 63 BC, his soldiers built their siege works on Sabbaths, when the defenders wouldn't attack them."]},{"h":"Building a Fence Around the Law","p":["The Bible says not to work on the Sabbath, but what counts as work? Teachers developed detailed rules to 'build a fence around the law' so no one would accidentally break it. Later, the Mishnah listed 39 main categories of forbidden work, including sowing, reaping, threshing, winnowing, baking, and writing two letters.","So when Jesus' hungry disciples picked grain and rubbed it in their hands (Matthew 12:1), some Pharisees saw it as reaping and threshing. A 'Sabbath day's journey' was limited to about 2,000 cubits, roughly two-thirds of a mile. Jesus didn't reject the Sabbath. He challenged rules that got in the way of mercy, and claimed to be 'Lord of the Sabbath.'"]},{"h":"John in Prison at Machaerus","p":["In Matthew 11, John the Baptist sends messengers from prison. Josephus tells us where: Machaerus, a fortress-palace built by Herod the Great on a mountaintop east of the Dead Sea, in Perea, which Herod Antipas ruled.","Archaeologists have excavated Machaerus, finding a palace courtyard, baths, and a steep, isolated site where escape was impossible. From there, John could look across the Dead Sea toward the land where he had preached."]}],"people":[{"name":"Judah Maccabee","role":"Leader of the Jewish revolt against Greek rule beginning in 167 BC"},{"name":"John the Baptist","role":"Imprisoned by Herod Antipas at Machaerus"}],"source":{"title":"The Mishnah, Shabbat 7:2","who":"Jewish rabbis","date":"Written down about AD 200","text":"The Mishnah lists the main kinds of work forbidden on the Sabbath, including sowing, plowing, reaping, binding sheaves, threshing, winnowing, sorting, grinding, sifting, kneading, and baking, as well as work with wool, animals, writing, building, lighting and putting out fire, and carrying things from one place to another. It counts 39 in all.","note":"Paraphrased. These rules were written down after Jesus' time, but many were already being discussed in his day. Look at how many of them relate to food and farming."},"vocab":[["Sabbath","The seventh day (Saturday), a day of rest from sunset Friday to sunset Saturday"],["Maccabees","Jewish family that led a revolt against Greek rulers in 167 BC"],["Sabbath day's journey","About 2,000 cubits (two-thirds of a mile), the distance allowed on the Sabbath"],["Yoke","A wooden beam joining two animals, also used as a picture for a teacher's instruction"]],"map":{"view":"local","places":["machaerus","jerusalem","capernaum","qumran"],"caption":"Machaerus, where John was imprisoned, stood on a mountaintop east of the Dead Sea."},"timeline":[{"y":-167,"t":"The Maccabean revolt begins"}],"video":[["Drive Thru History: Jesus Teaches With Authority","https://watch.tbn.org/s/Q9aSuuiu?e=GcAR88FY"]],"quiz":[{"q":"When did the Sabbath begin?","options":["Saturday morning","Sunset on Friday","Sunday morning","Midnight Saturday"],"answer":1,"why":"Jewish days began at sunset."},{"q":"How did Pompey use the Sabbath against Jerusalem?","options":["He attacked at night","His soldiers built siege works on Sabbaths","He banned it","He moved it to Sunday"],"answer":1,"why":"Defenders wouldn't attack on the Sabbath."},{"q":"How many categories of work did the Mishnah forbid?","options":["7","10","39","613"],"answer":2,"why":"39 main categories."},{"q":"Why did some Pharisees object when the disciples picked grain?","options":["It was stealing","They saw it as reaping and threshing","Grain was unclean","It was a fast day"],"answer":1,"why":"Those were forbidden kinds of work."},{"q":"Where was John the Baptist imprisoned?","options":["Jerusalem","Machaerus","Rome","Capernaum"],"answer":1,"why":"Josephus names the fortress."}],"assignment":"Plan a family Sabbath afternoon: a few hours of rest, worship, and time together. Afterward, write a paragraph on what it was like and what Jesus meant when he said the Sabbath was made for people."},{"id":"hist-13","bible":"mat-13","bibleTitle":"Stories About the Kingdom","title":"Farming in Galilee","era":"Timeless, and a 3,000-year-old calendar","intro":"Most of Jesus' listeners were farmers. His parables about seeds, soil, weeds, and harvests came straight from their daily lives.","sections":[{"h":"The Farming Year","p":["Israel has two seasons: a rainy winter and a dry summer. The 'early rains' come around October and November, softening the ground for plowing and sowing. The 'latter rains' in March and April help the grain ripen.","Barley was harvested around Passover (spring) and wheat around Pentecost (early summer). Summer and early fall brought figs, grapes, and pomegranates, and olives were harvested in the fall. The Bible's 'seven species' of the land were wheat, barley, grapes, figs, pomegranates, olives, and date honey (Deuteronomy 8:8)."]},{"h":"The Sower's Field","p":["Farmers scattered seed by hand, a method called broadcasting. Seed naturally landed everywhere: on footpaths packed hard by travelers, on thin soil over limestone bedrock (the 'rocky ground'), among thorny weeds, and on good soil.","A normal harvest might return several times the seed that was sown. Many historians think a yield of thirty, sixty, or a hundred times was astonishing to Jesus' listeners. His point: when God's word takes root, the results go far beyond anything expected."]},{"h":"Mustard Seeds and Yeast","p":["The mustard plant grows from a tiny seed into a shrub that can reach 10 feet or more by the Sea of Galilee, big enough for birds to perch in. Yeast in Jesus' day wasn't bought in packets. Women saved a lump of old, fermented dough and mixed it into new flour, where it spread through the whole batch.","Both parables show something small and hidden that grows and spreads until it fills everything, just as the kingdom of God began with a small band of disciples in Galilee and spread across the world."]}],"people":[{"name":"R. A. S. Macalister","role":"Archaeologist who found the Gezer Calendar in 1908"}],"source":{"title":"The Gezer Calendar","who":"An unknown writer, possibly a student practicing writing","date":"About the 10th century BC","text":"This small limestone tablet lists the farming year month by month: two months of harvesting olives, two months of planting grain, two months of late planting, a month of cutting flax, a month of harvesting barley, a month of harvesting wheat and measuring grain, two months of pruning vines, and a month of summer fruit.","note":"Paraphrased. It is one of the oldest known Hebrew inscriptions, written around the time of King Solomon. Farmers in Jesus' day followed nearly the same yearly rhythm."},"vocab":[["Broadcasting","Scattering seed by hand over a field"],["Early and latter rains","Autumn rains for planting and spring rains for ripening"],["Seven species","Seven crops that represent the land of Israel (Deut. 8:8)"],["Leaven","Fermented dough saved to make new bread rise"]],"map":{"view":"local","places":["capernaum","magdala","nazareth","tabor"],"caption":"Jesus told his parables from a boat near the fertile Plain of Gennesaret, between Capernaum and Magdala."},"timeline":[{"y":-950,"t":"The Gezer Calendar is written (about 10th century BC)"},{"y":1908,"t":"The Gezer Calendar is discovered","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"When were the 'early rains'?","options":["October-November","June-July","January","August"],"answer":0,"why":"They softened ground for sowing."},{"q":"Around which feast was barley harvested?","options":["Hanukkah","Passover","Tabernacles","Purim"],"answer":1,"why":"Barley ripened in spring."},{"q":"What is 'rocky ground' in Israel?","options":["Fields full of pebbles","Thin soil over limestone bedrock","Mountains","Riverbeds"],"answer":1,"why":"Roots can't grow deep."},{"q":"How did people make bread rise?","options":["Store-bought yeast","Mixing in old fermented dough","Baking soda","Eggs"],"answer":1,"why":"Leaven was saved from earlier batches."},{"q":"What is the Gezer Calendar?","options":["A Roman coin","An ancient Hebrew farming calendar","A temple list","A scroll of Isaiah"],"answer":1,"why":"One of the oldest Hebrew inscriptions."}],"assignment":"Plant a few seeds in four cups: packed dirt, a thin layer of soil over rocks, soil with 'weeds' (grass or clippings), and good soil. Observe for two weeks and keep a log comparing them to the Parable of the Sower."},{"id":"hist-14","bible":"mat-14","bibleTitle":"Five Loaves and Walking on Water","title":"Herod Antipas and the Death of John","era":"About AD 29-39","intro":"Matthew 14 opens with a king's birthday party that ends in murder. Josephus tells us more about Herod Antipas, and how many people saw his later downfall as God's judgment.","sections":[{"h":"The 'Fox' of Galilee","p":["Herod Antipas ruled Galilee and Perea from 4 BC to AD 39. He was called 'tetrarch,' but people often called him 'king.' Jesus called him 'that fox' (Luke 13:32), a sly and destructive schemer.","Antipas was first married to the daughter of Aretas IV, king of the Nabataeans, the Arab kingdom whose capital was Petra. But he fell for Herodias, who was married to his half-brother, and the two divorced their spouses to marry each other. John the Baptist publicly said this was against God's law."]},{"h":"Two Accounts of John's Death","p":["The Gospels say Herodias hated John, and her daughter's dance at Antipas' birthday led to John's beheading. Josephus doesn't mention the dance, but he names Herodias' daughter as Salome, and he says Antipas executed John at Machaerus because he feared John's influence over the crowds might lead to a rebellion.","The two accounts fit together: a ruler nervous about John's popularity, pushed by a resentful wife, trapped by a foolish promise in front of important guests. Both show John as a man the people deeply respected."]},{"h":"Downfall, and the Fourth Watch","p":["Aretas never forgave Antipas for divorcing his daughter. In AD 36 his army crushed Antipas' forces. Josephus reports that many Jews believed the defeat was God's punishment for killing John. In AD 39, the emperor Caligula banished Antipas to Gaul (modern France), and Herodias went with him.","That same chapter ends with Jesus walking on the water 'shortly before dawn,' literally 'in the fourth watch of the night.' Romans divided the night into four watches of about three hours each. The fourth watch ran from about 3 to 6 a.m., after the disciples had been rowing against the wind most of the night."]}],"people":[{"name":"Herod Antipas","role":"Ruler of Galilee and Perea, 4 BC to AD 39; executed John the Baptist"},{"name":"Herodias","role":"Antipas' second wife, formerly married to his half-brother"},{"name":"Aretas IV","role":"King of the Nabataeans; defeated Antipas in AD 36"},{"name":"Caligula","role":"Roman emperor who exiled Antipas in AD 39"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus writes that some of the Jews thought the destruction of Herod's army came from God, and that it was a very just punishment for what Herod had done to John, called the Baptist. He describes John as a good man who urged the Jews to live righteously toward each other and devoutly toward God, and to come to baptism.","note":"Paraphrased. This passage is one of the strongest pieces of evidence outside the Bible for John the Baptist. Josephus was not a Christian, so he had no reason to invent it."},"vocab":[["Nabataeans","An Arab kingdom east and south of Judea, with its capital at Petra"],["Exile","Being forced to leave your homeland"],["Watch","One of four parts of the night used by Roman soldiers for guard duty"],["Perea","Region east of the Jordan River, ruled by Antipas"]],"map":{"view":"local","places":["machaerus","tiberias","bethsaida","capernaum"],"caption":"Antipas' capital was Tiberias in Galilee; John was executed at Machaerus in Perea. The feeding of the 5,000 happened near Bethsaida."},"timeline":[{"y":36,"t":"King Aretas IV defeats Herod Antipas"},{"y":39,"t":"Emperor Caligula exiles Herod Antipas to Gaul"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What did Jesus call Herod Antipas?","options":["That lion","That fox","That wolf","That snake"],"answer":1,"why":"Luke 13:32."},{"q":"Why did John the Baptist criticize Antipas?","options":["For raising taxes","For marrying his half-brother's wife","For building Tiberias","For worshiping idols"],"answer":1,"why":"John said the marriage broke God's law."},{"q":"What name does Josephus give Herodias' daughter?","options":["Mariamne","Salome","Bernice","Drusilla"],"answer":1,"why":"Josephus names her Salome."},{"q":"What did many Jews believe about Antipas' defeat in AD 36?","options":["It was bad luck","It was God's punishment for killing John","Rome caused it","It never happened"],"answer":1,"why":"Josephus reports this belief."},{"q":"What time was the 'fourth watch'?","options":["6-9 p.m.","9 p.m.-midnight","Midnight-3 a.m.","3-6 a.m."],"answer":3,"why":"Just before dawn."}],"assignment":"Read Matthew 14:1-12, then reread the Josephus source above. Write a paragraph comparing the two accounts: what do they agree on, what does each add, and why is it valuable to have a non-Christian source?"},{"id":"hist-15","bible":"mat-15","bibleTitle":"What Makes a Person Unclean, and a Mother's Great Faith","title":"Tyre, Sidon, and the Gentiles","era":"332 BC to 1st century AD","intro":"Jesus traveled to Tyre and Sidon, famous seafaring cities, and met a Canaanite mother there. To understand why this meeting was so surprising, we need to understand how Jews and Gentiles related to each other.","sections":[{"h":"The Phoenician Cities","p":["Tyre and Sidon were ancient cities of the Phoenicians, a people of sailors and traders who founded colonies across the Mediterranean, including Carthage. They are often credited with spreading the alphabet. The Greek alphabet, and later our own, grew out of Phoenician letters.","Tyre was famous for purple dye made from murex sea snails. It took thousands of snails to produce a tiny amount of dye, so purple cloth was incredibly expensive and became the color of kings and emperors. Tyre was once an island fortress, but Alexander the Great captured it in 332 BC after a seven-month siege by building a causeway out to it."]},{"h":"Jews and Gentiles","p":["Gentiles were non-Jews. Jewish law made careful distinctions between clean and unclean foods and practices, and many Jews avoided eating with Gentiles or entering their homes. Some Jewish traditions went further, requiring special ritual handwashing before meals, which is the tradition the Pharisees raised with Jesus in Matthew 15.","Matthew calls the woman a 'Canaanite,' using the ancient name of Israel's old enemies. Mark calls her a 'Syrophoenician.' Matthew's choice of word underlines the shock: even a descendant of Israel's ancient foes could receive God's mercy through faith."]},{"h":"A Wall in the Temple","p":["In Herod's temple, Gentiles could enter the large outer court (the Court of the Gentiles), but a stone barrier kept them from going farther in. Warning signs in Greek and Latin were posted along it, threatening death to any foreigner who crossed.","A complete warning stone was discovered in Jerusalem in 1871, and a fragment of another in 1935. When Paul later wrote that Christ 'has destroyed the barrier, the dividing wall of hostility' between Jews and Gentiles (Ephesians 2:14), his readers may well have pictured this very wall."]}],"people":[{"name":"Alexander the Great","role":"Greek-Macedonian conqueror who captured Tyre in 332 BC"},{"name":"Charles Clermont-Ganneau","role":"French archaeologist who found the temple warning inscription in 1871"}],"source":{"titl
