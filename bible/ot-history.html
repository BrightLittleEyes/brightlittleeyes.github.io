find them?","options":["A 13-year-old volunteer","A shepherd","A soldier","A king"],"answer":0,"why":"Along with Gabriel Barkay's team."},{"q":"How long did it take to unroll them?","options":["One day","Three years","Ten years","They were never unrolled"],"answer":1,"why":"They were extremely fragile."},{"q":"About how old are they?","options":["2,600 years (about 600 BC)","200 years","5,000 years","1,000 years"],"answer":0,"why":"The oldest known Bible text."},{"q":"How were the scrolls probably used?","options":["Read in the temple","Worn as amulets","Sold in the market","Buried with kings"],"answer":1,"why":"Carrying God's blessing."}],"assignment":"Memorize Numbers 6:24-26. Write it out beautifully on a small card or scroll, and give it to someone as a blessing this week."},{"id":"exh-16","bible":"exo-16","bibleTitle":"The Golden Calf","title":"Bull Gods and a Silver Calf","era":"About 1600-900 BC","intro":"Why a calf? In the ancient world, bulls and calves stood for strength and fertility, and many peoples connected them with their gods. In 1990, archaeologists found a small silver-plated calf at Ashkelon, still inside its clay shrine.","sections":[{"h":"Bulls in Egypt and Canaan","p":["In Egypt, the Apis bull was worshiped at Memphis as a living god, and the goddess Hathor was often shown as a cow. In Canaan, the chief god El was sometimes called 'Bull El,' and the storm god Baal was shown standing on a bull.","So when the Israelites asked Aaron to make a god, a calf was the kind of image they had seen all their lives. Aaron even declared 'a festival to the LORD' (Exodus 32:5), trying to worship the true God using a pagan image. That was exactly what the second commandment forbade."]},{"h":"The Ashkelon Calf","p":["In 1990, a Harvard team led by Lawrence Stager was excavating Ashkelon, an ancient city on Canaan's coast. In the ruins of a gate area from about 1600 BC, they found a small clay shrine shaped like a beehive. Inside was a bronze calf, about 4 inches long, once covered with silver.","It's the kind of small idol a Canaanite family or town might have worshiped. It gives us a real picture of what Israel's neighbors made, and what God warned his people not to copy."]},{"h":"Jeroboam's Golden Calves","p":["The golden calf didn't end at Sinai. Around 930 BC, after Israel split into two kingdoms, King Jeroboam of the northern kingdom made two golden calves and set them up at Bethel and Dan, saying almost the same words as at Sinai: 'Here are your gods, Israel, who brought you up out of Egypt' (1 Kings 12:28).","Archaeologists excavating Tel Dan since 1966, led by Avraham Biran, uncovered a large platform and altar area that many identify as Jeroboam's worship site. The prophets condemned these calves again and again (Hosea 8:5-6)."]}],"people":[{"name":"Aaron","role":"Made the golden calf when the people demanded it"},{"name":"Jeroboam I","role":"First king of northern Israel, who set up calves at Bethel and Dan"},{"name":"Lawrence Stager","role":"Harvard archaeologist whose team found the Ashkelon calf in 1990"}],"source":{"title":"The Silver Calf of Ashkelon","who":"Canaanite metalworkers","date":"About 1600 BC; found in 1990","text":"A bronze calf about 4 inches long and tall, originally covered in silver, found inside a beehive-shaped clay shrine in the ruins near Ashkelon's city gate.","note":"Described. The calf is displayed at the Israel Museum. It's much older than the Exodus, showing that calf images had been part of Canaanite religion for centuries."},"vocab":[["Idol","An image or object worshiped as a god"],["Fertility","The ability to produce children, crops, or animals"],["Shrine","A small place or container for worship"],["Northern kingdom","Israel, the ten tribes after the kingdom split around 930 BC"]],"map":{"view":"local","places":["ashkelon","bethel","dan"],"caption":"The silver calf was found at Ashkelon on the coast. Centuries later, Jeroboam set up golden calves at Bethel and Dan."},"timeline":[{"y":-1600,"t":"The silver calf of Ashkelon is made (about 1600 BC)"},{"y":-930,"t":"Jeroboam sets up golden calves at Bethel and Dan (about 930 BC)"},{"y":1990,"t":"The Ashkelon calf is discovered","d":true}],"video":[],"quiz":[{"q":"Which Egyptian bull was worshiped as a living god?","options":["Ra","Apis","Hathor","Amun"],"answer":1,"why":"At Memphis."},{"q":"What did Aaron call the calf festival?","options":["A festival to Apis","A festival to the LORD","A festival to Baal","A harvest festival"],"answer":1,"why":"Mixing true worship with an idol."},{"q":"Where was a silver calf found in 1990?","options":["Jerusalem","Ashkelon","Egypt","Sinai"],"answer":1,"why":"Inside a clay shrine."},{"q":"Where did Jeroboam set up golden calves?","options":["Jerusalem and Hebron","Bethel and Dan","Egypt and Sinai","Shechem and Jericho"],"answer":1,"why":"1 Kings 12:29."},{"q":"What did Jeroboam say about his calves?","options":["They are only statues","Here are your gods who brought you out of Egypt","Worship Baal","Nothing"],"answer":1,"why":"Almost the same words as at Sinai."}],"assignment":"Read Exodus 32:4 and 1 Kings 12:28 side by side. Write a paragraph about why people might keep repeating the same mistake, and what 'golden calves' tempt people today."},{"id":"exh-17","bible":"exo-17","bibleTitle":"Show Me Your Glory","title":"Moses' Shining Face and the Horns Mistake","era":"About AD 400 to 1515","intro":"When Moses came down from Sinai, his face was shining. But for about a thousand years, many Christians in Europe pictured Moses with horns! The reason is a fascinating lesson in how translation works.","sections":[{"h":"A Tricky Hebrew Word","p":["Exodus 34:29 says the skin of Moses' face qaran. The Hebrew root q-r-n is related to the word for 'horn' (qeren), but in this verse it most likely means 'sent out rays' or 'shone.' Rays of light spreading out can look like horns, and ancient languages sometimes used the same word for both.","The Greek translation of the Old Testament (the Septuagint), made around 250 BC, translated it as 'glorified.' That's the meaning Paul uses in 2 Corinthians 3:7, where he mentions 'the glory of his face.'"]},{"h":"Jerome's Vulgate","p":["Around AD 400, a scholar named Jerome translated the Bible into Latin, the common language of the western Roman Empire. His translation, called the Vulgate, became the standard Bible in Western Europe for over a thousand years.","For Exodus 34:29, Jerome wrote that Moses' face was cornuta, 'horned.' Jerome knew Hebrew well and may have meant it as a picture of glory, since horns were a symbol of power in the ancient world. But many later readers took it literally."]},{"h":"Michelangelo's Moses","p":["Because of the Vulgate, artists in medieval and Renaissance Europe often showed Moses with small horns. The most famous example is Michelangelo's great marble statue of Moses, finished around 1515 for the tomb of Pope Julius II in Rome. It shows Moses seated, holding the tablets, with two small horns on his head.","Modern translations say Moses' face was 'radiant' or 'shone.' The story shows why careful study of the original languages matters, and why good translations compare many sources."]}],"people":[{"name":"Jerome","role":"Scholar (about AD 347-420) who translated the Bible into Latin (the Vulgate)"},{"name":"Michelangelo","role":"Italian artist who carved a famous statue of Moses around 1515"},{"name":"Moses","role":"Met with God on Sinai; his face shone afterward"}],"source":{"title":"The Latin Vulgate, Exodus 34:29","who":"Jerome","date":"About AD 400","text":"Jerome's Latin reads that when Moses came down from Mount Sinai holding the two tablets, he did not know that his face was 'horned' (cornuta) from speaking with the Lord.","note":"Translated. Compare your own Bible's translation of Exodus 34:29. The difference comes from how one Hebrew word was understood."},"vocab":[["Translation","Putting words from one language into another"],["Vulgate","Jerome's Latin Bible, used in Western Europe for over a thousand years"],["Septuagint","The ancient Greek translation of the Old Testament"],["Radiant","Shining with light"]],"map":{"view":"ane","places":["alexandria_a","jerusalem_a"],"caption":"The Septuagint was translated in Alexandria, Egypt. Jerome made his Latin translation in Bethlehem, near Jerusalem. (Michelangelo's Moses stands far to the west, in Rome.)"},"timeline":[{"y":-250,"t":"The Septuagint (Greek Old Testament) is translated in Alexandria (about 250 BC)"},{"y":400,"t":"Jerome completes the Latin Vulgate (about AD 400)"},{"y":1515,"t":"Michelangelo carves his statue of Moses with horns (about 1515)"}],"video":[],"quiz":[{"q":"What does the Hebrew word in Exodus 34:29 most likely mean?","options":["Grew horns","Sent out rays or shone","Turned red","Became old"],"answer":1,"why":"Related to the word for horn."},{"q":"Who translated the Bible into Latin around AD 400?","options":["Josephus","Jerome","Michelangelo","Paul"],"answer":1,"why":"The Vulgate."},{"q":"What Latin word did Jerome use?","options":["Radiant","Cornuta (horned)","Gloria","Lux"],"answer":1,"why":"Many readers took it literally."},{"q":"Who carved a famous statue of Moses with horns?","options":["Leonardo da Vinci","Michelangelo","Raphael","Rembrandt"],"answer":1,"why":"Around 1515 in Rome."},{"q":"What does this story teach about translation?","options":["Translations are useless","Careful study of the original languages matters","Latin is best","Horns are real"],"answer":1,"why":"Good translations compare sources."}],"assignment":"Look up a picture of Michelangelo's Moses. Then compare Exodus 34:29 in three different English translations (you can use an online Bible). Write a paragraph about what you learned about translation."},{"id":"exh-18","bible":"exo-18","bibleTitle":"The Glory Fills the Tabernacle","title":"From Tabernacle to Temple: Shiloh and Arad","era":"About 1400-700 BC","intro":"After Israel entered Canaan, the tabernacle was set up at Shiloh, where it stood for generations. Later, a small temple at Arad in the Negev had a layout that echoes the tabernacle's design.","sections":[{"h":"The Tabernacle at Shiloh","p":["Joshua 18:1 says the whole assembly of Israel gathered at Shiloh and set up the tent of meeting there. Shiloh stood in the hill country north of Jerusalem, and it remained Israel's worship center through the time of the judges. Young Samuel served there under the priest Eli (1 Samuel 1-3).","Archaeologists have excavated Shiloh several times, including in the 1980s under Israel Finkelstein and more recently by a team led by Scott Stripling. They have found large storage buildings, animal bones from sacrifices, and evidence that the town was destroyed around the time the Philistines captured the ark (1 Samuel 4)."]},{"h":"The Temple at Arad","p":["Arad was a royal fortress in the Negev desert of Judah. In the 1960s, archaeologist Yohanan Aharoni found a small temple inside it from the 800s-700s BC. It had a courtyard with an altar for burnt offerings made of earth and uncut stones, just as Exodus 20:25 required, a main hall, and a small raised inner room like a holy of holies.","In the inner room stood a standing stone, and at its entrance were two small stone altars. In 2020, scientists tested residue on the altars and found traces of burned incense, including frankincense, which Exodus 30 describes for the incense altar. Writings on pottery found at Arad mention 'the house of YHWH,' probably meaning the temple in Jerusalem."]},{"h":"One Place of Worship","p":["God's law said sacrifices should be offered at the place he would choose (Deuteronomy 12). Eventually that place was Solomon's temple in Jerusalem. Many scholars think the Arad temple was shut down during the reforms of King Hezekiah or King Josiah, who removed worship sites outside Jerusalem.","From Sinai to Shiloh to Jerusalem, God kept his promise to dwell among his people. John 1:14 says that in Jesus, 'the Word became flesh and made his dwelling among us,' and Revelation 21:3 promises that one day God will dwell with his people forever."]}],"people":[{"name":"Eli and Samuel","role":"Priest and young prophet who served at the tabernacle in Shiloh"},{"name":"Yohanan Aharoni","role":"Israeli archaeologist who excavated Arad in the 1960s"},{"name":"King Hezekiah","role":"King of Judah who removed worship sites outside Jerusalem"}],"source":{"title":"An Arad Ostracon (inscribed pottery shard)","who":"An officer writing to the commander Eliashib at Arad","date":"About 600 BC","text":"One letter written in ink on a piece of pottery, sent to Eliashib, commander of the Arad fortress, includes greetings and instructions and mentions 'the house of YHWH,' saying a certain man 'is staying in the house of YHWH.'","note":"Paraphrased. Letters on pottery shards, called ostraca, give us everyday messages from ancient Judah, and this one mentions the LORD's temple."},"vocab":[["Shiloh","Israel's worship center with the tabernacle during the judges"],["Ostracon (plural ostraca)","A piece of broken pottery used for writing"],["Holy of holies","The innermost, most sacred room of a sanctuary"],["Reform","A change to correct wrong practices"]],"map":{"view":"local","places":["shiloh","jerusalem","arad"],"caption":"The tabernacle stood at Shiloh for generations. Arad's temple was in the Negev, south of Hebron."},"timeline":[{"y":-1050,"t":"The Philistines capture the ark; Shiloh is destroyed (about 1050 BC)"},{"y":-700,"t":"The Arad temple is shut down, likely in a royal reform (about 700 BC)"},{"y":1962,"t":"Yohanan Aharoni begins excavating Arad","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 2)","https://watch.tbn.org/s/83iA4eRN?e=8Tqdqvqx"]],"quiz":[{"q":"Where was the tabernacle set up after Israel entered Canaan?","options":["Jericho","Shiloh","Hebron","Bethlehem"],"answer":1,"why":"Joshua 18:1."},{"q":"Who served at Shiloh as a boy?","options":["David","Samuel","Joseph","Daniel"],"answer":1,"why":"Under Eli the priest."},{"q":"What was found on one of the Arad temple's small altars?","options":["Gold","Traces of burned frankincense","Scrolls","Nothing"],"answer":1,"why":"Tested by scientists."},{"q":"What is an ostracon?","options":["A bird","A piece of pottery used for writing","A priest's robe","A coin"],"answer":1,"why":"Plural: ostraca."},{"q":"What does John 1:14 say about Jesus?","options":["He built a temple","He made his dwelling among us","He destroyed the tabernacle","He lived in Shiloh"],"answer":1,"why":"God dwelling with his people."}],"assignment":"Final project for Exodus: Make a timeline or poster showing God's dwelling with his people: Eden, the burning bush, Sinai, the tabernacle, Shiloh, Solomon's temple, Jesus (John 1:14), and the promise of Revelation 21:3."}],"lessons/genesis.json":[{"id":"ohist-01","bible":"gen-01","bibleTitle":"In the Beginning","title":"How the Ancient World Told the Creation Story","era":"The ancient Near East","intro":"Genesis wasn't the only ancient account of how the world began. Babylon and Egypt had their own stories. Comparing them shows how different, and how surprising, Genesis 1 really is.","sections":[{"h":"The Babylonian Story: Enuma Elish","p":["In the 1840s and 1850s, British explorers digging at Nineveh (in modern Iraq) uncovered the library of Ashurbanipal, an Assyrian king. It held tens of thousands of clay tablets written in cuneiform, a wedge-shaped script pressed into clay. Among them was a creation story now called the Enuma Elish, from its first words, 'When on high.'","In it, the world begins with a watery chaos goddess named Tiamat. The gods fight a violent war, and the god Marduk kills Tiamat and splits her body in two to make the sky and the earth. Then the gods create humans out of the blood of a defeated god, so that people can do the hard work and the gods can rest."]},{"h":"Egypt's Creation Stories","p":["Egypt had several creation stories. In one, a mound of land rises out of the waters and the sun god appears on it. In another, from the city of Memphis, the god Ptah creates by thinking and then speaking the world into being.","In Egypt, the sun, the moon, the Nile, and even Pharaoh were treated as gods or divine. People built their whole lives around keeping these powers happy."]},{"h":"What Makes Genesis Different","p":["Genesis shares some features with these stories, like waters at the beginning and creation by speaking. But its message is completely different. There is one God, not a crowd of gods. He doesn't fight to create; he simply speaks, and it happens. The sun and moon aren't even named in Genesis 1. They're called 'the greater light' and 'the lesser light,' lamps God hung in the sky, not gods to be worshiped.","Most striking of all: in Babylon, people were made to be slaves of the gods. In Genesis, every human being, man and woman, is made in God's image, blessed, and given the honor of caring for his world. Christians hold different views about how to read the days of Genesis 1, but all agree on this: God alone is Creator, and people are made to reflect him."]}],"people":[{"name":"Ashurbanipal","role":"Assyrian king who collected a huge library of clay tablets at Nineveh"},{"name":"Austen Henry Layard","role":"British explorer who dug at Nineveh in the 1840s-50s"},{"name":"George Smith","role":"British Museum scholar who published the Babylonian creation tablets in the 1870s"}],"source":{"title":"Enuma Elish, Tablet 6","who":"Babylonian scribes","date":"Copies found in Ashurbanipal's library","text":"Marduk announces that he will create a human being, and that this human will be charged with the service of the gods so that the gods may be at rest.","note":"Paraphrased. Compare this with Genesis 1:26-28, where God creates people in his own image and blesses them. In one story humans are slaves; in the other, they are honored image-bearers."},"vocab":[["Cuneiform","Wedge-shaped writing pressed into clay tablets, used in Mesopotamia"],["Tablet","A flat piece of clay used for writing"],["Polytheism","Belief in many gods"],["Monotheism","Belief in one God"]],"map":{"view":"ane","places":["nineveh","babylon","memphis"],"caption":"Creation stories were told in Babylon and Nineveh in Mesopotamia and in Memphis in Egypt."},"timeline":[{"y":1849,"t":"Ashurbanipal's library begins to be uncovered at Nineveh","d":true}],"video":[],"quiz":[{"q":"What is cuneiform?","options":["Egyptian picture writing","Wedge-shaped writing on clay","Hebrew letters","Greek poetry"],"answer":1,"why":"It was pressed into clay with a reed."},{"q":"In the Enuma Elish, why were humans created?","options":["To rule the world","To do the gods' work so the gods could rest","To be God's image","By accident"],"answer":1,"why":"Humans were made as servants of the gods."},{"q":"What does Genesis 1 call the sun and moon?","options":["Gods","The greater light and the lesser light","Marduk and Tiamat","Ra and Thoth"],"answer":1,"why":"They are lights God made, not gods."},{"q":"Where was Ashurbanipal's library found?","options":["Babylon","Nineveh","Memphis","Jerusalem"],"answer":1,"why":"At Nineveh, in modern Iraq."},{"q":"What do all Christians agree Genesis 1 teaches?","options":["The exact age of the earth","God alone is Creator and people bear his image","The sun is a god","There were many creators"],"answer":1,"why":"Views differ on details, but not on this."}],"assignment":"Make a two-column chart comparing the Enuma Elish and Genesis 1: number of gods, how creation happens, what the sun and moon are, and why people were made. Then write a paragraph on which difference surprised you most."},{"id":"ohist-02","bible":"gen-02","bibleTitle":"The Garden of Eden","title":"Rivers, Gardens, and the Fertile Crescent","era":"The ancient Near East","intro":"Genesis 2 names four rivers that flowed out of Eden. Two of them, the Tigris and the Euphrates, still flow today, through the region where some of the world's first cities grew up.","sections":[{"h":"The Land Between the Rivers","p":["Genesis 2:14 names the Tigris and the Euphrates. These two rivers flow from the mountains of modern Turkey down through Syria and Iraq to the Persian Gulf. The Greeks called the land between them Mesopotamia, which means 'between the rivers.' The other two rivers, the Pishon and Gihon, haven't been identified for certain, and scholars have many suggestions.","Mesopotamia gets very little rain, but its rivers made farming possible. People dug canals to carry river water to their fields, a method called irrigation. With plenty of food, villages grew into cities, and cities needed writing, laws, and leaders."]},{"h":"The Fertile Crescent","p":["In 1916, an American historian named James Henry Breasted gave this region a name that stuck: the Fertile Crescent. On a map, the good farmland forms an arc, like a crescent moon, from the Persian Gulf up through Mesopotamia, across Syria, and down through Canaan toward Egypt.","Much of the Bible's story in Genesis happens along this crescent: from Eden's rivers, to Ur, to Harran, to Canaan, and finally down to Egypt."]},{"h":"Royal Gardens and 'Paradise'","p":["In the ancient Near East, kings planted beautiful gardens full of trees, water channels, and animals to show their wealth and power. The Persians called an enclosed garden a pairidaeza. The Greeks borrowed the word as paradeisos, and that's where our English word 'paradise' comes from. Greek translations of Genesis used it for the Garden of Eden.","Eden, then, is pictured as the Great King's garden, where God himself walked with the people he made. Adam's job to 'work it and take care of it' uses words later used for priests serving in God's tabernacle."]}],"people":[{"name":"James Henry Breasted","role":"American historian who named the 'Fertile Crescent' in 1916"}],"source":{"title":"Enki and Ninhursag","who":"Sumerian poets","date":"Copies on ancient clay tablets","text":"This Sumerian poem describes a pure, bright land called Dilmun, where the lion does not kill, the wolf does not snatch the lamb, no one says 'my eye hurts' or 'my head hurts,' and no one grows old.","note":"Paraphrased. Many ancient peoples remembered or imagined a perfect place without sickness or death. Genesis tells of a real garden where people lived with God before sin entered the world, and the prophets later describe a future like it (Isaiah 11:6-9)."},"vocab":[["Mesopotamia","Greek for 'between the rivers': the land of the Tigris and Euphrates"],["Irrigation","Bringing water to fields through canals or ditches"],["Fertile Crescent","The arc of good farmland from Mesopotamia to Egypt"],["Paradise","From a Persian word for an enclosed royal garden"]],"map":{"view":"ane","places":["ur","babylon","nineveh","harran","memphis"],"caption":"The Tigris and Euphrates flow through Mesopotamia. The Fertile Crescent arcs from there through Canaan to Egypt's Nile."},"timeline":[{"y":1916,"t":"James Henry Breasted names the 'Fertile Crescent'","d":true}],"video":[],"quiz":[{"q":"Which two rivers of Eden still flow today?","options":["Nile and Jordan","Tigris and Euphrates","Pishon and Gihon","Amazon and Nile"],"answer":1,"why":"Genesis 2:14 names them."},{"q":"What does Mesopotamia mean?","options":["Land of kings","Between the rivers","Garden of God","Desert land"],"answer":1,"why":"Greek for 'between the rivers.'"},{"q":"What is irrigation?","options":["Planting trees","Bringing water to fields through canals","Harvesting grain","Building cities"],"answer":1,"why":"It made farming possible with little rain."},{"q":"Where does the word 'paradise' come from?","options":["Latin for heaven","A Persian word for an enclosed garden","Hebrew for river","Egyptian for sun"],"answer":1,"why":"Pairidaeza became the Greek paradeisos."},{"q":"Who named the Fertile Crescent?","options":["Moses","James Henry Breasted","George Smith","Herodotus"],"answer":1,"why":"In 1916."}],"assignment":"Draw a map of the Fertile Crescent. Label the Tigris, Euphrates, and Nile rivers, the Persian Gulf, the Mediterranean (Great) Sea, Mesopotamia, Canaan, and Egypt. Shade the crescent of good farmland."},{"id":"ohist-03","bible":"gen-03","bibleTitle":"The First Sin","title":"Serpents and Guardians in the Ancient World","era":"The ancient Near East","intro":"When Genesis 3 describes a crafty serpent and cherubim guarding Eden, ancient readers pictured things they knew well. Snakes and winged guardians appear all over the art and stories of Egypt and Mesopotamia.","sections":[{"h":"The Serpent in Ancient Eyes","p":["Serpents meant different things across the ancient world. In Egypt, a rearing cobra called the uraeus decorated Pharaoh's crown as a symbol of royal power and divine protection. Egyptians also told of Apophis, a giant chaos serpent who attacked the sun god every night.","So the serpent in Genesis 3 would have struck ancient readers as a figure of cunning and power that sets itself up against God. Genesis is careful, though: the serpent is only a creature that God made, not a rival god. Later Scripture reveals that Satan was behind it (Revelation 12:9)."]},{"h":"Gilgamesh and the Lost Plant","p":["The Epic of Gilgamesh, one of the oldest stories in the world, tells of a Mesopotamian king searching for a way to live forever. Near the end, he finally gets a plant that can make him young again. But while he bathes in a pool, a snake smells the plant, takes it, and slithers away, shedding its skin. Gilgamesh sits down and weeps.","Both Gilgamesh and Genesis connect a serpent with humans losing life that lasts forever. But in Genesis, the problem isn't bad luck. It's that people chose to disobey God. And Genesis ends the chapter with hope: God's promise that the woman's offspring will crush the serpent's head."]},{"h":"Winged Guardians","p":["After sending Adam and Eve out, God placed cherubim to guard the way to the tree of life. Ancient palaces and temples had guardian creatures at their doors too. In the 1840s, Austen Henry Layard dug up huge Assyrian lamassu at Nimrud: stone statues with the body of a bull or lion, eagle's wings, and a human head, standing at palace gates.","The Bible's cherubim are not the chubby baby angels of later paintings. They are powerful heavenly beings, and carved cherubim later decorated the tabernacle and temple, guarding the place of God's presence."]}],"people":[{"name":"Gilgamesh","role":"Legendary king of Uruk and hero of the Epic of Gilgamesh"},{"name":"Austen Henry Layard","role":"Excavated Assyrian palace guardians (lamassu) in the 1840s"}],"source":{"title":"The Epic of Gilgamesh, Tablet 11","who":"Mesopotamian scribes","date":"Copies on ancient clay tablets","text":"Gilgamesh finds a pool of cool water and goes down to bathe. A snake smells the fragrance of the plant, comes up, and carries it off. As it goes, it sheds its skin. Gilgamesh sits down and weeps.","note":"Paraphrased. The story tries to explain why people die and why snakes shed their skin. Genesis gives a different explanation for death: human sin (Genesis 3:19; Romans 5:12)."},"vocab":[["Uraeus","A rearing cobra worn on Pharaoh's crown"],["Epic","A long story-poem about a hero"],["Lamassu","Assyrian guardian statue with a human head, animal body, and wings"],["Cherubim","Powerful heavenly beings who guard God's presence (singular: cherub)"]],"map":{"view":"ane","places":["nineveh","uruk","memphis","thebes"],"caption":"Guardian statues stood at Assyrian palaces near Nineveh; Gilgamesh was remembered as a king of Uruk; the uraeus crowned Egypt's pharaohs."},"timeline":[{"y":1845,"t":"Layard begins uncovering Assyrian palace guardians at Nimrud","d":true}],"video":[],"quiz":[{"q":"What was the uraeus?","options":["A crown jewel","A rearing cobra on Pharaoh's crown","A chaos monster","A guardian statue"],"answer":1,"why":"A symbol of royal power in Egypt."},{"q":"In the Gilgamesh epic, what did the snake take?","options":["Gilgamesh's crown","A plant that could make him young again","His sword","His boat"],"answer":1,"why":"While Gilgamesh was bathing."},{"q":"According to Genesis, why do people die?","options":["Bad luck","A snake stole a plant","Human sin","The gods were angry"],"answer":2,"why":"Genesis 3 ties death to disobedience."},{"q":"What were lamassu?","options":["Assyrian guardian statues with wings","Egyptian coins","Babylonian priests","Clay lamps"],"answer":0,"why":"They stood at palace gates."},{"q":"What do cherubim do in the Bible?","options":["Play harps","Guard God's presence","Carry babies","Build cities"],"answer":1,"why":"They guarded Eden and decorated the temple."}],"assignment":"Look up a picture of an Assyrian lamassu and an image of the cherubim on the ark of the covenant (from an illustrated Bible or museum site). Sketch both, then write a paragraph about what guardians at a doorway would tell an ancient person about the place inside."},{"id":"ohist-04","bible":"gen-04","bibleTitle":"Cain and Abel","title":"The First Farmers, Herders, and Cities","era":"The ancient Near East","intro":"Genesis 4 describes a farmer and a shepherd, the first city, and the first musicians and metalworkers. Archaeologists study the same big changes: how people began farming, herding, building cities, and inventing new skills.","sections":[{"h":"Farmers and Herders","p":["Cain worked the soil, and Abel kept flocks. Those were the two main ways of life in the ancient Near East. Farmers grew wheat and barley and lived in villages. Herders moved with their sheep and goats to find grass and water.","The two groups needed each other, trading grain for wool, milk, and meat, but they also competed for land and water. A Sumerian poem even stages a contest between a shepherd and a farmer, each arguing that his work is more valuable. Genesis 4 shows how envy between brothers could turn deadly."]},{"h":"The First City","p":["Genesis 4:17 says Cain built a city. Cities in the ancient world meant walls, gates, and people who didn't grow all their own food: craftsmen, traders, and rulers. Some of the oldest cities in the world, like Eridu and Uruk, were in southern Mesopotamia.","Uruk became one of the largest cities in the world at its height, with massive walls. The Epic of Gilgamesh praises those walls. It is also where some of the earliest known writing appears, used at first to keep track of grain, sheep, and workers."]},{"h":"Music and Metal","p":["Genesis 4:21-22 names Jubal, 'the father of all who play stringed instruments and pipes,' and Tubal-Cain, who 'forged all kinds of tools out of bronze and iron.' Music and metalworking were two of the most important skills in the ancient world.","In the 1920s, archaeologist Leonard Woolley excavated royal tombs at Ur and found beautiful lyres decorated with gold, shell, and lapis lazuli, including one with a golden bull's head. They are among the oldest stringed instruments ever found. Metalworkers there crafted golden helmets, weapons, and jewelry of amazing skill."]}],"people":[{"name":"Leonard Woolley","role":"British archaeologist who excavated Ur, including its royal tombs"},{"name":"Jubal and Tubal-Cain","role":"Named in Genesis 4 as founders of music and metalworking"}],"source":{"title":"The Lyres of Ur","who":"Craftsmen of Ur","date":"Excavated 1922-1934","text":"Woolley's team found several lyres in the royal tombs of Ur. The wooden frames had rotted away, so the team poured plaster into the hollows left in the soil to preserve their shapes. One, the 'Bull-Headed Lyre,' has a bull's head covered in gold with a beard of blue lapis lazuli, and a front panel of shell pictures showing animals carrying food and playing music.","note":"These instruments are now in museums in London, Philadelphia, and Baghdad. They show how advanced music and craftsmanship were in the ancient world, the kind of skills Genesis 4 describes."},"vocab":[["Herder / pastoralist","Someone who raises and moves flocks of animals"],["Lyre","A stringed instrument with a frame and a sound box"],["Bronze","A metal made by mixing copper and tin"],["Lapis lazuli","A deep blue stone prized for jewelry"]],"map":{"view":"ane","places":["ur","uruk","eridu"],"caption":"Eridu, Uruk, and Ur were some of the earliest cities in southern Mesopotamia."},"timeline":[{"y":1922,"t":"Leonard Woolley begins excavating Ur","d":true}],"video":[],"quiz":[{"q":"What were the two main ways of life in Genesis 4?","options":["Fishing and hunting","Farming and herding","Trading and building","Soldiering and ruling"],"answer":1,"why":"Cain farmed; Abel kept flocks."},{"q":"Who built the first city in Genesis?","options":["Abel","Cain","Noah","Adam"],"answer":1,"why":"Genesis 4:17."},{"q":"Which city had famous walls praised in Gilgamesh?","options":["Uruk","Jerusalem","Memphis","Rome"],"answer":0,"why":"Uruk was one of the world's largest early cities."},{"q":"What did Woolley find in the royal tombs of Ur?","options":["Scrolls","Lyres decorated with gold and lapis lazuli","Mummies","Iron swords"],"answer":1,"why":"Among the oldest stringed instruments."},{"q":"What is bronze made from?","options":["Iron and gold","Copper and tin","Silver and lead","Clay and sand"],"answer":1,"why":"Mixing copper and tin makes a harder metal."}],"assignment":"Make a simple stringed instrument (a rubber band 'lyre' on a box or tray). Then write a paragraph about how music, farming, and cities show that people are creative because they're made in God's image."},{"id":"ohist-05","bible":"gen-05","bibleTitle":"Noah Builds the Ark","title":"Cubits, Pitch, and Ancient Boats","era":"The ancient Near East","intro":"God gave Noah precise building instructions using ancient measurements and materials. Archaeology helps us picture them, and one clay tablet even describes a very different, round 'ark.'","sections":[{"h":"Measuring in Cubits","p":["Ancient builders measured with body parts. A cubit was the length from the elbow to the tip of the middle finger, usually about 18 inches. Egypt also had a longer 'royal cubit' of about 20.6 inches.","Using the common cubit, the ark was 300 cubits long (about 450 feet), 50 wide (75 feet), and 30 high (45 feet). That's about one and a half football fields long, and its box-like shape was built for floating steadily, not for sailing anywhere."]},{"h":"Pitch and Waterproofing","p":["God told Noah to coat the ark with pitch inside and out. In Mesopotamia, people used bitumen, a natural tar that seeps out of the ground in that region. It waterproofed boats, baskets, and bathrooms, and it also served as mortar for bricks.","Bitumen shows up again and again in the Bible: in the bricks at Babel (Genesis 11:3), in the tar pits of the Valley of Siddim (Genesis 14:10), and on the papyrus basket that carried baby Moses (Exodus 2:3)."]},{"h":"The Ark Tablet","p":["In 2014, Irving Finkel, a curator at the British Museum, published a small clay tablet about the size of a cell phone. Written in Babylonian cuneiform, it is part of a flood story in which a god tells a man named Atrahasis to build a boat. But this boat is round, a giant version of a coracle, a woven reed basket-boat used on Mesopotamian rivers. The tablet gives measurements and says it should be coated with bitumen.","The Ark Tablet shows that ancient peoples remembered a great flood and a boat of rescue. The Babylonian boat is round and the gods act out of irritation. Genesis describes a long, stable ark built at God's command to save a righteous family and the animals."]}],"people":[{"name":"Irving Finkel","role":"British Museum curator who published the Ark Tablet in 2014"},{"name":"Atrahasis","role":"Hero of a Babylonian flood story"}],"source":{"title":"The Ark Tablet","who":"A Babylonian scribe","date":"Published in 2014","text":"A god speaks through a reed wall to Atrahasis, telling him to tear down his house and build a boat. The instructions describe a round boat made of woven palm-fiber rope, with a huge floor area, and give the amounts of bitumen needed to coat it inside and out.","note":"Paraphrased. Finkel's team later built a smaller version of the round boat in India to see if it would float, and it did."},"vocab":[["Cubit","Ancient measurement from elbow to fingertip, about 18 inches"],["Bitumen / pitch","Natural tar used for waterproofing"],["Coracle","A round boat made of a woven frame covered with waterproof material"],["Curator","A museum expert who cares for and studies a collection"]],"map":{"view":"ane","places":["babylon","ur","mari"],"caption":"Bitumen seeps from the ground in Mesopotamia and was used for boats, bricks, and baskets."},"timeline":[{"y":2014,"t":"Irving Finkel publishes the Ark Tablet","d":true}],"video":[],"quiz":[{"q":"What is a cubit?","options":["A kind of wood","Length from elbow to fingertip","A boat","A weight"],"answer":1,"why":"About 18 inches."},{"q":"About how long was the ark?","options":["45 feet","150 feet","450 feet","4,500 feet"],"answer":2,"why":"300 cubits is about 450 feet."},{"q":"What is bitumen used for?","options":["Food","Waterproofing and mortar","Paint","Medicine only"],"answer":1,"why":"It coated boats and held bricks together."},{"q":"What shape is the boat in the Ark Tablet?","options":["Long like Noah's ark","Round like a coracle","Triangle","Square"],"answer":1,"why":"A giant round basket-boat."},{"q":"Where else in the Bible does bitumen appear?","options":["Moses' basket","David's sling","Solomon's crown","Jonah's fish"],"answer":0,"why":"Exodus 2:3."}],"assignment":"Use a tape measure (or count steps) outside to mark out 450 feet by 75 feet, the ark's size. Then build a small ark model and a round coracle model from paper or clay and test which floats more steadily in a tub of water. Write up your results."},{"id":"ohist-06","bible":"gen-06","bibleTitle":"The Rainbow Promise","title":"Flood Stories From Around the World","era":"The ancient Near East","intro":"In 1872, a young scholar at the British Museum read a clay tablet and discovered a Babylonian flood story with birds sent out from a boat. The world was astonished.","sections":[{"h":"George Smith's Discovery","p":["George Smith was a banknote engraver who taught himself to read cuneiform and got a job at the British Museum. In 1872, working through tablets from Ashurbanipal's library, he found one describing a boat resting on a mountain and a bird being sent out.","It was part of the Epic of Gilgamesh. According to a coworker, Smith was so excited that he jumped up and rushed around the room. When he announced the find in a public lecture, it caused a sensation, and a newspaper paid for him to travel to Nineveh to look for more pieces. Amazingly, he found one."]},{"h":"Similar Stories, Different Meaning","p":["In the Gilgamesh story, a man named Utnapishtim is warned by a god to build a boat and bring his family and animals aboard. After the flood, the boat lands on a mountain, and he sends out a dove, a swallow, and a raven. When the raven doesn't return, he knows the land is dry, and he offers a sacrifice.","But the differences are huge. The gods send the flood partly because humans are too noisy. The gods themselves are terrified by the flood, and when Utnapishtim offers his sacrifice, they gather around 'like flies.' In Genesis, the one God judges real evil, 'remembers' Noah, and makes a covenant promise with the rainbow as its sign. Christians hold different views on how these stories are related, but many see them as distorted memories of a real event that Genesis records faithfully."]},{"h":"The Mountains of Ararat","p":["Genesis 8:4 says the ark rested on 'the mountains of Ararat,' a region, not necessarily one peak. Ararat is the Hebrew name for the land later called Urartu, in the mountains of what is now eastern Turkey, Armenia, and northwest Iran.","Today the tallest mountain there is called Mount Ararat, nearly 17,000 feet high. Many expeditions have searched it for the ark, but nothing has been confirmed. The Bible's point is not the exact spot, but that God brought his people safely through judgment."]}],"people":[{"name":"George Smith","role":"British Museum scholar who found the Gilgamesh flood tablet in 1872"},{"name":"Utnapishtim","role":"Hero of the flood story in the Epic of Gilgamesh"}],"source":{"title":"The Epic of Gilgamesh, Tablet 11","who":"Mesopotamian scribes","date":"Found by George Smith in 1872","text":"Utnapishtim says: When the seventh day arrived, I brought out a dove and let it go. The dove went and came back; no resting place appeared, so it returned. I brought out a swallow; it came back too. I brought out a raven; it went, saw the waters going down, ate, circled, and did not return.","note":"Paraphrased. Compare Genesis 8:6-12, where Noah sends out a raven and then a dove three times. Read both and list what's similar and what's different."},"vocab":[["Epic of Gilgamesh","An ancient Mesopotamian story-poem about King Gilgamesh"],["Urartu","Ancient kingdom in the mountains north of Mesopotamia; the Bible's 'Ararat'"],["Covenant","A binding promise or agreement"],["Expedition","A journey made for exploring or research"]],"map":{"view":"ane","places":["ararat","nineveh","uruk"],"caption":"The 'mountains of Ararat' lie in the highlands north of Mesopotamia."},"timeline":[{"y":1872,"t":"George Smith reads the Babylonian flood tablet","d":true}],"video":[],"quiz":[{"q":"Who discovered the Gilgamesh flood tablet?","options":["Leonard Woolley","George Smith","Irving Finkel","Layard"],"answer":1,"why":"In 1872 at the British Museum."},{"q":"What birds did Utnapishtim send out?","options":["Dove, swallow, raven","Eagle, hawk, owl","Only a dove","Raven and crow"],"answer":0,"why":"Tablet 11 lists all three."},{"q":"Why did the gods send the flood in the Babylonian story?","options":["Human evil","Partly because humans were too noisy","To water crops","They didn't"],"answer":1,"why":"A very different reason from Genesis."},{"q":"What is 'Ararat' in the Bible?","options":["A single volcano","A region, later called Urartu","A city","A river"],"answer":1,"why":"'The mountains of Ararat.'"},{"q":"What is the sign of God's covenant with Noah?","options":["A dove","A rainbow","An altar","An olive tree"],"answer":1,"why":"Genesis 9:13."}],"assignment":"Read Genesis 8:6-12 and the Gilgamesh passage above. Make a Venn diagram of similarities and differences. Then write a paragraph about what Genesis teaches about God that the Babylonian story does not."},{"id":"ohist-07","bible":"gen-07","bibleTitle":"The Tower of Babel","title":"Ziggurats and the Gate of the Gods","era":"The ancient Near East","intro":"The builders at Babel said, 'Let's make bricks and bake them thoroughly... and use tar for mortar.' That's exactly how Mesopotamians built, and the tower sounds just like a ziggurat.","sections":[{"h":"Brick and Tar","p":["Canaan has plenty of stone, but southern Mesopotamia has almost none. Instead, people made bricks from river mud. Sun-dried bricks were cheap but crumbled in rain, so important buildings used bricks baked hard in kilns, held together with bitumen.","Genesis 11:3 explains this for readers who lived in stone country: 'They used brick instead of stone, and tar for mortar.' It's a small detail that shows the story knows Mesopotamia well."]},{"h":"Ziggurats","p":["Mesopotamian cities built ziggurats: huge stepped towers of brick with a temple on top. People thought of them as stairways linking heaven and earth, where the gods could come down to their city. The ziggurat of Ur, partly restored, still rises above the Iraqi desert.","Babylon's name in its own language was Bab-ili, 'gate of the god.' Its great ziggurat was called Etemenanki, 'house of the foundation of heaven and earth.' Genesis plays with the name, linking Babel to a Hebrew word meaning 'confused.' And while the builders wanted a tower reaching 'to the heavens,' the LORD had to 'come down' to see it."]},{"h":"Digging Up Babylon","p":["From 1899 to 1917, a German team led by Robert Koldewey excavated Babylon. They uncovered the Ishtar Gate, covered in blue glazed bricks with dragons and bulls, and found the huge square foundation of Etemenanki, though little of the tower itself remained.","The Greek historian Herodotus, who wrote around 440 BC, described a tower in Babylon with eight levels, one on top of another, and a winding ramp around the outside to the temple at the top. The Etemenanki he saw was a later rebuilding, but it shows the kind of tower Babel's builders imagined."]}],"people":[{"name":"Robert Koldewey","role":"German archaeologist who excavated Babylon, 1899-1917"},{"name":"Herodotus","role":"Greek historian (about 484-425 BC), sometimes called the 'father of history'"}],"source":{"title":"Histories, Book 1","who":"Herodotus","date":"About 440 BC","text":"Herodotus describes a sacred area in Babylon with a solid tower in the middle, with a second tower on top of it and another on that, up to eight towers. A path winds around the outside so people can climb to the top, with a resting place halfway up. On the top tower is a great temple.","note":"Paraphrased. Herodotus may not have seen it all himself, and some details may be exaggerated, but his description matches the stepped shape of a ziggurat."},"vocab":[["Ziggurat","A stepped temple tower in Mesopotamia"],["Kiln","An oven for baking bricks or pottery"],["Mortar","Material that holds bricks together"],["Bab-ili","Babylon's name in Akkadian: 'gate of the god'"]],"map":{"view":"ane","places":["babylon","ur","uruk"],"caption":"Babylon stood on the Euphrates in the land of Shinar. Ur's ziggurat still stands today."},"timeline":[{"y":1899,"t":"Robert Koldewey begins excavating Babylon","d":true}],"video":[],"quiz":[{"q":"Why did Mesopotamians build with brick?","options":["They liked red","There was almost no stone","Bricks were holy","Rome required it"],"answer":1,"why":"Southern Mesopotamia had river mud, not stone."},{"q":"What is a ziggurat?","options":["A palace","A stepped temple tower","A city wall","A tomb"],"answer":1,"why":"Seen as a stairway to the gods."},{"q":"What did Bab-ili mean?","options":["Confusion","Gate of the god","Tower of bricks","City of kings"],"answer":1,"why":"Genesis links 'Babel' to confusion."},{"q":"Who excavated Babylon from 1899 to 1917?","options":["Woolley","Koldewey","Layard","Smith"],"answer":1,"why":"Robert Koldewey."},{"q":"How many levels did Herodotus describe?","options":["Three","Five","Eight","Twelve"],"answer":2,"why":"Eight towers, one on another."}],"assignment":"Build a model ziggurat with blocks, sugar cubes, or clay 'bricks.' Then write a paragraph comparing what the Babel builders wanted (Genesis 11:4) with what God later promised Abram (Genesis 12:2)."},{"id":"ohist-08","bible":"gen-08","bibleTitle":"God Calls Abram","title":"Ur and Harran: Abram's World","era":"About 2000 BC","intro":"Abram's story begins in Ur of the Chaldeans, one of the great cities of the ancient world. When God called him to leave, he was walking away from wealth, culture, and the gods his family served.","sections":[{"h":"The City of Ur","p":["Ur stood near the Euphrates River in southern Mesopotamia. Around the time many scholars place Abraham (roughly 2100 to 1800 BC, though dates are debated), Ur was a wealthy trading city with a massive ziggurat, busy harbors, schools where boys learned cuneiform, and thousands of tablets recording business deals.","Leonard Woolley's excavations in the 1920s and 30s uncovered streets of brick houses, many with two stories and a central courtyard. Abram grew up in a sophisticated city, not a primitive village."]},{"h":"The Moon God's Cities","p":["Ur's chief god was the moon god, called Nanna by the Sumerians and Sin by later peoples. The great ziggurat was his temple. Interestingly, Harran, where Abram's family settled on the way to Canaan, was also a major center of moon-god worship.","Joshua 24:2 says plainly that Abram's father Terah 'worshiped other gods.' So God's call in Genesis 12 meant leaving behind not just a homeland, but a whole religious world. Abram had to trust a God he couldn't see, rather than the moon shining over his city every night."]},{"h":"The Long Journey","p":["From Ur to Harran is roughly 600 miles along the Euphrates, and from Harran to Canaan several hundred more. With flocks, servants, and tents, the trip could have taken months.","Travelers followed the Fertile Crescent rather than crossing the Arabian Desert, because that's where water and grass were. When Abram finally reached Canaan, he lived as a tent-dwelling herder, moving between places like Shechem, Bethel, and Hebron."]}],"people":[{"name":"Terah","role":"Abram's father, who moved the family from Ur to Harran"},{"name":"Abram (Abraham)","role":"Called by God to leave Ur and Harran for Canaan"},{"name":"Leonard Woolley","role":"Excavated Ur in the 1920s and 1930s"}],"source":{"title":"The Lament for Ur","who":"Sumerian poets","date":"Written after Ur's fall, about 2000 BC","text":"This long poem mourns the destruction of Ur by invaders from Elam. The poet describes the city's goddess weeping because her city has been destroyed, its people scattered, its temple ruined, and its streets filled with the fallen.","note":"Paraphrased. Ur was conquered around 2004 BC and later rebuilt. Some scholars think Abram's family may have lived in Ur during its later rebuilt period. The poem shows the kind of city, and the kind of gods, Abram left behind."},"vocab":[["Chaldeans","A people of southern Mesopotamia; 'Ur of the Chaldeans' uses the later name for the region"],["Nanna / Sin","The moon god worshiped at Ur and Harran"],["Sumerian","The language and people of ancient southern Mesopotamia"],["Nomad","Someone who moves from place to place with flocks"]],"map":{"view":"ane","places":["ur","harran","damascus_a","hebron_a"],"caption":"Abram's journey followed the Fertile Crescent from Ur up the Euphrates to Harran, then down to Canaan."},"timeline":[{"y":-2004,"t":"Ur is conquered by the Elamites (about 2004 BC)"},{"y":-2000,"t":"Abram leaves Ur (often dated about 2100-1800 BC)"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"Which god was worshiped at both Ur and Harran?","options":["The sun god","The moon god","The river god","Marduk"],"answer":1,"why":"Nanna, also called Sin."},{"q":"What does Joshua 24:2 say about Terah?","options":["He was a priest of God","He worshiped other gods","He built the ark","He was a king"],"answer":1,"why":"Abram's family served other gods."},{"q":"What did Woolley find at Ur?","options":["Tents","Brick houses, a ziggurat, and tablets","Pyramids","A Roman fort"],"answer":1,"why":"Ur was a sophisticated city."},{"q":"Why did travelers follow the Fertile Crescent?","options":["It was shorter","Water and grass were there","The desert was illegal","It was downhill"],"answer":1,"why":"Flocks needed water and pasture."},{"q":"About how far was it from Ur to Harran?","options":["60 miles","600 miles","6,000 miles","6 miles"],"answer":1,"why":"Roughly 600 miles."}],"assignment":"Trace Abram's journey on a map from Ur to Harran to Canaan. Estimate the total distance. If a family with flocks traveled 10 miles a day, how many days would it take? Write a paragraph about what Abram gave up to follow God."},{"id":"ohist-09","bible":"gen-09","bibleTitle":"Abram and Lot Part Ways","title":"Kings, Nomads, and the City of Salem","era":"About 2000-1800 BC","intro":"Genesis 14 describes a war of kings, a rescue raid, and a mysterious priest-king of Salem. Egyptian curse texts from around this time mention a city called Rushalimum, one of the earliest mentions of Jerusalem outside the Bible.","sections":[{"h":"Life on the Move","p":["Abram and Lot were pastoral nomads. They lived in tents and moved their flocks with the seasons, grazing in the hills during the rainy winter and near springs and wells in the dry summer. Their wealth was counted in animals, servants, and silver.","They lived alongside settled towns, trading with them and sometimes making agreements over land and water. When herds grew too large for one area, splitting up, as Abram and Lot did, was a practical solution."]},{"h":"The War of the Kings","p":["Genesis 14 names four kings from the east, including Kedorlaomer, king of Elam, a powerful kingdom east of Mesopotamia. His name fits the pattern of Elamite royal names. These kings had forced cities near the Dead Sea to pay tribute. When those cities rebelled, the eastern kings marched in, defeated them, and carried off captives, including Lot.","Abram gathered 318 trained men from his own household and chased the invaders all the way to Dan, in the far north. He attacked at night, split his forces, and rescued everyone. A wealthy nomad chief with a private band of fighters was typical of the time."]},{"h":"Melchizedek, King of Salem","p":["After the battle, Melchizedek, 'king of Salem' and 'priest of God Most High,' brought out bread and wine and blessed Abram. Psalm 76:2 links Salem with Zion, so most scholars identify Salem with Jerusalem.","Egyptian 'Execration Texts' from roughly 1900-1800 BC list enemy cities and rulers, including a city called Rushalimum, probably an early form of Jerusalem. That means Jerusalem was already an important city in the general era of the patriarchs."]}],"people":[{"name":"Kedorlaomer","role":"King of Elam who led the eastern kings in Genesis 14"},{"name":"Melchizedek","role":"King of Salem and priest of God Most High who blessed Abram"},{"name":"Lot","role":"Abram's nephew, captured and rescued"}],"source":{"title":"The Egyptian Execration Texts","who":"Egyptian priests","date":"About 1900-1800 BC","text":"Egyptian priests wrote the names of enemy rulers and cities on clay bowls and figurines of bound prisoners, along with curses. Then they smashed them, believing this would weaken those enemies. The lists include cities in Canaan, among them one written as Rushalimum.","note":"Described and paraphrased. These texts give us names of Canaanite cities and rulers from the era of the patriarchs, and one of the earliest known references to Jerusalem."},"vocab":[["Pastoral nomad","A herder who moves with flocks from place to place"],["Tribute","Payment forced on a weaker people by a stronger ruler"],["Execration","A formal curse against an enemy"],["Salem","Old name for Jerusalem; related to the word for peace (shalom)"]],"map":{"view":"local","places":["jerusalem","hebron","bethel","dan","damascus"],"caption":"Abram chased the eastern kings from near Hebron all the way north to Dan and beyond, toward Damascus."},"timeline":[{"y":-1850,"t":"Egyptian Execration Texts mention Rushalimum (Jerusalem)"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"How did pastoral nomads live?","options":["In stone palaces","In tents, moving with their flocks","On boats","In cities only"],"answer":1,"why":"They followed water and pasture."},{"q":"Kedorlaomer was king of which land?","options":["Egypt","Elam","Canaan","Greece"],"answer":1,"why":"Elam lay east of Mesopotamia."},{"q":"How far north did Abram chase the invaders?","options":["Hebron","Dan","Egypt","Ur"],"answer":1,"why":"Genesis 14:14."},{"q":"What city is Salem most likely?","options":["Babylon","Jerusalem","Memphis","Harran"],"answer":1,"why":"Psalm 76:2 links Salem and Zion."},{"q":"What did Egyptian priests do with Execration Texts?","options":["Sold them","Smashed them as curses on enemies","Buried them with kings","Read them in temples"],"answer":1,"why":"They believed breaking them weakened enemies."}],"assignment":"On a map of Israel, trace Abram's rescue from Hebron to Dan. Measure the distance. Then write a paragraph explaining why Abram refused to keep any of the king of Sodom's goods (Genesis 14:22-23)."},{"id":"ohist-10","bible":"gen-10","bibleTitle":"Count the Stars","title":"How Ancient People Made Covenants","era":"About 2000-1400 BC","intro":"God's covenant with Abram in Genesis 15, with animals cut in half and a torch passing between them, seems strange today. But ancient letters and treaties show it was a serious and familiar way to make a binding promise.","sections":[{"h":"Cutting a Covenant","p":["In Hebrew, you don't 'make' a covenant; you 'cut' one. In the ancient Near East, sealing a treaty often involved killing an animal. Letters found at Mari, a city on the Euphrates destroyed by Hammurabi around 1761 BC, speak of making an alliance by 'killing a donkey foal.'","Jeremiah 34:18 describes people who 'cut a calf in two and then walked between its pieces' to seal a promise. The meaning was chilling: 'May I be cut in pieces like this animal if I break my word.' In Genesis 15, only God, appearing as a smoking firepot and blazing torch, passes between the pieces. He alone takes on the penalty."]},{"h":"An Heir Problem","p":["Before the covenant, Abram complains that his servant Eliezer of Damascus will inherit everything. That fits customs known from ancient tablets. Clay tablets from Nuzi, a town in northern Mesopotamia, show childless couples adopting someone, sometimes a servant, to care for them in old age and inherit their property. If a natural son was born later, he usually came first.","Nuzi's tablets were written centuries after Abram, and scholars debate how closely they match his time. But they help us understand the kind of world where Abram's worry made sense, and where God's promise, 'a son who is your own flesh and blood,' meant everything."]},{"h":"Stars and Stargazers","p":["Mesopotamians were skilled astronomers. They recorded the movements of stars and planets for centuries, partly because they believed the heavens revealed messages from the gods. Babylonian star records became the basis of later Greek astronomy.","When God told Abram to 'count the stars,' he pointed him to the same sky his neighbors worshiped and studied, and said, in effect: I made these, and I will keep my promise to you."]}],"people":[{"name":"Hammurabi","role":"King of Babylon who destroyed Mari around 1761 BC"},{"name":"Eliezer of Damascus","role":"Abram's servant, his heir before Isaac was born"}],"source":{"title":"A Letter From Mari","who":"An official writing to the king of Mari","date":"About 1775-1761 BC","text":"The writer reports that he would not allow a puppy and a goat to be used, and instead had a donkey foal killed, and so made peace between the two groups.","note":"Paraphrased. Over 20,000 tablets were found at Mari, starting in 1933. They give a detailed picture of life, politics, and customs along the Euphrates in the general era of the patriarchs."},"vocab":[["Cut a covenant","Hebrew way of saying 'make a binding agreement'"],["Alliance","An agreement between groups to support each other"],["Heir","The person who inherits someone's property"],["Astronomy","The study of stars and planets"]],"map":{"view":"ane","places":["mari","nuzi","harran","hebron_a","damascus_a"],"caption":"Tablets from Mari on the Euphrates and Nuzi in northern Mesopotamia illuminate customs from the world of the patriarchs."},"timeline":[{"y":-1761,"t":"Hammurabi destroys Mari, burying its tablet archives"},{"y":1933,"t":"French archaeologists begin excavating Mari","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"In Hebrew, what do you do to a covenant?","options":["Write it","Cut it","Sing it","Bury it"],"answer":1,"why":"'Cut a covenant.'"},{"q":"What animal was killed to make an alliance in the Mari letter?","options":["A lamb","A donkey foal","A bull","A dove"],"answer":1,"why":"A donkey foal."},{"q":"What did walking between the animal pieces mean?","options":["A celebration","'May this happen to me if I break my word'","A cleaning ritual","A sacrifice for sin"],"answer":1,"why":"Jeremiah 34:18 describes it."},{"q":"What do Nuzi tablets show childless couples doing?","options":["Moving cities","Adopting an heir, sometimes a servant","Selling land","Going to war"],"answer":1,"why":"Like Abram's worry about Eliezer."},{"q":"Who passed between the pieces in Genesis 15?","options":["Abram","Both","Only God","No one"],"answer":2,"why":"God took the whole responsibility."}],"assignment":"Write a short 'covenant' between you and a family member (for example, a promise to help with something for a month). Include who is making it, the promise, and a sign to remember it. Then write a paragraph on why it matters that God alone walked between the pieces."},{"id":"ohist-11","bible":"gen-11","bibleTitle":"Hagar and the God Who Sees","title":"Hammurabi's Laws and Family Customs","era":"About 1754 BC","intro":"Sarai's plan to have a child through her servant Hagar seems shocking to us. An ancient law code carved in stone shows it was a known custom, and also why it caused so much trouble.","sections":[{"h":"The Code of Hammurabi","p":["Hammurabi ruled Babylon from about 1792 to 1750 BC. Around 1754 BC he had nearly 300 laws carved on a tall black stone pillar called a stela. At the top, Hammurabi stands before the sun god Shamash, the god of justice.","In 1901, French archaeologists found the stela at Susa, in modern Iran, where invaders had carried it as war loot centuries later. It's now in the Louvre museum in Paris. It's one of the longest and best-preserved law codes from the ancient world."]},{"h":"A Servant Mother","p":["Several ancient documents describe a childless wife giving her servant to her husband so the household would have an heir. The child counted as the wife's. Hammurabi's laws even address what happens if that servant then acts as if she were equal to her mistress: the mistress can't sell her, but can put a slave mark on her and treat her as a slave again.","That's almost exactly the tension in Genesis 16. Hagar 'began to despise her mistress,' and Sarai treated her harshly. Genesis doesn't present the custom as God's plan. It shows the pain that came from trying to fulfill God's promise by human scheming."]},{"h":"An Egyptian Servant","p":["Hagar was Egyptian. Abram and Sarai may have gained servants during their earlier stay in Egypt (Genesis 12:16). Egypt and Canaan were connected by trade routes, and people moved between them often.","Hagar's story takes place on the road to Shur, the route toward Egypt. She was trying to go home. There, alone in the desert, the God of Abram saw her and spoke to her, a foreign servant with no power at all."]}],"people":[{"name":"Hammurabi","role":"King of Babylon (about 1792-1750 BC) famous for his law code"},{"name":"Hagar","role":"Sarai's Egyptian servant and mother of Ishmael"},{"name":"Jacques de Morgan's team","role":"French archaeologists who found Hammurabi's stela at Susa in 1901"}],"source":{"title":"The Code of Hammurabi, Law 146","who":"King Hammurabi of Babylon","date":"About 1754 BC","text":"If a man marries a priestess and she gives her husband a slave woman who bears him children, and afterward that slave woman claims equal rank with her mistress because she has borne children, her mistress may not sell her, but she may put a slave mark on her and count her among the slaves.","note":"Paraphrased. This law shows the custom behind Genesis 16 and the conflict it could create. Notice how Genesis shows God caring for Hagar, the person with the least power."},"vocab":[["Law code","A written collection of laws"],["Stela","A tall carved stone slab with writing or pictures"],["Louvre","A famous art and history museum in Paris"],["Mistress","A woman in charge of servants"]],"map":{"view":"ane","places":["babylon","susa","memphis","hebron_a"],"caption":"Hammurabi ruled from Babylon; his stela was later carried to Susa. Hagar fled toward her homeland, Egypt."},"timeline":[{"y":-1754,"t":"Hammurabi's law code is carved (about 1754 BC)"},{"y":1901,"t":"Hammurabi's stela is discovered at Susa","d":true}],"video":[],"quiz":[{"q":"Where is Hammurabi's law code displayed today?","options":["British Museum","The Louvre in Paris","Baghdad","Jerusalem"],"answer":1,"why":"It was found at Susa in 1901."},{"q":"What is a stela?","options":["A clay tablet","A tall carved stone slab","A scroll","A coin"],"answer":1,"why":"Hammurabi's is about 7 feet tall."},{"q":"According to Law 146, what could a mistress NOT do to the servant?","options":["Mark her","Sell her","Command her","Keep her"],"answer":1,"why":"She could mark her but not sell her."},{"q":"Where was Hagar from?","options":["Babylon","Egypt","Canaan","Elam"],"answer":1,"why":"She was Egyptian."},{"q":"Does Genesis present the Hagar plan as God's idea?","options":["Yes","No, it shows the pain of human scheming","It doesn't say anything","It was Hagar's idea"],"answer":1,"why":"It was Sarai's plan, and it caused conflict."}],"assignment":"Read five laws from Hammurabi's code (search 'Code of Hammurabi laws' with a parent). Choose one that seems fair and one that seems unfair. Compare each with a law from Exodus 21-23 and write a paragraph about what you notice."},{"id":"ohist-12","bible":"gen-12","bibleTitle":"Three Visitors and a City Destroyed","title":"The Dead Sea and the Cities of the Plain","era":"About 2000-1800 BC","intro":"Sodom and Gomorrah stood in a strange landscape: the lowest place on earth, a salt sea where nothing lives, surrounded by tar pits and pillars of salt.","sections":[{"h":"The Lowest Place on Earth","p":["The Dead Sea lies more than 1,400 feet below sea level, the lowest land on earth. Water flows in from the Jordan River but has no outlet, so it evaporates in the heat and leaves its minerals behind. The water is roughly ten times saltier than the ocean, so salty that people float easily and no fish can live in it. The Bible calls it the Salt Sea.","Chunks of bitumen sometimes float up to the surface, which is why Greeks and Romans called it Lake Asphaltites. Genesis 14:10 mentions the Valley of Siddim 'full of tar pits.' At the southwest end, Mount Sodom is a ridge made almost entirely of salt, with pillars that visitors nickname 'Lot's wife.'"]},{"h":"Where Was Sodom?","p":["No one knows for sure. Many archaeologists have looked at the southeast side of the Dead Sea, where the ruins of Bab edh-Dhra and Numeira were destroyed and abandoned in ancient times. Others argue for Tall el-Hammam, a large ancient city northeast of the Dead Sea. Each view has supporters and critics, and discussions continue.","Genesis says the region had once been 'well watered, like the garden of the LORD' (13:10). Whatever the exact location, the Bible remembers Sodom and Gomorrah as lasting examples of God's judgment on arrogance, cruelty, and neglect of the poor (Ezekiel 16:49)."]},{"h":"Hospitality and Circumcision","p":["Genesis 18-19 contrasts two kinds of welcome. Abraham runs to greet strangers, washes their feet, and serves a huge meal. In Sodom, the townsmen threaten the visitors. In the ancient Near East, protecting guests was a sacred duty, so Sodom's behavior was shocking to every culture around it.","In Genesis 17, just before these events, God gives circumcision as the sign of his covenant. Other peoples, including Egyptians, practiced it too. A tomb carving at Saqqara in Egypt shows it being performed. But for Abraham's family it became a sign that they belonged to the LORD."]}],"people":[{"name":"Lot","role":"Abraham's nephew, rescued from Sodom"},{"name":"Josephus","role":"Jewish historian who described the Dead Sea in the first century AD"}],"source":{"title":"The Jewish War, Book 4","who":"Josephus","date":"About AD 75","text":"Josephus describes the Dead Sea as so buoyant that heavy things thrown into it float. He says the Roman general Vespasian had some men who could not swim thrown in with their hands tied, and they all floated. He also mentions chunks of bitumen rising to the surface, and says traces of the burned cities of Sodom could still be seen in the area.","note":"Paraphrased. Josephus wrote about 1,800 years after Abraham, so he's reporting what people of his time believed about the region, not eyewitness evidence of Sodom."},"vocab":[["Salt Sea","The Bible's name for the Dead Sea"],["Evaporation","When water turns to vapor and leaves minerals behind"],["Hospitality","Welcoming and protecting guests"],["Circumcision","The covenant sign God gave Abraham's family"]],"map":{"view":"local","places":["hebron","deadsea","sodom","hammam"],"caption":"Two proposed areas for Sodom: the southeast Dead Sea (Bab edh-Dhra) and Tall el-Hammam to the northeast. Abraham watched the smoke from the hills near Hebron."},"timeline":[{"y":75,"t":"Josephus describes the Dead Sea (about AD 75)"}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 2)","https://watch.tbn.org/s/83iA4eRN?e=8Tqdqvqx"]],"quiz":[{"q":"About how far below sea level is the Dead Sea?","options":["14 feet","140 feet","More than 1,400 feet","14,000 feet"],"answer":2,"why":"It's the lowest land on earth."},{"q":"Why can't fish live in the Dead Sea?","options":["It's too cold","It's extremely salty","It's too deep","It's frozen"],"answer":1,"why":"About ten times saltier than the ocean."},{"q":"What did Greeks call the Dead Sea?","options":["Lake Asphaltites","The Great Sea","Lake Galilee","The Red Sea"],"answer":0,"why":"Because of floating bitumen."},{"q":"Is Sodom's location known for certain?","options":["Yes, it's marked by a sign","No, scholars propose several sites","It was in Egypt","It was under Jerusalem"],"answer":1,"why":"Several sites have been proposed."},{"q":"What did Ezekiel 16:49 name as sins of Sodom?","options":["Laziness","Arrogance and neglect of the poor","Building towers","Eating pork"],"answer":1,"why":"Along with other sins Genesis describes."}],"assignment":"Science experiment: fill two cups with water, stir lots of salt into one, and try floating an egg in each. Write up what happened and explain how it connects to the Dead Sea."},{"id":"ohist-13","bible":"gen-13","bibleTitle":"Isaac Is Born","title":"Wells, Water, and Beersheba","era":"About 2000-1800 BC","intro":"In a dry land, a well could mean life or death. Genesis 21 and 26 are full of arguments over wells, and the town of Beersheba is named after one.","sections":[{"h":"Life at the Edge of the Desert","p":["Beersheba lies in the Negev, the dry southern region of Canaan, where rain falls only a few inches a year. Herders like Abraham and Isaac dug deep wells to reach groundwater for their families and flocks. Digging one was hard work, so wells were valuable property.","That's why Abimelech's servants seized Abraham's well, and why Isaac's servants and the herders of Gerar later quarreled over several wells (Genesis 26). Isaac gave the wells names that told the story: Esek ('dispute'), Sitnah ('opposition'), and finally Rehoboth ('room')."]},{"h":"The Well of the Oath","p":["Abraham settled his dispute with Abimelech by making a covenant and giving him seven ewe lambs as proof that he had dug the well. The place was named Beersheba. In Hebrew, be'er means well, and sheba can mean both 'seven' and 'oath.'","Later, 'from Dan to Beersheba' became the Bible's way of saying 'the whole land,' from its northern to its southern edge. Archaeologists have excavated Tel Beersheba, which in 2005 became a UNESCO World Heritage Site along with Megiddo and Hazor. Its large well and water systems come from later periods, but they show how central water always was to life there."]},{"h":"An Egyptian Remembers Canaan","p":["An Egyptian story from around 1900 BC tells of Sinuhe, an official who fled Egypt and lived for years among the tribal peoples of Canaan and Syria. He describes a good land full of figs and grapes, olives, grain, and herds, where he became a wealthy chief with a household.","His story gives a picture of the land the patriarchs lived in: a mix of farming towns and herding chiefs, hospitality to travelers, and constant concern for water and flocks."]}],"people":[{"name":"Abimelech","role":"King of Gerar who made a treaty with Abraham"},{"name":"Sinuhe","role":"Egyptian official and hero of a famous story about life in Canaan"},{"name":"Yohanan Aharoni","role":"Israeli archaeologist who excavated Tel Beersheba (1969-1976)"}],"source":{"title":"The Story of Sinuhe","who":"An Egyptian writer","date":"About 1900 BC","text":"Sinuhe describes the land where he settled: it had figs and grapes, and more wine than water. Its honey was plentiful and its olive trees many; every kind of fruit was on its trees. There was barley and wheat, and countless cattle of every kind.","note":"Paraphrased. This Egyptian story was a classic that students copied for centuries. Compare it with the Bible's description of Canaan as 'a land flowing with milk and honey.'"},"vocab":[["Negev","The dry southern region of Israel"],["Groundwater","Water held underground that wells can reach"],["Beersheba","'Well of seven' or 'well of the oath'"],["UNESCO World Heritage Site","A place recognized worldwide as important to protect"]],"map":{"view":"local","places":["beersheba","gerar","hebron"],"caption":"Beersheba and Gerar lie in the dry Negev, south of the hill country around Hebron."},"timeline":[{"y":-1900,"t":"The Story of Sinuhe is written (about 1900 BC)"},{"y":2005,"t":"Tel Beersheba becomes a UNESCO World Heritage Site","d":true}],"video":[["Drive Thru History: Covenants, Kings and the Promised Land (Part 1)","https://watch.tbn.org/s/83iA4eRN?e=kxs2c1hg"]],"quiz":[{"q":"What does 'be'er' mean in Hebrew?","options":["Tent","Well","Sheep","Oath"],"answer":1,"why":"Beersheba = well of seven/oath."},{"q":"What did Abraham give Abimelech as proof about the well?","options":["Gold","Seven ewe lambs","A camel","A sword"],"answer":1,"why":"Genesis 21:28-30."},{"q":"What does 'from Dan to Beersheba' mean?","options":["A long trip","The whole land of Israel","Two cities at war","A trade route"],"answer":1,"why":"North to south."},{"q":"What did Isaac name the well where there was no quarrel?","options":["Esek","Sitnah","Rehoboth ('room')","Bethel"],"answer":2,"why":"God had made room for them."},{"q":"What is Sinuhe?","options":["A Babylonian law","An Egyptian story describing Canaan","A king of Gerar","A kind of well"],"answer":1,"why":"About 1900 BC."}],"assignment":"Track how much water your family uses in one day (count glasses, showers, loads of laundry). Then write a paragraph imagining life in the Negev where every drop came from a well you had to dig and draw from by hand."},{"id":"ohist-14","bible":"gen-14","bibleTitle":"Abraham's Hardest Test","title":"Mount Moriah Through History","era":"About 2000 BC to today","intro":"The mountain where Abraham offered Isaac became one of the most important places on earth. Three thousand years of history have been built on top of it.","sections":[{"h":"A God Unlike the Others","p":["Sadly, some ancient peoples did offer children to their gods in times of crisis. Later in the Bible, the Canaanites and the king of Moab are described doing this (2 Kings 3:27), and God's law strictly forbade it (Leviticus 18:21; Deuteronomy 12:31).","So the ending of Genesis 22 would have stood out in the ancient world. Abraham's God stopped the knife and provided a ram instead. The LORD showed that he doesn't want his people to give their children to death; he himself provides the sacrifice."]},{"h":"From Moriah to the Temple","p":["Genesis says Abraham went to 'the region of Moriah.' Much later, 2 Chronicles 3:1 says Solomon built the temple 'on Mount Moriah,' where the LORD had appeared to David. Jewish tradition connects the two: the place of Abraham's sacrifice became the place where Israel's sacrifices were offered.","Solomon's temple was built around 960 BC and destroyed by Babylon in 586 BC. A second temple was built after the exile, and Herod the Great expanded it hugely. The Romans destroyed that temple in AD 70."]},{"h":"The Temple Mount Today","p":["In AD 691, Muslim rulers completed the Dome of the Rock on the same platform, over a large rock that Jewish and Muslim traditions both connect with Abraham's sacrifice. Its golden dome is now one of the most recognizable sights in Jerusalem.","Today the Temple Mount is holy to Jews, Christians, and Muslims, and it's one of the most sensitive places in the world. Christians also note that Jesus, whom John the Baptist called 'the Lamb of God,' was crucified just outside the city walls, not far from Moriah."]}],"people":[{"name":"Solomon","role":"King of Israel who built the first temple on Mount Moriah"},{"name":"Josephus","role":"Jewish historian who retold the story of Isaac's sacrifice"}],"source":{"title":"Jewish Antiquities, Book 1","who":"Josephus","date":"About AD 93","text":"Josephus retells Genesis 22 and says Isaac was 25 years old at the time. When Abraham explained what God had commanded, Isaac answered that he would be unworthy to have been born if he refused what God and his father had decided, and he went to the altar willingly.","note":"Paraphrased. Josephus is adding Jewish tradition to the Bible's account. Genesis doesn't give Isaac's age, but it does show that a young man strong enough to carry the wood up the mountain went along with his elderly father."},"vocab":[["Moriah","The region where Abraham offered Isaac; later the Temple Mount"],["Temple Mount","The platform in Jerusalem where the temples stood"],["Dome of the Rock","An Islamic shrine completed in AD 691 on the Temple Mount"],["Substitute","Someone or something that takes another's place"]],"map":{"view":"local","places":["beersheba","jerusalem","hebron"],"caption":"Abraham traveled about three days from the Beersheba area to the region of Moriah, later Jerusalem."},"timeline":[{"y":-960,"t":"Solomon builds the temple on Mount Moriah (about 960 BC)"},{"y":691,"t":"The Dome of the Rock is completed on the Temple Mount"}],"video":[],"quiz":[{"q":"What did God's law say about child sacrifice?","options":["It was allowed","It was strictly forbidden","It was required once","It didn't say"],"answer":1,"why":"Leviticus 18:21; Deuteronomy 12:31."},{"q":"Where did Solomon build the temple?","options":["Mount Sinai","Mount Moriah","Mount Hermon","Mount Carmel"],"answer":1,"why":"2 Chronicles 3:1."},{"q":"According to Josephus, how old was Isaac?","options":["5","12","25","40"],"answer":2,"why":"A Jewish tradition Josephus recorded."},{"q":"When was the Dome of the Rock completed?","options":["960 BC","AD 70","AD 691","AD 1948"],"answer":2,"why":"It stands on the Temple Mount."},{"q":"What does the ram in Genesis 22 show?","options":["God provides a substitute","Abraham was a shepherd","Rams were holy","Nothing"],"answer":0,"why":"'The LORD will provide.'"}],"assignment":"Make a timeline of Mount Moriah: Abraham, Solomon's temple, its destruction, the second temple, Herod's rebuilding, AD 70, and the Dome of the Rock. Add one sentence for each."},{"id":"ohist-15","bible":"gen-15","bibleTitle":"A Wife for Isaac","title":"Camels, Caravans, and Marriage Gifts","era":"About 2000-1800 BC","intro":"Abraham's servant set out with ten camels loaded with gifts. The camels, the jewelry, and the marriage arrangements all open windows into ancient life, and one of them has sparked a lively debate among archaeologists.","sections":[{"h":"The Camel Debate","p":["Camels can go days without water and carry heavy loads, making them perfect for desert travel. But when did people start using them? In 2014, two Israeli archaeologists studied camel bones at copper mines in southern Israel and argued that domesticated camels became common in Israel only around the 900s BC, centuries after Abraham.","Other scholars point to earlier evidence, such as camel figurines, bones, and texts, suggesting camels were already used in smaller numbers before then. Genesis presents camel
