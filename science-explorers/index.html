<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sci Explorers">
<meta name="theme-color" content="#3a2a9e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Science Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a44;--soft:#5b6785;--sun:#ffc93c;--leaf:#4cc38a;--berry:#ff6b8b;--ocean:#3aa0ff;--radius:22px;--c:#3aa0ff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#d9f0ff 0%,#f4fbff 60%,#fff7e3 100%);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:disabled{cursor:default}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(21px,4vw,28px);background:none;padding:0}
.logo .flask{font-size:1.35em;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.hbtns{display:flex;gap:8px;align-items:center}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:0 4px 0 #cfe3f5;font-size:16px}
button.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #cfe3f5}
h1{font-size:clamp(25px,4.6vw,38px);margin:4px 0 6px}
h2{font-size:clamp(21px,3.4vw,26px);margin:26px 0 10px}
.lead{color:var(--soft);font-size:clamp(17px,2.3vw,20px);margin:0 0 18px}
.note{color:var(--soft);font-size:15px}
.screen{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.panel{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:0 8px 0 #d7e8f6}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:16px;margin-bottom:6px}
.crumbs button{background:none;color:var(--soft);text-decoration:underline;font-size:16px;padding:0}

.btn{background:var(--c);color:#fff;font-size:19px;font-weight:600;border-radius:16px;padding:12px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.small{font-size:16px;padding:9px 16px;border-radius:13px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cfdcee}
.btn.green{background:#2fa864}
.btn.danger{background:#fff;color:#c9304f;box-shadow:0 4px 0 #f2c3cd}
.btn:disabled{opacity:.45}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.center{text-align:center}
.err{color:#c9304f;font-weight:500;min-height:24px;margin:8px 0 0}
.msg{font-size:19px;min-height:28px;margin:12px 0 0;font-weight:500}

/* home */
.starbar{height:16px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px #cfe3f5;margin:-6px 0 20px;max-width:520px}
.starbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc93c,#ff9f1c);border-radius:999px;transition:width .4s}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.utile{border-radius:var(--radius);padding:18px;text-align:left;color:#fff;min-height:175px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 7px 0 rgba(0,0,0,.16);transition:transform .15s;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff))}
.utile:hover{transform:translateY(-3px) rotate(-.5deg)}
.utile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.utile .ic{font-size:50px;line-height:1}
.utile .un{font-size:14px;opacity:.9;font-weight:500}
.utile b{font-size:23px;display:block;margin-top:2px}
.ubar{height:10px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden;margin-top:10px}
.ubar i{display:block;height:100%;background:#fff;border-radius:999px}
.utile .done{font-size:14px;font-weight:600;margin-top:6px}

/* unit page */
.uhead{border-radius:var(--radius);padding:20px;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 7px 0 rgba(0,0,0,.14);display:flex;gap:16px;align-items:center}
.uhead .ic{font-size:64px}
.uhead h1{margin:0}
.uhead p{margin:4px 0 0;font-size:18px;opacity:.95}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
.step{background:#fff;border-radius:18px;padding:14px 16px;text-align:left;box-shadow:0 5px 0 #d7e8f6;display:flex;gap:12px;align-items:center;border:3px solid transparent;min-height:84px}
.step:hover{border-color:var(--c)}
.step .si{font-size:36px;flex:0 0 auto}
.step b{display:block;font-size:18px}
.step small{color:var(--soft);font-size:14px}
.step .st{margin-left:auto;font-size:18px;white-space:nowrap;color:#e3a008;letter-spacing:1px}
.step.isdone{background:#f1fbf5}

/* lesson */
.lesson-grid{display:grid;grid-template-columns:1fr;gap:16px}
.read{font-size:clamp(18px,2.4vw,21px);line-height:1.5}
.read p{margin:0 0 10px}
.read b{color:var(--c)}
.words{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.wcard{background:#f4f7ff;border-radius:14px;padding:10px 14px;font-size:17px;text-align:left;box-shadow:0 3px 0 #dde5f5;min-width:140px;max-width:300px;border-left:6px solid var(--c)}
.wcard b{display:block;font-size:19px}
.wcard span{color:var(--soft);font-size:15px}
.wcard.flip span{color:var(--ink);font-size:16px}
.seeit{border:4px solid var(--c);border-radius:var(--radius);padding:16px;background:#fff}
.goal{display:flex;gap:10px;align-items:flex-start;font-size:19px;font-weight:600;margin:0 0 12px}
.goal .tag{background:var(--c);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap;margin-top:2px}
.donebar{display:none;margin-top:14px;background:#e9fbf0;border-radius:16px;padding:14px;align-items:center;gap:12px;flex-wrap:wrap;font-size:19px;font-weight:600}
.donebar.on{display:flex}
.watchcard{display:flex;gap:14px;align-items:center;background:#eef6ff;border-radius:18px;padding:12px 14px;flex-wrap:wrap}
.vthumb{position:relative;width:200px;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;padding:0;background:#000;flex:none;box-shadow:0 4px 0 #cfe3f5}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,0,0,.88);color:#fff;font-size:24px;display:grid;place-items:center;padding-left:4px}
.wtext{display:grid;gap:2px;font-size:18px;flex:1;min-width:180px}
.wtext small{color:#5b6785;font-size:15px}
.watchcard .vframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.watchcard .vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vhelp{color:#5b6785;font-size:15px}
.home-try{background:#fff8e0;border-radius:18px;padding:14px 16px;font-size:18px}
.home-try b{display:block;margin-bottom:2px}
.sec-t{font-size:15px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}

/* shared activity bits */
.act{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eef3ff;color:#3d4aa8;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:600}
.chip.on{background:#2fa864;color:#fff}
.tbtn{background:#fff;border-radius:16px;padding:10px 14px;font-size:18px;font-weight:600;box-shadow:0 4px 0 #d3dcec;border:3px solid #e3e9f5}
.tbtn.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.tbtn.good{background:#d8f6e4;border-color:#2fa864}
.tbtn.bad{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.big{font-size:64px;line-height:1}
.stage{border-radius:18px;background:#f4f9ff;overflow:hidden;position:relative}
svg text{font-family:"Fredoka",system-ui,sans-serif}
input[type=range]{width:100%;accent-color:var(--c);height:30px}
.slider-row{display:flex;align-items:center;gap:12px;font-size:18px;margin-top:10px}
.slider-row input{flex:1}
.out{font-weight:700;min-width:70px;text-align:right}

/* order game */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.slot{min-height:92px;border:3px dashed #c9d6ea;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:15px;color:var(--soft)}
.slot.filled{border-style:solid;border-color:#2fa864;background:#effbf4;color:var(--ink);font-weight:600}
.slot .e{font-size:34px}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pool .tbtn{display:flex;flex-direction:column;align-items:center;min-width:110px}
.pool .tbtn .e{font-size:34px}

/* games */
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gkind{background:var(--c);color:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:15px}
.howto{color:var(--soft);font-size:17px;margin:0 0 14px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colw{display:flex;flex-direction:column;gap:10px}
.tcard{background:#f4f7ff;border-radius:14px;padding:12px 14px;font-size:17px;text-align:left;box-shadow:0 4px 0 #d7e0f2;border:3px solid transparent;min-height:56px}
.tcard.word{font-weight:700;font-size:19px}
.tcard.sel{border-color:var(--c);background:#fff}
.tcard.done{background:#d8f6e4;box-shadow:0 4px 0 #9fe0b9;opacity:.75}
.tcard.badflash{background:#ffd6de;animation:shake .4s}
.sortcard{font-size:clamp(26px,5vw,38px);font-weight:600;text-align:center;background:#f6f9ff;border-radius:20px;padding:26px 10px;margin-bottom:14px;min-height:110px;display:flex;align-items:center;justify-content:center}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bins .tbtn{min-height:70px;font-size:19px}
.climbwrap{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:16px;align-items:center}
@media (max-width:640px){.climbwrap{grid-template-columns:1fr}.board{grid-template-columns:1fr}}
.qcard{background:#f6f9ff;border-radius:20px;padding:20px}
.qtext{font-size:clamp(21px,3.4vw,26px);font-weight:600;margin:0 0 14px}
.tf{display:flex;gap:12px;flex-wrap:wrap}
.tf .btn{flex:1;min-width:140px;font-size:21px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:#f2f6ff;border-radius:16px;padding:16px;font-size:19px;text-align:left;box-shadow:0 4px 0 #d7e0f2;font-weight:500;border:3px solid transparent}
.opt.right{background:#c9f5dc;box-shadow:0 4px 0 #7fd3a3}
.opt.wrong{background:#ffd6de;box-shadow:0 4px 0 #f59aae}
.why{background:#fff8e0;border-radius:14px;padding:12px 14px;font-size:18px;margin-top:14px}
.progress{height:12px;background:#e6eef9;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--c);transition:width .3s}
.result{text-align:center;padding:10px}
.result .stars3{font-size:54px;letter-spacing:6px;margin:6px 0}

/* names & parent */
.names{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 20px}
.name-btn{background:#fff;border-radius:18px;padding:16px 22px;font-size:22px;font-weight:600;box-shadow:0 5px 0 #cfe3f5;min-width:140px}
.name-btn small{display:block;font-size:15px;color:var(--soft);font-weight:500}
.add-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.txt,.pinbox input,textarea{font-family:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid #cfe3f5;outline:none}
input.txt:focus,.pinbox input:focus{border-color:var(--ocean)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.badge{background:#fff;border-radius:16px;padding:12px;text-align:center;font-size:14px;box-shadow:0 4px 0 #e2ebf7}
.badge b{display:block;font-size:16px;margin-top:4px}
.badge .bi{font-size:34px}
.badge.locked{opacity:.4;filter:grayscale(1)}
.foot{text-align:center;margin-top:34px}
.link{background:none;color:var(--soft);font-size:16px;text-decoration:underline}
.pinbox{max-width:380px;margin:0 auto;text-align:center}
.pinbox input{width:160px;text-align:center;letter-spacing:10px;font-size:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:#eef3ff;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600;color:#3d4aa8}
.tabs button[aria-pressed=true]{background:var(--ocean);color:#fff}
table.hist{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
table.hist th,table.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid #e6eef9;vertical-align:top}
textarea{width:100%;font-size:14px;font-family:ui-monospace,monospace}
.panel h3{margin:22px 0 6px;font-size:20px}
.confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.8s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:10px 18px;border-radius:999px;font-size:17px;font-weight:600;z-index:10;animation:pop .3s}
</style>
<script src="../parent-pin.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <button class="logo" id="brand"><span class="flask">🧪</span> Science Explorers</button>
    <div class="hbtns">
      <button class="pill" id="whoBtn" style="display:none"></button>
      <span class="pill" id="starPill" style="display:none">⭐ <span id="starCount">0</span></span>
    </div>
  </header>
  <main id="app"></main>
</div>
<script>
/* ============ CONTENT: 7 units, 3 lessons each ============ */
const UNITS = [
{
  id:'create', name:"God's Created World", icon:'🌎', color:'#7c5cf0',
  blurb:'How God made everything in six days, the variety He put in each kind, and what fossils tell us about the Flood.',
  lessons:[
    { t:'Six Days of Creation', icon:'✨', act:'days',
      read:`<p>In the beginning, God <b>created</b> the heavens and the earth. He made everything in <b>six days</b>, and on the seventh day He rested.</p><p>When God finished, He looked at everything He had made, and it was <b>very good</b>!</p>`,
      words:[['Create','To make something new'],['Creator','God, who made everything']],
      goal:'Put the six days of creation in order.',
      home:'Draw a picture of your favorite day of creation. Tell someone what God made that day.' },
    { t:'Created Kinds', icon:'🐕', act:'dog',
      read:`<p>God made animals to have babies <b>after their kind</b>. A dog's puppies are always dogs!</p><p>But God put lots of <b>variety</b> inside each kind. That is why there are big dogs, tiny dogs, fluffy dogs, and spotted dogs. They are all still dogs.</p>`,
      words:[['Kind','A family of animals that can have babies together'],['Variety','Differences inside one kind'],['Trait','Something about how a living thing looks or acts']],
      goal:'Change the dog\'s traits. Try 4 different buttons. Is it still a dog?',
      home:'Look at pictures of 5 dog breeds. What traits are different? What stays the same?' },
    { t:'Fossils and the Flood', icon:'🦴', act:'dig',
      read:`<p>A <b>fossil</b> is what is left of a plant or animal that lived long ago, turned into stone. Most fossils form when a living thing is buried <b>quickly</b> in mud.</p><p>The Bible tells about a worldwide <b>Flood</b> in Noah's day. Its rushing water and mud buried huge numbers of plants and animals all at once. That made many of the fossils we find in rock <b>layers</b> today.</p>`,
      words:[['Fossil','What is left of a living thing, turned into stone'],['Layer','A flat band of rock or mud'],['Flood','When water covers land that is usually dry']],
      goal:'Dig through the rock layers. Find all 4 hidden fossils!',
      home:'Press a shell or a leaf into play dough. Lift it off. You made a model fossil!' }
  ],
  match:[['Create','To make something new'],['Creator','God, who made everything'],['Kind','An animal family that has babies together'],['Variety','Differences inside one kind'],['Fossil','A living thing from long ago, turned to stone'],['Layer','A flat band of rock or mud']],
  sort:{ bins:['Days 1–3','Days 4–6'], items:[['💡 Light',0],['🌊 Sky and seas',0],['⛰️ Dry land',0],['🌳 Plants and trees',0],['☀️ Sun and moon',1],['⭐ Stars',1],['🐟 Fish',1],['🐦 Birds',1],['🐘 Land animals',1],['🧑 People',1]] },
  facts:[['God made everything in six days.',true],['On the seventh day, God rested.',true],['God made people on Day 1.',false,'God made people on Day 6.'],['God made plants on Day 3.',true],['A dog can have kittens.',false,'Animals have babies after their kind. Dogs have puppies.'],['There is lots of variety inside one kind.',true],['A fossil is made of plastic.',false,'A fossil is a living thing from long ago, turned into stone.'],['Most fossils form when things are buried quickly.',true],['God made the sun, moon, and stars on Day 4.',true],['God said what He made was very good.',true]],
  quiz:[['On which day did God make people?',['Day 1','Day 3','Day 6','Day 7'],2,'God made land animals and people on Day 6.'],
        ['What did God do on the seventh day?',['Made fish','Rested','Made light','Made plants'],1,'God rested on Day 7.'],
        ['A poodle and a wolf belong to which kind?',['Cat kind','Dog kind','Horse kind','Bear kind'],1,'Poodles and wolves are both part of the dog kind.'],
        ['What is a fossil?',['A kind of candy','A living thing from long ago, turned to stone','A baby dinosaur','A toy from the store'],1,'Fossils are the stony remains of plants and animals.'],
        ['Most fossils formed when living things were…',['Left in the sun','Buried quickly in mud','Kept in a freezer','Eaten by birds'],1,'Things must be buried fast, before they rot, to become fossils.'],
        ['What did God make on Day 4?',['Sun, moon, and stars','Fish and birds','Plants','People'],0,'On Day 4 God made lights in the sky: the sun, moon, and stars.']]
},
{
  id:'plants', name:'Plants', icon:'🌱', color:'#2fa864',
  blurb:'The parts of a plant and their jobs, what plants need to grow, and the plant life cycle.',
  lessons:[
    { t:'Parts of a Plant', icon:'🌷', act:'plantparts',
      read:`<p>On Day 3, God made plants. Every part of a plant has a job.</p><p><b>Roots</b> soak up water and hold the plant in the ground. The <b>stem</b> holds the plant up and carries water. <b>Leaves</b> use sunlight to make food. <b>Flowers</b> make seeds to grow new plants.</p>`,
      words:[['Roots','Soak up water and hold the plant in the ground'],['Stem','Holds the plant up and carries water'],['Leaves','Use sunlight to make food'],['Flower','Makes seeds']],
      goal:'Find each part of the plant when it asks you.',
      home:'Carefully pull up a weed. Can you find its roots, stem, and leaves?' },
    { t:'What Plants Need', icon:'💧', act:'grow',
      read:`<p>Plants need <b>sunlight</b>, <b>water</b>, and <b>air</b> to grow. They also need good <b>soil</b> and room to grow.</p><p>Here is something amazing: a plant uses sunlight, water, and air to make its very own food!</p>`,
      words:[['Sunlight','Light from the sun that plants use to make food'],['Soil','The dirt plants grow in']],
      goal:'Give your seed sunlight, water, and air until it blooms.',
      home:'Plant a bean seed in a cup of soil. Put it by a window, water it, and check it every day!' },
    { t:"A Plant's Life Cycle", icon:'🔄', act:'plantcycle',
      read:`<p>A <b>life cycle</b> is how a living thing grows and changes. A plant starts as a <b>seed</b>. The seed <b>sprouts</b> and grows into a young plant.</p><p>The grown plant makes flowers. The flowers make <b>fruit</b> with new seeds inside, and the cycle starts all over again!</p>`,
      words:[['Life cycle','How a living thing grows and changes'],['Seed','A tiny plant waiting to grow'],['Sprout','When a seed starts to grow']],
      goal:'Put the plant\'s life cycle in order.',
      home:'Cut open an apple with a grown-up. Count the seeds. Each one could grow a new tree!' }
  ],
  match:[['Roots','Soak up water and hold the plant down'],['Stem','Carries water up the plant'],['Leaves','Use sunlight to make food'],['Flower','Makes seeds'],['Seed','A tiny plant waiting to grow'],['Life cycle','How a living thing grows and changes']],

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const unitById = id => UNITS.find(u=>u.id===id);
function confetti(n=14){
  const bits=['⭐','✨','🎉','🌟'];
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='confetti'; s.textContent=bits[i%bits.length];
    s.style.left=Math.random()*100+'vw'; s.style.animationDelay=(Math.random()*.4)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),2400); }
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const IDB = {
  open(){ return new Promise((res,rej)=>{ try{ const r = indexedDB.open("g3science",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
  async put(v){ try{ const db = await IDB.open(); await new Promise((res,rej)=>{ const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,"state"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }catch(e){} },
  async get(){ try{ const db = await IDB.open(); return await new Promise((res,rej)=>{ const r = db.transaction("kv").objectStore("kv").get("state"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }catch(e){ return null; } }
};
function snapshot(){ const o = {}; try{ for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith("g3-")) o[k] = localStorage.getItem(k); } }catch(e){} return o; }
let _mirrorT = null;
const _lsSet = LS.set;
LS.set = (k,v) => { const ok = _lsSet(k,v); clearTimeout(_mirrorT); _mirrorT = setTimeout(() => IDB.put(snapshot()), 250); return ok; };
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

const saveAll = () => { LS.set("g3-roster",roster); LS.set("g3-student",student); LS.set("g3-prog",prog); LS.set("g3-results",results); };
function upgrade(){ // stars from the first version used a different system; keep the names, start the stars fresh
  Object.values(prog).forEach(p => { if (p && !p.best){ p.best = {}; delete p.earned; } });
  results = results.filter(r => r.unit);
}

const STAR_MAX = UNITS.length * UNIT_MAX;
const P = (s=student) => { if(!prog[s]) prog[s] = {best:{},last:null}; if(!prog[s].best) prog[s].best={}; return prog[s]; };
const best = (s,key) => P(s).best[key] || 0;
const lessonDone = (s,u,i) => best(s,`${u}-L${i}`) > 0;
const lessonsDone = (s,u) => [0,1,2].filter(i=>lessonDone(s,u,i)).length;
function unitStars(s,u){ return Object.entries(P(s).best).filter(([k])=>k.startsWith(u+'-')).reduce((a,[,v])=>a+v,0); }
function starsFor(s){ return UNITS.reduce((a,u)=>a+unitStars(s,u.id),0); }
function award(key, stars){
  if(!student) return 0;
  const was = best(student,key);
  P().last = Date.now();
  if(stars > was){ P().best[key] = stars; saveAll(); updateStars(); confetti(stars>1?14:6); return stars - was; }
  saveAll(); return 0;
}
function logResult(r){ results.push(Object.assign({student, at:new Date().toISOString()}, r)); saveAll(); }
function updateStars(){ $('#starCount').textContent = student ? starsFor(student) : 0; }
const starStr = n => '★'.repeat(n) + '☆'.repeat(3-n);

const unitMaster = (s,u) => lessonsDone(s,u.id)===3 && best(s,u.id+'-quiz')>=2;
function badgeList(s){
  const mine = results.filter(r=>r.student===s);
  return [
    {i:'🌟', n:'First Star', d:'Earn your first star', ok: starsFor(s)>=1},
    ...UNITS.map(u => ({i:u.icon, n:`${u.name} Explorer`, d:'Finish all 3 lessons and get 2+ stars on the quiz', ok: unitMaster(s,u)})),
    {i:'🔤', n:'Word Wizard', d:'Get 3 stars in Word Match', ok: mine.some(r=>r.kind==='match'&&r.stars===3)},
    {i:'🚩', n:'Summit', d:'Plant the flag in Fact Climb', ok: mine.some(r=>r.kind==='climb'&&r.stars===3)},
    {i:'💯', n:'Perfect Score', d:'Get every question right on a quiz', ok: mine.some(r=>r.kind==='quiz'&&r.right===r.total)},
    {i:'🏅', n:'Super Scientist', d:`Earn all ${STAR_MAX} stars`, ok: starsFor(s)>=STAR_MAX}
  ];
}
const badgeHTML = s => badgeList(s).map(b=>`<div class="badge ${b.ok?'':'locked'}"><div class="bi">${b.i}</div><b>${esc(b.n)}</b>${esc(b.d)}</div>`).join('');

/* ============ NAVIGATION ============ */
let view = {page:'pick'};
let cleanup = null;
function go(v){
  if (cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
  view = v;
  if (!student && v.page!=='parent' && v.page!=='pick') view = {page:'pick'};
  if (view.page!=='parent') parentOK = false;
  const kid = student && view.page!=='pick' && view.page!=='parent';
  $('#whoBtn').style.display = kid ? 'inline-block' : 'none';
  $('#starPill').style.display = kid ? 'inline-block' : 'none';
  $('#whoBtn').textContent = '👤 ' + student;
  document.documentElement.style.setProperty('--c', view.unit ? unitById(view.unit).color : '#3aa0ff');
  updateStars();
  ({pick:renderPick, home:renderHome, unit:renderUnit, lesson:renderLesson, game:renderGame, parent:renderParent})[view.page]();
  window.scrollTo({top:0});
}
$('#brand').onclick = () => go({page: student ? 'home' : 'pick'});

/* ============ LESSON ACTIVITIES (part 1: creation, plants, animals) ============ */
const ACTS = {};
const q = (root, s) => root.querySelector(s);
const qa = (root, s) => [...root.querySelectorAll(s)];

/* Put-in-order engine (used by Six Days and Plant Life Cycle) */
function makeOrder(items, slotLabel, finalMsg, ask){
  ask = ask || (i => `What comes ${slotLabel(i).toLowerCase()}?`);
  return {
    html:`<div class="slots"></div><div class="pool"></div><p class="msg center"></p>`,
    init(root, done){
      let n = 0;
      const slots = q(root,'.slots'), pool = q(root,'.pool'), msg = q(root,'.msg');
      slots.innerHTML = items.map((_,i)=>`<div class="slot" data-s="${i}">${slotLabel(i)}</div>`).join('');
      pool.innerHTML = shuffle(items.map((_,i)=>i)).map(i=>`<button class="tbtn" data-i="${i}"><span class="e">${items[i].e}</span>${esc(items[i].t)}</button>`).join('');
      msg.textContent = '👆 ' + ask(0);
      qa(root,'[data-i]').forEach(b=>b.onclick=()=>{
        const i = +b.dataset.i;
        if (i===n){
          const s = q(root,`[data-s="${n}"]`); s.classList.add('filled');
          s.innerHTML = `<small>${slotLabel(n)}</small><span class="e">${items[i].e}</span>${esc(items[i].t)}`;
          b.remove(); n++;
          if (n===items.length){ msg.innerHTML = finalMsg; done(); }
          else msg.textContent = '✅ Yes! ' + ask(n);
        } else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); msg.textContent = 'Not yet! ' + ask(n); }
      });
    }
  };
}

    const CTL = [
      ['size','Size',[['small','Small'],['medium','Medium'],['big','Big']]],
      ['color','Color',[['tan','Tan'],['brown','Brown'],['black','Black'],['white','White']]],
      ['ears','Ears',[['floppy','Floppy'],['pointy','Pointy']]],
      ['coat','Fur',[['short','Short'],['fluffy','Fluffy']]],

      const [c,d] = COLORS[st.color], s = {small:.65,medium:.9,big:1.15}[st.size], leg = {short:22,medium:38,long:56}[st.legs];
      const outline = st.color==='white' ? 'stroke="#b8ad9a" stroke-width="2"' : '';

      const ears = st.ears==='floppy'
        ? `<ellipse cx="206" cy="92" rx="10" ry="24" fill="${d}" transform="rotate(18 206 92)"/>`
        : `<polygon points="200,70 210,36 224,66" fill="${d}"/>`;

      const legs = [100,122,172,194].map(x=>`<rect x="${x}" y="135" width="14" height="${leg}" rx="6" fill="${c}" ${outline}/>`).join('');
      svg.innerHTML = `<ellipse cx="150" cy="${205}" rx="${80*s}" ry="8" fill="#000" opacity=".12"/>

          <path d="M84 112 Q60 96 58 70" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/>
          ${legs}
          <ellipse cx="150" cy="118" rx="72" ry="34" fill="${c}" ${fluff}/>
          ${spots}
          <circle cx="222" cy="86" r="30" fill="${c}" ${fluff}/>
          <ellipse cx="250" cy="98" rx="18" ry="12" fill="${c}" ${outline}/>
          <circle cx="266" cy="94" r="5" fill="#222"/><circle cx="230" cy="78" r="4.5" fill="#222"/>
          <path d="M248 108 Q256 114 262 108" stroke="#222" stroke-width="2" fill="none"/>
          ${ears}

      ctl.innerHTML = CTL.map(([k,label,opts])=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="min-width:60px">${label}</b>${opts.map(([v,t])=>`<button class="tbtn ${st[k]===v?'sel':''}" data-k="${k}" data-v="${v}" style="padding:7px 12px;font-size:16px">${t}</button>`).join('')}</div>`).join('');
      qa(ctl,'[data-k]').forEach(b=>b.onclick=()=>{ st[b.dataset.k]=b.dataset.v; changed.add(b.dataset.k); draw(); });

    const FOSSILS = [['🐚','Shell','Sea shells are the most common fossils. Some are even found on top of mountains!'],
      ['🐟','Fish','This fish was buried so fast it had no time to rot away.'],
      ['🍃','Leaf','Even a soft leaf can become a fossil if mud covers it quickly.'],
      ['🦴','Dinosaur bone','Dinosaurs lived on land. Mud from the Flood buried many of them.']];

/* ============ LESSON ACTIVITIES (part 2: matter, forces, weather, space) ============ */
const raf = fn => { let id, on = true; const loop = () => { if(!on) return; fn(); id = requestAnimationFrame(loop); }; loop(); return () => { on=false; cancelAnimationFrame(id); }; };

/* States of matter: particles */
ACTS.particles = {
  html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center" class="pm">
    <div style="position:relative;height:260px;border-radius:0 0 40px 40px;border:6px solid #9cc7e8;border-top:none;background:#f5fbff;overflow:hidden"><canvas style="display:block;width:100%;height:100%"></canvas></div>
    <div><p class="qtext sname" style="font-size:32px;margin:0"></p><p class="sdesc" style="font-size:18px;line-height:1.45;color:var(--soft)"></p><div class="chips schips"></div></div></div>
    <div class="slider-row">❄️ <input type="range" min="-20" max="120" value="-10" aria-label="Heat"> 🔥 <span class="out"></span></div>`,
  init(root, done){
    const cv=q(root,'canvas'), ctx=cv.getContext('2d'), sl=q(root,'input');
    const S={solid:['Solid 🧊','Ice is a <b>solid</b>. The particles are packed tight and just wiggle in place. A solid keeps its own shape.'],
      liquid:['Liquid 💧','Water is a <b>liquid</b>. The particles slide past each other. A liquid takes the shape of its container.'],
      gas:['Gas ☁️','Steam is a <b>gas</b>. The particles zoom around and spread out to fill all the space they can!']};
    const seen=new Set(); let shown='', parts=[], W=0, H=0, finished=false;
    const stateOf=t=>t<0?'solid':t<100?'liquid':'gas';
    const init=()=>{ const r=cv.getBoundingClientRect(); W=cv.width=Math.max(1,r.width*devicePixelRatio); H=cv.height=Math.max(1,r.height*devicePixelRatio); parts=[];
      const R=10*devicePixelRatio, cols=8, rows=5, gap=R*2.3, x0=(W-cols*gap)/2+gap/2, y0=H-rows*gap-R;
      for(let r2=0;r2<rows;r2++)for(let c=0;c<cols;c++){const hx=x0+c*gap,hy=y0+r2*gap;parts.push({hx,hy,x:hx,y:hy,vx:Math.random()-.5,vy:Math.random()-.5,R});} };
    const label=()=>{ const T=+sl.value, s=stateOf(T); q(root,'.out').textContent=T+'°C';
      if(s!==shown){ shown=s; seen.add(s); q(root,'.sname').innerHTML=S[s][0]; q(root,'.sdesc').innerHTML=S[s][1];
        q(root,'.schips').innerHTML=['solid','liquid','gas'].map(k=>`<span class="chip ${seen.has(k)?'on':''}">${seen.has(k)?'✅':'❔'} ${k}</span>`).join(' ');
        if(seen.size===3&&!finished){finished=true;done();} } };
    sl.oninput=label; init(); label();
    const onR=()=>init(); window.addEventListener('resize',onR);
    const stop=raf(()=>{
      if(!W) return; const T=+sl.value, s=stateOf(T); ctx.clearRect(0,0,W,H);
      const sp = s==='solid'?.6 : s==='liquid'?1.6+(T/100)*1.2 : 4+(T-100)/10, top=H*.45;
      parts.forEach(p=>{
        if(s==='solid'){ p.x+=(p.hx-p.x)*.15+(Math.random()-.5)*sp; p.y+=(p.hy-p.y)*.15+(Math.random()-.5)*sp; }
        else{ p.vx+=(Math.random()-.5)*.4*sp; p.vy+=(Math.random()-.5)*.4*sp; if(s==='liquid')p.vy+=.25;
          const m=Math.hypot(p.vx,p.vy),mx=sp*1.6; if(m>mx){p.vx*=mx/m;p.vy*=mx/m;} p.x+=p.vx; p.y+=p.vy;
          const t=s==='liquid'?top:p.R; if(p.x<p.R){p.x=p.R;p.vx*=-1} if(p.x>W-p.R){p.x=W-p.R;p.vx*=-1} if(p.y<t){p.y=t;p.vy=Math.abs(p.vy)} if(p.y>H-p.R){p.y=H-p.R;p.vy*=-1} }
        ctx.beginPath(); ctx.arc(p.x,p.y,p.R,0,7); ctx.fillStyle=s==='solid'?'#7cc6f2':s==='liquid'?'#2f8df0':'#b9c6d6'; ctx.fill();
        ctx.beginPath(); ctx.arc(p.x-p.R*.3,p.y-p.R*.3,p.R*.3,0,7); ctx.fillStyle='#ffffff99'; ctx.fill(); });
    });
    return ()=>{ stop(); window.removeEventListener('resize',onR); };
  }
};

/* Phases of the moon */
function moonPhasePath(cx, cy, r, k){ // k: 0..7, 0 new, 4 full; waxing lit on the right
  if (k===0) return '';
  if (k===4) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f5f0d8"/>`;
  const p=k/8, rx=Math.abs(Math.cos(2*Math.PI*p))*r, top=`${cx} ${cy-r}`, bot=`${cx} ${cy+r}`;
  const waxing = k<4, crescent = (k===1||k===7), quarter = (k===2||k===6);
  let d;
  if (waxing) d = `M${top} A${r} ${r} 0 0 1 ${bot} ` + (quarter?`Z`:`A${rx} ${r} 0 0 ${crescent?0:1} ${top} Z`);
  else        d = `M${top} A${r} ${r} 0 0 0 ${bot} ` + (quarter?`Z`:`A${rx} ${r} 0 0 ${crescent?1:0} ${top} Z`);
  return `<path d="${d}" fill="#f5f0d8"/>`;
}

/* ---- Word Match: tap a word, then its meaning ---- */
function gameMatch(u, box, stat){
  const pairs = u.match, left = shuffle(pairs.map((_,i)=>i)), right = shuffle(pairs.map((_,i)=>i));
  let sel = null, matched = [], misses = 0;
  const draw = () => {
    stat.textContent = `${matched.length}/${pairs.length} matched · ${misses} oops`;
    box.innerHTML = `<p class="howto">Tap a word, then tap its meaning. Fewer oopses means more stars!</p>
      <div class="board"><div class="colw">${left.map(i=>`<button class="tcard word ${matched.includes(i)?'done':''} ${sel===i?'sel':''}" data-w="${i}" ${matched.includes(i)?'disabled':''}>${esc(pairs[i][0])}</button>`).join('')}</div>
      <div class="colw">${right.map(i=>`<button class="tcard ${matched.includes(i)?'done':''}" data-d="${i}" ${matched.includes(i)?'disabled':''}>${esc(pairs[i][1])}</button>`).join('')}</div></div>`;
    box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.w; draw(); });
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      if (sel===null){ toast('Tap a word first!'); return; }
      const d = +b.dataset.d;
      if (d===sel){ matched.push(d); sel=null;
        if (matched.length===pairs.length){ const st = misses===0?3:misses<=2?2:1;
          finishGame(u,'match',st,{right:pairs.length,total:pairs.length,misses},box, misses===0?'Perfect match! 🎉':`All matched with ${misses} oops${misses===1?'':'es'}!`); stat.textContent=''; return; }
        draw();
      } else { misses++; b.classList.add('badflash'); stat.textContent = `${matched.length}/${pairs.length} matched · ${misses} oops`; setTimeout(()=>b.classList.remove('badflash'),450); }
    });
  };
  draw();
}

function gameSort(u, box, stat){
  const items = shuffle(u.sort.items), bins = u.sort.bins;

  const draw = (fb='') => {
    stat.textContent = `${i+1} of ${items.length} · ${right} right`;
    box.innerHTML = `<p class="howto">Where does this card go? Tap the right group.</p>
      <div class="progress"><div style="width:${i/items.length*100}%"></div></div>

      <div class="bins">${bins.map((b,k)=>`<button class="tbtn" data-b="${k}">${esc(b)}</button>`).join('')}</div><p class="msg center" id="fb">${fb}</p>`;
    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
      const it = items[i], ok = +b.dataset.b===it[1];
      box.querySelectorAll('[data-b]').forEach(x=>x.disabled=true);

/* ---- Fact Climb: true or false, climb the mountain ---- */
const CLIMB_TOP = 7;
function climbSVG(pos){
  const steps = [];
  for (let s=0;s<=CLIMB_TOP;s++){ const x = 20 + s*24, y = 210 - s*26; steps.push([x,y]); }
  const [cx,cy] = steps[pos];
  return `<svg viewBox="0 0 220 240" width="100%" style="max-width:240px;display:block;margin:auto" aria-label="Climber on step ${pos} of ${CLIMB_TOP}">
    <rect width="220" height="240" rx="18" fill="#e8f5ff"/>
    <polygon points="0,240 200,22 220,40 220,240" fill="color-mix(in srgb, var(--c) 35%, #8fa3b8)"/>
    <polygon points="170,55 200,22 214,36 196,58 186,50" fill="#fff"/>
    ${steps.map(([x,y],s)=>`<rect x="${x-10}" y="${y+10}" width="26" height="6" rx="3" fill="${s<=pos?'#ffc93c':'#ffffffaa'}"/>`).join('')}
    <line x1="${steps[CLIMB_TOP][0]+4}" y1="${steps[CLIMB_TOP][1]+10}" x2="${steps[CLIMB_TOP][0]+4}" y2="${steps[CLIMB_TOP][1]-22}" stroke="#555" stroke-width="2"/>
    ${pos===CLIMB_TOP?`<polygon points="${steps[CLIMB_TOP][0]+4},${steps[CLIMB_TOP][1]-22} ${steps[CLIMB_TOP][0]+24},${steps[CLIMB_TOP][1]-16} ${steps[CLIMB_TOP][0]+4},${steps[CLIMB_TOP][1]-10}" fill="#e0405c"/>`:''}
    <text x="${cx+3}" y="${cy+9}" font-size="32" text-anchor="middle">🧗</text></svg>`;
}
function gameClimb(u, box, stat){
  let deck = shuffle(u.facts), k = 0, pos = 0, slips = 0, asked = 0, wrongs = [];
  const draw = (answered=null) => {
    if (k>=deck.length){ deck = shuffle(u.facts); k = 0; }
    const f = deck[k];
    stat.textContent = `Step ${pos} of ${CLIMB_TOP} · ${slips} slip${slips===1?'':'s'}`;
    box.innerHTML = `<p class="howto">Is it true or false? Each right answer climbs one step. A wrong answer slips you down one.</p>
      <div class="climbwrap">${climbSVG(pos)}
      <div class="qcard"><p class="qtext">${esc(f[0])}</p>
      ${answered===null ? `<div class="tf"><button class="btn green" id="tfT">👍 True</button><button class="btn" style="background:#e0405c" id="tfF">👎 False</button></div>`
        : `<div class="why">${answered ? '✅ <b>Right!</b> ' : '💡 <b>Oops!</b> '} It's <b>${f[1]?'true':'false'}</b>. ${esc(f[2]||'')}</div>
           <div class="ctrl"><button class="btn" id="nextF">${pos===CLIMB_TOP?'🚩 Plant the flag!':'Next ➜'}</button></div>`}
      </div></div>`;
    if (answered===null){
      const pick = v => { asked++; const ok = v===f[1];
        if (ok) pos = Math.min(CLIMB_TOP, pos+1); else { pos = Math.max(0,pos-1); slips++; wrongs.push(f[0]); }
        draw(ok); };
      $('#tfT').onclick = () => pick(true); $('#tfF').onclick = () => pick(false);
    } else {
      $('#nextF').onclick = () => {
        if (pos===CLIMB_TOP){ const st = slips===0?3:slips<=2?2:1; stat.textContent='';
          finishGame(u,'climb',st,{right:asked-slips,total:asked,missed:wrongs},box, slips===0?'You reached the top with no slips! 🚩':`You reached the top with ${slips} slip${slips===1?'':'s'}! 🚩`); return; }
        k++; draw(); };
    }
  };
  draw();
}

      <div class="big">👪</div>
      <h1 style="font-size:30px">${creating ? 'Create a parent PIN' : 'Enter your parent PIN'}</h1>
      <p class="note" style="font-size:17px">${creating ? "Pick 4 numbers. You'll need this PIN to see progress and change settings." : 'Progress and settings are behind this PIN.'}</p>
      <form id="pinform"><input id="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><br><br>
      <button class="btn" type="submit">${creating ? 'Save PIN' : 'Unlock'}</button> <button class="btn ghost" type="button" id="pinBack">Back</button></form>
      <p class="err" id="pinerr"></p></div></div>`;
    $('#pinin').focus();
    $('#pinBack').onclick = () => go({page: student?'home':'pick'});
    $('#pinform').onsubmit = e => { e.preventDefault(); const v = $('#pinin').value.trim();
      if(!/^\d{4}$/.test(v)){ $('#pinerr').textContent='Use exactly 4 numbers.'; return; }
      if(creating){ pin=v; LS.set('g3-pin',pin); window.BLEPin&&BLEPin.setPin(v); parentOK=true; renderParent(); }
      else if(v===pin){ parentOK=true; renderParent(); }
      else { $('#pinerr').textContent="That PIN doesn't match. Try again."; $('#pinin').value=''; } };
    return;
  }
  const who = roster.includes(pview.who) ? pview.who : (roster.includes(student) ? student : roster[0] || '');
  pview.who = who;
  const tabs = [['progress','📊 Progress'],['history','📝 Game history'],['settings','⚙️ Backup & settings']];
  const kidChips = roster.length ? `<div class="tabs">${roster.map(n=>`<button data-who="${esc(n)}" aria-pressed="${n===who}">${esc(n)}</button>`).join('')}</div>` : '<p class="note">No students yet. A child adds their name on the start screen.</p>';
  const uname = id => (unitById(id)||{name:id}).name;
  let body = '';
  if(pview.tab==='progress' && who){
    const p = P(who), st = starsFor(who), bl = badgeList(who);
    body = kidChips + `
      <p style="font-size:19px;margin:4px 0"><b>${esc(who)}</b>: ⭐ ${st} of ${STAR_MAX} stars · ${bl.filter(b=>b.ok).length} of ${bl.length} badges</p>
      <p class="note" style="margin-top:0">Last active: ${p.last ? fmtDate(p.last) : 'not yet'} · Games played: ${results.filter(r=>r.student===who).length}</p>
      <div style="overflow-x:auto"><table class="hist"><tr><th>Unit</th><th>Lessons</th>${GAMES.map(g=>`<th>${g.name}</th>`).join('')}<th>Stars</th></tr>
      ${UNITS.map(u=>`<tr><td>${u.icon} ${esc(u.name)}</td><td>${lessonsDone(who,u.id)}/3</td>${GAMES.map(g=>`<td style="color:#e3a008;white-space:nowrap">${starStr(best(who,u.id+'-'+g.k))}</td>`).join('')}<td><b>${unitStars(who,u.id)}</b>/${UNIT_MAX}</td></tr>`).join('')}</table></div>
      <h3>Badges</h3><div class="badges">${badgeHTML(who)}</div>`;
  } else if(pview.tab==='history' && who){
    const mine = results.filter(r=>r.student===who).sort((a,b)=>b.at.localeCompare(a.at));
    const gname = k => (GAMES.find(g=>g.k===k)||{name:k}).name;
    body = kidChips + (mine.length ? `<div style="overflow-x:auto"><table class="hist"><tr><th>When</th><th>Unit</th><th>Game</th><th>Score</th><th>Missed</th></tr>${mine.map(r=>`<tr><td>${fmtDate(r.at)}</td><td>${esc(uname(r.unit))}</td><td>${gname(r.kind)}</td><td style="white-space:nowrap"><b>${r.right}/${r.total}</b> <span style="color:#e3a008">${starStr(r.stars)}</span></td><td>${r.missed&&r.missed.length?r.missed.map(esc).join('<br>'):'None 🎉'}</td></tr>`).join('')}</table></div>` : `<p class="note">${esc(who)} hasn't played a game yet.</p>`);
  } else if(pview.tab==='settings'){
    let code=''; try{ code = btoa(unescape(encodeURIComponent(JSON.stringify({app:'g3science',v:2,roster,prog,results})))); }catch(e){}
    body = `
      <h3 style="margin-top:4px">Back up all stars and progress</h3>
      <p class="note">Progress is saved in this browser on this device. If the browser's data gets cleared, it's erased. Copy this code into a note or a text to yourself, and you can restore it here or on another device.</p>
      <textarea id="bk" readonly rows="4">${code}</textarea>
      <div class="ctrl"><button class="btn small" id="bkcopy">Copy backup code</button><span class="note" id="bkmsg"></span></div>
      <h3>Restore from a backup code</h3>
      <textarea id="rs" rows="3" placeholder="Paste a backup code here"></textarea>
      <div class="ctrl"><button class="btn small ghost" id="rsgo">Restore</button><span class="note" id="rsmsg"></span></div>
      <h3>Change PIN</h3>
      <div class="ctrl"><input class="txt" id="newpin" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN" style="width:150px"><button class="btn small ghost" id="pinsave">Save</button><span class="note" id="pinmsg"></span></div>
      <h3>Students</h3>
      ${roster.length ? roster.map(n=>`<div class="ctrl"><span style="min-width:120px;font-size:18px"><b>${esc(n)}</b> ⭐ ${starsFor(n)}</span>
        <button class="btn small danger" data-reset="${esc(n)}">Reset stars</button>
        <button class="btn small danger" data-remove="${esc(n)}">Remove</button></div>`).join('') : '<p class="note">No students yet.</p>'}
      <p class="note" id="stumsg"></p>`;
  } else body = kidChips;

  app.innerHTML = `<div class="screen panel"><h1 style="margin-top:0">Parent area 👪</h1>
    <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${pview.tab===k}">${l}</button>`).join('')}</div>${body}
    <div class="ctrl" style="margin-top:24px"><button class="btn small ghost" id="lockBtn">🔒 Lock and go back</button></div></div>`;

  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{pview.tab=b.dataset.tab;renderParent();});
  app.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{pview.who=b.dataset.who;renderParent();});
  $('#lockBtn').onclick = ()=>{ parentOK=false; go({page: student?'home':'pick'}); };

  if(pview.tab==='settings'){
    $('#bkcopy').onclick = () => { const ta=$('#bk');
      try{ navigator.clipboard.writeText(ta.value).then(()=>{$('#bkmsg').textContent='Copied.';},()=>{ta.select();$('#bkmsg').textContent='Selected. Press copy.';}); }
      catch(e){ ta.select(); $('#bkmsg').textContent='Selected. Press copy.'; } };
    let armed=false;
    $('#rsgo').onclick = () => {
      let d; try{ d = JSON.parse(decodeURIComponent(escape(atob($('#rs').value.trim())))); }catch(e){ $('#rsmsg').textContent="That code isn't a valid backup."; return; }
      if(!d || d.app!=='g3science' || !Array.isArray(d.roster)){ $('#rsmsg').textContent="That code isn't a valid backup for this app."; return; }
      if(!armed){ armed=true; $('#rsgo').textContent='Yes, replace everything'; $('#rsmsg').textContent='This replaces all stars on this device.'; return; }
      roster=d.roster; prog=d.prog||{}; results=d.results||[]; upgrade(); if(!roster.includes(student)) student='';
      saveAll(); renderParent(); toast('Restored.');
    };
    $('#pinsave').onclick = () => { const v=$('#newpin').value.trim(); if(!/^\d{4}$/.test(v)){ $('#pinmsg').textContent='Use exactly 4 numbers.'; return; } pin=v; LS.set('g3-pin',pin); window.BLEPin&&BLEPin.setPin(v); $('#pinmsg').textContent='PIN changed.'; $('#newpin').value=''; };
    const twoTap = (b, label, act) => b.onclick = () => {
      if(b.dataset.armed){ act(); return; }
      b.dataset.armed='1'; const old=b.textContent; b.textContent=label;
      setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=old; } },4000);
    };
    app.querySelectorAll('[data-reset]').forEach(b=>twoTap(b,'Tap again to reset',()=>{ const n=b.dataset.reset; prog[n]={best:{},last:null}; results=results.filter(r=>r.student!==n); saveAll(); renderParent(); toast(`${n}'s stars were reset.`); }));
    app.querySelectorAll('[data-remove]').forEach(b=>twoTap(b,'Tap again to remove',()=>{ const n=b.dataset.remove; roster=roster.filter(x=>x!==n); delete prog[n]; results=results.filter(r=>r.student!==n); if(student===n) student=''; saveAll(); renderParent(); toast(`${n} was removed.`); }));
  }
}

/* ============ START UP ============ */
if(!roster.includes(student)) student='';
go({page: student ? 'home' : 'pick'});
(async () => {
  const saved = await IDB.get();
  if(!saved){ IDB.put(snapshot()); return; }
  const g = (k,d) => { try{ return saved[k] ? JSON.parse(saved[k]) : d; }catch(e){ return d; } };
  const count = p => Object.values(p||{}).reduce((a,x)=>a+Object.keys((x&&x.best)||{}).length,0);
  // If the browser lost its main copy but the backup copy has more, bring the backup back.
  if(count(g('g3-prog',{})) > count(prog) || g('g3-results',[]).filter(r=>r.unit).length > results.length || (!roster.length && g('g3-roster',[]).length)){
    try{ Object.entries(saved).forEach(([k,v]) => localStorage.setItem(k,v)); }catch(e){}
    roster=g('g3-roster',[]); prog=g('g3-prog',{}); results=g('g3-results',[]); pin=g('g3-pin',''); student=g('g3-student','');
    upgrade(); if(!roster.includes(student)) student='';
    if(view.page==='pick'||view.page==='home') go({page: student?'home':'pick'});
  } else IDB.put(snapshot());
})();

</script>
<script src="../rhythm/report.js"></script>
<script>setTimeout(()=>{ try{ rhythmCatchUp('sciexp', [localStorage.getItem('sciexp-lastdone')]); }catch(e){} }, 1500);</script>
<!-- In-app video player: YouTube links play here instead of leaving the app -->
<style>
#vplay{position:fixed;inset:0;z-index:9999;background:rgba(10,12,16,.88);display:none;align-items:center;justify-content:center;padding:16px}
#vplay.on{display:flex}
#vplay .vbox{width:min(960px,100%);background:#111;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#vplay .vtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;color:#fff;font:600 16px/1.3 system-ui,-apple-system,sans-serif}
#vplay .vtop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vplay .vclose{flex:none;border:0;border-radius:999px;background:#fff;color:#111;font:700 16px system-ui,sans-serif;padding:9px 16px;cursor:pointer}
#vplay .vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000}
#vplay iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#vplay .vfoot{padding:8px 16px 12px;color:#bbb;font:14px system-ui,sans-serif}
#vplay .vfoot a{color:#ddd}
</style>
<div id="vplay" role="dialog" aria-modal="true" aria-label="Video"><div class="vbox">
  <div class="vtop"><span id="vptitle">Video</span><button class="vclose" id="vpclose">✕ Close</button></div>
  <div class="vwrap" id="vpwrap"></div>
  <div class="vfoot">If the video doesn’t play, ask a parent for help.</div>
</div></div>
<script>
(function(){
  function ytId(href){ try{ var u=new URL(href, location.href);
      if(/(^|\.)youtu\.be$/i.test(u.hostname)) return u.pathname.slice(1,12);
      if(/(^|\.)youtube(-nocookie)?\.com$/i.test(u.hostname)){
        if(u.pathname==="/watch") return u.searchParams.get("v");
        var m=u.pathname.match(/^\/(embed|shorts|live)\/([A-Za-z0-9_-]{11})/); if(m) return m[2]; }
    }catch(e){} return null; }
  var box=document.getElementById("vplay"), wrap=document.getElementById("vpwrap");
  function close(){ wrap.innerHTML=""; box.classList.remove("on"); document.body.style.overflow=""; }
  window.bleOpenVideo=function(id,title,href){ open(id,title,href); };
  function open(id,title,href){
    try{ speechSynthesis.cancel(); }catch(e){}
    document.getElementById("vptitle").textContent=title||"Video";
    
    wrap.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1" title="'+String(title||"Video").replace(/"/g,"&quot;")+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    box.classList.add("on"); document.body.style.overflow="hidden";
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a[href]"); if(!a||a.id==="vpout") return;
    var id=ytId(a.getAttribute("href")); if(!id||id.length!==11) return;
    e.preventDefault(); open(id,(a.textContent||"").trim(),a.href);
  },true);
  document.getElementById("vpclose").onclick=close;
  box.addEventListener("click",function(e){ if(e.target===box) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&box.classList.contains("on")) close(); });
})();
</script>
</body>
