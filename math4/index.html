<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math 4">
<meta name="theme-color" content="#2f7d6d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>4th Grade Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column; a fixed route map on top so every step is predictable */
:root {
  --bg: #eef3f1;
  --card: #ffffff;
  --ink: #23312d;
  --soft: #5c6e68;
  --line: #d3ded9;
  --accent: #2f7d6d;
  --accent-ink: #ffffff;
  --accent-wash: #dcefe9;
  --look: #b7791f;      /* "look again" — warm, never red */
  --look-wash: #fbf0dc;
  --road: #4a5753;
  --block: #7fb8a9;
  --g-rate: #2A7FBA; --g-num: #0E7C6B; --g-frac: #C2562D; --g-alg: #6B3FA0; --g-think: #C2446E;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151c1a; --card: #1f2926; --ink: #e5eeea; --soft: #a2b4ad; --line: #34433e;
  --accent: #6cc2ad; --accent-ink: #10201c; --accent-wash: #20372f;
  --look: #e5b35c; --look-wash: #3a3020; --road: #0e1412; --block: #4f9483;
  --g-rate: #6CB4E8; --g-num: #3FBFA8; --g-frac: #E57C52; --g-alg: #B48AE6; --g-think: #F08AAE; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151c1a; --card: #1f2926; --ink: #e5eeea; --soft: #a2b4ad; --line: #34433e;
  --accent: #6cc2ad; --accent-ink: #10201c; --accent-wash: #20372f;
  --look: #e5b35c; --look-wash: #3a3020; --road: #0e1412; --block: #4f9483;
  --g-rate: #6CB4E8; --g-num: #3FBFA8; --g-frac: #E57C52; --g-alg: #B48AE6; --g-think: #F08AAE; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--soft); margin: 4px 0 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.top .row { flex: 0 0 auto; }

/* route map */
.route { display: flex; align-items: flex-start; gap: 6px; list-style: none; padding: 0; margin: 0; }
.route li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .8rem; color: var(--soft); text-align: center; }
.route .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center; font-weight: 600; font-size: .85rem; color: var(--soft); }
.route li.now .dot { border-color: var(--accent); color: var(--accent); }
.route li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.route li.now { color: var(--ink); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; }
.story { font-size: 1.1rem; }
.story b { color: var(--accent); }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); font-weight: 600; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
button {
  font: inherit; font-weight: 500; padding: 12px 16px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--accent); background: var(--card); color: var(--accent); transition: background .15s, color .15s;
}
button:hover:not(:disabled) { background: var(--accent-wash); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
button.quiet { border-color: var(--line); color: var(--soft); }
button.picked { background: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--look); outline-offset: 2px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
input[type="number"] { font: inherit; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); min-width: 0; }

.note { border-radius: 10px; padding: 12px 14px; font-size: .98rem; }
.note.ok { background: var(--accent-wash); }
.note.look { background: var(--look-wash); border-left: 4px solid var(--look); }
.hint { background: var(--bg); border-radius: 10px; padding: 12px 14px; color: var(--soft); font-size: .95rem; }

/* home tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
.tile { --c: var(--accent); text-align: left; background: var(--card); color: var(--ink); border: 2px solid var(--c); border-radius: 8px;
  padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; font: inherit; cursor: pointer; transition: transform .15s, box-shadow .15s; }
button.tile:hover:not(:disabled) { background: var(--card); transform: translateY(-2px); box-shadow: 0 6px 14px -8px var(--c); }
.tile .sym { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--c); min-height: 1.9rem; display: flex; align-items: center; }
.tile .sym svg { width: 34px; height: 34px; }
.tile .nm { font-weight: 600; font-size: .95rem; line-height: 1.25; }
.tile .ct { font-size: .75rem; color: var(--soft); font-variant-numeric: tabular-nums; }
.tile.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.tile.wide .sym svg { width: 46px; height: 46px; }
.tile.wide .nm { font-family: var(--font-display); font-size: 1.25rem; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.tiles.small .sym { font-size: 1.5rem; min-height: 1.5rem; }
.legend-g { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--soft); }
.legend-g span { display: inline-flex; align-items: center; gap: 6px; }
.legend-g i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }

/* home */
.home-pick { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 18px; }
.home-pick strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.home-pick span { font-weight: 400; color: var(--soft); font-size: .95rem; }
.home-pick:hover span { color: var(--ink); }

/* trip */
.road { background: var(--road); border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; }
.blk { background: var(--block); color: #10201c; border-radius: 6px; padding: 6px 8px; font-size: .78rem; font-weight: 600; min-width: 52px; text-align: center; animation: pop .25s ease; }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.meter { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.stats { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-weight: 500; flex-wrap: wrap; gap: 6px; }

/* order of operations */
.expr { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 18px 8px;
  background: var(--bg); border-radius: 12px; font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.expr .num, .expr .par { padding: 2px 6px; border-radius: 8px; }
.expr .par { color: var(--soft); }
.expr .op { font-size: 1.6rem; padding: 4px 14px; min-width: 52px; line-height: 1.2; }
.expr .op.exp { align-self: flex-start; font-size: 1.5rem; min-width: 40px; padding: 0 8px; margin-left: -4px; }
.expr .in { background: var(--accent-wash); outline: 2px solid var(--accent); }
.expr .op.in { background: var(--accent); color: var(--accent-ink); }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rules li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: .95rem; }
.rules .n { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: .85rem; flex: none; }
.rules .sym { font-weight: 600; min-width: 44px; font-size: 1.05rem; }
.rules li.lit { border-color: var(--look); background: var(--look-wash); }
.trail { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.trail li { padding: 6px 10px; border-left: 3px solid var(--line); color: var(--soft); }
.trail li:last-child { border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
.ask { font-size: 1.15rem; font-weight: 500; }

/* who's fastest */
.tbl-wrap { overflow-x: auto; }
table.rt { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.rt th, .rt td { border: 1px solid var(--line); padding: 10px 12px; text-align: center; }
.rt th { background: var(--bg); font-weight: 600; }
.rt th[scope="row"] { text-align: left; font-size: .92rem; }
.rt td { font-size: 1.15rem; }
.rt td.now { background: var(--accent-wash); outline: 2px solid var(--accent); outline-offset: -2px; }
.rt td.done { color: var(--accent); font-weight: 600; }
.rt tr.per th { color: var(--accent); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; }
.bar-row .who { font-weight: 600; }
.bar-track { display: flex; gap: 3px; flex-wrap: wrap; }
.bar-track i { width: 26px; height: 26px; border-radius: 6px; background: var(--block); display: grid; place-items: center;
  font-style: normal; font-size: .7rem; font-weight: 600; color: #10201c; }

/* help pip */
.pip { display: flex; gap: 12px; align-items: flex-start; }
.pip svg { flex: none; width: 56px; height: 56px; }
.bubble { background: var(--bg); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.work { display: flex; flex-direction: column; gap: 8px; }
.work .step { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); font-variant-numeric: tabular-nums; }
.work button.step { cursor: pointer; }
.work button.step:hover { border-color: var(--accent); background: var(--accent-wash); }
.work .step small { color: var(--soft); font-size: .8rem; font-weight: 500; }
.work .step b { font-size: 1.2rem; }
.work .step.fixed { border-color: var(--accent); background: var(--accent-wash); }

/* least common multiple */
.hgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; font-variant-numeric: tabular-nums; }
.hgrid span { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 6px; font-size: .78rem;
  color: var(--soft); background: var(--bg); border: 2px solid transparent; }
.hgrid .ga { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.hgrid .gb { border-color: var(--look); border-style: dashed; color: var(--ink); font-weight: 600; }
.hgrid .ga.gb { background: var(--accent); color: var(--accent-ink); border-style: solid; border-color: var(--look); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--soft); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 2px solid; }
.legend .la { background: var(--accent-wash); border-color: var(--accent); }
.legend .lb { border-color: var(--look); border-style: dashed; }
.legend .lab { background: var(--accent); border-color: var(--look); }
.hops { font-variant-numeric: tabular-nums; }
.hops b { color: var(--ink); }
.vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.vocab div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.vocab strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }

/* solve & plot */
.eqn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; background: var(--bg); border-radius: 12px;
  font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.eqn .ln { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; width: 100%; max-width: 360px; }
.eqn .ln > :first-child { text-align: right; }
.eqn .ln.small { font-size: 1.15rem; color: var(--soft); font-weight: 500; }
.eqn em { font-style: italic; font-family: Georgia, "Times New Roman", serif; color: var(--accent); }
.eqn .add { color: var(--look); }
.nl-wrap { overflow-x: auto; }
.nl { width: 100%; min-width: 320px; height: auto; display: block; cursor: pointer; touch-action: manipulation; }

/* fill the table */
.unitchip { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
.tix { display: flex; flex-wrap: wrap; gap: 6px; }
.tix span { border: 2px dashed var(--accent); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .9rem; background: var(--accent-wash); }
.rt td.blank { color: var(--soft); }

/* decimal times */
.vmult { display: inline-grid; grid-template-columns: auto auto; gap: 2px 14px; align-self: center; background: var(--bg);
  border-radius: 12px; padding: 14px 20px; font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 600; }
.vmult span { text-align: right; letter-spacing: .12em; }
.vmult small { font-size: .85rem; font-weight: 500; color: var(--soft); align-self: center; letter-spacing: 0; text-align: left; }
.vmult .rule { grid-column: 1; border-top: 2px solid var(--ink); height: 0; }
.vmult .q { color: var(--look); }
.places { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 1.15rem; }
.places b { color: var(--accent); }

/* fraction times */
.fx { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 16px 8px;
  background: var(--bg); border-radius: 12px; font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 1.6em; }
.fr .bar { align-self: stretch; border-top: 3px solid var(--ink); margin: 3px 0; }
.fr .q { color: var(--look); }
.fr.hi .t, .fr.hi .b { color: var(--accent); }
.factors { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.factors button { padding: 10px 0; font-size: 1.1rem; }

/* backup */
details.backup summary { cursor: pointer; font-weight: 600; color: var(--soft); }
details.backup[open] summary { color: var(--ink); }
details.backup textarea { font: .8rem/1.4 ui-monospace, Menlo, monospace; width: 100%; padding: 10px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; min-width: 0; word-break: break-all; }

/* what does it mean */
.solved { font-size: 1.2rem; line-height: 2.1; }
.solved .sn { font-size: inherit; padding: 2px 12px; margin: 0 2px; line-height: 1.4; }

.break { text-align: center; padding: 40px 20px; }
.break h2 { font-size: 1.6rem; }
footer { color: var(--soft); font-size: .85rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { .blk { animation: none; } button, .meter span { transition: none; } }

/* ---- 30-minute math timer (lives here so she never has to leave the app) ---- */
.mt{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--accent);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 8px 6px 14px;font:600 18px var(--font-body);min-height:48px}
.mt .clk{font:700 22px var(--font-display);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.mt button{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--font-body);min-height:38px;padding:0 16px;cursor:pointer}
.mt button:hover:not(:disabled){background:var(--accent);filter:brightness(1.06)}
.mt button{white-space:nowrap}
.row > .mt{flex:0 0 auto}
/* compact header: small Home and Parent buttons with the timer beside them on one line */
.top{align-items:center}
.top .row{flex-wrap:nowrap;align-items:center;gap:8px}
.top .row > *{flex:0 0 auto}
.top .row > button.quiet{padding:6px 14px;font-size:.85rem;border-radius:999px}
.top .mt{min-height:40px;padding:4px 6px 4px 12px;font-size:16px}
.top .mt .clk{font-size:19px}
.top .mt button{min-height:32px;padding:0 12px;font-size:14px}
@media (max-width:520px){ .top .row{flex-wrap:wrap} }
.wrap{gap:12px}
.mt.paused{border-style:dashed}
.mt.low .clk{color:var(--look)}
.mtdone{position:fixed;inset:0;background:rgba(20,30,28,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mtdone[hidden]{display:none}
.mtcard{background:var(--card);color:var(--ink);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mtcard .big{font-size:56px;line-height:1}
.mtcard h2{font:700 30px var(--font-display);margin:8px 0 4px}
.mtcard p{margin:0 0 20px;color:var(--soft);font-size:18px}
.mtcard button:hover:not(:disabled){background:var(--accent)}
.mtcard button{border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:700 22px var(--font-body);min-height:60px;width:100%;cursor:pointer}
.pipbat .pf svg{width:26px;height:26px;display:block}.pipbat .pf{display:inline-flex;align-items:center}.woke .big.pf svg{width:84px;height:84px;display:block;margin:0 auto}
.pipmiss{text-align:center;font-weight:600;font-size:.92rem;color:var(--soft);margin-top:4px}
.pic{display:flex;justify-content:center;margin:2px 0}.pic svg{height:auto}.pic .rt td,.pic .rt th{padding:8px 14px}
</style>
<script>/* No emoji in text boxes */
(function(){
  var RE=/[\p{Extended_Pictographic}\p{Emoji_Presentation}\p{Emoji_Modifier}\p{Regional_Indicator}‍️⃣\u{E0020}-\u{E007F}]/gu;
  var TEXT=/^(text|search|email|url|tel|password|)$/;
  function isField(el){
    if(!el) return false;
    if(el.tagName==='TEXTAREA') return true;
    if(el.tagName==='INPUT') return TEXT.test((el.getAttribute('type')||'').toLowerCase());
    return !!el.isContentEditable;
  }
  var tip, tipT;
  function notice(){
    if(!document.body) return;
    if(!tip){ tip=document.createElement('div'); tip.setAttribute('role','status');
      tip.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font:600 15px system-ui,sans-serif;z-index:2147483647;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)';
      tip.textContent='Emoji can’t be used here. Please use words.'; }
    document.body.appendChild(tip); clearTimeout(tipT); tipT=setTimeout(function(){ tip.remove(); },2200);
  }
  function clean(el){
    if(el.isContentEditable && el.tagName!=='INPUT' && el.tagName!=='TEXTAREA'){
      var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), n, hit=false;
      while((n=w.nextNode())){ RE.lastIndex=0; if(RE.test(n.nodeValue)){ hit=true; n.nodeValue=n.nodeValue.replace(RE,''); } }
      if(hit) notice(); return;
    }
    var v=el.value; RE.lastIndex=0; if(!RE.test(v)) return;
    var s=el.selectionStart, before=(s==null?v:v.slice(0,s)).replace(RE,'');
    el.value=v.replace(RE,'');
    try{ if(s!=null) el.setSelectionRange(before.length,before.length); }catch(e){}
    notice();
  }
  addEventListener('beforeinput',function(e){
    if(!isField(e.target) || !e.data) return;
    RE.lastIndex=0; if(RE.test(e.data) && !e.isComposing && !e.data.replace(RE,'')){ e.preventDefault(); notice(); }
  },true);
  addEventListener('input',function(e){ if(isField(e.target) && !e.isComposing) clean(e.target); },true);
  addEventListener('compositionend',function(e){ if(isField(e.target)) clean(e.target); },true);
})();
</script>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">4th Grade Math</h1>
      <p class="sub" id="subtitle">You pick what to work on.</p>
    </div>
    <div class="row">
      <button class="quiet" id="homeBtn" type="button" hidden>Home</button>
      <button class="quiet" id="parentBtn" type="button">Parent</button>
      <div class="mt" id="mt" role="timer" aria-live="off"><span aria-hidden="true">⏱</span><span class="clk" id="mtClk">30:00</span><button type="button" id="mtBtn">Start</button></div>
    </div>
  </div>

  <ol class="route" id="route" aria-label="Steps"></ol>

  <main id="stage"></main>

  <footer id="tally"></footer>
</div>
<div class="mtdone" id="mtDone" hidden role="alertdialog" aria-modal="true" aria-labelledby="mtDoneT">
  <div class="mtcard"><div class="big" aria-hidden="true">🎉</div><h2 id="mtDoneT">Math time is done!</h2>
    <p id="mtDoneP">Great work!</p><button type="button" id="mtOk">OK</button></div>
</div>
<script>
/* Today's math goal: 30 minutes of active work
   and 10 problems right on the first try, with no hint and no fast guessing. */
const GOAL_MIN = 30, GOAL_RIGHT = 10;
function goalDayKey(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function goalNow(){
  const k=goalDayKey(); let d={}, log=[];
  try{ d=JSON.parse(localStorage.getItem('math4Daily')||'{}')||{}; }catch(e){}
  try{ log=JSON.parse(localStorage.getItem('math4Log')||'[]')||[]; }catch(e){}
  const right = log.filter(r=>r.day===k && r.done && Object.values(r.steps||{}).every(st=>!st.miss && !st.hints && !st.fast)).length;
  const min = Math.floor(((d[k]||{}).sec||0)/60);
  return {min, right, met: min>=GOAL_MIN && right>=GOAL_RIGHT};
}
function goalLeft(g){ const a=[]; if(g.min<GOAL_MIN) a.push(`${GOAL_MIN-g.min} more minute${GOAL_MIN-g.min===1?'':'s'} of work`); if(g.right<GOAL_RIGHT) a.push(`${GOAL_RIGHT-g.right} more problem${GOAL_RIGHT-g.right===1?'':'s'} right on the first try`); return a.join(' and '); }
function mathReport(){ try{ const g=goalNow(), k=goalDayKey();
  if(g.met && localStorage.getItem('math4Reported')!==k){ localStorage.setItem('math4Reported',k);
    try{ const u=new SpeechSynthesisUtterance('You reached today\'s math goal. Great work!'); u.rate=.95; speechSynthesis.speak(u); }catch(e){} }
  if(window.paintGoal) paintGoal(); }catch(e){} }
/* 30-minute math timer. It is saved on this device, so it keeps going if the app reloads. */
(function(){
  const LEN = 30*60*1000, KEY = 'math4Timer';
  const $ = id => document.getElementById(id);
  let st = {}; try{ st = JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){}
  // a timer from an earlier day starts fresh
  const today = new Date().toDateString(); if(st.day && st.day!==today) st = {};
  const keep = () => { st.day = today; try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
  let AC = null, ring = null, wake = null;
  const unlock = () => { try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} };
  document.addEventListener('pointerdown', unlock, {capture:true});
  function chime(){
    if(!AC) return;
    const t0 = AC.currentTime + .02;
    [[659.25,0],[783.99,.28],[1046.5,.56]].forEach(([f,dt])=>{
      const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(0.35,t0+dt+.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+.9);
      o.connect(g).connect(AC.destination); o.start(t0+dt); o.stop(t0+dt+1);
    });
  }
  const left = () => st.end ? Math.max(0, st.end-Date.now()) : (st.paused!=null ? st.paused : LEN);
  const fmt = ms => { const s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  async function setWake(on){ try{ if(on && !wake && navigator.wakeLock){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); } if(!on && wake){ wake.release(); wake=null; } }catch(e){} }
  function paint(){
    const ms = left();
    $('mtClk').textContent = fmt(ms);
    $('mt').classList.toggle('paused', st.paused!=null && !st.end);
    $('mt').classList.toggle('low', !!st.end && ms<=60000);
    $('mtBtn').textContent = st.end ? 'Pause' : st.paused!=null ? 'Resume' : st.finished ? 'Start again' : 'Start';
    $('mt').setAttribute('aria-label', 'Math timer, '+fmt(ms)+' left');
  }
  function finish(){
    st = {finished:true}; keep(); paint(); setWake(false); mathReport();
    { const g=goalNow(); $('mtDoneT').textContent = g.met ? 'Math time is done!' : 'The timer is done';
      $('mtDoneP').textContent = g.met ? 'You reached today\'s goal. Great work!' : `To finish math today, you still need ${goalLeft(g)}. Keep going!`; }
    $('mtDone').hidden = false; setTimeout(()=>$('mtOk').focus(),0);
    let n = 0; chime(); clearInterval(ring);
    ring = setInterval(()=>{ if(++n>=20){ clearInterval(ring); return; } chime(); }, 3000);   // every 3 seconds, up to 1 minute
    try{ const u=new SpeechSynthesisUtterance('Math time is done. Great work!'); u.rate=.95; speechSynthesis.speak(u); }catch(e){}
  }
  $('mtBtn').addEventListener('click', ()=>{
    unlock();
    if(st.end){ st = {paused:left()}; setWake(false); }
    else if(st.paused!=null){ st = {end:Date.now()+st.paused}; setWake(true); }
    else { st = {end:Date.now()+LEN}; setWake(true); }
    keep(); paint();
  });
  $('mtOk').addEventListener('click', ()=>{ clearInterval(ring); $('mtDone').hidden = true; try{ speechSynthesis.cancel(); }catch(e){} });
  setInterval(()=>{ if(st.end && Date.now()>=st.end) finish(); else if(st.end) paint(); }, 500);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(st.end) setWake(true); paint(); } });
  if(st.end && Date.now()>=st.end) finish(); else { if(st.end) setWake(true); paint(); }
})();
</script>

<script>
/* ---------- shared ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const stage = document.getElementById("stage");

const sections = {
  parent: { title: "Parent area", sub: "Daily totals, the problem log, and backups.", steps: [] },
  pip:  { title: "Help Ziggy", sub: "Ziggy the super robot did some math. You're the super-teacher.", steps: ["Meet Ziggy", "Does it make sense?", "Find the step", "Fix it"] }
};
/* ===================== activity engine =====================
   Every activity is a short list of steps. Each step is one question: tap a choice, or type a number.
   The first step is usually a "think first" question, so the steps never replace the thinking.
   Help Ziggy is made from the same problems: Ziggy makes one of the common mistakes listed in "bads". */
const ACTS = {}, ACT_TILES = [], ACT_RECIPES = {}, ACT_PIP = {};
function act(key, spec) {
  ACTS[key] = spec;
  sections[key] = { title: spec.title, sub: spec.sub, steps: ["Pick", ...spec.steps] };
  ACT_TILES.push([key, spec.title, spec.sym, spec.group]);
  ACT_RECIPES[key] = spec.recipe;
  ACT_PIP[key] = { label: spec.pipLabel || spec.title, sym: spec.sym, make: () => pipFromAct(key) };
}
const ok = t => [String(t), true];
const no = (t, why) => [String(t), false, why];
function opts(...list) { const seen = new Set(); return list.filter(o => o && !seen.has(o[0]) && seen.add(o[0])); }
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const cm = n => Number(n).toLocaleString("en-US");
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
const gcdN = (a, b) => b ? gcdN(b, a % b) : Math.abs(a);
const FRc = (t, b) => `<span class="fr"><span class="t">${t}</span><span class="bar"></span><span class="b">${b}</span></span>`;

/* ---------- pictures ---------- */
const svgWrap = (w, h, inner, label) => `<div class="pic"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label || "picture"}" style="max-width:${w}px;width:100%">${inner}</svg></div>`;
const V = {
  dots(r, c, split = 0) {     // an array: r rows of c dots, with a gap after row "split"
    const s = 24, gap = 16, w = c * s + 8, h = r * s + (split ? gap : 0) + 8;
    let g = "";
    for (let i = 0; i < r; i++) for (let j = 0; j < c; j++)
      g += `<circle cx="${j * s + s / 2 + 4}" cy="${i * s + s / 2 + 4 + (split && i >= split ? gap : 0)}" r="8" style="fill:${split && i >= split ? "var(--look)" : "var(--accent)"}"/>`;
    return svgWrap(w, h, g, `${r} rows of ${c}`);
  },
  groups(g, n) {              // g circles, n dots in each
    const per = Math.min(g, 5), R = 34, w = per * 84, rows = Math.ceil(g / per), h = rows * 84;
    let out = "";
    for (let k = 0; k < g; k++) {
      const cx = (k % per) * 84 + 42, cy = Math.floor(k / per) * 84 + 42;
      out += `<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:var(--accent-wash);stroke:var(--line);stroke-width:2"/>`;
      const cols = Math.ceil(Math.sqrt(n)), rr = Math.ceil(n / cols), s = 13;
      for (let i = 0; i < n; i++) out += `<circle cx="${cx + ((i % cols) - (cols - 1) / 2) * s}" cy="${cy + (Math.floor(i / cols) - (rr - 1) / 2) * s}" r="4.5" style="fill:var(--accent)"/>`;
    }
    return svgWrap(w, h, out, `${g} groups of ${n}`);
  },
  bar(n, d, w = 320, label = true) {      // a fraction bar: d equal parts, n shaded
    let g = ""; const pw = w / d;
    for (let i = 0; i < d; i++) g += `<rect x="${4 + i * pw}" y="4" width="${pw}" height="44" style="fill:${i < n ? "var(--accent)" : "var(--card)"};stroke:var(--ink);stroke-width:2"/>`;
    return svgWrap(w + 8, 52, g, label ? `a bar in ${d} equal parts, ${n} shaded` : "a fraction bar");
  },
  line(wholes, d, dotAt, opts = {}) {     // number line from 0 to "wholes", each whole cut in d jumps, dot at dotAt jumps
    const W = 340, x0 = 20, len = W - 40, n = wholes * d; let g = `<line x1="${x0}" y1="40" x2="${x0 + len}" y2="40" style="stroke:var(--ink);stroke-width:3"/>`;
    for (let i = 0; i <= n; i++) {
      const x = x0 + len * i / n, big = i % d === 0;
      g += `<line x1="${x}" y1="${big ? 28 : 32}" x2="${x}" y2="${big ? 52 : 48}" style="stroke:var(--ink);stroke-width:${big ? 3 : 2}"/>`;
      if (big) g += `<text x="${x}" y="74" text-anchor="middle" style="fill:var(--ink);font:600 18px system-ui">${i / d}</text>`;
    }
    if (dotAt != null) g += `<circle cx="${x0 + len * dotAt / n}" cy="40" r="9" style="fill:var(--look);stroke:var(--ink);stroke-width:2"/>`;
    return svgWrap(W, 84, g, "a number line");
  },
  rline(lo, hi, v, mid = true) {          // rounding line: lo, halfway, hi, and the number
    const W = 340, x0 = 30, len = 280, X = t => x0 + len * (t - lo) / (hi - lo);
    let g = `<line x1="${x0}" y1="40" x2="${x0 + len}" y2="40" style="stroke:var(--ink);stroke-width:3"/>`;
    [lo, hi].forEach(t => g += `<line x1="${X(t)}" y1="26" x2="${X(t)}" y2="54" style="stroke:var(--ink);stroke-width:3"/><text x="${X(t)}" y="76" text-anchor="middle" style="fill:var(--ink);font:600 17px system-ui">${cm(t)}</text>`);
    if (mid) { const m = (lo + hi) / 2; g += `<line x1="${X(m)}" y1="32" x2="${X(m)}" y2="48" style="stroke:var(--soft);stroke-width:2;stroke-dasharray:3 3"/><text x="${X(m)}" y="76" text-anchor="middle" style="fill:var(--soft);font:500 15px system-ui">${cm(m)}</text>`; }
    g += `<circle cx="${X(v)}" cy="40" r="8" style="fill:var(--look);stroke:var(--ink);stroke-width:2"/><text x="${X(v)}" y="18" text-anchor="middle" style="fill:var(--ink);font:700 16px system-ui">${cm(v)}</text>`;
    return svgWrap(W, 84, g, "a number line");
  },
  clock(h, m) {
    let g = `<circle cx="100" cy="100" r="92" style="fill:var(--card);stroke:var(--ink);stroke-width:4"/>`;
    for (let i = 0; i < 60; i++) { const a = i * Math.PI / 30, big = i % 5 === 0, r1 = big ? 78 : 84;
      g += `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + 90 * Math.sin(a)}" y2="${100 - 90 * Math.cos(a)}" style="stroke:var(--ink);stroke-width:${big ? 3 : 1}"/>`; }
    for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; g += `<text x="${100 + 64 * Math.sin(a)}" y="${106 - 64 * Math.cos(a)}" text-anchor="middle" style="fill:var(--ink);font:600 17px system-ui">${i}</text>`; }
    const ha = ((h % 12) + m / 60) * Math.PI / 6, ma = m * Math.PI / 30;
    g += `<line x1="100" y1="100" x2="${100 + 44 * Math.sin(ha)}" y2="${100 - 44 * Math.cos(ha)}" style="stroke:var(--ink);stroke-width:8;stroke-linecap:round"/>`;
    g += `<line x1="100" y1="100" x2="${100 + 76 * Math.sin(ma)}" y2="${100 - 76 * Math.cos(ma)}" style="stroke:var(--accent);stroke-width:5;stroke-linecap:round"/><circle cx="100" cy="100" r="6" style="fill:var(--ink)"/>`;
    return svgWrap(200, 200, g, "a clock");
  },
  grid(c, r) {                // c columns, r rows of squares
    const s = Math.min(30, Math.floor(300 / Math.max(c, r))); let g = "";
    for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) g += `<rect x="${4 + j * s}" y="${4 + i * s}" width="${s}" height="${s}" style="fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.5"/>`;
    return svgWrap(c * s + 8, r * s + 8, g, `${r} rows of ${c} squares`);
  },
  rect(w, h, top, side, unit, showAll) {   // a rectangle (not to scale) with side labels
    const W = 260, H = 150; let g = `<rect x="50" y="30" width="${W - 100}" height="${H - 60}" style="fill:var(--accent-wash);stroke:var(--ink);stroke-width:3"/>`;
    const t = (x, y, s) => `<text x="${x}" y="${y}" text-anchor="middle" style="fill:var(--ink);font:600 16px system-ui">${s}</text>`;
    g += t(W / 2, 22, `${top}${unit ? " " + unit : ""}`) + t(W - 22, H / 2 + 5, `${side}`);
    if (showAll) g += t(W / 2, H - 6, `${top}`) + t(22, H / 2 + 5, `${side}`);
    return svgWrap(W, H, g, "a rectangle");
  },
  ell(A, B) {                 // an L shape made of rectangle A (left, tall) and B (bottom right)
    const s = Math.min(36, Math.floor(270 / (A.w + B.w)), Math.floor(220 / A.h)), x0 = 30, y0 = 20;
    const t = (x, y, s2) => `<text x="${x}" y="${y}" text-anchor="middle" style="fill:var(--ink);font:600 15px system-ui">${s2}</text>`;
    let g = `<rect x="${x0}" y="${y0}" width="${A.w * s}" height="${A.h * s}" style="fill:var(--accent-wash);stroke:var(--ink);stroke-width:2.5"/>`;
    g += `<rect x="${x0 + A.w * s}" y="${y0 + (A.h - B.h) * s}" width="${B.w * s}" height="${B.h * s}" style="fill:var(--look-wash);stroke:var(--ink);stroke-width:2.5"/>`;
    g += t(x0 + A.w * s / 2, y0 + A.h * s / 2, "A") + t(x0 + A.w * s + B.w * s / 2, y0 + (A.h - B.h / 2) * s + 5, "B");
    g += t(x0 + A.w * s / 2, y0 - 5, A.w) + t(x0 - 14, y0 + A.h * s / 2 + 5, A.h);
    g += t(x0 + A.w * s + B.w * s / 2, y0 + (A.h - B.h) * s - 5, B.w) + t(x0 + (A.w + B.w) * s + 14, y0 + (A.h - B.h / 2) * s + 5, B.h);
    return svgWrap(x0 + (A.w + B.w) * s + 34, y0 + A.h * s + 12, g, "an L shape split into rectangles A and B");
  },
  bars(cats, vals, step, top) {           // a bar graph
    const W = 340, H = 220, x0 = 44, y0 = 16, ph = 160, pw = W - x0 - 8, Y = v => y0 + ph - ph * v / top; let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${x0}" y1="${Y(v)}" x2="${x0 + pw}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:1.5"/><text x="${x0 - 6}" y="${Y(v) + 5}" text-anchor="end" style="fill:var(--ink);font:500 13px system-ui">${v}</text>`;
    const bw = pw / cats.length;
    cats.forEach((c, i) => { g += `<rect x="${x0 + i * bw + bw * .2}" y="${Y(vals[i])}" width="${bw * .6}" height="${ph * vals[i] / top}" style="fill:var(--accent)"/><text x="${x0 + i * bw + bw / 2}" y="${H - 18}" text-anchor="middle" style="fill:var(--ink);font:600 13px system-ui">${c}</text>`; });
    g += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 + ph}" style="stroke:var(--ink);stroke-width:2"/>`;
    return svgWrap(W, H, g, "a bar graph");
  },
  hund(n, tenthsOnly) {       // a 10 by 10 square with n hundredths shaded
    let g = ""; const s = 20;
    for (let i = 0; i < 100; i++) { const col = Math.floor(i / 10), row = i % 10;
      g += `<rect x="${4 + col * s}" y="${4 + row * s}" width="${s}" height="${s}" style="fill:${i < n ? "var(--accent)" : "var(--card)"};stroke:var(--line);stroke-width:1"/>`; }
    for (let c = 0; c <= 10; c++) g += `<line x1="${4 + c * s}" y1="4" x2="${4 + c * s}" y2="${4 + 10 * s}" style="stroke:var(--ink);stroke-width:${tenthsOnly || c % 10 === 0 ? 2 : 1}"/>`;
    g += `<rect x="4" y="4" width="${10 * s}" height="${10 * s}" style="fill:none;stroke:var(--ink);stroke-width:2.5"/>`;
    return svgWrap(10 * s + 8, 10 * s + 8, g, `${n} out of 100 squares shaded`);
  },
  protractor(deg) {           // ray along the bottom right (0 on the inside numbers) and a ray at deg
    const cx = 170, cy = 170, R = 150; let g = `<path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy} Z" style="fill:var(--accent-wash);stroke:var(--ink);stroke-width:2"/>`;
    for (let a = 0; a <= 180; a += 10) { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
      g += `<line x1="${cx + (R - 12) * c}" y1="${cy - (R - 12) * s}" x2="${cx + R * c}" y2="${cy - R * s}" style="stroke:var(--ink);stroke-width:2"/>`;
      g += `<text x="${cx + (R - 26) * c}" y="${cy - (R - 26) * s + 4}" text-anchor="middle" style="fill:var(--accent);font:700 11px system-ui">${a}</text>`;
      g += `<text x="${cx + (R + 14) * c}" y="${cy - (R + 14) * s + 4}" text-anchor="middle" style="fill:var(--soft);font:500 11px system-ui">${180 - a}</text>`; }
    for (let a = 5; a < 180; a += 10) { const r = a * Math.PI / 180; g += `<line x1="${cx + (R - 7) * Math.cos(r)}" y1="${cy - (R - 7) * Math.sin(r)}" x2="${cx + R * Math.cos(r)}" y2="${cy - R * Math.sin(r)}" style="stroke:var(--ink);stroke-width:1"/>`; }
    const r = deg * Math.PI / 180;
    g += `<line x1="${cx}" y1="${cy}" x2="${cx + (R + 4) * Math.cos(r)}" y2="${cy - (R + 4) * Math.sin(r)}" style="stroke:var(--look);stroke-width:4;stroke-linecap:round"/>`;
    g += `<line x1="${cx}" y1="${cy}" x2="${cx + R + 4}" y2="${cy}" style="stroke:var(--look);stroke-width:4;stroke-linecap:round"/><circle cx="${cx}" cy="${cy}" r="5" style="fill:var(--ink)"/>`;
    return svgWrap(340, 180, g, "an angle on a protractor");
  },
  angle(parts, labels) {      // a fan of angles from one point: parts = list of degrees, labels = text for each
    const tot = parts.reduce((a, b) => a + b, 0), W = tot > 90 ? 320 : 200, cx = tot > 90 ? 160 : 30, cy = 170, R = 140; let a0 = 0, g = `<line x1="${cx}" y1="${cy}" x2="${cx + R}" y2="${cy}" style="stroke:var(--ink);stroke-width:3"/>`;
    parts.forEach((p, i) => { const a1 = a0 + p, r1 = a1 * Math.PI / 180, mid = (a0 + p / 2) * Math.PI / 180;
      g += `<line x1="${cx}" y1="${cy}" x2="${cx + R * Math.cos(r1)}" y2="${cy - R * Math.sin(r1)}" style="stroke:var(--ink);stroke-width:3"/>`;
      g += `<path d="M ${cx + 36 * Math.cos(a0 * Math.PI / 180)} ${cy - 36 * Math.sin(a0 * Math.PI / 180)} A 36 36 0 0 0 ${cx + 36 * Math.cos(r1)} ${cy - 36 * Math.sin(r1)}" style="fill:none;stroke:${i ? "var(--look)" : "var(--accent)"};stroke-width:3"/>`;
      g += `<text x="${cx + 70 * Math.cos(mid)}" y="${cy - 70 * Math.sin(mid) + 5}" text-anchor="middle" style="fill:var(--ink);font:700 15px system-ui">${labels[i]}</text>`;
      a0 = a1; });
    return svgWrap(W, 180, g, "angles");
  }
};

/* ---------- running an activity ---------- */

function newProb(k, level) { const P = ACTS[k].make(level); P.key = k; P.level = level; return P; }
function actRender() {
  const k = state.section, A = ACTS[k];
  if (state.step === 0 || !state.ap || state.ap.key !== k) { state.step = 0; return actPick(A, k); }
  actStep(A, state.ap, state.ap.steps[state.step - 1]);
}
function actPick(A, k) {
  const c = el(`<section class="card"><h2>Pick a level</h2><div class="choices">${A.levels.map(([id, nm, ex]) =>
    `<button class="home-pick" type="button" data-l="${id}"><strong>${nm}</strong><span>${ex}</span></button>`).join("")}</div></section>`);
  stage.appendChild(c);

function actStep(A, P, S) {

/* ---------- Help Ziggy, made from an activity ---------- */
function pipFromAct(k) {
  const A = ACTS[k]; let P;
  for (let i = 0; i < 30; i++) { P = A.make(pick(A.levels).at(0)); if (P.bads && P.bads.length) break; }
  const good = P.steps.map((S, i) => ({ label: `Step ${i + 1}: ${A.steps[i]}`, math: S.work }));
  const steps = good.map(s => ({ ...s }));
  const bad = P.bads && P.bads.length ? pick(P.bads) : null, right = !bad || Math.random() < .25;
  if (!right) { steps[bad.at].math = bad.work; Object.entries(bad.then || {}).forEach(([i, m]) => steps[+i].math = m); }
  const w = right ? -1 : bad.at;
  return {
    q: P.q, good, steps, wrong: w,
    claim: `I think the answer is <b>${right ? P.ans : bad.ans}</b>.`,
    offRight: `Good eye. ${bad ? bad.test : ""}`,
    yesWrong: `Let's test it. ${bad ? bad.test : ""}`,
    yesRight: `You checked it. ${P.check}`,
    offWrong: `Let's check together. ${P.check}`,
    stepOk: i => i < w ? `${good[i].label} is right.` : `${good[i].label} used a number from an earlier step.`,
    fixQ: bad ? (bad.fixQ || `In ${good[bad.at].label} I wrote “${bad.work}”. What should it be?`) : "",
    fixes: bad ? (bad.fixes || [[good[bad.at].math, true], [bad.work, false, `That's what Ziggy did. ${bad.why || ""}`]].concat(bad.also ? [bad.also] : [])) : [],
    fixed: `<b>${P.ans}.</b> ${P.check}`
  };
}

  const ans = plain(right || "");
  const box = el(`<div class="card" style="padding:14px;gap:8px;margin-top:10px">
    ${pipSay(`${lead || "The right answer is"} “<b>${ans.replace(/</g, "&lt;")}</b>”. Say it or type it to me, so it sticks in my head!`)}
    <div class="row" style="align-items:stretch;gap:8px">
      ${SR ? `<button type="button" id="sayMic" style="flex:0 0 auto;min-height:52px;padding:0 18px;font-weight:600">🎤 Say it</button>` : ""}
      <textarea id="whyIn" rows="2" aria-label="The right answer" placeholder="${IOS ? "Tap here, then 🎤 on the keyboard" : "Type the right answer"}" style="font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);flex:1 1 220px;min-width:0"></textarea>
    </div>
    <div class="row" style="align-items:center"><button class="primary" type="button" id="whyGo" disabled>Tell Ziggy</button>
      <span class="sub" id="whyMsg" style="margin:0">${SR ? "Tap Say it, or type it." : IOS ? "Tap the box, then tap 🎤 on the keyboard to say it. Or type it." : "Type it."}</span></div>
  </div>`);
  fb.appendChild(box);
  const ta = box.querySelector("#whyIn"), go = box.querySelector("#whyGo"), msg = box.querySelector("#whyMsg"), mic = box.querySelector("#sayMic");
  let tries = 0, rec = null;
  const ready = () => { go.disabled = !ta.value.trim(); };
  ta.addEventListener("input", ready);
  const check = () => {
    const said = ta.value.trim(); if (!said) return;
    tries++;
    if (sayMatches(said, ans) || !ans || tries >= 3) {
      if (curProb) (curProb.why = curProb.why || []).push({ step: stepName("pip", state.step), choice: plain(choice), right: ans, said });
      if (rec) try { rec.abort(); } catch (e) {}
      box.remove(); after(); return;
    }
    msg.textContent = tries >= 2 ? "Almost! Look at the answer above and try once more, or tap Keep going." : "Almost! Look at the answer above and try again.";
    if (tries >= 2) go.textContent = "Keep going";
    if (tries >= 2) { go.onclick = () => { tries = 3; check(); }; }
  };
  go.onclick = check;
  if (mic) mic.onclick = () => {
    try {
      if (rec) { rec.abort(); rec = null; }
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 3;
      mic.disabled = true; mic.textContent = "🎤 Listening…"; msg.textContent = "Say the right answer now.";
      rec.onresult = e => {
        const alts = [...e.results[0]].map(a => a.transcript);
        ta.value = alts.find(a => sayMatches(a, ans)) || alts[0] || ""; ready(); check();
      };
      rec.onerror = ev => { msg.textContent = ev.error === "not-allowed" ? "The microphone isn't allowed here. Type it instead." : "I didn't catch that. Tap Say it again, or type it."; };
      rec.onend = () => { mic.disabled = false; mic.textContent = "🎤 Say it"; rec = null; };
      rec.start();
    } catch (e) { mic.disabled = false; mic.textContent = "🎤 Say it"; msg.textContent = "Type it instead."; }
  };
  setTimeout(() => ta.focus(), 50);
}
function pipSense() {
  const pp = state.pp;
  const c = el(`<section class="card">
    ${pipQ(pp)}
    ${pipWork(pp)}
    ${pipSay(pp.claim + " Did I save the day?")}
    <h2>Does Ziggy's answer make sense?</h2>
    <p class="sub">You get one try, so check before you tap.</p>
    <div class="choices">
      <button type="button" data-a="yes">Yes, it makes sense</button>
      <button type="button" data-a="off">Something seems off</button>
    </div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  const done = () => { const fb = c.querySelector("#fb"); fb.innerHTML = `${pipAnswer(pp)}<div class="note ok">${pp.yesRight}</div>${pipSay("Thanks, super-teacher! Ziggy salutes you. *beep boop salute*")}`; fb.appendChild(pipNextRow()); };
  const toFind = () => { const fb = c.querySelector("#fb"); fb.appendChild(nextBtn(() => { state.step = 2; render(); }, "Find Ziggy's mistake")); };
  c.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const fb = c.querySelector("#fb"), saysOk = b.dataset.a === "yes", right = (pp.wrong < 0) === saysOk;
    c.querySelectorAll("[data-a]").forEach(x => x.disabled = true);
    c.querySelector(`[data-a="${pp.wrong < 0 ? "yes" : "off"}"]`).classList.add("picked");
    if (right) {
      if (pp.wrong < 0) return done();
      fb.innerHTML = `<div class="note ok">${pp.offRight}</div>`; return toFind();
    }
    fb.innerHTML = pp.wrong < 0
      ? `<div class="note look">Actually, Ziggy got this one right. ${pp.yesRight.replace(/^You checked it\. /, "")}</div>`
      : `<div class="note look">Actually, something is off. ${pp.offRight.replace(/^Good eye\. /, "")}</div>`;
    pipWhy(fb, b.textContent, () => {
      if (pp.wrong < 0) { fb.innerHTML += pipAnswer(pp); fb.appendChild(pipNextRow()); }
      else toFind();
    }, pipRightAns(pp), pp.wrong < 0 ? "I was right! The answer is" : "The answer should be");
  });
}

function pipFind() {
  const pp = state.pp;
  const c = el(`<section class="card">
    ${pipQ(pp)}
    ${pipSay("Uh-oh! My math powers glitched! Which step went kablooey? Tap it.")}
    <p class="sub">One try. Check each step before you tap.</p>
    <div class="work" id="steps"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  const btns = [];
  pp.steps.forEach((s, i) => {
    const b = el(`<button class="step" type="button"><small>${s.label}</small><b>${s.math}</b></button>`);
    b.onclick = () => {
      if (i === pp.wrong) { state.step = 3; render(); return; }
      btns.forEach(x => x.disabled = true); btns[pp.wrong].classList.add("fixed");
      const fb = c.querySelector("#fb");
      fb.innerHTML = `<div class="note look">${pp.stepOk(i)} The mistake is in <b>${pp.steps[pp.wrong].label}</b>.</div>`;
      pipWhy(fb, `${s.label}`, () => fb.appendChild(nextBtn(() => { state.step = 3; render(); }, "Fix Ziggy's step")), pp.good[pp.wrong].math, `${pp.steps[pp.wrong].label.split(":")[0]} should say`);
    };
    btns.push(b); c.querySelector("#steps").appendChild(b);
  });
}

function pipFix() {
  const pp = state.pp, s = pp.steps[pp.wrong];
  const c = el(`<section class="card">
    ${pipQ(pp)}
    <div class="work"><div class="step"><small>${s.label}</small><b>${s.math}</b></div></div>
    ${pipSay(pp.fixQ)}
    <p class="sub">One try. Think it through before you tap.</p>
    <div class="choices" id="opts"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  const finish = fb => { fb.insertAdjacentHTML("beforeend", `${pipAnswer(pp)}${pipWork(pp, true)}<div class="note ok">${pp.fixed}</div>${pipSay("KA-POW! Math powers restored! Thanks, super-teacher. Ziggy is back in action!")}`); fb.appendChild(pipNextRow()); };
  const opts = [...pp.fixes].sort(() => Math.random() - .5), btns = [];
  opts.forEach(([t, ok, why]) => {
    const b = el(`<button type="button">${t}</button>`);
    b.onclick = () => {
      const fb = c.querySelector("#fb");
      btns.forEach(x => x.disabled = true);
      btns[opts.findIndex(o => o[1])].classList.add("picked");
      if (ok) return finish(fb);
      fb.innerHTML = `<div class="note look">${why} The right way: <b>${pp.fixes.find(f => f[1])[0]}</b>.</div>`;
      pipWhy(fb, t, () => finish(fb), pp.fixes.find(f => f[1])[0], "The right way is");
    };
    btns.push(b); c.querySelector("#opts").appendChild(b);
  });
}
function pipNextRow() {
  const row = el(`<div class="row" style="margin-top:10px"></div>`);
  const again = el(`<button class="primary" type="button">Help Ziggy again</button>`);
  /* the Help problem counts as soon as it's finished, even if she leaves with Home instead of this button */
  if (state.pp && !state.pp.counted) { state.pp.counted = true; state.solved.pip++; state.pipDone[state.pp.key] = (state.pipDone[state.pp.key] || 0) + 1; state.pipOffer = null; save(); }
  again.onclick = () => { state.step = 0; render(); };
  row.append(again); return row;
}



render();
</script>
