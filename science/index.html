{
  id:"adapt", n:11, sym:"Ck", color:"--u12", name:"Created Kinds, Adaptation, and the Flood", set:2,
  blurb:"How God designed living things to fit their homes, how animals vary within their created kinds, and what fossils tell us about Noah's Flood.",
  lessons:[
    { t:"Created Kinds and Adaptations",
      body:`<p>Genesis 1 says God made plants and animals to reproduce "according to their kinds." A <b>created kind</b> is a group of living things that came from the same original created pair. Creation scientists usually place a kind at about the level of a family. For example, wolves, coyotes, dingoes, and pet dogs all belong to one dog kind.</p>
<p>God built a lot of variety into each kind's DNA from the start. That variety lets animals have <b>adaptations</b>, inherited traits that help them survive where they live.</p>
<ul><li><b>Structural adaptations</b> are body features. A polar bear has thick fur, a layer of fat, and black skin to hold heat. A cactus has spines and a thick stem to save water. A duck has webbed feet for swimming.</li>
<li><b>Behavioral adaptations</b> are inherited ways of acting. Bears <b>hibernate</b> through winter. Monarch butterflies migrate up to 4,800 km to Mexico. Wolves hunt in packs.</li></ul>
<p>Bird beaks show design that fits function:</p>
<ul><li>Short, thick, cone-shaped beaks crack seeds (cardinals, finches).</li>
<li>Long, thin beaks reach nectar inside flowers (hummingbirds).</li>
<li>Sharp, hooked beaks tear meat (hawks, eagles).</li>
<li>Long, spear-like beaks catch fish (herons).</li></ul>
<p><b>Camouflage</b> helps an animal blend in, like a snowshoe hare turning white in winter. In <b>mimicry</b>, one species looks like another. The harmless viceroy butterfly looks like the bad-tasting monarch, so birds leave it alone.</p>
<p>An adaptation fits a certain place. A polar bear's thick coat would make it overheat in a desert.</p>
<div class="cbox"><b>7 C's: Creation.</b> Adaptations show a Designer who made living things able to fill the earth (Genesis 1:28).</div>`,
      vocab:[["Created kind","A group of living things that came from the same original created pair"],["Adaptation","An inherited trait that helps a living thing survive"],["Structural adaptation","A body feature that helps survival"],["Behavioral adaptation","An inherited action that helps survival"],["Camouflage","Coloring that helps something blend in"],["Mimicry","Looking like another species for protection"]],
      tryit:"Watch birds at a feeder or in a park. Draw two different beaks and guess what each bird eats."},
    { t:"Natural Selection Within a Kind",
      body:`<p>In the 1830s, Charles Darwin visited the Galápagos Islands and saw finches with different beaks on different islands. He described <b>natural selection</b>, which works in four steps:</p>
<ul><li><b>1. Variation:</b> individuals differ (some moths are lighter, some darker).</li>
<li><b>2. Overproduction:</b> more young are born than can survive.</li>
<li><b>3. Survival:</b> the ones best suited to their surroundings are more likely to live.</li>
<li><b>4. Reproduction:</b> survivors pass their traits on, so those traits become more common.</li></ul>
<p>The <b>peppered moth</b> in England is a real example. Light moths matched pale tree bark. When factory soot darkened the trees in the 1800s, dark moths were hidden and light ones were eaten, so most moths became dark. When the air was cleaned, light moths became common again. Notice: the moths changed color, but they stayed peppered moths the whole time.</p>
<p>Creation scientists agree that natural selection is real and can be observed. The Bible-based view adds three key points:</p>
<ul><li><b>It sorts what is already there.</b> Natural selection chooses among traits God already placed in the kind. It does not add new information.</li>
<li><b>Mutations usually damage.</b> A <b>mutation</b> is a copying mistake in DNA. Since Adam's sin, the world is under a curse, and mutations usually cause loss or harm, not new designs.</li>
<li><b>New species, same kind.</b> Groups can split into new species quickly, especially after the Flood. This is called <b>speciation</b>. All dog breeds came from wolves by <b>artificial selection</b>, people choosing which dogs breed, in only a few thousand years. They are still dogs. Darwin's finches are all still finches.</li></ul>
<p>Bacteria that resist antibiotics are still the same kinds of bacteria. Often the resistance comes from a broken or lost function. That is why doctors say to finish all of your medicine.</p>
<div class="cbox"><b>7 C's: Corruption.</b> Mutations, disease, and death entered the world after the Fall (Romans 8:22).</div>`,
      vocab:[["Natural selection","Living things best suited to their surroundings survive and have more offspring"],["Variation","Differences within a population"],["Population","All the members of one species in an area"],["Speciation","One group splitting into new species within the same kind"],["Mutation","A copying mistake in DNA"],["Artificial selection","People choosing which animals breed"]],
      tryit:"Run the moth simulation with light bark, then sooty bark. Did the moths ever turn into a different kind of animal?"},
    { t:"Fossils and the Flood",
      body:`<p>A <b>fossil</b> is the preserved remains or trace of something that lived long ago. A fossil forms only when a plant or animal is buried quickly by mud or sand before it rots or is eaten. Today, most dead animals decay. Yet the earth holds billions of fossils, including fish buried while swallowing other fish and huge graveyards of dinosaurs. This points to <b>rapid burial</b> in water on a massive scale.</p>
<p>Genesis 6–9 describes that <b>catastrophe</b>: a worldwide <b>Flood</b> about 4,300 years ago. God told Noah to build an Ark 300 cubits long, 50 wide, and 30 high. The Ark Encounter in Kentucky is a life-size model, about 510 feet long, 85 feet wide, and 51 feet high. Answers in Genesis estimates the Ark carried at most about 1,400 kinds of land animals, roughly 6,700 animals, including young dinosaurs.</p>
<p>Creation scientists read the rock record this way:</p>
<ul><li><b>Layers were laid down fast.</b> The <b>law of superposition</b> is still true: in undisturbed layers, lower layers came first. But most layers formed during the year-long Flood, not over millions of years.</li>
<li><b>Mount St. Helens is a small model.</b> After it erupted on May 18, 1980, a 25-foot-thick stack of thin layers formed in less than a day. A later mudflow carved a canyon about 100 feet deep, nicknamed the Little Grand Canyon.</li>
<li><b>Sea fossils on mountains.</b> Seashells and sea creatures are found high on mountains around the world, even near the top of Mount Everest, showing that water once covered the land.</li>
<li><b>Fossil order.</b> Sea creatures are mostly in the lowest layers because the Flood buried the sea floor first. Land animals that could flee to higher ground were buried later.</li></ul>
<p>Types of fossils:</p>
<ul><li><b>Mold:</b> a hollow space in rock shaped like the organism. <b>Cast:</b> a mold that filled with minerals, making a copy.</li>
<li><b>Petrified fossils:</b> remains turned to stone by minerals.</li>
<li><b>Trace fossils:</b> evidence of activity, like footprints, burrows, or nests.</li>
<li><b>Preserved remains:</b> whole creatures kept in amber (tree sap), ice, or tar.</li></ul>
<p>Fossils also show <b>extinction</b>, when every member of a kind dies out.</p>
<div class="cbox"><b>7 C's: Catastrophe.</b> The Flood was God's judgment on sin, and the Ark was His way of saving Noah's family and the animals.</div>`,
      vocab:[["Fossil","Preserved remains or traces of something that lived long ago"],["Rapid burial","Being covered quickly before decay"],["Trace fossil","Evidence of activity, like a footprint"],["Law of superposition","In undisturbed layers, lower layers were laid down first"],["Extinction","When a kind dies out completely"],["Catastrophe","A huge, sudden disaster"]],
      tryit:"Press a shell or leaf into clay to make a mold, then fill it with glue to make a cast. How fast did your fossil form?"}
  ],

{
  id:"earthres", n:12, sym:"Rs", color:"--u13", name:"Earth's Resources and Human Impact", set:2,
  blurb:"Where our energy and materials come from, how people affect air, water, and land, and what we can do to help.",
  lessons:[
    { t:"Renewable and Nonrenewable Resources",
      body:`<p>A <b>natural resource</b> is anything from nature that people use: water, air, soil, trees, minerals, and energy sources. Resources fall into two groups:</p>
<ul><li><b>Renewable resources</b> can be replaced by nature in a human lifetime or less: sunlight, wind, water, trees (if replanted), crops, and animals.</li>
<li><b>Nonrenewable resources</b> exist in limited amounts and are not being replaced as fast as we use them, so once used up, they're gone: coal, oil, natural gas, and minerals like copper and iron.</li></ul>
<p>Coal, oil, and natural gas are called <b>fossil fuels</b> because they formed from the remains of plants and tiny sea creatures that were buried deep and squeezed under heat and pressure. Creation scientists say most of these were buried during Noah's Flood. They are not being replaced as fast as we use them. Burning them releases stored energy, but also releases <b>carbon dioxide</b> and other pollutants.</p>
<p>Energy sources each have trade-offs:</p>
<ul><li><b>Solar:</b> clean and renewable, but only works when the Sun shines.</li>
<li><b>Wind:</b> clean and renewable, but only works when the wind blows, and turbines take up space.</li>
<li><b>Hydroelectric</b> (dams): reliable and renewable, but dams change rivers and fish habitats.</li>
<li><b>Geothermal:</b> uses Earth's internal heat; only available in certain places.</li>
<li><b>Nuclear:</b> produces lots of power without carbon dioxide, but uranium is nonrenewable and the waste stays dangerous for thousands of years.</li>
<li><b>Fossil fuels:</b> reliable and energy-rich, but nonrenewable and polluting.</li></ul>
<p>Because no source is perfect, many places use a mix. Engineers also work on batteries that store solar and wind energy for when the Sun isn't shining or the wind isn't blowing.</p>`,
      vocab:[["Natural resource","Something from nature that people use"],["Renewable resource","A resource nature replaces fairly quickly"],["Nonrenewable resource","A resource that is not replaced as fast as we use it"],["Fossil fuel","Coal, oil, or gas formed from ancient remains"],["Hydroelectric","Electricity made from moving water"],["Geothermal","Energy from heat inside Earth"]],
      tryit:"Play the sorting game above. Then list three things in your house that use energy from a nonrenewable source."},
    { t:"Pollution and Conservation",
      body:`<p><b>Pollution</b> is anything harmful added to the environment.</p>
<ul><li><b>Air pollution:</b> exhaust from cars and factories adds smoke, soot, and gases. <b>Smog</b> is a haze that forms when pollutants react with sunlight. Some gases mix with rain to make <b>acid rain</b>, which harms forests, lakes, and buildings.</li>
<li><b>Water pollution:</b> chemicals, trash, oil spills, and fertilizer runoff from farms and lawns. Too much fertilizer can cause algae to grow out of control, using up the oxygen fish need.</li>
<li><b>Land pollution:</b> trash in landfills and litter. Plastic can take hundreds of years to break down, and much of it ends up in oceans, where animals mistake it for food.</li></ul>
<p>Humans also change ecosystems through <b>habitat loss</b>. Clearing forests (<b>deforestation</b>) for farms and cities removes homes for animals, causes soil erosion, and removes trees that absorb carbon dioxide. Species brought from other places, called <b>invasive species</b>, can crowd out native ones. In Indiana, the emerald ash borer beetle from Asia has killed millions of ash trees.</p>
<p><b>Conservation</b> is protecting and wisely using natural resources. Ways to help:</p>
<ul><li><b>Reduce:</b> use less, like turning off lights and taking shorter showers. This is the most helpful step.</li>
<li><b>Reuse:</b> use items again, like refillable water bottles.</li>
<li><b>Recycle:</b> turn used materials (paper, aluminum, glass, some plastics) into new products.</li>
<li>Plant native trees and flowers, pick up litter, and protect wetlands, which filter water naturally.</li></ul>
<p>Laws like the Clean Air Act and Clean Water Act have made U.S. air and rivers much cleaner since the 1970s.</p>`,
      vocab:[["Pollution","Harmful substances added to the environment"],["Acid rain","Rain made acidic by air pollution"],["Deforestation","Clearing large areas of forest"],["Invasive species","A non-native species that harms an ecosystem"],["Conservation","Protecting and wisely using resources"],["Recycle","Turn used materials into new products"]],
      tryit:"Use the water calculator above to find how much water your family's showers use in a year. Then try one minute shorter."},
    { t:"The Greenhouse Effect and Climate Change",
      body:`<p>The Sun's light passes through the atmosphere and warms Earth's surface. The warm surface then gives off heat as infrared energy. Some gases in the atmosphere, called <b>greenhouse gases</b>, absorb that heat and send some of it back toward the ground. This is the <b>greenhouse effect</b>. Main greenhouse gases include <b>water vapor</b>, <b>carbon dioxide (CO₂)</b>, and <b>methane</b>.</p>
<p>The greenhouse effect is natural and necessary. Without it, Earth's average temperature would be about −18 °C (0 °F), far too cold for most life. With it, the average is about 15 °C (59 °F).</p>
<p>The problem is that people are adding extra greenhouse gases, mostly by burning fossil fuels and cutting forests. CO₂ in the air has risen from about 280 parts per million before the 1800s to over 420 ppm today. More greenhouse gases trap more heat, so Earth's average temperature has risen about 1.2 °C since the late 1800s. This long-term warming and the changes it causes are called <b>climate change</b>.</p>
<p>Scientists measure the effects:</p>
<ul><li>Glaciers and Arctic sea ice are shrinking.</li>
<li><b>Sea level</b> is rising as ice melts and warmer water expands.</li>
<li>Heat waves are becoming more common, and some storms are bringing heavier rain.</li>
<li>Some plants and animals are shifting where they live or when they bloom and migrate.</li></ul>
<p>Scientists know past climates from evidence like air bubbles trapped in ancient ice cores, tree rings, and fossils. Solutions include using more renewable energy, making cars and buildings more efficient, protecting forests, and planting trees, which absorb CO₂ through photosynthesis.</p>`,
      vocab:[["Greenhouse effect","Gases in the air trapping heat near Earth's surface"],["Greenhouse gas","A gas that absorbs heat, like CO₂ or methane"],["Carbon dioxide","A greenhouse gas released by burning fuels"],["Climate change","Long-term change in Earth's climate"],["Sea level","The average height of the ocean's surface"],["Ice core","A long tube of ice that holds clues to past climates"]],
      tryit:"Put two thermometers in the sun, one inside a clear jar with the lid on. After 20 minutes, which is warmer? Why?"}
  ],

    ["Which gas is a major greenhouse gas?",["Nitrogen","Oxygen","Carbon dioxide","Argon"],2,"CO₂ absorbs heat."],
    ["Without any greenhouse effect, Earth would be…",["much colder","much hotter","the same","covered in water"],0,"About −18 °C on average."],
    ["Burning fossil fuels adds which gas to the air?",["Oxygen","Carbon dioxide","Helium","Nitrogen only"],1,"Burning carbon-based fuels releases CO₂."]
  ],
  test:[

{
  id:"chem", n:13, sym:"Ch", color:"--u14", name:"Chemistry: Mixtures, Elements, and pH", set:2,
  blurb:"How to separate mixtures, how the periodic table organizes every element, and what makes something an acid or a base.",
  lessons:[
    { t:"Mixtures and Solutions",
      body:`<p>A <b>pure substance</b> has the same makeup throughout: either an element (like gold) or a compound (like water). A <b>mixture</b> is two or more substances combined physically, not chemically. Each part keeps its own properties, and the amounts can vary.</p>
<ul><li><b>Heterogeneous mixtures</b> have parts you can see: trail mix, salad, sand and gravel, pizza.</li>
<li><b>Homogeneous mixtures</b> look the same throughout: air, salt water, lemonade. A homogeneous mixture where one substance dissolves in another is called a <b>solution</b>.</li></ul>
<p>In a solution, the substance that dissolves is the <b>solute</b> (like sugar), and the substance it dissolves in is the <b>solvent</b> (like water). Water is called the "universal solvent" because it dissolves more substances than any other liquid. Things that dissolve are <b>soluble</b>; things that don't, like sand in water, are <b>insoluble</b>.</p>
<p>You can make a solid dissolve faster by <b>stirring</b>, <b>heating</b> the solvent, or <b>crushing</b> the solid into smaller pieces (more surface area). When no more solute can dissolve, the solution is <b>saturated</b>.</p>
<p>Because mixtures are physical combinations, they can be separated by physical methods that use differences in properties:</p>
<ul><li><b>Magnet:</b> pulls iron filings from sand.</li>
<li><b>Filtering:</b> separates an insoluble solid from a liquid (sand from water) using a filter.</li>
<li><b>Evaporation:</b> boils off water to leave dissolved solids behind (salt from salt water).</li>
<li><b>Sieving:</b> separates pieces by size (pebbles from sand).</li>
<li><b>Distillation:</b> boils a liquid and collects the cooled vapor, used to make fresh water from seawater.</li></ul>`,
      vocab:[["Mixture","Substances combined physically, keeping their own properties"],["Solution","A mixture where one substance dissolves evenly in another"],["Solute","The substance that dissolves"],["Solvent","The substance that does the dissolving"],["Soluble","Able to dissolve"],["Saturated","Holding as much solute as it can"]],
      tryit:"Time how long a sugar cube takes to dissolve in cold water, warm water, and warm water while stirring."},
    { t:"The Periodic Table",
      body:`<p>The <b>periodic table</b> organizes all 118 known elements. It was first arranged by Dmitri Mendeleev in 1869. He left gaps for elements not yet discovered and correctly predicted their properties!</p>
<p>Each atom has a center called the <b>nucleus</b>, with <b>protons</b> (positive) and <b>neutrons</b> (no charge), and <b>electrons</b> (negative) moving around it. The number of protons is the <b>atomic number</b>, and it decides what element an atom is. Every carbon atom has 6 protons; every oxygen atom has 8. The table lists elements in order of atomic number.</p>
<p>Each box shows the element's atomic number, its <b>chemical symbol</b> (like C, O, or Fe for iron, from the Latin <i>ferrum</i>), its name, and its atomic mass.</p>
<ul><li>The horizontal rows are <b>periods</b>.</li>
<li>The vertical columns are <b>groups</b> (or families). Elements in the same group have similar properties.</li></ul>
<p>Elements fall into three main types:</p>
<ul><li><b>Metals</b> (left and center, most elements): shiny, good conductors of heat and electricity, <b>malleable</b> (can be hammered into sheets), and <b>ductile</b> (can be pulled into wires). Examples: iron, copper, gold, aluminum.</li>
<li><b>Nonmetals</b> (upper right): usually dull, brittle if solid, and poor conductors. Many are gases, like oxygen and nitrogen.</li>
<li><b>Metalloids</b> (along the zigzag staircase line): have some properties of both. Silicon is used to make computer chips.</li></ul>
<p>Some families: Group 1, the <b>alkali metals</b> (sodium, potassium), are so reactive they fizz in water. Group 18, the <b>noble gases</b> (helium, neon, argon), almost never react, which is why helium is safe in balloons.</p>`,
      vocab:[["Periodic table","Chart organizing all elements by atomic number"],["Atomic number","The number of protons in an atom"],["Group","A column of elements with similar properties"],["Period","A row of the periodic table"],["Metal","Shiny element that conducts heat and electricity"],["Noble gas","An element in Group 18 that rarely reacts"]],
      tryit:"Tap elements in the mini table above. Find three metals in your kitchen (hint: foil, pots, and spoons)."},
    { t:"Acids, Bases, and pH",
      body:`<p>Many solutions can be sorted as <b>acids</b> or <b>bases</b>.</p>
<ul><li><b>Acids</b> taste sour (never taste-test chemicals!) and can be corrosive. Examples: lemon juice, vinegar, orange juice, soda, and stomach acid.</li>
<li><b>Bases</b> taste bitter and feel slippery. Examples: baking soda, soap, ammonia, and bleach.</li></ul>
<p>The <b>pH scale</b> measures how acidic or basic a solution is. It runs from <b>0 to 14</b>:</p>
<ul><li>pH below 7 = <b>acid</b>. The lower the number, the stronger the acid.</li>
<li>pH 7 = <b>neutral</b>. Pure water is neutral.</li>
<li>pH above 7 = <b>base</b>. The higher the number, the stronger the base.</li></ul>
<p>Each step on the scale is ten times stronger than the one next to it. A solution with pH 3 is 10 times more acidic than pH 4 and 100 times more acidic than pH 5.</p>
<p>An <b>indicator</b> is a substance that changes color in acids or bases. Litmus paper turns red in acid and blue in base. Red cabbage juice is a natural indicator: it turns pink in acids and green or yellow in bases.</p>
<p>When an acid and a base are mixed, they cancel each other out in a reaction called <b>neutralization</b>, forming water and a salt. Antacid tablets are bases that neutralize extra stomach acid. Gardeners add lime (a base) to soil that is too acidic.</p>
<p>Living things depend on pH. Your blood stays at about 7.4, and most fish need water between about 6.5 and 8.5. Acid rain lowers the pH of lakes, which can harm fish and plants.</p>`,
      vocab:[["Acid","A substance with pH below 7; tastes sour"],["Base","A substance with pH above 7; feels slippery"],["pH scale","A 0–14 scale measuring acidity"],["Neutral","pH 7, neither acid nor base"],["Indicator","A substance that changes color in acids or bases"],["Neutralization","An acid and base reacting to cancel out"]],
      tryit:"With an adult, boil chopped red cabbage, cool the purple juice, and add a little to cups of vinegar, water, and baking soda water. Record the colors."}
  ],
  quiz:[
    ["Which is a heterogeneous mixture?",["Salt water","Air","Trail mix","Lemonade"],2,"You can see the different parts."],
    ["In sugar water, sugar is the…",["solvent","solute","precipitate","indicator"],1,"The solute is what dissolves."],

    ["The atomic number tells the number of…",["neutrons","protons","molecules","groups"],1,"Protons decide what element it is."],
    ["Columns on the periodic table are called…",["periods","groups","rows","atoms"],1,"Groups have similar properties."],
    ["Which is a property of most metals?",["Dull and brittle","Good conductor of electricity","Always a gas","Never shiny"],1,"Metals conduct heat and electricity."],
    ["A solution with pH 2 is a…",["strong acid","neutral substance","weak base","strong base"],0,"Low pH means strongly acidic."],
    ["Pure water has a pH of…",["0","7","10","14"],1,"Pure water is neutral."],
    ["Mixing an acid and a base is called…",["evaporation","neutralization","distillation","filtration"],1,"They cancel each other out."]
  ],
  test:[
    ["Why is salt water a mixture and not a compound?",["The salt and water are combined physically and keep their properties","It has a chemical formula","It can't be separated","It's a solid"],0,"Salt can be recovered by evaporating the water."],
    ["Which change would make sugar dissolve fastest?",["Cold water, no stirring","Warm water with stirring and crushed sugar","A sugar cube in ice water","Adding sand"],1,"Heat, stirring, and more surface area all speed dissolving."],
    ["You keep adding salt to water and it stops dissolving. The solution is…",["neutral","saturated","insoluble","an acid"],1,"It holds as much solute as it can."],
    ["How would you separate iron filings from sand?",["Filter","Magnet","Evaporation","Distillation"],1,"Iron is magnetic; sand is not."],
    ["Distillation can make fresh water from seawater by…",["filtering out salt","boiling the water and collecting the cooled vapor","freezing the salt","adding a magnet"],1,"The salt stays behind when water evaporates."],
    ["Who first organized the periodic table and predicted undiscovered elements?",["Mendel","Mendeleev","Darwin","Newton"],1,"Dmitri Mendeleev, 1869."],
    ["An atom has 8 protons. Which element is it?",["Carbon","Nitrogen","Oxygen","Neon"],2,"Oxygen's atomic number is 8."],
    ["The symbol Fe stands for…",["fluorine","iron","francium","lead"],1,"From the Latin word ferrum."],
    ["Copper can be pulled into thin wires. This property is called…",["malleable","ductile","brittle","soluble"],1,"Ductile means it can be drawn into wires."],
    ["Silicon is used in computer chips and lies on the zigzag line. It is a…",["metal","nonmetal","metalloid","noble gas"],2,"Metalloids have properties of both metals and nonmetals."],
    ["Why is helium safe to use in balloons?",["It's a noble gas that almost never reacts","It's an alkali metal","It's heavy","It's an acid"],0,"Noble gases are very stable."],
    ["How many times more acidic is pH 3 than pH 5?",["2 times","10 times","100 times","1,000 times"],2,"Each step is 10×, so two steps is 10 × 10 = 100."],
    ["Litmus paper turns blue. The solution is a…",["acid","base","neutral","metal"],1,"Litmus turns blue in bases and red in acids."],
    ["An antacid helps an upset stomach because it…",["adds more acid","is a base that neutralizes extra acid","is a metal","is neutral"],1,"Neutralization reduces the acid."],
    ["Acid rain lowers a lake's pH from 7 to 5. What happens to the water?",["It becomes more basic","It becomes more acidic, which can harm fish","It becomes neutral","Nothing"],1,"Lower pH means more acidic; many fish need 6.5 to 8.5."]
  ]
},
{
  id:"surface", n:14, sym:"Sf", color:"--u15", name:"Earth's Surface and History", set:2,
  blurb:"How water, wind, and ice reshape the land, how to read a topographic map, and what the rocks tell us about Earth's history from Creation to the Flood.",
  lessons:[
    { t:"Weathering, Erosion, and Deposition",
      body:`<p>Earth's surface is always changing, mostly too slowly to notice. Three processes work together:</p>
<p><b>Weathering</b> breaks rock into smaller pieces where it sits.</p>
<ul><li><b>Mechanical (physical) weathering</b> breaks rock without changing what it's made of. In <b>ice wedging</b>, water seeps into a crack, freezes, and expands by about 9%, pushing the crack wider. Repeating this every winter splits boulders and causes potholes. Plant roots growing into cracks and rocks grinding against each other also cause mechanical weathering.</li>
<li><b>Chemical weathering</b> changes the minerals in rock. Rainwater is slightly acidic and slowly dissolves limestone, which can form caves like Indiana's Marengo Cave. Oxygen reacts with iron in rock, making it rust and crumble.</li></ul>
<p><b>Erosion</b> carries weathered material away. The four agents of erosion are:</p>
<ul><li><b>Water:</b> the most powerful. Moving water carves canyons. Creation scientists say the Grand Canyon was carved quickly as Flood waters drained off the land.</li>
<li><b>Wind:</b> moves sand and dust, shaping dunes in dry places.</li>
<li><b>Ice:</b> <b>glaciers</b> scrape and carry huge amounts of rock. Glaciers flattened most of northern Indiana during the Ice Age that followed the Flood.</li>
<li><b>Gravity:</b> pulls material downhill in landslides and mudflows.</li></ul>
<p><b>Deposition</b> is when the moving material is dropped in a new place, usually where the water, wind, or ice slows down. Rivers drop sediment where they enter the ocean, building fan-shaped <b>deltas</b>, like the Mississippi River Delta. Sand dunes, beaches, and the gravel hills glaciers leave behind are also deposition.</p>
<p>People slow erosion by planting vegetation (roots hold soil), building walls, and farming on terraces.</p>`,
      vocab:[["Weathering","Breaking rock into smaller pieces"],["Ice wedging","Freezing water widening cracks in rock"],["Chemical weathering","Weathering that changes a rock's minerals"],["Erosion","Moving weathered material from place to place"],["Deposition","Dropping sediment in a new place"],["Delta","Fan-shaped land built where a river enters the sea"]],
      tryit:"Build a small sand hill outside or in a pan. Pour water on it slowly, then quickly. Where does the sand go?"},
    { t:"Landforms and Topographic Maps",
      body:`<p>Constructive forces (like volcanoes and deposition) build up land, and destructive forces (like weathering and erosion) wear it down. Together they create <b>landforms</b>: mountains, valleys, plateaus, plains, canyons, and more.</p>
<p>A regular map shows where things are. A <b>topographic map</b> also shows the shape and height of the land using <b>contour lines</b>. Each contour line connects points with the same <b>elevation</b> (height above sea level). Imagine slicing a mountain into flat layers and tracing each slice's outline from above.</p>
<p>How to read one:</p>
<ul><li>The <b>contour interval</b> is the change in elevation between neighboring lines, like 10 meters or 20 feet. It's printed in the map's key.</li>
<li><b>Close-together lines</b> mean a <b>steep</b> slope. <b>Far-apart lines</b> mean a gentle slope.</li>
<li>A set of closed circles getting smaller in the middle shows a <b>hill</b> or <b>mountain</b>; the smallest circle is the top.</li>
<li>Contour lines that form a <b>V</b> show a valley or stream. The point of the V points <b>uphill</b>, opposite to the way the water flows.</li>
<li>Contour lines never cross, because a point can't have two elevations.</li>
<li>Every fifth line is usually darker and labeled with its elevation. It's called an <b>index contour</b>.</li></ul>
<p>Hikers, engineers, and city planners use topographic maps to plan trails, roads, and where water will flow during storms.</p>`,
      vocab:[["Landform","A natural feature of Earth's surface"],["Topographic map","A map showing land shape with contour lines"],["Contour line","A line connecting points of equal elevation"],["Contour interval","Elevation change between neighboring contour lines"],["Index contour","A darker, labeled contour line"],["Plateau","A high, mostly flat area of land"]],
      tryit:"Make a clay mountain. Push toothpicks in at heights of 1, 2, and 3 cm and connect them with string. Look down from above: you've made contour lines!"},
    { t:"Earth's History and the 7 C's",
      body:`<p>The Creation Museum tells Earth's history in seven big events, called the <b>7 C's of History</b>. Adding up the ages and events recorded in the Bible gives a young earth, about <b>6,000 years old</b>.</p>
<ul><li><b>Creation</b> (about 6,000 years ago): God made everything in six days, and it was very good. Dinosaurs were made on Day 6 with the other land animals.</li>
<li><b>Corruption:</b> Adam and Eve sinned, bringing death, disease, and the curse into the world.</li>
<li><b>Catastrophe</b> (about 4,300 years ago): the worldwide Flood laid down most rock layers and fossils. The Ice Age followed.</li>
<li><b>Confusion:</b> at the Tower of Babel, God confused people's languages and they spread across the earth.</li>
<li><b>Christ</b> (about 2,000 years ago): Jesus, the Creator, was born as a man.</li>
<li><b>Cross:</b> Jesus died and rose again to pay for sin.</li>
<li><b>Consummation:</b> one day God will make a new heavens and a new earth with no more curse.</li></ul>
<p>Geologists put rock layers in order with <b>relative dating</b>. It uses the <b>law of superposition</b> (in undisturbed layers, the lower layer was laid down first) and the rule that a crack or a lava intrusion that cuts through layers is <b>younger</b> than the layers it cuts. These rules work for both views.</p>
<p><b>Radiometric dating</b> measures radioactive elements in rocks that slowly change into other elements. To turn those measurements into ages, scientists must assume three things: how much of each element the rock started with, that nothing leaked in or out, and that the rate of change never varied. Creation scientists point out that rocks formed in recent volcanic eruptions have sometimes been dated as hundreds of thousands of years old. They say the assumptions, not the measurements, produce the millions of years.</p>
<p>Indiana's limestone is full of sea fossils like crinoids and shells. Creation scientists say these sea creatures were buried in the Flood as ocean water covered the continent.</p>`,

  id:"machines", n:15, sym:"Ms", color:"--u16", name:"Simple Machines and Engineering", set:2,
  blurb:"How levers, pulleys, and ramps make work easier, how to calculate their advantage, and how engineers solve problems.",
  lessons:[
    { t:"Work and Levers",
      body:`<p>In science, <b>work</b> is done when a force moves an object over a distance in the direction of the force:</p>
<p style="font-family:var(--mono);font-size:18px;background:var(--soft);padding:10px 14px;border-radius:8px;display:inline-block">work = force × distance</p>
<p>Force is measured in newtons (N) and distance in meters (m), so work is measured in newton-meters, called <b>joules (J)</b>. Lifting a 50 N backpack 2 m does 100 J of work. Pushing on a wall that doesn't move does <b>no</b> work, no matter how tired you get!</p>
<p>A <b>machine</b> makes work easier by changing the size or direction of a force. Machines do <b>not</b> reduce the amount of work. They trade force for distance: you can push with less force, but over a longer distance.</p>
<p>A <b>lever</b> is a stiff bar that turns around a fixed point called the <b>fulcrum</b>. You push with the <b>effort force</b>, and the lever moves the <b>load</b>. There are three classes:</p>
<ul><li><b>First class:</b> fulcrum in the middle (seesaw, scissors, crowbar).</li>
<li><b>Second class:</b> load in the middle (wheelbarrow, nutcracker, bottle opener).</li>
<li><b>Third class:</b> effort in the middle (broom, fishing rod, tweezers, your forearm).</li></ul>
<p>The <b>mechanical advantage (MA)</b> tells how many times a machine multiplies your force:</p>
<p style="font-family:var(--mono);font-size:18px;background:var(--soft);padding:10px 14px;border-radius:8px;display:inline-block">MA = load force ÷ effort force</p>
<p>For a lever, MA also equals effort arm ÷ load arm (distance from fulcrum to effort ÷ distance from fulcrum to load). If the effort arm is 3 m and the load arm is 1 m, the MA is 3: a 300 N rock can be lifted with only 100 N of effort. The farther you push from the fulcrum, the easier it gets.</p>`,
      vocab:[["Work","Force times distance moved"],["Joule","Unit of work and energy"],["Lever","A bar that turns on a fulcrum"],["Fulcrum","The fixed point a lever turns on"],["Effort force","The force you apply to a machine"],["Mechanical advantage","How many times a machine multiplies force"]],
      tryit:"Use the lever tool above to find where the fulcrum must go to lift 400 N with only 100 N of effort."},
    { t:"The Six Simple Machines",
      body:`<p>Almost every machine is built from six <b>simple machines</b>:</p>
<ul><li><b>Lever:</b> a bar turning on a fulcrum (see the last lesson).</li>
<li><b>Wheel and axle:</b> a large wheel attached to a smaller rod (axle) so they turn together. A small force on the big wheel makes a bigger force on the axle. Examples: doorknob, steering wheel, screwdriver handle.</li>
<li><b>Pulley:</b> a wheel with a rope in a groove. A <b>fixed pulley</b> (attached to something) only changes the direction of the force: you pull down to lift up, like a flagpole. A <b>movable pulley</b> moves with the load and cuts the force needed in half. A <b>block and tackle</b> combines pulleys for a bigger mechanical advantage, like on a construction crane.</li>
<li><b>Inclined plane:</b> a ramp. Pushing a heavy box up a long ramp takes less force than lifting it straight up, but you push it farther. A wheelchair ramp is an inclined plane.</li>
<li><b>Wedge:</b> two inclined planes back to back that push things apart. Examples: axe, knife, doorstop, your front teeth.</li>
<li><b>Screw:</b> an inclined plane wrapped around a post. Turning it many times moves it a short distance with great force. Examples: jar lid, bolt, light bulb base.</li></ul>
<p>A <b>compound machine</b> combines two or more simple machines. A bicycle uses wheels and axles, levers (brake handles, pedals), and gears. Scissors are two levers with wedge-shaped blades.</p>
<p>No real machine is perfect. Some energy is always lost to <b>friction</b> as heat. <b>Efficiency</b> compares the useful work you get out to the work you put in. Oil and smooth bearings reduce friction and raise efficiency, but no machine can be 100% efficient.</p>`,
      vocab:[["Simple machine","A basic device that changes force or direction"],["Wheel and axle","A wheel attached to a rod that turn together"],["Pulley","A wheel with a rope that changes force or direction"],["Inclined plane","A sloped surface, or ramp"],["Wedge","Two inclined planes that push things apart"],["Compound machine","A machine made of two or more simple machines"],["Efficiency","How much input work becomes useful output work"]],
      tryit:"Go on a simple-machine hunt in your house. Find at least one example of each of the six."},
    { t:"The Engineering Design Process",
      body:`<p>Scientists ask questions about how the world works. <b>Engineers</b> use science and math to <b>solve problems</b> and design things people need. They follow a cycle called the <b>engineering design process</b>:</p>
<ul><li><b>1. Define the problem.</b> What exactly needs solving, and for whom?</li>
<li><b>2. Research.</b> Learn what others have tried and what science applies.</li>
<li><b>3. Brainstorm and plan.</b> Think of many possible solutions, then choose the most promising and sketch it.</li>
<li><b>4. Build a prototype.</b> A <b>prototype</b> is an early test model.</li>
<li><b>5. Test and evaluate.</b> Does it work? Collect data and compare to the goal.</li>
<li><b>6. Improve and redesign.</b> Fix weak spots and test again.</li></ul>
<p>The process is a <b>loop</b>, not a straight line. Engineers often go through it many times. Failing a test isn't bad; it gives information to make the next version better. The Wright brothers built and tested many gliders before their first powered flight in 1903.</p>
<p>Every design has <b>criteria</b> and <b>constraints</b>:</p>
<ul><li><b>Criteria</b> are what the design must do to succeed (the bridge must hold 50 pennies).</li>
<li><b>Constraints</b> are limits (you may only use 20 craft sticks and glue; you have one hour).</li></ul>
<p>Engineers also weigh <b>trade-offs</b>, giving up one thing to gain another. A lighter bike is faster but may be less sturdy. A stronger material may cost more.</p>
<p>A fair test changes only <b>one variable</b> at a time. If you change the ramp's height <i>and</i> the car's wheels together, you won't know which change made the car faster.</p>`,
      vocab:[["Engineer","A person who designs solutions to problems"],["Prototype","An early test model of a design"],["Criteria","What a design must do to succeed"],["Constraint","A limit on a design, like time or materials"],["Trade-off","Giving up one benefit to gain another"],["Variable","A factor that can change in a test"]],
      tryit:"Design challenge: using only 10 index cards and 30 cm of tape, build a tower that holds a book. Test it, improve it, and test again."}

const unitById = id => UNITS.find(u => u.id === id);
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const starsFor = p => p>=90?3:p>=75?2:p>=60?1:0;
const starStr = (n, max=3) => `<span class="stars" aria-label="${n} of ${max} stars">${"★".repeat(n)}<span class="off">${"★".repeat(max-n)}</span></span>`;
function rs(stu, unit, kind){ return results.filter(r => r.student===stu && r.unit===unit && r.kind===kind); }
function best(stu, unit, kind){ const a = rs(stu,unit,kind); return a.length ? Math.max(...a.map(r => r.pct)) : null; }
function bestStars(stu, unit, kind){ const b = best(stu,unit,kind); return b==null ? 0 : starsFor(b); }
function lessonsDone(stu, u){ const d = (prog[stu]||{}).done||{}; return u.lessons.filter((_,i)=>d[u.id+"-"+i]).length; }
function starTotal(stu){
  let t = 0; const d = (prog[stu]||{}).done||{};
  t += Object.keys(d).length;
  UNITS.forEach(u => ["quiz","test","game","climb"].forEach(k => t += bestStars(stu,u.id,k)));
  t += bestStars(stu,"final","final") + bestStars(stu,"final2","final");
  return t;
}
const STAR_MAX = UNITS.reduce((a,u)=>a+u.lessons.length,0) + UNITS.length*12 + 6;
function badges(stu){
  const d = (prog[stu]||{}).done||{}, mine = results.filter(r=>r.student===stu), st = starTotal(stu);
  const list = [
    ["First Steps","Finish your first lesson", Object.keys(d).length>=1],
    ...UNITS.map(u => [`Unit ${u.n} Master`,`Finish every ${u.name} lesson and score 80%+ on its test`, lessonsDone(stu,u)===u.lessons.length && (best(stu,u.id,"test")||0)>=80, u.color]),
    ["Perfect Score","Get 100% on any quiz or test", mine.some(r=>["quiz","test","final"].includes(r.kind) && r.pct===100)],
    ["Word Wizard","Get 3 stars in a vocabulary match game", mine.some(r=>r.kind==="game" && r.stars===3)],
    ["Summit","Plant the flag in a Fact Climb game", mine.some(r=>r.kind==="climb" && r.top)],
    ["Hot Streak","Answer 5 practice questions in a row correctly", mine.some(r=>(r.bestStreak||0)>=5)],
    ["Star Collector","Earn 30 stars", st>=30],
    ["First Mastery","Master your first unit (80%+ on two days, review cleared)", UNITS.some(u=>mastered(stu,u.id))],
    ["Memory Master","Clear 10 questions from your review box", ((prog[stu]||{}).cleared||0)>=10],
    ["Graduate","Score 80%+ on Final Exam 1 (units 1–5)", (best(stu,"final","final")||0)>=80],
    ["Graduate II","Score 80%+ on Final Exam 2 (units 6–15)", (best(stu,"final2","final")||0)>=80]
  ];
  return list.map(([name,how,got,color]) => ({name,how,got,color}));
}

let actx = null;
function tone(freqs, dur=0.12){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur*1.6);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur*1.8); });
  }catch(e){}
}

function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cols = ["#E57C52","#E0B23C","#8DBB57","#8C9CF0","#3FBFA8","#B48AE6","#F2B705"];
  const bits = Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)],s:6+Math.random()*6}));
  const t0 = performance.now();
  (function f(t){ ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.r+=b.vr; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r); ctx.fillStyle=b.c; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2); ctx.restore(); });
    if (t-t0 < 3200) requestAnimationFrame(f); else cv.remove(); })(t0);
}

/* ============ HELPERS ============ */
function grade(p){ return p>=90?"A":p>=80?"B":p>=70?"C":p>=60?"D":"F"; }
function pillClass(p){ return p>=80?"g":p>=60?"m":"b"; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepQ(q){ const order = shuffle(q[1].map((_,i)=>i)); return { q:q[0], choices: order.map(i=>q[1][i]), answer: order.indexOf(q[2]), why:q[3] }; }
function go(v){ view = v; render(); window.scrollTo({top:0}); }
function kindLabel(k){ return k==="quiz"?"Practice quiz":k==="test"?"Unit test":k==="game"?"Vocab match":k==="climb"?"Fact Climb":"Final exam"; }
const isFinal = id => id==="final" || id==="final2";
function colorOf(unitId){ return isFinal(unitId) ? "--u6" : unitById(unitId).color; }
function titleOf(unitId){ return unitId==="final" ? "Units 1–5" : unitId==="final2" ? "Units 6–15" : `Unit ${unitById(unitId).n}: ${unitById(unitId).name}`; }
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); };
function needStudent(){
  if (student) return false;

}

/* ============ LEARNING ROUTINE, FIX-UPS, REVIEW, MASTERY ============ */
const STEPS = ["Words to Know","Read","See It","Watch","Remember","Try It"];
const STEP_HELP = [
  "Read each word and its meaning out loud. You will see these words in the lesson.",
  "Read the lesson. When you see a word from Step 1, stop and say what it means.",
  "Look at the picture or try the activity. Read the sentence under it.",
  "Watch the video. Then come back here.",
  "Look at each word. Say the meaning in your head. Then tap Show meaning to check.",
  "Do the activity if you can. Then tap I finished this lesson."
];
const dayOf = d => new Date(d).toLocaleDateString("en-CA");
const today = () => dayOf(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return dayOf(d); };
const niceDay = s => new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
const RV = () => { review[student] = review[student] || {}; return review[student]; };
const FX = () => { fix[student] = fix[student] || {}; return fix[student]; };
const LST = () => { lstep[student] = lstep[student] || {}; return lstep[student]; };
const qKey = (u, text) => u + "|" + text;
function findQ(u, text){ const un = unitById(u); return un ? un.quiz.concat(un.test).find(q => q[0]===text) : null; }
function unitOfText(text){ const un = UNITS.find(x => x.quiz.concat(x.test).some(q => q[0]===text)); return un ? un.id : null; }
function testDays(stu, u){ return [...new Set(rs(stu,u,"test").filter(r=>r.pct>=80).map(r=>dayOf(r.at)))]; }
function reviewLeft(stu, u){ return Object.values(review[stu]||{}).filter(it => it.u===u).length; }
function fixLeft(stu, u){ return ((fix[stu]||{})[u]||[]).length; }
function lastTestDay(stu, u){ const a = rs(stu,u,"test"); return a.length ? dayOf(a[a.length-1].at) : null; }
function mastered(stu, u){ return testDays(stu,u).length>=2 && reviewLeft(stu,u)===0 && fixLeft(stu,u)===0; }
function dueList(){ const t = today(); return Object.entries(RV()).filter(([k,it]) => it.due <= t).sort((a,b)=>a[1].due.localeCompare(b[1].due)).map(([k])=>k); }
function testLock(u){ if (fixLeft(student,u)) return "fix"; const lt = lastTestDay(student,u); return lt === today() ? "tomorrow" : null; }

/* ---------- the same path for every unit ---------- */
function unitPath(u){
  const d = P().done, tests = rs(student,u.id,"test");
  const items = u.lessons.map((l,i)=>({label:`Lesson ${u.n}.${i+1}: ${l.t}`, done:!!d[u.id+"-"+i], go:()=>go({page:"unit",unit:u.id,lesson:i})}));
  items.push({label:"Vocab match game", done: rs(student,u.id,"game").length>0, go:()=>startGame(u.id)});
  items.push({label:"Practice quiz", done: rs(student,u.id,"quiz").length>0, go:()=>startQuiz(u.id,"quiz")});
  items.push({label:"Fact Climb game", done: rs(student,u.id,"climb").length>0, go:()=>startClimb(u.id)});
  items.push({label:"Unit test", done: tests.length>0, go:()=>startQuiz(u.id,"test")});
  items.push({label:"Fix up missed test questions", done: tests.length>0 && fixLeft(student,u.id)===0, go:()=>startFix(u.id)});
  items.push({label:"Score 80%+ on the test on 2 different days", done: testDays(student,u.id).length>=2, sub:`${testDays(student,u.id).length} of 2 days`, go:()=>startQuiz(u.id,"test")});
  items.push({label:"Clear this unit's review questions", done: tests.length>0 && reviewLeft(student,u.id)===0, sub: reviewLeft(student,u.id) ? `${reviewLeft(student,u.id)} left` : "", go:()=>startReview()});
  return items;
}
function nextStep(){
  if (!student) return null;
  const ip = inprog[student];
  if (ip) return {eye:"Finish what you started", title:`${kindLabel(ip.kind)}: ${titleOf(ip.unit)}`, sub:`Question ${ip.i+1} of ${ip.qs.length}. Your answers are saved.`, go:()=>startQuiz(ip.unit, ip.kind)};
  const fu = Object.entries(FX()).find(([u,a]) => a && a.length);
  if (fu) return {eye:"Fix-up", title:`Fix up ${fu[1].length} missed question${fu[1].length>1?"s":""} from the Unit ${unitById(fu[0]).n} test`, sub:"Read why each answer is right, then answer it again.", go:()=>startFix(fu[0])};
  const due = dueList().length;
  if (due) return {eye:"Daily review", title:`Review ${Math.min(due,10)} question${due>1?"s":""} you missed before`, sub:"Getting it right on 3 different days moves it into long-term memory.", go:()=>startReview()};
  const lastU = P().last ? UNITS.findIndex(x=>x.id===P().last.unit) : 0, order = UNITS.slice(Math.max(0,lastU)).concat(UNITS.slice(0,Math.max(0,lastU)));
  let waiting = null;
  for (const u of order){
    if (mastered(student,u.id)) continue;
    for (const s of unitPath(u)){
      if (s.done) continue;
      if ((s.label.startsWith("Score 80%") || s.label==="Unit test") && testLock(u.id)==="tomorrow"){ waiting = waiting || u; break; }
      if (s.label.startsWith("Clear this unit")) break;
      const isLesson = s.label.startsWith("Lesson");
      const st = isLesson ? (LST()[s.label.match(/\d+\.(\d+)/) ? u.id+"-"+(+s.label.match(/\d+\.(\d+)/)[1]-1) : ""]||0) : 0;
      return {eye: waiting ? `Unit ${waiting.n} test unlocks tomorrow, so next:` : `Unit ${u.n}: ${u.name}`, title:s.label, sub: isLesson ? `Step ${st+1} of 6: ${STEPS[st]}` : (s.sub||""), go:s.go};
    }
  }
  return {eye:"Amazing", title:"Every unit is mastered or waiting for review!", sub:"Try a final exam.", go:()=>startQuiz("final","final")};
}
function nextStepCard(){
  const n = nextStep(); if (!n) return "";
  const due = dueList().length;
  return `<button class="cont next" id="cont"><span class="eyebrow">Your next step · ${esc(n.eye)}</span><b>${esc(n.title)}</b><small>${esc(n.sub)}</small><span class="arrow">→</span></button>
  ${due && !n.eye.startsWith("Daily") ? `<p class="note">You also have ${due} review question${due>1?"s":""} waiting today.</p>` : ""}`;
}

/* ---------- lessons: the same 6 steps every time ---------- */
function renderUnit(){
  const u = unitById(view.unit), L = u.lessons[view.lesson], key = u.id+"-"+view.lesson, F = FIG[key], W = WATCH[key];
  if (student){ P().last = {unit:u.id, lesson:view.lesson}; saveAll(); }

  if (step===0) body = `<div class="vocab first"><dl>${L.vocab.map(v=>`<dt>${esc(v[0])}</dt><dd>${esc(v[1])}</dd>`).join("")}</dl></div>`;

  if (step===4) body = `<div class="flash" id="flash"></div>`;

    <div class="finish ${done?"is-done":""}">${done ? `<span class="got">✓ Lesson finished · <span class="st">★</span> earned</span>` : `<button class="btn big" id="finish">I finished this lesson <span class="st">+★</span></button>`}</div>`;
  const nextLabel = step<5 ? `Next: ${STEPS[step+1]} →` : (view.lesson<u.lessons.length-1 ? "Next lesson →" : "Next: Vocab game →");
  app.innerHTML = `
  <button class="back" id="back">← All units</button>

    <div class="badge" style="--c:var(${u.color})">${u.sym}</div>
    <div><span class="eyebrow">Unit ${u.n}${isM?` · <span class="mastered">★ Mastered</span>`:""}</span><h1>${esc(u.name)}</h1><p>${esc(u.blurb)}</p></div>
  </div>
  <div class="cols" style="--c:var(${u.color})">
    <nav class="lessonlist" aria-label="Unit steps">
      <span class="pathhead">Unit ${u.n} path</span>
      ${student ? path.map((s,i)=>`<button data-p="${i}" ${i<u.lessons.length && i===view.lesson?'aria-current="true"':""}><span class="ck ${s.done?"on":""}">${s.done?"✓":i+1}</span><span class="pl">${esc(s.label)}${s.sub&&!s.done?`<small>${esc(s.sub)}</small>`:""}</span></button>`).join("")
        : u.lessons.map((l,i)=>`<button data-l="${i}" aria-current="${i===view.lesson}"><span class="ck">${i+1}</span>${esc(l.t)}</button>`).join("")}
    </nav>

      </div>

  const setStep = s => { if (student){ LST()[key] = s; saveAll(); } view.step = s; view.flashDone = false; render(); window.scrollTo({top:0}); };
  $("#back").onclick = () => go({page:"home"});

  $("#sprev").onclick = () => setStep(step-1);
  $("#snext").onclick = () => {
    if (step<5) return setStep(step+1);

  };

function runFlash(vocab, onDone){
  let deck = shuffle(vocab.map(v=>v)), shown = false, known = 0;
  const box = $("#flash");
  const draw = () => {
    if (!deck.length){ box.innerHTML = `<div class="fcard doneall"><b>All ${vocab.length} words remembered!</b><small>Tap Next to go on.</small></div>`; onDone(); return; }
    const [t,d] = deck[0];
    box.innerHTML = `<p class="fprog">${known} of ${vocab.length} words remembered</p>
      <div class="fcard"><span class="fterm">${esc(t)}</span>${shown?`<span class="fdef">${esc(d)}</span>`:""}</div>
      <div class="fbtns">${shown ? `<button class="btn ghost" id="fno">Not yet (try again later)</button><button class="btn" id="fyes">I knew it ✓</button>` : `<button class="btn" id="fshow">Show meaning</button>`}</div>`;
    const s = $("#fshow"); if (s) s.onclick = () => { shown = true; draw(); };
    const y = $("#fyes"); if (y) y.onclick = () => { deck.shift(); known++; shown = false; sfx.right(); draw(); };
    const n = $("#fno"); if (n) n.onclick = () => { deck.push(deck.shift()); shown = false; draw(); };
  };
  draw();
}

/* ---------- quizzes & tests (retake rules) ---------- */
function tagQs(list){ return list.map(([q,u]) => Object.assign(prepQ(q), {u})); }
function startQuiz(unitId, kind, fresh){
  if (needStudent()) return;
  const saved = inprog[student];
  if (!fresh && saved && saved.unit===unitId && saved.kind===kind){ view = Object.assign({page:"quiz", resumed:true}, saved); render(); window.scrollTo({top:0}); return; }
  if (kind==="test"){ const lock = testLock(unitId); if (lock) return go({page:"locked", unit:unitId, why:lock}); }
  let list;
  if (kind==="final") list = shuffle(UNITS.filter(u => unitId==="final2" ? u.set===2 : u.set!==2).flatMap(u => shuffle(u.quiz.concat(u.test)).slice(0, unitId==="final2" ? 2 : 4).map(q=>[q,u.id])));
  else { const u = unitById(unitId);
    list = (kind==="test" && rs(student,unitId,"test").length) ? shuffle(u.quiz.concat(u.test)).slice(0, u.test.length).map(q=>[q,unitId]) : shuffle(u[kind]).map(q=>[q,unitId]); }
  go({page:"quiz", unit:unitId, kind, qs:tagQs(list), i:0, picks:[], checked:false, streak:0, bestStreak:0, retake: kind==="test" && rs(student,unitId,"test").length>0});
}
function finishQuiz(){
  const v = view;
  const score = v.qs.reduce((a,Q,i)=>a+(v.picks[i]===Q.answer?1:0),0), p = pct(score, v.qs.length);
  const r = { id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), student, unit:v.unit, kind:v.kind, score, total:v.qs.length, pct:p, stars:starsFor(p), bestStreak:v.bestStreak||0, at:new Date().toISOString(),
    items: v.qs.map((Q,i)=>({q:Q.q, choices:Q.choices, answer:Q.answer, picked:v.picks[i]??null, why:Q.why, u:Q.u||unitOfText(Q.q)})) };
  const missed = r.items.filter(it => it.picked!==it.answer && it.u);
  missed.forEach(it => { RV()[qKey(it.u,it.q)] = {u:it.u, q:it.q, due:addDays(1), streak:0}; });
  if (v.kind==="test"){ if (missed.length) FX()[v.unit] = missed.map(it=>qKey(it.u,it.q)); else delete FX()[v.unit]; }
  delete inprog[student];
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges, missed:missed.length };
  render(); window.scrollTo({top:0});
  if (r.stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}
function afterResultHTML(r, missedN){
  if (r.kind==="test"){
    const days = testDays(student,r.unit).length;
    if (missedN) return `<div class="nextbox"><b>What happens next</b><ol><li>Fix up the ${missedN} question${missedN>1?"s":""} you missed (right now).</li><li>Review them on the next few days.</li><li>Take this test again <b>tomorrow or later</b>. It will have a different mix of questions.</li></ol><button class="btn" id="gofix">Start fix-up →</button></div>`;
    return `<div class="nextbox"><b>Perfect, nothing to fix!</b><p>${days>=2 ? "You scored 80%+ on two different days." : "Take this test again on another day and score 80%+ to prove it's in your long-term memory."}</p></div>`;
  }
  if (missedN) return `<div class="nextbox"><b>What happens next</b><p>The ${missedN} question${missedN>1?"s":""} you missed went into your review box. You'll see ${missedN>1?"them":"it"} again tomorrow.</p></div>`;
  return "";
}

/* ---------- locked test page ---------- */

/* ---------- fix-up: read why, then answer again ---------- */
function startFix(unitId){
  if (needStudent()) return;
  const queue = (FX()[unitId]||[]).slice();
  if (!queue.length) return go({page:"locked", unit:unitId, why:"tomorrow"});
  go({page:"fix", unit:unitId, queue, phase:"read", total:queue.length});
}
function renderFix(){
  const v = view, u = unitById(v.unit);
  if (!v.queue.length){
    delete FX()[v.unit]; saveAll();
    app.innerHTML = `<div class="quiz" style="--c:var(${u.color})"><div class="lockbox"><span class="eyebrow">Fix-up done</span><h1>All ${v.total} fixed!</h1>
      <p>These questions are in your review box, so you'll see them again over the next week. The Unit ${u.n} test opens again ${lastTestDay(student,u.id)===today()?`on <b>${niceDay(addDays(1))}</b>`:"now"}.</p>
      <div class="qfoot" style="justify-content:center"><button class="btn" id="home">See my next step →</button></div></div></div>`;
    $("#home").onclick = () => go({page:"home"}); sfx.star(); return;
  }
  const k = v.queue[0], [uid, text] = [k.slice(0,k.indexOf("|")), k.slice(k.indexOf("|")+1)], raw = findQ(uid, text);
  if (!raw){ v.queue.shift(); return renderFix(); }
  if (v.phase==="read"){
    app.innerHTML = `<div class="quiz" style="--c:var(${u.color})">
      <div class="qhead"><span class="kind">Fix-up · Unit ${u.n} test</span><span class="eyebrow">${v.total - v.queue.length + 1} of ${v.total} · Step 1 of 2: Read</span></div>
      <div class="qcard"><p class="qtext">${esc(raw[0])}</p>
        <div class="choices">${raw[1].map((c,i)=>`<div class="choice ${i===raw[2]?"right":"dim"}"><span class="l">${i===raw[2]?"✓":""}</span><span>${esc(c)}</span></div>`).join("")}</div>
        <div class="explain ok"><strong>Why:</strong>${esc(raw[3])}</div></div>
      <div class="qfoot"><button class="btn ghost" id="quit">Save and exit</button><button class="btn" id="go">I read it. Step 2: Answer it →</button></div></div>`;
    $("#go").onclick = () => { v.phase = "ask"; v.Q = prepQ(raw); v.picked = null; v.checked = false; renderFix(); };
  } else {
    const Q = v.Q, locked = v.checked;
    app.innerHTML = `<div class="quiz" style="--c:var(${u.color})">
      <div class="qhead"><span class="kind">Fix-up · Unit ${u.n} test</span><span class="eyebrow">${v.total - v.queue.length + 1} of ${v.total} · Step 2 of 2: Answer</span></div>
      <div class="qcard"><p class="qtext">${esc(Q.q)}</p>
        <div class="choices">${Q.choices.map((c,i)=>{ let cls="choice"; if (locked){ if(i===Q.answer) cls+=" right"; else if(i===v.picked) cls+=" wrong"; } else if (i===v.picked) cls+=" picked";
          return `<button class="${cls}" data-c="${i}" ${locked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`; }).join("")}</div>
        ${locked ? `<div class="explain ${v.picked===Q.answer?"ok":"no"}"><strong>${v.picked===Q.answer?"Correct! Fixed.":"Not yet. Read it once more; it will come back at the end."}</strong>${esc(Q.why)}</div>` : ""}</div>
      <div class="qfoot"><button class="btn ghost" id="quit">Save and exit</button>${locked ? `<button class="btn" id="nx">Next →</button>` : `<button class="btn" id="ck" ${v.picked==null?"disabled":""}>Check answer</button>`}</div></div>`;
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { v.picked = +b.dataset.c; renderFix(); });
    const c = $("#ck"); if (c) c.onclick = () => { v.checked = true; v.picked===Q.answer ? sfx.right() : sfx.wrong(); renderFix(); };
    const n = $("#nx"); if (n) n.onclick = () => { const k0 = v.queue.shift(); if (v.picked!==Q.answer) v.queue.push(k0); FX()[v.unit] = v.queue.slice(); saveAll(); v.phase = "read"; renderFix(); window.scrollTo({top:0}); };
  }
  $("#quit").onclick = () => { FX()[v.unit] = v.queue.slice(); saveAll(); go({page:"home"}); };
}

/* ---------- daily review (spaced): right on 3 different days = cleared ---------- */
function startReview(){
  if (needStudent()) return;
  const keys = dueList().slice(0,10);
  if (!keys.length) return go({page:"home"});
  go({page:"review", keys, i:0, right:0, cleared:0});
}
function renderReview(){
  const v = view;
  if (v.i >= v.keys.length){
    const left = Object.keys(RV()).length, nextDue = Object.values(RV()).map(x=>x.due).sort()[0];
    app.innerHTML = `<div class="quiz"><div class="lockbox"><span class="eyebrow">Daily review done</span><h1>${v.right} of ${v.keys.length} right${v.cleared?` · ${v.cleared} cleared!`:""}</h1>
      <p>${left ? `${left} question${left>1?"s are":" is"} still in your review box. Next review: <b>${nextDue<=today()?"today":niceDay(nextDue)}</b>.` : "Your review box is empty!"}</p>
      <div class="qfoot" style="justify-content:center"><button class="btn" id="home">See my next step →</button></div></div></div>`;
    $("#home").onclick = () => go({page:"home"}); if (v.right===v.keys.length){ confetti(); sfx.star(); } return;
  }
  const k = v.keys[v.i], it = RV()[k];
  if (!it){ v.i++; return renderReview(); }
  const raw = findQ(it.u, it.q); if (!raw){ delete RV()[k]; saveAll(); v.i++; return renderReview(); }
  if (!v.Q || v.Qk!==k){ v.Q = prepQ(raw); v.Qk = k; v.picked = null; v.checked = false; }
  const Q = v.Q, u = unitById(it.u), locked = v.checked;
  app.innerHTML = `<div class="quiz" style="--c:var(${u.color})">
    <div class="qhead"><span class="kind">Daily review · Unit ${u.n}</span><span class="eyebrow">${v.i+1} of ${v.keys.length}</span></div>
    <p class="rvdots" aria-label="Right on ${it.streak} of 3 days">${[0,1,2].map(j=>`<i class="${j<it.streak?"on":""}"></i>`).join("")}<span>${it.streak} of 3 days right</span></p>
    <div class="qcard"><p class="qtext">${esc(Q.q)}</p>
      <div class="choices">${Q.choices.map((c,i)=>{ let cls="choice"; if (locked){ if(i===Q.answer) cls+=" right"; else if(i===v.picked) cls+=" wrong"; } else if (i===v.picked) cls+=" picked";
        return `<button class="${cls}" data-c="${i}" ${locked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`; }).join("")}</div>
      ${locked ? `<div class="explain ${v.picked===Q.answer?"ok":"no"}"><strong>${v.msg}</strong>${esc(Q.why)}</div>` : ""}</div>
    <div class="qfoot"><button class="btn ghost" id="quit">Stop for now</button>${locked ? `<button class="btn" id="nx">Next →</button>` : `<button class="btn" id="ck" ${v.picked==null?"disabled":""}>Check answer</button>`}</div></div>`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { v.picked = +b.dataset.c; renderReview(); });
  const c = $("#ck"); if (c) c.onclick = () => {
    v.checked = true;
    if (v.picked===Q.answer){
      it.streak++; v.right++; sfx.right();
      if (it.streak>=3){ delete RV()[k]; v.cleared++; P().cleared = (P().cleared||0)+1; v.msg = "Right 3 days in a row. Cleared! It's in your long-term memory."; }
      else { it.due = addDays(it.streak===1?2:5); v.msg = `Right! You'll see it again on ${niceDay(it.due)}.`; }
    } else { it.streak = 0; it.due = addDays(1); sfx.wrong(); v.msg = "Not yet. The count starts over, and you'll see it again tomorrow."; }
    saveAll(); renderReview();
  };
  const n = $("#nx"); if (n) n.onclick = () => { v.i++; renderReview(); window.scrollTo({top:0}); };
  $("#quit").onclick = () => go({page:"home"});
}

/* ---------- Fact Climb: a pre-test game ---------- */
const CLIMB_N = 12, CLIMB_TOP = 10;
function startClimb(unitId){
  if (needStudent()) return;
  const u = unitById(unitId);
  const qs = shuffle(u.quiz.concat(u.test)).slice(0, CLIMB_N).map(raw => {
    const isTrue = Math.random() < 0.5, wrong = raw[1].map((_,i)=>i).filter(i=>i!==raw[2]);
    return { raw, show: isTrue ? raw[2] : wrong[Math.floor(Math.random()*wrong.length)], isTrue };
  });
  go({page:"climb", unit:unitId, qs, i:0, pos:0, right:0, mistakes:0, answer:null});
}
function climbSVG(pos, color){
  const pts = Array.from({length:CLIMB_TOP+1},(_,k)=>{ const t = k/CLIMB_TOP; return [44 + t*256, 222 - t*190]; });
  const [cx, cy] = pts[Math.min(pos, CLIMB_TOP)];
  return `<svg viewBox="0 0 400 240" class="climbsvg" role="img" aria-label="Climber is on step ${pos} of ${CLIMB_TOP}">
    <polygon points="20,232 300,26 390,232" fill="var(--soft)" stroke="var(--line)" stroke-width="2"/>
    <polygon points="268,56 300,26 330,66 312,60 298,70 284,58" fill="#fff" opacity=".9"/>
    <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 6"/>
    ${pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k===CLIMB_TOP?0:6}" style="fill:${k<=pos?`var(${color})`:"var(--surface)"};stroke:var(${color})" stroke-width="2"/>`).join("")}
    <line x1="${pts[CLIMB_TOP][0]}" y1="${pts[CLIMB_TOP][1]}" x2="${pts[CLIMB_TOP][0]}" y2="${pts[CLIMB_TOP][1]-30}" stroke="currentColor" stroke-width="3"/>
    <polygon points="${pts[CLIMB_TOP][0]},${pts[CLIMB_TOP][1]-30} ${pts[CLIMB_TOP][0]+24},${pts[CLIMB_TOP][1]-23} ${pts[CLIMB_TOP][0]},${pts[CLIMB_TOP][1]-16}" fill="#F2B705"/>
    <g class="climber" style="transform:translate(${cx}px,${cy-14}px)"><circle r="9" style="fill:var(${color})"/><circle cy="-13" r="6" fill="#F6D6CF" stroke="currentColor" stroke-width="1.5"/></g>
    <text x="20" y="20" class="cl-count">Step ${pos} of ${CLIMB_TOP}</text></svg>`;
}
function renderClimb(){
  const v = view, u = unitById(v.unit), Q = v.qs[v.i], raw = Q.raw, a = v.answer;
  const ok = a!=null && (a===Q.isTrue);
  app.innerHTML = `<div class="quiz climb" style="--c:var(${u.color})">
    <div class="qhead"><span class="kind">Fact Climb · Unit ${u.n}</span><span class="eyebrow">Fact ${v.i+1} of ${v.qs.length} · Mistakes: ${v.mistakes}</span></div>
    <p class="howto">Same rules every time: read the question and the answer. Is the answer right? Each correct call climbs one step. Reach step ${CLIMB_TOP} to plant the flag.</p>
    ${climbSVG(v.pos, u.color)}
    <div class="qcard">
      <p class="qtext">${esc(raw[0])}</p>
      <div class="proposed"><span class="eyebrow">Answer</span><b>${esc(raw[1][Q.show])}</b></div>
      ${a==null ? `<div class="tfbtns"><button class="btn tf yes" id="tf-y">✓ That's right</button><button class="btn tf no" id="tf-n">✗ That's wrong</button></div>`
        : `<div class="explain ${ok?"ok":"no"}"><strong>${ok?"Correct! Climb one step.":"Not quite. Stay on this step."}</strong>The right answer is <b>${esc(raw[1][raw[2]])}</b>. ${esc(raw[3])}</div>`}
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Quit game</button>${a!=null ? `<button class="btn" id="nx">${v.i<v.qs.length-1 && v.pos<CLIMB_TOP ? "Next fact →" : "See my result"}</button>` : ""}</div>
  </div>`;
  const pick = val => { v.answer = val; if (val===Q.isTrue){ v.pos++; v.right++; sfx.right(); } else { v.mistakes++; sfx.wrong(); } renderClimb(); };
  const y = $("#tf-y"); if (y) y.onclick = () => pick(true);
  const n = $("#tf-n"); if (n) n.onclick = () => pick(false);
  $("#quit").onclick = () => go({page:"unit", unit:v.unit, lesson:0});
  const nx = $("#nx"); if (nx) nx.onclick = () => {
    if (v.i < v.qs.length-1 && v.pos < CLIMB_TOP){ v.i++; v.answer = null; renderClimb(); window.scrollTo({top:0}); }
    else finishClimb();
  };
}
function finishClimb(){
  const v = view, total = v.i+1, p = pct(v.right, total), top = v.pos>=CLIMB_TOP;
  const stars = top ? (v.mistakes===0 ? 3 : v.mistakes<=1 ? 3 : 2) : (v.pos>=7 ? 1 : 0);
  const r = { id:"c"+Date.now().toString(36), student, unit:v.unit, kind:"climb", score:v.right, total, pct:p, stars, mistakes:v.mistakes, top, at:new Date().toISOString() };
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges }; render(); window.scrollTo({top:0});
  if (top){ confetti(); sfx.star(); }
}

/* ---------- quizzes & tests ---------- */
function saveQuiz(){ const v = view; inprog[student] = {unit:v.unit, kind:v.kind, qs:v.qs, i:v.i, picks:v.picks, checked:v.checked, streak:v.streak||0, bestStreak:v.bestStreak||0}; saveAll(); }

function renderQuiz(){
  const v = view, Q = v.qs[v.i], picked = v.picks[v.i];
  const practice = v.kind==="quiz", locked = practice && v.checked;
  app.innerHTML = `
  <div class="quiz" style="--c:var(${colorOf(v.unit)})">
    ${v.resumed ? `<p class="resumed">Welcome back! Your answers were saved. <button class="linkbtn" id="restart">Start over instead</button></p>` : ""}
    <div class="qhead"><span class="kind">${kindLabel(v.kind)} · ${esc(titleOf(v.unit))}</span><span class="eyebrow">Question ${v.i+1} of ${v.qs.length}</span></div>
    <div class="meter"><i style="width:${pct(v.i+(locked||(!practice&&picked!=null)?1:0), v.qs.length)}%"></i></div>
    ${practice && (v.streak||0)>=2 ? `<p class="streak">${v.streak} in a row!</p>` : ""}
    <div class="qcard">
      <p class="qtext">${esc(Q.q)}</p>
      <div class="choices" role="radiogroup">
        ${Q.choices.map((c,i)=>{
          let cls = "choice";

          else if (i===picked) cls+=" picked";
          return `<button class="${cls}" data-c="${i}" role="radio" aria-checked="${i===picked}" ${locked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`;
        }).join("")}
      </div>
      ${locked ? `<div class="explain ${picked===Q.answer?"ok":"no"}"><strong>${picked===Q.answer?"Correct!":"Not quite. The answer is "+"ABCD"[Q.answer]+"."}</strong>${esc(Q.why)}</div>` : ""}
    </div>
    <div class="qfoot">
      <button class="btn ghost" id="quit">Save and exit</button>
      ${practice
        ? (locked ? `<button class="btn" id="next">${v.i<v.qs.length-1?"Next question →":"See my stars"}</button>`
                  : `<button class="btn" id="check" ${picked==null?"disabled":""}>Check answer</button>`)
        : `<div style="display:flex;gap:10px"><button class="btn ghost" id="prevq" ${v.i===0?"disabled":""}>← Back</button><button class="btn" id="next" ${picked==null?"disabled":""}>${v.i<v.qs.length-1?"Next →":"Finish"}</button></div>`}

  const rsb=$("#restart"); if(rsb) rsb.onclick = () => { delete inprog[student]; saveAll(); startQuiz(v.unit, v.kind, true); };
  const ch=$("#check"); if(ch) ch.onclick = () => {
    v.checked = true;
    if (v.picks[v.i]===Q.answer){ v.streak=(v.streak||0)+1; v.bestStreak=Math.max(v.bestStreak||0,v.streak); sfx.right(); } else { v.streak=0; sfx.wrong(); }
    saveQuiz(); renderQuiz();
  };
  const pv=$("#prevq"); if(pv) pv.onclick = () => { v.i--; saveQuiz(); renderQuiz(); };
  const nx=$("#next"); if(nx) nx.onclick = () => {
