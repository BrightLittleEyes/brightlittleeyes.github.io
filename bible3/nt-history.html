<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>New Testament World – 3rd Grade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EDEA; --ink:#1B2B2F; --muted:#56696B;
  --line:#D3DEDA; --accent:#6A3D8F; --accent-ink:#FFFFFF; --accent-soft:#EDE3F4;
  --gold:#C98A1A; --gold-soft:#FBEBC8; --good:#2E7D4F; --good-soft:#D9F0E2; --bad:#B4432F; --bad-soft:#F7DDD6;
  --sea:#D5E6EC; --land:#EFEBE0; --land-line:#B9B09A; --river:#5E93B0; --pin:#6A3D8F; --maptext:#3B4A4C; --region:#8A8472;
  --paper:#F7F3E8; --paper-line:#E2D8BF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif:"Lora", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
    --line:#2A4043; --accent:#C39BE3; --accent-ink:#1A1020; --accent-soft:#2F2340;
    --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
    --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#C39BE3; --maptext:#DCE6E4; --region:#8C9690;
    --paper:#22241F; --paper-line:#3A3C33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
  --line:#2A4043; --accent:#C39BE3; --accent-ink:#1A1020; --accent-soft:#2F2340;
  --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
  --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#C39BE3; --maptext:#DCE6E4; --region:#8C9690;
  --paper:#22241F; --paper-line:#3A3C33;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.7;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.top .spacer{flex:1}
.stars{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--gold-soft);color:var(--ink);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;color:var(--gold)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h1{font-size:clamp(28px,6vw,40px)}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.next{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:grid;gap:10px;margin-bottom:28px}
.next .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.next h2{font-size:26px}
.next .ref{opacity:.9}
.next button{justify-self:start;background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.group{margin-bottom:26px}
.group h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group h3 .cnt{letter-spacing:0;text-transform:none;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px}
details.group > summary{cursor:pointer;list-style:none;margin-bottom:10px}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary h3::before{content:"▸";margin-right:8px;color:var(--accent)}
details.group[open] > summary h3::before{content:"▾"}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:grid}
.path li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.stone.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.stone.here{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.path li:not(:last-child) .col::after{content:"";display:block;width:2px;height:22px;background:var(--line);margin:4px auto}
.col{display:grid;justify-items:center}
.lessonbtn{background:none;border:0;text-align:left;color:var(--ink);padding:6px 0 18px;display:grid;gap:2px}
.lessonbtn .t{font-weight:700;font-size:18px;line-height:1.3}
.lessonbtn .r{font-size:14px;color:var(--muted)}
.lessonbtn .sc{font-size:13px;color:var(--good);font-weight:700}

.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;margin-bottom:12px}
.lhead{display:grid;gap:6px;margin-bottom:16px}
.lhead .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lhead h1{font-size:clamp(28px,6vw,40px)}
.lhead .era{color:var(--muted);font-weight:700}
.pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pair .lbl{font-size:13px;color:var(--muted);display:block}
.pair .pt{font-weight:700}
.pair > div{flex:1;min-width:180px}
.intro{font-size:19px;line-height:1.55;margin:0 0 18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:10px}
.card h3{font-size:20px;margin:18px 0 6px}
.card h3:first-of-type{margin-top:4px}
.card p{margin:0 0 12px;max-width:65ch}
.card p:last-child{margin-bottom:0}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--good)}

.mapbox{margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.local{max-width:440px}
.mapcap{font-size:15px;color:var(--muted);margin-top:10px;max-width:62ch}
.m-land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2}
.m-water{fill:var(--sea);stroke:var(--river);stroke-width:1.5}
.m-river{fill:none;stroke:var(--river);stroke-width:2.5;stroke-linecap:round}
.m-region{fill:var(--region);font-family:var(--body);font-weight:700;letter-spacing:.12em}
.m-pin{fill:var(--pin);stroke:var(--land);stroke-width:2.5}
.m-lbl{fill:var(--maptext);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.person b{display:block;font-family:var(--display);font-size:17px;line-height:1.2;margin-bottom:2px}
.person span{font-size:14px;color:var(--muted);line-height:1.4;display:block}

.source{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 20px}
.source h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:2px}
.source .meta{font-size:14px;color:var(--muted);margin-bottom:12px}
.source blockquote{margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;max-width:62ch}
.source .note{font-size:15px;margin:0;max-width:62ch}

.vocab{display:grid;gap:10px;margin:0}
.vocab div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px}
.vocab dt{font-weight:700}
.vocab dd{margin:0;color:var(--ink)}
@media (max-width:520px){ .vocab div{grid-template-columns:1fr;gap:0} }

.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.yr{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.disc{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-left:6px}

.q{margin-bottom:18px}
.q:last-child{margin-bottom:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:15px;margin-top:6px;color:var(--muted)}
textarea{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.assign{background:var(--accent-soft);border-color:transparent}
.finish{text-align:center;display:grid;gap:12px;justify-items:center}
.finish .btn{font-size:18px;padding:12px 22px}
.finish .note{color:var(--muted);font-size:15px}
.celebrate{display:grid;justify-items:center;gap:6px;text-align:center}
.celebrate .starbig{width:64px;height:64px;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .celebrate .starbig{animation:pop .6s ease-out} }
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:84px 24px 1fr;gap:6px;align-items:start;padding:6px 0}
.tl .yr{text-align:right;padding-top:1px}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);margin:5px auto 0;position:relative;z-index:1}
.tl li.locked .dot{background:var(--line)}
.tl li.locked .ev{color:var(--muted);font-style:italic}
.tl .ev b{display:block}
.tl .ev .from{font-size:13px;color:var(--muted)}
.tl li.jesus .dot{background:var(--gold)}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tlhead h2{font-size:24px}
.tlhead span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.foot{margin-top:36px;font-size:12px;color:var(--muted);line-height:1.5}
.settings{display:grid;gap:12px}
.settings label{font-weight:700;display:grid;gap:4px}
.settings input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--muted)}
@media (max-width:480px){ .top{position:static} .card{padding:16px} .brand{font-size:18px} .brand svg{display:none} .tl::before{left:78px} .tl li{grid-template-columns:66px 24px 1fr} .mini li{grid-template-columns:78px 1fr} }
</style>
</head>

<script>
const EMBED = {"lessons/mark.json":[{"id":"mkh-01","bible":"mrk-01","bibleTitle":"The Beginning of the Good News","title":"Who Was Mark?","era":"About AD 45-70","intro":"Mark didn't put his name on his book. So how do we know who wrote it? The Bible and early Christians give us clues about a young man named John Mark.","sections":[{"h":"Mark in the Bible","p":["Mark's mom, Mary, had a house in Jerusalem where Christians met to pray. When an angel helped Peter escape from prison, Peter went straight to her house! So Mark grew up around Jesus' followers.","Mark went on a trip with Paul, but he quit partway. Paul was upset. But years later, Paul wrote, 'Bring Mark, because he is helpful to me.' Mark got a second chance!"]},{"h":"Peter's Helper","p":["A church leader named Papias, who lived a long time ago, wrote that Mark was Peter's helper. Mark wrote down what Peter remembered about Jesus.","That's why Mark's book has so many little details, like Jesus sleeping on a pillow in the boat. They're Peter's memories!"]},{"h":"The First Gospel","p":["Most people think Mark was the first Gospel written. Matthew and Luke used a lot of Mark's stories in their books too."]}],"people":[{"name":"John Mark","role":"Wrote the Gospel of Mark"},{"name":"Papias","role":"An early church leader who wrote about Mark"}],"source":{"title":"Papias, quoted in Eusebius' Church History, Book 3","who":"Papias","date":"About AD 125 (quoted about AD 325)","text":"Papias said: Mark became Peter's helper and carefully wrote down everything Peter remembered about what Jesus said and did.","note":"Mark wrote down Peter's memories!"},"vocab":[["Gospel","A book about Jesus' life; it means 'good news'"],["Eyewitness","Someone who saw something happen"],["Second chance","Getting to try again after you fail"]],"map":{"view":"wide","places":["jerusalem_w","antioch","rome"],"caption":"Mark grew up in Jerusalem and traveled with Paul. Later he was with Peter in Rome."},"timeline":[{"y":46,"t":"Mark goes on a trip with Paul"},{"y":125,"t":"Papias writes about Mark"}],"video":[["Drive Thru History: The Historical Landscape","https://watch.tbn.org/s/Q9aSuuiu?e=2LGRQ7EL"]],"quiz":[{"q":"Whose house was a meeting place for Christians?","options":["Mark's mom's","Herod's","Pharaoh's"],"answer":0,"why":"Peter went there after prison!"},{"q":"What did Mark get from Paul later?","options":["A second chance","Money","A boat"],"answer":0,"why":"Paul said Mark was helpful."},{"q":"Whose memories did Mark write down?","options":["Peter's","Herod's","Moses'"],"answer":0,"why":"Peter saw it all!"},{"q":"Which Gospel was probably written first?","options":["Luke","Mark","John"],"answer":1,"why":"Mark's is the first!"}],"assignment":"Ask a grown-up about a time they got a second chance. Then draw Mark writing down Peter's stories."},{"id":"mkh-02","bible":"mrk-02","bibleTitle":"Friends Who Dug Through a Roof","title":"Digging Up Capernaum and Peter's House","era":"1st century to today","intro":"Capernaum was Jesus' home town while he preached. Archaeologists have found its streets, houses, and maybe even Peter's house!","sections":[{"h":"A Fishing Town","p":["Capernaum was a small fishing town by the Sea of Galilee. Houses were made of dark black stone, built around shared yards where families lived and worked together."]},{"h":"Peter's House?","p":["Under the ruins of an old church, archaeologists found a house from Jesus' time. One room was special. Its walls were covered with plaster, and lots of little oil lamps were found there. People gathered there!","Visitors long ago scratched prayers on the walls. Some might say 'Jesus' and 'Peter.' Many archaeologists think this was Peter's house, where Jesus healed Peter's mother-in-law!"]},{"h":"Look Through the Floor","p":["Today a church stands over the house on tall legs. Visitors can look down through a glass floor and see the old house below!"]}],"people":[{"name":"Peter","role":"A disciple whose house was in Capernaum"},{"name":"Egeria","role":"A traveler who wrote that Peter's house had become a church"}],"source":{"title":"Travel account quoted by Peter the Deacon","who":"Egeria, a Christian pilgrim","date":"About AD 383","text":"Egeria wrote that in Capernaum, Peter's house had been made into a church, and its walls were still standing.","note":"Egeria visited about 1,600 years ago."},"vocab":[["Capernaum","Jesus' home town by the Sea of Galilee"],["Archaeologist","A person who digs up things from long ago"],["Graffiti","Words scratched on a wall"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala"],"caption":"Capernaum was on the shore of the Sea of Galilee."},"timeline":[{"y":383,"t":"Egeria visits Peter's house"},{"y":1968,"t":"Archaeologists start digging at Capernaum","d":true},{"y":1990,"t":"A church with a glass floor is built over the house","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What were Capernaum's houses made of?","options":["Wood","Dark black stone","Ice"],"answer":1,"why":"Basalt stone."},{"q":"Whose house might they have found?","options":["Peter's","Herod's","Pharaoh's"],"answer":0,"why":"Where Jesus healed Peter's mother-in-law!"},{"q":"What was scratched on the walls?","options":["Nothing","Pictures of cars","Prayers"],"answer":2,"why":"Visitors left prayers."},{"q":"How can visitors see the house today?","options":["Through a glass floor","On TV only","They can't"],"answer":0,"why":"Look down and see it!"}],"assignment":"Pretend you're an archaeologist at Capernaum. Draw what you find in Peter's house: lamps, walls, and prayers."},{"id":"mkh-03","bible":"mrk-03","bibleTitle":"Lord of the Sabbath, and Jesus' True Family","title":"James, the Brother of Jesus","era":"About AD 30-62","intro":"Jesus' family once thought he was 'out of his mind.' But his brother James later became a leader in the church!","sections":[{"h":"Family Worries","p":["Back then, what people thought about your family was super important. When Jesus drew big crowds and argued with leaders, his family worried. They came to take him home!","The Bible says that at first, even Jesus' brothers didn't believe in him."]},{"h":"From Doubter to Leader","p":["Then something changed. After Jesus rose from the dead, he appeared to his brother James! James believed, and he became a leader of the church in Jerusalem.","The book of James in the Bible is from him. People called him 'James the Just' because he prayed so much."]},{"h":"A History Writer Agrees","p":["Josephus, a Jewish history writer who wasn't a Christian, wrote about James. He called him 'the brother of Jesus, who was called Christ.' That shows Jesus was a real person with a real brother!"]}],"people":[{"name":"James the Just","role":"Jesus' brother and a church leader"},{"name":"Josephus","role":"A Jewish history writer"}],"source":{"title":"Jewish Antiquities, Book 20","who":"Josephus","date":"About AD 93","text":"Josephus wrote about a man named James, 'the brother of Jesus, who was called Christ.'","note":"Even a writer who wasn't a Christian wrote about Jesus and his brother!"},"vocab":[["Doubt","Not being sure something is true"],["Leader","A person who guides others"],["Historian","A person who writes about the past"]],"map":{"view":"local","places":["nazareth","capernaum","jerusalem"],"caption":"Jesus' family came from Nazareth. James later led the church in Jerusalem."},"timeline":[{"y":49,"t":"James speaks at a big church meeting"},{"y":62,"t":"James dies in Jerusalem"}],"video":[],"quiz":[{"q":"What did Jesus' family think at first?","options":["He was out of his mind","He was a king","He was hungry"],"answer":0,"why":"They were worried."},{"q":"Who did the risen Jesus appear to?","options":["Herod","His brother James","Pharaoh"],"answer":1,"why":"Then James believed!"},{"q":"What did people call James?","options":["James the Tall","James the Fast","James the Just"],"answer":2,"why":"Because he prayed so much."},{"q":"Which history writer mentions James?","options":["Moses","Egeria","Josephus"],"answer":2,"why":"He called him Jesus' brother."}],"assignment":"Draw James before and after: first worried about Jesus, then a leader who believed in him.","hope":["James didn't believe in Jesus at first. But after Jesus rose again, James believed and became a church leader!","He even wrote the book of James in our Bible. Jesus can change anyone's heart."]},{"id":"mkh-04","bible":"mrk-04","bibleTitle":"Seeds, a Lamp, and a Storm","title":"Mark's Roman Readers","era":"About AD 60-70","intro":"Mark's book has clues about who first read it. It uses Roman words and explains Jewish ways. It was probably written for Christians in Rome!","sections":[{"h":"Roman Words","p":["Mark wrote in Greek, but he used lots of Latin words, the language of Rome. Words like 'legion' and 'centurion.' He even explained the widow's tiny coins using a Roman coin! That would help readers in Rome."]},{"h":"Explaining Things","p":["Mark stops to explain Jewish customs, like special handwashing. He translates Jesus' Aramaic words, like 'Talitha koum.' Jewish readers already knew those things, so Mark was writing for people far away who weren't Jewish."]},{"h":"Hard Times in Rome","p":["About 30 years after Jesus, a big fire burned much of Rome. Emperor Nero blamed the Christians and made life very hard for them. Mark's book about Jesus being brave and taking up the cross would have helped them be brave too."]}],"people":[{"name":"Irenaeus","role":"An early church leader who wrote about Mark"},{"name":"Nero","role":"A Roman emperor who made life hard for Christians"}],"source":{"title":"Against Heresies, Book 3","who":"Irenaeus of Lyon","date":"About AD 180","text":"Irenaeus wrote that Mark, Peter's helper, wrote down what Peter had preached.","note":"Early Christians remembered that Mark's Gospel came from Peter."},"vocab":[["Latin","The language of Rome"],["Translate","To change words into another language"],["Persecution","Being treated badly for what you believe"]],"map":{"view":"wide","places":["rome","jerusalem_w","athens"],"caption":"Mark's clues point to readers far away in Rome."},"timeline":[{"y":64,"t":"A great fire burns Rome"},{"y":180,"t":"Irenaeus writes about Mark"}],"video":[],"quiz":[{"q":"What language did Mark write in?","options":["English","Spanish","Greek"],"answer":2,"why":"With some Latin words!"},{"q":"Why did Mark explain Jewish customs?","options":["His readers weren't Jewish","He forgot","He liked long books"],"answer":0,"why":"They lived far away."},{"q":"What happened in Rome?","options":["A party","A big fire","A flood"],"answer":1,"why":"Nero blamed the Christians."},{"q":"Who might have first read Mark?","options":["Christians in Rome","Moses","Pharaoh"],"answer":0,"why":"Mark helped them be brave."}],"assignment":"Look in Mark 5:41 and 7:34 with a parent. Find the Aramaic words Mark explained. Write them and their meanings.","hope":["The Christians in Rome had a hard time, but Mark's book about Jesus helped them be brave.","And the church kept growing! Today people all over the world read Mark's book."]},{"id":"mkh-05","bible":"mrk-05","bibleTitle":"A Man Named Legion, a Girl, and a Brave Woman","title":"Roman Legions and the Region of the Gerasenes","era":"1st century AD","intro":"The man with many evil spirits called himself 'Legion.' Everyone in the Roman world knew that word. It meant thousands of soldiers!","sections":[{"h":"What Was a Legion?","p":["A Roman legion was a huge group of about 5,000 to 6,000 soldiers. Legions were very well trained. They built roads, bridges, and forts everywhere they went.","For people in Israel, 'legion' meant a powerful army that no one could stop."]},{"h":"Jesus Is Stronger","p":["When the spirits said 'Our name is Legion, for we are many,' people would picture a whole army. But Jesus was stronger! He set the man free with just his word."]},{"h":"Where Did It Happen?","p":["About 55 years ago, road workers on the east side of the Sea of Galilee found ruins of an old church at a place called Kursi. There's a steep hill near the water. Many think early Christians built the church there because they remembered this story."]}],"people":[{"name":"The Tenth Legion","role":"A famous group of Roman soldiers"},{"name":"Josephus","role":"A writer who described Roman soldiers"}],"source":{"title":"The Jewish War, Book 3","who":"Josephus","date":"About AD 75","text":"Josephus wrote that Roman soldiers practiced every day as hard as if it were a real battle.","note":"Legions were very strong. But Jesus is stronger!"},"vocab":[["Legion","A big group of 5,000-6,000 Roman soldiers"],["Ruins","What's left of old buildings"],["Decapolis","Ten Greek cities near the Sea of Galilee"]],"map":{"view":"local","places":["kursi","gadara","gerasa","capernaum"],"caption":"Kursi is on the east side of the Sea of Galilee."},"timeline":[{"y":1970,"t":"Road workers find the ruins at Kursi","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"About how many soldiers were in a legion?","options":["1 million","10","5,000-6,000"],"answer":2,"why":"A huge group!"},{"q":"What did the man with spirits call himself?","options":["Sam","Legion","Peter"],"answer":1,"why":"'For we are many.'"},{"q":"Who is stronger than a legion?","options":["Jesus","Nobody","Pharaoh"],"answer":0,"why":"Jesus set the man free!"},{"q":"What was found at Kursi?","options":["An old church","A pyramid","A ship"],"answer":0,"why":"Road workers found it!"}],"assignment":"Count to 100 ten times (that's 1,000). Now imagine six times that many soldiers. That's a legion! Jesus is stronger.","hope":["The man called himself 'Legion' because he had so many evil spirits. But Jesus is stronger than any army!","Jesus set the man free, and the man went home to tell everyone what Jesus had done for him."]},{"id":"mkh-06","bible":"mrk-06","bibleTitle":"Sheep Without a Shepherd","title":"Banquets in the Ancient World","era":"1st century AD","intro":"Mark 6 has two very different meals: King Herod's fancy birthday party, and Jesus' simple picnic on the grass for thousands!","sections":[{"h":"Fancy Roman Parties","p":["Rich people in Rome loved big dinner parties. Guests lay on couches around low tables. Servants brought lots of food, and there might be music and dancing.","Important guests got the best seats, and sometimes better food than everyone else!"]},{"h":"Herod's Party","p":["Herod had a birthday party for important people. He wanted to show off. He made a foolish promise in front of everyone, and because he cared more about looking important than doing right, John the Baptist died. Jesus' meal was very different: he cared for hungry people."]},{"h":"Jesus' Picnic","p":["Right after that, Mark tells about Jesus' meal. Jesus had the people sit in groups on the green grass. Everyone got the same food, and everyone ate until they were full!","Psalm 23 says the Lord makes us lie down in green pastures. Jesus is the Good Shepherd who takes care of everyone."]}],"people":[{"name":"Herod Antipas","role":"The ruler who threw a fancy party"},{"name":"Pliny","role":"A Roman who wrote about dinner parties"}],"source":{"title":"Letters, Book 2, Letter 6","who":"Pliny the Younger","date":"About AD 100","text":"Pliny wrote about a host who gave fancy food to a few guests and cheap food to everyone else. Pliny said he gives all his guests the same food.","note":"At Jesus' meal, everyone got the same, and everyone was full!"},"vocab":[["Banquet","A big, fancy meal"],["Couch","A long seat people lay on to eat"],["Compassion","Caring about people who need help"]],"map":{"view":"local","places":["tiberias","machaerus","bethsaida"],"caption":"Herod lived at Tiberias. Jesus fed the 5,000 near Bethsaida."},"timeline":[{"y":100,"t":"Pliny writes about dinner parties"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"How did Romans eat at fancy parties?","options":["In the car","Lying on couches","Standing up"],"answer":1,"why":"Around low tables."},{"q":"Why did Herod throw his party?","options":["To feed the poor","For Jesus","To show off"],"answer":2,"why":"He wanted to look important."},{"q":"Where did Jesus' guests sit?","options":["On couches","In a palace","On green grass"],"answer":2,"why":"A picnic!"},{"q":"How much did everyone get at Jesus' meal?","options":["Nothing","Just a crumb","Enough to be full"],"answer":2,"why":"Jesus cares for everyone."}],"assignment":"Have a family picnic where everyone gets the same food. Read Psalm 23 together.","hope":["Herod's party was about showing off. Jesus' picnic was about caring for hungry people.","Jesus fed more than 5,000 people with just five loaves and two fish! He is our Good Shepherd."]},{"id":"mkh-07","bible":"mrk-07","bibleTitle":"Clean Hearts and Opened Ears","title":"Aramaic, Greek, and the Corban Box","era":"1st century AD","intro":"Mark wrote down some of Jesus' real words in Aramaic, the language Jesus spoke. And an old stone box has the word 'Corban' on it!","sections":[{"h":"Lots of Languages","p":["In Jesus' time, people in Israel spoke several languages. Aramaic was the everyday language. Hebrew was used for the Bible and worship. Greek was used for trade. Latin was spoken by Roman soldiers.","That's why the sign on Jesus' cross was written in three languages!"]},{"h":"Jesus' Own Words","p":["Mark kept some of Jesus' Aramaic words: 'Talitha koum' means 'Little girl, get up.' 'Ephphatha' means 'Be opened.' 'Abba' means 'Father.' When we read them, we hear the sounds of Jesus' real voice!"]},{"h":"The Corban Box","p":["Jesus talked about people who called their money 'Corban,' meaning 'given to God,' so they wouldn't have to help their parents.","About 70 years ago, people found an old stone box near Jerusalem with 'Corban' carved on it. It said anything in the box belonged to God, so robbers wouldn't take it!"]}],"people":[{"name":"Jesus","role":"Spoke Aramaic every day"},{"name":"Mark","role":"Wrote down some of Jesus' Aramaic words"}],"source":{"title":"The Corban Ossuary Inscription","who":"Carved on a Jerusalem bone box","date":"1st century BC or AD; found in 1956","text":"The words on the box say: Anything a person finds in this box is an offering (Corban) to God.","note":"'Corban' was a real word people used, just like Mark says."},"vocab":[["Aramaic","The language Jesus spoke every day"],["Corban","Something given to God"],["Abba","Aramaic for 'Father'"]],"map":{"view":"local","places":["jerusalem","tyre","gadara"],"caption":"Jesus traveled from Galilee to places where people spoke Greek."},"timeline":[{"y":1956,"t":"The 'Corban' box is found near Jerusalem","d":true}],"video":[],"quiz":[{"q":"What language did Jesus speak every day?","options":["English","Aramaic","French"],"answer":1,"why":"Most people there spoke it."},{"q":"What does 'Abba' mean?","options":["Hello","Bread","Father"],"answer":2,"why":"Jesus called God 'Abba.'"},{"q":"What does 'Corban' mean?","options":["Box","Money","Given to God"],"answer":2,"why":"Something set apart for God."},{"q":"What does 'Ephphatha' mean?","options":["Be quiet","Be opened","Go away"],"answer":1,"why":"Jesus opened a man's ears!"}],"assignment":"Make a mini-dictionary of Jesus' Aramaic words: Talitha koum, Ephphatha, Abba, and Corban. Draw a picture for each."},{"id":"mkh-08","bible":"mrk-08","bibleTitle":"Seeing Clearly: Who Is Jesus?","title":"Bethsaida: Searching for a Lost Town","era":"1st century AD to today","intro":"Jesus healed a blind man at Bethsaida, the hometown of Peter, Andrew, and Philip. But where exactly was it? Archaeologists are still looking!","sections":[{"h":"House of Fishing","p":["Bethsaida means 'house of fishing.' It was near where the Jordan River flows into the Sea of Galilee. A ruler named Philip made it into a city and gave it a new name."]},{"h":"Two Places to Check","p":["One team of archaeologists has dug at a hill called et-Tell. They found fishing hooks and net weights. But it's a little far from the lake.","Another team is digging at el-Araj, right on the shore. They found an old Roman bathhouse and the ruins of a church. Some think the church was built over Peter and Andrew's house!"]},{"h":"How Archaeologists Decide","p":["Archaeologists look at lots of clues: old books, pottery, coins, buildings, and how the land has changed. Sometimes the clues point different ways, and they keep looking. That's part of the adventure!"]}],"people":[{"name":"Peter, Andrew, and Philip","role":"Disciples from Bethsaida"},{"name":"Philip the ruler","role":"Made Bethsaida into a city"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Philip made the village of Bethsaida into a city by the lake and gave it a new name.","note":"Josephus helps archaeologists know what to look for."},"vocab":[["Clue","Something that helps you figure out an answer"],["Net weight","A heavy stone tied to a fishing net"],["Excavate","To dig carefully to find old things"]],"map":{"view":"local","places":["bethsaida","capernaum","caesareaphilippi"],"caption":"Bethsaida was near where the Jordan River flows into the Sea of Galilee."},"timeline":[{"y":-2,"t":"Philip renames Bethsaida"},{"y":1987,"t":"Digging begins at et-Tell","d":true},{"y":2016,"t":"Digging begins at el-Araj","d":true}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What does Bethsaida mean?","options":["Blue lake","House of fishing","Big city"],"answer":1,"why":"A fishing town!"},{"q":"Which disciples came from Bethsaida?","options":["Judas and Thomas","Matthew and John","Peter, Andrew, and Philip"],"answer":2,"why":"Three disciples!"},{"q":"What was found at et-Tell?","options":["A car","Fishing hooks and net weights","A palace"],"answer":1,"why":"Clues of fishing."},{"q":"Do archaeologists know for sure where Bethsaida was?","options":["Yes","Not yet"],"answer":1,"why":"They're still looking!"}],"assignment":"Play detective! Hide a toy and give a family member three clues to find it. That's how archaeologists work."},{"id":"mkh-09","bible":"mrk-09","bibleTitle":"Help My Unbelief","title":"Salt, Millstones, and the Valley of Hinnom","era":"Ancient Israel to the 1st century AD","intro":"Jesus talked about salt, a giant millstone, and a valley outside Jerusalem. These were real things his listeners knew all about!","sections":[{"h":"Salt Was Precious","p":["Long ago there were no refrigerators. Salt was the main way to keep meat and fish from going bad. It was very valuable!","Salt from near the Dead Sea had other stuff mixed in. If the salt washed out, what was left looked like salt but didn't taste salty. That's what Jesus meant about salt losing its saltiness."]},{"h":"A Donkey Millstone","p":["Most families ground grain with a small hand mill. But Jesus talked about a giant millstone turned by a donkey walking in circles! These stones weighed hundreds of pounds. Archaeologists have found lots of them in Galilee."]},{"h":"A Valley Outside Jerusalem","p":["The word Jesus used for hell, Gehenna, comes from a real valley outside Jerusalem. Long ago, some kings worshiped false gods there and did terrible things. So it became a picture of God's judgment. Today it's a green park!"]}],"people":[{"name":"Pliny","role":"A Roman who wrote all about salt"},{"name":"King Josiah","role":"A king who stopped false worship in the valley"}],"source":{"title":"Natural History, Book 31","who":"Pliny the Elder","date":"About AD 77","text":"Pliny wrote that people can't live a good life without salt, and that nothing is more useful than salt and sunshine.","note":"Salt was very important long ago!"},"vocab":[["Preserve","To keep food from going bad"],["Millstone","A big round stone for grinding grain"],["Valley","Low land between hills"]],"map":{"view":"local","places":["jerusalem","capernaum","qumran"],"caption":"The valley Jesus talked about is on the south side of Jerusalem."},"timeline":[{"y":-622,"t":"King Josiah stops false worship in the valley"},{"y":77,"t":"Pliny writes about salt"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What was salt mostly used for long ago?","options":["Keeping food from going bad","Painting","Cleaning shoes"],"answer":0,"why":"No refrigerators!"},{"q":"What turned a giant millstone?","options":["Wind","A car","A donkey walking in circles"],"answer":2,"why":"A donkey millstone!"},{"q":"Where does the word Gehenna come from?","options":["A valley outside Jerusalem","A river","A mountain"],"answer":0,"why":"A real place."},{"q":"What did Pliny say is most useful?","options":["Salt and sunshine","Gold and silver","Cake"],"answer":0,"why":"Salt was precious!"}],"assignment":"Science time! Stir salt into a little water. Put it in a sunny window for a few days. What's left when the water dries up?","hope":["Jesus wants us to be like salt: good for the world around us, and at peace with each other.","God loves to take sad things and make them new and good."]},{"id":"mkh-10","bible":"mrk-10","bibleTitle":"Not to Be Served, But to Serve","title":"Beggars, the Poor, and the First Hospitals","era":"1st to 4th century AD","intro":"Blind Bartimaeus had to beg by the road to live. Jesus' care for people like him changed how Christians treated the poor and sick, and helped start the first hospitals!","sections":[{"h":"Begging by the Road","p":["Long ago there were no hospitals or help programs for people who were blind or sick. Bartimaeus sat by a busy road and asked travelers for money.","His coat was probably his most important thing. He used it to stay warm at night and to catch coins. When he threw it off to run to Jesus, he left everything behind!"]},{"h":"God Cares for the Poor","p":["God's law told farmers to leave the edges of their fields for poor people to pick. Jewish families gave to help people in need."]},{"h":"The First Hospitals","p":["Early Christians followed Jesus' example. They cared for widows, sick people, and the poor, even people who weren't Christians!","About 1,650 years ago, a church leader named Basil built one of the first hospitals. A Roman emperor who didn't like Christians even complained that Christians helped everybody's poor people!"]}],"people":[{"name":"Bartimaeus","role":"A blind man Jesus healed"},{"name":"Basil","role":"A church leader who built one of the first hospitals"}],"source":{"title":"Letter to Arsacius","who":"Emperor Julian","date":"About AD 362","text":"Emperor Julian complained that the Christians took care of their own poor people and other people's poor people too.","note":"Even an emperor who didn't like Christians noticed how kind they were!"},"vocab":[["Beggar","A person who asks others for money or food"],["Hospital","A place where sick people get care"],["Charity","Helping people in need"]],"map":{"view":"local","places":["jericho","jerusalem","jordanbaptism"],"caption":"Bartimaeus sat by the busy road from Jericho to Jerusalem."},"timeline":[{"y":362,"t":"Emperor Julian complains about Christian kindness"},{"y":369,"t":"Basil builds one of the first hospitals"}],"video":[],"quiz":[{"q":"Why did Bartimaeus sit by the road?","options":["He was waiting for a bus","Lots of travelers passed by","He was lost"],"answer":1,"why":"He asked them for help."},{"q":"What did Bartimaeus throw off to go to Jesus?","options":["His coat","His hat","His shoes"],"answer":0,"why":"He left everything!"},{"q":"Who built one of the first hospitals?","options":["Herod","Basil","Pharaoh"],"answer":1,"why":"Following Jesus' example."},{"q":"What did the emperor complain about?","options":["Nothing","Christians helped everybody's poor people","Christians were mean"],"answer":1,"why":"Christians were kind to all!"}],"assignment":"With a parent, find a way to help someone in need, like donating food or making a card for someone in the hospital."},{"id":"mkh-11","bible":"mrk-11","bibleTitle":"A House of Prayer for All Nations","title":"Fig Trees and the High Priests' Business","era":"1st century AD","intro":"Jesus cursed a fig tree with no fruit and cleared the sellers out of the temple. Knowing about fig trees and the temple leaders helps us understand why.","sections":[{"h":"Fig Trees","p":["Fig trees grew all over Israel. In spring, they get leaves, and tiny early figs usually come out with the leaves. A tree with leaves but no little figs at all wasn't going to make fruit that year.","God's prophets used the fig tree as a picture of Israel. Jesus was acting out a warning, like the prophets did."]},{"h":"Selling in the Temple","p":["People traveling far for Passover needed to buy animals and trade their money. That was okay. But the selling had moved into the yard where people from other countries were supposed to pray!"]},{"h":"Greedy Leaders","p":["A few rich priest families ran the temple. Old Jewish writings say some of them were greedy and mean. So Jesus wasn't the only one upset about what was happening."]}],"people":[{"name":"Annas","role":"Leader of a powerful priest family"},{"name":"Caiaphas","role":"The high priest, Annas' son-in-law"}],"source":{"title":"Babylonian Talmud, Pesachim 57a","who":"Jewish teachers, recording an older lament","date":"Written down about AD 500, preserving older sayings","text":"An old Jewish poem says: How sad for us because of the priest families! Their servants hit the people with sticks.","note":"Many people were upset about how the temple leaders acted."},"vocab":[["Fig","A sweet fruit that grows on trees"],["Prophet","Someone who speaks God's message"],["Greedy","Wanting more than you need"]],"map":{"view":"local","places":["jerusalem","bethany","jericho"],"caption":"Jesus stayed in Bethany and walked over the Mount of Olives into Jerusalem."},"timeline":[{"y":18,"t":"Caiaphas becomes high priest"},{"y":500,"t":"Jewish teachings are written down"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"What was wrong with the fig tree?","options":["It was too short","It was purple","Leaves but no fruit"],"answer":2,"why":"It looked good but had no fruit."},{"q":"Where had the selling moved?","options":["To the beach","Outside the city","Into the yard where people from other countries prayed"],"answer":2,"why":"It got in the way of prayer."},{"q":"Which family ran the temple?","options":["Pharaoh's family","Annas' family","Peter's family"],"answer":1,"why":"Caiaphas was Annas' son-in-law."},{"q":"Was Jesus the only one upset?","options":["No, many people were","Yes"],"answer":0,"why":"Others were upset too."}],"assignment":"Draw two trees: one with only leaves and one full of fruit. What 'fruit' does God want to grow in your life?"},{"id":"mkh-12","bible":"mrk-12","bibleTitle":"Questions in the Temple and a Widow's Gift","title":"The Widow's Mite and the Temple Treasury","era":"About 100 BC to AD 70","intro":"Jesus watched a poor widow put two tiny coins in the temple offering. Archaeologists have found thousands of coins just like hers!","sections":[{"h":"The Tiniest Coins","p":["The widow's coins were called lepta. They were tiny bronze coins, the smallest money people used. A king named Alexander made lots of them. They're so common that people can still buy one today!","Her two coins were worth just a few minutes of work. But it was all she had."]},{"h":"Trumpet-Shaped Boxes","p":["Old Jewish writings say the temple had thirteen offering boxes shaped like trumpets: skinny at the top and wide at the bottom, so no one could steal from them.","When people dropped in lots of coins, they clattered down loudly! The widow's two tiny coins would hardly make a sound. But Jesus noticed."]},{"h":"Widows Long Ago","p":["A widow is a woman whose husband has died. Back then, widows often had no money and no one to help. God's law said to take care of them. Jesus saw this widow and said she gave more than anyone."]}],"people":[{"name":"The poor widow","role":"Gave everything she had"},{"name":"Alexander Jannaeus","role":"A king who made many tiny coins"}],"source":{"title":"The Mishnah, Shekalim 6:5","who":"Jewish rabbis","date":"Written down about AD 200","text":"Old Jewish writings say there were thirteen trumpet-shaped boxes in the temple for different offerings, like wood, incense, and gifts.","note":"The widow put her coins in one of these!"},"vocab":[["Lepton","A tiny bronze coin"],["Widow","A woman whose husband has died"],["Offering","A gift given to God"]],"map":{"view":"local","places":["jerusalem"],"caption":"The offering boxes were in the temple in Jerusalem."},"timeline":[{"y":-103,"t":"King Alexander starts making tiny coins"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"What were the widow's coins called?","options":["Dollars","Lepta","Gold bars"],"answer":1,"why":"The tiniest coins."},{"q":"What shape were the offering boxes?","options":["Like trumpets","Like squares","Like stars"],"answer":0,"why":"Skinny on top, wide on the bottom."},{"q":"Why didn't her coins make much noise?","options":["She whispered","They were made of paper","They were tiny"],"answer":2,"why":"But Jesus noticed!"},{"q":"Why did Jesus say she gave the most?","options":["Her coins were gold","She was rich","She gave all she had"],"answer":2,"why":"God looks at the heart."}],"assignment":"Drop a penny into a metal can, then a handful of coins. Hear the difference? Jesus notices even small gifts!"},{"id":"mkh-13","bible":"mrk-13","bibleTitle":"Stay Awake!","title":"Stones That Were Thrown Down","era":"AD 70 to today","intro":"Jesus said not one stone of the temple would be left on another. Archaeologists have found giant stones still lying right where they fell, just like Jesus said!","sections":[{"h":"Stones on the Street","p":["Archaeologists dug next to the temple walls in Jerusalem. They found an old street from Jesus' time with little shops.","On the street was a big pile of giant stones that had crashed down from the top of the temple walls! They hit so hard they cracked the street. You can still see them today."]},{"h":"The Trumpet Stone","p":["One fallen stone has words carved on it: 'To the place of trumpeting.' A priest used to stand there and blow a trumpet to start and end the Sabbath. It was thrown down when Rome destroyed the temple, just as Jesus said."]},{"h":"The Burnt House","p":["In Jerusalem, archaeologists found a house that burned down when the Romans took the city. Inside were cooking pots and coins. It's like a snapshot of the day Jerusalem fell, about 40 years after Jesus' warning."]}],"people":[{"name":"Benjamin Mazar","role":"Archaeologist who found the fallen stones"},{"name":"Titus","role":"The Roman general who destroyed the temple"}],"source":{"title":"The 'Place of Trumpeting' Inscription","who":"Carved on the temple's southwest corner","date":"1st century AD; found in 1968","text":"The words carved on the fallen stone say: 'To the place of trumpeting.'","note":"This stone fell from the top of the temple wall."},"vocab":[["Temple Mount","The hill where the temple stood"],["Ash","What's left after something burns"],["Warning","Telling someone about danger ahead"]],"map":{"view":"local","places":["jerusalem","pella"],"caption":"Jesus warned people in Judea to run to the mountains."},"timeline":[{"y":70,"t":"Roman soldiers throw down the temple stones"},{"y":1968,"t":"The trumpet stone is found","d":true}],"video":[],"quiz":[{"q":"What did Jesus say about the temple stones?","options":["They would turn to gold","They would grow","Not one would be left on another"],"answer":2,"why":"It came true!"},{"q":"What did the falling stones do to the street?","options":["Cracked it","Painted it","Nothing"],"answer":0,"why":"They were so heavy!"},{"q":"What does the trumpet stone say?","options":["Hello","Stop","To the place of trumpeting"],"answer":2,"why":"A priest blew a trumpet there."},{"q":"What was found in the Burnt House?","options":["Cooking pots and coins","Cars","Toys"],"answer":0,"why":"A snapshot of the day Jerusalem fell."}],"assignment":"Build a tall tower of blocks, then take it apart. Then read Mark 13:2 and talk about how Jesus' words always come true.","hope":["The fallen stones show that Jesus' words always come true.","Jesus also promised he will come back someday. We can trust him!"]},{"id":"mkh-14","bible":"mrk-14","bibleTitle":"Anointed, Betrayed, and Arrested","title":"Upper Rooms and Mansions in Jerusalem","era":"1st century AD","intro":"Jesus ate the Last Supper in a big upstairs room. Archaeologists have found fancy houses in Jerusalem that help us picture it!","sections":[{"h":"The Upper City","p":["Rich families and priests lived in a neighborhood called the Upper City. Archaeologists found fancy houses there from Jesus' time, buried under ashes. One huge house is called the Herodian Mansion!"]},{"h":"Inside a Fancy House","p":["These houses had painted walls, floors made of tiny colored tiles called mosaics, nice dishes, and special pools for washing. Rooms were around a courtyard, and some had upstairs rooms.","An upper room was a big room upstairs for guests and gatherings."]},{"h":"Mark's House?","p":["Jesus told two disciples to follow a man carrying a water jar to a house with an upper room. Some people wonder if it was Mark's mom's house! We don't know for sure, but it's fun to think about."]}],"people":[{"name":"Mary, Mark's mom","role":"Had a house in Jerusalem where Christians met"},{"name":"Nahman Avigad","role":"Archaeologist who dug up fancy houses in Jerusalem"}],"source":{"title":"The Herodian Mansion (Wohl Archaeological Museum)","who":"A wealthy, possibly priestly, Jerusalem family","date":"1st century AD; excavated 1969-1983","text":"Archaeologists found a big house with a courtyard, painted walls, tile floors, nice dishes, and washing pools. It burned when the Romans took the city.","note":"This is the kind of house that might have had an upper room."},"vocab":[["Upper room","A big room upstairs for gatherings"],["Mosaic","A picture made of tiny colored tiles"],["Courtyard","An open yard inside a house"]],"map":{"view":"local","places":["jerusalem","bethany"],"caption":"Jesus came from Bethany into Jerusalem for the Passover meal."},"timeline":[{"y":1969,"t":"Archaeologists start digging in Jerusalem's old neighborhoods","d":true}],"video":[["Drive Thru History: The Last Supper","https://watch.tbn.org/s/Q9aSuuiu?e=QfYSBn17"]],"quiz":[{"q":"Where did Jesus eat the Last Supper?","options":["On a boat","In an upper room","In a field"],"answer":1,"why":"A big room upstairs."},{"q":"What is a mosaic?","options":["A song","A picture made of tiny tiles","A kind of food"],"answer":1,"why":"Fancy floors!"},{"q":"What was the man carrying?","options":["A water jar","A lamb","A sword"],"answer":0,"why":"The disciples followed him."},{"q":"Whose house might it have been?","options":["Pharaoh's","Mark's mom's","Herod's"],"answer":1,"why":"We don't know for sure!"}],"assignment":"Make a mosaic! Cut colored paper into tiny squares and glue them into a picture."},{"id":"mkh-15","bible":"mrk-15","bibleTitle":"Surely This Man Was the Son of God","title":"Simon of Cyrene and His Sons","era":"1st century AD","intro":"Mark tells us the name of the man who carried Jesus' cross: Simon from Cyrene. He even names Simon's sons! An old box found in a tomb might be a clue.","sections":[{"h":"From Africa","p":["Cyrene was a city in North Africa. Lots of Jewish people lived there and traveled to Jerusalem for holidays.","Simon was coming into the city when Roman soldiers made him carry Jesus' cross."]},{"h":"Alexander and Rufus","p":["Only Mark tells us Simon's sons were named Alexander and Rufus. Why? Mark's readers probably knew them from church!","Paul wrote to the Christians in Rome and said hello to 'Rufus' and his mom. Many think it's the same Rufus. So the man who carried Jesus' cross had a family who followed Jesus!"]},{"h":"A Family Tomb","p":["About 85 years ago, archaeologists found a family tomb near Jerusalem. It had names common for people from Cyrene. One box said 'Alexander, son of Simon'! We can't be sure it's the same family, but it's an amazing find."]}],"people":[{"name":"Simon of Cyrene","role":"Carried Jesus' cross"},{"name":"Alexander and Rufus","role":"Simon's sons, probably Christians"}],"source":{"title":"Ossuary from the Kidron Valley Tomb","who":"A Cyrenian Jewish family in Jerusalem","date":"1st century AD; found in 1941","text":"A stone box from the family tomb has these words in Greek: 'Alexander, son of Simon.'","note":"This might be the same family Mark wrote about!"},"vocab":[["Cyrene","A city in North Africa"],["Tomb","A place where people are buried"],["Clue","Something that helps solve a mystery"]],"map":{"view":"wide","places":["cyrene","jerusalem_w","rome"],"caption":"Simon came from Cyrene in North Africa. His son Rufus may have lived in Rome."},"timeline":[{"y":57,"t":"Paul says hello to Rufus in a letter"},{"y":1941,"t":"The 'Alexander son of Simon' box is found","d":true}],"video":[],"quiz":[{"q":"Where was Cyrene?","options":["America","China","North Africa"],"answer":2,"why":"Lots of Jewish people lived there."},{"q":"What did Simon carry?","options":["A lamb","A basket","Jesus' cross"],"answer":2,"why":"Soldiers made him do it."},{"q":"What were Simon's sons' names?","options":["James and John","Alexander and Rufus","Peter and Andrew"],"answer":1,"why":"Only Mark tells us!"},{"q":"What did the box in the tomb say?","options":["Jesus","Hello","Alexander, son of Simon"],"answer":2,"why":"An amazing clue!"}],"assignment":"Pretend you're Rufus. Tell your family the story of the day your dad carried Jesus' cross.","hope":["Simon helped carry Jesus' cross. Later, it seems his whole family followed Jesus!","And three days after the cross, Jesus rose again. Because of him, we can be part of God's family too."]},{"id":"mkh-16","bible":"mrk-16","bibleTitle":"He Has Risen! Go and Tell","title":"How We Got the Gospels: Ancient Manuscripts","era":"2nd century AD to today","intro":"Before printers, the Bible was copied by hand for 1,400 years! Let's learn about the very old copies of the Gospels.","sections":[{"h":"Copied by Hand","p":["The first books of the New Testament were written on papyrus, a kind of paper that wears out. So Christians copied them by hand again and again.","Today we have more than 5,000 old handwritten copies of the New Testament in Greek. That's more than any other book from long ago!"]},{"h":"Two Very Old Bibles","p":["Two of the oldest whole Bibles are about 1,700 years old. One has been in a library in Rome for a long time. The other was found at the monastery at Mount Sinai, the same one near the burning bush!"]},{"h":"Mark's Ending","p":["Those two very old Bibles end Mark at chapter 16, verse 8. Later copies have more verses. That's why many Bibles have a note there. Scholars compare lots of copies very carefully.","The most important truths, like Jesus rising from the dead, are taught clearly all over the Bible."]}],"people":[{"name":"Constantin von Tischendorf","role":"Found a very old Bible at Mount Sinai"},{"name":"Scribes","role":"People who copied the Bible by hand"}],"source":{"title":"Codex Sinaiticus","who":"Scribes in the 300s AD","date":"About AD 330-360","text":"This old Bible is handwritten in Greek capital letters on animal skin, with four skinny columns on each page.","note":"Scribes worked very carefully to copy God's Word."},"vocab":[["Manuscript","A book written by hand"],["Scribe","A person who copies writing by hand"],["Codex","An old book with pages"]],"map":{"view":"wide","places":["jerusalem_w","alexandria","rome"],"caption":"One very old Bible was found at Mount Sinai. Another has been kept in Rome."},"timeline":[{"y":340,"t":"Two very old Bibles are copied by hand"},{"y":1859,"t":"An old Bible is brought from Mount Sinai to Europe","d":true}],"video":[["Drive Thru History: The Resurrection of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=tDaHdjCj"]],"quiz":[{"q":"How was the Bible copied before printers?","options":["By copy machine","By hand","By computer"],"answer":1,"why":"For 1,400 years!"},{"q":"About how many old Greek copies do we have?","options":["3","10","More than 5,000"],"answer":2,"why":"More than any other old book!"},{"q":"Where was one very old Bible found?","options":["In a cave in America","In a river","At the monastery at Mount Sinai"],"answer":2,"why":"Near the burning bush!"},{"q":"What is a scribe?","options":["A soldier","A person who copies by hand","A king"],"answer":1,"why":"Scribes were very careful."}],"assignment":"Be a scribe! Copy Mark 16:6 by hand in your best writing. You finished Mark history! Draw your favorite discovery."}],"lessons/matthew.json":[{"id":"hist-01","bible":"mat-01","bibleTitle":"A Family Tree and a Surprise Baby","title":"The World Jesus Was Born Into","era":"About 63 BC to 4 BC","intro":"When Jesus was born, the Jewish people lived in a small land ruled by a giant empire called Rome. Let's learn about that world!","sections":[{"h":"Rome Rules the World","p":["Rome was the most powerful empire in the world. Its first emperor was named Augustus. He ruled when Jesus was born.","Under Augustus there was a long time with no big wars inside the empire, called the Roman Peace. Romans built great roads, and lots of people spoke Greek. Later, this helped the good news about Jesus spread fast!"]},{"h":"Rome Takes Over Judea","p":["About 60 years before Jesus was born, a Roman general named Pompey captured Jerusalem. After that, Rome was the boss. Rome made a man named Herod the 'King of the Jews.' Herod was king when Jesus was born."]},{"h":"Waiting for the Messiah","p":["Many Jewish people were waiting for the Messiah, the King God promised would come from King David's family. Some hoped he would fight the Romans.","That's why Matthew starts with Jesus' family tree. It shows Jesus came from King David's family, just as God promised!"]}],"people":[{"name":"Augustus","role":"Rome's first emperor, ruling when Jesus was born"},{"name":"Herod the Great","role":"King of the Jews, chosen by Rome"}],"source":{"title":"The Deeds of the Divine Augustus (Res Gestae)","who":"Augustus himself","date":"Written by AD 14","text":"Augustus wrote a list of the great things he did. He bragged that he brought peace to the Roman world, and that he counted all the people three times.","note":"Remember, Luke 2 says Jesus was born in Bethlehem because of a count of people ordered by Augustus!"},"vocab":[["Empire","Many lands ruled by one powerful ruler"],["Emperor","The ruler of an empire"],["Messiah","The King God promised to send"]],"map":{"view":"wide","places":["rome","jerusalem_w","alexandria","antioch","athens"],"caption":"The Roman world. Judea was a small land far from the city of Rome."},"timeline":[{"y":-63,"t":"Rome takes over Jerusalem"},{"y":-27,"t":"Augustus becomes Rome's first emperor"},{"y":-5,"t":"Jesus is born"}],"video":[["Drive Thru History: The Historical Landscape","https://watch.tbn.org/s/Q9aSuuiu?e=2LGRQ7EL"],["Drive Thru History: The Announcements","https://watch.tbn.org/s/Q9aSuuiu?e=A2LJ87jP"]],"quiz":[{"q":"Who was Rome's first emperor?","options":["Pompey","Herod","Augustus"],"answer":2,"why":"Augustus ruled when Jesus was born."},{"q":"Who was the boss of Judea when Jesus was born?","options":["Egypt","Rome","Babylon"],"answer":1,"why":"Rome was in charge."},{"q":"Who were the Jewish people waiting for?","options":["Pompey","A new emperor","The Messiah"],"answer":2,"why":"The King God promised."},{"q":"Why does Matthew start with a family tree?","options":["To fill up space","To show Jesus came from King David","To list his friends"],"answer":1,"why":"The Messiah had to come from David's family."}],"assignment":"Pretend you are a kid living in Judea when Jesus was born. Draw what you might see: Roman soldiers, King Herod's buildings, and your family hoping for the Messiah."},{"id":"hist-02","bible":"mat-02","bibleTitle":"Wise Men and a Jealous King","title":"Herod the Great and the Magi","era":"37 BC to 4 BC","intro":"King Herod was jealous in Matthew 2. History books outside the Bible tell us the same thing! He was also an amazing builder. But Herod couldn't stop God's plan.","sections":[{"h":"How Herod Became King","p":["Herod was very good at making friends with powerful Romans. The Roman leaders named him 'King of the Jews.' But many Jewish people never liked him."]},{"h":"Herod the Builder","p":["Herod built amazing things! He made the temple in Jerusalem huge and beautiful. He built a city by the sea with a giant harbor. He built palaces on top of cliffs and hills.","One of his palaces was on a hill near Bethlehem. Archaeologists think they found Herod's tomb there!"]},{"h":"A Worried King","p":["Herod was always afraid someone would take his throne. He didn't trust anyone, not even his own family. So when wise men came asking about a new 'king of the Jews,' Herod was very upset.","The wise men probably came from Persia or Babylon. They studied the stars. Herod died a few years after Jesus was born."]}],"people":[{"name":"Herod the Great","role":"King who built amazing things but was jealous and mean"},{"name":"The Magi","role":"Wise men from the East who came to worship Jesus"}],"source":{"title":"Antiquities of the Jews, Book 15","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Herod used a thousand wagons to carry stones for the temple, and had ten thousand workers build it.","note":"Herod was a jealous king, but he was a great builder. Jesus visited the temple Herod built!"},"vocab":[["Magi","Wise men who studied the stars"],["Palace","A home for a king"],["Tomb","A place where someone is buried"]],"map":{"view":"local","places":["jerusalem","bethlehem","herodium","masada","caesarea","nazareth"],"caption":"Herod built palaces and forts near Bethlehem, where Jesus was born."},"timeline":[{"y":-37,"t":"Herod becomes king in Jerusalem"},{"y":-4,"t":"Herod dies"},{"y":2007,"t":"Archaeologists think they find Herod's tomb","d":true}],"video":[["Drive Thru History: Jesus Is Born","https://watch.tbn.org/s/Q9aSuuiu?e=RDOb7PY9"],["Drive Thru History: Jesus Grows Up","https://watch.tbn.org/s/Q9aSuuiu?e=Ee6Zsm9X"]],"quiz":[{"q":"What was Herod good at?","options":["Building","Fishing","Singing"],"answer":0,"why":"He built amazing things."},{"q":"Why was Herod upset about the wise men's question?","options":["He didn't want another king","He was hungry","He liked stars"],"answer":0,"why":"He was afraid of losing his throne."},{"q":"Where did the wise men probably come from?","options":["Egypt","Persia or Babylon","Rome"],"answer":1,"why":"From the East."},{"q":"What did Herod make huge and beautiful?","options":["A ship","A pyramid","The temple in Jerusalem"],"answer":2,"why":"Herod's temple was amazing."}],"assignment":"Make two lists: 'Things Herod Built' and 'Ways God Kept Jesus Safe.' Write two things in each list.","hope":["Herod tried to stop baby Jesus, but God was in charge! God warned Joseph in a dream, and Jesus' family went safely to Egypt.","Herod's palaces are ruins now. But Jesus is King forever!"]},{"id":"hist-03","bible":"mat-03","bibleTitle":"John the Baptist and Jesus' Baptism","title":"Pharisees, Sadducees, and the Dead Sea Scrolls","era":"About AD 28","intro":"When John the Baptist preached, different Jewish groups were watching. One group left behind a hidden library that a shepherd boy found in a cave!","sections":[{"h":"Different Groups","p":["The Pharisees were teachers who tried to obey God's law in every little thing. They believed in angels and that people will rise from the dead.","The Sadducees were rich priests who ran the temple. They didn't believe people would rise from the dead. Another group, the Essenes, moved out to the desert."]},{"h":"The Dead Sea Scrolls","p":["About 75 years ago, a shepherd boy was looking for a lost goat. He threw a rock into a cave and heard something break. Inside were clay jars with very old scrolls!","People found hundreds of scrolls in caves near the Dead Sea. They include parts of almost every book of the Old Testament! One scroll of Isaiah is about 2,000 years old, and it says almost the same thing as our Bibles today."]},{"h":"John in the Desert","p":["Jewish people often washed in special pools to be clean. But John's baptism was different. It was a sign of being sorry for sin and getting ready for God's kingdom."]}],"people":[{"name":"John the Baptist","role":"Prophet who baptized people in the Jordan River"},{"name":"Muhammad edh-Dhib","role":"The shepherd boy who found the first scrolls"}],"source":{"title":"The Community Rule (one of the Dead Sea Scrolls)","who":"The Qumran community","date":"About 100 BC","text":"The people who wrote the scrolls said they went out to the desert to study God's law and prepare the way of the Lord.","note":"They used the same verse from Isaiah that Matthew uses about John the Baptist!"},"vocab":[["Scroll","A long roll of paper or leather with writing"],["Pharisee","A strict teacher of God's law"],["Sadducee","A rich priest who ran the temple"]],"map":{"view":"local","places":["jordanbaptism","qumran","jericho","jerusalem"],"caption":"John baptized by the Jordan River, a few miles from the caves where the scrolls were found."},"timeline":[{"y":28,"t":"John the Baptist begins preaching"},{"y":1947,"t":"A shepherd boy finds the Dead Sea Scrolls","d":true}],"video":[["Drive Thru History: Jesus Starts His Ministry","https://watch.tbn.org/s/Q9aSuuiu?e=mdExyFzO"]],"quiz":[{"q":"How were the first Dead Sea Scrolls found?","options":["They washed up on a beach","A dog dug them up","A shepherd boy threw a rock into a cave"],"answer":2,"why":"He was looking for a lost goat!"},{"q":"Who didn't believe people would rise from the dead?","options":["Pharisees","Sadducees","John"],"answer":1,"why":"The Sadducees."},{"q":"What did the scrolls show about the Bible?","options":["It was lost","It was changed a lot","It was copied very carefully"],"answer":2,"why":"The Isaiah scroll matches our Bible!"},{"q":"Where did John baptize?","options":["The Dead Sea","The Jordan River","A pool"],"answer":1,"why":"In the Jordan River."}],"assignment":"Make your own scroll! Tape paper together, roll it around two pencils, and write Isaiah 40:3 on it."},{"id":"hist-04","bible":"mat-04","bibleTitle":"Tested in the Desert, Calling Fishermen","title":"Fishing on the Sea of Galilee","era":"About AD 28-30","intro":"Jesus called fishermen to follow him. About 40 years ago, people found a real fishing boat from Jesus' time in the mud of the Sea of Galilee!","sections":[{"h":"The Sea of Galilee","p":["The Sea of Galilee is really a big lake with fresh water. Busy towns sat all around it, like Capernaum, where Jesus lived, and Bethsaida, where Peter and Andrew came from."]},{"h":"Fishing for a Living","p":["Fishermen used different nets. Some threw round nets. Others pulled long nets with a team. They often fished at night when fish swim near the top.","James and John's dad, Zebedee, had workers who helped him. So when the disciples left their nets, they were leaving a family business!"]},{"h":"The Jesus Boat","p":["In 1986, there wasn't much rain, and the lake got low. Two brothers spotted an old boat in the mud! Scientists found it was from about the time of Jesus.","The boat is about 27 feet long, big enough for a dozen people. It had been fixed many times. It's the kind of boat the disciples used! Now it's in a museum."]}],"people":[{"name":"Zebedee","role":"Father of James and John, a fisherman with workers"},{"name":"Moshe and Yuval Lufan","role":"Brothers who found the old boat"}],"source":{"title":"The Jewish War, Book 3","who":"Josephus","date":"About AD 75","text":"Josephus wrote that the water of the lake is sweet and good to drink. The land beside it is so rich that fruit grows almost all year long, and there are many kinds of fish.","note":"Josephus lived in Galilee not long after Jesus."},"vocab":[["Net","Woven rope used to catch fish"],["Disciple","A follower and learner"],["Drought","A long time with not enough rain"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala","tiberias","nazareth"],"caption":"The towns around the Sea of Galilee, where Jesus called his first disciples."},"timeline":[{"y":20,"t":"Herod Antipas builds the city of Tiberias by the lake"},{"y":1986,"t":"The ancient Galilee boat is found","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What is the Sea of Galilee really?","options":["An ocean","A river","A big freshwater lake"],"answer":2,"why":"It's a lake."},{"q":"When did fishermen often fish?","options":["At night","At lunchtime","Never"],"answer":0,"why":"Fish come near the top at night."},{"q":"How was the old boat found?","options":["The lake got low and showed it in the mud","It floated up","Divers found it"],"answer":0,"why":"A drought made the water go down."},{"q":"How long is the Jesus Boat?","options":["About 2 feet","About 27 feet","About 200 feet"],"answer":1,"why":"Big enough for a dozen people."}],"assignment":"Go outside and measure 27 feet with a tape measure or big steps. That's how long the boat was!"},{"id":"hist-05","bible":"mat-05","bibleTitle":"Blessed Are... (The Beatitudes)","title":"Synagogues, Rabbis, and Disciples","era":"1st century AD","intro":"Jesus sat down to teach, just like other Jewish teachers. Let's learn about synagogues and rabbis to see why people were amazed by Jesus.","sections":[{"h":"The Synagogue","p":["The temple was in Jerusalem, but most people lived far away. So towns built synagogues, places to gather, pray, and read God's Word. On the Sabbath, someone read from the Bible and a teacher explained it.","In 2009, archaeologists found a synagogue from Jesus' time in the town of Magdala. Jesus may have taught there!"]},{"h":"Rabbis and Disciples","p":["Rabbi means 'teacher.' A disciple followed his rabbi everywhere, listened, memorized his words, and tried to live like him.","A famous teacher named Hillel said, 'Don't do to others what you don't like.' Jesus said even more: 'Do good to others, the way you want them to treat you.'"]},{"h":"Jesus Taught with Authority","p":["Most teachers said, 'Another teacher said this.' But Jesus said, 'I tell you!' That's why people were amazed. He taught like he was in charge, because he is God's Son!"]}],"people":[{"name":"Hillel","role":"A famous Jewish teacher who lived just before Jesus"}],"source":{"title":"The Theodotus Inscription","who":"Carved for a Jerusalem synagogue","date":"Before AD 70; found in 1913","text":"A carved stone says that a man named Theodotus built a synagogue for reading God's law and teaching the commandments, plus rooms for travelers.","note":"This stone was found in Jerusalem. It tells us what synagogues were for."},"vocab":[["Synagogue","A place where Jewish people gathered to pray and learn"],["Rabbi","Teacher"],["Disciple","A follower who learns from a teacher"]],"map":{"view":"local","places":["capernaum","magdala","nazareth","jerusalem"],"caption":"A synagogue from Jesus' time was found at Magdala, by the Sea of Galilee."},"timeline":[{"y":-20,"t":"Hillel teaches"},{"y":1913,"t":"The Theodotus stone is found in Jerusalem","d":true},{"y":2009,"t":"A synagogue from Jesus' time is found at Magdala","d":true}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"What does 'rabbi' mean?","options":["King","Teacher","Fisherman"],"answer":1,"why":"Jesus' disciples called him Rabbi."},{"q":"What was found at Magdala?","options":["A pyramid","A synagogue from Jesus' time","A ship"],"answer":1,"why":"Jesus may have taught there!"},{"q":"What did a disciple do?","options":["Built houses","Followed his teacher everywhere","Went fishing"],"answer":1,"why":"And tried to live like him."},{"q":"Why were people amazed at Jesus?","options":["He was loud","He taught with authority","He was tall"],"answer":1,"why":"He said, 'I tell you!'"}],"assignment":"Play 'disciple' for a day: follow a parent and try to help the way they help. Then talk about how we follow Jesus."},{"id":"hist-06","bible":"mat-06","bibleTitle":"Love Your Enemies","title":"Living Under Roman Occupation","era":"4 BC to AD 30","intro":"When Jesus said 'love your enemies' and 'go the extra mile,' people thought of the Roman soldiers who ruled their land.","sections":[{"h":"Roman Soldiers","p":["Roman soldiers were everywhere. A centurion was an officer in charge of about 80 soldiers. Soldiers watched over the temple from a fort next door."]},{"h":"The Extra Mile","p":["Roman law said a soldier could make a Jewish man carry his heavy pack for one mile. Stones along the road marked each mile. People hated this!","So when Jesus said, 'Go two miles,' it was shocking! Jesus turned something people hated into a chance to be kind."]},{"h":"Different Ways to Respond","p":["Some people worked with the Romans. Some moved away to the desert. Some fought the Romans, and the Romans stopped them. Jesus showed a different way: love your enemies."]}],"people":[{"name":"Judas the Galilean","role":"A man who led a fight against Rome"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Judas the Galilean told people not to pay taxes to Rome, because God alone was their Lord.","note":"Judas wanted to fight. Jesus taught people to love their enemies instead."},"vocab":[["Centurion","A Roman officer over about 80 soldiers"],["Legion","A big group of Roman soldiers"],["Enemy","Someone who is against you"]],"map":{"view":"local","places":["caesarea","jerusalem","sepphoris","samaria"],"caption":"Roman soldiers lived at Caesarea by the sea and in Jerusalem."},"timeline":[{"y":-4,"t":"Rome stops fights after Herod dies"},{"y":6,"t":"Judas the Galilean fights against Rome"}],"video":[],"quiz":[{"q":"How many soldiers did a centurion lead?","options":["About 10,000","About 80","About 2"],"answer":1,"why":"Around 80 men."},{"q":"How far could a soldier make someone carry his pack?","options":["One mile","Across the street","Ten miles"],"answer":0,"why":"Jesus said go two!"},{"q":"What did Jesus teach about enemies?","options":["Fight them","Love them","Ignore them"],"answer":1,"why":"'Love your enemies.'"}],"assignment":"Walk one mile with your family (or as far as you can). Talk about what it means to go the extra mile, and think of one extra-kind thing you can do for someone this week.","hope":["Jesus taught a surprising way to treat enemies: love them and be kind to them.","And it worked! Some Roman soldiers came to believe in Jesus, like Cornelius in Acts 10."]},{"id":"hist-07","bible":"mat-07","bibleTitle":"How to Pray and Why Not to Worry","title":"Prayer, Fasting, and Money","era":"1st century AD","intro":"Jesus talked about giving, praying, and treasure. These were things every Jewish family did. Here's what they looked like long ago.","sections":[{"h":"Jewish Prayer","p":["Jewish people said a special prayer twice a day called the Shema. It starts, 'Hear, O Israel: The LORD our God, the LORD is one.'","Some men wore tiny leather boxes with Bible verses inside, tied on their foreheads and arms. Jesus didn't like it when people made theirs extra big to show off."]},{"h":"Early Christians Prayed Too","p":["About 70 years after Jesus, Christians wrote a handbook called the Didache. It told Christians to pray the Lord's Prayer three times every day!"]},{"h":"Moths and Thieves","p":["There were no banks for most people. They kept their riches as nice clothes, which moths could eat, or coins, which thieves could steal. Thieves could dig right through mud walls!","Many people buried their money. Archaeologists still find buried coins today. Jesus was right: treasure on earth doesn't last."]}],"people":[{"name":"Early Christians","role":"Wrote the Didache to teach new believers"}],"source":{"title":"The Didache (The Teaching of the Twelve Apostles), chapter 8","who":"Early Christian writers","date":"About AD 100","text":"The Didache says: Pray the Lord's Prayer, the way Jesus told us in his Gospel, three times each day.","note":"Christians have been praying the Lord's Prayer for almost 2,000 years!"},"vocab":[["Shema","A Jewish prayer said twice a day"],["Denarius","A silver coin, about a day's pay"],["Treasure","Something very valuable"]],"map":{"view":"local","places":["jerusalem","capernaum","qumran"],"caption":"Jewish people prayed at the same times the temple offerings were made in Jerusalem."},"timeline":[{"y":100,"t":"Christians write the Didache"}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"How often did Jewish people say the Shema?","options":["Once a year","Twice a day","Never"],"answer":1,"why":"Morning and evening."},{"q":"How often did the Didache say to pray the Lord's Prayer?","options":["Ten times","Three times a day","Once a week"],"answer":1,"why":"Three times every day."},{"q":"What could ruin nice clothes?","options":["Moths","Rain","Fish"],"answer":0,"why":"Moths eat cloth."},{"q":"Where did many people hide money?","options":["In trees","In the sea","Buried in the ground"],"answer":2,"why":"People still find buried coins!"}],"assignment":"Pray the Lord's Prayer three times a day for three days, like the early Christians."},{"id":"hist-08","bible":"mat-08","bibleTitle":"Ask, Seek, Knock, and Build on the Rock","title":"Houses and Builders in Galile
