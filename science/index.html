/* ---------- vocab match game ---------- */
function startGame(unitId){
  if (needStudent()) return;
  const u = unitById(unitId), pairs = shuffle(u.lessons.flatMap(l => l.vocab)).slice(0,6);
  go({page:"game", unit:unitId, pairs, left:shuffle(pairs.map((p,i)=>i)), right:shuffle(pairs.map((p,i)=>i)), sel:null, matched:[], mistakes:0, t0:Date.now(), flash:null});
}
function renderGame(){
  const v = view, u = unitById(v.unit);
  const secs = Math.round((Date.now()-v.t0)/1000);
  app.innerHTML = `
  <div class="quiz game" style="--c:var(${u.color})">
    <div class="qhead"><span class="kind">Vocab match · ${esc(titleOf(v.unit))}</span><span class="eyebrow" id="gclock">${v.matched.length}/${v.pairs.length} matched · ${secs}s</span></div>
    <p class="howto">Tap a word, then tap its meaning. Fewer mistakes means more stars.</p>
    <div class="board">
      <div class="colw">${v.left.map(i=>`<button class="tcard word ${v.matched.includes(i)?"done":""} ${v.sel===i?"sel":""} ${v.flash&&v.flash.w===i?"bad":""}" data-w="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][0])}</button>`).join("")}</div>
      <div class="colw">${v.right.map(i=>`<button class="tcard def ${v.matched.includes(i)?"done":""} ${v.flash&&v.flash.d===i?"bad":""}" data-d="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][1])}</button>`).join("")}</div>
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Quit game</button><span class="eyebrow">Mistakes: ${v.mistakes}</span></div>
  </div>`;
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { v.sel = +b.dataset.w; v.flash = null; sfx.click(); renderGame(); });
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    if (v.sel==null){ v.flash = null; renderGame(); return; }
    const d = +b.dataset.d;
    if (d===v.sel){ v.matched.push(d); v.sel = null; v.flash = null; sfx.right(); }
    else { v.mistakes++; v.flash = {w:v.sel, d}; v.sel = null; sfx.wrong(); }
    if (v.matched.length===v.pairs.length) return finishGame();
    renderGame();
  });
  $("#quit").onclick = () => go({page:"unit", unit:v.unit, lesson:0});
  clearInterval(window._gtick);
  window._gtick = setInterval(() => { const el = $("#gclock"); if (!el || view!==v){ clearInterval(window._gtick); return; } el.textContent = `${v.matched.length}/${v.pairs.length} matched · ${Math.round((Date.now()-v.t0)/1000)}s`; }, 1000);
}
function finishGame(){
  const v = view, n = v.pairs.length, p = pct(n, n+v.mistakes);
  const stars = v.mistakes===0?3:v.mistakes<=2?2:1;
  const r = { id:"g"+Date.now().toString(36), student, unit:v.unit, kind:"game", score:n, total:n, pct:p, stars, mistakes:v.mistakes, secs:Math.round((Date.now()-v.t0)/1000), at:new Date().toISOString() };
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges }; render(); window.scrollTo({top:0});
  if (stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}

/* ---------- kid progress ---------- */
function renderProgress(){
  const mine = results.filter(r => r.student===student).sort((a,b)=>b.at.localeCompare(a.at));
  const st = student ? starTotal(student) : 0;
  const bs = student ? badges(student) : [];
  app.innerHTML = `
  <section class="hero" style="padding-bottom:0">
    <span class="eyebrow">Progress</span>
    <h1>${student ? esc(student)+"'s stars and badges" : "Add your name to start"}</h1>
  </section>
  <div class="section-h"><h2>Students</h2></div>
  <div class="chips">${roster.map(n=>`<button class="chip" data-s="${esc(n)}" aria-pressed="${n===student}">${esc(n)}</button>`).join("")}</div>
  <form class="addform" id="addform">
    <input type="text" id="newname" placeholder="Student name" maxlength="30" aria-label="New student name">
    <button class="btn" type="submit">Add student</button>
  </form>
  ${student ? `
  <div class="stats">
    <div class="stat"><div class="v"><span class="st">★</span> ${st}<small>/${STAR_MAX}</small></div><div class="k">Stars earned</div></div>
    <div class="stat"><div class="v">${Object.keys(P().done).length}/${UNITS.reduce((a,u)=>a+u.lessons.length,0)}</div><div class="k">Lessons finished</div></div>
    <div class="stat"><div class="v">${bs.filter(b=>b.got).length}/${bs.length}</div><div class="k">Badges</div></div>
  </div>
  <div class="section-h"><h2>Badges</h2></div>
  <div class="badges">${bs.map(b=>`<div class="bdg ${b.got?"got":""}" style="--c:var(${b.color||"--accent"})"><span class="medal">${b.got?"★":"?"}</span><b>${esc(b.name)}</b><small>${esc(b.how)}</small></div>`).join("")}</div>
  <div class="section-h"><h2>By unit</h2></div>
  <div class="tblwrap"><table>
    <thead><tr><th>Unit</th><th>Lessons</th><th>Vocab game</th><th>Quiz</th><th>Test</th><th>Mastered</th></tr></thead>
    <tbody>${UNITS.map(u=>`<tr><td>${u.n}. ${esc(u.name)}</td><td class="n">${lessonsDone(student,u)}/${u.lessons.length}</td>
      <td>${starStr(bestStars(student,u.id,"game"))}</td><td>${starStr(bestStars(student,u.id,"quiz"))}</td><td>${starStr(bestStars(student,u.id,"test"))}</td><td>${mastered(student,u.id)?'<span class="pill g">★ Yes</span>':`<span class="note">${testDays(student,u.id).length}/2 days${reviewLeft(student,u.id)?` · ${reviewLeft(student,u.id)} to review`:""}</span>`}</td></tr>`).join("")}
      <tr><td>Final Exam 1</td><td></td><td></td><td></td><td>${starStr(bestStars(student,"final","final"))}</td></tr><tr><td>Final Exam 2</td><td></td><td></td><td></td><td>${starStr(bestStars(student,"final2","final"))}</td></tr></tbody></table></div>
  <div class="section-h"><h2>History</h2></div>
  <div class="tblwrap">${mine.length ? `<table><thead><tr><th>When</th><th>What</th><th>Score</th><th>Stars</th></tr></thead>
    <tbody>${mine.map(r=>`<tr><td class="n">${fmtDate(r.at)}</td><td>${esc(kindLabel(r.kind))} · ${esc(isFinal(r.unit)?titleOf(r.unit):"Unit "+unitById(r.unit).n)}</td><td class="n">${r.kind==="game"?r.mistakes+" mistakes":r.score+"/"+r.total}</td><td>${starStr(r.stars??starsFor(r.pct))}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Nothing yet. Finish a lesson or play a vocab game to earn your first star.</div>`}</div>` : ""}
  <div class="section-h"><h2>Sound</h2></div>
  <button class="chip" id="snd" aria-pressed="${soundOn}">${soundOn?"Sounds on":"Sounds off"}</button>
  <p class="note">Everything is saved on this iPad. Open the app from its home-screen icon every time so it always uses the same saved progress.</p>`;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { student = b.dataset.s; LS.set("g6-student", student); renderRoster(); render(); });
  $("#addform").onsubmit = e => {
    e.preventDefault();
    const n = $("#newname").value.trim().slice(0,30);
    if (!n || roster.includes(n)) return;
    roster = roster.concat([n]); student = n; LS.set("g6-student", student); saveAll();
    renderRoster(); go({page:"home"});
  };
  $("#snd").onclick = () => { soundOn = !soundOn; LS.set("g6-sound", soundOn); if (soundOn) sfx.right(); render(); };
  if (view.adding) $("#newname").focus();
}

/* ---------- parent area (PIN) ---------- */
function renderParent(){
  if (!parentOK){
    const creating = !pin;
    app.innerHTML = `<div class="pinbox">
      <span class="eyebrow">Parent area</span>
      <h1>${creating ? "Create a parent PIN" : "Enter your parent PIN"}</h1>
      <p>${creating ? "Pick 4 digits. You'll need this PIN to see answers and the answer key." : "Answers and the answer key are behind this PIN."}</p>
      <form id="pinform"><input id="pinin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN">
      <button class="btn" type="submit">${creating?"Save PIN":"Unlock"}</button></form><p class="pinerr" id="pinerr"></p></div>`;
    $("#pinin").focus();
    $("#pinform").onsubmit = e => { e.preventDefault(); const v = $("#pinin").value.trim();
      if (!/^\d{4}$/.test(v)){ $("#pinerr").textContent = "Use exactly 4 digits."; return; }
      if (creating){ pin = v; LS.set("g6-pin", pin); parentOK = true; render(); }
      else if (v===pin){ parentOK = true; render(); }
      else { $("#pinerr").textContent = "That PIN doesn't match. Try again."; $("#pinin").value = ""; } };
    return;
  }
  const tab = view.tab || "scores";
  const who = view.who && roster.includes(view.who) ? view.who : (student || roster[0] || "");
  let body = "";
  if (tab==="scores"){
    const mine = results.filter(r=>r.student===who).sort((a,b)=>b.at.localeCompare(a.at));
    body = `<div class="chips" style="margin-bottom:14px">${roster.map(n=>`<button class="chip" data-who="${esc(n)}" aria-pressed="${n===who}">${esc(n)}</button>`).join("")}</div>
    ${who ? `<p class="note" style="margin-top:0">${esc(who)}: <span class="st">★</span> ${starTotal(who)} stars · ${(n=>n+(n===1?" lesson":" lessons"))(Object.keys((prog[who]||{}).done||{}).length)} finished${inprog[who]?` · has an unfinished ${kindLabel(inprog[who].kind).toLowerCase()}`:""}</p>` : ""}
    ${who ? `<div class="tblwrap" style="margin-bottom:14px"><table><thead><tr><th>Unit</th><th>Lessons</th><th>Test 80%+ days</th><th>Fix-up left</th><th>Review left</th><th>Mastered</th></tr></thead><tbody>${UNITS.map(u=>`<tr><td>${u.n}. ${esc(u.name)}</td><td class="n">${lessonsDone(who,u)}/3</td><td class="n">${testDays(who,u.id).length}/2</td><td class="n">${fixLeft(who,u.id)}</td><td class="n">${reviewLeft(who,u.id)}</td><td>${mastered(who,u.id)?'<span class="pill g">Yes</span>':"No"}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${mine.length ? mine.map(r=>`<details class="att"><summary><span class="n">${fmtDate(r.at)}</span><span>${esc(kindLabel(r.kind))} · ${esc(titleOf(r.unit))}</span><span class="pill ${pillClass(r.pct)}">${r.pct}%${r.kind==="game"?"":" "+grade(r.pct)}</span>${starStr(r.stars??starsFor(r.pct))}</summary>
      ${r.items ? `<ol class="ans">${r.items.map(Q=>{ const ok = Q.picked===Q.answer;
        return `<li class="${ok?"ok":"no"}"><b>${esc(Q.q)}</b><span>${ok?"✓":"✗"} Picked: ${esc(Q.choices[Q.picked]??"(no answer)")}</span>${ok?"":`<span>Correct: <b>${esc(Q.choices[Q.answer])}</b></span>`}</li>`; }).join("")}</ol>`
        : r.kind==="game" ? `<p class="note">Vocab match: ${r.total} pairs, ${r.mistakes} mistakes, ${r.secs} seconds.</p>` : `<p class="note">Answers weren't recorded for this older attempt.</p>`}
    </details>`).join("") : `<div class="empty">No quizzes, tests, or games yet${who?" for "+esc(who):""}.</div>`}`;
  } else if (tab==="key"){
    const uid = view.ku || UNITS[0].id, u = unitById(uid);
    const qlist = (arr, label) => `<h3 class="keyh">${label}</h3><ol class="key">${arr.map(q=>`<li><b>${esc(q[0])}</b><ul>${q[1].map((c,i)=>`<li class="${i===q[2]?"right":""}">${i===q[2]?"✓ ":""}${esc(c)}</li>`).join("")}</ul><small>${esc(q[3])}</small></li>`).join("")}</ol>`;
    body = `<div class="chips" style="margin-bottom:10px">${UNITS.map(x=>`<button class="chip" data-ku="${x.id}" aria-pressed="${x.id===uid}">Unit ${x.n}</button>`).join("")}</div>
      <p class="note" style="margin-top:0">Answer choices appear in a shuffled order for your student. Final Exam 1 uses 4 questions from each of units 1–5; Final Exam 2 uses 2 from each of units 6–15.</p>
      ${qlist(u.quiz, `Unit ${u.n} quiz (${u.quiz.length} questions)`)}${qlist(u.test, `Unit ${u.n} test (${u.test.length} questions)`)}`;
  } else {
    body = `<h3 class="keyh">Back up all scores and progress</h3>
      <p class="note" style="margin-top:0">If Safari's data gets cleared, scores on this iPad are erased. Copy this backup code and paste it into a note or text to yourself. You can restore it here later.</p>
      <textarea id="bk" readonly rows="4"></textarea><div class="ctrl"><button class="btn small" id="bkcopy">Copy backup code</button><span class="out" id="bkmsg"></span></div>
      <h3 class="keyh">Restore from a backup code</h3>
      <textarea id="rs" rows="3" placeholder="Paste a backup code here"></textarea>
      <div class="ctrl"><button class="btn small ghost" id="rsgo">Restore</button><span class="out" id="rsmsg"></span></div>
      <h3 class="keyh">Change PIN</h3>
      <div class="ctrl"><input id="newpin" type="password" inputmode="numeric" maxlength="4" aria-label="New PIN" style="width:90px"><button class="btn small ghost" id="pinsave">Save new PIN</button><span class="out" id="pinmsg"></span></div>
      <h3 class="keyh">Reset a student</h3>
      <div class="ctrl">${roster.map(n=>`<button class="btn small ghost" data-reset="${esc(n)}">Reset ${esc(n)}</button>`).join("") || "No students yet."}</div><p class="out" id="resetmsg"></p>`;
  }
  app.innerHTML = `
  <section class="hero" style="padding-bottom:6px"><span class="eyebrow">Parent area</span><h1>Scores, answers, and answer key</h1></section>
  <div class="nav ptabs" role="tablist">
    <button data-tab="scores" aria-current="${tab==="scores"}">Her answers</button>
    <button data-tab="key" aria-current="${tab==="key"}">Answer key</button>
    <button data-tab="manage" aria-current="${tab==="manage"}">Backup & settings</button>
  </div>
  <div class="pbody">${body}</div>
  <div class="ctrl" style="margin-top:22px"><button class="btn ghost small" id="lock">Lock parent area</button></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go({page:"parent", tab:b.dataset.tab, who}));
  app.querySelectorAll("[data-who]").forEach(b => b.onclick = () => go({page:"parent", tab:"scores", who:b.dataset.who}));
  app.querySelectorAll("[data-ku]").forEach(b => b.onclick = () => go({page:"parent", tab:"key", ku:b.dataset.ku}));
  $("#lock").onclick = () => { parentOK = false; go({page:"home"}); };
  if (tab==="manage"){
    const data = {v:2, roster, results, prog, inprog, review, fix, lstep};
    let code = ""; try{ code = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }catch(e){}
    $("#bk").value = code;
    $("#bkcopy").onclick = () => { const ta = $("#bk");
      navigator.clipboard?.writeText(code).then(()=>{ $("#bkmsg").textContent = "Copied."; }, ()=>{ ta.select(); $("#bkmsg").textContent = "Selected. Press copy."; })
        ?? (ta.select(), $("#bkmsg").textContent = "Selected. Press copy."); };
    let armed = false;
    $("#rsgo").onclick = () => {
      let d; try{ d = JSON.parse(decodeURIComponent(escape(atob($("#rs").value.trim())))); }catch(e){ $("#rsmsg").textContent = "That code isn't a valid backup."; return; }
      if (!d || !Array.isArray(d.results)){ $("#rsmsg").textContent = "That code isn't a valid backup."; return; }
      if (!armed){ armed = true; $("#rsgo").textContent = "Yes, replace everything"; $("#rsmsg").textContent = "This replaces all scores on this device."; return; }
      roster = d.roster||[]; results = d.results; prog = d.prog||{}; inprog = d.inprog||{}; review = d.review||{}; fix = d.fix||{}; lstep = d.lstep||{}; saveAll(); renderRoster();
      $("#rsmsg").textContent = "Restored."; armed = false; $("#rsgo").textContent = "Restore";
    };
    $("#pinsave").onclick = () => { const v = $("#newpin").value.trim(); if (!/^\d{4}$/.test(v)){ $("#pinmsg").textContent = "Use exactly 4 digits."; return; } pin = v; LS.set("g6-pin", pin); $("#pinmsg").textContent = "PIN changed."; $("#newpin").value=""; };
    app.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
      const n = b.dataset.reset;
      if (b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = `Yes, erase ${n}'s scores`; $("#resetmsg").textContent = `This erases all of ${n}'s scores, stars, and lesson checkmarks.`; return; }
      results = results.filter(r=>r.student!==n); delete prog[n]; delete inprog[n]; delete review[n]; delete fix[n]; delete lstep[n]; saveAll(); renderStarChip();
      $("#resetmsg").textContent = `${n}'s progress was reset.`; b.textContent = `Reset ${n}`; b.dataset.armed = "";
    });
  }
}

renderRoster();
render();
(async () => {
  const saved = await IDB.get();
  if (!saved) { IDB.put(snapshot()); return; }
  const localRes = LS.get("g6-results", []), savedRes = saved["g6-results"] ? JSON.parse(saved["g6-results"]) : [];
  const cnt = p => Object.values(p||{}).reduce((a,x)=>a+Object.keys((x&&x.done)||{}).length,0);
  const localDone = cnt(LS.get("g6-prog", {})), savedDone = saved["g6-prog"] ? cnt(JSON.parse(saved["g6-prog"])) : 0;
  if (savedRes.length > localRes.length || savedDone > localDone || (!roster.length && saved["g6-roster"])){
    try{ Object.entries(saved).forEach(([k,v]) => localStorage.setItem(k,v)); }catch(e){}
    const g = (k,d) => saved[k] ? JSON.parse(saved[k]) : d;
    roster = g("g6-roster",[]); results = g("g6-results",[]); prog = g("g6-prog",{}); inprog = g("g6-inprog",{}); review = g("g6-review",{}); fix = g("g6-fix",{}); lstep = g("g6-lstep",{});
    student = g("g6-student",""); pin = g("g6-pin",""); soundOn = g("g6-sound",true);
    renderRoster(); if (view.page !== "quiz" && view.page !== "game") render();
  } else IDB.put(snapshot());
})();
</script>
