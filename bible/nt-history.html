<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NT History">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>New Testament World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EDEA; --ink:#1B2B2F; --muted:#56696B;
  --line:#D3DEDA; --accent:#6A3D8F; --accent-ink:#FFFFFF; --accent-soft:#EDE3F4;
  --gold:#C98A1A; --gold-soft:#FBEBC8; --good:#2E7D4F; --good-soft:#D9F0E2; --bad:#B4432F; --bad-soft:#F7DDD6;
  --sea:#D5E6EC; --land:#EFEBE0; --land-line:#B9B09A; --river:#5E93B0; --pin:#6A3D8F; --maptext:#3B4A4C; --region:#8A8472;
  --paper:#F7F3E8; --paper-line:#E2D8BF;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif:"Lora", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
    --line:#2A4043; --accent:#C39BE3; --accent-ink:#1A1020; --accent-soft:#2F2340;
    --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
    --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#C39BE3; --maptext:#DCE6E4; --region:#8C9690;
    --paper:#22241F; --paper-line:#3A3C33;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101A1C; --surface:#172427; --surface-2:#1F2F32; --ink:#E4EEEC; --muted:#98ACAC;
  --line:#2A4043; --accent:#C39BE3; --accent-ink:#1A1020; --accent-soft:#2F2340;
  --gold:#F0B94A; --gold-soft:#3A2E16; --good:#6FD19A; --good-soft:#173527; --bad:#F08A76; --bad-soft:#3D1F1A;
  --sea:#14282E; --land:#262D2A; --land-line:#46504A; --river:#4F8FAE; --pin:#C39BE3; --maptext:#DCE6E4; --region:#8C9690;
  --paper:#22241F; --paper-line:#3A3C33;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding:0 16px 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.top .spacer{flex:1}
.stars{display:flex;align-items:center;gap:6px;font-weight:700;background:var(--gold-soft);color:var(--ink);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.stars svg{width:18px;height:18px;color:var(--gold)}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.iconbtn[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.hello{display:grid;gap:6px;margin-bottom:20px}
.hello h1{font-size:clamp(28px,6vw,40px)}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.next{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:grid;gap:10px;margin-bottom:28px}
.next .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.next h2{font-size:26px}
.next .ref{opacity:.9}
.next button{justify-self:start;background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.group{margin-bottom:26px}
.group h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group h3 .cnt{letter-spacing:0;text-transform:none;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar > i{display:block;height:100%;background:var(--good);border-radius:99px}
details.group > summary{cursor:pointer;list-style:none;margin-bottom:10px}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary h3::before{content:"▸";margin-right:8px;color:var(--accent)}
details.group[open] > summary h3::before{content:"▾"}
.soon{display:flex;flex-wrap:wrap;gap:8px}
.soon span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:grid}
.path li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.stone.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.stone.here{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.path li:not(:last-child) .col::after{content:"";display:block;width:2px;height:22px;background:var(--line);margin:4px auto}
.col{display:grid;justify-items:center}
.lessonbtn{background:none;border:0;text-align:left;color:var(--ink);padding:6px 0 18px;display:grid;gap:2px}
.lessonbtn .t{font-weight:700;font-size:18px;line-height:1.3}
.lessonbtn .r{font-size:14px;color:var(--muted)}
.lessonbtn .sc{font-size:13px;color:var(--good);font-weight:700}

.back{background:none;border:0;color:var(--accent);font-weight:700;padding:0;margin-bottom:12px}
.lhead{display:grid;gap:6px;margin-bottom:16px}
.lhead .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.lhead h1{font-size:clamp(28px,6vw,40px)}
.lhead .era{color:var(--muted);font-weight:700}
.pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pair .lbl{font-size:13px;color:var(--muted);display:block}
.pair .pt{font-weight:700}
.pair > div{flex:1;min-width:180px}
.intro{font-size:19px;line-height:1.55;margin:0 0 18px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:10px}
.card h3{font-size:20px;margin:18px 0 6px}
.card h3:first-of-type{margin-top:4px}
.card p{margin:0 0 12px;max-width:65ch}
.card p:last-child{margin-bottom:0}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:block}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--good)}

.mapbox{margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox.local{max-width:440px}
.mapcap{font-size:15px;color:var(--muted);margin-top:10px;max-width:62ch}
.m-land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2}
.m-water{fill:var(--sea);stroke:var(--river);stroke-width:1.5}
.m-river{fill:none;stroke:var(--river);stroke-width:2.5;stroke-linecap:round}
.m-region{fill:var(--region);font-family:var(--body);font-weight:700;letter-spacing:.12em}
.m-pin{fill:var(--pin);stroke:var(--land);stroke-width:2.5}
.m-lbl{fill:var(--maptext);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.person b{display:block;font-family:var(--display);font-size:17px;line-height:1.2;margin-bottom:2px}
.person span{font-size:14px;color:var(--muted);line-height:1.4;display:block}

.source{background:var(--paper);border:1px solid var(--paper-line);border-radius:14px;padding:18px 20px}
.source h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:2px}
.source .meta{font-size:14px;color:var(--muted);margin-bottom:12px}
.source blockquote{margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.6;max-width:62ch}
.source .note{font-size:15px;margin:0;max-width:62ch}

.vocab{display:grid;gap:10px;margin:0}
.vocab div{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px}
.vocab dt{font-weight:700}
.vocab dd{margin:0;color:var(--ink)}
@media (max-width:520px){ .vocab div{grid-template-columns:1fr;gap:0} }

.mini{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mini li{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline}
.yr{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.disc{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-left:6px}

.q{margin-bottom:18px}
.q:last-child{margin-bottom:0}
.q .qt{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:15px;margin-top:6px;color:var(--muted)}
textarea{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.assign{background:var(--accent-soft);border-color:transparent}
.finish{text-align:center;display:grid;gap:12px;justify-items:center}
.finish .btn{font-size:18px;padding:12px 22px}
.finish .note{color:var(--muted);font-size:15px}
.celebrate{display:grid;justify-items:center;gap:6px;text-align:center}
.celebrate .starbig{width:64px;height:64px;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .celebrate .starbig{animation:pop .6s ease-out} }
@keyframes pop{0%{transform:scale(.3) rotate(-30deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:84px 24px 1fr;gap:6px;align-items:start;padding:6px 0}
.tl .yr{text-align:right;padding-top:1px}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);margin:5px auto 0;position:relative;z-index:1}
.tl li.locked .dot{background:var(--line)}
.tl li.locked .ev{color:var(--muted);font-style:italic}
.tl .ev b{display:block}
.tl .ev .from{font-size:13px;color:var(--muted)}
.tl li.jesus .dot{background:var(--gold)}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tlhead h2{font-size:24px}
.tlhead span{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.foot{margin-top:36px;font-size:12px;color:var(--muted);line-height:1.5}
.settings{display:grid;gap:12px}
.settings label{font-weight:700;display:grid;gap:4px}
.settings input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.status{font-size:13px;color:var(--muted)}
@media (max-width:480px){ .top{position:static} .card{padding:16px} .brand{font-size:18px} .brand svg{display:none} .tl::before{left:78px} .tl li{grid-template-columns:66px 24px 1fr} .mini li{grid-template-columns:78px 1fr} }
</style>
</head>

  <main id="app"></main>
  <p class="foot">History lessons written to pair with the Through the Word New Testament lessons. Primary sources are paraphrased or closely translated for young readers unless noted. Videos: Drive Thru History: The Gospels (Dave Stotts), streamed free on TBN. Map outlines from Natural Earth.</p>
</div>

<script>
const EMBED = {"lessons/mark.json":[{"id":"mkh-01","bible":"mrk-01","bibleTitle":"The Beginning of the Good News","title":"Who Was Mark?","era":"About AD 45-70","intro":"The Gospel of Mark doesn't include its author's name. So how do we know who wrote it? Early church writers who lived close to the time tell us, and the New Testament gives us clues about a young man named John Mark.","sections":[{"h":"John Mark in the New Testament","p":["Acts 12:12 mentions 'Mary the mother of John, also called Mark,' whose house in Jerusalem was a meeting place where believers prayed. When Peter escaped from prison, that's the house he went to first. So Mark grew up around the first Christians.","Mark later traveled with Paul and his cousin Barnabas on their first missionary journey, but he left partway through, and Paul refused to take him the next time (Acts 15:37-39). Years later, though, Paul wrote, 'Get Mark and bring him with you, because he is helpful to me in my ministry' (2 Timothy 4:11). Mark's story includes failure and a second chance."]},{"h":"Peter's Interpreter","p":["Around AD 125, a church leader named Papias wrote that Mark had been Peter's interpreter. Papias said Mark wrote down accurately what Peter remembered about Jesus' words and deeds, though not always in exact order. Peter himself calls Mark 'my son' in 1 Peter 5:13.","That helps explain why Mark's Gospel is full of vivid little details: a cushion in the boat, green grass, Jesus looking at people with love or anger. Many scholars think these come from Peter's eyewitness memories."]},{"h":"The First Gospel","p":["Most scholars think Mark was the first Gospel written, probably in the 50s or 60s AD. Matthew and Luke seem to have used Mark as one of their sources, since they include most of his stories, often in similar words.","Mark's Gospel is short and action-packed. It explains Jewish customs and translates Aramaic words, which suggests it was written for non-Jewish readers, possibly Christians in Rome."]}],"people":[{"name":"John Mark","role":"Author of the Gospel of Mark; companion of Peter and Paul"},{"name":"Papias","role":"Church leader in Hierapolis (about AD 60-130) who recorded early traditions about the Gospels"},{"name":"Eusebius","role":"Church historian (about AD 260-339) who preserved Papias' words"}],"source":{"title":"Papias, quoted in Eusebius' Church History, Book 3","who":"Papias","date":"About AD 125 (quoted about AD 325)","text":"Papias reports that 'the Elder' used to say: Mark became Peter's interpreter and wrote down accurately everything he remembered of the things said or done by the Lord, though not in order. Mark had not heard the Lord himself but later followed Peter, who taught as the need arose. Mark made no mistake in writing some things as he remembered them, for he was careful not to leave anything out or to add anything false.","note":"Paraphrased. Papias' own books are lost; we know these words because Eusebius copied them. This is the earliest statement we have about who wrote a Gospel."},"vocab":[["Gospel","'Good news': an account of Jesus' life, death, and resurrection"],["Interpreter","Someone who translates or explains another person's words"],["Eyewitness","Someone who saw events with their own eyes"],["Source","A document or person a writer gets information from"]],"map":{"view":"wide","places":["jerusalem_w","antioch","rome"],"caption":"Mark grew up in Jerusalem, traveled with Paul and Barnabas from Antioch, and early tradition connects his Gospel with Peter in Rome."},"timeline":[{"y":46,"t":"Mark joins Paul and Barnabas on their first journey (about AD 46-47)"},{"y":125,"t":"Papias records that Mark wrote down Peter's memories (about AD 125)"}],"video":[["Drive Thru History: The Historical Landscape","https://watch.tbn.org/s/Q9aSuuiu?e=2LGRQ7EL"]],"quiz":[{"q":"Whose house was a meeting place for early Christians?","options":["Peter's mother's","Mark's mother Mary's","Paul's","Joseph's"],"answer":1,"why":"Acts 12:12."},{"q":"Why did Paul refuse to take Mark on his second journey?","options":["Mark was sick","Mark had left the first journey partway through","Mark was too young","Mark was in prison"],"answer":1,"why":"Acts 15:37-39."},{"q":"According to Papias, whose interpreter was Mark?","options":["Paul's","Peter's","John's","James'"],"answer":1,"why":"He wrote down Peter's memories."},{"q":"Why do we know Papias' words today?","options":["His books survived","Eusebius quoted them","They were carved in stone","They're in the Bible"],"answer":1,"why":"Papias' own books are lost."},{"q":"Which Gospel do most scholars think was written first?","options":["Matthew","Mark","Luke","John"],"answer":1,"why":"Matthew and Luke seem to use it."}],"assignment":"Write a short biography of John Mark using Acts 12:12, 12:25, 13:13, 15:37-39, Colossians 4:10, 2 Timothy 4:11, and 1 Peter 5:13. Include his failure and his second chance."},{"id":"mkh-02","bible":"mrk-02","bibleTitle":"Friends Who Dug Through a Roof","title":"Digging Up Capernaum and Peter's House","era":"1st century to today","intro":"Capernaum was Jesus' home base in Galilee. Archaeologists have uncovered its streets, houses, and a building that many believe was Peter's house, the place where Jesus healed Peter's mother-in-law.","sections":[{"h":"A Fishing Town on the Lake","p":["Capernaum was a small town on the northwest shore of the Sea of Galilee, with perhaps 1,000 to 1,500 people. Houses were built of dark basalt stone in groups around shared courtyards, where extended families lived and worked together.","The town was abandoned centuries later and slowly covered over. In the late 1800s, Franciscan friars bought the site to protect it, and major excavations began in 1968 under two Franciscan archaeologists, Virgilio Corbo and Stanislao Loffreda."]},{"h":"The House Under the Church","p":["Beneath the ruins of an eight-sided (octagonal) church from the 400s AD, archaeologists found an ordinary first-century house. Over time, one room of that house had been changed in unusual ways. Its walls were plastered, which was rare for homes, and its floor was replastered many times. Oil lamps and storage jars suggest people gathered there rather than lived there.","Visitors had scratched graffiti into the plaster, including prayers and names, and some scholars read 'Jesus,' 'Lord,' and possibly 'Peter' among them. Early Christian pilgrims wrote that Peter's house in Capernaum had become a church. Together, these clues convinced many archaeologists that this was the house of Peter where Jesus stayed."]},{"h":"The Church Built Above It","p":["In 1990, a modern church was built directly over the site. It stands on pillars so visitors can look down through a glass floor at the ancient house below.","Nearby stands a beautiful white limestone synagogue built centuries after Jesus. Underneath it, archaeologists found the dark basalt foundations of an earlier synagogue, possibly the very one where Jesus taught and drove out an evil spirit (Mark 1:21-28)."]}],"people":[{"name":"Virgilio Corbo and Stanislao Loffreda","role":"Franciscan archaeologists who excavated Capernaum beginning in 1968"},{"name":"Egeria","role":"Christian pilgrim who visited the Holy Land around AD 381-384 and described what she saw"}],"source":{"title":"Travel account quoted by Peter the Deacon","who":"Egeria, a Christian pilgrim","date":"About AD 383","text":"Egeria reports that in Capernaum the house of the prince of the apostles, Peter, had been made into a church, and that its walls still stood as they had been. She also mentions the synagogue where the Lord healed a man troubled by an evil spirit.","note":"Paraphrased. Egeria's full diary is partly lost; this part survives in a later writer's quotation. It shows that Christians honored this spot as Peter's house long before modern archaeology."},"vocab":[["Excavation","Carefully digging to uncover remains of the past"],["Graffiti","Words or pictures scratched or written on walls"],["Octagonal","Having eight sides"],["Pilgrim","Someone who travels to a holy place"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala"],"caption":"Capernaum sat on the northwest shore of the Sea of Galilee, Jesus' home base during his ministry."},"timeline":[{"y":383,"t":"Pilgrim Egeria describes Peter's house as a church (about AD 383)"},{"y":1968,"t":"Major excavations begin at Capernaum","d":true},{"y":1990,"t":"A modern church is built over 'Peter's house'","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What stone were Capernaum's houses built from?","options":["White marble","Dark basalt","Red brick","Granite"],"answer":1,"why":"Local volcanic stone."},{"q":"Who led the main excavations starting in 1968?","options":["Woolley and Layard","Franciscan archaeologists Corbo and Loffreda","Josephus","Egeria"],"answer":1,"why":"The Franciscans owned the site."},{"q":"What clue suggested one room was a gathering place?","options":["A crown","Plastered walls and many oil lamps","A throne","A boat"],"answer":1,"why":"Rare for an ordinary home."},{"q":"What did Egeria say about Peter's house?","options":["It was destroyed","It had been made into a church","It was a palace","She couldn't find it"],"answer":1,"why":"About AD 383."},{"q":"How can visitors see the ancient house today?","options":["They can't","Through a glass floor in the modern church","In a museum in Rome","Only in pictures"],"answer":1,"why":"The church stands on pillars above it."}],"assignment":"Imagine you're an archaeologist at Capernaum in 1968. Write a field journal entry describing what you find in the house under the church and why you think it might be Peter's house. Include at least three clues."},{"id":"mkh-03","bible":"mrk-03","bibleTitle":"Lord of the Sabbath, and Jesus' True Family","title":"James, the Brother of Jesus","era":"About AD 30-62","intro":"In Mark 3, Jesus' family thought he was 'out of his mind.' Yet one of his brothers, James, became a leader of the church in Jerusalem. The Jewish historian Josephus even records his death.","sections":[{"h":"Family Honor","p":["In Jesus' culture, a family's honor, meaning its reputation in the community, was extremely important. When one member did something unusual, the whole family felt the shame. A carpenter's son drawing huge crowds, clashing with religious leaders, and being accused of working with Satan would have embarrassed his family deeply.","That's why Jesus' mother and brothers came to 'take charge of him' (Mark 3:21). John 7:5 says plainly that 'even his own brothers did not believe in him' at that time."]},{"h":"From Doubter to Leader","p":["Something changed after the resurrection. Paul writes that the risen Jesus 'appeared to James' (1 Corinthians 15:7). Acts shows Jesus' mother and brothers praying with the disciples (Acts 1:14), and James soon became a leading figure in the Jerusalem church. At the important meeting in Acts 15, James gave the final judgment that Gentile believers didn't need to follow all of Moses' law.","The letter of James in the New Testament is traditionally credited to him. Early Christians nicknamed him 'James the Just' because of his devotion and prayer."]},{"h":"James in Josephus","p":["In AD 62, the Roman governor of Judea, Festus, died. Before the new governor arrived, the high priest Ananus took advantage of the gap and had James put to death. Josephus describes it in his Jewish Antiquities, calling him 'the brother of Jesus, who was called Christ.'","Most historians, including many who aren't Christians, accept this passage as genuine. It's valuable evidence from a non-Christian writer that Jesus was a real person, that he had a brother named James, and that some people called him the Christ."]}],"people":[{"name":"James the Just","role":"Brother of Jesus and leader of the Jerusalem church, executed in AD 62"},{"name":"Ananus","role":"High priest who had James put to death; son of Annas"},{"name":"Festus","role":"Roman governor of Judea (Acts 25-26) whose death left a gap in power"}],"source":{"title":"Jewish Antiquities, Book 20","who":"Josephus","date":"About AD 93","text":"Josephus writes that Ananus, a bold and harsh high priest, called together the Sanhedrin and brought before it the brother of Jesus, who was called Christ, whose name was James, along with some others. He accused them of breaking the law and had them stoned. Fair-minded people in the city were offended, and Ananus was removed from office.","note":"Paraphrased. This brief mention is one of the most important references to Jesus outside the Bible, written by a Jewish historian who was not a Christian."},"vocab":[["Honor","A family's or person's good reputation in the community"],["Shame","Loss of reputation or public embarrassment"],["Sanhedrin","The Jewish high council in Jerusalem"],["Resurrection appearance","A time when the risen Jesus was seen by people"]],"map":{"view":"local","places":["nazareth","capernaum","jerusalem"],"caption":"Jesus' family came from Nazareth to Capernaum to bring him home. James later led the church in Jerusalem."},"timeline":[{"y":49,"t":"The Jerusalem Council; James speaks (Acts 15, about AD 49)"},{"y":62,"t":"James, the brother of Jesus, is executed in Jerusalem"}],"video":[],"quiz":[{"q":"What did Jesus' family think in Mark 3:21?","options":["He was the Messiah","He was out of his mind","He should be king","He was a priest"],"answer":1,"why":"They came to take charge of him."},{"q":"Who did the risen Jesus appear to, according to 1 Corinthians 15:7?","options":["Pilate","James","Herod","Caiaphas"],"answer":1,"why":"Which helps explain James' change."},{"q":"What nickname did early Christians give James?","options":["The Rock","James the Just","Son of Thunder","The Zealot"],"answer":1,"why":"Because of his devotion."},{"q":"How does Josephus describe James?","options":["A Roman soldier","The brother of Jesus, who was called Christ","A tax collector","A Pharisee"],"answer":1,"why":"Antiquities 20."},{"q":"Why is Josephus' mention important?","options":["He was a Christian","A non-Christian historian confirms Jesus and his brother James","It's in the Bible","It's very long"],"answer":1,"why":"Outside evidence."}],"assignment":"Trace James' journey from doubter to leader using Mark 3:21, John 7:5, 1 Corinthians 15:7, Acts 1:14, and Acts 15:13-21. Write a paragraph explaining what you think changed his mind."},{"id":"mkh-04","bible":"mrk-04","bibleTitle":"Seeds, a Lamp, and a Storm","title":"Mark's Roman Readers","era":"About AD 60-70","intro":"Mark's Gospel has clues about who first read it. It uses Latin words, explains Jewish customs, and translates Aramaic. Early Christian writers connect it with Peter and Rome.","sections":[{"h":"Latin Words in a Greek Book","p":["Mark wrote in Greek, but he borrows more Latin words than any other Gospel. The 'bowl' in Mark 4:21 is a modios, a Roman grain measure. Mark also uses Latin terms like legion, denarius, centurion, and praetorium.","In Mark 12:42, he explains the widow's two tiny Greek coins by comparing them to a quadrans, a small Roman coin. Someone writing only for Jews in Judea wouldn't need to do that, but it would help readers in Rome."]},{"h":"Explaining Jewish Ways","p":["Mark stops the story to explain things Jewish readers already knew. In Mark 7:3-4 he explains that Pharisees and all the Jews wash their hands in a special way and don't eat from the market without washing. He translates Aramaic words like 'Talitha koum' and 'Ephphatha.'","All these explanations suggest Mark wrote for Gentile believers, people who were learning about Jesus from far outside Judea."]},{"h":"Peter, Mark, and Rome","p":["Around AD 180, Irenaeus, a church leader in Gaul (France), wrote that after Peter and Paul had died, Mark handed down in writing what Peter had preached. Other early writers also connect Mark's Gospel with Rome.","In AD 64, a great fire burned much of Rome, and Emperor Nero blamed the Christians. Many were cruelly killed, and tradition says Peter died in Rome during this time. If Mark wrote for Christians in Rome around then, his Gospel's focus on suffering, courage, and taking up the cross would have spoken directly to readers facing persecution."]}],"people":[{"name":"Irenaeus","role":"Bishop of Lyon (about AD 130-202) who wrote about the origins of the Gospels"},{"name":"Nero","role":"Roman emperor AD 54-68 who persecuted Christians after the fire of AD 64"},{"name":"Peter","role":"Apostle whose preaching, tradition says, Mark recorded"}],"source":{"title":"Against Heresies, Book 3","who":"Irenaeus of Lyon","date":"About AD 180","text":"Irenaeus writes that Matthew produced a Gospel among the Hebrews, while Peter and Paul were preaching in Rome. After their departure, Mark, the disciple and interpreter of Peter, also handed down to us in writing what Peter had preached.","note":"Paraphrased. Irenaeus lived about a century after Mark and had been taught by Polycarp, who knew the apostle John. His testimony agrees with Papias'."},"vocab":[["Latinism","A Latin word or expression used in another language"],["Modios","A Roman measure for grain, about two gallons"],["Quadrans","A small Roman copper coin"],["Persecution","Hostility or punishment aimed at people because of their beliefs"]],"map":{"view":"wide","places":["rome","jerusalem_w","athens"],"caption":"Mark's Latin words and explanations point to readers far from Judea, most likely in Rome."},"timeline":[{"y":64,"t":"Great Fire of Rome; Nero persecutes Christians"},{"y":180,"t":"Irenaeus writes that Mark recorded Peter's preaching (about AD 180)"}],"video":[],"quiz":[{"q":"What language did Mark write in?","options":["Latin","Greek","Hebrew","Aramaic"],"answer":1,"why":"But he borrowed Latin words."},{"q":"What is a modios?","options":["A coin","A Roman grain measure","A boat","A soldier"],"answer":1,"why":"The 'bowl' in Mark 4:21."},{"q":"Why does Mark explain Jewish handwashing?","options":["He was confused","His readers were mostly Gentiles","It was new","Peter asked him"],"answer":1,"why":"Mark 7:3-4."},{"q":"According to Irenaeus, what did Mark write down?","options":["Paul's letters","What Peter had preached","Roman laws","Josephus' history"],"answer":1,"why":"About AD 180."},{"q":"What happened in Rome in AD 64?","options":["Nero became emperor","A great fire and persecution of Christians","The Colosseum opened","Peter arrived"],"answer":1,"why":"Nero blamed Christians."}],"assignment":"Skim Mark and find at least five places where Mark explains something or translates a word for his readers (try 3:17, 5:41, 7:3-4, 7:11, 7:34, 12:42, 15:22, 15:34). List them and explain what each tells you about his audience."},{"id":"mkh-05","bible":"mrk-05","bibleTitle":"A Man Named Legion, a Girl, and a Brave Woman","title":"Roman Legions and the Region of the Gerasenes","era":"1st century AD","intro":"The man possessed by many spirits called himself 'Legion.' Everyone in the Roman world knew that word: it meant thousands of soldiers. Archaeology has also uncovered a possible site for this story on the lake's eastern shore.","sections":[{"h":"What Was a Legion?","p":["A Roman legion was the backbone of the army: roughly 5,000 to 6,000 heavily armed citizen soldiers, plus support troops. Legions had numbers and names, like the Tenth Legion 'Fretensis,' which later fought in the siege of Jerusalem.","Legions were famous for discipline, training, and engineering. They built roads, bridges, and forts wherever they went. For people in occupied lands, the word 'legion' meant overwhelming, unstoppable force."]},{"h":"A Hint in the Name","p":["When the spirits said 'My name is Legion, for we are many,' Mark's readers would have pictured an army occupying a man, just as Rome's army occupied the land. Some scholars also point out that the Tenth Legion used a wild boar as one of its symbols, which may make the pigs rushing into the sea even more striking.","Whether or not Mark intended that echo, the story shows Jesus' authority over a force no chains could hold."]},{"h":"Gerasa, Gadara, and Kursi","p":["Ancient manuscripts name the place differently: the region of the Gerasenes, Gadarenes, or Gergesenes. Gerasa (modern Jerash in Jordan) was a large Decapolis city whose impressive Roman ruins still stand, but it's more than 30 miles from the lake. Gadara was closer.","In 1970, road workers on the eastern shore uncovered ruins at a place called Kursi, including a large Byzantine monastery and church. Nearby is a steep slope near the water and ancient tombs. Many think early Christians built the church there because they remembered this as the place where Jesus freed the man called Legion."]}],"people":[{"name":"Legio X Fretensis","role":"The Tenth Roman Legion, later based in Judea after AD 70"},{"name":"Josephus","role":"Jewish historian who described the Roman army in detail"}],"source":{"title":"The Jewish War, Book 3","who":"Josephus","date":"About AD 75","text":"Josephus describes the Roman army's constant training. He says every soldier practices daily with complete effort, as if in real war, so that their drills could be called bloodless battles, and their battles bloody drills.","note":"Paraphrased. Josephus had fought against the Romans and then watched them up close. His description explains why a 'legion' seemed unstoppable."},"vocab":[["Legion","A Roman army unit of about 5,000-6,000 soldiers"],["Decapolis","Ten Greek-style cities east of the Jordan"],["Byzantine","The eastern Roman Empire period after about AD 330"],["Manuscript","A handwritten copy of a text"]],"map":{"view":"local","places":["kursi","gadara","gerasa","capernaum"],"caption":"The eastern shore: Kursi on the lake, Gadara nearby, and Gerasa farther inland."},"timeline":[{"y":1970,"t":"Road workers uncover the ruins at Kursi","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"About how many soldiers were in a legion?","options":["100","500","5,000-6,000","50,000"],"answer":2,"why":"Plus support troops."},{"q":"What animal did the Tenth Legion use as a symbol?","options":["Eagle only","Wild boar","Lion","Horse"],"answer":1,"why":"Among its symbols."},{"q":"What is Gerasa called today?","options":["Jerash","Jericho","Gaza","Jaffa"],"answer":0,"why":"In Jordan."},{"q":"What was found at Kursi in 1970?","options":["A fishing boat","A Byzantine monastery and church","A Roman fort","A synagogue"],"answer":1,"why":"Found by road workers."},{"q":"What did Josephus call Roman drills?","options":["Games","Bloodless battles","Parades","Worship"],"answer":1,"why":"And their battles bloody drills."}],"assignment":"Research one Roman legion (for example, Legio X Fretensis). Make a fact card: its number, symbol, where it served, and one famous event. Then write two sentences on why 'Legion' was a frightening name."},{"id":"mkh-06","bible":"mrk-06","bibleTitle":"Sheep Without a Shepherd","title":"Banquets in the Ancient World","era":"1st century AD","intro":"Mark 6 sets two meals side by side: Herod's lavish birthday banquet, which ends in murder, and Jesus' simple meal of bread and fish for thousands on the green grass. Knowing how ancient banquets worked shows how different these meals were.","sections":[{"h":"The Roman Banquet","p":["Wealthy Romans loved dinner parties, called convivia. Guests reclined on couches arranged around low tables, often three couches in a U-shape, a room called a triclinium. Servants brought course after course, and entertainment might include music, dancing, poetry, or acrobats.","Seating showed status. The best spots went to the most important guests, and hosts sometimes served better food and wine to important guests and cheaper food to others at the very same meal."]},{"h":"Herod's Birthday","p":["Herod Antipas held his birthday banquet for 'his high officials and military commanders and the leading men of Galilee' (Mark 6:21). It was a show of power. When his stepdaughter's dance pleased the guests, Herod made a reckless promise in front of everyone, and to save face, he ordered John the Baptist's death.","In a culture of honor and shame, breaking a public oath in front of important guests would have been humiliating. Herod chose his reputation over an innocent man's life."]},{"h":"Jesus' Banquet on the Grass","p":["Right after Herod's feast, Mark describes a very different meal. Jesus had the crowd sit down in groups on the green grass, in groups of hundreds and fifties. The Greek words Mark uses suggest 'garden beds' or orderly rows, like guests at a banquet.","But at this banquet, the host was a shepherd who had compassion, everyone got the same food, and everyone ate until they were full. Psalm 23 says the Lord 'makes me lie down in green pastures' and 'prepares a table before me.' Mark's readers may have heard that echo."]}],"people":[{"name":"Pliny the Younger","role":"Roman writer and official (about AD 61-113) whose letters describe daily life"},{"name":"Herod Antipas","role":"Ruler of Galilee who threw the birthday banquet"}],"source":{"title":"Letters, Book 2, Letter 6","who":"Pliny the Younger","date":"About AD 100","text":"Pliny describes a dinner where the host served himself and a few favored guests fine food and wine, while serving cheap food and wine to the others. Pliny says he serves all his guests the same, because he invites them to dinner, not to be ranked, and those he treats as equal at the table he treats as equal in everything.","note":"Paraphrased. Pliny wasn't a Christian, but he disliked this kind of snobbery. Compare it with Jesus feeding everyone the same meal."},"vocab":[["Convivium","A Roman dinner party"],["Triclinium","A Roman dining room with couches on three sides"],["Status","A person's rank or importance in society"],["Oath","A solemn promise, often made before witnesses"]],"map":{"view":"local","places":["tiberias","machaerus","bethsaida"],"caption":"Herod's court was at Tiberias; John was held at Machaerus. The feeding of the 5,000 happened near Bethsaida."},"timeline":[{"y":100,"t":"Pliny the Younger writes about unequal dinner parties (about AD 100)"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"How did Romans eat at banquets?","options":["Sitting on chairs","Reclining on couches","Standing","On the floor with no couches"],"answer":1,"why":"Around low tables."},{"q":"What is a triclinium?","options":["A kind of bread","A dining room with couches on three sides","A coin","A dance"],"answer":1,"why":"Tri = three."},{"q":"Why did Herod go through with his terrible promise?","options":["He wanted to","To save face in front of his guests","The law required it","John asked him"],"answer":1,"why":"Honor and shame."},{"q":"What did Pliny dislike?","options":["Dancing","Serving guests different food by rank","Wine","Big parties"],"answer":1,"why":"He served everyone the same."},{"q":"Which psalm might Mark's green grass echo?","options":["Psalm 1","Psalm 23","Psalm 51","Psalm 150"],"answer":1,"why":"'Green pastures.'"}],"assignment":"Make a chart comparing Herod's banquet and Jesus' meal: who was invited, what was served, how guests were treated, and how each ended. Then write a paragraph about what kind of King each meal reveals."},{"id":"mkh-07","bible":"mrk-07","bibleTitle":"Clean Hearts and Opened Ears","title":"Aramaic, Greek, and the Corban Box","era":"1st century AD","intro":"Mark preserves several of Jesus' actual Aramaic words. And an ancient stone bone box found near Jerusalem carries the very word Jesus criticized in Mark 7: Corban.","sections":[{"h":"Four Languages in One Land","p":["In Jesus' day, several languages were spoken in Judea and Galilee. Aramaic was the everyday language of most Jews, and Jesus almost certainly taught in it. Hebrew was the language of Scripture and worship. Greek was the common language of trade across the eastern Roman Empire, and the New Testament was written in it. Latin was the language of Roman officials and the army.","That's why the sign on Jesus' cross was written in three languages (John 19:20): Aramaic or Hebrew, Latin, and Greek."]},{"h":"Jesus' Own Words","p":["Mark keeps several of Jesus' Aramaic words and translates them: 'Talitha koum' (Little girl, get up), 'Ephphatha' (Be opened), 'Abba' (Father), and 'Eloi, Eloi, lema sabachthani' (My God, my God, why have you forsaken me?). He also gives the nickname 'Boanerges' (sons of thunder).","These words give us something special: the actual sounds of Jesus' voice, remembered by those who heard him and preserved in the Greek Gospels."]},{"h":"The Corban Inscription","p":["In Mark 7:11, Jesus criticizes people who declared their money 'Corban,' meaning a gift devoted to God, to avoid supporting their parents. In 1956, an ossuary (bone box) was found in a tomb near Jerusalem with a Hebrew/Aramaic inscription that includes the word 'qorban.'","The inscription declares that anything a person might find to his profit in this box is an offering to God. People used the word to protect the box from grave robbers: taking anything would be stealing from God. It shows 'Corban' was a real formula used in daily life, just as Mark describes."]}],"people":[{"name":"Jesus","role":"Spoke Aramaic and taught in Galilee and Judea"},{"name":"Józef Milik","role":"Scholar who studied and published the Corban inscription"}],"source":{"title":"The Corban Ossuary Inscription","who":"Carved on a Jerusalem bone box","date":"1st century BC or AD; found in 1956","text":"The inscription reads roughly: Everything a man may find to his profit in this ossuary is an offering (qorban) to God from the one within it.","note":"Closely translated. Compare Mark 7:11. The word Jesus quoted was a real legal and religious formula in his time."},"vocab":[["Aramaic","The everyday language of most Jews in Jesus' time"],["Ossuary","A stone box for storing bones after burial"],["Corban","'Offering': something devoted to God"],["Inscription","Words carved into stone or another hard surface"]],"map":{"view":"local","places":["jerusalem","tyre","gadara"],"caption":"Jesus traveled from Galilee to the Gentile region of Tyre and the Decapolis, where Greek was widely spoken."},"timeline":[{"y":1956,"t":"The 'Corban' ossuary inscription is found near Jerusalem","d":true}],"video":[],"quiz":[{"q":"What was the everyday language of most Jews in Jesus' time?","options":["Latin","Aramaic","English","Egyptian"],"answer":1,"why":"Jesus taught in it."},{"q":"In what language was the New Testament written?","options":["Aramaic","Greek","Latin","Hebrew"],"answer":1,"why":"The common language of trade."},{"q":"What does 'Abba' mean?","options":["Be opened","Father","Get up","Teacher"],"answer":1,"why":"Mark 14:36."},{"q":"What does 'Corban' mean?","options":["Clean","An offering devoted to God","Grave","Forgiven"],"answer":1,"why":"Mark 7:11."},{"q":"Why was 'qorban' written on the bone box?","options":["Decoration","To protect it from robbers by declaring it God's","It was the person's name","It was a prayer"],"answer":1,"why":"Taking from it would be stealing from God."}],"assignment":"Make a mini-dictionary of the Aramaic words in Mark: Boanerges (3:17), Talitha koum (5:41), Corban (7:11), Ephphatha (7:34), Abba (14:36), Golgotha (15:22), and Eloi, Eloi, lema sabachthani (15:34). Write each word, its meaning, and when Jesus or others used it."},{"id":"mkh-08","bible":"mrk-08","bibleTitle":"Seeing Clearly: Who Is Jesus?","title":"Bethsaida: Searching for a Lost Town","era":"1st century AD to today","intro":"Jesus healed a blind man at Bethsaida, the hometown of Peter, Andrew, and Philip. But where exactly was it? Archaeologists are still debating, and the search shows how archaeology really works.","sections":[{"h":"A Fishing Village Becomes a City","p":["Bethsaida means 'house of fishing' or 'house of hunting.' It stood near where the Jordan River flows into the Sea of Galilee, in the territory of Philip the Tetrarch.","Josephus says Philip raised Bethsaida to the rank of a city and renamed it Julias, in honor of Julia, the daughter of Emperor Augustus. Jesus did many miracles there, yet he also warned Bethsaida for not repenting (Matthew 11:21)."]},{"h":"Two Candidate Sites","p":["Since 1987, a team led by archaeologist Rami Arav has excavated a mound called et-Tell, about a mile and a half from today's shoreline. They found a large Iron Age city gate, fishing tools like net weights and hooks, and houses from the Roman period. Arav argues this is Bethsaida.","Other archaeologists point out that et-Tell is too far from the lake for a fishing village, and it doesn't have many Roman-period remains. Since 2016, another team has been excavating el-Araj, right on the shore, where they've found a Roman bathhouse and the remains of a Byzantine church. Some believe the church may have been the 'Church of the Apostles' that an 8th-century pilgrim said was built over Peter and Andrew's house."]},{"h":"How Archaeologists Decide","p":["Identifying ancient places means weighing different kinds of evidence: ancient writers like Josephus, distances mentioned in old texts, pottery and coins that date each layer, buildings that fit the right time, and how the landscape has changed. Earthquakes and floods can even move shorelines over centuries.","Sometimes the evidence points in different directions, and honest scholars disagree. That doesn't make the Bible story less true. It shows how carefully people study the places where it happened."]}],"people":[{"name":"Philip the Tetrarch","role":"Ruler who raised Bethsaida to a city named Julias"},{"name":"Rami Arav","role":"Archaeologist who has excavated et-Tell since 1987"},{"name":"Peter, Andrew, and Philip","role":"Apostles from Bethsaida (John 1:44)"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus writes that Philip advanced the village of Bethsaida, located on Lake Gennesaret, to the status of a city, both by the number of inhabitants and its other size, and named it Julias after the daughter of Caesar.","note":"Paraphrased. Josephus' description helps archaeologists know what to look for: a place near the lake that grew from a village into a Roman-style town."},"vocab":[["Tell","A mound built up from layers of ancient settlements"],["Stratum (plural strata)","A layer of remains from one period at an archaeological site"],["Net weight","A small stone or lead weight used to sink a fishing net"],["Candidate site","A place proposed as the location of an ancient town"]],"map":{"view":"local","places":["bethsaida","capernaum","caesareaphilippi"],"caption":"Bethsaida was near where the Jordan enters the Sea of Galilee. Jesus traveled from there north to Caesarea Philippi."},"timeline":[{"y":-2,"t":"Philip renames Bethsaida 'Julias' (before 2 BC)"},{"y":1987,"t":"Excavations begin at et-Tell, a proposed site of Bethsaida","d":true},{"y":2016,"t":"Excavations begin at el-Araj on the shoreline","d":true}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What does Bethsaida mean?","options":["House of bread","House of fishing","City of kings","Place of healing"],"answer":1,"why":"Or 'house of hunting.'"},{"q":"What did Philip rename Bethsaida?","options":["Tiberias","Julias","Caesarea","Augusta"],"answer":1,"why":"After Augustus' daughter."},{"q":"Which apostles came from Bethsaida?","options":["James and John","Peter, Andrew, and Philip","Matthew and Thomas","Judas and Simon"],"answer":1,"why":"John 1:44."},{"q":"Why do some doubt et-Tell is Bethsaida?","options":["It's too small","It's far from the lake and has few Roman remains","It's in Egypt","It has no ruins"],"answer":1,"why":"Scholars debate it."},{"q":"What was found at el-Araj?","options":["A pyramid","A Roman bathhouse and Byzantine church","The Galilee boat","A temple to Zeus"],"answer":1,"why":"Right on the shore."}],"assignment":"Make a 'case file' comparing et-Tell and el-Araj. List the evidence for each site. Then write a paragraph saying which you find more convincing and why, or what evidence would help decide."},{"id":"mkh-09","bible":"mrk-09","bibleTitle":"Help My Unbelief","title":"Salt, Millstones, and the Valley of Hinnom","era":"Ancient Israel to the 1st century AD","intro":"At the end of Mark 9, Jesus talks about millstones, the fire of Gehenna, and salt. Each of these was a real, everyday thing to his listeners, with a history behind it.","sections":[{"h":"Salt: More Precious Than You Think","p":["In the ancient world, salt wasn't just for flavor. It was the main way to keep meat and fish from spoiling, it was used in sacrifices (Leviticus 2:13), and it was needed for health. Salt was collected by evaporating seawater or mined from places like the salt cliffs near the Dead Sea.","Salt from the Dead Sea region often contained other minerals. If the actual salt dissolved out, what was left looked like salt but was useless. That's the picture behind Jesus' warning about salt losing its saltiness (Mark 9:50)."]},{"h":"The Donkey Millstone","p":["Every household ground grain into flour each day, usually with a small hand mill. But Jesus mentions a 'large millstone' (Mark 9:42), literally a 'donkey millstone.' This was a huge stone turned by a donkey walking in circles, used for grinding large amounts of grain or crushing olives.","These stones could weigh hundreds of pounds, and archaeologists have found many in Capernaum and around Galilee. Jesus' listeners knew exactly how heavy they were, which made his warning about harming 'little ones' unforgettable."]},{"h":"Gehenna","p":["The word Jesus used for hell, Gehenna, comes from the Hebrew 'Ge Hinnom,' the Valley of Hinnom, a real valley on the south side of Jerusalem. Centuries earlier, some kings of Judah had worshiped false gods there in terrible ways, including sacrificing children (2 Kings 23:10; Jeremiah 7:31). The prophet Jeremiah said it would become a 'Valley of Slaughter.'","Because of this shameful history, the valley became a symbol of God's judgment. By Jesus' time, Jewish writers used 'Gehenna' for the place of final punishment. You can visit the Valley of Hinnom today; it's a green valley and park just outside the Old City walls."]}],"people":[{"name":"Pliny the Elder","role":"Roman naturalist (AD 23-79) who wrote an encyclopedia of the natural world"},{"name":"King Josiah","role":"King of Judah who shut down the idol worship in the Valley of Hinnom (2 Kings 23)"}],"source":{"title":"Natural History, Book 31","who":"Pliny the Elder","date":"About AD 77","text":"Pliny writes a long section about salt: how it's made from seawater, lakes, and mines, and how it's used for food, medicine, and preserving. He says a civilized life cannot go on without salt, and that nothing is more useful than salt and sunshine.","note":"Paraphrased. Pliny's famous saying about 'salt and sun' shows how important salt was. Our word 'salary' may come from the Latin for salt, though historians debate whether Roman soldiers were really paid in salt."},"vocab":[["Preserve","To keep food from spoiling"],["Millstone","A heavy round stone used for grinding grain"],["Gehenna","From 'Valley of Hinnom'; a word Jesus used for hell"],["Evaporation","Water drying up and leaving minerals like salt behind"]],"map":{"view":"local","places":["jerusalem","capernaum","qumran"],"caption":"The Valley of Hinnom runs along Jerusalem's south side. Salt came from the Dead Sea region; millstones have been found around Capernaum."},"timeline":[{"y":-622,"t":"King Josiah ends idol worship in the Valley of Hinnom (about 622 BC)"},{"y":77,"t":"Pliny the Elder writes his Natural History (about AD 77)"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What was salt's most important ancient use?","options":["Decoration","Preserving food","Building","Money only"],"answer":1,"why":"Before refrigerators!"},{"q":"What turned a 'donkey millstone'?","options":["Water","A donkey walking in circles","Wind","Two people"],"answer":1,"why":"That's where the name comes from."},{"q":"Where does 'Gehenna' come from?","options":["A Greek god","The Valley of Hinnom in Jerusalem","A Roman prison","An Egyptian word"],"answer":1,"why":"Ge Hinnom."},{"q":"Which king ended idol worship in the valley?","options":["Solomon","Josiah","Ahab","Herod"],"answer":1,"why":"2 Kings 23:10."},{"q":"What did Pliny say is most useful?","options":["Gold and silver","Salt and sunshine","Bread and wine","Iron and stone"],"answer":1,"why":"Natural History, Book 31."}],"assignment":"Science and history: Dissolve salt in water and let it evaporate in a sunny window over several days. Describe what's left. Then explain what Jesus meant by 'Have salt among yourselves, and be at peace with each other' (Mark 9:50)."},{"id":"mkh-10","bible":"mrk-10","bibleTitle":"Not to Be Served, But to Serve","title":"Beggars, the Poor, and the First Hospitals","era":"1st to 4th century AD","intro":"Blind Bartimaeus sat by the road begging because there was no other way for him to survive. Jesus' care for people like him changed how his followers treated the poor and sick, and eventually changed the world.","sections":[{"h":"Begging by the Roadside","p":["In the ancient world there was no government welfare, no disability support, and no hospital for ordinary people. A blind man like Bartimaeus depended on the kindness of travelers. He sat near Jericho's gate because the road to Jerusalem was busy, especially before Passover, when pilgrims were eager to give.","His cloak was probably his most important possession, used for warmth at night and spread out to collect coins. When Bartimaeus threw it aside to come to Jesus, he was leaving behind everything he had."]},{"h":"Jewish Charity","p":["The law of Moses commanded care for the poor, widows, orphans, and foreigners. Farmers left the edges of their fields unharvested for the poor (Leviticus 19:9-10). By Jesus' time, many Jewish communities organized collections for the needy, and giving to the poor was considered a central act of righteousness.","Greeks and Romans sometimes gave generously too, but usually to their own city or to people who could return the favor. Helping someone who could never pay you back wasn't widely considered a virtue."]},{"h":"The Christian Difference","p":["Early Christians took Jesus' example seriously. They cared for widows (Acts 6), shared food, and nursed the sick during plagues when others fled. In AD 369, a bishop named Basil built a large complex in Caesarea (in modern Turkey) with a hospital, lodging for travelers, and care for the poor and people with leprosy. Many historians see it as one of the first true hospitals.","Even an emperor who opposed Christianity noticed. Emperor Julian, who tried to restore the old Roman gods in the 360s, complained that Christians cared not only for their own poor but for pagans' poor too."]}],"people":[{"name":"Bartimaeus","role":"Blind beggar at Jericho healed by Jesus"},{"name":"Basil of Caesarea","role":"Bishop who built a famous hospital and poorhouse in AD 369"},{"name":"Emperor Julian","role":"Roman emperor (AD 361-363) who tried to bring back pagan religion"}],"source":{"title":"Letter to Arsacius","who":"Emperor Julian","date":"About AD 362","text":"Julian urges a pagan priest to set up places to help strangers and the poor. He complains that the 'Galileans' (his name for Christians) support not only their own poor but ours as well, and that everyone can see our people lack help from us.","note":"Paraphrased. Julian disliked Christians, which makes his complaint strong evidence that Christian charity was widely noticed."},"vocab":[["Charity","Giving help to people in need"],["Welfare","Organized help for people who can't support themselves"],["Virtue","A quality considered morally good"],["Pagan","Following the old Greek and Roman gods"]],"map":{"view":"local","places":["jericho","jerusalem","jordanbaptism"],"caption":"Bartimaeus sat beside the busy road from Jericho up to Jerusalem."},"timeline":[{"y":362,"t":"Emperor Julian complains about Christian charity (about AD 362)"},{"y":369,"t":"Basil of Caesarea builds one of the first hospitals"}],"video":[],"quiz":[{"q":"Why did Bartimaeus sit by the Jericho road?","options":["He lived there","Many travelers passed on the way to Jerusalem","He was waiting for Jesus only","It was shady"],"answer":1,"why":"Especially before Passover."},{"q":"What might Bartimaeus have used his cloak for?","options":["Warmth and collecting coins","Fishing","A tent","Selling"],"answer":0,"why":"His most important possession."},{"q":"What did the law of Moses tell farmers to leave for the poor?","options":["Nothing","The edges of their fields","Their best animals","Their houses"],"answer":1,"why":"Leviticus 19:9-10."},{"q":"Who built one of the first hospitals in AD 369?","options":["Julian","Basil of Caesarea","Nero","Josephus"],"answer":1,"why":"In Caesarea in modern Turkey."},{"q":"What did Emperor Julian complain about?","options":["Christians were lazy","Christians helped even pagans' poor","Christians were rich","Christians didn't pay taxes"],"answer":1,"why":"His letter around AD 362."}],"assignment":"Research a Christian-founded hospital, charity, or relief organization near you or in history. Write a paragraph about who started it and how it reflects Mark 10:45."},{"id":"mkh-11","bible":"mrk-11","bibleTitle":"A House of Prayer for All Nations","title":"Fig Trees and the High Priests' Business","era":"1st century AD","intro":"Jesus cursed a fruitless fig tree and cleared the temple of merchants. Farming knowledge explains the fig tree, and later Jewish writings show that many people felt the high priestly families had grown greedy.","sections":[{"h":"Figs and Their Seasons","p":["Fig trees were everywhere in Israel, often planted beside vineyards. They produce leaves in spring, and small early fruit buds (sometimes called paggim) often appear along with the leaves. Mark says 'it was not the season for figs,' meaning the main harvest was months away. But a tree full of leaves with no early fruit at all was a sign it would bear nothing that year.","The prophets had used the fig tree as a picture of Israel. Jeremiah 8:13 says, 'There will be no figs on the tree.' Jesus acted out a prophet's warning, like the prophets of old often did."]},{"h":"Business in the Temple Courts","p":["Pilgrims traveling long distances couldn't bring animals for sacrifice, so they bought them in Jerusalem. They also needed to exchange their coins for Tyrian shekels to pay the temple tax. Providing these services wasn't wrong in itself. But by Jesus' time, the trade had moved into the temple's outer court, the Court of the Gentiles, which was supposed to be a place of prayer for non-Jews.","The temple was controlled by a few powerful priestly families, including the family of Annas, whose son-in-law Caiaphas was high priest. These families grew very wealthy."]},{"h":"A Lament About the Priests","p":["The Talmud, a collection of Jewish teachings written down centuries later, preserves a lament that seems to go back to the time of the temple. It names several high priestly families, including the house of Hanin (Annas), and complains about their whispering plots, their clubs, and their servants who beat people with sticks.","This shows that Jesus wasn't the only one troubled by what was happening. Many ordinary Jews were upset by how the temple's leaders used their power."]}],"people":[{"name":"Annas (Hanin)","role":"Former high priest whose family controlled the high priesthood for decades"},{"name":"Caiaphas","role":"Annas' son-in-law, high priest AD 18-36"}],"source":{"title":"Babylonian Talmud, Pesachim 57a","who":"Jewish teachers, recording an older lament","date":"Written down about AD 500, preserving older sayings","text":"The lament says: Woe is me because of the house of Boethus, woe because of their clubs. Woe because of the house of Hanin, woe because of their whisperings. For they are high priests, their sons are treasurers, their sons-in-law are temple officers, and their servants beat the people with sticks.","note":"Paraphrased. This comes from much later than Jesus, so historians use it carefully, but it describes the same priestly families the Gospels mention."},"vocab":[["Fig","A sweet fruit tree common in Israel"],["Prophetic sign","An action a prophet performs to illustrate God's message"],["Court of the Gentiles","The temple's outer area open to non-Jews"],["Talmud","A large collection of Jewish teaching and commentary"]],"map":{"view":"local","places":["jerusalem","bethany","jericho"],"caption":"Jesus stayed in Bethany and walked each day over the Mount of Olives into Jerusalem."},"timeline":[{"y":18,"t":"Caiaphas, son-in-law of Annas, becomes high priest (about AD 18)"},{"y":500,"t":"The Babylonian Talmud is completed (about AD 500)"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"Why did pilgrims buy animals in Jerusalem?","options":["They were cheaper","It was hard to bring animals on long journeys","It was required by Rome","They forgot"],"answer":1,"why":"Traveling from far away."},{"q":"Where had the temple trade moved?","options":["Outside the city","Into the Court of the Gentiles","To the Holy of Holies","To Bethany"],"answer":1,"why":"Meant for prayer."},{"q":"Which family controlled the high priesthood?","options":["The Maccabees","The family of Annas","The Herods","The Zealots"],"answer":1,"why":"Caiaphas was his son-in-law."},{"q":"Which prophet used a fruitless fig tree as a warning?","options":["Jeremiah","Jonah","Elijah","Daniel"],"answer":0,"why":"Jeremiah 8:13."},{"q":"What does the Talmud lament complain about?","options":["Roman taxes","Greedy, violent priestly families","Bad harvests","Pagan temples"],"answer":1,"why":"Including the house of Hanin (Annas)."}],"assignment":"Read Jeremiah 7:1-11, which Jesus quoted. Write a paragraph comparing the problems Jeremiah saw in his day with what Jesus saw in the temple."},{"id":"mkh-12","bible":"mrk-12","bibleTitle":"Questions in the Temple and a Widow's Gift","title":"The Widow's Mite and the Temple Treasury","era":"About 100 BC to AD 70","intro":"Jesus watched people drop money into the temple treasury, and a poor widow gave two tiny coins. Archaeologists have found thousands of coins like hers, and ancient Jewish writings describe the collection boxes she used.","sections":[{"h":"The Smallest Coin","p":["The widow's coins were lepta (singular: lepton), tiny bronze coins, the smallest in circulation. Many of the lepta found in Israel were minted by Alexander Jannaeus, a Hasmonean king who ruled from about 103 to 76 BC. They're so common that collectors can still buy a 'widow's mite' today.","Mark says two lepta equaled one quadrans, and a quadrans was a sixty-fourth of a denarius, a day's wage. So the widow's gift was worth a few minutes of a laborer's pay. But it was 'all she had to live on.'"]},{"h":"Trumpet-Shaped Offering Boxes","p":["The Mishnah, written down around AD 200 from older traditions, says there were thirteen collection chests in the temple, shaped like shofars (ram's horn trumpets): narrow at the top and wide at the bottom, so no one could reach in to steal. Each was labeled for a different purpose, such as the temple tax, bird offerings, wood for the altar, incense, gold for the mercy seat, and free-will offerings.","These chests probably stood in the Court of the Women, which both men and women could enter. When coins were dropped in, they would clatter down the metal horn. Large gifts made a lot of noise! The widow's two tiny coins would barely have made a sound."]},{"h":"Widows in Jesus' Day","p":["Widows were among the most vulnerable people in the ancient world. Without a husband, and especially without grown sons, a woman often had no income or legal protection. God's law repeatedly commands care for widows (Exodus 22:22; Deuteronomy 24:17).","Just before this story, Jesus warned about teachers of the law who 'devour widows' houses' while making long prayers for show (Mark 12:40). The poor widow's generosity stands in sharp contrast to their greed."]}],"people":[{"name":"Alexander Jannaeus","role":"Hasmonean king (about 103-76 BC) who minted many of the small bronze coins found today"},{"name":"The poor widow","role":"Gave two lepta, 'all she had to live on' (Mark 12:44)"}],"source":{"title":"The Mishnah, Shekalim 6:5","who":"Jewish rabbis","date":"Written down about AD 200","text":"The Mishnah says there were thirteen shofar-shaped chests in the temple. It lists what each was for, including new shekels, old shekels, bird offerings, young birds for burnt offerings, wood, frankincense, gold for the mercy seat, and six chests for free-will offerings.","note":"Paraphrased. The Mishnah was compiled after the temple was destroyed, so it records memories and traditions. It helps us picture where the widow put her coins."},"vocab":[["Lepton (plural lepta)","The smallest bronze coin in Jesus' time"],["Mite","Old English word used for the widow's coin"],["Treasury","The place where money for the temple was collected"],["Shofar","A ram's horn trumpet"]],"map":{"view":"local","places":["jerusalem"],"caption":"The offering chests stood in the temple courts in Jerusalem."},"timeline":[{"y":-103,"t":"Alexander Jannaeus begins minting small bronze coins (about 103 BC)"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"What were the widow's coins called?","options":["Denarii","Lepta","Shekels","Talents"],"answer":1,"why":"The smallest coins."},{"q":"Who minted many of these small coins?","options":["Caesar","Alexander Jannaeus","Herod","Pilate"],"answer":1,"why":"A Hasmonean king."},{"q":"What shape were the temple collection chests?","options":["Square boxes","Shaped like shofars (trumpets)","Round jars","Baskets"],"answer":1,"why":"Narrow at top, wide at bottom."},{"q":"How many chests does the Mishnah describe?","options":["Three","Seven","Thirteen","Forty"],"answer":2,"why":"Each for a different purpose."},{"q":"Why were widows vulnerable?","options":["They were old","They often had no income or legal protection","They weren't allowed in the temple","They had too much money"],"answer":1,"why":"God's law commanded care for them."}],"assignment":"Math: A quadrans is 1/64 of a denarius. If a denarius is one day's pay for 10 hours of work, how many minutes of work was the widow's gift (one quadrans) worth? Then write about what Jesus valued in her gift."},{"id":"mkh-13","bible":"mrk-13","bibleTitle":"Stay Awake!","title":"Stones That Were Thrown Down","era":"AD 70 to today","intro":"Jesus said not one of the temple's massive stones would be left on another. In 1968, archaeologists digging below the Temple Mount began uncovering the evidence: huge stones lying where Roman soldiers pushed them in AD 70.","sections":[{"h":"Digging by the Western Wall","p":["After 1967, archaeologist Benjamin Mazar led major excavations along the southern and western walls of the Temple Mount. His team uncovered a first-century paved street running along the base of the wall, with shops that once sold goods to pilgrims.","On that street lay a huge pile of enormous stones, some weighing many tons, that had crashed down from the top of the Temple Mount walls. They had fallen with such force that they cracked the paving stones. Today visitors can see these stones still lying where they fell."]},{"h":"The Place of Trumpeting","p":["Among the fallen stones in 1968, Mazar's team found a large carved block from the top corner of the wall. It bears a Hebrew inscription that begins, 'To the place of trumpeting...' The rest is broken off.","Josephus wrote that a priest stood on a high point of the temple to blow a trumpet announcing the start and end of each Sabbath. This stone probably marked that very spot. It was thrown down along with the rest when Rome destroyed the temple, just as Jesus said."]},{"h":"The Burnt House","p":["In the Jewish Quarter of Jerusalem's Old City, archaeologist Nahman Avigad excavated a house destroyed by fire in AD 70. The rooms were covered with ash and burnt beams. Inside were cooking pots, stone vessels, coins from the Jewish revolt, and a spear.","A stone weight in the house was inscribed with the name 'bar Kathros,' a priestly family. The Burnt House is a real snapshot of the day Jerusalem fell, about 40 years after Jesus warned his disciples to flee."]}],"people":[{"name":"Benjamin Mazar","role":"Israeli archaeologist who excavated along the Temple Mount walls from 1968"},{"name":"Nahman Avigad","role":"Archaeologist who excavated the Jewish Quarter, including the Burnt House"},{"name":"Titus","role":"Roman general whose army destroyed the temple in AD 70"}],"source":{"title":"The 'Place of Trumpeting' Inscription","who":"Carved on the temple's southwest corner","date":"1st century AD; found in 1968","text":"The Hebrew inscription, carved on a stone that fell from the top of the Temple Mount wall, reads: 'To the place of trumpeting to...' (the rest is broken off).","note":"Closely translated. Scholars suggest the missing words said something like 'to announce' or 'to distinguish,' meaning the Sabbath's beginning and end. The stone is now in the Israel Museum."},"vocab":[["Temple Mount","The huge platform in Jerusalem where the temple stood"],["Paving stones","Flat stones laid to make a street"],["Ash layer","A layer of burned material showing a fire"],["Stone vessels","Cups and jars carved from stone, used for ritual purity"]],"map":{"view":"local","places":["jerusalem","pella"],"caption":"Jesus warned those in Judea to flee to the mountains. Tradition says Christians fled to Pella before the Roman siege."},"timeline":[{"y":70,"t":"Roman soldiers throw down the temple stones"},{"y":1968,"t":"The 'place of trumpeting' stone is found","d":true}],"video":[],"quiz":[{"q":"Who led the excavations along the Temple Mount walls?","options":["Woolley","Benjamin Mazar","Josephus","Titus"],"answer":1,"why":"Starting in 1968."},{"q":"What did the fallen stones do to the street below?","options":["Nothing","Cracked the paving stones","Built a wall","Made a tunnel"],"answer":1,"why":"They fell with great force."},{"q":"What does the famous inscription begin with?","options":["Holy to the Lord","To the place of trumpeting","Herod the King","Welcome"],"answer":1,"why":"It marked where a priest blew the trumpet."},{"q":"What was found in the Burnt House?","options":["A chariot","Cooking pots, stone vessels, coins, and a spear","Scrolls","A statue"],"answer":1,"why":"A snapshot of AD 70."},{"q":"Whose name was on the stone weight in the Burnt House?","options":["Caiaphas","Bar Kathros","Herod","Pilate"],"answer":1,"why":"A priestly family."}],"assignment":"Make a poster titled 'Not One Stone on Another' with Mark 13:2 at the top, then three pieces of archaeological evidence from this lesson, each with a sketch and one sentence of explanation."},{"id":"mkh-14","bible":"mrk-14","bibleTitle":"Anointed, Betrayed, and Arrested","title":"Upper Rooms and Mansions in Jerusalem","era":"1st century AD","intro":"Jesus ate the Last Supper in 'a large room upstairs, furnished and ready' (Mark 14:15). Archaeologists have uncovered the homes of Jerusalem's wealthy in the Upper City, which help us picture where such a meal could take place.","sections":[{"h":"Jerusalem's Upper City","p":["Jerusalem was divided into neighborhoods. The Upper City, on the western hill, was where priests and wealthy families lived, near Herod's palace. The Lower City was crowded with ordinary people's homes and workshops.","After 1967, Nahman Avigad excavated the Jewish Quarter of the Old City and found the remains of luxurious homes from Jesus' time, buried under the ash of AD 70. One large house, now called the Herodian Mansion, covered about 6,500 square feet!"]},{"h":"Inside a Wealthy Home","p":["The Herodian Mansion had colorful painted walls (frescoes), mosaic floors, fine pottery imported from far away, and several mikva'ot (ritual baths) for keeping religious purity. Rooms were arranged around a central courtyard, and some houses had second-story rooms.","An 'upper room' was a large room on the second floor, often used for guests or gatherings. Acts 1:13 says the disciples gathered in an upper room after Jesus ascended, and Acts 12:12 mentions the house of Mary, John Mark's mother, where many people gathered to pray."]},{"h":"Was It Mark's Family's House?","p":["Mark 14:13-15 tells how Jesus sent two disciples to follow a man carrying a water jar (unusual, since women usually carried water) to a house with a large upper room. Some have wondered whether this was the home of Mark's mother, Mary. The young man who fled from Gethsemane (Mark 14:51-52) might then have been Mark himself.","We don't know for sure. But the idea fits: a wealthy family in Jerusalem, a large house that became a gathering place for believers, and a young man who later wrote the Gospel."]}],"people":[{"name":"Nahman Avigad","role":"Excavated the wealthy homes of Jerusalem's Upper City (1969-1983)"},{"name":"Mary, mother of John Mark","role":"Owned a house in Jerusalem where believers gathered (Acts 12:12)"}],"source":{"title":"The Herodian Mansion (Wohl Archaeological Museum)","who":"A wealthy, possibly priestly, Jerusalem family","date":"1st century AD; excavated 1969-1983","text":"Excavators found a large house with a courtyard, rooms decorated with frescoes and mosaics, fine tableware including imported glass and pottery, stone vessels for ritual purity, and several ritual baths. The house was destroyed by fire when the Romans took the Upper City in AD 70.","note":"Described. The ruins are preserved underground in a museum beneath the modern Jewish Quarter, so visitors can walk through rooms from Jesus' time."},"vocab":[["Upper City","The wealthy neighborhood on Jerusalem's western hill"],["Fresco","A painting made on wet plaster"],["Mosaic","A picture made from small pieces of colored stone or glass"],["Upper room","A large second-floor room used for guests or gatherings"]],"map":{"view":"local","places":["jerusalem","bethany"],"caption":"Jesus came from Bethany to Jerusalem for the Passover meal in an upper room."},"timeline":[{"y":1969,"t":"Excavations begin in Jerusalem's Jewish Quarter","d":true}],"video":[["Drive Thru History: The Last Supper","https://watch.tbn.org/s/Q9aSuuiu?e=QfYSBn17"]],"quiz":[{"q":"Who lived in Jerusalem's Upper City?","options":["Fishermen","Priests and wealthy families","Roman soldiers","Farmers"],"answer":1,"why":"Near Herod's palace."},{"q":"What decorated the Herodian Mansion's walls?","options":["Wallpaper","Frescoes","Nothing","Tapestries"],"answer":1,"why":"Painted on wet plaster."},{"q":"What was unusual about the man carrying the water jar?","options":["He was a priest","Men usually didn't carry water","He was Roman","He was running"],"answer":1,"why":"Women usually did."},{"q":"What is an 'upper room'?","options":["An attic","A large second-floor room for gatherings","A tower","A roof"],"answer":1,"why":"Used for guests."},{"q":"What destroyed the Herodian Mansion?","options":["An earthquake","Fire when the Romans took the city in AD 70","A flood","It still stands"],"answer":1,"why":"Buried under ash."}],"assignment":"Draw a floor plan of a two-story Jerusalem house from Jesus' time: courtyard, rooms, a ritual bath, stairs, and an upper room set for a Passover meal with low tables and cushions."},{"id":"mkh-15","bible":"mrk-15","bibleTitle":"Surely This Man Was the Son of God","title":"Simon of Cyrene and His Sons","era":"1st century AD","intro":"Mark names the man forced to carry Jesus' cross: Simon of Cyrene, 'the father of Alexander and Rufus.' Why mention the sons? Because Mark's readers probably knew them. And a tomb found in 1941 may hold a clue.","sections":[{"h":"Cyrene: A Jewish Community in Africa","p":["Cyrene was a Greek city in North Africa, in what is now Libya. It had a large Jewish community, and many Jews from Cyrene came to Jerusalem for festivals. Acts 2:10 lists people from 'the parts of Libya near Cyrene' at Pentecost, and Acts 6:9 mentions a synagogue in Jerusalem for Cyrenians.","Simon was 'passing by on his way in from the country.' Roman soldiers could force anyone to carry a load, and they chose him to carry the heavy crossbeam when Jesus, weakened by flogging, couldn't."]},{"h":"Alexander and Rufus","p":["Matthew and Luke also tell about Simon, but only Mark adds the names of his sons. That suggests Mark's first readers knew them, probably as believers in their church.","Paul's letter to the Romans, written to Christians in Rome, sends greetings to 'Rufus, chosen in the Lord, and his mother, who has been a mother to me, too' (Romans 16:13). Many think this is the same Rufus. If so, the man who carried Jesus' cross had a family that became part of the church."]},{"h":"A Family Tomb in the Kidron Valley","p":["In 1941, archaeologists Eleazar Sukenik and Nahman Avigad examined a burial cave in the Kidron Valley near Jerusalem. It contained ossuaries with names typical of Jews from Cyrene. One ossuary was inscribed 'Alexander, son of Simon.'","Both names were common, so we can't be certain this is the Alexander of Mark 15. But it's a remarkable find: a Cyrenian Jewish family in Jerusalem with a Simon and an Alexander, exactly as Mark describes."]}],"people":[{"name":"Simon of Cyrene","role":"Man forced to carry Jesus' cross"},{"name":"Alexander and Rufus","role":"Simon's sons, apparently
