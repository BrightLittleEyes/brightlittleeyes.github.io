}

/* ---------- quizzes & tests ---------- */
function startQuiz(unitId, kind, fresh){
  if (needStudent()) return;
  const saved = inprog[student];
  if (!fresh && saved && saved.unit===unitId && saved.kind===kind){ view = Object.assign({page:"quiz", resumed:true}, saved); render(); window.scrollTo({top:0}); return; }
  let qs = kind==="final" ? shuffle(UNITS.flatMap(u => shuffle(u.quiz.concat(u.test)).slice(0,4))) : shuffle(unitById(unitId)[kind]);
  go({page:"quiz", unit:unitId, kind, qs:qs.map(prepQ), i:0, picks:[], checked:false, streak:0, bestStreak:0});
}
function saveQuiz(){ const v = view; inprog[student] = {unit:v.unit, kind:v.kind, qs:v.qs, i:v.i, picks:v.picks, checked:v.checked, streak:v.streak||0, bestStreak:v.bestStreak||0}; saveAll(); }

function renderQuiz(){
  const v = view, Q = v.qs[v.i], picked = v.picks[v.i];
  const practice = v.kind==="quiz", locked = practice && v.checked;
  app.innerHTML = `
  <div class="quiz" style="--c:var(${colorOf(v.unit)})">
    ${v.resumed ? `<p class="resumed">Welcome back! Your answers were saved. <button class="linkbtn" id="restart">Start over instead</button></p>` : ""}
    <div class="qhead"><span class="kind">${kindLabel(v.kind)} · ${esc(titleOf(v.unit))}</span><span class="eyebrow">Question ${v.i+1} of ${v.qs.length}</span></div>
    <div class="meter"><i style="width:${pct(v.i+(locked||(!practice&&picked!=null)?1:0), v.qs.length)}%"></i></div>
    ${practice && (v.streak||0)>=2 ? `<p class="streak">${v.streak} in a row!</p>` : ""}
    <div class="qcard">
      <p class="qtext">${esc(Q.q)}</p>
      <div class="choices" role="radiogroup">
        ${Q.choices.map((c,i)=>{
          let cls = "choice";
          if (locked){ if (i===Q.answer) cls+=" right"; else if (i===picked) cls+=" wrong shake"; }
          else if (i===picked) cls+=" picked";
          return `<button class="${cls}" data-c="${i}" role="radio" aria-checked="${i===picked}" ${locked?"disabled":""}><span class="l">${"ABCD"[i]}</span><span>${esc(c)}</span></button>`;
        }).join("")}
      </div>
      ${locked ? `<div class="explain ${picked===Q.answer?"ok":"no"}"><strong>${picked===Q.answer?"Correct!":"Not quite. The answer is "+"ABCD"[Q.answer]+"."}</strong>${esc(Q.why)}</div>` : ""}
    </div>
    <div class="qfoot">
      <button class="btn ghost" id="quit">Save and exit</button>
      ${practice
        ? (locked ? `<button class="btn" id="next">${v.i<v.qs.length-1?"Next question →":"See my stars"}</button>`
                  : `<button class="btn" id="check" ${picked==null?"disabled":""}>Check answer</button>`)
        : `<div style="display:flex;gap:10px"><button class="btn ghost" id="prevq" ${v.i===0?"disabled":""}>← Back</button><button class="btn" id="next" ${picked==null?"disabled":""}>${v.i<v.qs.length-1?"Next →":"Finish"}</button></div>`}
    </div>
  </div>`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { v.picks[v.i] = +b.dataset.c; v.resumed = false; saveQuiz(); renderQuiz(); });
  $("#quit").onclick = () => { saveQuiz(); go(v.unit==="final" ? {page:"home"} : {page:"unit", unit:v.unit, lesson:0}); };
  const rsb=$("#restart"); if(rsb) rsb.onclick = () => { delete inprog[student]; saveAll(); startQuiz(v.unit, v.kind, true); };
  const ch=$("#check"); if(ch) ch.onclick = () => {
    v.checked = true;
    if (v.picks[v.i]===Q.answer){ v.streak=(v.streak||0)+1; v.bestStreak=Math.max(v.bestStreak||0,v.streak); sfx.right(); } else { v.streak=0; sfx.wrong(); }
    saveQuiz(); renderQuiz();
  };
  const pv=$("#prevq"); if(pv) pv.onclick = () => { v.i--; saveQuiz(); renderQuiz(); };
  const nx=$("#next"); if(nx) nx.onclick = () => {
    if (v.i < v.qs.length-1){ v.i++; v.checked=false; v.resumed=false; saveQuiz(); renderQuiz(); window.scrollTo({top:0}); }
    else finishQuiz();
  };
}

function recordResult(r){
  const before = badges(student).filter(b=>b.got).map(b=>b.name);
  results = results.concat([r]); saveAll();
  const after = badges(student).filter(b=>b.got && !before.includes(b.name));
  return after;
}
function finishQuiz(){
  const v = view;
  const score = v.qs.reduce((a,Q,i)=>a+(v.picks[i]===Q.answer?1:0),0), p = pct(score, v.qs.length);
  const r = { id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), student, unit:v.unit, kind:v.kind, score, total:v.qs.length, pct:p, stars:starsFor(p), bestStreak:v.bestStreak||0, at:new Date().toISOString(),
    items: v.qs.map((Q,i)=>({q:Q.q, choices:Q.choices, answer:Q.answer, picked:v.picks[i]??null, why:Q.why})) };
  delete inprog[student];
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges };
  render(); window.scrollTo({top:0});
  if (r.stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}

function renderDone(){
  const {r, newBadges} = view, items = r.items || [];
  const msg = r.stars===3?"Outstanding! Three stars!":r.stars===2?"Great job! Two stars!":r.stars===1?"Nice work. One star! Review the ones you missed and try for more.":"Keep practicing. Reread the lessons and try again for a star.";
  const isGame = r.kind==="game";
  app.innerHTML = `
  <div class="quiz" style="--c:var(${colorOf(r.unit)})">
    <div class="result">
      <span class="eyebrow">${kindLabel(r.kind)} · ${esc(titleOf(r.unit))}</span>
      <div class="bigstars">${[0,1,2].map(i=>`<span class="${i<r.stars?"on":""}" style="animation-delay:${i*.25}s">★</span>`).join("")}</div>
      <div class="big">${r.pct}%</div>
      <div class="sub">${isGame ? `${r.total} matches · ${r.mistakes} mistake${r.mistakes===1?"":"s"} · ${r.secs}s` : `${r.score} of ${r.total} correct · grade ${grade(r.pct)}`}</div>
      <div class="msg">${msg}</div>
      ${newBadges && newBadges.length ? `<div class="newbadge">New badge${newBadges.length>1?"s":""}: ${newBadges.map(b=>`<b>${esc(b.name)}</b>`).join(", ")}</div>` : ""}
    </div>
    <div class="qfoot" style="margin-bottom:18px">
      <button class="btn ghost" id="back">${r.unit==="final"?"Back to units":"Back to unit"}</button>
      <button class="btn" id="again">Play again</button>
    </div>
    ${items.length ? `<div class="section-h"><h2>Review</h2></div>
    <div class="review">${items.map((Q,i)=>{ const ok = Q.picked===Q.answer;
      return `<div class="item ${ok?"":"miss"}"><p class="q">${i+1}. ${esc(Q.q)}</p>
        <p>${ok?"✓ ":"✗ Your answer: "+esc(Q.choices[Q.picked]??"none")+" · "}Correct: <b>${esc(Q.choices[Q.answer])}</b></p>
        <p class="muted">${esc(Q.why)}</p></div>`; }).join("")}</div>` : ""}
    <p class="note">Saved on this device.</p>
  </div>`;
  $("#back").onclick = () => go(r.unit==="final" ? {page:"home"} : {page:"unit", unit:r.unit, lesson:0});
  $("#again").onclick = () => isGame ? startGame(r.unit) : startQuiz(r.unit, r.kind, true);
}

/* ---------- vocab match game ---------- */
function startGame(unitId){
  if (needStudent()) return;
  const u = unitById(unitId), pairs = shuffle(u.lessons.flatMap(l => l.vocab)).slice(0,6);
  go({page:"game", unit:unitId, pairs, left:shuffle(pairs.map((p,i)=>i)), right:shuffle(pairs.map((p,i)=>i)), sel:null, matched:[], mistakes:0, t0:Date.now(), flash:null});
}
function renderGame(){
  const v = view, u = unitById(v.unit);
  const secs = Math.round((Date.now()-v.t0)/1000);
  app.innerHTML = `
  <div class="quiz game" style="--c:var(${u.color})">
    <div class="qhead"><span class="kind">Vocab match · ${esc(titleOf(v.unit))}</span><span class="eyebrow" id="gclock">${v.matched.length}/${v.pairs.length} matched · ${secs}s</span></div>
    <p class="howto">Tap a word, then tap its meaning. Fewer mistakes means more stars.</p>
    <div class="board">
      <div class="colw">${v.left.map(i=>`<button class="tcard word ${v.matched.includes(i)?"done":""} ${v.sel===i?"sel":""} ${v.flash&&v.flash.w===i?"bad":""}" data-w="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][0])}</button>`).join("")}</div>
      <div class="colw">${v.right.map(i=>`<button class="tcard def ${v.matched.includes(i)?"done":""} ${v.flash&&v.flash.d===i?"bad":""}" data-d="${i}" ${v.matched.includes(i)?"disabled":""}>${esc(v.pairs[i][1])}</button>`).join("")}</div>
    </div>
    <div class="qfoot"><button class="btn ghost" id="quit">Quit game</button><span class="eyebrow">Mistakes: ${v.mistakes}</span></div>
  </div>`;
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { v.sel = +b.dataset.w; v.flash = null; sfx.click(); renderGame(); });
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    if (v.sel==null){ v.flash = null; renderGame(); return; }
    const d = +b.dataset.d;
    if (d===v.sel){ v.matched.push(d); v.sel = null; v.flash = null; sfx.right(); }
    else { v.mistakes++; v.flash = {w:v.sel, d}; v.sel = null; sfx.wrong(); }
    if (v.matched.length===v.pairs.length) return finishGame();
    renderGame();
  });
  $("#quit").onclick = () => go({page:"unit", unit:v.unit, lesson:0});
  clearInterval(window._gtick);
  window._gtick = setInterval(() => { const el = $("#gclock"); if (!el || view!==v){ clearInterval(window._gtick); return; } el.textContent = `${v.matched.length}/${v.pairs.length} matched · ${Math.round((Date.now()-v.t0)/1000)}s`; }, 1000);
}
function finishGame(){
  const v = view, n = v.pairs.length, p = pct(n, n+v.mistakes);
  const stars = v.mistakes===0?3:v.mistakes<=2?2:1;
  const r = { id:"g"+Date.now().toString(36), student, unit:v.unit, kind:"game", score:n, total:n, pct:p, stars, mistakes:v.mistakes, secs:Math.round((Date.now()-v.t0)/1000), at:new Date().toISOString() };
  const newBadges = recordResult(r);
  view = { page:"done", r, newBadges }; render(); window.scrollTo({top:0});
  if (stars>=2 || newBadges.length){ confetti(); sfx.star(); }
}

      <textarea id="rs" rows="3" placeholder="Paste a backup code here"></textarea>
      <div class="ctrl"><button class="btn small ghost" id="rsgo">Restore</button><span class="out" id="rsmsg"></span></div>
      <h3 class="keyh">Change PIN</h3>
      <div class="ctrl"><input id="newpin" type="password" inputmode="numeric" maxlength="4" aria-label="New PIN" style="width:90px"><button class="btn small ghost" id="pinsave">Save new PIN</button><span class="out" id="pinmsg"></span></div>
      <h3 class="keyh">Reset a student</h3>
      <div class="ctrl">${roster.map(n=>`<button class="btn small ghost" data-reset="${esc(n)}">Reset ${esc(n)}</button>`).join("") || "No students yet."}</div><p class="out" id="resetmsg"></p>`;
  }
  app.innerHTML = `
  <section class="hero" style="padding-bottom:6px"><span class="eyebrow">Parent area</span><h1>Scores, answers, and answer key</h1></section>
  <div class="nav ptabs" role="tablist">
    <button data-tab="scores" aria-current="${tab==="scores"}">Her answers</button>
    <button data-tab="key" aria-current="${tab==="key"}">Answer key</button>
    <button data-tab="manage" aria-current="${tab==="manage"}">Backup & settings</button>
  </div>
  <div class="pbody">${body}</div>
  <div class="ctrl" style="margin-top:22px"><button class="btn ghost small" id="lock">Lock parent area</button></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go({page:"parent", tab:b.dataset.tab, who}));
  app.querySelectorAll("[data-who]").forEach(b => b.onclick = () => go({page:"parent", tab:"scores", who:b.dataset.who}));
  app.querySelectorAll("[data-ku]").forEach(b => b.onclick = () => go({page:"parent", tab:"key", ku:b.dataset.ku}));
  $("#lock").onclick = () => { parentOK = false; go({page:"home"}); };
  if (tab==="manage"){
    const data = {v:1, roster, results, prog, inprog};
    let code = ""; try{ code = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }catch(e){}
    $("#bk").value = code;
    $("#bkcopy").onclick = () => { const ta = $("#bk");
      navigator.clipboard?.writeText(code).then(()=>{ $("#bkmsg").textContent = "Copied."; }, ()=>{ ta.select(); $("#bkmsg").textContent = "Selected. Press copy."; })
        ?? (ta.select(), $("#bkmsg").textContent = "Selected. Press copy."); };
    let armed = false;
    $("#rsgo").onclick = () => {
      let d; try{ d = JSON.parse(decodeURIComponent(escape(atob($("#rs").value.trim())))); }catch(e){ $("#rsmsg").textContent = "That code isn't a valid backup."; return; }
      if (!d || !Array.isArray(d.results)){ $("#rsmsg").textContent = "That code isn't a valid backup."; return; }
      if (!armed){ armed = true; $("#rsgo").textContent = "Yes, replace everything"; $("#rsmsg").textContent = "This replaces all scores on this device."; return; }
      roster = d.roster||[]; results = d.results; prog = d.prog||{}; inprog = d.inprog||{}; saveAll(); renderRoster();
      $("#rsmsg").textContent = "Restored."; armed = false; $("#rsgo").textContent = "Restore";
    };
    $("#pinsave").onclick = () => { const v = $("#newpin").value.trim(); if (!/^\d{4}$/.test(v)){ $("#pinmsg").textContent = "Use exactly 4 digits."; return; } pin = v; LS.set("g6-pin", pin); $("#pinmsg").textContent = "PIN changed."; $("#newpin").value=""; };
    app.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
      const n = b.dataset.reset;
      if (b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = `Yes, erase ${n}'s scores`; $("#resetmsg").textContent = `This erases all of ${n}'s scores, stars, and lesson checkmarks.`; return; }
      results = results.filter(r=>r.student!==n); delete prog[n]; delete inprog[n]; saveAll(); renderStarChip();
      $("#resetmsg").textContent = `${n}'s progress was reset.`; b.textContent = `Reset ${n}`; b.dataset.armed = "";
    });
  }
}

renderRoster();
render();
(async () => {
  const saved = await IDB.get();
  if (!saved) { IDB.put(snapshot()); return; }
  const localRes = LS.get("g6-results", []), savedRes = saved["g6-results"] ? JSON.parse(saved["g6-results"]) : [];
  const cnt = p => Object.values(p||{}).reduce((a,x)=>a+Object.keys((x&&x.done)||{}).length,0);
  const localDone = cnt(LS.get("g6-prog", {})), savedDone = saved["g6-prog"] ? cnt(JSON.parse(saved["g6-prog"])) : 0;
  if (savedRes.length > localRes.length || savedDone > localDone || (!roster.length && saved["g6-roster"])){
    try{ Object.entries(saved).forEach(([k,v]) => localStorage.setItem(k,v)); }catch(e){}
    const g = (k,d) => saved[k] ? JSON.parse(saved[k]) : d;
    roster = g("g6-roster",[]); results = g("g6-results",[]); prog = g("g6-prog",{}); inprog = g("g6-inprog",{});
    student = g("g6-student",""); pin = g("g6-pin",""); soundOn = g("g6-sound",true);
    renderRoster(); if (view.page !== "quiz" && view.page !== "game") render();
  } else IDB.put(snapshot());
})();
</script>

</body>
</html>
