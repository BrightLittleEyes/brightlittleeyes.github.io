<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math">
<meta name="theme-color" content="#2f7d6d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Trip Planner Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column; a fixed route map on top so every step is predictable */
:root {
  --bg: #eef3f1;
  --card: #ffffff;
  --ink: #23312d;
  --soft: #5c6e68;
  --line: #d3ded9;
  --accent: #2f7d6d;
  --accent-ink: #ffffff;
  --accent-wash: #dcefe9;
  --look: #b7791f;      /* "look again" — warm, never red */
  --look-wash: #fbf0dc;
  --road: #4a5753;
  --block: #7fb8a9;
  --g-rate: #2A7FBA; --g-num: #0E7C6B; --g-frac: #C2562D; --g-alg: #6B3FA0; --g-think: #C2446E;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151c1a; --card: #1f2926; --ink: #e5eeea; --soft: #a2b4ad; --line: #34433e;
  --accent: #6cc2ad; --accent-ink: #10201c; --accent-wash: #20372f;
  --look: #e5b35c; --look-wash: #3a3020; --road: #0e1412; --block: #4f9483;
  --g-rate: #6CB4E8; --g-num: #3FBFA8; --g-frac: #E57C52; --g-alg: #B48AE6; --g-think: #F08AAE; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151c1a; --card: #1f2926; --ink: #e5eeea; --soft: #a2b4ad; --line: #34433e;
  --accent: #6cc2ad; --accent-ink: #10201c; --accent-wash: #20372f;
  --look: #e5b35c; --look-wash: #3a3020; --road: #0e1412; --block: #4f9483;
  --g-rate: #6CB4E8; --g-num: #3FBFA8; --g-frac: #E57C52; --g-alg: #B48AE6; --g-think: #F08AAE; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--soft); margin: 4px 0 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.top .row { flex: 0 0 auto; }

/* route map */
.route { display: flex; align-items: flex-start; gap: 6px; list-style: none; padding: 0; margin: 0; }
.route li { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .8rem; color: var(--soft); text-align: center; }
.route .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--card);
  display: grid; place-items: center; font-weight: 600; font-size: .85rem; color: var(--soft); }
.route li.now .dot { border-color: var(--accent); color: var(--accent); }
.route li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.route li.now { color: var(--ink); font-weight: 500; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; }
.story { font-size: 1.1rem; }
.story b { color: var(--accent); }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); font-weight: 600; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
button {
  font: inherit; font-weight: 500; padding: 12px 16px; border-radius: 10px; cursor: pointer;
  border: 2px solid var(--accent); background: var(--card); color: var(--accent); transition: background .15s, color .15s;
}
button:hover:not(:disabled) { background: var(--accent-wash); }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
button.quiet { border-color: var(--line); color: var(--soft); }
button.picked { background: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--look); outline-offset: 2px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
input[type="number"] { font: inherit; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); min-width: 0; }

.note { border-radius: 10px; padding: 12px 14px; font-size: .98rem; }
.note.ok { background: var(--accent-wash); }
.note.look { background: var(--look-wash); border-left: 4px solid var(--look); }
.hint { background: var(--bg); border-radius: 10px; padding: 12px 14px; color: var(--soft); font-size: .95rem; }

/* home tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
.tile { --c: var(--accent); text-align: left; background: var(--card); color: var(--ink); border: 2px solid var(--c); border-radius: 8px;
  padding: 10px 12px 12px; display: grid; gap: 4px; align-content: start; font: inherit; cursor: pointer; transition: transform .15s, box-shadow .15s; }
button.tile:hover:not(:disabled) { background: var(--card); transform: translateY(-2px); box-shadow: 0 6px 14px -8px var(--c); }
.tile .sym { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--c); min-height: 1.9rem; display: flex; align-items: center; }
.tile .sym svg { width: 34px; height: 34px; }
.tile .nm { font-weight: 600; font-size: .95rem; line-height: 1.25; }
.tile .ct { font-size: .75rem; color: var(--soft); font-variant-numeric: tabular-nums; }
.tile.wide { grid-column: 1 / -1; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.tile.wide .sym svg { width: 46px; height: 46px; }
.tile.wide .nm { font-family: var(--font-display); font-size: 1.25rem; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.tiles.small .sym { font-size: 1.5rem; min-height: 1.5rem; }
.legend-g { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--soft); }
.legend-g span { display: inline-flex; align-items: center; gap: 6px; }
.legend-g i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }

/* home */
.home-pick { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 18px; }
.home-pick strong { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.home-pick span { font-weight: 400; color: var(--soft); font-size: .95rem; }
.home-pick:hover span { color: var(--ink); }

/* trip */
.road { background: var(--road); border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; }
.blk { background: var(--block); color: #10201c; border-radius: 6px; padding: 6px 8px; font-size: .78rem; font-weight: 600; min-width: 52px; text-align: center; animation: pop .25s ease; }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }
.meter { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.stats { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; font-weight: 500; flex-wrap: wrap; gap: 6px; }

/* order of operations */
.expr { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 18px 8px;
  background: var(--bg); border-radius: 12px; font-size: 1.9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.expr .num, .expr .par { padding: 2px 6px; border-radius: 8px; }
.expr .par { color: var(--soft); }
.expr .op { font-size: 1.6rem; padding: 4px 14px; min-width: 52px; line-height: 1.2; }
.expr .op.exp { align-self: flex-start; font-size: 1.5rem; min-width: 40px; padding: 0 8px; margin-left: -4px; }
.expr .in { background: var(--accent-wash); outline: 2px solid var(--accent); }
.expr .op.in { background: var(--accent); color: var(--accent-ink); }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rules li { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: .95rem; }
.rules .n { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: .85rem; flex: none; }
.rules .sym { font-weight: 600; min-width: 44px; font-size: 1.05rem; }
.rules li.lit { border-color: var(--look); background: var(--look-wash); }
.trail { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.trail li { padding: 6px 10px; border-left: 3px solid var(--line); color: var(--soft); }
.trail li:last-child { border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
.ask { font-size: 1.15rem; font-weight: 500; }

/* who's fastest */
.tbl-wrap { overflow-x: auto; }
table.rt { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.rt th, .rt td { border: 1px solid var(--line); padding: 10px 12px; text-align: center; }
.rt th { background: var(--bg); font-weight: 600; }
.rt th[scope="row"] { text-align: left; font-size: .92rem; }
.rt td { font-size: 1.15rem; }
.rt td.now { background: var(--accent-wash); outline: 2px solid var(--accent); outline-offset: -2px; }
.rt td.done { color: var(--accent); font-weight: 600; }
.rt tr.per th { color: var(--accent); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; }
.bar-row .who { font-weight: 600; }
.bar-track { display: flex; gap: 3px; flex-wrap: wrap; }
.bar-track i { width: 26px; height: 26px; border-radius: 6px; background: var(--block); display: grid; place-items: center;
  font-style: normal; font-size: .7rem; font-weight: 600; color: #10201c; }

/* help pip */
.pip { display: flex; gap: 12px; align-items: flex-start; }
.pip svg { flex: none; width: 56px; height: 56px; }
.bubble { background: var(--bg); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.work { display: flex; flex-direction: column; gap: 8px; }
.work .step { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); font-variant-numeric: tabular-nums; }
.work button.step { cursor: pointer; }
.work button.step:hover { border-color: var(--accent); background: var(--accent-wash); }
.work .step small { color: var(--soft); font-size: .8rem; font-weight: 500; }
.work .step b { font-size: 1.2rem; }
.work .step.fixed { border-color: var(--accent); background: var(--accent-wash); }

/* least common multiple */
.hgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; font-variant-numeric: tabular-nums; }
.hgrid span { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 6px; font-size: .78rem;
  color: var(--soft); background: var(--bg); border: 2px solid transparent; }
.hgrid .ga { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.hgrid .gb { border-color: var(--look); border-style: dashed; color: var(--ink); font-weight: 600; }
.hgrid .ga.gb { background: var(--accent); color: var(--accent-ink); border-style: solid; border-color: var(--look); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--soft); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 2px solid; }
.legend .la { background: var(--accent-wash); border-color: var(--accent); }
.legend .lb { border-color: var(--look); border-style: dashed; }
.legend .lab { background: var(--accent); border-color: var(--look); }
.hops { font-variant-numeric: tabular-nums; }
.hops b { color: var(--ink); }
.vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.vocab div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .92rem; }
.vocab strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }

/* solve & plot */
.eqn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; background: var(--bg); border-radius: 12px;
  font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.eqn .ln { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; width: 100%; max-width: 360px; }
.eqn .ln > :first-child { text-align: right; }
.eqn .ln.small { font-size: 1.15rem; color: var(--soft); font-weight: 500; }
.eqn em { font-style: italic; font-family: Georgia, "Times New Roman", serif; color: var(--accent); }
.eqn .add { color: var(--look); }
.nl-wrap { overflow-x: auto; }
.nl { width: 100%; min-width: 320px; height: auto; display: block; cursor: pointer; touch-action: manipulation; }

/* fill the table */
.unitchip { align-self: flex-start; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 14px; font-weight: 600; }
.tix { display: flex; flex-wrap: wrap; gap: 6px; }
.tix span { border: 2px dashed var(--accent); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .9rem; background: var(--accent-wash); }
.rt td.blank { color: var(--soft); }

/* decimal times */
.vmult { display: inline-grid; grid-template-columns: auto auto; gap: 2px 14px; align-self: center; background: var(--bg);
  border-radius: 12px; padding: 14px 20px; font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 600; }
.vmult span { text-align: right; letter-spacing: .12em; }
.vmult small { font-size: .85rem; font-weight: 500; color: var(--soft); align-self: center; letter-spacing: 0; text-align: left; }
.vmult .rule { grid-column: 1; border-top: 2px solid var(--ink); height: 0; }
.vmult .q { color: var(--look); }
.places { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 1.15rem; }
.places b { color: var(--accent); }

/* fraction times */
.fx { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 16px 8px;
  background: var(--bg); border-radius: 12px; font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.fr { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 1.6em; }
.fr .bar { align-self: stretch; border-top: 3px solid var(--ink); margin: 3px 0; }
.fr .q { color: var(--look); }
.fr.hi .t, .fr.hi .b { color: var(--accent); }
.factors { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.factors button { padding: 10px 0; font-size: 1.1rem; }

/* backup */
details.backup summary { cursor: pointer; font-weight: 600; color: var(--soft); }
details.backup[open] summary { color: var(--ink); }
details.backup textarea { font: .8rem/1.4 ui-monospace, Menlo, monospace; width: 100%; padding: 10px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); resize: vertical; min-width: 0; word-break: break-all; }

/* what does it mean */
.solved { font-size: 1.2rem; line-height: 2.1; }
.solved .sn { font-size: inherit; padding: 2px 12px; margin: 0 2px; line-height: 1.4; }

.break { text-align: center; padding: 40px 20px; }
.break h2 { font-size: 1.6rem; }
footer { color: var(--soft); font-size: .85rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { .blk { animation: none; } button, .meter span { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Math Planner</h1>
      <p class="sub" id="subtitle">You pick what to work on.</p>
    </div>
    <div class="row">
      <button class="quiet" id="homeBtn" type="button" hidden>Home</button>
      <button class="quiet" id="breakBtn" type="button">Take a break</button>
    </div>
  </div>

  <ol class="route" id="route" aria-label="Steps"></ol>

  <main id="stage"></main>

  <footer id="tally"></footer>
</div>

<script>
/* ---------- shared ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const stage = document.getElementById("stage");

const sections = {
  trip: { title: "Trip Planner", sub: "You're the planner. You pick the trip.", steps: ["Pick a trip", "Guess", "One hour", "Build it"] },
  ops:  { title: "Order of Operations", sub: "Solve it one step at a time, like a recipe.", steps: ["Pick a level", "Solve step by step", "Answer"] },
  rate: { title: "Who's Fastest?", sub: "Use a table to compare how fast people work.", steps: ["Pick a job", "Guess", "Time for one", "Compare"] },
  pip:  { title: "Help Pip", sub: "Pip the robot did some math. You're the teacher.", steps: ["Meet Pip", "Does it make sense?", "Find the step", "Fix it"] },
  lcm:  { title: "Least Common Multiple", sub: "Find the first number two counts share.", steps: ["Pick", "Guess", "Count", "Answer"] },
  eq:   { title: "Solve & Plot", sub: "Undo the step, keep it balanced, then find the spot on the line.", steps: ["Pick", "Undo it", "Solve", "Plot", "Check"] },
  tbl:  { title: "Fill the Table", sub: "Find the price for 1, then fill in every blank.", steps: ["Pick", "Price for 1", "Fill in", "Check"] },
  dec:  { title: "Decimal Times", sub: "Estimate, multiply without the dots, then put the dot back.", steps: ["Pick", "Estimate", "Multiply", "Dot", "Check"] },
  frac: { title: "Fraction Times", sub: "Estimate, multiply straight across, then simplify.", steps: ["Pick", "Estimate", "Multiply", "Simplify", "Check"] },
  est:  { title: "Round & Estimate", sub: "Round each number first, then add or subtract.", steps: ["Pick", "Round", "Estimate", "Check"] },
  mix:  { title: "Mixed Numbers", sub: "Switch between mixed numbers and improper fractions.", steps: ["Pick", "Wholes", "Pieces", "Check"] },
  fdp:  { title: "Fractions, Decimals & Percents", sub: "Change each one to a decimal, plot it, then compare.", steps: ["Pick", "Fraction", "Percent", "Plot", "Compare"] },
  area: { title: "Area", sub: "Same-size squares, in rows and columns.", steps: ["Pick", "Look", "Build", "Area", "Packs"] },
  mean: { title: "What Does It Mean?", sub: "The math is already done. You find what each number means.", steps: ["Pick a story", "Find the numbers", "Match the math"] }
};

let state = { section: null, step: 0, onBreak: false, solved: { trip: 0, ops: 0, rate: 0, pip: 0, mean: 0, lcm: 0, eq: 0, tbl: 0, dec: 0, frac: 0, est: 0, mix: 0, fdp: 0, area: 0 }, ar: null, arKind: "see", fd: null, fdKind: "mix", mx: null, mixMode: "toImp", es: null, esLevel: "ten", t: null, dc: null, fr: null, frLevel: "easy", lc: null, lcSize: "easy", e: null, eqLevel: "pos",
  p: null, size: "small", q: null, level: "easy", r: null, pp: null, m: null };
try { const s = JSON.parse(localStorage.getItem("mathPlanner")); if (s && s.solved) state.solved = Object.assign(state.solved, s.solved); } catch (e) {}
function save() { try { localStorage.setItem("mathPlanner", JSON.stringify({ solved: state.solved })); } catch (e) {} }

function setChrome() {
  const sec = sections[state.section];
  document.getElementById("title").textContent = sec ? sec.title : "Math Planner";
  document.getElementById("subtitle").textContent = sec ? sec.sub : "You pick what to work on.";
  document.getElementById("homeBtn").hidden = !sec;
  const route = document.getElementById("route");
  route.hidden = !sec;
  route.innerHTML = sec ? sec.steps.map((s, i) =>
    `<li class="${i < state.step ? "done" : i === state.step ? "now" : ""}"><span class="dot">${i + 1}</span>${s}</li>`).join("") : "";
  const n = sec ? state.solved[state.section] : Object.values(state.solved).reduce((a, b) => a + b, 0);
  document.getElementById("tally").textContent = n ? `Problems finished so far: ${n}` : "No timer. Go at your own speed.";
}

function render() {
  setChrome();
  stage.innerHTML = "";
  if (state.onBreak) return renderBreak();
  if (!state.section) return renderHome();
  if (state.section === "trip") return [tripPick, tripGuess, tripUnit, tripBuild][state.step]();
  if (state.section === "rate") return [ratePick, rateGuess, rateUnit, rateCompare][state.step]();
  if (state.section === "pip") return [pipMeet, pipSense, pipFind, pipFix][state.step]();
  if (state.section === "lcm") return [lcmPick, lcmGuess, lcmJump, lcmDone][state.step]();
  if (state.section === "eq") return [eqPick, eqUndo, eqSolve, eqPlot, eqCheck][state.step]();
  if (state.section === "tbl") return [tblPick, tblUnit, tblFill, tblCheck][state.step]();
  if (state.section === "dec") return [decPick, decEst, decMult, decDot, decCheck][state.step]();
  if (state.section === "frac") return [frPick, frEst, frMult, frSimp, frCheck][state.step]();
  if (state.section === "est") return [estPick, estRound, estAdd, estDone][state.step]();
  if (state.section === "mix") return [mixPick, mixStep1, mixStep2, mixDone][state.step]();
  if (state.section === "fdp") { if (state.step > 0 && !state.fd) state.fd = makeFdp(state.fdKind); return [fdpPick, fdpFrac, fdpPct, fdpPlot, fdpCompare][state.step](); }
  if (state.section === "area") return [arPick, arLook, arBuild, arArea, arPacks][state.step]();
  if (state.section === "mean") return [meanPick, meanTap, meanMath][state.step]();
  return [opsPick, opsSolve, opsDone][state.step]();
}

/* ---------- order of operations ---------- */
const HIGH = ["×", "÷"];
const levels = {
  easy:   { name: "Warm-up",     desc: "3 numbers with + and ×" },
  medium: { name: "Mix it up",   desc: "4 numbers with + − × ÷" },
  parens: { name: "Parentheses", desc: "Problems with ( )" },
  exp:    { name: "Exponents",   desc: "Small raised numbers like 3²" }
};
const SUPD = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const sup = n => String(n).split("").map(d => SUPD[d]).join("");
const opText = (a, op, b) => op === "^" ? `${a}${sup(b)}` : `${a} ${op} ${b}`;
const timesItself = (a, b) => Array.from({ length: b }, () => a).join(" × ");

const N = v => ({ t: "n", v }), O = v => ({ t: "op", v });
const P1 = { t: "(" }, P2 = { t: ")" };

function scopeOf(toks) {
  const o = toks.findIndex(x => x.t === "(");
  if (o < 0) return [0, toks.length - 1, false];
  const c = toks.findIndex(x => x.t === ")");
  return [o + 1, c - 1, true];
}
function nextOp(toks) {
  const [lo, hi] = scopeOf(toks);
  for (let i = lo; i <= hi; i++) if (toks[i].t === "op" && toks[i].v === "^") return i;
  for (let i = lo; i <= hi; i++) if (toks[i].t === "op" && HIGH.includes(toks[i].v)) return i;
  for (let i = lo; i <= hi; i++) if (toks[i].t === "op") return i;
  return -1;
}
function calc(a, op, b) {
  if (op === "+") return a + b;
  if (op === "−") return a - b;
  if (op === "×") return a * b;
  if (op === "^") return a ** b;
  if (b === 0 || a % b !== 0) return NaN;
  return a / b;
}
function applyOp(toks, i) {
  const r = calc(toks[i - 1].v, toks[i].v, toks[i + 1].v);
  let out = [...toks.slice(0, i - 1), N(r), ...toks.slice(i + 2)];
  for (let j = 0; j < out.length - 2; j++)
    if (out[j].t === "(" && out[j + 1].t === "n" && out[j + 2].t === ")") out = [...out.slice(0, j), out[j + 1], ...out.slice(j + 3)];
  return out;
}
function exprText(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const x = toks[i];
    if (x.t === "op" && x.v === "^") { out[out.length - 1] += sup(toks[i + 1].v); i++; continue; }
    out.push(x.t === "n" ? String(x.v) : x.t === "op" ? x.v : x.t);
  }
  return out.join(" ").replace(/\( /g, "(").replace(/ \)/g, ")");
}
function valid(toks) {
  let t = toks;
  const lim = toks.some(x => x.v === "^") ? 100 : 99;
  while (t.length > 1) {
    const i = nextOp(t);
    const a = t[i - 1].v, op = t[i].v, b = t[i + 1].v, r = calc(a, op, b);
    if (!Number.isInteger(r) || r < 1 || r > lim) return false;
    if (op === "^" && (a === 1 || b < 2 || b > 3 || (b === 3 && a > 5))) return false;
    if (HIGH.includes(op) && (a === 1 || b === 1 || a === b && op === "÷")) return false;
    t = applyOp(t, i);
  }
  return true;
}
function genExpr(level) {
  const n = () => rint(1, 9), any = () => pick(["+", "−", "×", "÷"]);
  for (let tries = 0; tries < 4000; tries++) {
    let toks;
    if (level === "easy") {
      const ops = pick([["+", "×"], ["−", "×"], ["+", "×"], ["×", "+"]]);
      toks = [N(n()), O(ops[0]), N(n()), O(ops[1]), N(n())];
      if (nextOp(toks) === 1 && Math.random() < .7) continue; // mostly problems where left-to-right would trick you
    } else if (level === "medium") {
      const ops = [any(), any(), any()];
      if (!ops.some(o => HIGH.includes(o)) || ops.every(o => HIGH.includes(o))) continue;
      toks = [N(n()), O(ops[0]), N(n()), O(ops[1]), N(n()), O(ops[2]), N(n())];
    } else if (level === "exp") {
      const e = () => pick([2, 2, 2, 3]), lowOp = () => pick(["+", "−", "×"]);
      toks = pick([
        [N(n()), O("^"), N(e()), O(lowOp()), N(n())],
        [N(n()), O(lowOp()), N(n()), O("^"), N(e())],
        [N(n()), O("+"), N(n()), O("×"), N(n()), O("^"), N(2)],
        [N(n()), O("^"), N(2), O("−"), N(n()), O("×"), N(n())],
        [P1, N(n()), O(pick(["+", "−"])), N(n()), P2, O("^"), N(2)],
        [N(n()), O("×"), P1, N(n()), O("−"), N(n()), P2, O("^"), N(2)]
      ]);
    } else {
      const inner = pick(["+", "−"]), outer = pick(["×", "×", "÷"]), extra = pick(["+", "−", "×"]);
      toks = pick([
        [P1, N(n()), O(inner), N(n()), P2, O(outer), N(n())],
        [N(n()), O(outer), P1, N(n()), O(inner), N(n()), P2],
        [P1, N(n()), O(inner), N(n()), P2, O(outer), N(n()), O(extra), N(n())],
        [N(n()), O(extra), N(n()), O("×"), P1, N(n()), O(inner), N(n()), P2]
      ]);
    }
    if (valid(toks)) return toks;
  }
  return [N(2), O("+"), N(3), O("×"), N(4)];
}

function opsPick() {
  const c = el(`<section class="card">
    <h2>Pick a level</h2>
    <p class="sub">You can change levels any time.</p>
    <div class="choices" id="lv"></div>
  </section>`);
  stage.appendChild(c);
  Object.entries(levels).forEach(([k, v]) => {
    const b = el(`<button class="home-pick" type="button"><strong>${v.name}</strong><span>${v.desc}</span></button>`);
    b.onclick = () => { state.level = k; startOps(); };
    c.querySelector("#lv").appendChild(b);
  });
}
function startOps() {
  const toks = genExpr(state.level);
  state.q = { start: toks, toks, trail: [exprText(toks)], phase: "tap", sel: -1, note: "", hintLvl: 0 };
  state.step = 1; render();
}

function computeHint(a, op, b, lvl) {
  if (op === "^") {
    if (!lvl) return `${a}${sup(b)} means ${a} times itself ${b} times: ${timesItself(a, b)}.`;
    return b === 2 ? `${a} × ${a}: count by ${a}s, ${a} times: ${Array.from({ length: a }, (_, i) => a * (i + 1)).join(", ")}.`
      : `Do it in two steps. First ${a} × ${a} = ${a * a}. Then ${a * a} × ${a}.`;
  }
  if (op === "+") return lvl ? `${a}, then count up: ${Array.from({ length: b }, (_, i) => a + i + 1).join(", ")}.` : `Start at ${a} and count up ${b}.`;
  if (op === "−") return lvl ? `${a}, then count back: ${Array.from({ length: b }, (_, i) => a - i - 1).join(", ")}.` : `Start at ${a} and count back ${b}.`;
  if (op === "×") return lvl ? `Count by ${b}s: ${Array.from({ length: a }, (_, i) => b * (i + 1)).join(", ")}.` : `${a} groups of ${b}. Count by ${b}s, ${a} times.`;
  return lvl ? `Count by ${b}s until you reach ${a}: ${Array.from({ length: a / b }, (_, i) => b * (i + 1)).join(", ")}. How many jumps?` : `How many ${b}s fit into ${a}? Think: ${b} × ? = ${a}.`;
}

function opsSolve() {
  const q = state.q, right = nextOp(q.toks), [lo, hi, hasP] = scopeOf(q.toks);
  const scopeHasHigh = q.toks.slice(lo, hi + 1).some(x => x.t === "op" && HIGH.includes(x.v));
  const scopeHasExp = q.toks.slice(lo, hi + 1).some(x => x.t === "op" && x.v === "^");
  const ruleNow = hasP ? 0 : scopeHasExp ? 1 : scopeHasHigh ? 2 : 3;

  const c = el(`<section class="card">
    <span class="label">${levels[state.level].name}</span>
    <h2 id="ask">${q.phase === "tap" ? "Which part goes first? Tap that sign." : ""}</h2>
    <div class="expr" id="expr" aria-label="Math problem"></div>
    <div id="work"></div>
    <div id="fb">${q.note}</div>
    <ol class="rules" id="rules" aria-label="The order">
      <li><span class="n">1</span><span class="sym">( )</span>Inside parentheses first</li>
      <li><span class="n">2</span><span class="sym">x²</span>Exponents, the small raised numbers</li>
      <li><span class="n">3</span><span class="sym">× ÷</span>Times and divide, left to right</li>
      <li><span class="n">4</span><span class="sym">+ −</span>Plus and minus, left to right</li>
    </ol>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div><span class="label">Your work</span><ul class="trail" id="trail"></ul></div>
  </section>`);
  stage.appendChild(c);

  const ex = c.querySelector("#expr");
  q.toks.forEach((tk, i) => {
    if (i > 0 && q.toks[i - 1].t === "op" && q.toks[i - 1].v === "^") return; // exponent number is drawn inside its button
    const inSel = q.phase === "compute" && i >= q.sel - 1 && i <= q.sel + 1;
    if (tk.t === "op") {
      const isExp = tk.v === "^", label = isExp ? `exponent ${q.toks[i + 1].v}` : tk.v;
      const b = el(`<button class="op${isExp ? " exp" : ""}${inSel ? " in" : ""}" type="button" aria-label="${label}">${isExp ? sup(q.toks[i + 1].v) : tk.v}</button>`);
      if (q.phase === "tap") b.onclick = () => tapOp(i); else b.disabled = !inSel;
      ex.appendChild(b);
    } else {
      ex.appendChild(el(`<span class="${tk.t === "n" ? "num" : "par"}${inSel ? " in" : ""}">${tk.t === "n" ? tk.v : tk.t}</span>`));
    }
  });
  c.querySelector("#trail").innerHTML = q.trail.map(t => `<li>${t}</li>`).join("");

  function tapOp(i) {
    const fb = c.querySelector("#fb");
    if (i === right) { q.phase = "compute"; q.sel = i; q.note = ""; q.hintLvl = 0; render(); return; }
    const tk = q.toks[i];
    const outside = hasP && (i < lo || i > hi);
    let msg;
    if (outside) msg = `Let's look for the ( ) first. Parentheses go before everything else, so start inside them.`;
    else if (tk.v !== "^" && scopeHasExp) msg = `There's an exponent here, the small raised number. Exponents go before × ÷ + −. Tap the small number.`;
    else if (!HIGH.includes(tk.v) && scopeHasHigh) msg = `There's a × or ÷ here too. Those go before + and −. Find it and tap it.`;
    else msg = `Those signs are on the same step, so we go left to right. Pick the one closer to the left.`;
    fb.innerHTML = `<div class="note look">${msg}</div>`;
  }

  if (q.phase === "compute") {
    const a = q.toks[q.sel - 1].v, op = q.toks[q.sel].v, b = q.toks[q.sel + 1].v, ans = calc(a, op, b);
    c.querySelector("#ask").textContent = "Good pick. Now solve just that part.";
    const work = c.querySelector("#work");
    work.appendChild(el(`<div class="row" style="align-items:center">
      <span class="ask">${opText(a, op, b)} =</span>
      <input type="number" id="ans" inputmode="numeric" aria-label="Answer for ${opText(a, op, b)}">
      <button class="primary" id="chk" type="button">Check</button>
    </div>`));
    const input = work.querySelector("#ans");
    const check = () => {
      const fb = c.querySelector("#fb");
      if (!input.value) { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
      if (Number(input.value) === ans) {
        q.toks = applyOp(q.toks, q.sel);
        q.trail.push(exprText(q.toks));
        q.note = `<div class="note ok">${opText(a, op, b)} = ${op === "^" ? timesItself(a, b) + " = " : ""}${ans}. That part is done.</div>`;
        q.phase = "tap"; q.sel = -1;
        if (q.toks.length === 1) { state.step = 2; }
        render();
      } else if (op === "^" && Number(input.value) === a * b) {
        fb.innerHTML = `<div class="note look">Careful, this one is sneaky. ${opText(a, op, b)} is not ${a} × ${b}. The small ${b} means multiply ${a} by itself ${b} times: ${timesItself(a, b)}.</div>`;
      } else {
        fb.innerHTML = `<div class="note look">Let's check that one together. ${computeHint(a, op, b, 0)}</div>`;
      }
    };
    work.querySelector("#chk").onclick = check;
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    input.focus();
    c.querySelector("#hintBtn").onclick = e => {
      c.querySelector("#hint").innerHTML = `<div class="hint">${computeHint(a, op, b, q.hintLvl)}</div>`;
      q.hintLvl++; if (q.hintLvl > 1) e.target.disabled = true;
    };
  } else {
    c.querySelector("#hintBtn").onclick = () => {
      c.querySelectorAll("#rules li").forEach((li, k) => li.classList.toggle("lit", k === ruleNow));
      const tips = [
        "There are ( ) in this problem. Look inside them first.",
        "Is there a small raised number? That's an exponent. Exponents go before × ÷ + −.",
        "Is there a × or ÷? Those go before + and −. If there are two, start on the left.",
        "Only + and − are left. Go from left to right."
      ];
      c.querySelector("#hint").innerHTML = `<div class="hint">${tips[ruleNow]}</div>`;
    };
  }
}

function opsDone() {
  const q = state.q;
  const c = el(`<section class="card">
    <span class="label">${levels[state.level].name}</span>
    <h2>The answer is ${q.toks[0].v}.</h2>
    <p>You solved it in ${q.trail.length - 1} steps, one piece at a time.</p>
    <div><span class="label">Your work</span><ul class="trail">${q.trail.map(t => `<li>${t}</li>`).join("")}</ul></div>
    <div class="row">

      <button id="lvl" type="button">Pick a different level</button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#again").onclick = () => { state.solved.ops++; save(); startOps(); };
  c.querySelector("#lvl").onclick = () => { state.solved.ops++; save(); state.step = 0; render(); };
}

function makeRate(modeKey) {
  const mode = rateModes[modeKey], job = pick(mode.jobs), names = mode.names(), [lo, hi] = mode.perRange;
  for (let tries = 0; tries < 3000; tries++) {
    const per = [rint(lo, hi), rint(lo, hi), rint(lo, hi)];
    if (new Set(per).size < 3) continue;
    const K = mode.trapKey === "K" ? [rint(3, 10), rint(3, 10), rint(3, 10)] : [rint(2, 8), rint(2, 8), rint(2, 8)];
    if (new Set(K).size < 3) continue;
    const W = per.map((x, i) => x * K[i]);
    if (W.some(w => w > 72) || new Set(W).size < 3) continue;
    const win = mode.better === "low" ? per.indexOf(Math.min(...per)) : per.indexOf(Math.max(...per));
    const trapVals = mode.trapKey === "K" ? K : W, trapIdx = trapVals.indexOf(Math.max(...trapVals));
    if (trapIdx === win) continue;          // keep the "biggest isn't best" trap
    const people = names.map((n, i) => ({ name: n, per: per[i], K: K[i], W: W[i], found: false }));
    return { modeKey, mode, job, people, fastest: win, mostMade: trapIdx, guess: null, cur: 0, intro: mode.intro(job) };
  }
}

function rateTable(r, opts = {}) {
  const { mode, job, people } = r;
  const perRow = opts.perRow ? `<tr class="per"><th scope="row">${mode.perLabel(job)}</th>${people.map((p, i) =>
    `<td class="${p.found ? "done" : i === r.cur && opts.live ? "now" : ""}">${p.found ? p.per : "?"}</td>`).join("")}</tr>` : "";
  return `<div class="tbl-wrap"><table class="rt">
    <tr><th></th>${people.map(p => `<th scope="col">${p.name}</th>`).join("")}</tr>
    ${mode.rows(job).map(([label, key]) => `<tr><th scope="row">${label}</th>${people.map(p => `<td>${p[key]}</td>`).join("")}</tr>`).join("")}
    ${perRow}
  </table></div>`;
}

function rateUnit() {
  const r = state.r, m = r.mode, p = r.people[r.cur], j = r.job, fW = n => m.fW(n, j);

  ];

    }
  };
  c.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  input.focus();
}

      fb.innerHTML = `<div class="note ok">${m.win(f, j)}<br><br>${guessLine}${most !== f ? `<br><br>${m.trap(most, j)}` : ""}</div>`;
      const row = el(`<div class="row" style="margin-top:10px"></div>`);

      row.append(again, other); fb.appendChild(row);

    c.querySelector("#pick").appendChild(b);
  });
}

const pipSay = t => `<div class="pip">${pipFace}<div class="bubble">${t}</div></div>`;
const pipPeople = ["Maya", "Leo", "Grandpa Joe", "Aunt Rosa", "Christine", "Frank", "Omar", "Jessica"];
const fx = (t, b) => `${t}/${b}`;

/* Each topic makes one problem: Pip's work, where it went wrong (or -1 if Pip is right), and what to say. */
const PIP_TOPICS = {
  trip: { label: "Road trips", sym: "mph", make() {
    const who = pick(pipPeople), r = pick([45, 50, 55, 60, 65]), t1 = rint(2, 7), t2 = rint(t1 + 2, t1 + 8), d1 = r * t1, d2 = r * t2;
    const kind = pick(["right", "B", "B", "A"]), H = d2 * r, days = Math.round(H / 24), fast = d1 * t1;
    const good = [{ label: "Step 1: Miles in 1 hour", math: `${d1} ÷ ${t1} = ${r}` }, { label: `Step 2: Hours for ${d2} miles`, math: `${d2} ÷ ${r} = ${t2}` }];
    const steps = good.map(x => ({ ...x }));
    if (kind === "A") { steps[0].math = `${d1} × ${t1} = ${fast}`; steps[1].math = `${d2} ÷ ${fast} = ... ?`; }
    if (kind === "B") steps[1].math = `${d2} × ${r} = ${H}`;
    const w = kind === "A" ? 0 : kind === "B" ? 1 : -1;
    return { q: `${who} drove <b>${d1} miles</b> in <b>${t1} hours</b>. At the same speed, how long will a <b>${d2}-mile</b> trip take?`,
      good, steps, wrong: w,
      claim: kind === "A" ? `I think the car goes <b>${fast} miles in 1 hour</b>. Then I got stuck.` : `I think the trip takes <b>${kind === "B" ? H : t2} hours</b>.`,
      offRight: kind === "A" ? `Good eye. ${fast} miles in 1 hour is faster than a jet plane! A car can't go that fast.` : `Good eye. ${H} hours is about ${days} days in the car! Their legs would fall asleep.`,
      yesWrong: kind === "A" ? `Hmm, Pip says the car goes ${fast} miles in just 1 hour. A jet plane goes about 500. Could a car go that fast?` : `Hmm, ${H} hours. A day has 24 hours, so that's about ${days} days of driving! Does that fit a trip just a bit longer than the first one?`,
      yesRight: `You checked it. The new trip is longer, so it should take more than ${t1} hours, and ${t2} is more. Also ${r} × ${t2} = ${d2}. It fits.`,
      offWrong: `Let's check together. The new trip is longer, so it should take more than ${t1} hours. Pip says ${t2}. And ${r} × ${t2} = ${d2}. Does that fit?`,
      stepOk: i => i === 0 ? `Let's check Step 1: ${r} × ${t1} = ${d1}. That matches the story, so Step 1 works.` : `Step 2 got stuck because of the number from Step 1. Look at the step before it.`,
      fixQ: w === 0 ? `I multiplied in Step 1. What should I do instead to find the miles in just 1 hour?` : `I multiplied in Step 2. What should I do instead to find how many ${r}-mile hours fit in ${d2} miles?`,
      fixes: [["Divide ÷", true], ["Multiply ×", false, "That's what Pip tried, and it made the giant number. Which sign splits things into equal pieces?"], ["Add +", false, "Adding makes it a little bigger. Which sign splits things into equal pieces?"]],
      fixed: `<b>${t2} hours.</b> Dividing splits the miles into equal hour-pieces. ${t2} hours is more than ${t1}, so it fits.` };
  } },

  mixed: { label: "Mixed numbers", sym: "4⅝", make() {
    const d = pick([3, 4, 5, 6, 7, 8]), w = rint(2, 6), n = rint(1, d - 1), N = w * d + n, bad = w * n + 0, right = Math.random() < .25;
    const good = [{ label: `Step 1: Pieces in ${w} wholes`, math: `${w} × ${d} = ${w * d}` }, { label: "Step 2: Add the extra pieces", math: `${w * d} + ${n} = ${N}` }];
    const steps = right ? good.map(x => ({ ...x })) : [{ label: `Step 1: Pieces in ${w} wholes`, math: `${w} × ${n} = ${bad}` }, { label: "Step 2: Add the extra pieces", math: `${bad} + ${n} = ${bad + n}` }];
    const pipAns = right ? N : bad + n, pipW = +(pipAns / d).toFixed(1);
    return { q: `Write <b>${w} ${n}/${d}</b> as an improper fraction.`, good, steps, wrong: right ? -1 : 0,
      claim: `I think ${w} ${n}/${d} = <b>${pipAns}/${d}</b>.`,
      offRight: `Good eye. ${w} ${n}/${d} is about ${+(N / d).toFixed(1)} wholes. But ${pipAns}/${d} is only about ${pipW} wholes. Some pieces went missing!`,
      yesWrong: `Let's check the size. ${w} ${n}/${d} is about ${+(N / d).toFixed(1)} wholes. ${pipAns}/${d} is only about ${pipW} wholes. Does that match?`,
      yesRight: `You checked it. ${N} ÷ ${d} = ${w} with ${n} left over. That's ${w} ${n}/${d}. It matches.`,
      offWrong: `Let's check together. ${N} ÷ ${d} = ${w} with ${n} left over. That's ${w} ${n}/${d}. Does it match?`,
      stepOk: i => `Step 2 adds the extra pieces, and that part is fine. The number coming into it is the problem. Look at the step before it.`,
      fixQ: `In Step 1 I did ${w} × ${n}. Each whole is cut into ${d} pieces. What should I multiply by?`,
      fixes: [[`${w} × ${d}, the bottom number`, true], [`${w} × ${n}, the top number`, false, `That's what Pip did. The top number is the extra pieces. How many pieces are in each whole?`], [`${w} + ${n}`, false, `Adding doesn't count the pieces in the wholes. Each whole has ${d} pieces.`]],
      fixed: `<b>${N}/${d}.</b> ${w} wholes × ${d} pieces = ${w * d}, plus ${n} extra = ${N}. The bottom stays ${d}.` };
  } },

  frac: { label: "Squared fractions", sym: "(½)²", make() {
    const a = pick([3, 5, 7, 9]), b = 2, right = Math.random() < .25, N = a * a;
    const good = [{ label: "Step 1: Top", math: `${a} × ${a} = ${N}` }, { label: "Step 2: Bottom", math: `${b} × ${b} = ${b * b}` }];
    const steps = right ? good.map(x => ({ ...x })) : [{ label: "Step 1: Top", math: `${a} × 2 = ${a * 2}` }, { label: "Step 2: Bottom", math: `${b} × ${b} = ${b * b}` }];
    const pip = right ? N : a * 2;
    return { q: `Evaluate <b>(${a}/${b})²</b>. Write your answer as a fraction.`, good, steps, wrong: right ? -1 : 0,
      claim: `I think (${a}/${b})² = <b>${pip}/${b * b}</b>.`,
      offRight: `Good eye. ${pip}/${b * b} is the same size as ${a}/${b}. But squaring a number bigger than 1 should make it bigger!`,
      yesWrong: `Hmm, let's check the size. ${pip}/${b * b} simplifies to ${a}/${b}. That's the same as before squaring. Squaring something bigger than 1 should make it grow. Does it?`,
      yesRight: `You checked it. (${a}/${b})² means ${a}/${b} × ${a}/${b}: ${a} × ${a} = ${N} on top, ${b} × ${b} = ${b * b} on the bottom.`,
      offWrong: `Let's check together. (${a}/${b})² means ${a}/${b} × ${a}/${b}. Top: ${a} × ${a} = ${N}. Bottom: ${b} × ${b} = ${b * b}. Does that match Pip?`,
      stepOk: i => `Let's check Step 2: ${b} × ${b} = ${b * b}. The bottom used ${b} two times. That works.`,
      fixQ: `In Step 1 I did ${a} × 2. The little 2 means use ${a}/${b} two times. What should the top be?`,
      fixes: [[`${a} × ${a}`, true], [`${a} × 2`, false, `That's what Pip did. The little 2 counts how many times to use the number. Use ${a} two times.`], [`${a} + ${a}`, false, `That adds ${a} two times. The fraction is being multiplied by itself.`]],
      fixed: `<b>${N}/${b * b}.</b> (${a}/${b})² = ${a}/${b} × ${a}/${b} = ${N}/${b * b}. It's bigger than ${a}/${b}, so it fits.` };
  } },

  lcm: { label: "Cookie sales", sym: "LCM", make() {
    const [x, y] = pick([[6, 8], [4, 6], [6, 9], [8, 12], [6, 10], [9, 12], [10, 15], [4, 10]]), L = x * y / gcd(x, y), P = x * y, right = Math.random() < .25;
    const [A, B] = threeOf(pipPeople);
    const listX = Array.from({ length: L / x }, (_, i) => x * (i + 1)).join(", "), listY = Array.from({ length: L / y }, (_, i) => y * (i + 1)).join(", ");
    const good = [{ label: "Step 1: Smallest amount they share", math: `${A}: ${listX}  ·  ${B}: ${listY}` }, { label: `Step 2: ${A}'s boxes`, math: `$${L} ÷ $${x} = ${L / x}` }, { label: `Step 3: ${B}'s boxes`, math: `$${L} ÷ $${y} = ${L / y}` }];
    const steps = right ? good.map(s => ({ ...s })) : [{ label: "Step 1: Smallest amount they share", math: `${x} × ${y} = ${P}` }, { label: `Step 2: ${A}'s boxes`, math: `$${P} ÷ $${x} = ${y}` }, { label: `Step 3: ${B}'s boxes`, math: `$${P} ÷ $${y} = ${x}` }];
    return { q: `${A} sells boxes of cookies for <b>$${x}</b> each. ${B} sells them for <b>$${y}</b> each. They each sold the same dollar amount, the smallest amount possible. How much, and how many boxes each?`,
      good, steps, wrong: right ? -1 : 0,
      claim: `I think they each sold <b>$${right ? L : P}</b>.`,
      offRight: `Good eye. They both do reach $${P}. But the problem asks for the <i>smallest</i> amount. Is there a smaller one they share?`,
      yesWrong: `Let's check. ${A}'s totals go ${listX}. ${B}'s totals go ${listY}. Do they meet before $${P}?`,
      yesRight: `You checked it. ${A}'s totals: ${listX}. ${B}'s totals: ${listY}. They meet first at $${L}.`,
      offWrong: `Let's check together. ${A}'s totals: ${listX}. ${B}'s totals: ${listY}. Where do they meet first?`,
      stepOk: i => `Step ${i + 1} divides correctly. The trouble is the number it started with. Look at the first step.`,
      fixQ: `In Step 1 I just multiplied ${x} × ${y}. How should I find the smallest amount they share?`,
      fixes: [["Count up each list until they match", true], [`Multiply ${x} × ${y} again`, false, `That's what Pip did. It gives an amount they share, but not always the smallest.`], [`Add ${x} + ${y}`, false, `Let's test it: ${x + y} isn't on ${A}'s list, so it can't work.`]],
      fixed: `<b>$${L}.</b> ${A} sold ${L / x} boxes and ${B} sold ${L / y} boxes. ${L / x} × $${x} = $${L} and ${L / y} × $${y} = $${L}.` };
  } },

  eq: { label: "Equations", sym: "x=", make() {
    let aC; do { aC = rint(101, 799); } while (aC % 10 === 0);
    const cC = rint(Math.ceil((aC + 20) / 10), 99) * 10, sC = cC + aC, right = Math.random() < .25;
    const a = (aC / 100).toFixed(2), c = String(cC / 100), s2 = (sC / 100).toFixed(2).replace(/0$/, ""), bad = ((cC - aC) / 100).toFixed(2);
    const good = [{ label: "Step 1: Undo − " + a, math: `Add ${a} to both sides` }, { label: "Step 2: Work it out", math: `${c} + ${a} = ${s2}` }];
    const steps = right ? good.map(x => ({ ...x })) : [{ label: "Step 1: Undo − " + a, math: `Subtract ${a} from both sides` }, { label: "Step 2: Work it out", math: `${c} − ${a} = ${bad}` }];
    const pip = right ? s2 : bad, check = ((Math.round(Number(pip) * 100) - aC) / 100).toFixed(2).replace("-", "−");
    return { q: `Solve for <i>x</i>: <b>x − ${a} = ${c}</b>`, good, steps, wrong: right ? -1 : 0,
      claim: `I think <b>x = ${pip}</b>.`,
      offRight: `Good eye. Put ${pip} back in: ${pip} − ${a} = ${check}. That's not ${c}, so it doesn't balance.`,
      yesWrong: `Let's test it. Put ${pip} in for x: ${pip} − ${a} = ${check}. Is that ${c}?`,
      yesRight: `You checked it. ${s2} − ${a} = ${c}. Both sides balance.`,
      offWrong: `Let's test it together: ${s2} − ${a} = ? Is it ${c}?`,
      stepOk: i => `Step 2 does its math right. The trouble is the plan from Step 1. Look at the step before it.`,
      fixQ: `In Step 1 I subtracted ${a}. But x already has ${a} taken away. What undoes taking away?`,
      fixes: [[`Add ${a} to both sides`, true], [`Subtract ${a} again`, false, `That takes away even more, so x gets more stuck.`], [`Multiply both sides by ${a}`, false, `Multiplying undoes dividing. Here ${a} is being taken away.`]],
      fixed: `<b>x = ${s2}.</b> ${c} + ${a} = ${s2}. Check: ${s2} − ${a} = ${c}. It balances.` };
  } },

  ops: { label: "Order of operations", sym: "( )", make() {
    const x = rint(2, 9), y = rint(2, 6), z = rint(2, 6), right = Math.random() < .25, good1 = y * z, ans = x + good1, bad1 = x + y, badAns = bad1 * z;
    const good = [{ label: "Step 1: Times first", math: `${y} × ${z} = ${good1}` }, { label: "Step 2: Then plus", math: `${x} + ${good1} = ${ans}` }];
    const steps = right ? good.map(s => ({ ...s })) : [{ label: "Step 1: Left to right", math: `${x} + ${y} = ${bad1}` }, { label: "Step 2", math: `${bad1} × ${z} = ${badAns}` }];
    return { q: `Solve: <b>${x} + ${y} × ${z}</b>`, good, steps, wrong: right ? -1 : 0,
      claim: `I think ${x} + ${y} × ${z} = <b>${right ? ans : badAns}</b>.`,
      offRight: `Good eye. Pip went straight left to right. But there's a × in there, and × goes before +.`,
      yesWrong: `Let's check the order rules. Is there a × in the problem? Which goes first, × or +?`,
      yesRight: `You checked it. × goes before +, so ${y} × ${z} = ${good1} first, then ${x} + ${good1} = ${ans}.`,
      offWrong: `Let's check together. Pip did ${y} × ${z} first, then added ${x}. Does that follow the order rules?`,
      stepOk: i => `Step 2 does its math right. The trouble is which part went first. Look at Step 1.`,
      fixQ: `In Step 1 I added first. Which part should go first?`,
      fixes: [[`${y} × ${z} first`, true], [`${x} + ${y} first`, false, `That's what Pip did. Check the rules: × and ÷ come before + and −.`], [`Whatever is on the left`, false, `Left to right only works when the signs are on the same step. × is a step before +.`]],
      fixed: `<b>${ans}.</b> ${y} × ${z} = ${good1} first, then ${x} + ${good1} = ${ans}.` };
  } },

  pct: { label: "Percents", sym: "%", make() {
    if (Math.random() < .5) return PIP_TOPICS.pct.compare();
    const p = rint(21, 95), right = Math.random() < .25, d = (p / 100).toFixed(2).replace(/0$/, ""), bad = String(p / 10);
    const good = [{ label: "Step 1: What percent means", math: `${p}% = ${p}/100` }, { label: "Step 2: Divide by 100", math: `Move the point 2 places: ${p} → ${d}` }];
    const steps = right ? good.map(s => ({ ...s })) : [{ label: "Step 1: What percent means", math: `${p}% = ${p}/100` }, { label: "Step 2: Divide by 100", math: `Move the point 1 place: ${p} → ${bad}` }];
    return { q: `Write <b>${p}%</b> as a decimal.`, good, steps, wrong: right ? -1 : 0,
      claim: `I think ${p}% = <b>${right ? d : bad}</b>.`,
      offRight: `Good eye. ${bad} is more than ${Math.floor(p / 10)} whole things! But ${p}% is only part of one whole.`,
      yesWrong: `Let's check the size. ${p}% is less than 100%, so it's less than 1 whole. Is ${bad} less than 1?`,
      yesRight: `You checked it. ${p}% is less than 1 whole, and ${d} is less than 1. ${p} hundredths = ${d}.`,
      offWrong: `Let's check together. ${p}% means ${p} out of 100, which is ${p} hundredths. Is ${d} the same as ${p} hundredths?`,
      stepOk: i => `Step 1 is right: percent means out of 100. Look at the next step.`,
      fixQ: `In Step 2 I moved the decimal point 1 place. Dividing by 100 moves it how many places?`,
      fixes: [["2 places, because 100 has two zeros", true], ["1 place", false, "That's what Pip did. 1 place is dividing by 10."], ["3 places", false, "3 places would be dividing by 1,000."]],
      fixed: `<b>${d}.</b> ${p}% = ${p}/100 = ${d}. It's less than 1, so it fits.` };
  }, compare() {
    let a, b, pc;
    for (let t = 0; t < 500; t++) { b = pick([4, 5, 5, 10]); a = rint(1, b - 1); pc = rint(3, 18) * 5; if (gcd(a, b) === 1 && a * 100 / b !== pc && Math.abs(a * 100 / b - pc) <= 40) break; }
    const fd = a / b, right = Math.random() < .25, rel = fd * 100 < pc ? "<" : ">", bad = +(b / a).toFixed(2);
    const good = [{ label: `Step 1: ${a}/${b} as a decimal`, math: `${a} ÷ ${b} = ${+fd.toFixed(2)}` }, { label: `Step 2: ${pc}% as a decimal`, math: `${pc}/100 = ${pc / 100}` }, { label: "Step 3: Compare", math: `${+fd.toFixed(2)} ${rel} ${pc / 100}, so ${a}/${b} ${rel} ${pc}%` }];
    const steps = good.map(s => ({ ...s }));
    if (!right) { steps[0].math = `${b} ÷ ${a} = ${bad}`; steps[2].math = `${bad} > ${pc / 100}, so ${a}/${b} > ${pc}%`; }
    return { q: `Compare using &lt;, &gt;, or =: <b>${a}/${b}</b> ☐ <b>${pc}%</b>`, good, steps, wrong: right ? -1 : 0,
      claim: `I think <b>${a}/${b} ${right ? rel : ">"} ${pc}%</b>.`,
      offRight: `Good eye. Pip turned ${a}/${b} into ${bad}. But ${a}/${b} is less than one whole, since the top is smaller than the bottom!`,
      yesWrong: `Let's check Step 1. ${a}/${b} is less than 1 whole. Is ${bad} less than 1?`,
      yesRight: `You checked it. ${a}/${b} = ${+fd.toFixed(2)} and ${pc}% = ${pc / 100}. On a number line, ${rel === "<" ? `${a}/${b} is farther left` : `${a}/${b} is farther right`}.`,
      offWrong: `Let's check together. ${a} ÷ ${b} = ${+fd.toFixed(2)}, and ${pc}% = ${pc / 100}. Which is bigger?`,
      stepOk: i => i === 1 ? `Step 2 is right: ${pc}% = ${pc}/100 = ${pc / 100}.` : `Step 3 compares the numbers it was given. Look at where the first number came from.`,
      fixQ: `In Step 1 I did ${b} ÷ ${a}. Which way does a fraction divide?`,
      fixes: [[`Top ÷ bottom: ${a} ÷ ${b}`, true], [`Bottom ÷ top: ${b} ÷ ${a}`, false, "That's what Pip did. It made a number bigger than 1."], [`Put the digits together: ${a}${b}`, false, "Let's test it: that's way bigger than one whole."]],
      fixed: `<b>${a}/${b} ${rel} ${pc}%.</b> ${a} ÷ ${b} = ${+fd.toFixed(2)}, and ${+fd.toFixed(2)} ${rel} ${pc / 100}.` };
  } },

  round: { label: "Estimating", sym: "≈", make() {
    const x = rint(11, 49), y = rint(111, 349), rx = Math.round(x / 10) * 10, ry = Math.round(y / 10) * 10, ryBad = Math.round(y / 100) * 100;
    if (y % 10 === 0 || x % 10 === 0 || ry === ryBad) return PIP_TOPICS.round.make();
    const right = Math.random() < .25, est = rx + ry, bad = rx + ryBad, exact = x + y;
    const good = [{ label: `Step 1: Round ${x}`, math: `${x} → ${rx}` }, { label: `Step 2: Round ${y}`, math: `${y} → ${ry}` }, { label: "Step 3: Add", math: `${rx} + ${ry} = ${est}` }];
    const steps = right ? good.map(s => ({ ...s })) : [{ label: `Step 1: Round ${x}`, math: `${x} → ${rx}` }, { label: `Step 2: Round ${y}`, math: `${y} → ${ryBad}` }, { label: "Step 3: Add", math: `${rx} + ${ryBad} = ${bad}` }];
    return { q: `Estimate <b>${x} + ${y}</b> by rounding each number to the nearest ten.`, good, steps, wrong: right ? -1 : 1,
      claim: `I think the estimate is <b>${right ? est : bad}</b>.`,
      offRight: `Good eye. The real answer is ${exact}, and ${bad} is ${Math.abs(exact - bad)} away. A good estimate lands closer than that.`,
      yesWrong: `Let's check. The real answer is ${x} + ${y} = ${exact}. Pip's estimate is ${bad}. Is that close?`,
      yesRight: `You checked it. ${x} + ${y} = ${exact}, and ${est} is close. Good estimate.`,
      offWrong: `Let's check together. The real answer is ${exact}. Pip says ${est}. Is that close?`,
      stepOk: i => i === 0 ? `Step 1 is right: ${x} rounds to ${rx}.` : `Step 3 adds correctly. Look at the numbers it used.`,
      fixQ: `In Step 2 I rounded ${y} to ${ryBad}. To the nearest <b>ten</b>, what should it be?`,
      fixes: [[`${ry}`, true], [`${ryBad}`, false, `That's the nearest hundred. We want the nearest ten.`], [`${ry === Math.floor(y / 10) * 10 ? ry + 10 : ry - 10}`, false, `Look at the ones digit of ${y}. 0 to 4 rounds down, 5 to 9 rounds up.`]],
      fixed: `<b>${est}.</b> ${x} → ${rx} and ${y} → ${ry}, then ${rx} + ${ry} = ${est}. That's close to ${exact}.` };
  } }  ,
  rate: { label: "Who's fastest", sym: "÷1", make() {
    const job = pick([["flyer", "flyers", "made"], ["cookie", "cookies", "decorated"], ["card", "cards", "wrote"], ["bracelet", "bracelets", "made"]]);
    const names = pick([["Ali", "Omar", "Jim"], ["Maya", "Leo", "Ava"], ["Sam", "Zoe", "Eli"]]);
    let ppl;
    for (let t = 0; t < 500; t++) {
      const per = [rint(2, 8), rint(2, 8), rint(2, 8)], K = [rint(3, 10), rint(3, 10), rint(3, 10)];
      if (new Set(per).size < 3 || new Set(K).size < 3 || per.some((x, i) => x * K[i] > 72)) continue;
      const fast = per.indexOf(Math.min(...per)), most = K.indexOf(Math.max(...K));
      if (fast === most) continue;
      ppl = names.map((n, i) => ({ n, per: per[i], K: K[i], W: per[i] * K[i] })); break;
    }
    const f = ppl.reduce((a, b) => a.per < b.per ? a : b), slow = ppl.reduce((a, b) => a.per > b.per ? a : b), right = Math.random() < .25;
    const good = ppl.map((p, i) => ({ label: `Step ${i + 1}: ${p.n}`, math: `${p.W} min ÷ ${p.K} = ${p.per} min each` }));
    good.push({ label: "Step 4: Who's fastest?", math: `Fewest minutes each: ${f.n} (${f.per})` });
    const steps = good.map(s => ({ ...s }));
    if (!right) steps[3] = { label: "Step 4: Who's fastest?", math: `Biggest number: ${slow.n} (${slow.per})` };
    return { q: `${ppl.map(p => `${p.n} ${job[2]} <b>${p.K} ${job[1]}</b> in <b>${p.W} minutes</b>.`).join(" ")} Who worked the fastest?`,
      good, steps, wrong: right ? -1 : 3,
      claim: `I think <b>${right ? f.n : slow.n}</b> worked the fastest.`,
      offRight: `Good eye. ${slow.n} needs ${slow.per} minutes for each ${job[0]}. ${f.n} only needs ${f.per}. Who would finish a ${job[0]} first?`,
      yesWrong: `Let's picture it. ${slow.n} takes ${slow.per} minutes to make one ${job[0]}. ${f.n} takes ${f.per} minutes. If they start together, who finishes first?`,
      yesRight: `You checked it. ${f.n} needs only ${f.per} minutes for each ${job[0]}, the fewest of anyone. Fewer minutes means faster.`,
      offWrong: `Let's check together. Minutes for each ${job[0]}: ${ppl.map(p => `${p.n} ${p.per}`).join(", ")}. Who needs the fewest?`,
      stepOk: i => `Let's test Step ${i + 1}: ${ppl[i].per} × ${ppl[i].K} = ${ppl[i].W}. It matches, so that step works.`,

function pipStart(topic) {
  const key = topic === "any" ? pick(Object.keys(PIP_TOPICS)) : topic;
  state.pp = { ...PIP_TOPICS[key].make(), topic, key };
}
const pipWork = (pp, fixed = false) => `<div><span class="label">Pip's work</span><div class="work">${(fixed ? pp.good : pp.steps).map(s =>
  `<div class="step${fixed ? " fixed" : ""}"><small>${s.label}</small><b>${s.math}</b></div>`).join("")}</div></div>`;
const pipQ = pp => `<p class="story">${pp.q}</p>`;

function pipMeet() {
  const c = el(`<section class="card">
    ${pipSay("Hi! I'm Pip. I'm still learning math, and sometimes my circuits get tangled. Will you be my teacher and check my work? What should I try?")}
    <div class="tiles small" id="topics"></div>
  </section>`);
  stage.appendChild(c);
  [...Object.entries(PIP_TOPICS).map(([k, t]) => [k, t.label, t.sym]), ["any", "Surprise me", "?!"]].forEach(([k, label, sym]) => {
    const b = el(`<button class="tile" type="button" style="--c:var(--g-think)${k === "any" ? ";grid-column:1/-1" : ""}"><span class="sym">${sym}</span><span class="nm">${label}</span></button>`);
    b.onclick = () => { pipStart(k); state.step = 1; render(); };
    c.querySelector("#topics").appendChild(b);
  });
}

function pipSense() {
  const pp = state.pp;
  const c = el(`<section class="card">
    ${pipQ(pp)}
    ${pipWork(pp)}
    ${pipSay(pp.claim + " Did I get it?")}
    <h2>Does Pip's answer make sense?</h2>
    <div class="choices">
      <button type="button" data-a="yes">Yes, it makes sense</button>
      <button type="button" data-a="off">Something seems off</button>
    </div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const fb = c.querySelector("#fb"), saysOk = b.dataset.a === "yes";
    if (pp.wrong < 0) {
      if (saysOk) {
        fb.innerHTML = `<div class="note ok">${pp.yesRight}</div>${pipSay("Phew! Thanks for checking my work, teacher.")}`;
        fb.appendChild(pipNextRow());
        c.querySelectorAll("[data-a]").forEach(x => x.disabled = true);
      } else fb.innerHTML = `<div class="note look">${pp.offWrong}</div>`;
      return;
    }
    if (!saysOk) {
      fb.innerHTML = `<div class="note ok">${pp.offRight}</div>`;
      fb.appendChild(nextBtn(() => { state.step = 2; render(); }, "Find Pip's mistake"));
      c.querySelectorAll("[data-a]").forEach(x => x.disabled = true);
    } else fb.innerHTML = `<div class="note look">${pp.yesWrong}</div>`;
  });
}

function pipFind() {
  const pp = state.pp;
  const c = el(`<section class="card">
    ${pipQ(pp)}
    ${pipSay("Oh no, you're right. My circuits got tangled somewhere. Which step did I mess up? Tap it.")}
    <div class="work" id="steps"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  pp.steps.forEach((s, i) => {
    const b = el(`<button class="step" type="button"><small>${s.label}</small><b>${s.math}</b></button>`);
    b.onclick = () => {
      if (i === pp.wrong) { state.step = 3; render(); return; }
      c.querySelector("#fb").innerHTML = `<div class="note look">${pp.stepOk(i)}</div>`;
    };
    c.querySelector("#steps").appendChild(b);
  });
}

function pipFix() {
  const pp = state.pp, s = pp.steps[pp.wrong];
  const c = el(`<section class="card">
    ${pipQ(pp)}
    <div class="work"><div class="step"><small>${s.label}</small><b>${s.math}</b></div></div>
    ${pipSay(pp.fixQ)}
    <div class="choices" id="opts"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  [...pp.fixes].sort(() => Math.random() - .5).forEach(([t, ok, why]) => {
    const b = el(`<button type="button">${t}</button>`);
    b.onclick = () => {
      const fb = c.querySelector("#fb");
      if (!ok) { fb.innerHTML = `<div class="note look">${why}</div>`; return; }
      c.querySelectorAll("#opts button").forEach(x => x.disabled = x !== b);
      b.classList.add("picked");
      fb.innerHTML = `${pipWork(pp, true)}<div class="note ok">${pp.fixed}</div>${pipSay("Oh! I see it now. Thank you, teacher. My circuits feel much better.")}`;
      fb.appendChild(pipNextRow());
    };
    c.querySelector("#opts").appendChild(b);
  });
}
function pipNextRow() {
  const row = el(`<div class="row" style="margin-top:10px"></div>`);
  const again = el(`<button class="primary" type="button">Help Pip again</button>`), other = el(`<button type="button">Pick a different topic</button>`);
  again.onclick = () => { state.solved.pip++; save(); pipStart(state.pp.topic); state.step = 1; render(); };
  other.onclick = () => { state.solved.pip++; save(); state.step = 0; render(); };
  row.append(again, other); return row;
}

/* ---------- what does it mean? (concept first) ---------- */
function makeMeaning(kind) {
  const name = pick(["Maya", "Leo", "Ava", "Sam", "Zoe"]);
  let a, b; do { a = rint(3, 12); b = rint(2, 9); } while (a === b || a * b === a || a * b === b);
  if (kind === "drive") a = pick([40, 45, 50, 55, 60, 65]);
  const tot = a * b;
  const k = {
    drive: { parts: [`${name} drove `, "a", ` miles each hour for `, "b", ` hours. That's `, "tot", ` miles in all.`],
      mean: { a: "how far the car goes in 1 hour", b: "how long the drive was", tot: "the whole trip" }, ua: "miles", ub: "hours" },
    flyers: { parts: [`${name} spent `, "a", ` minutes on each flyer and made `, "b", ` flyers. That took `, "tot", ` minutes in all.`],
      mean: { a: "the time for just 1 flyer", b: "how many flyers there are", tot: "all the minutes together" }, ua: "minutes", ub: "flyers" },
    read: { parts: [`${name} reads `, "a", ` pages every day. After `, "b", ` days, that's `, "tot", ` pages in all.`],
      mean: { a: "the pages in just 1 day", b: "how many days", tot: "all the pages together" }, ua: "pages", ub: "days" }
  }[kind];
  const order = ["a", "b", "tot"].sort(() => Math.random() - .5);
  return { kind, vals: { a, b, tot }, ...k, order, qi: 0 };
}

function meanPick() {
  const c = el(`<section class="card">
    <h2>Which story do you want?</h2>
    <p class="sub">The math in these stories is already done. Your job is to find what each number means.</p>
    <div class="choices" id="st"></div>
  </section>`);
  stage.appendChild(c);
  [["drive", "Road trip"], ["flyers", "Making flyers"], ["read", "Reading books"], ["any", "Surprise me"]].forEach(([k, t]) => {
    const b = el(`<button type="button">${t}</button>`);
    b.onclick = () => { state.m = makeMeaning(k === "any" ? pick(["drive", "flyers", "read"]) : k); state.step = 1; render(); };
    c.querySelector("#st").appendChild(b);
  });
}

function meanStory(m, tappable) {
  return `<p class="solved">${m.parts.map(p => m.vals[p] === undefined ? p
    : tappable ? `<button class="sn" type="button" data-r="${p}">${m.vals[p]}</button>` : `<b>${m.vals[p]}</b>`).join("")}</p>`;
}

function meanTap() {
  const m = state.m, target = m.order[m.qi];
  const c = el(`<section class="card">
    <span class="label">Question ${m.qi + 1} of 3</span>
    ${meanStory(m, true)}
    <h2>Tap the number that tells ${m.mean[target]}.</h2>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll(".sn").forEach(b => b.onclick = () => {
    const fb = c.querySelector("#fb"), r = b.dataset.r;
    if (r === target) {
      c.querySelectorAll(".sn").forEach(x => x.disabled = x !== b);
      b.classList.add("picked");
      fb.innerHTML = `<div class="note ok">Yes. ${m.vals[r]} is ${m.mean[r]}.</div>`;
      const last = m.qi === 2;
      fb.appendChild(nextBtn(() => { if (last) state.step = 2; else m.qi++; render(); }, last ? "Next step" : "Next question"));
    } else {
      fb.innerHTML = `<div class="note look">${m.vals[r]} tells ${m.mean[r]}. We're looking for the number that tells ${m.mean[target]}. Look again.</div>`;
    }
  });
}

function meanMath() {
  const m = state.m, { a, b, tot } = m.vals;
  const opts = [
    { t: `${a} × ${b} = ${tot}`, ok: true },
    { t: `${tot} × ${b} = ${tot * b}`, big: true },
    { t: `${a} + ${b} = ${a + b}` }
  ].sort(() => Math.random() - .5);
  const c = el(`<section class="card">
    ${meanStory(m, false)}
    <h2>Which math sentence tells this story?</h2>
    <div class="choices" id="opts"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  opts.forEach(o => {
    const btn = el(`<button type="button">${o.t}</button>`);
    btn.onclick = () => {
      const fb = c.querySelector("#fb");
      if (o.ok) {
        c.querySelectorAll("#opts button").forEach(x => x.disabled = x !== btn);
        btn.classList.add("picked");
        fb.innerHTML = `<div class="note ok">Yes. ${a} ${m.ua} for each one, ${b} times, makes ${tot} ${m.ua} in all.</div>`;
        fb.appendChild(nextBtn(() => { state.solved.mean++; save(); state.m = makeMeaning(m.kind); state.step = 1; render(); }, "Another story like this"));
      } else if (o.big) {
        fb.innerHTML = `<div class="note look">${tot * b}? That's way bigger than anything in the story! The ${tot} is already the whole thing, so we don't multiply it again.</div>`;
      } else {
        fb.innerHTML = `<div class="note look">${a} + ${b} = ${a + b} is true math, but it adds ${m.ua} and ${m.ub} together, like adding apples and shoes. The story has ${b} groups of ${a}.</div>`;
      }
    };

/* ---------- least common multiple ---------- */
const gcd = (x, y) => y ? gcd(y, x % y) : x;
const lcmPairs = {
  easy: [[2, 3], [2, 5], [2, 7], [2, 9], [2, 11], [3, 4], [3, 5], [3, 7], [3, 8], [3, 10], [3, 11], [4, 5], [4, 6], [4, 7],

         [8, 14], [8, 20], [9, 12], [9, 15], [10, 12], [10, 15], [12, 15], [12, 16], [12, 18], [12, 20], [15, 20],
         [7, 8], [5, 12], [4, 15], [5, 9], [6, 7], [5, 11]]
};
let lcmRecent = [];
const lcmStories = {
  frogs: { key: "frogs", a: "Green frog", b: "Blue frog", ask: "What is the first number both frogs land on?",
           each: (n, x) => `${n} hops <b>${x}</b> each jump.`, first: "jump", lands: "lands on", land: "land on",
           go: "Start jumping", btn: (n, x) => `${n} jumps (+${x})`, none: "not moved yet", them: "the frogs",

           done: L => `Both frogs land on ${L}.`, spot: "spot" },

           each: (n, x) => `${n} comes every <b>${x}</b> minutes.`, first: "arrival", lands: "comes at", land: "come at",
           go: "Start the buses", btn: (n, x) => `Next ${n} (+${x} min)`, none: "no buses yet", them: "the buses",

           done: L => `Both buses come at minute ${L}.`, spot: "minute" }

const lcmNames = ["Christine", "Frank", "Maya", "Leo", "Ava", "Omar", "Rosa", "Ben", "Lena", "Kai", "Zoe", "Eli"];
const saleItems = [["boxes of cookies", "boxes"], ["candles", "candles"], ["bags of popcorn", "bags"], ["jars of jam", "jars"], ["bracelets", "bracelets"]];
const packPairs = [["Hot dogs", "Buns"], ["Paper plates", "Cups"], ["Pencils", "Erasers"], ["Juice boxes", "Granola bars"]];
function wordStory(key) {
  if (key === "sales") {
    const [A, B] = threeOf(lcmNames), [many, count] = pick(saleItems);
    return { key, word: true, money: true, a: A, b: B, count,
      text: lc => `${A} sells ${many} for <b>$${lc.a}</b> each. ${B} sells ${many} for <b>$${lc.b}</b> each. Each of them sold the same dollar amount. It was the smallest dollar amount for which this was possible.`,
      ask: "What was the dollar amount each of them sold?",

      behind: n => `Sell one for whoever has less money so far. If ${n} has less, tap ${n}.`,

  return { key, word: true, a: A, b: B, count: "packs",
    text: lc => `${A} come in packs of <b>${lc.a}</b>. ${B} come in packs of <b>${lc.b}</b>. You want the same number of ${a} and ${b}, with none left over.`,
    ask: `What is the smallest number of each you can buy?`,
    first: "pack", lands: "reach", land: "reach", go: "Start adding packs", btn: (n, x) => `Add a pack of ${n.toLowerCase()} (+${x})`,
    none: "no packs yet", them: "both", keep: "Keep adding a pack to whichever has fewer.",
    behind: n => `Add a pack to whichever has fewer so far. If ${n.toLowerCase()} have fewer, tap ${n.toLowerCase()}.`,
    done: L => `${L} ${a} and ${L} ${b}.`, spot: "number", countQ: n => `How many packs of ${n.toLowerCase()} do you buy?`,
    unitOf: n => `each pack of ${n.toLowerCase()} has `, fmt: v => `${v}` };
}
function makeLcm(storyKey, size) {
  const pool = lcmPairs[size].filter(p => !lcmRecent.includes(p.join("-")));
  let [a, b] = pick(pool.length ? pool : lcmPairs[size]);
  lcmRecent = [...lcmRecent, `${a}-${b}`].slice(-8);
  if (Math.random() < .5) [a, b] = [b, a];
  return { a, b, L: a * b / gcd(a, b), story: lcmStories[storyKey] || wordStory(storyKey), na: 0, nb: 0, bx: 0, max: size === "easy" ? 40 : 60 };
}

/* ---------- solve & plot (one-step equations on a number line) ---------- */
const fmt = n => n < 0 ? `−${-n}` : `${n}`;
const par = n => n < 0 ? `(${fmt(n)})` : `${n}`;

const pad2 = n => n.toFixed(2);
function makeDecEq() {
  const v = pick(["u", "x", "n", "y"]), op = pick(["−", "+"]);
  for (let t = 0; t < 2000; t++) {
    const aC = rint(101, 899); if (aC % 10 === 0) continue;
    const cC = Math.random() < .6 ? rint(11, 99) * 10 : rint(101, 999);
    const sC = op === "−" ? cC + aC : cC - aC;
    if (sC <= 0 || sC > 1500) continue;
    return { v, op, a: aC / 100, s: sC / 100, c: cC / 100, aC, cC, sC, dec: true, varLeft: Math.random() < .5, phase: 0, dot: null };
  }
}
const INV = { "+": "−", "−": "+", "×": "÷", "÷": "×" };
function makeMulEq() {
  const v = pick(["u", "x", "n", "y"]), op = pick(["×", "÷"]), a = rint(2, 9), q = rint(11, 99);
  // ÷ : v / a = q  ->  v = q × a        × : a·v = a·q  ->  v = q
  return op === "÷" ? { v, op, a, c: q, s: q * a, mul: true, varLeft: Math.random() < .5, phase: 0, dot: null }
                    : { v, op, a, c: q * a, s: q, mul: true, varLeft: Math.random() < .5, phase: 0, dot: null };
}
function testSide(e, v) {           // plug a guess back into the original equation
  const r = e.op === "÷" ? v / e.a : e.op === "×" ? e.a * v : e.op === "+" ? v + e.a : v - e.a;
  const shown = Math.round(r * 100) / 100, approx = Math.abs(shown - r) > 1e-9;
  const lhs = e.op === "÷" ? `${fmt(v)} ÷ ${e.a}` : e.op === "×" ? `${e.a} × ${par(v)}` : `${fmt(v)} ${e.op} ${e.a}`;
  return `${lhs} = ${approx ? "about " : ""}${fmt(shown)}`;
}
const varExpr = e => e.op === "÷" ? `<span class="fr"><span class="t"><em>${e.v}</em></span><span class="bar"></span><span class="b">${e.a}</span></span>`
  : e.op === "×" ? `${e.a}<em>${e.v}</em>` : `<em>${e.v}</em> ${e.op} ${e.a}`;
function mulHint(e) {
  if (e.op === "÷") { const t = e.c - e.c % 10, o = e.c % 10;
    return `Break ${e.c} apart: ${t} × ${e.a} = ${t * e.a}${o ? ` and ${o} × ${e.a} = ${o * e.a}. Then add: ${t * e.a} + ${o * e.a}` : ""}.`; }
  const t = e.s - e.s % 10, big = t * e.a, rest = e.c - big;
  return `Break ${e.c} into parts that ${e.a} goes into: ${big} + ${rest}. ${big} ÷ ${e.a} = ${t}${rest ? ` and ${rest} ÷ ${e.a} = ${rest / e.a}. Then add: ${t} + ${rest / e.a}` : ""}.`;
}
function makeEq(level) {
  if (level === "dec") return makeDecEq();
  if (level === "mul") return makeMulEq();
  const v = pick(["u", "x", "n", "y"]), op = pick(["−", "+"]), a = rint(1, 9);
  for (let t = 0; t < 500; t++) {
    const s = level === "pos" ? rint(1, 12) : rint(-10, 12);
    const c = op === "−" ? s - a : s + a;
    if (c < -15 || c > 15 || s === 0) continue;
    if (level === "pos" && c < 0) continue;
    if (level === "neg" && s > 0 && c > 0) continue;
    return { v, op, a, s, c, varLeft: Math.random() < .5, phase: 0, dot: null };
  }
  return { v: "u", op: "−", a: 5, s: 2, c: -3, varLeft: false, phase: 0, dot: null };
}
const undoWord = e => `${({ "−": "Add", "+": "Subtract", "×": "Divide by", "÷": "Multiply by" })[e.op]} ${e.a}`;
const numSide = e => `${fmt(e.c)} ${INV[e.op]} ${e.a}`;
function eqLine(e, varSide, other, cls = "") {
  const [L, R] = e.varLeft ? [varSide, other] : [other, varSide];
  return `<div class="ln ${cls}"><span>${L}</span><span>=</span><span>${R}</span></div>`;
}
const eqStart = e => eqLine(e, varExpr(e), fmt(e.c));
const eqUndone = e => {
  const u = INV[e.op];
  return eqLine(e, `${varExpr(e)} <span class="add">${u} ${e.a}</span>`, `${fmt(e.c)} <span class="add">${u} ${e.a}</span>`, "small");
};
function hopHint(start, a, dir, lvl) {
  if (!lvl) return `Start at ${fmt(start)} and move ${a} ${a === 1 ? "step" : "steps"} to the ${dir > 0 ? "right" : "left"}. ${dir > 0 ? "Adding moves right." : "Subtracting moves left."}`;
  return `Count it: ${Array.from({ length: a + 1 }, (_, i) => fmt(start + dir * i)).join(" → ")}`;
}

function eqPick() {

    <h2>Which kind of problems?</h2>

      <button class="home-pick" type="button" data-l="dec"><strong>Decimals</strong><span>Like x − 1.94 = 3.2</span></button>

    </div>

function eqUndo() {
  const e = state.e;
  const c = el(`<section class="card">
    <div class="eqn">${eqStart(e)}</div>
    <h2>${e.phase === 0 ? `What is happening to ${e.v}?` : `To undo it, do the opposite to both sides. What do we do?`}</h2>
    ${e.phase === 1 ? `<p class="sub">Both sides of = are like a balance. Whatever you do to one side, you do to the other.</p>` : ""}
    <div class="choices" id="opts"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  const opts = e.mul
    ? (e.phase === 0
      ? [[e.op === "÷", `${e.v} is divided by ${e.a}`], [e.op === "×", `${e.v} is multiplied by ${e.a}`]]
      : [[e.op === "÷", `Multiply both sides by ${e.a}`], [e.op === "×", `Divide both sides by ${e.a}`]])
    : (e.phase === 0
      ? [[e.op === "+", `${e.a} is added to ${e.v}`], [e.op === "−", `${e.a} is taken away from ${e.v}`]]
      : [[e.op === "−", `Add ${e.a} to both sides`], [e.op === "+", `Subtract ${e.a} from both sides`]]);
  opts.forEach(([ok, t]) => {
    const b = el(`<button type="button">${t}</button>`);
    b.onclick = () => {
      const fb = c.querySelector("#fb");
      if (!ok) {
        fb.innerHTML = e.mul
          ? (e.phase === 0
            ? `<div class="note look">${e.op === "÷" ? `${e.v} is on top of a fraction bar with ${e.a} underneath. A fraction bar means divide.` : `When a number sits right next to ${e.v} with no sign, like ${e.a}${e.v}, it means ${e.a} times ${e.v}.`}</div>`
            : `<div class="note look">If we ${e.op === "÷" ? "divided" : "multiplied"} by ${e.a} again, ${e.v} would get even more stuck. The opposite of ${e.op === "÷" ? "dividing is multiplying" : "multiplying is dividing"}.</div>`)
          : e.phase === 0
          ? `<div class="note look">Look right next to ${e.v}. The sign is ${e.op === "−" ? "−, which means take away" : "+, which means add"}.</div>`
          : `<div class="note look">If we ${e.op === "−" ? "took away" : "added"} ${e.a} more, ${e.v} would get even more stuck. The opposite of ${e.op === "−" ? "taking away is adding" : "adding is taking away"}.</div>`;
        return;

      fb.innerHTML = `<div class="note ok">Yes. ${undoWord(e)} on both sides. On the ${e.v} side, ${e.op} ${e.a} and ${INV[e.op]} ${e.a} cancel out, so ${e.v} is left alone.</div>`;

}

function eqSolve() {
  const e = state.e, dir = e.op === "−" ? 1 : -1;
  const c = el(`<section class="card">
    <div class="eqn">${eqStart(e)}${eqUndone(e)}${eqLine(e, `<em>${e.v}</em>`, "?")}</div>
