    </div>
    <p class="sub">For a negative number, type the minus sign first.</p>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  let hl = 0;
  c.querySelector("#hintBtn").onclick = ev => {
    c.querySelector("#hint").innerHTML = e.mul ? `<div class="hint">${mulHint(e)}</div>` : e.dec
      ? `<div class="hint">Line up the decimal points. Give both numbers 2 places after the dot: ${pad2(e.c)} ${e.op === "−" ? "+" : "−"} ${pad2(e.a)}.${hl ? " Then work right to left: hundredths, then tenths, then ones." : ""}</div>`
      : `<div class="hint">${hopHint(e.c, e.a, dir, 0)}${hl ? "<br>" + hopHint(e.c, e.a, dir, 1) : ""}</div>`;
    if (++hl > 1) ev.target.disabled = true;
  };
  const input = c.querySelector("#ans");
  const check = () => {
    const fb = c.querySelector("#fb");
    if (input.value === "") { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
    const v = Number(input.value);
    if (v === e.s) {
      fb.innerHTML = `<div class="note ok">${numSide(e)} = ${fmt(e.s)}. So <b>${e.v} = ${fmt(e.s)}</b>.</div>`;
      fb.appendChild(nextBtn(() => { state.step = e.dec || e.mul ? 4 : 3; render(); }, e.dec || e.mul ? "Check the answer" : "Put it on the number line"));
      input.disabled = true; c.querySelector("#chk").disabled = true;
    } else if (v === (e.mul ? (e.op === "÷" ? e.c / e.a : e.c * e.a) : e.dec ? (e.op === "−" ? e.cC - e.aC : e.cC + e.aC) / 100 : (e.op === "−" ? e.c - e.a : e.c + e.a))) {
      fb.innerHTML = `<div class="note look">Let's test ${fmt(v)}. Put it in for ${e.v}: ${testSide(e, v)}. We need ${fmt(e.c)}, so that doesn't balance. To undo "${e.op} ${e.a}", do the opposite: ${numSide(e)}.</div>`;
    } else if (e.dec && e.cC % 10 === 0 && Math.round(v * 100) === (e.op === "−" ? e.cC / 10 + e.aC : e.cC / 10 - e.aC)) {
      fb.innerHTML = `<div class="note look">So close! Check how the decimal points line up. ${fmt(e.c)} is the same as ${pad2(e.c)}, so its last digit is in the tenths place, not the hundredths. Write it as ${pad2(e.c)} ${e.op === "−" ? "+" : "−"} ${pad2(e.a)} and try again.</div>`;
    } else if (e.mul) {
      fb.innerHTML = `<div class="note look">Let's test ${fmt(v)}: ${testSide(e, v)}. We need ${fmt(e.c)}. ${mulHint(e)}</div>`;
    } else if (v === -e.s) {
      fb.innerHTML = `<div class="note look">So close! The ${Math.abs(e.s)} part is right. Now check the sign. ${hopHint(e.c, e.a, dir, 0)} Do you end up on the left or right side of 0?</div>`;
    } else {
      fb.innerHTML = e.dec ? `<div class="note look">Let's check that one. Line up the decimal points: ${pad2(e.c)} ${e.op === "−" ? "+" : "−"} ${pad2(e.a)}.</div>`
        : `<div class="note look">Let's count it on the number line. ${hopHint(e.c, e.a, dir, 0)}</div>`;
    }
  };
  c.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
  input.focus();
}

function nlSVG(dot) {
  const X = n => 20 + (n + 15) * 20;
  let s = `<svg class="nl" viewBox="0 0 640 96" role="img" aria-label="Number line from −15 to 15">
    <line x1="6" y1="52" x2="634" y2="52" style="stroke:var(--ink);stroke-width:2"/>
    <path d="M6 52 l10 -6 v12 z M634 52 l-10 -6 v12 z" style="fill:var(--ink)"/>`;
  for (let n = -15; n <= 15; n++) {
    const big = n % 5 === 0;
    s += `<line x1="${X(n)}" y1="${big ? 42 : 46}" x2="${X(n)}" y2="${big ? 62 : 58}" style="stroke:var(--ink);stroke-width:${big ? 2 : 1.2}"/>`;
    if (big) s += `<text x="${X(n)}" y="84" text-anchor="middle" style="fill:var(--soft);font:500 14px var(--font-body)">${fmt(n)}</text>`;
  }
  s += `<rect x="0" y="20" width="640" height="56" style="fill:transparent"/>`;
  if (dot !== null) s += `<circle cx="${X(dot)}" cy="52" r="9" style="fill:var(--accent)"/>
    <text x="${X(dot)}" y="26" text-anchor="middle" style="fill:var(--ink);font:600 16px var(--font-body)">${fmt(dot)}</text>`;
  return s + `</svg>`;
}

function eqPlot() {
  const e = state.e;
  const c = el(`<section class="card">
    <div class="eqn">${eqLine(e, `<em>${e.v}</em>`, fmt(e.s))}</div>
    <h2>Put a dot on ${fmt(e.s)}.</h2>
    <p class="sub">Tap the line to put your dot down. Use the arrows to move it one step.</p>
    <div class="nl-wrap" id="nl"></div>
    <div class="row">
      <button id="lft" type="button">← Left 1</button>
      <button id="rgt" type="button">Right 1 →</button>
    </div>
    <button class="primary" id="chk" type="button">Check my dot</button>

  </section>`);
  stage.appendChild(c);
  const draw = () => {
    c.querySelector("#nl").innerHTML = nlSVG(e.dot);
    c.querySelector("svg").addEventListener("click", ev => {
      const r = ev.currentTarget.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * 640;
      e.dot = Math.max(-15, Math.min(15, Math.round((x - 20) / 20) - 15));
      draw();
    });
  };
  draw();
  c.querySelector("#lft").onclick = () => { e.dot = Math.max(-15, (e.dot ?? 0) - 1); draw(); };
  c.querySelector("#rgt").onclick = () => { e.dot = Math.min(15, (e.dot ?? 0) + 1); draw(); };
  c.querySelector("#chk").onclick = () => {

    if (d === s) {
      fb.innerHTML = `<div class="note ok">${fmt(s)} is ${s > 0 ? "positive" : "negative"}. It's ${Math.abs(s)} ${Math.abs(s) === 1 ? "step" : "steps"} to the ${side(s)} of 0.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 4; render(); }, "Check the answer"));

      fb.innerHTML = `<div class="note look">${fmt(s)} is ${s > 0 ? "positive" : "negative"}, so it lives on the ${side(s)} side of 0. Your dot is ${d === 0 ? "right on 0" : `on the ${side(d)} side`}.</div>`;
    } else {
      fb.innerHTML = `<div class="note look">Your dot is on ${fmt(d)}, and we need ${fmt(s)}. You picked the correct side of 0. Count the steps from 0 and use the arrows to move it.</div>`;
    }
  };
}

function eqCheck() {
  const e = state.e, expr = e.op === "×" ? `${e.a} × ${e.s}` : `${par(e.s)} ${e.op} ${e.a}`;
  const c = el(`<section class="card">

    <div class="row">

  stage.appendChild(c);
  const input = c.querySelector("#ans"), dir = e.op === "+" ? 1 : -1;
  const check = () => {
    const fb = c.querySelector("#fb");
    if (input.value === "") { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
    if (Number(input.value) === e.c) {
      fb.innerHTML = `<div class="note ok">${expr} = ${fmt(e.c)}. That matches the other side, so both sides balance. <b>${e.v} = ${fmt(e.s)}</b> is right, and you checked it yourself.</div>`;
      fb.appendChild(nextBtn(() => { state.solved.eq++; save(); state.e = makeEq(state.eqLevel); state.step = 1; render(); }, "Another equation"));
      input.disabled = true; c.querySelector("#chk").disabled = true;
    } else {
      fb.innerHTML = e.mul ? `<div class="note look">Let's check that one. ${e.op === "÷" ? `${e.s} ÷ ${e.a}: think ${e.a} × ? = ${e.s}.` : `Break it apart: ${e.a} × ${e.s - e.s % 10} = ${e.a * (e.s - e.s % 10)} and ${e.a} × ${e.s % 10} = ${e.a * (e.s % 10)}.`}</div>`
        : e.dec ? `<div class="note look">Line up the decimal points: ${pad2(e.s)} ${e.op} ${pad2(e.a)}.</div>`
        : `<div class="note look">Let's count it. ${hopHint(e.s, e.a, dir, 0)}</div>`;
    }
  };
  c.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
  input.focus();
}

function makeTbl(key) {
  const realKey = key === "any" ? pick(Object.keys(tblCtx)) : key;
  const ctx = tblCtx[realKey], [ulo, uhi] = ctx.u || [2, 12], u = rint(ulo, uhi), g = rint(2, 5);
  const [n, pr, pos] = pick(tblPeople);
  let ns = new Set(); while (ns.size < 4) { const x = rint(1, 12); if (x !== g) ns.add(x); } ns = [...ns].sort((a, b) => a - b);
  const cols = ns.map(x => ({ n: x, d: x * u, blank: Math.random() < .5 ? "n" : "d", filled: false }));
  if (!cols.some(c => c.blank === "n")) cols[rint(0, 3)].blank = "n";
  if (!cols.some(c => c.blank === "d")) cols.find(c => c.blank === "n").blank = "d";
  return { key, ctx, u, g, cols, cur: 0, phase: "dir", unitFound: false, text: pick(ctx.lines)(g, g * u, n, pr, pos) };
}

function tblTable(t, live) {
  const cell = (c, i, which) => {

    return `<td class="blank${live && i === t.cur ? " now" : ""}">?</td>`;
  };
  return `<div class="tbl-wrap"><table class="rt">

}

    if (v === t.u) {
      c.querySelector("#tix").innerHTML = Array.from({ length: t.g }, () => `<span>1 ${one}: ${f(t.u)}</span>`).join("");
      fb.innerHTML = `<div class="note ok">${f(t.u)} for each ${one}. Check: ${t.g} × ${t.u} = ${D}. It matches. This is your magic number for the whole table.</div>`;
      fb.appendChild(nextBtn(() => { t.unitFound = true; state.step = 2; render(); }, "Fill in the table"));
      input.disabled = true; c.querySelector("#chk").disabled = true;
    } else if (v > D) {
      fb.innerHTML = `<div class="note look">${f(v)} for just 1 ${one}? That's more than all ${t.g} ${t.ctx.many} put together! Try splitting ${f(D)} into ${t.g} pieces.</div>`;
    } else {
      fb.innerHTML = `<div class="note look">Let's test ${v}: ${t.g} × ${v} = ${t.g * v}. We need ${D}. ${t.g * v > D ? "That's too much, so try a smaller number." : "That's not enough, so try a bigger number."}</div>`;
    }

  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

}

function tblFill() {
  const t = state.t, x = t.ctx, f = x.fmt, one = x.one, many = x.many;
  const col = t.cols[t.cur];
  if (col.filled) {
    const nxt = t.cols.findIndex(c => !c.filled);
    if (nxt < 0) { state.step = 3; return render(); }
    t.cur = nxt;
  }
  const C = t.cols[t.cur], toBottom = C.blank === "d";
  const known = toBottom ? `${C.n} ${C.n === 1 ? one : many}` : f(C.d);
  const want = toBottom ? x.bottom : `how many ${many}`;
  const $ = x.money ? "$" : "";
  const c = el(`<section class="card">
    ${tblStory(t)}

      const ok = (b.dataset.d === "mul") === toBottom, fb = c.querySelector("#fb");
      if (ok) { t.phase = "num"; render(); return; }
      fb.innerHTML = toBottom
        ? `<div class="note look">If we divided, ${C.n} ${many} would come out to less than just 1 ${one}! More ${many} should mean more. Every ${one} adds another ${f(t.u)}.</div>`
        : `<div class="note look">If we multiplied, ${f(C.d)} would turn into ${C.d * t.u} ${many}! That's a giant pile. We want to split ${f(C.d)} into pieces of ${t.u}.</div>`;
    });
    return;
  }
  const ans = toBottom ? C.d : C.n, expr = toBottom ? `${C.n} × ${$}${t.u}` : `${$}${C.d} ÷ ${$}${t.u}`;
  work.appendChild(el(`<div class="row" style="align-items:center">
    <span class="ask">${expr} =</span>
    <input type="number" id="ans" inputmode="numeric" aria-label="Answer for ${expr}">
    <button class="primary" id="chk" type="button">Check</button>
  </div>`));
  work.appendChild(el(`<button class="quiet" id="hintBtn" type="button" style="margin-top:10px">Show me a hint</button>`));
  work.appendChild(el(`<div id="hint"></div>`));
  work.querySelector("#hintBtn").onclick = e => {
    work.querySelector("#hint").innerHTML = `<div class="hint">${toBottom
      ? `Count by ${t.u}s, ${C.n} times: ${Array.from({ length: C.n }, (_, i) => t.u * (i + 1)).join(", ")}.`
      : `Count by ${t.u}s until you reach ${C.d}: ${Array.from({ length: C.n }, (_, i) => t.u * (i + 1)).join(", ")}. How many numbers did you count?`}</div>`;
    e.target.disabled = true;
  };
  const input = work.querySelector("#ans");
  const check = () => {
    const fb = c.querySelector("#fb");
    if (!input.value) { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
    const v = Number(input.value);
    if (v === ans) {

    } else if (toBottom) {

    } else {

    }
  };
  work.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  input.focus();
}

function noCarrySum(x, y) {
  const a = String(x).split("").reverse(), b = String(y).split("").reverse(), out = [];

function makeDec(key) {

    if (P % 10 !== 0) continue;
    const o = B % 10, tens = B - o, p1 = A * o, p2 = A * tens;
    const a = (A / 10).toFixed(1), b = (B / 100).toFixed(2);
    return { key, ctx: story, n, pr, text: `${pick(story.lines)(n, pr, a, b)} ${pick(decAsk)(n, pr)}`, A, B, a: (A / 10).toFixed(1), b: (B / 100).toFixed(2), P, o, tens, p1, p2,
      carry: noCarrySum(p1, p2) !== P, phase: 0, est: null };

}

function decMult() {
  const d = state.dc;
  const asks = [
    { q: `${d.A} × ${d.o} = ?`, ans: d.p1, hint: `Break it apart: ${Math.floor(d.A / 10) * 10} × ${d.o} = ${Math.floor(d.A / 10) * 10 * d.o}, and ${d.A % 10} × ${d.o} = ${(d.A % 10) * d.o}. Add those.` },

/* ---------- fraction times (multiply fractions, simplest form) ---------- */
const FR = (t, b, cls = "") => `<span class="fr ${cls}"><span class="t">${t}</span><span class="bar"></span><span class="b">${b}</span></span>`;
function makeFrac(level) {
  if (level === "pow") {
    for (let i = 0; i < 500; i++) {
      const a = rint(1, 9), b = rint(2, 9);
      if (gcd(a, b) !== 1 || a === b || b * b > 100) continue;
      return { a, b, c: a, d: b, N: a * a, D: b * b, n: a * a, dn: b * b, cur: [a * a, b * b], phase: 0, est: null, level, pow: true };
    }
  }
  for (let i = 0; i < 5000; i++) {
    let a, b, c, d;
    if (level === "easy") { a = rint(1, 9); b = rint(2, 9); c = rint(1, 9); d = rint(2, 9); }
    else { a = rint(1, 9); b = rint(2, 9); c = rint(2, 16); d = rint(3, 16); if (Math.random() < .5) [a, b, c, d] = [c, d, a, b]; }
    if (gcd(a, b) !== 1 || gcd(c, d) !== 1 || a === b || c === d) continue;
    const N = a * c, D = b * d, g = gcd(N, D);
    if (D / g === 1 || D > 200) continue;
    if (level === "hard" && gcd(a, d) === 1 && gcd(c, b) === 1) continue;      // bigger level always has a shortcut
    return { a, b, c, d, N, D, n: N / g, dn: D / g, cur: [N, D], phase: 0, est: null, level };
  }
}
function sizeWord(v) {
  if (v < 0.4) return "less than half";
  if (v <= 0.6) return "about half";
  if (v < 0.95) return "a little less than 1";
  if (v <= 1.05) return "about 1";
  if (v < 1.6) return "a little more than 1";
  return "a lot more than 1";
}
const powFR = f => `<span style="display:inline-flex;align-items:flex-start"><span style="font-size:2.6rem;font-weight:300;align-self:center">(</span>${FR(f.a, f.b)}<span style="font-size:2.6rem;font-weight:300;align-self:center">)</span><sup style="font-size:1.1rem">2</sup></span>`;
const frProblem = f => f.pow ? `<div class="fx">${powFR(f)}<span>=</span>${FR(f.a, f.b)}<span>×</span>${FR(f.a, f.b)}</div>` : `<div class="fx">${FR(f.a, f.b)}<span>×</span>${FR(f.c, f.d)}</div>`;

function frPick() {
  const c = el(`<section class="card">
    <h2>Pick a level</h2>
    <div class="choices" id="lv">
      <button class="home-pick" type="button" data-l="easy"><strong>Smaller numbers</strong><span>Like 6/5 × 3/7</span></button>
      <button class="home-pick" type="button" data-l="hard"><strong>Bigger numbers</strong><span>Like 3/2 × 14/15</span></button>
      <button class="home-pick" type="button" data-l="pow"><strong>Squared fractions</strong><span>Like (3/2)²</span></button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { state.frLevel = b.dataset.l; state.fr = makeFrac(b.dataset.l); state.step = 1; render(); });

function frEst() {
  const f = state.fr, v1 = f.a / f.b, v2 = f.c / f.d, more = f.N > f.D;
  const c = el(`<section class="card">
    ${frProblem(f)}
    <h2>Before any math: will the answer be more than 1 or less than 1?</h2>
    <p class="sub">${f.pow ? `The small 2 means use ${f.a}/${f.b} two times: ${f.a}/${f.b} × ${f.a}/${f.b}. ${FR(f.a, f.b)} is ${sizeWord(v1)}.` : `${FR(f.a, f.b)} is ${sizeWord(v1)}. ${FR(f.c, f.d)} is ${sizeWord(v2)}.`}</p>
    <div class="choices">

      <button type="button" data-g="less">Less than 1</button>
    </div>

  </section>`);
  stage.appendChild(c);
  const big = v1 >= v2 ? [f.a, f.b, v1] : [f.c, f.d, v2], small = v1 >= v2 ? [f.c, f.d, v2] : [f.a, f.b, v1];
  c.querySelector("#hintBtn").onclick = e => {
    c.querySelector("#hint").innerHTML = `<div class="hint">Think of it as "${small[0]}/${small[1]} of ${big[0]}/${big[1]}." Taking a part that's less than 1 makes things smaller. Taking more than 1 makes things bigger.</div>`;

      fb.innerHTML = `<div class="note ok">Yes. The answer should be ${more ? "more" : "less"} than 1, about ${sizeWord(f.N / f.D)}. If we ever get something far from that, it's a clue to look again.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 2; render(); }));
    } else {
      fb.innerHTML = `<div class="note look">Let's think about it. ${small[0]}/${small[1]} is ${sizeWord(small[2])}, and ${big[0]}/${big[1]} is ${sizeWord(big[2])}. ${small[2] < 1 ? `Taking ${sizeWord(small[2])} of something makes it smaller.` : "Both are more than 1, so it grows."} Is ${big[0]}/${big[1]} made ${small[2] < 1 ? "smaller" : "bigger"} enough to cross 1?</div>`;
    }
  });
}

function frMult() {
  const f = state.fr, k = f.phase;
  const q = k === 0 ? { x: f.a, y: f.c, ans: f.N, where: "tops" } : { x: f.b, y: f.d, ans: f.D, where: "bottoms" };
  const c = el(`<section class="card">
    <div class="fx">${FR(f.a, f.b)}<span>×</span>${FR(f.c, f.d)}<span>=</span>${FR(k > 0 ? f.N : "?", "?", "")}</div>
    <h2>Multiply straight across. ${k === 0 ? "Tops first:" : "Now the bottoms:"} ${q.x} × ${q.y}</h2>
    <p class="sub">${f.pow ? `${powFR(f)} means ${f.a}/${f.b} × ${f.a}/${f.b}. So the top is ${f.a} × ${f.a} and the bottom is ${f.b} × ${f.b}.` : "Tops times tops, bottoms times bottoms. No common bottom needed when you multiply."}</p>
    <div class="row" style="align-items:center">
      <span class="ask">${q.x} × ${q.y} =</span>
      <input type="number" id="ans" inputmode="numeric" aria-label="${q.x} times ${q.y}">
      <button class="primary" id="chk" type="button">Check</button>
    </div>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#hintBtn").onclick = e => {
    c.querySelector("#hint").innerHTML = `<div class="hint">Count by ${q.y}s, ${q.x} times: ${Array.from({ length: q.x }, (_, i) => q.y * (i + 1)).join(", ")}.</div>`;
    e.target.disabled = true;
  };
  const input = c.querySelector("#ans");
  const check = () => {
    const fb = c.querySelector("#fb");
    if (!input.value) { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
    const v = Number(input.value);
    if (v === q.ans) {
      if (k === 0) { f.phase = 1; render(); return; }
      fb.innerHTML = `<div class="note ok">${f.a} × ${f.c} = ${f.N} on top, and ${f.b} × ${f.d} = ${f.D} on the bottom. That makes ${FR(f.N, f.D)}.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 3; render(); }, "Simplify it"));
      input.disabled = true; c.querySelector("#chk").disabled = true;
    } else if (f.pow && v === q.x * 2 && q.x !== 2) {
      fb.innerHTML = `<div class="note look">Let's test it with the long way: ${f.a}/${f.b} × ${f.a}/${f.b}. The two ${q.where} are ${q.x} and ${q.x}. What is ${q.x} × ${q.x}? That little 2 is sneaky. It tells how many times to use the number, not what to multiply by!</div>`;
    } else if (v === q.x + q.y) {
      fb.innerHTML = `<div class="note look">Let's test ${v}: ${q.x} + ${q.y} makes ${v}. But look at the sign between the fractions. It's ×! What do you get with ${q.x} × ${q.y}?</div>`;
    } else {
      fb.innerHTML = `<div class="note look">Let's test it: ${q.x} × ${q.y} means ${q.x} groups of ${q.y}. Count by ${q.y}s, ${q.x} times. Do you land on ${v}? The hint can count it with you.</div>`;
    }
  };
  c.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  input.focus();
}

function frSimp() {
  const f = state.fr, [N, D] = f.cur, g = gcd(N, D);
  const c = el(`<section class="card">
    <div class="fx">${FR(f.a, f.b)}<span>×</span>${FR(f.c, f.d)}<span>=</span>${FR(N, D, "hi")}</div>
    <h2>Simplest form means no number (other than 1) divides both the top and the bottom.</h2>
    <p>Is there a number that divides <b>${N}</b> and <b>${D}</b> evenly? Tap it. If nothing works, tap the last button.</p>
    <div class="factors" id="fs"></div>
    <button id="none" type="button">Nothing works. It's already in simplest form.</button>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  const fb = c.querySelector("#fb");
  for (let x = 2; x <= 12; x++) {
    const b = el(`<button type="button">${x}</button>`);
    b.onclick = () => {
      const ta = N % x === 0, tb = D % x === 0;
      if (ta && tb) { f.cur = [N / x, D / x]; f.simpSteps = (f.simpSteps || 0) + 1; render(); return; }
      fb.innerHTML = `<div class="note look">${ta ? `${N} ÷ ${x} works, but ${D} ÷ ${x} doesn't come out even.` : tb ? `${D} ÷ ${x} works, but ${N} ÷ ${x} doesn't come out even.` : `Neither ${N} nor ${D} divides evenly by ${x}.`} It has to work for both. Try another number.</div>`;
    };
    c.querySelector("#fs").appendChild(b);
  }
  c.querySelector("#none").onclick = () => {
    if (g === 1) { state.step = 4; render(); return; }
    fb.innerHTML = `<div class="note look">Look again. ${N % 2 === 0 && D % 2 === 0 ? `${N} and ${D} are both even, so 2 divides both.` : `There's still a number that divides both ${N} and ${D}. Try the hint.`}</div>`;
  };
  c.querySelector("#hintBtn").onclick = e => {
    const tips = [];
    if (N % 2 === 0 && D % 2 === 0) tips.push("Both numbers are even, so try 2.");
    else if (N % 3 === 0 && D % 3 === 0) tips.push(`Both are in the 3 times table. Try 3.`);
    else if (N % 5 === 0 && D % 5 === 0) tips.push(`Both end in 0 or 5. Try 5.`);
    else if (g > 1) tips.push(`Try ${g}.`);
    else tips.push(`${N} and ${D} don't share any number except 1. This one is already in simplest form.`);
    c.querySelector("#hint").innerHTML = `<div class="hint">${tips.join(" ")}</div>`;
    e.target.disabled = true;
  };
}

function frCheck() {
  const f = state.fr, more = f.n > f.dn, whole = Math.floor(f.n / f.dn), rem = f.n % f.dn;
  const shortcut = gcd(f.a, f.d) > 1 || gcd(f.c, f.b) > 1;
  const c = el(`<section class="card">
    <div class="fx">${f.pow ? powFR(f) : `${FR(f.a, f.b)}<span>×</span>${FR(f.c, f.d)}`}<span>=</span>${FR(f.n, f.dn, "hi")}</div>
    <h2>The answer is ${f.n}/${f.dn}${more && rem ? `, which is the same as ${whole} ${rem}/${f.dn}` : ""}.</h2>
    <div class="note ok">Sense check: we guessed the answer would be ${f.est} than 1. ${f.n}/${f.dn} is ${more ? "more" : "less"} than 1, so it fits.${f.N !== f.n ? ` Simplifying didn't change the size. ${f.N}/${f.D} and ${f.n}/${f.dn} are the same amount, just written with smaller numbers.` : ""}</div>
    ${shortcut ? `<p class="sub">Shortcut for next time: you can simplify before you multiply. A top number and a bottom number that share a factor can both be divided first, so the numbers stay small.</p>` : ""}
    <div class="row">
      <button class="primary" id="again" type="button">Another one</button>
      <button id="pick" type="button">Change level</button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#again").onclick = () => { state.solved.frac++; save(); state.fr = makeFrac(state.frLevel); state.step = 1; render(); };
  c.querySelector("#pick").onclick = () => { state.solved.frac++; save(); state.step = 0; render(); };
}


/* ---------- round & estimate ---------- */
function roundTo(n, p) { return Math.round(n / p) * p; }
function makeEst(level) {
  const p = level === "hund" ? 100 : 10, op = level === "diff" ? "−" : "+";
  for (let i = 0; i < 3000; i++) {
    let x, y;
    if (p === 10) { x = rint(11, 99); y = Math.random() < .6 ? rint(101, 999) : rint(11, 99); }
    else { x = rint(101, 999); y = Math.random() < .5 ? rint(1001, 4999) : rint(101, 999); }
    if (Math.random() < .5) [x, y] = [y, x];
    if (op === "−" && x < y) [x, y] = [y, x];
    if (x % p === 0 || y % p === 0 || x === y) continue;
    if (p === 100 && (Math.floor(x / 10) % 10 === 0 || Math.floor(y / 10) % 10 === 0)) continue;
    const rx = roundTo(x, p), ry = roundTo(y, p), est = op === "+" ? rx + ry : rx - ry;
    if (est <= 0) continue;
    return { p, op, level, nums: [x, y], r: [rx, ry], est, exact: op === "+" ? x + y : x - y, cur: 0 };
  }
}
const placeName = p => p === 10 ? "ten" : "hundred";
function miniLine(n, p) {
  const lo = Math.floor(n / p) * p, hi = lo + p, X = v => 30 + (v - lo) / p * 340;
  let t = "";
  for (let k = 0; k <= 10; k++) { const v = lo + k * p / 10; t += `<line x1="${X(v)}" y1="${k % 5 ? 34 : 28}" x2="${X(v)}" y2="${k % 5 ? 46 : 52}" style="stroke:var(--soft);stroke-width:${k % 5 ? 1 : 2}"/>`; }
  return `<svg viewBox="0 0 400 92" style="width:100%;max-width:440px;display:block;margin:0 auto" role="img" aria-label="${n} is between ${lo} and ${hi}">
    <line x1="30" y1="40" x2="370" y2="40" style="stroke:var(--ink);stroke-width:2"/>${t}
    <text x="${X(lo)}" y="74" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--font-body)">${lo}</text>
    <text x="${X(hi)}" y="74" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--font-body)">${hi}</text>
    <text x="${X(lo + p / 2)}" y="74" text-anchor="middle" style="fill:var(--soft);font:500 12px var(--font-body)">halfway ${lo + p / 2}</text>
    <circle cx="${X(n)}" cy="40" r="8" style="fill:var(--accent)"/>
    <text x="${X(n)}" y="18" text-anchor="middle" style="fill:var(--accent);font:700 15px var(--font-body)">${n}</text></svg>`;
}
const estStory = e => `<div class="eqn" style="font-size:1.5rem"><div class="ln"><span>${e.nums[0]}</span><span>${e.op}</span><span style="text-align:left">${e.nums[1]}</span></div></div>`;

function estPick() {
  const c = el(`<section class="card">
    <h2>Pick a kind</h2>
    <div class="choices" id="lv">
      <button class="home-pick" type="button" data-l="ten"><strong>Add, nearest ten</strong><span>Like 11 + 123</span></button>
      <button class="home-pick" type="button" data-l="diff"><strong>Subtract, nearest ten</strong><span>Like 342 − 87</span></button>
      <button class="home-pick" type="button" data-l="hund"><strong>Add, nearest hundred</strong><span>Like 1,248 + 361</span></button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { state.esLevel = b.dataset.l; state.es = makeEst(b.dataset.l); state.step = 1; render(); });
}

function estRound() {
  const e = state.es, n = e.nums[e.cur], p = e.p, lo = Math.floor(n / p) * p, hi = lo + p, r = e.r[e.cur];
  const digit = p === 10 ? n % 10 : Math.floor(n / 10) % 10, dname = p === 10 ? "ones" : "tens";
  const c = el(`<section class="card">
    <p class="story">Estimate by rounding each number to the nearest ${placeName(p)} first.</p>
    ${estStory(e)}
    <h2>Round ${n} to the nearest ${placeName(p)}. Is it closer to ${lo} or ${hi}?</h2>
    ${miniLine(n, p)}
    <div class="choices">
      <button type="button" data-r="${lo}">${lo}</button>
      <button type="button" data-r="${hi}">${hi}</button>
    </div>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#hintBtn").onclick = ev => {
    c.querySelector("#hint").innerHTML = `<div class="hint">Look at the ${dname} digit of ${n}. It's ${digit}. If it's 0 to 4, round down to ${lo}. If it's 5 to 9, round up to ${hi}.</div>`;
    ev.target.disabled = true;
  };
  c.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const fb = c.querySelector("#fb");
    if (+b.dataset.r === r) {
      c.querySelectorAll("[data-r]").forEach(x => x.disabled = x !== b); b.classList.add("picked");
      fb.innerHTML = `<div class="note ok">${n} rounds to <b>${r}</b>. ${digit >= 5 ? `The ${dname} digit is ${digit}, so it rounds up.` : `The ${dname} digit is ${digit}, so it rounds down.`}</div>`;
      const last = e.cur === 1;
      fb.appendChild(nextBtn(() => { if (last) state.step = 2; else e.cur++; render(); }, last ? "Now estimate" : `Next: round ${e.nums[1]}`));
    } else {
      fb.innerHTML = `<div class="note look">Look at the dot. Is ${n} past the halfway mark (${lo + p / 2}) or before it? ${digit === 5 ? `It's exactly halfway, and halfway always rounds up.` : ""}</div>`;
    }
  });
}

function estAdd() {
  const e = state.es, [x, y] = e.nums, [rx, ry] = e.r;
  const wrongPlace = e.p === 10 ? (e.op === "+" ? roundTo(x, 10 * (x >= 100 ? 10 : 1)) + roundTo(y, 10 * (y >= 100 ? 10 : 1)) : null) : null;
  const c = el(`<section class="card">
    ${estStory(e)}
    <h2>Now use the rounded numbers: ${rx} ${e.op} ${ry}</h2>
    <div class="row" style="align-items:center">
      <span class="ask">${rx} ${e.op} ${ry} =</span>
      <input type="number" id="ans" inputmode="numeric" aria-label="${rx} ${e.op} ${ry}">
      <button class="primary" id="chk" type="button">Check</button>
    </div>
    <button class="quiet" id="hintBtn" type="button">Show me a hint</button>
    <div id="hint"></div>
    <div id="fb"></div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#hintBtn").onclick = ev => {
    const z = e.p === 10 ? 1 : 2;
    c.querySelector("#hint").innerHTML = `<div class="hint">Cover up the zero${z > 1 ? "s" : ""} on the end: ${rx / e.p} ${e.op} ${ry / e.p} = ${e.est / e.p}. Then put ${z > 1 ? "two zeros" : "the zero"} back.</div>`;
    ev.target.disabled = true;
  };
  const input = c.querySelector("#ans");
  const check = () => {
    const fb = c.querySelector("#fb");
    if (!input.value) { fb.innerHTML = `<div class="note look">Type a number first, then press Check.</div>`; return; }
    const v = Number(input.value);
    if (v === e.est) { state.step = 3; render(); return; }
    let msg;
    if (v === e.exact) msg = `${v} is the exact answer, and your adding is right! An estimate uses the rounded numbers instead: ${rx} ${e.op} ${ry}. Rounded numbers are quicker to work with.`;
    else if (e.op === "+" && v === Math.abs(rx - ry) && wrongPlace !== null && v === wrongPlace) msg = `Hmm, let's test ${v}. It's what ${Math.max(rx, ry)} − ${Math.min(rx, ry)} makes, and it's also what you'd get rounding to the nearest hundred. The problem asks for + and the nearest ten. What is ${rx} + ${ry}?`;
    else if (e.op === "+" && (v === Math.abs(rx - ry))) msg = `Let's test ${v}: ${Math.max(rx, ry)} − ${Math.min(rx, ry)} makes ${v}. Peek at the sign in the problem. It's +! What is ${rx} + ${ry}?`;
    else if (wrongPlace !== null && v === wrongPlace && wrongPlace !== e.est) msg = `Let's test ${v}: that's what we'd get rounding to the nearest hundred. Today it's the nearest ten, so ${x} → ${rx} and ${y} → ${ry}. Try those.`;
    else msg = `Let's check that one. Try the hint: cover the zeros, then put them back.`;
    fb.innerHTML = `<div class="note look">${msg}</div>`;
  };
  c.querySelector("#chk").onclick = check;
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
  input.focus();
}

function estDone() {
  const e = state.es, [x, y] = e.nums, [rx, ry] = e.r, diff = Math.abs(e.exact - e.est);
  const c = el(`<section class="card">
    <h2>The estimate is ${e.est}.</h2>
    <p>${x} ${e.op} ${y} → ${rx} ${e.op} ${ry} = <b>${e.est}</b></p>
    <div class="note ok">Sense check: the exact answer is ${x} ${e.op} ${y} = ${e.exact}. Our estimate is only ${diff} away, so it's a good estimate. Estimates are close, not exact. That's the point.</div>
    <div class="row">
      <button class="primary" id="again" type="button">Another one</button>
      <button id="pick" type="button">Pick a different kind</button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelector("#again").onclick = () => { state.solved.est++; save(); state.es = makeEst(state.esLevel); state.step = 1; render(); };
  c.querySelector("#pick").onclick = () => { state.solved.est++; save(); state.step = 0; render(); };
}


/* ---------- mixed numbers <-> improper fractions ---------- */
const ordinalPl = d => ({ 2: "halves", 3: "thirds", 4: "fourths", 5: "fifths", 6: "sixths", 7: "sevenths", 8: "eighths", 9: "ninths", 10: "tenths", 12: "twelfths" })[d] || `${d}ths`;
const ordinalOne = d => d === 2 ? "half" : ordinalPl(d).replace(/s$/, "");
const MIX = (w, n, d) => `<span style="display:inline-flex;align-items:center;gap:4px">${w}${FR(n, d)}</span>`;
function makeMix(mode) {
  const d = pick([2, 3, 4, 5, 6, 7, 8, 9]), w = rint(1, 6), n = rint(1, d - 1);
  return { mode, w, n, d, N: w * d + n, phase: 0 };
}
function pieceBars(m, shown) {
  // shown: how many whole bars + partial to draw filled
  const bar = filled => `<div style="display:grid;grid-template-columns:repeat(${m.d},1fr);gap:2px;width:100%;max-width:260px">${
    Array.from({ length: m.d }, (_, i) => `<span style="height:22px;border-radius:3px;background:${i < filled ? "var(--accent)" : "var(--line)"}"></span>`).join("")}</div>`;
  let out = "";
  for (let i = 0; i < m.w; i++) out += `<div style="display:flex;align-items:center;gap:8px"><span class="label" style="min-width:60px">Whole ${i + 1}</span>${bar(m.d)}</div>`;
  if (shown !== "wholes") out += `<div style="display:flex;align-items:center;gap:8px"><span class="label" style="min-width:60px">Extra</span>${bar(m.n)}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:center">${out}</div>`;
}

function mixPick() {
  const c = el(`<section class="card">
    <h2>Which way?</h2>
    <div class="choices" id="lv">
      <button class="home-pick" type="button" data-m="toImp"><strong>Mixed to improper</strong><span>Like 4 5/7 → 33/7</span></button>
      <button class="home-pick" type="button" data-m="toMix"><strong>Improper to mixed</strong><span>Like 33/7 → 4 5/7</span></button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { state.mixMode = b.dataset.m; state.mx = makeMix(b.dataset.m); state.step = 1; render(); });

function mixAsk({ head, q, ans, hint, wrong, next, extra = "" }) {

function mixStep1() {
  const m = state.mx, P = ordinalPl(m.d);

      q: `Each whole is cut into ${m.d} pieces. How many pieces are in ${m.w} whole${m.w > 1 ? "s" : ""}?`,
      extra: pieceBars(m, "wholes"),

      wrong: v => v === m.w * m.n

        : `Let's count the bars together. Each bar has ${m.d} pieces, and there ${m.w > 1 ? `are ${m.w} bars` : "is 1 bar"}. Does ${v} match? Try ${m.w} × ${m.d}.`,
      next: () => { state.step = 2; render(); }

  } else {
    mixAsk({
      head: `<div class="fx">${FR(m.N, m.d)}<span>=</span><span>? ${FR("?", m.d)}</span></div>`,
      q: `${m.N} ${P}. How many whole groups of ${m.d} fit in ${m.N}?`,
      extra: `<p class="sub">Every ${m.d} ${P} make 1 whole.</p>`,
      ans: m.w,
      hint: `Count by ${m.d}s and stop before you go past ${m.N}: ${Array.from({ length: m.w + 1 }, (_, i) => m.d * (i + 1)).map(x => x > m.N ? `<s>${x}</s>` : x).join(", ")}. How many did you count?`,
      wrong: v => v * m.d > m.N ? `${v} groups of ${m.d} is ${v * m.d}. That's more than ${m.N}, so it doesn't fit. Try a smaller number.`
        : `${v} groups of ${m.d} is ${v * m.d}. Could one more group of ${m.d} still fit in ${m.N}?`,
      next: () => { state.step = 2; render(); }

  }
}

function mixStep2() {
  const m = state.mx, P = ordinalPl(m.d), inWholes = m.w * m.d;
  if (m.mode === "toImp") {
    mixAsk({
      head: `<div class="fx">${MIX(m.w, m.n, m.d)}<span>=</span>${FR("?", m.d)}</div>`,
      q: `${inWholes} pieces in the wholes, plus ${m.n} extra. ${inWholes} + ${m.n} = ?`,

      wrong: v => v === inWholes ? `${v} counts all the whole bars. Look at the last bar. There are ${m.n} more pieces waiting to be counted!` : `Let's count it: start at ${inWholes} and count up ${m.n}. Do you land on ${v}?`,
      next: (fb, input) => {

      ans: m.n,

}

function mixDone() {

  const c = el(`<section class="card">

/* ---------- fractions, decimals & percents on a number line ---------- */
function makeFdp(kind = "mix") {
  const dens = kind === "easy" ? [2, 4, 4, 5, 5] : kind === "tenths" ? [10, 10, 20] : [2, 4, 5, 5, 10, 20];
  for (let i = 0; i < 500; i++) {
    const b = pick(dens), a = rint(1, b - 1);
    if (gcd(a, b) !== 1) continue;
    const fH = a * 100 / b;                       // fraction in hundredths (always a multiple of 5)
    let p = rint(1, 19) * 5;
    if (Math.random() < .2) p = fH;               // sometimes they're equal
    if (p === fH && Math.random() < .5) continue;
    return { a, b, fH, p, dotF: null, dotP: null, plotPhase: 0 };
  }
}
const decStr = h => String(+(h / 100).toFixed(2));   // 40 -> "0.4", 55 -> "0.55"
function fdpLine(f, live) {
  const X = h => 30 + h / 100 * 580;
  let t = "";

    const big = h % 10 === 0;
    t += `<line x1="${X(h)}" y1="${big ? 40 : 44}" x2="${X(h)}" y2="${big ? 60 : 56}" style="stroke:var(--ink);stroke-width:${big ? 2 : 1.2}"/>`;
    t += `<text x="${X(h)}" y="${big ? 80 : 76}" text-anchor="middle" style="fill:var(--soft);font:${big ? "600 16px" : "500 12px"} var(--font-body)">${decStr(h)}</text>`;
  }
  const dot = (h, label, col, up) => h === null ? "" : `<circle cx="${X(h)}" cy="50" r="11" style="fill:${col}"/>
    <text x="${X(h)}" y="${up ? 22 : 106}" text-anchor="middle" style="fill:${col};font:700 18px var(--font-body)">${label}</text>`;
  return `<div class="nl-wrap"><svg class="nl" viewBox="0 0 640 112" style="min-width:560px;${live ? "" : "cursor:default"}" role="img" aria-label="Number line from 0 to 1">
    <line x1="20" y1="50" x2="620" y2="50" style="stroke:var(--ink);stroke-width:2"/>${t}
    <rect x="0" y="20" width="640" height="70" style="fill:transparent"/>
    ${dot(f.dotF, `${f.a}/${f.b}`, "var(--accent)", true)}${dot(f.dotP, `${f.p}%`, "var(--look)", false)}</svg></div>`;
}
function fdpAsk({ q, sub, ans, hint, wrong, next }) {

function fdpPick() {

function fdpFrac() {
  const f = state.fd, m = f.b <= 10 ? 10 / f.b : 100 / f.b, to = f.b <= 10 ? 10 : 100, top = f.a * m;
  const easy = Number.isInteger(m);
  fdpAsk({
    q: `Write ${FR(f.a, f.b)} as a decimal.`,
    sub: `A fraction is easy to turn into a decimal when the bottom is 10 or 100.`,
    ans: f.fH / 100,
    hint: easy ? `${f.b} × ${m} = ${to}. Do the same to the top: ${f.a} × ${m} = ${top}. So ${f.a}/${f.b} = ${top}/${to}, which is ${decStr(f.fH)}.`

    wrong: v => {
      if (Math.abs(v - f.b / f.a) < .001) return `Let's test ${v}: that's more than 1 whole. But ${f.a}/${f.b} is only part of a whole, because the top is smaller than the bottom. The division goes top ÷ bottom: ${f.a} ÷ ${f.b}.`;
      if (v >= 1) return `Let's test ${v}: that's 1 whole or more. ${f.a}/${f.b} is only part of a whole, since the top is smaller than the bottom. So the decimal will look like 0.something.`;
      if (Math.abs(v - f.a / 10) < .001 && f.b !== 10) return `Let's test ${v}: that's ${f.a}/10. But these are ${f.b === 2 ? "halves" : f.b === 4 ? "fourths" : f.b === 5 ? "fifths" : "twentieths"}, not tenths. Make the bottom ${to} first.`;
      return `Let's make the bottom ${to}. Try the hint.`;
    },
    next: (fb, input) => {
      fb.innerHTML = `<div class="note ok">${FR(f.a, f.b)} = ${FR(top, to)} = <b>${decStr(f.fH)}</b>.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 2; render(); })); input.disabled = true;
    }
  });
}
function fdpPct() {
  const f = state.fd;
  fdpAsk({
    q: `Write ${f.p}% as a decimal.`,
    sub: `Percent means "out of 100." So ${f.p}% is ${f.p}/100.`,
    ans: f.p / 100,
    hint: `${f.p}/100 is ${f.p} hundredths. Divide by 100: move the decimal point two places to the left. ${f.p} → ${(f.p / 10).toString()} → ${decStr(f.p)}.`,
    wrong: v => {
      if (v === f.p) return `${f.p} wholes would be like ${f.p} whole pizzas! ${f.p}% is only part of one pizza. Percent means out of 100, so divide by 100: move the decimal point two places left.`;
      if (Math.abs(v - f.p / 10) < .001) return `So close! That moved the decimal point one place. Percent means hundredths, so move it two places.`;
      if (Math.abs(v - f.p / 1000) < .0001) return `That moved the decimal point three places. Percent means hundredths, so move it just two places.`;
      return `Percent means out of 100: ${f.p}/100. Try the hint.`;
    },
    next: (fb, input) => {
      fb.innerHTML = `<div class="note ok">${f.p}% = ${f.p}/100 = <b>${decStr(f.p)}</b>.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 3; render(); }, "Plot them")); input.disabled = true;
    }

}
function fdpPlot() {
  const f = state.fd, which = f.plotPhase === 0 ? "F" : "P";
  const target = which === "F" ? f.fH : f.p, name = which === "F" ? `${f.a}/${f.b} (${decStr(f.fH)})` : `${f.p}% (${decStr(f.p)})`;

/* ---------- area: same-size squares in rows and columns ---------- */
const arStories = [
  ["Goran", "he", "plant grass in his backyard", "backyard", "pack of seed", "packs of seed"],
  ["Nicole", "she", "put tiles on her patio", "patio", "box of tiles", "boxes of tiles"],
  ["Marcus", "he", "paint a wall in his room", "wall", "can of paint", "cans of paint"],
  ["Ivy", "she", "cover her garden with mulch", "garden", "bag of mulch", "bags of mulch"],
  ["Ben", "he", "put new carpet in the playroom", "playroom", "roll of carpet", "rolls of carpet"],
  ["Rosa", "she", "plant flowers in a garden bed", "garden bed", "tray of flowers", "trays of flowers"]

function makeArea(kind) {
  const s = pick(arStories);
  let L, W, k;
  if (kind === "see") {
    for (let t = 0; t < 500; t++) {
      L = rint(4, 9); W = rint(2, 6); if (L === W) continue;
      const divs = []; for (let d = 2; d <= L * W / 3; d++) if (L * W % d === 0) divs.push(d);
      if (!divs.length) continue; k = pick(divs); break;
    }
  } else {
    for (let t = 0; t < 5000; t++) {
      L = rint(14, 39); W = rint(12, 29); k = pick([4, 6, 8, 9, 12, 12, 15, 16, 24]);
      if (L % 10 === 0 || W % 10 === 0 || L === W || (L * W) % k) continue;
      const q = L * W / k; if (q < 15 || q > 99) continue; break;
    }
  }
  const [who, pr, job, place, one, many] = s;
  return { kind, L, W, A: L * W, k, q: L * W / k, who, pr, job, place, one, many, phase: 0, pick: null };
}
const arStory = a => `<p class="story">${a.who} wants to ${a.job}. The ${a.place} is a rectangle, <b>${a.L} feet</b> long and <b>${a.W} feet</b> wide. Each ${a.one} covers <b>${a.k} square feet</b>. How many ${a.many} will ${a.pr} need?</p>`;

    if (patch && i % patch === 0) cells += `<text x="${ox + c * s + s / 2}" y="${oy + r * s + s / 2 + 5}" text-anchor="middle" style="fill:var(--accent-ink);font:700 ${Math.min(14, s - 4)}px var(--font-body)">${i / patch + 1}</text>`;
  }
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${ox + w + 12} ${oy + h + 12}" style="width:100%;max-width:${ox + w + 12}px;display:block;margin:0 auto" role="img" aria-label="A rectangle ${a.L} feet by ${a.W} feet">

// big yard: split into L × tens and L × ones, faint 1-foot grid so the squares are still there
function arSplit(a, show = 2) {
  const T = a.W - a.W % 10, O = a.W % 10, s = Math.min(320 / a.L, 230 / a.W), ox = 44, oy = 30, w = a.L * s, hT = T * s, hO = O * s;
  const lab = (y, h, t, on) => `<text x="${ox + w / 2}" y="${y + h / 2 + 6}" text-anchor="middle" style="fill:var(--ink);font:700 ${h < 24 ? 13 : 17}px var(--font-body);paint-order:stroke;stroke:var(--card);stroke-width:4">${on ? t : ""}</text>`;
  return `<div><svg viewBox="0 0 ${ox + w + 12} ${oy + hT + hO + 16}" style="width:100%;max-width:${ox + w + 12}px;display:block;margin:0 auto" role="img" aria-label="The rectangle split into two parts">
    <defs><pattern id="ft" width="${s}" height="${s}" patternUnits="userSpaceOnUse" x="${ox}" y="${oy}"><path d="M ${s} 0 L 0 0 0 ${s}" style="fill:none;stroke:var(--card);stroke-width:.8"/></pattern></defs>
    <text x="${ox + w / 2}" y="20" text-anchor="middle" style="fill:var(--ink);font:600 15px var(--font-body)">${a.L} ft</text>
    <rect x="${ox}" y="${oy}" width="${w}" height="${hT}" style="fill:var(--accent)" opacity=".55"/>
    <rect x="${ox}" y="${oy + hT + 4}" width="${w}" height="${hO}" style="fill:var(--look)" opacity=".6"/>
    <rect x="${ox}" y="${oy}" width="${w}" height="${hT}" style="fill:url(#ft)"/><rect x="${ox}" y="${oy + hT + 4}" width="${w}" height="${hO}" style="fill:url(#ft)"/>
    <text x="${ox - 8}" y="${oy + hT / 2 + 5}" text-anchor="end" style="fill:var(--ink);font:600 15px var(--font-body)">${T} ft</text>
    <text x="${ox - 8}" y="${oy + hT + 4 + hO / 2 + 5}" text-anchor="end" style="fill:var(--ink);font:600 14px var(--font-body)">${O} ft</text>
    ${lab(oy, hT, `${a.L} × ${T}`, show >= 1)}${lab(oy + hT + 4, hO, `${a.L} × ${O}`, show >= 2)}</svg>
    <p class="sub" style="text-align:center">Each tiny square is 1 foot by 1 foot. The ${a.place} is split into two easier parts.</p></div>`;
}
// three ways to "cover" the same rectangle: only one is fair
function arFairPics(a) {
  const L = a.L, W = a.W, s = Math.min(22, Math.floor(150 / L)), w = L * s, h = W * s;
  const frame = inner => `<svg viewBox="-3 -3 ${w + 6} ${h + 6}" style="width:100%;max-width:${w + 6}px"><rect x="0" y="0" width="${w}" height="${h}" style="fill:var(--card);stroke:var(--ink);stroke-width:2"/>${inner}</svg>`;
  const sq = (x, y, ww, hh) => `<rect x="${x + 1}" y="${y + 1}" width="${ww - 2}" height="${hh - 2}" rx="2" style="fill:var(--block);stroke:var(--accent);stroke-width:1"/>`;
  let even = ""; for (let r = 0; r < W; r++) for (let c = 0; c < L; c++) even += sq(c * s, r * s, s, s);
  let pcs = [{ x: 0, y: 0, w, h }];
  while (pcs.length < Math.max(5, Math.round(L * W / 2.5))) {
    pcs.sort((p, q) => q.w * q.h - p.w * p.h); const p = pcs.shift(), f = .25 + Math.random() * .5;
    if (p.w >= p.h) pcs.push({ x: p.x, y: p.y, w: p.w * f, h: p.h }, { x: p.x + p.w * f, y: p.y, w: p.w * (1 - f), h: p.h });
    else pcs.push({ x: p.x, y: p.y, w: p.w, h: p.h * f }, { x: p.x, y: p.y + p.h * f, w: p.w, h: p.h * (1 - f) });
  }
  const messy = pcs.map(p => sq(p.x, p.y, p.w, p.h)).join("");
  let gaps = ""; for (let r = 0; r < W; r++) for (let c = 0; c < L; c++) if ((r * 7 + c * 3) % 4) gaps += sq(c * s + s * .15, r * s + s * .15, s * .7, s * .7);
  return [["even", frame(even)], ["messy", frame(messy)], ["gaps", frame(gaps)]].sort(() => Math.random() - .5);
}

function arPick() {
  const c = el(`<section class="card">
    <h2>Which yard do you want?</h2>
    <p class="sub">Area means how many 1-foot squares it takes to cover the whole flat space. You can switch any time.</p>
    <div class="choices">
      <button class="home-pick" type="button" data-k="see"><strong>See the squares</strong><span>Small yards. You build the rows yourself.</span></button>
      <button class="home-pick" type="button" data-k="big"><strong>Big yard</strong><span>Like Goran's 32 ft by 21 ft backyard.</span></button>
    </div>
  </section>`);
  stage.appendChild(c);
  c.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { state.arKind = b.dataset.k; state.ar = makeArea(b.dataset.k); state.step = 1; render(); });
}

function arLook() {
  const a = state.ar;
  if (a.kind === "see") {
    if (!a.pics) a.pics = arFairPics(a);
    const c = el(`<section class="card">
      ${arStory(a)}
      <h2>Three kids tried to cover the ${a.place} with squares. Which one can we count to find the area?</h2>
      <div class="choices" id="opts">${a.pics.map(([k, svg]) => `<button type="button" data-k="${k}" style="padding:12px">${svg}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
    stage.appendChild(c);
    c.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      const fb = c.querySelector("#fb"), k = b.dataset.k;
      if (k === "messy") { fb.innerHTML = `<div class="note look">Let's test this one. Some boxes are big and some are tiny. If one ${a.one} covers a tiny box, it won't cover a big box! For counting to work, every square has to be the <b>same size</b>.</div>`; return; }
      if (k === "gaps") { fb.innerHTML = `<div class="note look">Let's test this one. Look between the squares. There are gaps and empty spots. Those parts of the ${a.place} would be left bare! The squares have to touch, with no gaps.</div>`; return; }
      c.querySelectorAll("[data-k]").forEach(x => x.disabled = x !== b); b.classList.add("picked");
      fb.innerHTML = `<div class="note ok">That's the one. Every square is the same size (1 foot by 1 foot), they touch with no gaps, and they line up in <b>rows</b> and <b>columns</b>. Now we can count them.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 2; render(); }, "Build the rows"));
    });
  } else {
    const rl = Math.round(a.L / 10) * 10, rw = Math.round(a.W / 10) * 10, good = rl * rw;
    const opts = [[good, true], [rl + rw, false, `Let's test ${rl + rw}. That's ${rl} + ${rw}, like walking along two edges of the ${a.place}. But the ${a.place} is covered all the way across the inside: ${rw} rows with ${rl} squares in each row.`],
      [2 * (rl + rw), false, `Let's test ${2 * (rl + rw)}. That's walking all the way around the edge, like a fence. Area is the inside, not the edge.`]].sort(() => Math.random() - .5);
    const c = el(`<section class="card">
      ${arStory(a)}
      <h2>Estimate first. Round each side to the nearest ten. About how many square feet is the ${a.place}?</h2>
      <p class="sub">${a.L} is about ${rl}. ${a.W} is about ${rw}.</p>
      <div class="choices" id="opts">${opts.map(([v], i) => `<button type="button" data-i="${i}">About ${v}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
    stage.appendChild(c);
    c.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
      const fb = c.querySelector("#fb"), [, ok, why] = opts[+b.dataset.i];
      if (!ok) { fb.innerHTML = `<div class="note look">${why}</div>`; return; }
      c.querySelectorAll("[data-i]").forEach(x => x.disabled = x !== b); b.classList.add("picked");
      a.est = good;
      fb.innerHTML = `<div class="note ok">About ${rw} rows of ${rl} squares. ${rl} × ${rw} = <b>${good}</b> square feet. Keep that number handy to check the real answer.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 2; render(); }, "Split it up"));
    });
  }
}

function arBuild() {
  const a = state.ar;
  if (a.kind === "see") {
    if (a.phase === 0) return mixAsk({
      head: arStory(a), extra: arGrid(a, 0),
      q: `Start with the top row. How many 1-foot squares fit across the ${a.L} ft side?`,
      ans: a.L,
      hint: `Each square is 1 foot wide, and the top side is ${a.L} feet long. One square for each foot.`,
      wrong: v => v === a.W ? `Let's test ${v}. That's the side going down (${a.W} ft). The top row goes across the ${a.L} ft side.` : `Let's test ${v}. Each square is 1 foot wide, so ${v} squares would make a row ${v} feet long. The top is ${a.L} feet.`,
      next: () => { a.phase = 1; a.rows = 1; render(); }
    });
    const full = a.rows >= a.W;
    const c = el(`<section class="card">
      ${arGrid(a, a.rows)}
      <h2>${full ? `The ${a.place} is covered!` : `Every row is the same: ${a.L} squares. Add rows until the ${a.place} is full.`}</h2>
      <div class="work">${Array.from({ length: a.rows }, (_, i) => `<div class="step"><small>Row ${i + 1}</small><b>${a.L} more · ${a.L * (i + 1)} so far</b></div>`).join("")}</div>
      <div id="fb"></div>
    </section>`);
    stage.appendChild(c);
    const fb = c.querySelector("#fb");
    if (!full) { const b = el(`<button class="primary" type="button">Add a row</button>`); b.onclick = () => { a.rows++; render(); }; fb.appendChild(b); }
    else {
      fb.innerHTML = `<div class="note ok"><b>${a.W} rows</b> with <b>${a.L} squares</b> in each row. Counting by ${a.L}s gave ${a.A}. That's the same as ${a.W} × ${a.L}.</div>`;
      fb.appendChild(nextBtn(() => { state.step = 3; render(); }, "Find the area"));
    }
    return;
  }
  const T = a.W - a.W % 10, O = a.W % 10;
  if (a.phase === 0) return mixAsk({
    head: arSplit(a, 1),
    q: `Big part: ${T} rows of ${a.L} squares. ${a.L} × ${T} = ?`,
    ans: a.L * T,
    hint: `${a.L} × ${T / 10} = ${a.L * T / 10}. Then add a zero for the ten: ${a.L} × ${T} = ${a.L * T / 10}0.`,
    wrong: v => v === a.L * T / 10 ? `Let's test ${v}. That's ${a.L} × ${T / 10}, only ${T / 10} row${T > 10 ? "s" : ""}. There are ${T} rows here, so add a zero.` : `Let's test it: ${a.L} × ${T / 10} = ${a.L * T / 10}, then × 10. Does that make ${v}?`,
    next: () => { a.phase = 1; render(); }
  });
  return mixAsk({
    head: arSplit(a, 2),
    q: `Small part: ${O} row${O > 1 ? "s" : ""} of ${a.L} squares. ${a.L} × ${O} = ?`,
    ans: a.L * O,
    hint: `Break ${a.L} into ${a.L - a.L % 10} + ${a.L % 10}. ${a.L - a.L % 10} × ${O} = ${(a.L - a.L % 10) * O}, and ${a.L % 10} × ${O} = ${a.L % 10 * O}. Add them.`,
    wrong: v => v === a.L + O ? `Let's test ${v}. That's ${a.L} + ${O}. But we have ${O} whole row${O > 1 ? "s" : ""}, each with ${a.L} squares. That's ${a.L} × ${O}.` : `Let's test it: ${v} ÷ ${O} would need to be ${a.L}. Try the hint to break ${a.L} into tens and ones.`,
    next: (fb, input) => { input.disabled = true; fb.innerHTML = `<div class="note ok">Big part: ${a.L * T}. Small part: ${a.L * O}.</div>`; fb.appendChild(nextBtn(() => { state.step = 3; render(); }, "Put them together")); }
  });
}

function arAreaWrong(a, v) {
  if (v === a.L + a.W) return `Let's test ${v}. That's ${a.L} + ${a.W}, just the squares along the top and one side, like an L. The middle of the ${a.place} would still be empty! We need every row.`;
  if (v === 2 * (a.L + a.W)) return `Let's test ${v}. That's all the way around the edge, like a fence. Area covers the inside.`;
  if (a.est && Math.abs(v - a.A) > a.A * .3) return `Let's check with the estimate. We said about ${a.est}. ${v} is ${v > a.est ? "way more" : "way less"}. Something got mixed up.`;
  if (Math.abs(v - a.A) === a.L) return `So close! Let's test it: ${v} is one row ${v > a.A ? "too many" : "short"}. Count the rows again: there are ${a.W}.`;
  return `Let's test ${v}: ${a.W} rows of ${a.L} would be ${a.W} × ${a.L}. Does it come out to ${v}?`;
}
function arArea() {
  const a = state.ar, T = a.W - a.W % 10, O = a.W % 10;
  const see = a.kind === "see";
  mixAsk({
    head: see ? arGrid(a, a.W) : arSplit(a, 2),
    q: see ? `${a.W} rows × ${a.L} squares in each row = ? square feet` : `Add the two parts: ${a.L * T} + ${a.L * O} = ? square feet`,
    ans: a.A,
    hint: see ? `Count by ${a.L}s, ${a.W} times: ${Array.from({ length: a.W }, (_, i) => a.L * (i + 1)).slice(0, 2).join(", ")}, …` : `Add the hundreds and tens first, then the ones.`,
    wrong: v => arAreaWrong(a, v),
    next: (fb, input) => {
      input.disabled = true;
      fb.innerHTML = `<div class="note ok">The area is <b>${a.A} square feet</b>. The shortcut: length × width. ${a.L} × ${a.W} = ${a.A}.${a.est ? (Math.abs(a.A - a.est) <= a.A * .2 ? ` That's close to our estimate of ${a.est}.` : ` Our estimate of ${a.est} was ${a.est < a.A ? "low" : "high"} because rounding moved the sides ${a.est < a.A ? "down" : "up"}. It still told us the answer is in the hundreds.`) : ""}</div>`;
      fb.appendChild(nextBtn(() => { state.step = 4; render(); }, `How many ${a.many.split(" ")[0]}?`));
    }
  });
}

function arPacks() {
  const a = state.ar, base = Math.floor(a.q / 10) * 10;
  mixAsk({
    head: `${arStory(a)}<p class="sub">Area: ${a.A} square feet.</p>`,
    extra: a.kind === "see" ? arGrid(a, a.W) : "",
    q: `Each ${a.one} covers ${a.k} square feet. How many ${a.many} for ${a.A} square feet?`,
    ans: a.q,
    hint: a.kind === "see" ? `Count by ${a.k}s until you reach ${a.A}: ${a.k}, ${a.k * 2}, ${a.k * 3}, … How many did you count?`
      : `${a.A} ÷ ${a.k}. Take big chunks: ${a.k} × ${base} = ${a.k * base}. That leaves ${a.A} − ${a.k * base} = ${a.A - a.k * base}. How many more ${a.k}s fit in ${a.A - a.k * base}?`,
    wrong: v => {
      if (v === a.A) return `${a.A} ${a.many}? That's one for every single square foot! Each one covers ${a.k} square feet, so ${a.who} needs far fewer. ${a.A} ÷ ${a.k}.`;
      if (v === a.A * a.k) return `Let's test ${v}. That many ${a.many} could cover a whole neighborhood! Each one covers ${a.k} square feet, so divide: ${a.A} ÷ ${a.k}.`;
      if (v <= 0) return `${a.who} needs at least one!`;
      const got = v * a.k;
      return `Let's test ${v}: ${v} ${v === 1 ? a.one : a.many} × ${a.k} square feet = ${got} square feet. The ${a.place} is ${a.A}. ${got > a.A ? `That's ${got - a.A} square feet too much. Try fewer.` : `That leaves ${a.A - got} square feet bare. Try more.`}`;
    },
    next: (fb, input, c) => {
      input.disabled = true;
      if (a.kind === "see") { const g = c.querySelector("svg"); if (g) g.parentElement.outerHTML = arGrid(a, a.W, a.k); }
      fb.innerHTML = `<div class="note ok"><b>${a.q} ${a.q === 1 ? a.one : a.many}.</b> Check: ${a.q} × ${a.k} = ${a.A} square feet. It covers the whole ${a.place}.${a.kind === "see" ? ` Each color patch is one ${a.one}.` : ""}</div>
        <p class="sub">Two steps: first the area (length × width), then divide by how much one covers.</p>`;
      const row = el(`<div class="row"></div>`), again = el(`<button class="primary" type="button">Another one</button>`), other = el(`<button type="button">Pick a different size</button>`);
      again.onclick = () => { state.solved.area++; save(); state.ar = makeArea(state.arKind); state.step = 1; render(); };
      other.onclick = () => { state.solved.area++; save(); state.step = 0; render(); };
      row.append(again, other); fb.appendChild(row);
    }
  });
}


render();
</script>

</body>
