e","era":"4 BC to AD 30","intro":"Jesus told a story about two builders. He knew about building, because Jesus and Joseph were builders!","sections":[{"h":"Jesus the Builder","p":["The Bible calls Jesus a carpenter. The Greek word means a builder who worked with wood and stone. He may have built doors, roofs, tables, and houses.","Nazareth was a tiny village. In 2009, archaeologists found the first house from Jesus' time in Nazareth!"]},{"h":"The City Next Door","p":["About four miles from Nazareth, there was a big city being built while Jesus was a boy. Maybe Joseph and Jesus worked there. The Bible doesn't say, but it's fun to wonder!"]},{"h":"Houses on Rock","p":["Houses in Galilee were made of stone. Roofs were made of wooden beams, branches, and packed mud. That's how friends could dig through a roof to lower a man down to Jesus!","Israel has dry valleys that turn into rushing rivers in a storm. A house built on sand there could wash away fast. A house on rock stayed strong!"]}],"people":[{"name":"Joseph","role":"Jesus' earthly father, a builder"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Herod Antipas built up the city of Sepphoris to be the jewel of all Galilee.","note":"Sepphoris was a short walk from Nazareth, where Jesus grew up."},"vocab":[["Carpenter","A builder who works with wood"],["Foundation","The strong bottom part of a building"],["Wadi","A dry valley that floods in storms"]],"map":{"view":"local","places":["nazareth","sepphoris","cana","capernaum"],"caption":"The big city of Sepphoris was only about four miles from Nazareth."},"timeline":[{"y":-3,"t":"A big city is rebuilt near Nazareth"},{"y":2009,"t":"A house from Jesus' time is found in Nazareth","d":true}],"video":[["Drive Thru History: The Sermon on the Mount","https://watch.tbn.org/s/Q9aSuuiu?e=Zt9exrmS"]],"quiz":[{"q":"What was Jesus' job before he started preaching?","options":["Fisherman","Shepherd","Builder"],"answer":2,"why":"He was a carpenter."},{"q":"What were roofs made of?","options":["Beams, branches, and mud","Glass","Metal"],"answer":0,"why":"Friends could dig through!"},{"q":"What happened to a house built on sand?","options":["Nothing","It got bigger","It washed away in a storm"],"answer":2,"why":"Build on the rock!"}],"assignment":"Build two little houses with blocks: one on sand, one on a rock. Pour water around them. What happened?"},{"id":"hist-09","bible":"mat-09","bibleTitle":"Jesus Heals and Calms the Storm","title":"Sickness, Medicine, and the Decapolis","era":"1st century AD","intro":"Long ago, no one knew about germs. Being sick was scary. That's why Jesus' healings amazed people so much!","sections":[{"h":"Doctors Long Ago","p":["Doctors used herbs, olive oil, wine to clean cuts, and bandages. But often their medicine didn't work. One woman in the Bible spent all her money on doctors, and she only got worse!","No one knew about germs until about 160 years ago."]},{"h":"Leprosy","p":["People with leprosy, a skin sickness, had to live away from everyone else. They had to shout 'Unclean!' to warn people. No one would touch them.","That's why it was so amazing that Jesus touched a man with leprosy. Jesus didn't get sick. The man got well!"]},{"h":"The Ten Cities","p":["Across the lake were ten Greek cities called the Decapolis. Most people there weren't Jewish. That's why there were pigs there! Jewish people didn't eat pork. When Jesus went there, it showed his kingdom was for everyone."]}],"people":[{"name":"Luke","role":"A doctor who wrote one of the Gospels"},{"name":"Louis Pasteur","role":"A scientist who helped discover germs"}],"source":{"title":"The Hippocratic Oath","who":"Greek physicians in the tradition of Hippocrates","date":"About 400 BC","text":"Greek doctors promised to help sick people as well as they could, and never to hurt anyone.","note":"Doctors still make a promise like this today!"},"vocab":[["Physician","A doctor"],["Leprosy","A skin sickness"],["Decapolis","'Ten cities' across the Sea of Galilee"]],"map":{"view":"local","places":["capernaum","gadara","gerasa","magdala"],"caption":"Jesus crossed the lake from Galilee to the ten Greek cities called the Decapolis."},"timeline":[{"y":-400,"t":"Greek doctors write about medicine"},{"y":1862,"t":"Scientists learn that germs cause sickness","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What did people with leprosy have to shout?","options":["Unclean!","Hello!","Help!"],"answer":0,"why":"To warn others."},{"q":"What did Jesus do that no one else would?","options":["Touched the man with leprosy","Gave him money","Built him a house"],"answer":0,"why":"And the man was healed!"},{"q":"What does Decapolis mean?","options":["Pig land","Big lake","Ten cities"],"answer":2,"why":"Ten Greek cities."},{"q":"Which Gospel writer was a doctor?","options":["John","Matthew","Luke"],"answer":2,"why":"Luke was a doctor."}],"assignment":"Make a get-well card for someone who is sick, and pray for them."},{"id":"hist-10","bible":"mat-10","bibleTitle":"Matthew Is Called and a Girl Lives Again","title":"Taxes and Tax Collectors","era":"1st century AD","intro":"Why did everyone dislike tax collectors? It has to do with how Rome got its money, and where Matthew's tax booth was.","sections":[{"h":"Lots of Taxes","p":["People paid many taxes: taxes to Rome, taxes on things carried down the road, and a temple tax. For farming families, taxes could take a big part of their food and money."]},{"h":"Why Tax Collectors Cheated","p":["Rome let tax collectors charge extra and keep it for themselves. So many of them got rich by cheating! That's why Zacchaeus promised to pay back four times what he took unfairly.","Jewish people thought tax collectors were traitors who helped the Romans."]},{"h":"Matthew's Booth","p":["Matthew's tax booth was in Capernaum, near a road and a border. He probably charged taxes on fish, grain, and cloth that passed by.","Everyone disliked Matthew, but Jesus chose him! And Matthew threw a party so his friends could meet Jesus too."]}],"people":[{"name":"Matthew","role":"Tax collector who followed Jesus and wrote a Gospel"},{"name":"Zacchaeus","role":"A tax collector who paid back what he took"}],"source":{"title":"The Mishnah, Ketubot 4:4","who":"Jewish rabbis (collected later)","date":"Written down about AD 200","text":"Old Jewish writings say that when someone died, even poor families hired flute players and a crying woman for the funeral.","note":"That's why there were mourners and music at Jairus' house when Jesus came to heal his daughter (Matthew 9:23)."},"vocab":[["Tax","Money people must pay to the government"],["Toll","Money paid to use a road"],["Traitor","Someone who turns against their own people"]],"map":{"view":"local","places":["capernaum","bethsaida","magdala","tiberias"],"caption":"Capernaum was near a border, so goods passing through were taxed."},"timeline":[{"y":-4,"t":"Herod's kingdom is split among his sons"},{"y":200,"t":"Jewish teachers write down their old teachings"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"Why did people dislike tax collectors?","options":["They were short","They were too nice","Many cheated and worked for Rome"],"answer":2,"why":"People saw them as traitors."},{"q":"Where was Matthew's tax booth?","options":["Rome","Egypt","Capernaum"],"answer":2,"why":"Near a road and a border."},{"q":"What did Matthew do after Jesus called him?","options":["Ran away","Kept collecting taxes","Threw a party for his friends to meet Jesus"],"answer":2,"why":"He wanted others to meet Jesus!"}],"assignment":"Play market! Start with 30 pennies. Take away 3 for the road, 3 for Rome, and 1 for the temple. How many are left?"},{"id":"hist-11","bible":"mat-11","bibleTitle":"The Twelve Are Sent Out","title":"Travel in the Roman World","era":"1st century AD","intro":"Jesus sent his twelve apostles out with almost nothing. Later, they carried the good news all over the world. How did people travel back then?","sections":[{"h":"Roman Roads","p":["Romans built thousands of miles of stone roads! They made them curved on top so rain would run off. Stones on the side marked each mile.","Most people walked, about 15 to 20 miles a day. Rich people rode donkeys or horses."]},{"h":"Welcoming Travelers","p":["Inns were often dirty and unsafe. So travelers stayed in people's homes. Jewish people believed welcoming guests was very important, just like Abraham did.","Roads could be dangerous too. Robbers hid along lonely roads. That's where the story of the Good Samaritan happens!"]},{"h":"Where the Apostles Went","p":["Old stories say Peter went to Rome, John went to Ephesus, and Thomas traveled all the way to India! There are still churches in India that say Thomas started them."]}],"people":[{"name":"Thomas","role":"Apostle who, old stories say, went to India"},{"name":"Simon the Zealot","role":"An apostle who may have once wanted to fight Rome"}],"source":{"title":"Oration to Rome","who":"Aelius Aristides, a Greek speaker","date":"About AD 155","text":"A Greek speaker praised Rome for building bridges and cutting roads through mountains, so people could travel anywhere.","note":"God used Roman roads to help spread the good news about Jesus!"},"vocab":[["Apostle","'Sent one,' one of Jesus' twelve helpers"],["Milestone","A stone that marks each mile on a road"],["Hospitality","Welcoming guests"]],"map":{"view":"wide","places":["rome","jerusalem_w","antioch","ephesus","athens","alexandria"],"caption":"Roman roads and sea routes connected the cities where the apostles would travel."},"timeline":[{"y":-312,"t":"Rome begins building its first great road"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"About how far could people walk in a day?","options":["100 miles","1 mile","15-20 miles"],"answer":2,"why":"That's a lot of walking!"},{"q":"Why were Roman roads curved on top?","options":["So rain would run off","For racing","To look pretty"],"answer":0,"why":"Smart building!"},{"q":"Where did travelers usually stay?","options":["In trees","In hotels","In people's homes"],"answer":2,"why":"Hospitality was important."},{"q":"Where do old stories say Thomas went?","options":["America","India","Australia"],"answer":1,"why":"Far away!"}],"assignment":"Find India on a map or globe. Talk about how long it would take to walk there!"},{"id":"hist-12","bible":"mat-12","bibleTitle":"Come to Me, All Who Are Tired","title":"The Sabbath and a Prison Fortress","era":"About AD 28-29","intro":"The Sabbath was a special day of rest for Jewish people. Let's learn why people argued about it with Jesus.","sections":[{"h":"A Special Day","p":["The Sabbath went from sunset Friday to sunset Saturday. God said to rest on the seventh day. Back then, most people worked every day, so this made Jewish people stand out."]},{"h":"Lots of Extra Rules","p":["God said not to work on the Sabbath. But what counts as work? Teachers made 39 kinds of rules about it! You couldn't even walk more than about two-thirds of a mile.","When Jesus' hungry disciples picked some grain on the Sabbath, some leaders said that was work. Jesus said the Sabbath was made to help people and to do good."]},{"h":"John's Prison","p":["John the Baptist was locked up in a fortress called Machaerus, on top of a tall mountain by the Dead Sea. Archaeologists have found its ruins. No one could escape from there."]}],"people":[{"name":"John the Baptist","role":"Prophet who was put in prison by Herod Antipas"}],"source":{"title":"The Mishnah, Shabbat 7:2","who":"Jewish rabbis","date":"Written down about AD 200","text":"Old Jewish writings list 39 kinds of work not allowed on the Sabbath, like planting, harvesting, baking, writing, and building.","note":"Jesus cared about the heart of the Sabbath: rest and doing good."},"vocab":[["Sabbath","God's day of rest"],["Fortress","A strong building made to protect people"],["Rest","Taking a break from work"]],"map":{"view":"local","places":["machaerus","jerusalem","capernaum","qumran"],"caption":"John was kept in prison at Machaerus, on a mountain east of the Dead Sea."},"timeline":[{"y":-167,"t":"The Maccabees stand up for God's law"}],"video":[["Drive Thru History: Jesus Teaches With Authority","https://watch.tbn.org/s/Q9aSuuiu?e=GcAR88FY"]],"quiz":[{"q":"When did the Sabbath start?","options":["Sunday morning","Noon","Sunset on Friday"],"answer":2,"why":"Friday at sunset."},{"q":"How many kinds of work did teachers forbid?","options":["3","100","39"],"answer":2,"why":"Lots of rules!"},{"q":"What did Jesus say the Sabbath was for?","options":["Rest and doing good","Working hard","Being bored"],"answer":0,"why":"God made it for people."},{"q":"Where was John in prison?","options":["A boat","A cave","A fortress on a mountain"],"answer":2,"why":"A fortress called Machaerus."}],"assignment":"Plan a family rest time: a few hours with no chores, just rest, worship, and fun together.","hope":["John was in prison and felt worried. Jesus sent him a kind message: 'I am healing people, just like the prophets said!'","Then Jesus said, 'Come to me, all who are tired, and I will give you rest.'"]},{"id":"hist-13","bible":"mat-13","bibleTitle":"Stories About the Kingdom","title":"Farming in Galilee","era":"Timeless, and a 3,000-year-old calendar","intro":"Most people who heard Jesus were farmers. His stories about seeds and soil came from their everyday lives!","sections":[{"h":"The Farming Year","p":["Israel has a rainy winter and a dry summer. In the fall, rain softens the ground for planting. In spring, rain helps the grain grow.","Barley was harvested in the spring and wheat in early summer. Then came figs, grapes, and olives."]},{"h":"Throwing Seeds","p":["Farmers threw seeds by hand. So seeds landed everywhere: on hard paths, on rocky ground, in weeds, and on good soil, just like Jesus' story!"]},{"h":"Mustard Seeds and Yeast","p":["A mustard seed is super tiny, but it grows into a bush taller than a grown-up! Back then, there were no yeast packets. People saved a lump of old dough and mixed it into new dough to make it rise.","God's kingdom started small, with a few disciples, and spread all over the world!"]}],"people":[{"name":"Farmers of Galilee","role":"The people who first heard Jesus' seed stories"}],"source":{"title":"The Gezer Calendar","who":"An unknown writer, possibly a student practicing writing","date":"About the 10th century BC","text":"An old stone lists the farm year: two months of olive harvest, two months of planting, a month of barley harvest, a month of wheat harvest, two months of grapes, and a month of summer fruit.","note":"This little stone is almost 3,000 years old! It might have been a kid practicing writing."},"vocab":[["Harvest","Gathering crops when they're ready"],["Soil","Dirt that plants grow in"],["Yeast","Something that makes bread puff up"]],"map":{"view":"local","places":["capernaum","magdala","nazareth","tabor"],"caption":"Jesus told his seed stories from a boat near rich farmland by the Sea of Galilee."},"timeline":[{"y":-950,"t":"Someone writes the Gezer farming calendar"},{"y":1908,"t":"The Gezer calendar stone is found","d":true}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"How did farmers plant seeds?","options":["With a tractor","With a drone","Threw them by hand"],"answer":2,"why":"That's why seeds landed everywhere."},{"q":"How big does a mustard bush grow?","options":["Smaller than an ant","As big as a house","Taller than a grown-up"],"answer":2,"why":"From a tiny seed!"},{"q":"How did people make bread rise?","options":["Mixed in old dough","Added sugar","Bought yeast at the store"],"answer":0,"why":"Old dough worked like yeast."},{"q":"When was barley harvested?","options":["Never","Winter","Spring"],"answer":2,"why":"Around Passover."}],"assignment":"Plant seeds in four cups: hard dirt, rocks, dirt with grass clippings, and good soil. Watch for two weeks!"},{"id":"hist-14","bible":"mat-14","bibleTitle":"Five Loaves and Walking on Water","title":"Herod Antipas, the Fox of Galilee","era":"About AD 29-39","intro":"Matthew 14 starts with sad news about John the Baptist, who was brave and faithful to God. A Jewish history writer named Josephus tells us more about Herod Antipas.","sections":[{"h":"'That Fox'","p":["Herod Antipas was a son of Herod the Great. He ruled Galilee. Jesus called him 'that fox,' because he was sneaky.","Herod Antipas married his brother's wife. John the Baptist said that was wrong, so Herod put John in prison."]},{"h":"Two Writers Agree","p":["Matthew and Josephus both tell us that Herod put John in prison and that John died there. Josephus, who was not a Christian, said Herod was worried because John was so popular with the people.","Both writers say people respected John very much."]},{"h":"The Fourth Watch","p":["Matthew 14 ends with Jesus walking on water 'in the fourth watch of the night.' Romans split the night into four parts. The fourth watch was from 3 to 6 in the morning! The disciples had been rowing almost all night."]}],"people":[{"name":"Herod Antipas","role":"Ruler of Galilee, a son of Herod the Great"},{"name":"Josephus","role":"A Jewish writer who wrote about John the Baptist"}],"source":{"title":"Jewish Antiquities, Book 18","who":"Josephus","date":"About AD 93","text":"Josephus wrote that John, called the Baptist, was a good man who told people to treat each other fairly, love God, and be baptized.","note":"Josephus wasn't a Christian, but he wrote about John too!"},"vocab":[["Ruler","A person in charge of a land"],["Watch","One part of the night"],["Historian","A person who writes about the past"]],"map":{"view":"local","places":["machaerus","tiberias","bethsaida","capernaum"],"caption":"Herod Antipas ruled from Tiberias. Jesus fed the 5,000 near Bethsaida."},"timeline":[{"y":36,"t":"King Aretas defeats Herod Antipas"},{"y":39,"t":"Herod Antipas is sent away by the emperor"}],"video":[["Drive Thru History: Jesus Travels the Sea of Galilee","https://watch.tbn.org/s/Q9aSuuiu?e=36KBbf4d"]],"quiz":[{"q":"What did Jesus call Herod Antipas?","options":["That fox","My friend","That lion"],"answer":0,"why":"He was sneaky."},{"q":"Why did John say Herod was wrong?","options":["He was too tall","He married his brother's wife","He liked fish"],"answer":1,"why":"John told the truth."},{"q":"What time was the fourth watch?","options":["3 to 6 in the morning","Noon","Bedtime"],"answer":0,"why":"Very early morning!"}],"assignment":"Draw the night split into four watches. Put Jesus walking on water in the fourth one!","hope":["John the Baptist was brave and always told the truth. Jesus said no one was greater than John!","And right after this sad news, Jesus fed more than 5,000 people and walked on the water. Jesus is a King who takes care of his people."]},{"id":"hist-15","bible":"mat-15","bibleTitle":"What Makes a Person Unclean, and a Mother's Great Faith","title":"Tyre, Sidon, and the Gentiles","era":"332 BC to 1st century AD","intro":"Jesus visited Tyre and Sidon, two cities by the sea. There he met a mother who was not Jewish. Let's learn why that was surprising.","sections":[{"h":"Cities by the Sea","p":["Tyre and Sidon belonged to the Phoenicians, a people of sailors and traders. They helped spread the alphabet! Our ABCs came from their letters.","Tyre made purple dye from sea snails. It took thousands of snails to make a tiny bit, so purple cloth was super expensive. Kings wore purple!"]},{"h":"Jews and Gentiles","p":["A Gentile is anyone who is not Jewish. Many Jewish people didn't eat with Gentiles or go into their homes.","The woman who came to Jesus was a Canaanite, from an old enemy of Israel. But Jesus helped her because of her faith!"]},{"h":"A Wall in the Temple","p":["In the temple, Gentiles could go into the outer yard but no farther. A wall with warning signs kept them out. Archaeologists found one of those signs!","Later, Paul wrote that Jesus broke down the wall between Jews and Gentiles. Now everyone can come to God through Jesus!"]}],"people":[{"name":"Alexander the Great","role":"A Greek king who captured Tyre"}],"source":{"title":"The Temple Warning Inscription","who":"Posted in Herod's temple","date":"Before AD 70; found in 1871","text":"The sign said that no foreigner may go past this wall around the temple. Anyone who does will be in big trouble.","note":"Jesus broke down the wall! Now everyone can come to God (Ephesians 2:14)."},"vocab":[["Gentile","Anyone who is not Jewish"],["Phoenicians","Sailors and traders from Tyre and Sidon"],["Alphabet","The letters we use to write"]],"map":{"view":"local","places":["tyre","sidon","capernaum","caesareaphilippi"],"caption":"Tyre and Sidon were cities by the sea, north of Galilee."},"timeline":[{"y":-332,"t":"Alexander the Great captures Tyre"},{"y":1871,"t":"The temple warning sign is found","d":true}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What did Tyre make from sea snails?","options":["Purple dye","Shoes","Soup"],"answer":0,"why":"Purple was for kings!"},{"q":"What is a Gentile?","options":["A kind of snail","A king","Anyone who isn't Jewish"],"answer":2,"why":"Jesus came for Gentiles too."},{"q":"What did the temple wall do?","options":["Held up the roof","Kept water in","Kept Gentiles out"],"answer":2,"why":"But Jesus broke the wall down!"},{"q":"What did the Phoenicians help spread?","options":["The alphabet","Soccer","Pizza"],"answer":0,"why":"Our ABCs!"}],"assignment":"Write the alphabet in your fanciest letters. Then color something purple and pretend you're a king!","hope":["A wall in the temple kept people who weren't Jewish out. But Jesus welcomed a mother who wasn't Jewish and praised her faith!","Because of Jesus, people from every country are welcome in God's family, including you."]},{"id":"hist-16","bible":"mat-16","bibleTitle":"Who Do You Say I Am?","title":"Caesarea Philippi: City of Pan and Caesar","era":"20 BC to AD 30","intro":"Jesus asked, 'Who do you say I am?' in a place full of temples to false gods and to the Roman emperor.","sections":[{"h":"A Spring and a Cave","p":["At the bottom of a tall mountain, a big spring of water comes out of a cliff. It's one of the starts of the Jordan River! Greek people made the cave a place to worship a false god named Pan. You can still see the holes they carved in the cliff for statues."]},{"h":"Temples to Caesar","p":["Herod built a white marble temple there for the emperor. Later the town was named Caesarea Philippi, after Caesar.","So in this one spot, people worshiped a false god and the Roman emperor. Right there, Peter said, 'You are the Messiah, the Son of the living God!'"]},{"h":"What Kind of King?","p":["Many people thought the Messiah would be a warrior king who would beat Rome. That's why Peter was upset when Jesus said he would suffer and die. But Jesus was a different kind of King."]}],"people":[{"name":"Simon Peter","role":"Said Jesus is the Messiah"},{"name":"Philip","role":"A son of Herod who named the town Caesarea Philippi"}],"source":{"title":"Psalms of Solomon 17","who":"Unknown Jewish writer","date":"About 50 BC","text":"An old Jewish prayer asks God to send a king from David's family to drive out Israel's enemies.","note":"People wanted a warrior king. Jesus came as a King who would die to save us."},"vocab":[["Messiah","The King God promised to send"],["Temple","A building for worship"],["False god","Something people worship that is not the true God"]],"map":{"view":"local","places":["caesareaphilippi","hermon","bethsaida","capernaum"],"caption":"Caesarea Philippi was at the foot of Mount Hermon, north of the Sea of Galilee."},"timeline":[{"y":-20,"t":"Herod builds a temple for the emperor"},{"y":-2,"t":"The town is named Caesarea Philippi"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"What river starts near Caesarea Philippi?","options":["The Nile","The Jordan","The Tigris"],"answer":1,"why":"A big spring flows from the cliff."},{"q":"Who was worshiped there?","options":["Nobody","Only God","Pan and the emperor"],"answer":2,"why":"False gods and Caesar."},{"q":"What did Peter say?","options":["You are the Messiah, the Son of the living God","You are a good teacher","You are a fisherman"],"answer":0,"why":"Peter said who Jesus really is."}],"assignment":"Draw the cliff with the cave and the temple. Write Peter's words across the top in big letters."},{"id":"hist-17","bible":"mat-17","bibleTitle":"Glory on the Mountain","title":"Holy Mountains and the Temple Tax","era":"59 BC to AD 71","intro":"Which mountain did Jesus shine on? And why did Peter find a coin in a fish? History helps us understand both!","sections":[{"h":"Which Mountain?","p":["Matthew just says 'a high mountain.' For a long time, people have said it was Mount Tabor. Others think it was Mount Hermon, which is very tall and often has snow on top. We don't know for sure, and that's okay!"]},{"h":"The Temple Tax","p":["Every Jewish man paid a small tax each year for the temple. It had to be paid with special silver coins.","The coin Peter found in the fish was worth exactly enough to pay the tax for two people: Jesus and Peter!"]},{"h":"After the Temple","p":["After the Romans destroyed the temple, they made Jewish people keep paying the tax, but to a Roman false god. That was mean. People reading Matthew remembered that Jesus paid the tax to keep peace."]}],"people":[{"name":"Moses and Elijah","role":"Appeared with Jesus on the mountain"}],"source":{"title":"In Defense of Flaccus (Pro Flacco)","who":"Cicero","date":"59 BC","text":"A Roman speaker complained that every year lots of gold was sent to Jerusalem from Jewish people all over the world.","note":"Jewish people everywhere sent their temple tax to Jerusalem."},"vocab":[["Transfiguration","When Jesus shone bright on the mountain"],["Tax","Money people must pay"],["Coin","A piece of metal money"]],"map":{"view":"local","places":["tabor","hermon","caesareaphilippi","capernaum"],"caption":"Two mountains where the Transfiguration may have happened: Mount Tabor and Mount Hermon."},"timeline":[{"y":-59,"t":"A Roman speaker talks about temple gold"},{"y":71,"t":"Rome makes Jewish people pay the tax to a false god"}],"video":[["Drive Thru History: Jesus Travels North","https://watch.tbn.org/s/Q9aSuuiu?e=blcTcLsk"]],"quiz":[{"q":"Which mountain is the traditional place where Jesus shone?","options":["Mount Everest","Mount Tabor","Mount Sinai"],"answer":1,"why":"Some think it was Mount Hermon."},{"q":"Who paid the temple tax?","options":["Only kids","Every Jewish man","Only kings"],"answer":1,"why":"Once a year."},{"q":"How many people did Peter's coin pay for?","options":["Two","Ten","One"],"answer":0,"why":"Jesus and Peter!"}],"assignment":"Look at a coin. Draw both sides. Then draw Peter's coin coming out of a fish!"},{"id":"hist-18","bible":"mat-18","bibleTitle":"The Lost Sheep and Forgiving Seventy-Seven Times","title":"Shepherds, Debts, and a King's Treasury","era":"1st century AD","intro":"Jesus told a story about a servant who owed a giant amount of money. Some history math shows just how huge it was!","sections":[{"h":"Shepherds","p":["Sheep gave people wool, milk, cheese, and meat. A flock of 100 sheep was a good size. At night, shepherds put sheep in stone pens and counted them as they went in.","Shepherding was hard work. But God calls himself our Shepherd, and King David started out as a shepherd."]},{"h":"A Giant Debt","p":["The servant owed 10,000 talents. One talent was about 20 years of pay! 10,000 was the biggest number with a name in Greek. So Jesus used the biggest number and the biggest money!","All of King Herod's lands only made about 900 talents a year. The servant could never, ever pay it back. But the king forgave it all!"]},{"h":"A Small Debt","p":["The other servant owed 100 denarii, about 100 days of work. That's real money, but tiny compared to the first debt. Jesus was showing how much God forgives us."]}],"people":[{"name":"King David","role":"Was a shepherd before he became king"}],"source":{"title":"Jewish Antiquities, Book 17","who":"Josephus","date":"About AD 93","text":"Josephus wrote that Herod's sons got about 600 talents, 200 talents, and 100 talents from their lands each year.","note":"That's only 900 talents a year. The servant owed 10,000!"},"vocab":[["Talent","A huge amount of money, about 20 years of pay"],["Debt","Money you owe"],["Forgive","To let go of what someone owes you"]],"map":{"view":"local","places":["bethlehem","jerusalem","herodium","capernaum"],"caption":"The hills around Bethlehem have been sheep country since King David's time."},"timeline":[],"video":[],"quiz":[{"q":"How much was one talent?","options":["One penny","One sheep","About 20 years of pay"],"answer":2,"why":"A huge amount!"},{"q":"How many talents did the servant owe?","options":["10","1","10,000"],"answer":2,"why":"He could never pay it back."},{"q":"What did the king do?","options":["Sold his house","Forgave it all","Laughed"],"answer":1,"why":"Just like God forgives us."},{"q":"Where did shepherds keep sheep at night?","options":["In the house","In stone pens","In trees"],"answer":1,"why":"And they counted them!"}],"assignment":"Count to 100. Then imagine counting to 10,000! Talk about how much God has forgiven us.","hope":["The servant owed so much money he could never pay it back. But the king forgave all of it!","That's what God does for us through Jesus. Because God forgives us, we can forgive others too."]},{"id":"hist-19","bible":"mat-19","bibleTitle":"Let the Children Come","title":"Growing Up in the First Century","era":"1st century AD","intro":"The disciples thought Jesus was too busy for kids. Let's learn how people thought about children long ago.","sections":[{"h":"Kids in Jewish Families","p":["Jewish families believed children were a gift from God. Parents taught their kids God's Word at home and on walks. Dads taught sons their jobs, and moms taught daughters how to run a home.","Many boys went to school at the synagogue starting around age six. They memorized lots of the Bible!"]},{"h":"Kids in the Roman World","p":["In the Roman world, kids weren't treated as very important until they grew up. Sadly, some babies who weren't wanted were left outside.","Jewish people and Christians said that was wrong. Christians even rescued babies! Jesus' words, 'Let the little children come to me,' helped change how the world treats children."]},{"h":"Jesus Loves Kids","p":["When Jesus welcomed children and blessed them, he showed that kids matter to God. God's kingdom belongs to people who trust him like children do!"]}],"people":[{"name":"Tacitus","role":"A Roman writer"}],"source":{"title":"Histories, Book 5","who":"Tacitus","date":"About AD 105","text":"Tacitus, a Roman writer, said that the Jewish people believed it was wrong to hurt any newborn baby.","note":"Tacitus didn't like Jewish people, but even he noticed they protected babies."},"vocab":[["Synagogue school","Where Jewish boys learned to read the Bible"],["Bless","To ask God to do good for someone"],["Memorize","To learn something by heart"]],"map":{"view":"local","places":["jordanbaptism","jericho","jerusalem","capernaum"],"caption":"Jesus left Galilee and traveled toward Jerusalem."},"timeline":[{"y":64,"t":"Schools for boys are set up in every town"},{"y":105,"t":"Tacitus writes his history"}],"video":[],"quiz":[{"q":"How did Jewish families see children?","options":["As workers only","As a bother","As a gift from God"],"answer":2,"why":"Children are a blessing!"},{"q":"Where did many Jewish boys go to school?","options":["Nowhere","The synagogue","The temple only"],"answer":1,"why":"They memorized Scripture."},{"q":"What did Jesus say about kids?","options":["Be quiet","Let the little children come to me","Go away"],"answer":1,"why":"Jesus loves kids!"}],"assignment":"Ask a parent or grandparent what school was like when they were your age. How was it different?"},{"id":"hist-20","bible":"mat-20","bibleTitle":"Last Will Be First","title":"Work, Wages, and the City of Palms","era":"1st century AD","intro":"Jesus' story about vineyard workers uses real times of day and real pay. Then Matthew 20 ends in Jericho, one of the oldest cities in the world!","sections":[{"h":"Waiting for Work","p":["Many poor men didn't have their own land. Each morning they waited in the market, hoping someone would hire them for the day. God's law said to pay them before sunset, because they needed money for dinner that night!"]},{"h":"Telling Time","p":["Jewish people counted hours from sunrise, about 6 a.m. So the third hour was 9 a.m., the sixth hour was noon, and the eleventh hour was 5 p.m., just one hour before quitting!","We still say 'at the eleventh hour' when something happens at the last minute."]},{"h":"Jericho, City of Palms","p":["Jericho has a big spring of water, so palm trees grow there in the desert. People have lived there for about 10,000 years! King Herod built a winter palace there with swimming pools."]}],"people":[{"name":"Bartimaeus","role":"A blind man Jesus healed near Jericho"}],"source":{"title":"The Jewish War, Book 4","who":"Josephus","date":"About AD 75","text":"Josephus wrote that Jericho's spring waters a land full of palm trees and sweet-smelling plants. He said it was a wonderful place.","note":"Jericho is like a green island in the desert."},"vocab":[["Day laborer","A worker hired for one day"],["Oasis","A green place with water in the desert"],["Eleventh hour","The last minute"]],"map":{"view":"local","places":["jericho","jerusalem","bethany","jordanbaptism"],"caption":"A steep road climbs from Jericho through the desert up to Jerusalem."},"timeline":[{"y":-34,"t":"Mark Antony gives Jericho's groves to Cleopatra"}],"video":[],"quiz":[{"q":"When did Jewish people start counting hours?","options":["Noon","Midnight","Sunrise"],"answer":2,"why":"About 6 a.m."},{"q":"What time was the eleventh hour?","options":["Midnight","5 p.m.","11 a.m."],"answer":1,"why":"One hour before quitting!"},{"q":"When did God say to pay workers?","options":["Next month","Before sunset","Never"],"answer":1,"why":"They needed food that night."},{"q":"Why do palm trees grow in Jericho?","options":["It rains a lot","It has a big spring","It snows"],"answer":1,"why":"It's an oasis!"}],"assignment":"Make a clock chart: write 6 a.m. as 'first hour' and keep going. When were the workers hired?"},{"id":"hist-21","bible":"mat-21","bibleTitle":"The King Rides Into Jerusalem","title":"Jerusalem and Herod's Temple","era":"20 BC to AD 63","intro":"When Jesus came into Jerusalem, it was full of people for Passover. Above the city stood King Herod's amazing temple!","sections":[{"h":"A Wonder of the World","p":["King Herod made the temple area huge, as big as about 27 football fields! Some of the stones weigh as much as many elephants. Part of the wall still stands today. It's called the Western Wall, and people go there to pray."]},{"h":"Passover Crowds","p":["At Passover, Jewish people came from all over the world. Jerusalem was packed! The Roman governor Pilate brought extra soldiers to keep order."]},{"h":"Palms and a Donkey","p":["Waving palm branches meant 'Our king wins!' So the crowd was cheering for Jesus as a king. But Jesus rode a gentle donkey, showing he came in peace.","In the temple's outer yard, people were selling animals and changing money, sometimes cheating. That yard was the only place where Gentiles could pray. That's why Jesus said, 'My house will be a house of prayer for all nations.'"]}],"people":[{"name":"Herod the Great","role":"Rebuilt the temple"},{"name":"Pontius Pilate","role":"Roman governor who came to Jerusalem at Passover"}],"source":{"title":"The Jewish War, Book 5","who":"Josephus","date":"About AD 75","text":"Josephus wrote that the temple was covered with gold. When the sun rose, it shone so brightly people had to look away. From far away, it looked like a snowy mountain!","note":"Imagine seeing that as you walked toward Jerusalem!"},"vocab":[["Temple","God's special house in Jerusalem"],["Pilgrim","A person who travels to a holy place"],["Western Wall","Part of Herod's temple wall that still stands"]],"map":{"view":"local","places":["jerusalem","bethany","jericho","caesarea"],"caption":"Jesus came from Jericho, stayed in Bethany, and rode into Jerusalem."},"timeline":[{"y":-20,"t":"Herod begins rebuilding the temple"},{"y":63,"t":"Herod's temple is finally finished"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"What part of Herod's temple still stands?","options":["Nothing","The Western Wall","The roof"],"answer":1,"why":"People pray there today."},{"q":"What did palm branches mean?","options":["Let's eat","It's hot","Our king wins!"],"answer":2,"why":"They cheered for Jesus as King."},{"q":"What did the temple look like from far away?","options":["A tree","A snowy mountain","A boat"],"answer":1,"why":"It was white and gold!"}],"assignment":"Draw Herod's temple shining with gold. Draw Jesus riding in on a donkey with people waving palms."},{"id":"hist-22","bible":"mat-22","bibleTitle":"The Greatest Commandment","title":"Caesar's Coin and Rival Parties","era":"AD 14-37","intro":"Jesus asked for a coin and said, 'Whose picture is this?' Coins like that one still exist today!","sections":[{"h":"The Emperor's Coin","p":["The coin was a silver denarius. On the front was a picture of Emperor Tiberius. The words on it called him 'son of the divine Augustus.' That means they said his dad was a god!","Jewish people didn't like this. They knew there is only one true God."]},{"h":"A Trick Question","p":["Some people wanted Rome's taxes paid. Others hated them. If Jesus said 'pay,' the crowd would be mad. If he said 'don't pay,' Rome would arrest him.","Jesus said, 'Give to Caesar what is Caesar's, and to God what is God's.' The coin has Caesar's picture. But you have God's image! So give yourself to God."]},{"h":"Another Tricky Question","p":["The Sadducees didn't believe people would rise from the dead. They asked a tricky question to make that idea look silly. But Jesus answered with Scripture. God is the God of the living!"]}],"people":[{"name":"Tiberius","role":"Roman emperor whose face was on the coin"},{"name":"The Sadducees","role":"Leaders who didn't believe in rising from the dead"}],"source":{"title":"The Tiberius Denarius","who":"Minted at Lugdunum (modern Lyon, France)","date":"AD 14-37","text":"On the front of the coin is Tiberius's face and the words 'Tiberius Caesar, son of the divine Augustus.' On the back is a woman sitting on a chair.","note":"You can see coins like this in museums today!"},"vocab":[["Denarius","A silver Roman coin"],["Image","A picture or likeness"],["Inscription","Words stamped or carved on something"]],"map":{"view":"wide","places":["rome","jerusalem_w"],"caption":"Coins with the emperor's face traveled all over the empire, even to Jerusalem."},"timeline":[{"y":14,"t":"Tiberius becomes emperor"},{"y":37,"t":"Tiberius dies"}],"video":[["Drive Thru History: Jesus Arrives in Jerusalem","https://watch.tbn.org/s/Q9aSuuiu?e=FY1YQ85W"]],"quiz":[{"q":"Whose picture was on the coin?","options":["Moses","Tiberius Caesar","Jesus"],"answer":1,"why":"The Roman emperor."},{"q":"Whose image are you made in?","options":["Nobody's","Caesar's","God's"],"answer":2,"why":"So give yourself to God!"},{"q":"What did the Sadducees not believe in?","options":["Rising from the dead","Money","The temple"],"answer":0,"why":"Jesus showed them they were wrong."}],"assignment":"Look at a coin. Whose picture is on it? Then look in a mirror and remember: you're made in God's image!"},{"id":"hist-23","bible":"mat-23","bibleTitle":"Be Ready: Jesus Will Return","title":"Jerusalem and the Temple, AD 70","era":"AD 66-81","intro":"Jesus said that not one stone of the temple would be left standing. About 40 years later, it happened!","sections":[{"h":"Trouble With Rome","p":["Jewish people and Romans had been unhappy with each other for a long time. About 36 years after Jesus died and rose again, the people of Jerusalem rose up and pushed the Romans out. So Rome sent a big army to take the city back."]},{"h":"The Temple Comes Down","p":["A Roman general named Titus and his army surrounded Jerusalem. It was a very hard time for the people inside.","Finally the Romans took the city, and the temple was destroyed. They knocked the big stones down, just as Jesus said. You can still see some of those stones in Jerusalem today!"]},{"h":"Christians Escape","p":["An old church history says Christians in Jerusalem remembered Jesus' warning and left the city before the Roman army got there. They went to a safe town called Pella.","In Rome, there's still a stone arch with carvings of soldiers carrying away the temple's golden lampstand."]}],"people":[{"name":"Titus","role":"Roman general who captured Jerusalem"},{"name":"Josephus","role":"Jewish writer who saw the war"}],"source":{"title":"Church History, Book 3","who":"Eusebius","date":"About AD 325","text":"Eusebius wrote that before the trouble came, the Christians in Jerusalem were warned to leave the city and go to a town called Pella. They did.","note":"Jesus had told his followers to run to the mountains when they saw the signs (Matthew 24:16)."},"vocab":[["Revolt","When people rise up against their rulers"],["Siege","When an army surrounds a city"],["Arch","A curved stone gateway"]],"map":{"view":"local","places":["jerusalem","pella","masada","caesarea"],"caption":"Christians escaped to Pella, across the Jordan River."},"timeline":[{"y":66,"t":"The people of Judea rise up against Rome"},{"y":70,"t":"The Romans destroy Jerusalem and the temple"},{"y":73,"t":"The last fortress, Masada, falls"},{"y":81,"t":"The Arch of Titus is built in Rome"}],"video":[],"quiz":[{"q":"What did Jesus say would happen to the temple?","options":["It would get bigger","It would move","Not one stone would be left standing"],"answer":2,"why":"It happened about 40 years later."},{"q":"Who captured Jerusalem?","options":["Titus","Herod","Peter"],"answer":0,"why":"A Roman general."},{"q":"Where did the Christians go?","options":["Rome","Egypt","Pella"],"answer":2,"why":"They remembered Jesus' warning."},{"q":"What does the Arch of Titus show?","options":["A wedding","A big fish","Soldiers carrying the temple lampstand"],"answer":2,"why":"It still stands in Rome."}],"assignment":"Build a tower with blocks, then take it apart and count the blocks. Read Matthew 24:2 and talk about how Jesus always tells the truth.","hope":["Everything Jesus said came true, so we can trust all of his promises!","God kept Jesus' followers safe. And even without the temple building, God was still with his people. The Bible says God now lives in everyone who believes in Jesus."]},{"id":"hist-24","bible":"mat-24","bibleTitle":"Lamps, Talents, Sheep and Goats","title":"Weddings, Lamps, and Buried Treasure","era":"1st to 3rd century AD","intro":"Jesus' stories in Matthew 25 talk about a nighttime wedding, little oil lamps, and buried money. Archaeology helps bring them to life!","sections":[{"h":"A Jewish Wedding","p":["First, a couple got engaged. About a year later came the wedding. The groom and his friends went to get the bride and walked her back to his home in a happy parade, often at night!","Friends waited along the way with lamps to join the parade. Then there was a party that could last a whole week! If the groom was late, everyone had to wait and be ready."]},{"h":"Little Lamps","p":["Lamps were small clay dishes that fit in your hand. They held a little olive oil and a wick. They only burned for a few hours. On a long night, you needed extra oil!"]},{"h":"Buried Money","p":["Burying money was the most common way to keep it safe from thieves. So the third servant played it safe. But his problem was that he was afraid and didn't use what his master gave him."]}],"people":[{"name":"Herais","role":"A mom in Egypt who sent a wedding invitation long ago"}],"source":{"title":"A Wedding Invitation (Oxyrhynchus Papyrus 111)","who":"A mother named Herais, in Roman Egypt","date":"About AD 200","text":"Herais invites you to dinner at the wedding of her children, at her house, tomorrow, starting at the ninth hour.","note":"This invitation was found in an old trash pile in Egypt. It's about 1,800 years old!"},"vocab":[["Engaged","Promised to marry someone"],["Wick","A string that burns in a lamp"],["Invitation","A note asking someone to come"]],"map":{"view":"wide","places":["alexandria","memphis","jerusalem_w"],"caption":"The old wedding invitation was found in Egypt, along the Nile River."},"timeline":[{"y":200,"t":"Herais sends a wedding invitation"},{"y":1896,"t":"Archaeologists start digging in an old trash pile in Egypt","d":true}],"video":[],"quiz":[{"q":"When did wedding parades often happen?","options":["Never","At breakfast","At night"],"answer":2,"why":"So people needed lamps!"},{"q":"What were lamps made of?","options":["Plastic","Glass","Clay"],"answer":2,"why":"Little clay dishes with oil."},{"q":"Why did the wise women need extra oil?","options":["Lamps only burned a few hours","To cook","To sell"],"answer":0,"why":"They were ready!"},{"q":"What was the third servant's problem?","options":["He spent it all","He was afraid and didn't use his gift","He lost it"],"answer":1,"why":"God wants us to use our gifts."}],"assignment":"Write a wedding invitation like Herais did. Then talk about how we can be ready for Jesus."},{"id":"hist-25","bible":"mat-25","bibleTitle":"The Last Supper and the Garden","title":"Passover, Caiaphas, and the Oil Press","era":"AD 18-36","intro":"Jesus' last night before the cross was during Passover. The high priest who judged Jesus left behind a stone box with his name on it!","sections":[{"h":"The Passover Meal","p":["Passover remembered how God saved Israel from Egypt. Families ate roasted lamb, flat bread, and bitter herbs.","By Jesus' time, people leaned on cushions around a low table while they ate. It showed they were free people, not slaves!"]},{"h":"Caiaphas the High Priest","p":["Caiaphas was the high priest who questioned Jesus. In 1990, workers building a park in Jerusalem found an old family cave by accident. Inside were carved stone boxes. One fancy box had the name 'Joseph son of Caiaphas' scratched on it! Many people think it belonged to the same Caiaphas's family."]},{"h":"Gethsemane","p":["Gethsemane means 'olive press.' The Mount of Olives was covered with olive trees. People pressed olives under heavy stones to make oil. It was in this garden that Jesus prayed so hard before going to the cross."]}],"people":[{"name":"Caiaphas","role":"High priest who questioned Jesus"},{"name":"Judas Iscariot","role":"The disciple who betrayed Jesus"}],"source":{"title":"The Caiaphas Ossuary","who":"Carved for the Caiaphas family","date":"1st century AD; found in 1990","text":"Scratched on the side of a stone bone box are the words 'Joseph, son of Caiaphas.'","note":"This box might have belonged to the high priest in Matthew 26!"},"vocab":[["Passover","A feast remembering God saving Israel from Egypt"],["High priest","The most important priest at the temple"],["Gethsemane","'Olive press,' the garden where Jesus prayed"]],"map":{"view":"local","places":["jerusalem","bethany","bethlehem"],"caption":"The Mount of Olives, where Gethsemane was, is just east of Jerusalem."},"timeline":[{"y":18,"t":"Caiaphas becomes high priest"},{"y":1990,"t":"The Caiaphas box is found in Jerusalem","d":true}],"video":[["Drive Thru History: The Last Supper","https://watch.tbn.org/s/Q9aSuuiu?e=QfYSBn17"]],"quiz":[{"q":"What did Passover remember?","options":["Creation","Noah's ark","God saving Israel from Egypt"],"answer":2,"why":"God rescued his people!"},{"q":"Why did people lean on cushions at Passover?","options":["They were tired","To show they were free","It was a game"],"answer":1,"why":"Slaves didn't get to relax."},{"q":"What does Gethsemane mean?","options":["Olive press","Quiet place","Big garden"],"answer":0,"why":"Olives were pressed there."},{"q":"What was found with Caiaphas' name?","options":["A crown","A sword","A stone box"],"answer":2,"why":"Found by park workers!"}],"assignment":"Read Exodus 12 with a parent. Draw the first Passover and the Last Supper side by side.","hope":["Passover remembered how God rescued his people from Egypt. At the Last Supper, Jesus showed that he is the Lamb who rescues us from sin!","Jesus chose to go to the cross because he loves us. God was in charge the whole time."]},{"id":"hist-26","bible":"mat-26","bibleTitle":"The Cross","title":"Pontius Pilate and the Sign Above the Cross","era":"AD 26-36","intro":"For a long time, some people said Pontius Pilate wasn't real. Then, in 1961, archaeologists found his name carved in stone!","sections":[{"h":"Pilate the Governor","p":["Pontius Pilate was the Roman governor of Judea. He lived in a city by the sea called Caesarea and came to Jerusalem for big holidays. Old writers say he was stubborn and harsh."]},{"h":"The Pilate Stone","p":["In 1961, archaeologists were digging in an old theater in Caesarea. They found a stone with Latin words that say 'Pontius Pilate, Governor of Judea.' It proves Pilate was real, just like the Bible says!"]},{"h":"The Cross and the Tomb","p":["Above Jesus' cross, the Romans put a sign: 'This is Jesus, the King of the Jews.' It was written in three languages so everyone could read it. Without meaning to, Pilate told the whole world who Jesus really is!","Jesus was buried in a rich man's new tomb cut into rock. A big stone was rolled in front of it."]}],"people":[{"name":"Pontius Pilate","role":"Roman governor who sentenced Jesus"},{"name":"Tacitus","role":"A Roman writer who wrote about Jesus and Pilate"}],"source":{"title":"Annals, Book 15","who":"Tacitus","date":"About AD 116","text":"Tacitus wrote that Christians got their name from Christ, who was put to death by the governor Pontius Pilate when Tiberius was emperor.","note":"Even a Roman writer who didn't like Christians wrote that Jesus died under Pilate."},"vocab":[["Governor","A person who rules a land for someone else"],["Golgotha","The hill outside Jerusalem where Jesus died"],["Tomb","A place where someone is buried"]],"map":{"view":"local","places":["caesarea","jerusalem"],"caption":"Pilate lived at Caesarea, where the Pilate Stone was found. He came to Jerusalem for Passover."},"timeline":[{"y":26,"t":"Pilate becomes governor of Judea"},{"y":30,"t":"Jesus dies on the cross"},{"y":36,"t":"Pilate is removed from his job"},{"y":1961,"t":"The Pilate Stone is found","d":true}],"video":[],"quiz":[{"q":"What was found in 1961?","options":["A stone with Pilate's name","Jesus' cross","A boat"],"answer":0,"why":"It proves Pilate was real!"},{"q":"Where was the Pilate Stone found?","options":["In a tree","In a river","In an old theater in Caesarea"],"answer":2,"why":"In the city where Pilate lived."},{"q":"What did the sign on Jesus' cross say?","options":["Go away","Hello","This is Jesus, the King of the Jews"],"answer":2,"why":"Jesus really is the King!"},{"q":"Which Roman writer wrote about Jesus and Pilate?","options":["Caesar","Herod","Tacitus"],"answer":2,"why":"Even Romans wrote about Jesus."}],"assignment":"Draw the Pilate Stone and write 'PONTIUS PILATE' on it. Tell someone why finding it matters.","hope":["The sign above the cross said, 'This is Jesus, the King of the Jews.' It was true! Jesus really is the King.","And the cross wasn't the end. Three days later, Jesus rose from the dead! He died and rose again so we can be forgiven."]},{"id":"hist-27","bible":"mat-27","bibleTitle":"He Is Risen!","title":"The Empty Tomb and a Growing Church","era":"AD 30-313","intro":"Jesus is alive! After he rose, the church grew and grew. Even Roman leaders wrote letters about Christians.","sections":[{"h":"The Empty Tomb","p":["The leaders paid the guards to say the disciples stole Jesus' body. But even that story admits the tomb was empty! No one said Jesus' body was still there."]},{"h":"The Church Grows","p":["After Jesus went back to heaven, about 120 believers met together. On Pentecost, 3,000 more believed in one day! Soon there were churches in cities all over the Roman world. They used Roman roads to spread the good news."]},{"h":"Hard Times and Freedom","p":["Some Roman emperors were very mean to Christians and punished them. But the church kept growing!","About 300 years after Jesus, Emperor Constantine made a law that let Christians worship freely. The little group of disciples had grown all over the empire, just like Jesus said!"]}],"people":[{"name":"Pliny","role":"A Roman governor who wrote about Christians"},{"name":"Constantine","role":"Emperor who let Christians worship freely"}],"source":{"title":"Letter to Emperor Trajan (Letters 10.96)","who":"Pliny the Younger","date":"About AD 112","text":"Pliny wrote that Christians met early in the morning and sang a song to Christ as God. They promised not to steal, lie, or do wrong things. Then they ate a meal together.","note":"This is how a Roman leader saw the first Christians!"},"vocab":[["Church","God's people who follow Jesus"],["Persecution","Being treated badly for what you believe"],["Great Commission","Jesus' command to tell all nations about him"]],"map":{"view":"wide","places":["jerusalem_w","antioch","ephesus","corinth","rome","alexandria"],"caption":"Churches spread from Jerusalem all across the Roman world."},"timeline":[{"y":49,"t":"Christians are talked about in Rome"},{"y":64,"t":"Emperor Nero makes life hard for Christians"},{"y":112,"t":"Pliny writes a letter about Christians"},{"y":313,"t":"Christians are allowed to worship freely"}],"video":[["Drive Thru History: The Resurrection of Jesus","https://watch.tbn.org/s/Q9aSuuiu?e=tDaHdjCj"],["Drive Thru History: Who Is Jesus?","https://watch.tbn.org/s/Q9aSuuiu?e=e3cxhttZ"]],"quiz":[{"q":"What does the guards' story admit?","options":["The tomb was empty","Nothing","Jesus was still there"],"answer":0,"why":"Jesus is risen!"},{"q":"How many believed on Pentecost?","options":["3,000","1","12"],"answer":0,"why":"In one day!"},{"q":"What did Pliny say Christians sang?","options":["A song to Christ as God","Nothing","A song about fish"],"answer":0,"why":"Christians worshiped Jesus."},{"q":"Which emperor let Christians worship freely?","options":["Tiberius","Constantine","Nero"],"answer":1,"why":"The church kept growing!"}],"assignment":"You finished Matthew history! Pick your two favorite discoveries (like the Jesus Boat or the Pilate Stone). Draw them and tell a parent about them.","hope":["Nobody could stop the good news! The church kept growing and growing.","Jesus promised, 'I am with you always.' That promise is for you too!"]}]};

const COURSES = [

];

const cache = {};

/* ---------- state ---------- */
const LS = "ntw-g3-progress-v1";
let progress = {name:"", done:{}};
let db = null, pdoc = null, saveTimer = null;
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
progress = Object.assign(progress, lsGet(LS)||{});
function save(){
  lsSet(LS, progress);
  if(pdoc){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ pdoc.set(progress).then(()=>{ dbWriteOk=true; }).catch(()=>{ dbWriteOk=false; }); }, 300); }
}
/* progress is kept on this device only (no Claude account needed) */

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function loadCourse(c){ if(cache[c.id]) return cache[c.id]; cache[c.id] = EMBED[c.file] || await (await fetch(c.file)).json(); return cache[c.id]; }
function fmtYear(y){ if(y<0) return (-y)+" BC"; if(y<1000) return "AD "+y; return String(y); }
function updateStars(){ document.getElementById("starCount").textContent = Object.keys(progress.done).length; }

function mapSVG(spec){
  const m = MAPS[spec.view], wide = spec.view==="wide";
  const fs = wide ? {p:26, r:20, pin:9} : {p:19, r:14, pin:7};
  let s = `<svg viewBox="0 0 ${m.w} ${m.h}" role="img" aria-label="Map showing ${spec.places.map(p=>MAPS.places[p].n).join(", ")}">`;
  s += `<rect width="${m.w}" height="${m.h}" fill="var(--sea)"/><path class="m-land" d="${m.land}"/>`;
  if(!wide) s += `<path class="m-water" d="${m.water}"/><path class="m-river" d="${m.rivers}"/>`;
  for(const [n,x,y] of MAPS.regions[spec.view]) s += `<text class="m-region" x="${x}" y="${y}" font-size="${fs.r}" text-anchor="middle">${esc(n)}</text>`;
  for(const id of spec.places){
    const p = MAPS.places[id]; const left = p.a==="l";
    s += `<circle class="m-pin" cx="${p.x}" cy="${p.y}" r="${fs.pin}"/>`;
    s += `<text class="m-lbl" x="${p.x + (left?-1:1)*(fs.pin+5)}" y="${p.y + fs.p*0.35 + (p.dy||0)}" font-size="${fs.p}" text-anchor="${left?"end":"start"}">${esc(p.n)}</text>`;
  }
  return s + `</svg>`;
}

/* ---------- views ---------- */
let view = {name:"home"};
function go(v){ view=v; render(); window.scrollTo({top:0}); }
function setNav(){
  document.getElementById("tlBtn").setAttribute("aria-current", view.name==="timeline"?"page":"false");
  document.getElementById("setBtn").setAttribute("aria-current", view.name==="settings"?"page":"false");
}
async function render(){
  updateStars(); setNav();
  if(view.name==="home") return renderHome();
  if(view.name==="lesson") return renderLesson(view.course, view.idx);
  if(view.name==="timeline") return renderTimeline();
  if(view.name==="settings") return renderSettings();
}

async function renderHome(){
  const all = [];
  for(const c of COURSES){ all.push({c, ls: await loadCourse(c)}); }
  let next = null;
  for(const {c,ls} of all){ const i = ls.findIndex(l=>!progress.done[l.id]); if(i>=0){ next = {c, i, l: ls[i]}; break; } }
  const name = progress.name ? ", "+esc(progress.name) : "";
  let h = `<section class="hello"><h1>Welcome back${name}!</h1><p>History lessons that go with your New Testament lessons. Do each one after its matching Bible lesson.</p></section>`;
  if(next){
    h += `<section class="next"><span class="eyebrow">Up next · ${next.c.name} lesson ${next.i+1} · ${esc(next.l.era)}</span><h2>${esc(next.l.title)}</h2><span class="ref">Goes with Bible lesson: ${esc(next.l.bibleTitle)}</span><button id="goNext">Start lesson</button></section>`;
  } else {
    h += `<section class="next"><span class="eyebrow">All caught up</span><h2>You've finished every history lesson that's ready.</h2><span class="ref">More are coming as you move through the New Testament.</span></section>`;
  }
  for(const {c,ls} of all){
    const d = ls.filter(l=>progress.done[l.id]).length;
    const firstOpen = ls.findIndex(l=>!progress.done[l.id]);
    const open = next ? next.c.id===c.id : false;
    h += `<details class="group" ${open?"open":""}><summary><h3 style="display:inline-flex">${c.name} <span class="cnt">${d} of ${ls.length} done</span></h3></summary><div class="bar"><i style="width:${Math.round(d/ls.length*100)}%"></i></div><ol class="path">` + ls.map((l,i)=>{
      const dn = progress.done[l.id];
      const cls = dn ? "done" : (i===firstOpen ? "here" : "");
      return `<li><div class="col"><span class="stone ${cls}">${dn?"✓":i+1}</span></div><button class="lessonbtn" data-c="${c.id}" data-i="${i}"><span class="t">${esc(l.title)}</span><span class="r">${esc(l.era)} · with "${esc(l.bibleTitle)}"</span>${dn?`<span class="sc">Quiz ${dn.score}/${dn.total}</span>`:""}</button></li>`;
    }).join("") + `</ol></details>`;
  }
  h += `<section class="group"><h3>Coming next</h3><div class="soon">${COMING.map(n=>`<span>${n}</span>`).join("")}</div></section>`;
  $app.innerHTML = h;
  document.getElementById("goNext")?.addEventListener("click", ()=>go({name:"lesson", course:next.c.id, idx:next.i}));
  $app.querySelectorAll(".lessonbtn").forEach(b=>b.addEventListener("click", ()=>go({name:"lesson", course:b.dataset.c, idx:+b.dataset.i})));
}

async function renderLesson(cid, idx){
  const c = COURSES.find(x=>x.id===cid); const ls = await loadCourse(c); const l = ls[idx];
  if(!l){ return go({name:"home"}); }
  const done = progress.done[l.id];
  try{ localStorage.setItem("last-lesson-"+APP_KEY, JSON.stringify({id:l.id, title:l.title, book:c.name, n:idx+1, at:Date.now()})); }catch(e){}
  const answers = new Array(l.quiz.length).fill(null);
  let h = `<button class="back" id="back">← All lessons</button>
  <section class="lhead"><span class="eyebrow">${c.name} · History lesson ${idx+1} of ${ls.length}</span><h1>${esc(l.title)}</h1><span class="era">${esc(l.era)}</span></section>
  <div class="pair"><div><span class="lbl">Goes with Bible lesson ${idx+1}</span><span class="pt">${esc(l.bibleTitle)}</span></div><a class="btn ghost" href="${NT_APP}#${l.bible}">${ICON_BOOK}Open Bible lesson</a></div>
  <p class="intro">${esc(l.intro)}</p>

  <section class="card"><span class="kicker">Map</span>
    <div class="mapbox ${l.map.view}">${mapSVG(l.map)}</div>
    <p class="mapcap">${esc(l.map.caption)}</p>
  </section>

  <section class="card"><span class="kicker">Reading</span>
    ${l.sections.map(s=>`<h3>${esc(s.h)}</h3>${s.p.map(p=>`<p>${esc(p)}</p>`).join("")}`).join("")}
    <label class="check"><input type="checkbox" id="readChk" ${done?"checked":""}> I read the whole lesson</label>
  </section>`;
  if(l.hope) h += `<section class="card hope"><span class="kicker">Where God Was at Work</span>${l.hope.map(p=>`<p>${esc(p)}</p>`).join("")}</section>`;
  if(l.people.length) h += `<section class="card"><span class="kicker">Key people</span><div class="people">${l.people.map(p=>`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>`).join("")}</div></section>`;
  h += `<section class="source card"><span class="kicker">Primary source</span><h2>${esc(l.source.title)}</h2><div class="meta">${esc(l.source.who)} · ${esc(l.source.date)}</div><blockquote>${esc(l.source.text)}</blockquote><p class="note">${esc(l.source.note)}</p></section>
  <section class="card"><span class="kicker">Vocabulary</span><dl class="vocab">${l.vocab.map(([t,d])=>`<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl></section>`;
  if(l.timeline.length) h += `<section class="card"><span class="kicker">Adds to your timeline</span><ul class="mini">${l.timeline.map(e=>`<li><span class="yr">${fmtYear(e.y)}</span><span>${esc(e.t)}${e.d?'<span class="disc">Discovery</span>':''}</span></li>`).join("")}</ul></section>`;
  if(l.video.length) h += `<section class="card"><span class="kicker">Watch</span><p>These Drive Thru History episodes cover this part of Jesus' life, filmed on location. They stream free on TBN.</p><div class="btnrow">${l.video.map(([t,u])=>`<a class="btn ghost" href="${u}" target="_blank" rel="noopener">${ICON_PLAY}${esc(t.replace("Drive Thru History: ",""))}</a>`).join("")}</div>${l.videoNote?`<p class="why" style="margin-top:10px"><b>For parents:</b> ${esc(l.videoNote)}</p>`:""}</section>`;
  h += `<section class="card"><span class="kicker">Quiz</span>${l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><div class="qt">${qi+1}. ${esc(q.q)}</div><div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div><div class="why" hidden></div></div>`).join("")}</section>
  <section class="card assign"><span class="kicker">Assignment</span><p>${esc(l.assignment)}</p><label for="asg" class="status">Your notes or written answer (saved with the lesson)</label><textarea id="asg">${esc((done&&done.assignment)||"")}</textarea></section>
  <section class="card finish" id="finish"></section>`;
  $app.innerHTML = h;
  document.getElementById("back").addEventListener("click", ()=>go({name:"home"}));

  $app.querySelectorAll(".q").forEach(qel=>{
    const qi = +qel.dataset.q, q = l.quiz[qi];
    qel.querySelectorAll(".opt").forEach(ob=>ob.addEventListener("click", ()=>{
      const oi = +ob.dataset.o; answers[qi] = oi===q.answer;
      qel.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.o===q.answer) x.classList.add("right"); });
      if(oi!==q.answer) ob.classList.add("wrong");
      const why = qel.querySelector(".why"); why.hidden=false; why.textContent = (oi===q.answer?"Correct! ":"Not quite. ")+q.why;
      drawFinish();
    }));
  });
  document.getElementById("readChk").addEventListener("change", drawFinish);
  document.getElementById("asg").addEventListener("change", e=>{ const cur = progress.done[l.id]; if(cur){ cur.assignment = e.target.value; save(); } });

  function navBtns(){
    const hasNext = idx+1 < ls.length;
    return `<div class="btnrow" style="justify-content:center">${hasNext?`<button class="btn" id="nextBtn">Next lesson →</button>`:""}<button class="btn ghost" id="toTl">See my timeline</button></div>`;
  }
  function bindNav(){
    document.getElementById("nextBtn")?.addEventListener("click", ()=>go({name:"lesson", course:cid, idx:idx+1}));
    document.getElementById("toTl").addEventListener("click", ()=>go({name:"timeline"}));
  }
  function drawFinish(){
    const f = document.getElementById("finish");
    if(f.dataset.celebrated) return;
    const cur = progress.done[l.id];
    if(cur){ f.innerHTML = `<div class="celebrate">${STAR}<h2>Lesson complete</h2><p class="note">Quiz score: ${cur.score}/${cur.total}. You can retake the quiz any time.</p></div>${navBtns()}`; bindNav(); return; }
    const read = document.getElementById("readChk").checked;
    const answered = answers.filter(a=>a!==null).length;
    const ready = read && answered===answers.length;
    f.innerHTML = `<button class="btn" id="doneBtn" ${ready?"":"disabled"}>Finish lesson and earn a star</button><p class="note">${ready?"Great work! Finishing adds this lesson's events to your timeline.":"Check \"I read the whole lesson\" and answer every quiz question to finish."}</p>`;
    document.getElementById("doneBtn").addEventListener("click", ()=>{
      if(!ready) return;
      progress.done[l.id] = {score: answers.filter(Boolean).length, total: answers.length, at: Date.now(), assignment: document.getElementById("asg").value}; try{ window.rhythmReport && rhythmReport('hist3'); }catch(e){}
      save(); updateStars();
      f.dataset.celebrated = "1";
      f.innerHTML = `<div class="celebrate">${STAR}<h2>Well done!</h2><p class="note">You got ${progress.done[l.id].score} of ${answers.length} right, and ${l.timeline.length} event${l.timeline.length===1?"":"s"} joined your timeline.</p></div>${navBtns()}`;
      bindNav();
    });
  }
  drawFinish();
}

  all.sort((a,b)=>a.y-b.y);

function fromHash(){
  const m = /^#([a-z]+-)(\d+)$/.exec(location.hash||"");
  if(m){ const c = COURSES.find(x=>x.prefix===m[1]); const n = +m[2]; if(c && n>=1){ view = {name:"lesson", course:c.id, idx:n-1}; return true; } }
  return false;
}
const APP_KEY = "NTH3";
/* ---------- backup codes & saving safeguards ---------- */
let dbWriteOk = null;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(()=>{}); }catch(e){}
const storageWorks = (()=>{ try{ localStorage.setItem("__t","1"); const ok = localStorage.getItem("__t")==="1"; localStorage.removeItem("__t"); return ok; }catch(e){ return false; } })();
function b64u(bytes){ let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function encodeProgress(){
  const json = JSON.stringify({v:1, app:APP_KEY, p:progress});
  try{
    const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return APP_KEY+".Z"+b64u(new Uint8Array(buf));
  }catch(e){ return APP_KEY+".J"+b64u(new TextEncoder().encode(json)); }
}
async function decodeProgress(code){
  code = (code||"").replace(/\s+/g,"");
  const dot = code.indexOf(".");
  if(dot<0) throw new Error("format");
  const app = code.slice(0,dot), kind = code[dot+1], data = unb64u(code.slice(dot+2));
  if(app!==APP_KEY) throw new Error("app");
  let json;
  if(kind==="Z") json = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  else if(kind==="J") json = new TextDecoder().decode(data);
  else throw new Error("format");
  const obj = JSON.parse(json);
  if(!obj || !obj.p || typeof obj.p.done!=="object") throw new Error("format");
  return obj.p;
}
function mergeIn(p){
  let added = 0;
  for(const [k,v] of Object.entries(p.done||{})){
    const cur = progress.done[k];
    if(!cur || (v.at||0) > (cur.at||0)){ if(!cur) added++; progress.done[k] = v; }
  }
  if(!progress.name && p.name) progress.name = p.name;
  return added;
}
function addBackupUI(){
  const sec = document.createElement("section");
  sec.className = "card settings";
  sec.innerHTML = `<h2>Backup code</h2>
    <p class="status" style="font-size:15px">A backup code holds all your stars, quiz scores, and written answers. Make a new one after each lesson (or at least once a week) and keep it somewhere safe, like a note or an email to a parent. If your progress ever disappears, or you switch devices, paste it below to get everything back.</p>
    <div class="btnrow"><button class="btn" id="mkCode">Make backup code</button><button class="btn ghost" id="cpCode" hidden>Copy code</button><span class="status" id="mkStatus"></span></div>
    <textarea id="codeOut" readonly hidden style="min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all"></textarea>
    <label for="codeIn" style="margin-top:8px">Restore from a backup code</label>
    <textarea id="codeIn" placeholder="Paste a backup code here" style="min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
    <div class="btnrow"><button class="btn ghost" id="rsCode">Restore progress</button><span class="status" id="rsStatus"></span></div>`;
  $app.appendChild(sec);
  const out = sec.querySelector("#codeOut"), cp = sec.querySelector("#cpCode");
  sec.querySelector("#mkCode").addEventListener("click", async ()=>{
    out.value = await encodeProgress(); out.hidden = false; cp.hidden = false; try{ localStorage.setItem("last-backup-NTH3", String(Date.now())); }catch(e){}
    sec.querySelector("#mkStatus").textContent = Object.keys(progress.done).length+" lessons included";
  });
  cp.addEventListener("click", ()=>{
    const done = ()=>{ sec.querySelector("#mkStatus").textContent = "Copied"; };
    try{ navigator.clipboard.writeText(out.value).then(done).catch(()=>{ out.select(); sec.querySelector("#mkStatus").textContent = "Selected. Press copy on your keyboard."; }); }
    catch(e){ out.select(); }
  });
  sec.querySelector("#rsCode").addEventListener("click", async ()=>{
    const st = sec.querySelector("#rsStatus");
    try{
      const p = await decodeProgress(sec.querySelector("#codeIn").value);
      const added = mergeIn(p); save(); updateStars();
      st.textContent = "Restored. "+added+" new lesson"+(added===1?"":"s")+" added.";
    }catch(e){
      st.textContent = e.message==="app" ? "That code is from a different app. Each app has its own code." : "That code didn't work. Check that you copied the whole thing.";
    }
  });
}
function addBanner(){
  const n = Object.keys(progress.done).length;
  let last = 0; try{ last = +localStorage.getItem("last-backup-NTH3")||0; }catch(e){}
  if(storageWorks && (n===0 || Date.now()-last < 7*864e5)) return;
  const div = document.createElement("div");
  div.className = "card";
  div.style.cssText = "background:var(--gold-soft);border-color:transparent;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap";
  div.innerHTML = `<span style="flex:1;min-width:220px">${storageWorks ? "It's been a while since your last backup." : "This browser isn't able to save your progress. Try opening the app from Safari or its home-screen icon."} Make a backup code in Settings so you never lose your work.</span><button class="btn ghost" id="bnSet">Go to Settings</button>`;
  $app.prepend(div);
  div.querySelector("#bnSet").addEventListener("click", ()=>go({name:"settings"}));
}

<script>
(function(){
  if(!("speechSynthesis" in window)) return;
  var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  var current=null;
  function stop(){ try{ speechSynthesis.cancel(); }catch(e){} if(current){ current.setAttribute("aria-pressed","false"); current.lastChild.textContent="Read to me"; current=null; } }
  function textOf(card){
    var c=card.cloneNode(true);
    c.querySelectorAll(".readbtn,textarea,input,select,label,svg,.mapbox,.btnrow,.why[hidden],.finish,script,style,.n").forEach(function(x){x.remove();});
    c.querySelectorAll(".opt").forEach(function(o){ o.textContent=" "+o.textContent+". "; });
    c.querySelectorAll("p,h1,h2,h3,dt,dd,li,blockquote,div").forEach(function(x){ x.insertAdjacentText("beforeend",". "); });
    return c.textContent.replace(/\s+/g," ").replace(/(\.\s*){2,}/g,". ").trim();
  }
  try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){ speechSynthesis.getVoices(); }; }catch(e){}
  function speak(btn,card){
    if(current===btn){ stop(); return; }
    stop();
    var u=new SpeechSynthesisUtterance(textOf(card));
    u.rate=0.9;
    var all=speechSynthesis.getVoices();
    var vs=all.filter(function(v){return /^en(-|_)/i.test(v.lang);});
    var pick=vs.find(function(v){return /joelle/i.test(v.name) && /premium|enhanced/i.test(v.name+v.voiceURI);})||vs.find(function(v){return /joelle/i.test(v.name);})||vs.find(function(v){return v.default;})||vs.find(function(v){return /samantha|google us english|aria|jenny/i.test(v.name);})||vs[0];
    if(pick){ u.voice=pick; u.lang=pick.lang; }
    u.onend=u.onerror=function(){ if(current===btn) stop(); };
    current=btn; btn.setAttribute("aria-pressed","true"); btn.lastChild.textContent="Stop";
    speechSynthesis.speak(u);
  }
  function add(){
    var app=document.getElementById("app"); if(!app) return;
    app.querySelectorAll(".card, .intro").forEach(function(card){
      if(card.classList.contains("finish")||card.classList.contains("settings")||card.querySelector(".readbtn")) return;
      if(card.closest(".settings")) return;
      if(textOf(card).length<40) return;
      var b=document.createElement("button");
      b.type="button"; b.className="readbtn"; b.setAttribute("aria-pressed","false");
      b.innerHTML=ICON+"<span>Read to me</span>";
      b.addEventListener("click",function(e){ e.preventDefault(); speak(b,card); });
      card.insertBefore(b,card.firstChild);
    });
  }
  var app=document.getElementById("app");
  if(app){ new MutationObserver(function(m){ var real=m.some(function(r){return [].some.call(r.addedNodes,function(n){return !(n.classList&&n.classList.contains("readbtn"));});}); if(real){ stop(); add(); } }).observe(app,{childList:true}); }
  window.addEventListener("pagehide",stop);
  add();
})();
</script>
